, "explain": "中国共产党早期组织领导的第一个工会是上海机器工会，选A。B长辛店工人俱乐部、C武汉工会、D长沙工会均成立在其后，不是第一个。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 16, "question": "代表上海中国共产党的早期组织的机关理论刊物是（ ）。", "options": [{"label": "A", "text": "《共产党》"}, {"label": "B", "text": "《劳动音》"}, {"label": "C", "text": "《劳动界》"}, {"label": "D", "text": "《新青年》"}], "answer": "D", "explain": "代表上海共产党早期组织的机关理论刊物是《新青年》，选D。A《共产党》是建党理论刊物，B《劳动音》、C《劳动界》是面向工人的通俗刊物。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 17, "question": "1920年8月，《共产党宣言》中文全译本在上海公开出版，翻译者是（ ）。", "options": [{"label": "A", "text": "陈独秀"}, {"label": "B", "text": "陈望道"}, {"label": "C", "text": "李大钊"}, {"label": "D", "text": "梁启超"}], "answer": "B", "explain": "1920年8月《共产党宣言》中文全译本由陈望道翻译，选B。A陈独秀、C李大钊、D梁启超都没有翻译过《共产党宣言》全译本。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 18, "question": "（ ）不是中共一大代表。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "李大钊"}, {"label": "C", "text": "王尽美"}, {"label": "D", "text": "董必武"}], "answer": "B", "explain": "李大钊不是中共一大代表，选B。A毛泽东、C王尽美、D董必武都是出席一大的正式代表，而李大钊当时在北京大学事务繁忙，并未出席大会。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 19, "question": "中国共产党第一次全国代表大会选举产生了以（ ）为书记的中央局。", "options": [{"label": "A", "text": "陈独秀"}, {"label": "B", "text": "李达"}, {"label": "C", "text": "毛泽东"}, {"label": "D", "text": "李大钊"}], "answer": "A", "explain": "中共一大选举产生了以陈独秀为书记的中央局，选A。B李达被选为宣传主任，C毛泽东、D李大钊当时都没有担任中央局书记的职务。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 20, "question": "中国共产成立的历史特点，不包括（ ）。", "options": [{"label": "A", "text": "一开始就是个以马克思列宁主义理论为基础的党"}, {"label": "B", "text": "党的阶级基础工人阶级具有坚定的革命性"}, {"label": "C", "text": "党内出身于小资产阶级的党员占有相当大的数量"}, {"label": "D", "text": "成立时就提出反帝反封建的民主革命的纲领"}], "answer": "D", "explain": "中共成立时尚未提出反帝反封建的民主革命纲领，该纲领是中共二大提出，故D是不属于其成立历史特点的选项。A、B、C都是建党初期的历史特点。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 21, "question": "（ ）第一次提出反帝反封建的民主革命纲领。", "options": [{"label": "A", "text": "中共一大"}, {"label": "B", "text": "中共二大"}, {"label": "C", "text": "中共三大"}, {"label": "D", "text": "国民党一大"}], "answer": "B", "explain": "第一次提出反帝反封建民主革命纲领的是中共二大，选B。A中共一大、C中共三大、D国民党一大都没有最先提出这一革命纲领。它首次完整提出最低纲领和最高纲领。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 22, "question": "中共二大提出的党的最高纲领是（ ）。", "options": [{"label": "A", "text": "消除内乱、打倒军阀"}, {"label": "B", "text": "统一中国为真正的民主共和国"}, {"label": "C", "text": "实现社会主义、共产主义"}, {"label": "D", "text": "建设革命统一战线"}], "answer": "C", "explain": "中共二大提出的最高纲领是实现社会主义、共产主义，选C。A消除内乱打倒军阀、B统一为民主共和国是民主革命纲领，D建设统一战线不是纲领内容。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 23, "question": "从香港海员罢工到（ ），掀起中国工人运动的第一个高潮。", "options": [{"label": "A", "text": "开滦五矿工人罢工"}, {"label": "B", "text": "安源路矿工人罢工"}, {"label": "C", "text": "广州沙面工人罢工"}, {"label": "D", "text": "京汉铁路工人罢工"}], "answer": "D", "explain": "从香港海员罢工到京汉铁路工人罢工掀起中国工人运动的第一个高潮，选D。A开滦五矿、B安源路矿、C广州沙面罢工都在高潮之中，但不是高潮的终点。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 24, "question": "1921年9月，中国共产党领导创建第一个农民协会的地点在（ ）。", "options": [{"label": "A", "text": "广东海丰县"}, {"label": "B", "text": "广东陆丰县"}, {"label": "C", "text": "浙江萧山县"}, {"label": "D", "text": "湖南衡山县"}], "answer": "C", "explain": "1921年9月党领导创建的第一个农民协会在浙江萧山县衙前村，选C。A海丰、B陆丰的农会是彭湃后来领导的，D湖南衡山的农会则更晚。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 25, "question": "中共三大正式决定（ ）。", "options": [{"label": "A", "text": "不准与其他党派建立任何联系"}, {"label": "B", "text": "联合全国一切革命党派，联合资产阶级民主派"}, {"label": "C", "text": "共产党员以个人身份加入国民党，以实现国共合作"}, {"label": "D", "text": "中国共产党集体加入中国国民党"}], "answer": "C", "explain": "中共三大正式决定共产党员以个人身份加入国民党以实现国共合作，选C。A不准联系、B联合一切党派、D集体加入国民党都不符合三大决议。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 26, "question": "标志着第一次国共合作正式形成的事件是（ ）。", "options": [{"label": "A", "text": "中共二大的召开"}, {"label": "B", "text": "中共三大的召开"}, {"label": "C", "text": "国民党一大的召开"}, {"label": "D", "text": "国民党二大的召开"}], "answer": "C", "explain": "标志着第一次国共合作正式形成的是一大召开的国民党一大，选C。A中共二大、B中共三大只是作出合作决策，D国民党二大在合作之后召开。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 27, "question": "1925年5月，以（ ）为起点，掀起了全国范围的大革命高潮。", "options": [{"label": "A", "text": "国民党一大召开"}, {"label": "B", "text": "五卅运动"}, {"label": "C", "text": "省港大罢工"}, {"label": "D", "text": "北伐战争"}], "answer": "B", "explain": "1925年5月以五卅运动为起点掀起全国范围的大革命高潮，选B。A国民党一大是合作形成标志，C省港大罢工在其后，D北伐战争是高潮推进的结果。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 28, "question": "大革命从高潮走向失败的转折点是（ ）。", "options": [{"label": "A", "text": "四一二政变"}, {"label": "B", "text": "七一五政变"}, {"label": "C", "text": "整理党务案"}, {"label": "D", "text": "中山舰事件"}], "answer": "A", "explain": "四一二政变是大革命从高潮走向失败的转折点，选A。B七一五政变是最终失败标志，C整理党务案、D中山舰事件是反共的前奏事件。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 29, "question": "国共合作全面破裂，大革命最终失败的标志是（ ）。", "options": [{"label": "A", "text": "四一二政变"}, {"label": "B", "text": "七一五政变"}, {"label": "C", "text": "整理党务案"}, {"label": "D", "text": "中山舰事件"}], "answer": "B", "explain": "国共合作全面破裂、大革命最终失败的标志是七一五政变，选B。A四一二政变是转折点，C整理党务案、D中山舰事件是较早的反共事件。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 30, "question": "大革命给中国共产党的最深刻的经验教训是必须（ ）。", "options": [{"label": "A", "text": "警惕统一战线内部的野心家"}, {"label": "B", "text": "和农民结成巩固的工农联盟"}, {"label": "C", "text": "提出能团结多数的革命口号"}, {"label": "D", "text": "无产阶级必须掌握革命领导权和革命武装"}], "answer": "D", "explain": "大革命最深刻的经验教训是无产阶级必须掌握革命领导权和革命武装，选D。A警惕野心家、B结工农联盟、C提革命口号都不是最根本的教训。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 1, "question": "新文化运动的主要阵地是（ ）。", "options": [{"label": "A", "text": "《新民丛报》"}, {"label": "B", "text": "《新青年》"}, {"label": "C", "text": "北京大学"}, {"label": "D", "text": "《东方杂志》"}], "answer": "BC", "explain": "新文化运动的主要阵地是《新青年》和北京大学，故BC正确。A《新民丛报》是革命派论战刊物，D《东方杂志》是一般性刊物，均非新文化运动主要阵地。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 2, "question": "新文化运动的基本口号是（ ）。", "options": [{"label": "A", "text": "民主"}, {"label": "B", "text": "自由"}, {"label": "C", "text": "科学"}, {"label": "D", "text": "平等"}], "answer": "AC", "explain": "新文化运动的基本口号是民主与科学，即德先生民主和赛先生科学，故AC正确。B自由、D平等虽然也被主张，但并非其核心口号。二者被陈独秀概括为德赛两先生。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 3, "question": "五四运动以前的新文化运动的局限性在于（ ）", "options": [{"label": "A", "text": "批判孔学是为了给中国发展资本主义扫清障碍"}, {"label": "B", "text": "把改造国民性置于优先地位"}, {"label": "C", "text": "许多领导人物还没有马克思主义的批判精神"}, {"label": "D", "text": "提倡发展共产主义社会"}], "answer": "ABC", "explain": "五四前新文化运动局限在于批判孔学是为发展资本主义扫清障碍、把改造国民性置于优先、缺乏马克思主义批判精神，故ABC正确。D提倡共产主义是五四后马克思主义者的主张，非此时局限。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 4, "question": "十月革命对中国先进分子的影响主要有（ ）。", "options": [{"label": "A", "text": "对中国先进分子具有特殊的吸引力"}, {"label": "B", "text": "有力推动社会主义思想在中国传播"}, {"label": "C", "text": "给与中国先进分子新的革命方法的启示"}, {"label": "D", "text": "推动中国先进分子研究这个革命所遵循的主义"}], "answer": "ABCD", "explain": "十月革命对中国先进分子的影响是多方面的，既具特殊吸引力、有力推动社会主义思想传播，又给新革命方法的启示并推动研究其主义，故ABCD均正确。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 5, "question": "从1918年起，李大钊先后发表（ ）等文章，热情讴歌十月革命的胜利。", "options": [{"label": "A", "text": "《法俄革命之比较观》"}, {"label": "B", "text": "《庶民的胜利》"}, {"label": "C", "text": "《Bolshevism的胜利》"}, {"label": "D", "text": "《我的马克思主义观》"}], "answer": "ABC", "explain": "李大钊讴歌十月革命的文章有《法俄革命之比较观》《庶民的胜利》《Bolshevism的胜利》，故ABC正确。D《我的马克思主义观》是系统介绍马克思主义的文章。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 6, "question": "五四运动发生的时代条件和社会历史条件是（ ）。", "options": [{"label": "A", "text": "马克思主义在中国得到广泛传播"}, {"label": "B", "text": "新的社会力量的成长、壮大"}, {"label": "C", "text": "新文化运动掀起的思想解放的潮流"}, {"label": "D", "text": "俄国十月革命对中国的影响"}], "answer": "BCD", "explain": "五四运动的时代条件是新的社会力量成长壮大、新文化运动思想解放和俄国十月革命影响，故BCD正确。A马克思主义广泛传播是五四之后才发生的。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 7, "question": "五四运动的历史特点包括（ ）。", "options": [{"label": "A", "text": "一场反帝反封建的爱国运动"}, {"label": "B", "text": "一场伟大的社会革命运动"}, {"label": "C", "text": "一场思想启蒙运动和新文化运动"}, {"label": "D", "text": "一场带有破坏性质的游行示威运动"}], "answer": "ABC", "explain": "五四运动是反帝反封建爱国运动、社会革命运动和思想启蒙新文化运动，故ABC正确。D带有破坏性质是对五四运动的贬义描述，不正确。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 8, "question": "五四运动的意义主要表现在（ ）", "options": [{"label": "A", "text": "中国旧民主义革命走向新民主主义革命的转折点"}, {"label": "B", "text": "高举起爱国主义的伟大旗帜"}, {"label": "C", "text": "激发追求真理、追求进步的伟大觉醒"}, {"label": "D", "text": "培育永久奋斗的伟大传统"}], "answer": "ABCD", "explain": "五四运动的意义是新旧民主革命的转折点，高举爱国主义旗帜，激发追求真理进步的觉醒，并培育永久奋斗的传统，故ABCD均正确。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 9, "question": "五四运动以后，中国早期信仰马克思主义的人物，主要包括（ ）。", "options": [{"label": "A", "text": "五四爱国运动的左翼骨干"}, {"label": "B", "text": "五四以前的新文化运动的精神领袖"}, {"label": "C", "text": "原中国同盟会会员、辛亥革命时期的活动家"}, {"label": "D", "text": "工人群众中的活跃分子"}], "answer": "ABC", "explain": "五四后早期信仰马克思主义的人物包括五四左翼骨干、新文化精神领袖和原同盟会活动家，故ABC正确。D工人群众中的活跃分子是工人运动骨干，不属于早期思想界信仰人物主体。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 10, "question": "早期马克思主义思想运动的特点，主要包括（ ）。", "options": [{"label": "A", "text": "注意从中国的实际出发，学习、运用马克思主义理论"}, {"label": "B", "text": "重视对马克思主义基本理论的学习"}, {"label": "C", "text": "提出知识分子应当同劳动群众相结合的思想"}, {"label": "D", "text": "明确提出马克思主义与中国实际相结合的命题"}], "answer": "ABC", "explain": "早期马克思主义思想运动注重从实际出发、重视理论学习、提出知识分子同劳动群众结合，故ABC正确。D明确提出马克思主义与中国实际相结合是后来才正式提出的命题。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 11, "question": "1920年春，在中国最早酝酿筹建中国共产党的是（ ）。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "陈独秀"}, {"label": "C", "text": "周恩来"}, {"label": "D", "text": "李大钊"}], "answer": "BD", "explain": "1920年春最早酝酿筹建中国共产党的是陈独秀和李大钊，故BD正确，史称南陈北李相约建党。A毛泽东、C周恩来此时尚未成为主要酝酿者。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 12, "question": "各地中国共产党早期组织成立以后，主要进行的工作有（ ）。", "options": [{"label": "A", "text": "研究和宣传马克思主义，研究中国实际问题"}, {"label": "B", "text": "到工人中去进行宣传和组织工作"}, {"label": "C", "text": "进行关于建党问题的讨论和实际组织工作"}, {"label": "D", "text": "组织工人运动和农民运动"}], "answer": "ABC", "explain": "各地早期组织主要从事研究和宣传马克思主义、组织工人、讨论建党等工作，故ABC正确。D组织农民运动并非各地早期组织的主要工作。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 13, "question": "关于中共一大的表述，正确的是（ ）。", "options": [{"label": "A", "text": "大会确定党的名称为“中国共产党”"}, {"label": "B", "text": "大会通过了中国共产党第一个纲领"}, {"label": "C", "text": "大会宣告中国共产党正式成立"}, {"label": "D", "text": "大会提出反帝反封建的民主革命纲领"}], "answer": "ABC", "explain": "中共一大确定党的名称为中国共产党，通过了第一个纲领并宣告党正式成立，故ABC正确。D反帝反封建的民主革命纲领是中共二大才提出的。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 14, "question": "中国共产党成立的历史意义有（ ）", "options": [{"label": "A", "text": "从根本上改变了没有先进的坚强的政党作为凝聚力量的领导核心的局面"}, {"label": "B", "text": "深刻改变了近代以后中华民族发展的方向和进程"}, {"label": "C", "text": "深刻改变了中国人民和中华民族的前途和命运"}, {"label": "D", "text": "深刻改变了世界发展的趋势和格局"}], "answer": "ABCD", "explain": "中国共产党的成立从根本上改变了缺乏先进坚强政党的局面，深刻改变了中华民族发展方向和进程，改变了中国人民和民族前途命运，也深刻改变世界发展趋势和格局，故ABCD均正确。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 15, "question": "中共二大制定的民主革命纲领包括（ ）。", "options": [{"label": "A", "text": "推翻国际帝国主义压迫"}, {"label": "B", "text": "统一中国为真正的民主共和国"}, {"label": "C", "text": "打倒军阀"}, {"label": "D", "text": "实现社会主义、共产主义"}], "answer": "ABC", "explain": "中共二大民主革命纲领包括推翻国际帝国主义压迫、打倒军阀、统一为民主共和国，故ABC正确。D实现社会主义共产主义是党的最高纲领。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 16, "question": "标志着中国工人运动第一个高潮的到来和结束的是（ ）", "options": [{"label": "A", "text": "香港海员罢工"}, {"label": "B", "text": "安源路矿工人罢工"}, {"label": "C", "text": "京汉铁路工人罢工"}, {"label": "D", "text": "开滦五矿工人罢工"}], "answer": "AC", "explain": "第一个工人运动高潮以香港海员罢工到来、以京汉铁路工人罢工结束，故AC正确。B安源、D开滦罢工都在高潮之内，但不是起止的标志。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 17, "question": "1924年1月，中国国民党第一次全国代表大会确立的三大政策是（ ）。", "options": [{"label": "A", "text": "联俄"}, {"label": "B", "text": "联共"}, {"label": "C", "text": "扶助农工"}, {"label": "D", "text": "平均地权"}], "answer": "ABC", "explain": "国民党一大确立的三大政策是联俄、联共、扶助农工，故ABC正确。D平均地权属于民生主义的重要内容，并不在三大政策的范畴之内。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 18, "question": "1925至1927年的大革命，规模宏伟，内涵丰富。与辛亥革命相比较，其不同点在于（ ）。", "options": [{"label": "A", "text": "它的主要斗争形式是武装斗争"}, {"label": "B", "text": "它广泛而深刻地发动了工农群众"}, {"label": "C", "text": "它的革命对象是帝国主义和封建军阀"}, {"label": "D", "text": "它是在以国共合作为基础的统一战线的组织形式下进行的"}], "answer": "BCD", "explain": "大革命广泛发动工农、以帝国主义封建军阀为对象并以国共合作为形式，故BCD正确。A武装斗争是辛亥革命也有的形式，不是二者的不同点。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 19, "question": "大革命时期，蒋介石制造的反共事件包括（ ）。", "options": [{"label": "A", "text": "四一二政变"}, {"label": "B", "text": "七一五政变"}, {"label": "C", "text": "整理党务案"}, {"label": "D", "text": "中山舰事件"}], "answer": "ACD", "explain": "大革命时期蒋介石制造的反共事件包括四一二政变、整理党务案、中山舰事件，故ACD正确。B七一五政变是汪精卫在武汉发动的反共事变。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "multi", "id": 20, "question": "大革命失败的教训有（ ）。", "options": [{"label": "A", "text": "需要将马克思主义基本原理同中国革命的具体实际紧密结合"}, {"label": "B", "text": "在革命统一战线中，要始终保持自身的独立性，争取革命领导权"}, {"label": "C", "text": "必须加强自身建设，加强党的民主集中制"}, {"label": "D", "text": "必须建立和掌握革命的武装"}], "answer": "ABCD", "explain": "大革命的教训是要将马克思主义基本原理同中国革命实际紧密结合，保持统一战线中党的独立性争取领导权，加强党的建设，并建立掌握革命武装，故ABCD均正确。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 1, "question": "新文化运动既是一场思想启蒙运动，也是一场思想解放运动。", "answer": true, "explain": "该判断正确。新文化运动既是一场反对封建主义的启蒙运动，也是一场深刻的思想解放运动，为马克思主义在中国的传播准备了思想条件。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 2, "question": "十月革命一声炮响给中国送来了马克思主义，指的是十月革命爆发后，马克思主义立刻在中国得到广泛传播。", "answer": false, "explain": "该判断错误。十月革命给中国送来了马克思主义的前声，但马克思主义是在五四运动之后才在中国广泛传播，并非十月革命后立即传播。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 3, "question": "五四运动的直接导火线，是巴黎和会上中国外交的失败。", "answer": true, "explain": "该判断正确。1919年五四运动的直接导火线是巴黎和会上中国外交的失败，即和会决定将德国在山东的侵略权益转让给日本。这一外交失败激起全国人民愤怒。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 4, "question": "中国早期马克思主义者初步形成马克思主义应当与中国具体实际相结合的思想。", "answer": true, "explain": "该判断正确。中国早期马克思主义者已初步形成了马克思主义应当与中国具体实际相结合的思想，注重从中国实际出发来灵活运用。这为后来党的思想路线开辟了先河。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 5, "question": "李大钊在北京创办的共产党早期组织是中国共产党的发起组织。", "answer": false, "explain": "该判断错误。中国共产党的发起组织是陈独秀在上海成立的共产党早期组织，而不是李大钊在北京创办的那个早期组织。史称南陈北李相约建党，以上海为中心。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 6, "question": "中国共产党第一次全国代表大会第一次提出了反帝反封建的民主革命的纲领。", "answer": false, "explain": "该判断错误。反帝反封建的民主革命纲领是中共二大第一次提出的，中共一大只确定了党的名称和第一个纲领，并未提出这一纲领。因此本题把一大二大混淆了。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 7, "question": "中国共产党成立前的斗争之所以成效甚少，一个重要原因是缺乏革命政党领导。", "answer": false, "explain": "该判断错误。中国共产党成立之前各种斗争的成效甚少，其中一个重要原因恰恰是缺乏一个坚强的革命政党的正确领导。没有党的领导，斗争自然难有成效。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 8, "question": "1922年彭湃在海丰领导建立了第一个农民协会。", "answer": false, "explain": "该判断错误。1921年9月在浙江萧山建立的才是党的第一个农民协会，彭湃1922年在海丰建立的是另一重要农民协会，并非第一个。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 9, "question": "新三民主义就是联俄、联共、扶助农工。", "answer": false, "explain": "该判断错误。联俄、联共、扶助农工是国民党一大确立的三大政策，而非新三民主义的全部内容，新三民主义还包括对民族民权民生的重新阐释。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "tf", "id": 10, "question": "大革命失败的直接原因是中国共产党的中央领导机关放弃了对革命的领导权。", "answer": false, "explain": "该判断错误。大革命失败的直接原因是客观上方敌人力量强大、主观上陈独秀右倾机会主义放弃领导权等多方面，不能单归因于中央放弃领导权。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 1, "question": "大革命失败后，（ ）和武汉两个国民政府达成妥协，实现宁汉合流。", "options": [{"label": "A", "text": "广州"}, {"label": "B", "text": "重庆"}, {"label": "C", "text": "南京"}, {"label": "D", "text": "北平"}], "answer": "C", "explain": "宁汉合流是指南京和武汉两个国民政府达成妥协而实现统一，选C。A广州、B重庆、D北平都不是参与这次合流的国民政府所在地。合流后宁汉双方在形式上统一起来。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 2, "question": "1928年12月，（ ）宣布东北三省“遵守三民主义，服从国民政府，改易旗帜”。", "options": [{"label": "A", "text": "冯玉祥"}, {"label": "B", "text": "李宗仁"}, {"label": "C", "text": "阎锡山"}, {"label": "D", "text": "张学良"}], "answer": "D", "explain": "1928年12月宣布东北改易旗帜、服从国民政府的是张学良，选D。A冯玉祥、B李宗仁、C阎锡山都是其他派系军阀，与东北易帜无关。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 3, "question": "标志着国民党在全国范围内建立统治的事件是（ ）。", "options": [{"label": "A", "text": "东北易帜"}, {"label": "B", "text": "宁汉合流"}, {"label": "C", "text": "南京国民政府的成立"}, {"label": "D", "text": "七一五政变"}], "answer": "A", "explain": "标志着国民党在全国范围内建立统治的是1928年底的东北易帜，选A。B宁汉合流、C南京国民政府成立都发生在此前，D七一五政变是国共分裂。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 4, "question": "大革命失败后，国民党代表（ ）和买办性的大资产阶级的利益。", "options": [{"label": "A", "text": "民族资产阶级"}, {"label": "B", "text": "地主阶级"}, {"label": "C", "text": "城市小资产阶级"}, {"label": "D", "text": "工人阶级"}], "answer": "B", "explain": "大革命失败后国民党代表地主阶级和买办性大资产阶级的利益，选B。A民族资产阶级、C小资产阶级、D工人阶级都不是它所代表的阶级。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 5, "question": "国民党实行一党专政和（ ）。", "options": [{"label": "A", "text": "经济优先战略"}, {"label": "B", "text": "科教兴国战略"}, {"label": "C", "text": "白色恐怖统治"}, {"label": "D", "text": "军事独裁统治"}], "answer": "D", "explain": "国民党实行的是一党专政和军事独裁统治，选D。A经济优先战略、B科教兴国战略、C白色恐怖统治都不是对其统治形式的准确概括。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 6, "question": "1927年8月，中共在汉口秘密召开的紧急会议是（ ）。", "options": [{"label": "A", "text": "八七会议"}, {"label": "B", "text": "古田会议"}, {"label": "C", "text": "遵义会议"}, {"label": "D", "text": "洛川会议"}], "answer": "A", "explain": "1927年8月中共在汉口秘密召开的紧急会议是八七会议，选A。B古田会议在1929年，C遵义会议在1935年，D洛川会议在1937年。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 7, "question": "中共八七会议在大革命失败的危急关头确定的方针是（ ）。", "options": [{"label": "A", "text": "推翻北洋军阀黑暗统治"}, {"label": "B", "text": "开辟农村革命根据地"}, {"label": "C", "text": "土地革命和武装起义"}, {"label": "D", "text": "建立工农民主统一战线"}], "answer": "C", "explain": "八七会议在大革命失败危急关头确定的方针是土地革命和武装起义，选C。A推翻北洋军阀、B开辟农村根据地、D建立工农民主统一战线均不是其方针。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 8, "question": "毛泽东在八七会议上提出的著名论断是（ ）。", "options": [{"label": "A", "text": "须知政权是由枪杆子中取得的"}, {"label": "B", "text": "没有调查就没有发言权"}, {"label": "C", "text": "兵民是胜利之本"}, {"label": "D", "text": "一切反动派都是纸老虎"}], "answer": "A", "explain": "毛泽东在八七会议上提出的著名论断是须知政权是由枪杆子中取得的，选A。B没有调查没有发言权出自《反对本本主义》，C兵民是胜利之本、D一切反动派都是纸老虎均为后来的论断。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 9, "question": "1927年南昌起义的最大意义在于（ ）。", "options": [{"label": "A", "text": "中共开始有了革命根据地"}, {"label": "B", "text": "建立了第一个苏维埃政权"}, {"label": "C", "text": "打响了武装反抗国民党反动派的第一枪"}, {"label": "D", "text": "确立了党对军队的绝对领导"}], "answer": "C", "explain": "1927年南昌起义的最大意义是打响了武装反抗国民党反动派的第一枪，选C。A根据地的建立、B第一个苏维埃政权、D党对军队的绝对领导都不是其最大意义。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 11, "question": "1927年9月9日，毛泽东等领导发动了（ ）。", "options": [{"label": "A", "text": "湘赣边界秋收起义"}, {"label": "B", "text": "海陆丰秋收起义"}, {"label": "C", "text": "湘鄂西武装起义"}, {"label": "D", "text": "鄂豫边界武装起义"}], "answer": "A", "explain": "1927年9月9日毛泽东等领导发动的是湘赣边界秋收起义，选A。B海陆丰秋收起义、C湘鄂西武装起义、D鄂豫边界起义都不是毛泽东领导的。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 12, "question": "大革命失败后，（ ）公开打出“工农革命军”的旗帜。", "options": [{"label": "A", "text": "南昌起义"}, {"label": "B", "text": "秋收起义"}, {"label": "C", "text": "广州起义"}, {"label": "D", "text": "百色起义"}], "answer": "B", "explain": "大革命失败后公开打出工农革命军旗帜的是秋收起义，选B。A南昌起义仍沿用国民革命军旗号，C广州起义、D百色起义都发生在其后。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 13, "question": "（ ）是建设无产阶级领导的新型人民军队的重要开端。", "options": [{"label": "A", "text": "八七会议"}, {"label": "B", "text": "三湾改编"}, {"label": "C", "text": "古田会议"}, {"label": "D", "text": "遵义会议"}], "answer": "B", "explain": "三湾改编是建设无产阶级领导的新型人民军队的重要开端，选B。A八七会议确定了武装方针，C古田会议、D遵义会议都不是这一开端。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 14, "question": "1927年10月，毛泽东率领秋收起义部队开辟的农村革命根据地是（ ）。", "options": [{"label": "A", "text": "井冈山革命根据地"}, {"label": "B", "text": "湘鄂西革命根据地"}, {"label": "C", "text": "闽浙赣革命根据地"}, {"label": "D", "text": "左右江革命根据地"}], "answer": "A", "explain": "1927年10月毛泽东率秋收起义部队开辟的是井冈山革命根据地，选A。B湘鄂西、C闽浙赣、D左右江根据地都不是毛泽东开辟的。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 15, "question": "大革命失败后，集中体现中国革命正确方向的是（ ）。", "options": [{"label": "A", "text": "新型人民军队的建设"}, {"label": "B", "text": "井冈山革命根据地的斗争"}, {"label": "C", "text": "国民革命联合战线的形成"}, {"label": "D", "text": "反帝反封建民主革命纲领的提出"}], "answer": "B", "explain": "大革命失败后集中体现中国革命正确方向的是井冈山革命根据地的斗争，选B。A新型人民军队建设、C国民革命联合战线、D反帝反封建纲领都没有集中体现正确方向。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 16, "question": "1927年大革命失败后，党的工作重心开始转向农村，在农村建立革命根据地。农村革命根据地能够在中国长期存在和发展的根本原因是（ ）。", "options": [{"label": "A", "text": "良好的群众基础和革命形势的继续向前发展"}, {"label": "B", "text": "中国是一个政治、经济、文化发展极不平衡的半殖民地半封建的大国"}, {"label": "C", "text": "相当力量正式红军的存在"}, {"label": "D", "text": "党的领导及其正确的政策"}], "answer": "B", "explain": "农村革命根据地能长期存在发展的根本原因是中国是政治经济发展极不平衡的大国，选B。A群众基础、C红军存在、D党的领导都是重要条件，但不是根本原因。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 17, "question": "农村包围城市、武装夺取政权这条革命新道路的开辟，是中国共产党集体智慧的结晶，而其中杰出的代表是（ ）。", "options": [{"label": "A", "text": "陈独秀"}, {"label": "B", "text": "王明"}, {"label": "C", "text": "毛泽东"}, {"label": "D", "text": "博古"}], "answer": "C", "explain": "开辟农村包围城市、武装夺取政权新道路的杰出代表是毛泽东，选C。A陈独秀是右倾代表，B王明、D博古都是左倾教条主义的代表。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 18, "question": "毛泽东在《反对本本主义》一文中提出的著名论断是（ ）。", "options": [{"label": "A", "text": "须知政权是由枪杆子中取得的"}, {"label": "B", "text": "没有调查，没有发言权"}, {"label": "C", "text": "兵民是胜利之本"}, {"label": "D", "text": "一切反动派都是纸老虎"}], "answer": "B", "explain": "毛泽东在《反对本本主义》中提出的著名论断是没有调查没有发言权，选B。A枪杆子里出政权出自八七会议，C兵民是胜利之本、D一切反动派都是纸老虎均为后来论断。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 19, "question": "从1927年到1930年上半年，中国共产党领导的农村革命根据地和红军得到了迅速发展，其根本措施是（ ）。", "options": [{"label": "A", "text": "工农武装割据波浪式推向全国"}, {"label": "B", "text": "纠正“左”倾军事冒险计划"}, {"label": "C", "text": "肃清右倾投降主义路线"}, {"label": "D", "text": "开展“打土豪，分田地”的土地革命"}], "answer": "D", "explain": "根据地和红军迅速发展的根本措施是开展打土豪分田地的土地革命，选D。A工农武装割据、B纠正左倾、C肃清右倾都不是根本措施。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 20, "question": "中国共产党在领导人民革命的过程中，积累了丰富的经验，锻造出了有效的克敌制胜的武器，武装斗争就是中国共产党在中国革命中战胜敌人的重要法宝之一，其实质是（ ）。", "options": [{"label": "A", "text": "工人阶级领导的农民战争"}, {"label": "B", "text": "无产阶级领导的反帝国主义战争"}, {"label": "C", "text": "工农联合的反军阀战争"}, {"label": "D", "text": "资产阶级领导的反封建战争"}], "answer": "A", "explain": "中国武装斗争的实质是工人阶级领导的农民战争，选A。B无产阶级反帝战争、C工农反军阀战争、D资产阶级反封建战争都与武装斗争的实质不符。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 21, "question": "中华苏维埃共和国实行的制度是（ ）。", "options": [{"label": "A", "text": "人民代表大会制度"}, {"label": "B", "text": "工农兵代表大会制度"}, {"label": "C", "text": "农民代表大会制度"}, {"label": "D", "text": "工人代表大会制度"}], "answer": "B", "explain": "中华苏维埃共和国实行的制度是工农兵代表大会制度，选B。A人民代表大会、C农民代表大会、D工人代表大会都不是其采取的制度。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 22, "question": "1931年1月至1935年1月存在的（ ），使中国革命受到严重挫折。", "options": [{"label": "A", "text": "瞿秋白的“左”倾盲动主义"}, {"label": "B", "text": "李立三的“左”倾冒险主义"}, {"label": "C", "text": "王明的“左”倾教条主义"}, {"label": "D", "text": "陈独秀的右倾机会主义"}], "answer": "C", "explain": "1931年1月至1935年1月存在的是王明的左倾教条主义，选C。A瞿秋白盲动主义、B李立三冒险主义都是1927至1930年，D陈独秀右倾机会主义更早。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 23, "question": "以王明为代表的“左“倾教条主义的最大恶果是（ ）。", "options": [{"label": "A", "text": "使福建反蒋抗日事变失败"}, {"label": "B", "text": "使中国革命丧失了有利的时机"}, {"label": "C", "text": "使国民党统治区革命力量遭到惨痛损失"}, {"label": "D", "text": "使红军的第五次反“围剿”失败"}], "answer": "D", "explain": "以王明为代表的左倾教条主义的最大恶果是使红军第五次反围剿失败，选D。A福建事变失败、B丧失有利时机、C白区损失都不是最大恶果。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 24, "question": "在第五次反“围剿”斗争失败后，（ ）率先撤离根据地开始长征。", "options": [{"label": "A", "text": "红一方面军"}, {"label": "B", "text": "红二方面军"}, {"label": "C", "text": "红三方面军"}, {"label": "D", "text": "红四方面军"}], "answer": "A", "explain": "第五次反围剿失败后率先撤离根据地开始长征的是红一方面军，选A。B红二方面军、D红四方面军稍后出发，C红三方面军并不存在。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 25, "question": "1935年1月，中国共产党在遵义会议上解决的主要问题是（ ）。", "options": [{"label": "A", "text": "筹款和征兵问题"}, {"label": "B", "text": "思想和作风问题"}, {"label": "C", "text": "政治和军事问题"}, {"label": "D", "text": "军事和组织问题"}], "answer": "D", "explain": "1935年1月遵义会议集中解决的主要问题是军事和组织问题，选D。A筹款和征兵、B思想和作风、C政治和军事都不是它所集中解决的问题。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 26, "question": "（ ）开始确立以毛泽东为代表的马克思主义的正确路线在中共中央的领导地位。", "options": [{"label": "A", "text": "八七会议"}, {"label": "B", "text": "遵义会议"}, {"label": "C", "text": "瓦窑堡会议"}, {"label": "D", "text": "中共七大"}], "answer": "B", "explain": "开始确立以毛泽东为代表的马克思主义正确路线在中央领导地位的是遵义会议，选B。A八七会议、C瓦窑堡会议、D中共七大都不是这一开端。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 27, "question": "在长征途中召开的（ ），是中国共产党历史上一个生死攸关的转折点。", "options": [{"label": "A", "text": "通道会议"}, {"label": "B", "text": "遵义会议"}, {"label": "C", "text": "黎平会议"}, {"label": "D", "text": "猴场会议"}], "answer": "B", "explain": "长征途中遵义会议是中国共产党历史上生死攸关的转折点，选B。A通道会议、C黎平会议、D猴场会议都是遵义会议之前的行军会议。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 28, "question": "遵义会议后，中共中央成立由（ ）组成的三人小组负责全军的军事行动。", "options": [{"label": "A", "text": "毛泽东、朱德、周恩来"}, {"label": "B", "text": "毛泽东、朱德、王稼祥"}, {"label": "C", "text": "毛泽东、周恩来、王稼祥"}, {"label": "D", "text": "毛泽东、张闻天、周恩来"}], "answer": "C", "explain": "遵义会议后负责全军军事行动的三人小组由毛泽东、周恩来、王稼祥组成，选C。A、B中的朱德和D中的张闻天都不在三人小组之内。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 29, "question": "关于遵义会议的表述，不正确的是（ ）。", "options": [{"label": "A", "text": "彻底清算了王明的“左”倾教条主义路线"}, {"label": "B", "text": "开始确立以毛泽东为代表的马克思主义正确路线在中央的领导"}, {"label": "C", "text": "解决了军事问题和组织问题"}, {"label": "D", "text": "取消了李德的军事最高指挥权"}], "answer": "A", "explain": "遵义会议并未彻底清算王明的左倾教条主义，故A是表述不正确的。B确立毛泽东领导、C解决军事组织问题、D取消李德指挥权均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "single", "id": 30, "question": "（ ）宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。", "options": [{"label": "A", "text": "遵义会议"}, {"label": "B", "text": "长征"}, {"label": "C", "text": "土地革命"}, {"label": "D", "text": "井冈山革命根据地的建立"}], "answer": "B", "explain": "长征宣告了国民党消灭党和红军的图谋彻底失败并实现从挫折走向胜利的转折，选B。A遵义会议、C土地革命、D井冈山根据地都不是这一宣告的主体。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 1, "question": "国民党在全国统治的建立，包括（ ）。", "options": [{"label": "A", "text": "南京国民政府和武汉国民政府实现宁汉合流"}, {"label": "B", "text": "国民党政府的军队继续北伐，于6月进驻北京、天津一带"}, {"label": "C", "text": "张学良宣布“遵守三民主义，服从国民政府，改易旗帜”"}, {"label": "D", "text": "北洋军阀不再作为独立的政治力量继续存在"}], "answer": "ABCD", "explain": "国民党在全国统治的建立包括宁汉合流、继续北伐进驻京津、张学良东北易帜以及北洋军阀不再作为独立政治力量存在，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 2, "question": "1927年大革命失败后，国民党性质发生转变，成为代表（ ）利益的政党。", "options": [{"label": "A", "text": "地主阶级"}, {"label": "B", "text": "工人阶级"}, {"label": "C", "text": "买办性大资产阶级"}, {"label": "D", "text": "民族资产阶级"}], "answer": "AC", "explain": "大革命失败后国民党代表地主阶级和买办性大资产阶级的利益，故AC正确。B工人阶级、D民族资产阶级都不是它所代表的阶级。其阶级基础已完全背离革命初衷。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 3, "question": "国民党政府实行一党专政的军事独裁的措施有（ ）。", "options": [{"label": "A", "text": "建立庞大的军队"}, {"label": "B", "text": "建立庞大的全国性特务系统"}, {"label": "C", "text": "大力推行保甲制度"}, {"label": "D", "text": "厉行文化专制主义"}], "answer": "ABCD", "explain": "国民党军事独裁的措施包括建立庞大的常备军队、建立庞大的全国性特务系统、大力推行保甲制度和厉行文化专制主义，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 4, "question": "国民党政府实行的一党专政的军事独裁统治主要是为了维护（ ）的利益。", "options": [{"label": "A", "text": "官僚资本主义"}, {"label": "B", "text": "帝国主义"}, {"label": "C", "text": "封建主义"}, {"label": "D", "text": "民族资产阶级"}], "answer": "ABC", "explain": "国民党一党专政的军事独裁统治主要为了维护官僚资本主义、帝国主义和封建主义的利益，故ABC正确。D民族资产阶级并不是它维护的对象。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 5, "question": "大革命失败后的艰难环境是（ ）", "options": [{"label": "A", "text": "中国社会的半殖民地半封建性质没有改变"}, {"label": "B", "text": "反革命力量大大超过了有组织的革命力量"}, {"label": "C", "text": "白色恐怖笼罩着全国城乡"}, {"label": "D", "text": "中国革命转入低潮"}], "answer": "ABCD", "explain": "大革命失败后的艰难环境是中国社会半殖民地半封建性质未变、反革命力量远超革命力量、白色恐怖笼罩城乡、革命转入低潮，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 6, "question": "中国共产党发动南昌起义的历史意义主要体现在（ ）。", "options": [{"label": "A", "text": "打响了武装反抗国民党反动派的第一枪"}, {"label": "B", "text": "开始了独立领导革命战争、创建人民军队和武装夺取政权"}, {"label": "C", "text": "走上了农村包围城市的革命道路"}, {"label": "D", "text": "开始了从大革命失败到土地革命战争兴起的转折"}], "answer": "AB", "explain": "南昌起义打响第一枪并开始独立领导革命、创建人民军队和武装夺取政权，故AB正确。C农村包围城市道路是井冈山开创，D转折表述不准确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 7, "question": "大革命失败后，中国共产党在1927年发动的三大著名起义是（ ）。", "options": [{"label": "A", "text": "南昌起义"}, {"label": "B", "text": "秋收起义"}, {"label": "C", "text": "广州起义"}, {"label": "D", "text": "百色起义"}], "answer": "ABC", "explain": "1927年中共发动的三大著名起义是南昌起义、秋收起义和广州起义，故ABC正确。D百色起义发生在1929年，不算1927年三大起义。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 8, "question": "关于八七会议的表述，正确的是（ ）。", "options": [{"label": "A", "text": "为中国共产党指明了新的出路"}, {"label": "B", "text": "提出了“找着新的道路”的任务"}, {"label": "C", "text": "毛泽东在会议上提出“须知政权是由枪杆子中取得的”的著名论断"}, {"label": "D", "text": "确定了土地革命和武装起义的方针"}], "answer": "ABCD", "explain": "八七会议为党指明了新出路、提出了找着新的道路的任务、毛泽东提出了枪杆子里出政权的论断，并确定了土地革命和武装起义的方针，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 9, "question": "关于三湾改编的表述，正确的是（ ）。", "options": [{"label": "A", "text": "创建人民军队的开端"}, {"label": "B", "text": "创建了工农革命军"}, {"label": "C", "text": "从组织上确立了党对军队的领导"}, {"label": "D", "text": "建设无产阶级领导的新型人民军队的重要开端"}], "answer": "CD", "explain": "三湾改编从组织上确立党对军队领导并开启新型人民军队建设，故CD正确。A创建人民军队开端是南昌起义，B创建工农革命军是秋收起义。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 10, "question": "井冈山革命根据地的创建有深远的意义，表现在（ ）。", "options": [{"label": "A", "text": "为共产党领导的其他各地的起义武装树立了榜样"}, {"label": "B", "text": "点燃了“工农武装割据”的星星之火"}, {"label": "C", "text": "开辟了一条共产党深入农村保存和发展革命力量的正确道路"}, {"label": "D", "text": "动摇了国民党反动派的统治基础"}], "answer": "ABC", "explain": "井冈山根据地树立榜样、点燃工农武装割据星星之火并开辟保存革命力量的道路，故ABC正确。D动摇国民党统治基础不是其深远意义。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 11, "question": "毛泽东从1928年到1930年提出并阐述了农村包围城市、武装夺取政权道路理论的主要文章是（ ）。", "options": [{"label": "A", "text": "《中国的红色政权为什么能够存在》"}, {"label": "B", "text": "《井冈山的斗争》"}, {"label": "C", "text": "《星星之火，可以燎原》"}, {"label": "D", "text": "《反对本本主义》"}], "answer": "ABCD", "explain": "毛泽东阐述农村包围城市、武装夺取政权道路理论的主要文章包括《中国的红色政权为什么能够存在》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 12, "question": "关于中华苏维埃共和国的表述，正确的是（ ）。", "options": [{"label": "A", "text": "中国历史上第一个全国性的工农民主政权"}, {"label": "B", "text": "中国共产党在局部地区执政的重要尝试"}, {"label": "C", "text": "政权性质是各个革命阶级的联合专政"}, {"label": "D", "text": "实行工农兵代表大会制度"}], "answer": "ABD", "explain": "中华苏维埃共和国是第一个全国性工农民主政权、局部执政尝试并实行工农兵代表大会制度，故ABD正确。C各个革命阶级联合专政是新民主主义政权性质，不等于工农民主专政。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 13, "question": "土地革命战争前中期，在党中央领导机关取得统治地位的“左”倾错误有（ ）。", "options": [{"label": "A", "text": "“左”倾盲动主义"}, {"label": "B", "text": "“左”倾冒险主义"}, {"label": "C", "text": "“左”倾投降主义"}, {"label": "D", "text": "“左”倾教条主义"}], "answer": "ABD", "explain": "土地革命战争前中期在中央取得统治地位的左倾错误有左倾盲动主义、左倾冒险主义和左倾教条主义，故ABD正确。C左倾投降主义并不存在。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 14, "question": "在20世纪 30年代前期、中期，党内屡次出现“左”倾错误的原因有（ ）。", "options": [{"label": "A", "text": "不善于把马克思列宁主义与中国实际全面、正确地结合起来"}, {"label": "B", "text": "共产国际对中国革命的错误指导"}, {"label": "C", "text": "八七会议后党内一直存在着浓厚的左倾情绪"}, {"label": "D", "text": "党的马克思主义理论准备不足"}], "answer": "ABCD", "explain": "30年代前期中期左倾错误屡次出现的原因包括理论与实际脱节、共产国际错误指导、党内浓厚左倾情绪和理论准备不足，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 15, "question": "中国共产党在遵义会议上集中全力解决的主要问题是（ ）。", "options": [{"label": "A", "text": "军事问题"}, {"label": "B", "text": "思想路线问题"}, {"label": "C", "text": "组织问题"}, {"label": "D", "text": "政治路线问题"}], "answer": "AC", "explain": "遵义会议集中全力解决的是军事问题和组织问题，故AC正确。B思想路线问题、D政治路线问题都不是它此次会议集中解决的问题。这两个问题在当时具有决定性意义。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 16, "question": "1935年1月中共中央在长征途中召开的遵义会议（ ）。", "options": [{"label": "A", "text": "全面讨论了政治路线的是非问题"}, {"label": "B", "text": "解决了当时具有决定意义的军事和组织问题"}, {"label": "C", "text": "结束了“左”倾教条主义错误在中央的统治"}, {"label": "D", "text": "开始确立毛泽东在中共中央和红军的领导地位"}], "answer": "BCD", "explain": "遵义会议解决了具有决定意义的军事和组织问题，结束了左倾教条主义在中央的统治，开始确立毛泽东的领导地位，故BCD正确。A它并未全面讨论政治路线之谜。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 17, "question": "遵义会议在中国共产党历史上的功绩，主要体现在（ ）。", "options": [{"label": "A", "text": "解决了党的政治路线问题"}, {"label": "B", "text": "解决了当时的军事和组织问题"}, {"label": "C", "text": "事实上确立了毛泽东在党中央和红军的领导地位"}, {"label": "D", "text": "挽救了中国共产党、挽救了中国工农红军、挽救了中国革命"}], "answer": "BCD", "explain": "遵义会议的功绩是解决当时的军事和组织问题、事实上确立毛泽东在党中央和红军的领导地位、挽救党和红军革命，故BCD正确。A解决政治路线问题不是它的功绩。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 18, "question": "1936年10月，在甘肃会宁、甘肃隆德将台堡胜利会师的红军三大主力是（  ）。", "options": [{"label": "A", "text": "红一方面军"}, {"label": "B", "text": "红二方面军"}, {"label": "C", "text": "红三方面军"}, {"label": "D", "text": "红四方面军"}], "answer": "ABD", "explain": "1936年10月在甘肃会宁和将台堡会师的三大主力是红一方面军、红二方面军、红四方面军，故ABD正确。C红三方面军并不存在。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 19, "question": "中国工农红军的长征（ ）", "options": [{"label": "A", "text": "开创了农村包围城市、武装夺取政权的中国革命新道路"}, {"label": "B", "text": "宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败"}, {"label": "C", "text": "实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折"}, {"label": "D", "text": "宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移"}], "answer": "BCD", "explain": "长征宣告敌人消灭图谋失败、实现转折并完成北上抗日战略转移，故BCD正确。A农村包围城市新道路是井冈山时期开辟，不是长征的功绩。"}, {"chapter": "第五章 中国革命的新道路", "type": "multi", "id": 20, "question": "长征铸就了伟大的长征精神，包括（ ）", "options": [{"label": "A", "text": "把全国人民和中华民族的根本利益看得高于一切"}, {"label": "B", "text": "为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神"}, {"label": "C", "text": "坚持独立自主、实事求是，一切从实际出发的精神"}, {"label": "D", "text": "顾全大局、严守纪律、紧密团结的精神"}], "answer": "ABCD", "explain": "长征铸就的长征精神包括把人民和民族根本利益看得高于一切，不怕牺牲救国救民，坚持独立自主实事求是，顾全大局严守纪律，故ABCD均正确。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 1, "question": "1928年国民党在全国的统治建立后，民族资产阶级成为中国的统治阶级。", "answer": false, "explain": "该判断错误。1928年国民党在全国统治建立之后，成为统治阶级的是地主阶级和大资产阶级，而并不是民族资产阶级。民族资产阶级依然处于被压迫地位。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 2, "question": "1927年大革命失败后，国民党蜕变为代表地主阶级、买办性大资产阶级利益的政党，其统治与北洋军阀的统治没有本质的区别。", "answer": true, "explain": "该判断正确。大革命失败后国民党蜕变为代表地主阶级和买办性大资产阶级利益的政党，其统治与北洋军阀的统治没有本质区别。二者都是实行反动的独裁统治。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 3, "question": "“八七会议”确定了土地革命和武装起义的方针，给正处在思想混乱和组织涣散中的中国共产党指明了新的出路。", "answer": true, "explain": "该判断正确。八七会议确定了土地革命和武装起义的方针，给正处在思想混乱和组织涣散中的中国共产党指明了新的出路。从此中国革命进入了土地革命新时期。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 4, "question": "南昌起义打响武装反抗国民党的第一枪，成为中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。", "answer": true, "explain": "该判断正确。南昌起义打响了武装反抗国民党反动派的第一枪，是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 5, "question": "中国革命的新道路是“农村包围城市、武装夺取政权”。", "answer": true, "explain": "该判断正确。中国革命的新道路就是农村包围城市、武装夺取政权，这是符合中国国情的唯一正确的革命道路。它井冈山斗争为起点逐步开辟形成。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 6, "question": "中华苏维埃共和国是中国历史上第一个全国性的工农民主政权。", "answer": true, "explain": "该判断正确。1931年在江西瑞金成立的中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，也是党局部执政的重要尝试。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 7, "question": "从大革命失败到遵义会议召开之前，“左”倾错误先后三次在党中央的领导机关取得统治地位。", "answer": true, "explain": "该判断正确。从大革命失败到遵义会议召开之前，左倾错误先后三次在党中央的领导机关取得统治地位，使中国革命屡遭严重挫折。这三次错误分别是盲动、冒险和教条。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 8, "question": "遵义会议集中解决党的政治路线和组织问题，并选举毛泽东为中共中央总书记。", "answer": false, "explain": "该判断错误。遵义会议集中解决的是军事和组织问题，并没有选举毛泽东为中共中央总书记，当时在中央负总责的是张闻天。毛泽东当选为中央政治局常委。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 9, "question": "遵义会议是中国共产党历史上一个生死攸关的转折点。", "answer": true, "explain": "该判断正确。遵义会议是在长征的危急时刻召开的，是中国共产党历史上一个生死攸关的转折点，挽救了党和革命。它开始确立毛泽东的正确领导地位。"}, {"chapter": "第五章 中国革命的新道路", "type": "tf", "id": 10, "question": "中国共产党领导的中国工农红军长征的胜利，是中国革命转危为安的关键。", "answer": true, "explain": "该判断正确。中国共产党领导的中国工农红军长征的胜利，是使中国革命转危为安的关键，保存了党和红军的骨干力量。长征锻炼保存了革命的骨干力量。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 1, "question": "日本企图变中国为其独占殖民地的侵略战争始于（ ）。", "options": [{"label": "A", "text": "1894年7月25日"}, {"label": "B", "text": "1931年9月18日"}, {"label": "C", "text": "1932年1月28日"}, {"label": "D", "text": "1937年7月7日"}], "answer": "B", "explain": "日本企图变中国为其独占殖民地的侵略战争始于1931年九一八事变，选B。A1894年甲午战争是侵略战争但不以独占为目标，C1932年一二八事变、D1937年卢沟桥事变都在其后。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 2, "question": "九一八事变后，蒋介石提出的方针是（ ）。", "options": [{"label": "A", "text": "绝对不抵抗"}, {"label": "B", "text": "自强之术，必先练兵"}, {"label": "C", "text": "攘外必先安内"}, {"label": "D", "text": "安内必先攘外"}], "answer": "C", "explain": "九一八事变后蒋介石提出的方针是攘外必先安内，选C。A绝对不抵抗是他对东北军实际执行的方针，B自强必先练兵为洋务主张，D安内必先攘外顺序颠倒。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 3, "question": "1935年，日本在华北制造一系列事端，以至中国在（ ）、察哈尔两省的主权大部丧失。", "options": [{"label": "A", "text": "山东"}, {"label": "B", "text": "山西"}, {"label": "C", "text": "河北"}, {"label": "D", "text": "河南"}], "answer": "C", "explain": "1935年日本在华北制造事端，使中国在河北、察哈尔两省的主权大部丧失，选C。A山东、B山西、D河南都不是华北事变主要涉及的省份。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 4, "question": "日本全面侵华的标志是（ ）。", "options": [{"label": "A", "text": "卢沟桥事变"}, {"label": "B", "text": "华北事变"}, {"label": "C", "text": "九一八事变"}, {"label": "D", "text": "一·二八事变"}], "answer": "A", "explain": "日本全面侵华的标志是卢沟桥事变，选A。B华北事变、C九一八事变、D一二八事变都是日本发动的局部侵华事件，并非全面侵华的标志。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 5, "question": "日本侵略者强制推行（ ），肆意摧残中国文化，企图以维护其殖民统治。", "options": [{"label": "A", "text": "皇民化教育"}, {"label": "B", "text": "奴化教育"}, {"label": "C", "text": "强制教育"}, {"label": "D", "text": "屈服教育"}], "answer": "B", "explain": "日本侵略者强制推行奴化教育以肆意摧残中国文化，选B。A皇民化教育、C强制教育、D屈服教育都不是教材所采用的标准表述。以此配合其野蛮的军事殖民统治。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 6, "question": "面对日本的野蛮侵略，中国人民奋起抵抗，进行长达（ ）年艰苦卓绝的抗日战争。", "options": [{"label": "A", "text": "8"}, {"label": "B", "text": "9"}, {"label": "C", "text": "12"}, {"label": "D", "text": "14"}], "answer": "D", "explain": "中国人民抵抗日本侵略进行了长达14年艰苦卓绝的抗日战争，选D。A8年是仅从1937年全面抗战算起，B9年、C12年都不符合实际。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 7, "question": "1933年初，中国共产党领导的抗日游击队先后在（ ）各地崛起。", "options": [{"label": "A", "text": "东南"}, {"label": "B", "text": "东北"}, {"label": "C", "text": "华北"}, {"label": "D", "text": "华南"}], "answer": "B", "explain": "1933年初中国共产党领导的抗日游击队先后在东北各地崛起，选B。A东南、C华北、D华南都不是1933年初抗日游击队崛起的区域。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 8, "question": "1932年一·二八事变后，爱国将领蒋光鼐、蔡廷锴率领（ ）奋起抗日。", "options": [{"label": "A", "text": "第十九路军"}, {"label": "B", "text": "第二十九路军"}, {"label": "C", "text": "第十九军"}, {"label": "D", "text": "第二十九军"}], "answer": "A", "explain": "1932年一二八事变后蒋光鼐、蔡廷锴率领第十九路军奋起抗日，选A。B第二十九路军、C第十九军、D第二十九军都不是其部队番号。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 9, "question": "1933年5月，原西北军将领冯玉祥在张家口成立（ ），并谋求同共产党合作。", "options": [{"label": "A", "text": "抗日义勇军"}, {"label": "B", "text": "察哈尔民众抗日同盟军"}, {"label": "C", "text": "东北抗日联军"}, {"label": "D", "text": "西北抗日联军"}], "answer": "B", "explain": "1933年5月冯玉祥在张家口成立察哈尔民众抗日同盟军，选B。A抗日义勇军、C东北抗日联军、D西北抗日联军都不是冯玉祥所建。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 10, "question": "1933年11月，国民党爱国将领蔡廷锴、蒋光鼐以及国民党内爱国人士李济深、陈铭枢等发动反蒋抗日的（ ）。", "options": [{"label": "A", "text": "北京事变"}, {"label": "B", "text": "福建事变"}, {"label": "C", "text": "西安事变"}, {"label": "D", "text": "皖南事变"}], "answer": "B", "explain": "1933年11月蔡廷锴、蒋光鼐等发动的反蒋抗日事件是福建事变，选B。A北京事变、C西安事变、D皖南事变都不是这一事件的名称。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 11, "question": "1935年，北平学生在中共号召和领导下举行的抗日救亡运动是（ ）。", "options": [{"label": "A", "text": "一二·一运动"}, {"label": "B", "text": "一·二一运动"}, {"label": "C", "text": "一·二九运动"}, {"label": "D", "text": "一二·九运动"}], "answer": "D", "explain": "1935年北平学生举行的抗日救亡运动是一二九运动，选D。A一二一运动是1945年国民党统治区学生运动，B、C均非正确名称。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 12, "question": "（ ）促进了中华民族的觉醒，标志着中国人民抗日救亡运动新高潮的到来。", "options": [{"label": "A", "text": "七七事变"}, {"label": "B", "text": "一·二八事变"}, {"label": "C", "text": "九一八事变"}, {"label": "D", "text": "一二·九运动"}], "answer": "D", "explain": "一二·九运动（1935年12月）掀起全民族抗日救亡运动新高潮，促进了中华民族的觉醒。A七七事变是全面侵华战争开始的标志，B一·二八事变是1932年日军进攻上海的局部侵略，C九一八事变是局部抗战开始的标志，均不是救亡运动新高潮到来的直接标志。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 13, "question": "1935 年8月1日，中共驻共产国际代表团发表（ ），呼吁一致抗日。", "options": [{"label": "A", "text": "《为抗日救国告全国同胞书》"}, {"label": "B", "text": "《停止内战一致抗日》"}, {"label": "C", "text": "《停战议和一致抗日》"}, {"label": "D", "text": "《反日反蒋的初步协定》"}], "answer": "A", "explain": "1935年8月1日中共驻共产国际代表团发表《为抗日救国告全国同胞书》（即八一宣言），呼吁停止内战、一致抗日。B《停止内战一致抗日》与C《停战议和一致抗日》非该宣言的正式名称，D《反日反蒋的初步协定》与本题无关，均不正确。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 14, "question": "1935年12月，中国共产党召开（ ），提出建立抗日民族统一战线政策。", "options": [{"label": "A", "text": "遵义会议"}, {"label": "B", "text": "瓦窑堡会议"}, {"label": "C", "text": "洛川会议"}, {"label": "D", "text": "晋绥干部会议"}], "answer": "B", "explain": "1935年12月瓦窑堡会议首次提出建立抗日民族统一战线的政策方针。A遵义会议解决的是军事与组织问题，C洛川会议是1937年制定全面抗战路线，D晋绥干部会议时间与议题均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 15, "question": "1936年9月，中共中央明确提出党的总方针是（ ）。", "options": [{"label": "A", "text": "反蒋抗日"}, {"label": "B", "text": "逼蒋抗日"}, {"label": "C", "text": "促蒋抗日"}, {"label": "D", "text": "联蒋抗日"}], "answer": "B", "explain": "1936年9月中共中央在《关于逼蒋抗日问题的指示》中明确提出党的总方针是逼蒋抗日。A反蒋抗日是此前的方针，C促蒋抗日、D联蒋抗日均非当时准确表述。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 16, "question": "中共中央促成西安事变和平解决的原因在于（ ）。", "options": [{"label": "A", "text": "团结国民党共同抗日"}, {"label": "B", "text": "不赞成张学良、杨虎城的主张"}, {"label": "C", "text": "工作重心转向城市斗争"}, {"label": "D", "text": "接到共产国际的指示"}], "answer": "A", "explain": "中共中央力主西安事变和平解决，根本目的在于团结国民党共同抗日，推动抗日民族统一战线形成。B中共赞成张杨抗日主张而非反对，C工作重心是抗日而非城市斗争，D并非简单执行共产国际指示，均不准确。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 17, "question": "抗日战争是一场全民族反抗外敌入侵的正义战争。抗战初期，在华北战场上规模最大、最激烈的一次战役，也是国共两党军队合作抗日、配合最好的一次战役是（ ）。", "options": [{"label": "A", "text": "台儿庄战役"}, {"label": "B", "text": "忻口会战"}, {"label": "C", "text": "长城抗战"}, {"label": "D", "text": "平津会战"}], "answer": "B", "explain": "忻口会战是华北战场规模最大、最激烈，也是国共两党军队配合作战最好的一次战役。A台儿庄战役属徐州会战，C长城抗战在全面抗战之前，D平津会战规模与配合程度均不及忻口会战。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 18, "question": "蒋介石集团害怕群众的广泛动员可能危及自身统治，因而实行（ ）路线。", "options": [{"label": "A", "text": "正面抗战"}, {"label": "B", "text": "敌后抗战"}, {"label": "C", "text": "片面抗战"}, {"label": "D", "text": "全面抗战"}], "answer": "C", "explain": "蒋介石集团惧怕群众广泛动员危及自身统治，因而实行只依靠政府和军队、不敢发动群众的片面抗战路线。A正面抗战指其作战位置，B敌后抗战是中共的，D全面抗战是中共路线，均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 19, "question": "抗日战争进入相持阶段后，日本对国民党政府采取的方针是（ ）。", "options": [{"label": "A", "text": "以军事打击为主，政治诱降为辅"}, {"label": "B", "text": "以政治诱降为主，军事打击为辅"}, {"label": "C", "text": "军事打击和政治诱降并重"}, {"label": "D", "text": "速战速决，武力征服"}], "answer": "B", "explain": "抗战进入相持阶段后，日本对国民党政府改取以政治诱降为主、军事打击为辅的方针。A正好颠倒主次，C军事打击与政治诱降并重不符史实，D速战速决是战争初期方针。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 20, "question": "中国共产党在抗日战争时期实行的土地政策是（ ）。", "options": [{"label": "A", "text": "没收地主土地为农民所有"}, {"label": "B", "text": "没收一切土地归国有"}, {"label": "C", "text": "没收一切公共土地与地主土地"}, {"label": "D", "text": "减租减息"}], "answer": "D", "explain": "抗日战争时期中共实行减租减息的土地政策，以团结各阶层共同抗日。A没收地主土地是土地革命战争时期做法，B没收一切土地归国有、C没收一切公共土地与地主土地均非抗战政策。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 21, "question": "在抗日战争中，国民党由比较积极地抗战转向消极抗战的标志是（ ）的召开。", "options": [{"label": "A", "text": "国民党五届三中全会"}, {"label": "B", "text": "国民党五届四中全会"}, {"label": "C", "text": "国民党五届五中全会"}, {"label": "D", "text": "国民党五届六中全会"}], "answer": "C", "explain": "国民党五届五中全会确定消极抗日、积极反共方针，是国民党由积极抗战转向消极抗战的标志。A三中全会、B四中全会、D六中全会均非这一转变的标志性会议。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 22, "question": "在1944年4月至1945年1月的（ ）中，国民党军队大溃败。", "options": [{"label": "A", "text": "豫湘桂战役"}, {"label": "B", "text": "徐州会战"}, {"label": "C", "text": "枣宜会战"}, {"label": "D", "text": "百团大战"}], "answer": "A", "explain": "1944年4月至1945年1月豫湘桂战役中，国民党军队遭致抗日战争中空前的大溃败。B徐州会战、C枣宜会战属抗战前期，D百团大战是八路军主动进攻日军，均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 23, "question": "中国共产党实行（ ）路线，即人民战争路线。", "options": [{"label": "A", "text": "正面抗战"}, {"label": "B", "text": "敌后抗战"}, {"label": "C", "text": "片面抗战"}, {"label": "D", "text": "全面抗战"}], "answer": "D", "explain": "中国共产党实行全面抗战路线，即动员全国民众的人民战争路线。A正面抗战是国民党路线，B敌后抗战是战场位置，C片面抗战是国民党只靠军队的路线，均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 24, "question": "1937年8月召开的（ ）强调使已经发动的抗战成为全面的全民族抗战。", "options": [{"label": "A", "text": "瓦窑堡会议"}, {"label": "B", "text": "延安会议"}, {"label": "C", "text": "洛川会议"}, {"label": "D", "text": "遵义会议"}], "answer": "C", "explain": "1937年8月洛川会议强调必须使已经发动的抗战成为全面的全民族抗战，制定了抗日救国十大纲领。A瓦窑堡会议为1935年，B延安会议、D遵义会议时间与议题均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 25, "question": "（ ）是中共领导抗日战争的纲领性文献，对全国抗战的战略指导产生积极影响。", "options": [{"label": "A", "text": "《论持久战》"}, {"label": "B", "text": "《为抗日救国告全国同胞书》"}, {"label": "C", "text": "《实践论》"}, {"label": "D", "text": "《中国革命战争的战略问题》"}], "answer": "A", "explain": "《论持久战》系统阐明抗日战争的持久战性质与必胜规律，是中共领导抗战的纲领性文献。B《为抗日救国告全国同胞书》是八一宣言，C《实践论》、D《中国革命战争的战略问题》是哲学与军事著作，均非抗战纲领。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 26, "question": "全民族抗战开始后，中国军队取得第一次重大胜利的战役是（ ）。", "options": [{"label": "A", "text": "台儿庄战役"}, {"label": "B", "text": "昆仑关战役"}, {"label": "C", "text": "百团大战"}, {"label": "D", "text": "平型关战役"}], "answer": "D", "explain": "平型关战役是全民族抗战开始后中国军队取得的第一次重大胜利，打破了日军不可战胜的神话。A台儿庄战役在此之后，B昆仑关战役、C百团大战时间更晚，均非首次重大胜利。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 27, "question": "1940年8月至12月，八路军对华北日军发动的大规模进攻是（ ）。", "options": [{"label": "A", "text": "平型关战役"}, {"label": "B", "text": "雁门关战役"}, {"label": "C", "text": "阳明堡战役"}, {"label": "D", "text": "百团大战"}], "answer": "D", "explain": "1940年8月至12月八路军在华北对日军发动的大规模进攻是百团大战。A平型关战役为1937年，B雁门关战役、C阳明堡战役规模均远不及百团大战。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 28, "question": "在战略相持阶段，（ ）成为主要的抗日作战方式。", "options": [{"label": "A", "text": "运动战"}, {"label": "B", "text": "游击战"}, {"label": "C", "text": "地雷战"}, {"label": "D", "text": "地道战"}], "answer": "B", "explain": "在战略相持阶段，敌后游击战成为抗日作战的主要方式。A运动战是正规战形式，C地雷战、D地道战只是游击战的具体战法，均非主要作战方式。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 29, "question": "1939年7月，中国共产党明确提出的三大口号不包括（ ）。", "options": [{"label": "A", "text": "坚持抗战到底——反对中途妥协"}, {"label": "B", "text": "巩固国内团结——反对内部分裂"}, {"label": "C", "text": "放手发动群众——反对片面抗战"}, {"label": "D", "text": "力求全国进步——反对向后倒退"}], "answer": "C", "explain": "1939年7月中共提出三大口号：坚持抗战反对妥协、巩固团结反对分裂、力求进步反对倒退，其中不包括放手发动群众反对片面抗战。A、B、D均为三大口号之一，C不在其中。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 30, "question": "中国共产党为坚持、扩大和巩固抗日民族统一战线制定的策略总方针不包括（ ）。", "options": [{"label": "A", "text": "发展进步势力"}, {"label": "B", "text": "反对投降势力"}, {"label": "C", "text": "孤立顽固势力"}, {"label": "D", "text": "争取中间势力"}], "answer": "B", "explain": "抗日民族统一战线的策略总方针是发展进步势力、争取中间势力、孤立顽固势力，不包括反对投降势力。A、C、D均为总方针内容，B不在其中。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 31, "question": "在（ ）上，毛泽东提出“马克思主义的中国化”这个命题。", "options": [{"label": "A", "text": "中共六届六中全会"}, {"label": "B", "text": "中共六大"}, {"label": "C", "text": "中共七大"}, {"label": "D", "text": "中共七届七中全会"}], "answer": "A", "explain": "毛泽东在中共六届六中全会上提出马克思主义的中国化这一命题。B中共六大在1928年、C中共七大在1945年、D七届七中全会时间更晚，均不符。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 32, "question": "延安整风运动的最主要任务是（ ）。", "options": [{"label": "A", "text": "反对主观主义以整顿学风"}, {"label": "B", "text": "反对官僚主义以整顿作风"}, {"label": "C", "text": "反对宗派主义以整顿党风"}, {"label": "D", "text": "反对党八股以整顿文风"}], "answer": "A", "explain": "延安整风运动最主要的任务是反对主观主义以整顿学风。B反对官僚主义不是整风内容，C反对宗派主义整顿党风、D反对党八股整顿文风虽是整风内容但非最主要任务。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 33, "question": "将毛泽东思想写入党章的重要会议是（ ）。", "options": [{"label": "A", "text": "中共五大"}, {"label": "B", "text": "中共六大"}, {"label": "C", "text": "中共七大"}, {"label": "D", "text": "中共八大"}], "answer": "C", "explain": "中共七大把毛泽东思想确立为党的指导思想并写入党章。A五大、B六大均在民主革命时期，D八大在1956年，均非写毛泽东思想入党章的会议。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 34, "question": "中国人民抗日战争胜利的关键是（ ）。", "options": [{"label": "A", "text": "民族意识的觉醒和全民族抗战"}, {"label": "B", "text": "反侵略战争的正义性和进步性"}, {"label": "C", "text": "世界反法西斯力量的同情和支持"}, {"label": "D", "text": "中国共产党的中流砥柱的作用"}], "answer": "D", "explain": "中国人民抗日战争胜利的关键是中国共产党的中流砥柱作用，中共领导的全民族抗战是决定性因素。A民族觉醒与全民族抗战、B战争的正义性、C国际反法西斯支持均是重要因素但非关键所在。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 35, "question": "中国人民抗日战争取得完全胜利的标志是（ ）。", "options": [{"label": "A", "text": "1945年8月15日，日本天皇裕仁发布《终战诏书》，宣布接受波茨坦公告"}, {"label": "B", "text": "1945年9月2日，日本投降代表团在美国军舰密苏里号上向同盟国投降并签字"}, {"label": "C", "text": "1945年9月9日，日本投降代表团在南京原中央军校大礼堂里向中国投降并签字"}, {"label": "D", "text": "1945年10月25日，中国收回被日本占领50年之久的台湾及澎湖列岛"}], "answer": "D", "explain": "1945年10月25日中国正式收回台湾及澎湖列岛，标志着抗日战争取得完全胜利。A8月15日日本宣布投降、B9月2日签字投降、C9月9日在南京受降，均是抗战胜利过程中的节点，而非完全胜利标志。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "single", "id": 36, "question": "近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争是（ ）。", "options": [{"label": "A", "text": "中法战争"}, {"label": "B", "text": "甲午战争"}, {"label": "C", "text": "抗日战争"}, {"label": "D", "text": "抗美援朝战争"}], "answer": "C", "explain": "抗日战争是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争。A中法战争、B甲午战争都以失败或屈辱告终，D抗美援朝战争虽胜但发生在建国后，均不符题意。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 1, "question": "在20世纪30年代，日本为侵略中国制造的事件有（ ）。", "options": [{"label": "A", "text": "九一八事变"}, {"label": "B", "text": "西安事变"}, {"label": "C", "text": "华北事变"}, {"label": "D", "text": "卢沟桥事变"}], "answer": "ACD", "explain": "正确答案ACD。九一八事变、华北事变、卢沟桥事变均是20世纪30年代日本为侵略中国制造的事件。B西安事变是张学良、杨虎城为逼蒋抗日发动的爱国兵谏，并非日本制造，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 2, "question": "因（ ）等采取对日姑息、纵容政策，日本对中国的侵略计划步步得逞。", "options": [{"label": "A", "text": "国际联盟"}, {"label": "B", "text": "英国"}, {"label": "C", "text": "美国"}, {"label": "D", "text": "澳大利亚"}], "answer": "ABC", "explain": "正确答案ABC。国际联盟、英国、美国对日本侵华采取姑息、纵容的绥靖政策，使侵略计划步步得逞。D澳大利亚未在其中起纵容作用，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 3, "question": "日本侵华犯下的严重罪行包括（ ）。", "options": [{"label": "A", "text": "屠杀中国人民"}, {"label": "B", "text": "掠夺财富"}, {"label": "C", "text": "开展奴化教育"}, {"label": "D", "text": "掠夺资源"}], "answer": "ABCD", "explain": "正确答案ABCD。日本侵华犯下的严重罪行具体包括：屠杀中国人民、疯狂掠夺中国的财富与资源、在沦陷区开展奴化教育等，四项均为其侵略罪行，故全选。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 4, "question": "一二·九运动的口号有（ ）。", "options": [{"label": "A", "text": "停止内战，一致对外"}, {"label": "B", "text": "打倒日本帝国主义"}, {"label": "C", "text": "废除“二十一条”"}, {"label": "D", "text": "反对华北自治"}], "answer": "ABD", "explain": "正确答案ABD。一二·九运动的口号有停止内战一致对外、打倒日本帝国主义、反对华北自治。C废除二十一条是五四运动时的口号，不属于一二·九运动，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 5, "question": "关于瓦窑堡会议的表述，正确的是（ ）。", "options": [{"label": "A", "text": "明确提出党的抗日总方针是“逼蒋抗日”"}, {"label": "B", "text": "提出党的基本策略任务是建立广泛的抗日民族统一战线"}, {"label": "C", "text": "批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向"}, {"label": "D", "text": "中国共产党在新的历史时期即将到来时掌握了政治上的主动权"}], "answer": "BCD", "explain": "正确答案BCD。瓦窑堡会议提出建立广泛的抗日民族统一战线、批评党内左倾关门主义并掌握政治主动权。A逼蒋抗日方针是1936年9月才提出，非瓦窑堡会议内容，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 6, "question": "1936年12月，爱国将领（ ）为实现停止内战、共同抗日，毅然发动西安事变。", "options": [{"label": "A", "text": "冯玉祥"}, {"label": "B", "text": "蔡廷锴"}, {"label": "C", "text": "张学良"}, {"label": "D", "text": "杨虎城"}], "answer": "CD", "explain": "正确答案CD。西安事变由爱国将领张学良、杨虎城于1936年12月发动，目的在于逼蒋抗日、停止内战。A冯玉祥、B蔡廷锴并非发动西安事变之人，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 7, "question": "抗战时期，中国共产党直接领导的抗日武装力量有（ ）。", "options": [{"label": "A", "text": "国民革命军第十九路军"}, {"label": "B", "text": "国民革命军第八路军"}, {"label": "C", "text": "国民革命军陆军新编第四军"}, {"label": "D", "text": "国民革命军新编第五军"}], "answer": "BC", "explain": "正确答案BC。中共直接领导的抗日武装是八路军（国民革命军第八路军）和新四军（国民革命军陆军新编第四军）。A十九路军是国民党军，D新编第五军非中共武装，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 8, "question": "以国共第二次合作为基础的抗日民族统一战线正式形成的标志是（ ）。", "options": [{"label": "A", "text": "1936年12月西安事变的和平解决"}, {"label": "B", "text": "1937年9月八路军开赴前线，配合国民党军队作战"}, {"label": "C", "text": "1937年9月国民党中央通讯社发表《中共中央为公布国共合作宣言》"}, {"label": "D", "text": "1937年9月蒋介石发表承认共产党合法地位的谈话"}], "answer": "CD", "explain": "正确答案CD。1937年9月国民党中央通讯社发表中共合作宣言和蒋介石发表承认中共合法地位的谈话，标志抗日民族统一战线正式形成。A西安事变和平解决只是时局转折，B八路军开赴前线配合是形成后的行动，均非正式形成标志。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 9, "question": "在抗日战争的战略防御阶段，国民党军队在正面战场组织的重大战役有（ ）等。", "options": [{"label": "A", "text": "淞沪会战"}, {"label": "B", "text": "忻口会战"}, {"label": "C", "text": "徐州会战"}, {"label": "D", "text": "武汉会战"}], "answer": "ABCD", "explain": "正确答案ABCD。战略防御阶段国民党正面战场组织的重大战役有淞沪会战、忻口会战、徐州会战、武汉会战，四项均属正面战场重大战役。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 10, "question": "抗战初期，国民党正面战场除台儿庄战役取得大捷外，其他战役几乎都以退却、失败而结束，而造成这种状况的原因主要有（ ）。", "options": [{"label": "A", "text": "国民党官兵贪生怕死"}, {"label": "B", "text": "日军在力量对比上占很大优势"}, {"label": "C", "text": "国民党消极抗日，积极反共"}, {"label": "D", "text": "国民党战略指导方针的失误"}], "answer": "BD", "explain": "正确答案BD。正面战场失利主要因为日军力量对比占很大优势和国民党战略指导方针的失误。A国民党官兵贪生怕死、C国民党初期消极抗日积极反共均不符合抗战初期史实，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 11, "question": "抗战开始后，（ ）迁往昆明，合并组建为国立西南联合大学。", "options": [{"label": "A", "text": "北京大学"}, {"label": "B", "text": "清华大学"}, {"label": "C", "text": "浙江大学"}, {"label": "D", "text": "南开大学"}], "answer": "ABD", "explain": "正确答案ABD。北京大学、清华大学、南开大学三校迁往昆明合并组建国立西南联合大学。C浙江大学迁往贵州遵义，未参与组建西南联大，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 12, "question": "在《论持久战》中，毛泽东预测抗日战争将经历（ ）三个阶段。", "options": [{"label": "A", "text": "战略防御"}, {"label": "B", "text": "战略相持"}, {"label": "C", "text": "战略撤退"}, {"label": "D", "text": "战略反攻"}], "answer": "ABD", "explain": "正确答案ABD。《论持久战》预测抗日战争经历战略防御、战略相持、战略反攻三个阶段。C战略撤退不是所预测的三个阶段之一，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 13, "question": "抗日战争时期，中国共产党领导并发动的著名战役有（ ）。", "options": [{"label": "A", "text": "平型关战役"}, {"label": "B", "text": "台儿庄战役"}, {"label": "C", "text": "百团大战"}, {"label": "D", "text": "长沙战役"}], "answer": "AC", "explain": "正确答案AC。平型关战役和百团大战是中国共产党直接领导发动并指挥的著名战役。B台儿庄战役、D长沙战役均属国民党正面战场组织的作战，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 14, "question": "中国共产党领导的抗日民主政权在人员分配上实行“三三制”原则，即（ ）。", "options": [{"label": "A", "text": "工人阶级占三分之一"}, {"label": "B", "text": "共产党员占三分之一"}, {"label": "C", "text": "党外进步人士占三分之一"}, {"label": "D", "text": "中间派占三分之一"}], "answer": "BCD", "explain": "正确答案BCD。三三制原则指共产党员、党外进步人士、中间派各占三分之一。A工人阶级占三分之一不属于三三制原内容，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 15, "question": "毛泽东指出，中国共产党在中国革命中战胜敌人的三大法宝是（ ）。", "options": [{"label": "A", "text": "统一战线"}, {"label": "B", "text": "土地革命"}, {"label": "C", "text": "武装斗争"}, {"label": "D", "text": "党的建设"}], "answer": "ACD", "explain": "正确答案ACD。毛泽东指出中国共产党在中国革命中战胜敌人的三大法宝是统一战线、武装斗争、党的建设。B土地革命是中国革命的重要内容，但不属于三大法宝之一，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 16, "question": "20世纪40年代前期，在全党范围内普遍展开的整风运动包括（ ）。", "options": [{"label": "A", "text": "反对主观主义以整顿学风"}, {"label": "B", "text": "反对官僚主义以整顿作风"}, {"label": "C", "text": "反对宗派主义以整顿党风"}, {"label": "D", "text": "反对党八股以整顿文风"}], "answer": "ACD", "explain": "正确答案ACD。整风运动内容为反对主观主义以整顿学风、反对宗派主义以整顿党风、反对党八股以整顿文风。B反对官僚主义不是整风运动内容，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 17, "question": "1945年7月26日，（ ）联合发表波茨坦公告，敦促日本投降。", "options": [{"label": "A", "text": "苏联"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "美国"}, {"label": "D", "text": "英国"}], "answer": "BCD", "explain": "正确答案BCD。1945年7月26日，波茨坦公告由中国、美国、英国三国联合发表，敦促日本立即投降。A苏联当时尚未对日宣战、未参加签署，故排除。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 18, "question": "中国人民的抗日战争在世界反法西斯战争中的地位和作用，主要体现在（ ）。", "options": [{"label": "A", "text": "直接促使欧洲战场德、意法西斯阵营的溃败"}, {"label": "B", "text": "为世界反法西斯战争的胜利作出重大贡献"}, {"label": "C", "text": "成为世界反法西斯战争的重要组成部分"}, {"label": "D", "text": "促进中华民族的大团结，弘扬中华民族的伟大精神"}], "answer": "BC", "explain": "正确答案BC。中国抗战是世界反法西斯战争的重要组成部分并为胜利作出重大贡献。A并非直接促使欧洲战场德意法西斯溃败，D是抗战对中华民族自身的影响，均非其世界地位体现。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 19, "question": "中国赢得抗日战争胜利的主要原因有（ ）。", "options": [{"label": "A", "text": "中国共产党发挥的中流砥柱作用"}, {"label": "B", "text": "以爱国主义为核心的民族精神"}, {"label": "C", "text": "国际反法西斯力量的同情和支持"}, {"label": "D", "text": "全民族抗战"}], "answer": "ABCD", "explain": "正确答案ABCD。中国抗战胜利的原因包括中共中流砥柱作用、以爱国主义为核心的民族精神、国际反法西斯力量的支持和全民族抗战，四项均正确。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "multi", "id": 20, "question": "抗日战争胜利的意义有（ ）。", "options": [{"label": "A", "text": "彻底粉碎日本军国主义殖民奴役中国的图谋"}, {"label": "B", "text": "促进中华民族的大团结，形成伟大的抗战精神"}, {"label": "C", "text": "对世界各国夺取反法西斯战争胜利，维护世界和平产生巨大影响"}, {"label": "D", "text": "坚持中国人民追求民族独立、自由、解放的意志"}], "answer": "ABCD", "explain": "正确答案ABCD。抗战胜利的意义包括彻底粉碎日本奴役图谋、促进民族大团结形成抗战精神、影响世界反法西斯战争、坚持民族独立自由，四项均正确。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 1, "question": "日本全面侵华战争从华北事变开始。", "answer": false, "explain": "错误。日本全面侵华战争是从1937年卢沟桥事变（七七事变）开始的，华北事变只是日本策动华北自治、扩大侵略的步骤，尚未构成全面侵华。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 2, "question": "一二·九运动标志着中国人民抗日救亡运动新高潮的到来。", "answer": true, "explain": "正确。一二·九运动由北平学生发起，点燃了全民族抗日救亡的热情，有力地促进了中华民族的觉醒，标志着中国人民抗日救亡运动新高潮的到来。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 3, "question": "西安事变的和平解决，标志着抗日民族统一战线正式形成。", "answer": false, "explain": "错误。西安事变和平解决只是时局转换的枢纽，为团结抗日创造了条件；而抗日民族统一战线是直到1937年9月国共合作宣言发表和蒋介石谈话后才正式形成的。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 4, "question": "在抗战初期，国民党实行片面抗战路线，即消极抗日，积极反共。", "answer": false, "explain": "错误。抗战初期国民党实行的是片面抗战路线，即只靠政府和军队、不敢发动群众；而消极抗日、积极反共是进入战略相持阶段后国民党的表现，二者不能混同。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 5, "question": "全民族抗战以来，中国军队取得第一次重大胜利的战役是平型关战役。", "answer": true, "explain": "正确。平型关战役是全民族抗战以来中国军队取得的第一次重大胜利，八路军一一五师于此歼灭日军千余人，沉重打击了日军不可战胜的神话。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 6, "question": "在战略相持阶段，以百团大战为代表的敌后游击战争成为主要的抗日作战方式。", "answer": false, "explain": "错误。战略相持阶段主要的抗日作战方式是敌后游击战，人民战争广泛开展；百团大战只是游击战中一次大规模进攻作战，不能等同于整体的作战方式。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 7, "question": "抗战进入相持阶段后，国民党推行消极抗日、积极反共的政策。", "answer": true, "explain": "正确。抗战进入战略相持阶段后，国民党逐渐从比较积极抗战转向消极抗日、积极反共的政策，不断制造反共摩擦、破坏抗日民族统一战线的团结。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 8, "question": "抗战时期，中国共产党实行减租减息政策，且不再没收地主阶级土地。", "answer": true, "explain": "正确。抗日战争时期中国共产党实行减租减息的交租交息政策，目的在于团结各阶级各阶层的力量共同抗日，因而不再没收地主阶级的土地。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 9, "question": "世界反法西斯力量对中国的支持，是中国人民取得抗日战争胜利的决定性因素。", "answer": false, "explain": "错误。中国人民抗日战争胜利的决定性因素是以中国共产党为中流砥柱的全民族抗战；世界反法西斯力量的支持只是重要的外部条件，并非决定因素。"}, {"chapter": "第六章  中华民族的抗日战争", "type": "tf", "id": 10, "question": "抗日战争是近代以来中国人民第一次取得完全胜利的民族解放战争。", "answer": true, "explain": "正确。抗日战争是近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争，洗雪了百年来的民族耻辱，是中华民族由衰败走向复兴的转折点。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 1, "question": "在第二次世界大战结束后新的国际格局下，美国采取的对华政策是（ ）。", "options": [{"label": "A", "text": "保持中立的政策"}, {"label": "B", "text": "扶蒋反共的政策"}, {"label": "C", "text": "武力干涉的政策"}, {"label": "D", "text": "遏制中国的政策"}], "answer": "B", "explain": "抗战胜利后美国对华采取扶蒋反共的政策，着力扶持蒋介石打内战。A保持中立不符，C美国未直接武力干涉，D遏制中国是冷战后期的战略，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 2, "question": "第二次世界大战结束后，美国在中国追求的长期目标是（ ）。", "options": [{"label": "A", "text": "阻止共产党完全控制中国"}, {"label": "B", "text": "遏制苏联"}, {"label": "C", "text": "推动建立一个稳定、统一的亲美政府"}, {"label": "D", "text": "建立一个独立自主的新中国"}], "answer": "C", "explain": "二战后美国在华长期目标是推动建立一个稳定、统一、亲美政府以维护其在华利益。A阻止共产党控制中国是短期目标，B遏制苏联是总体战略，D建立独立自主新中国与美目标相反。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 3, "question": "第二次世界大战结束后，美国在中国追求的短期目标是（ ）。", "options": [{"label": "A", "text": "阻止共产党完全控制中国"}, {"label": "B", "text": "遏制苏联"}, {"label": "C", "text": "推动建立一个稳定、统一的亲美政府"}, {"label": "D", "text": "建立一个独立自主的新中国"}], "answer": "A", "explain": "二战后美国在华短期目标是阻止共产党完全控制中国。B遏制苏联是总体战略，C建立亲美政府是长期目标，D建立独立自主新中国与美目标相反。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 4, "question": "1945年8月，中共中央发表《对目前时局的宣言》，明确提出（ ）的口号。", "options": [{"label": "A", "text": "打倒蒋介石、解放全中国"}, {"label": "B", "text": "和平、民主、团结"}, {"label": "C", "text": "既联合又斗争"}, {"label": "D", "text": "洗洗脸，治治病"}], "answer": "B", "explain": "1945年8月中共中央发表《对目前时局的宣言》，明确提出和平、民主、团结的口号。A打倒蒋介石是1947年口号，C既联合又斗争是统战策略，D洗洗脸治治病不属此时。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 5, "question": "抗战胜利后，经过重庆谈判国共双方为确认和平建国的基本方针而达成的协议是（ ）。", "options": [{"label": "A", "text": "《政府与中共代表会谈纪要》"}, {"label": "B", "text": "《共同纲领》"}, {"label": "C", "text": "《抗战胜利后的时局和我们的方针》"}, {"label": "D", "text": "中共中央《对目前时局的宣言》"}], "answer": "A", "explain": "重庆谈判国共双方确认和平建国基本方针而达成的协议是《政府与中共代表会谈纪要》（即双十协定）。B《共同纲领》是1949年政协通过的，C、D是中共文件，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 6, "question": "毛泽东赴重庆谈判的目的是（ ）。", "options": [{"label": "A", "text": "结束国共内战"}, {"label": "B", "text": "商讨联合抗日"}, {"label": "C", "text": "寻求外国援助"}, {"label": "D", "text": "争取和平民主"}], "answer": "D", "explain": "毛泽东赴重庆谈判的目的是争取和平民主，揭露蒋介石假和平真内战的面目。A谈判前内战尚未全面爆发，B不是商讨抗日，C寻求外国援助与史实不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 7, "question": "1946年6月底，国民党军以进攻（ ）为起点，挑起全国性的内战。", "options": [{"label": "A", "text": "中原解放区"}, {"label": "B", "text": "华北解放区"}, {"label": "C", "text": "华中解放区"}, {"label": "D", "text": "东北解放区"}], "answer": "A", "explain": "1946年6月底，国民党军队以进攻中原解放区为起点，挑起全国性的内战。B华北、C华中、D东北解放区均非全面内战首先进攻的目标和起点，故不选。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 8, "question": "1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山；陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫皖地区；陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西，三路大军相互策应，机动歼敌，迫使国民党军处于被动地位，这表明（ ）。", "options": [{"label": "A", "text": "人民解放战争进入战略相持阶段"}, {"label": "B", "text": "人民解放战争战略进攻的序幕由此揭开"}, {"label": "C", "text": "人民解放军同国民党军队进行战略决战的时机已经成熟"}, {"label": "D", "text": "人民解放军在数量上已经超过国民党军队"}], "answer": "B", "explain": "1947年6月三路大军挺进并相互策应机动歼敌，揭开了人民解放战争战略进攻的序幕。A进入相持阶段不符，C战略决战时机成熟是1948年，D解放军数量超国民党也是1948年，均不准确。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 9, "question": "1947年10月10日，中国人民解放军总部发表宣言，提出的口号是（ ）。", "options": [{"label": "A", "text": "向北发展、向南防御"}, {"label": "B", "text": "打倒蒋介石、解放全中国"}, {"label": "C", "text": "将革命进行到底"}, {"label": "D", "text": "打过长江去、解放全中国"}], "answer": "B", "explain": "1947年10月10日解放军总部发表宣言提出打倒蒋介石、解放全中国的口号。A向北发展向南防御是抗战胜利后方针，C将革命进行到底是1949年号召，D打过长江去是渡江战役时口号。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 10, "question": "（ ）是一个彻底反封建的土地革命纲领。", "options": [{"label": "A", "text": "《关于土地问题的指示》"}, {"label": "B", "text": "《土地法》"}, {"label": "C", "text": "《中国土地法大纲》"}, {"label": "D", "text": "《关于发展农业生产合作社的决议》"}], "answer": "C", "explain": "《中国土地法大纲》是一个彻底反封建的土地革命纲领，废除了封建剥削土地制度。A《关于土地问题的指示》是过渡性指示，B《土地法》名称不对，D是关于合作社的，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 11, "question": "土地制度改革从根本上摧毁了中国（ ）的根基。", "options": [{"label": "A", "text": "半殖民制度"}, {"label": "B", "text": "宗法制度"}, {"label": "C", "text": "家庭制度"}, {"label": "D", "text": "封建制度"}], "answer": "D", "explain": "土地制度改革从根本上摧毁了中国封建制度的根基，使农民翻身成为土地主人。A半殖民制度、B宗法制度、C家庭制度均非土地改革摧毁的直接对象。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 12, "question": "解放战争时期，第二条战线指国民党统治区（ ）。", "options": [{"label": "A", "text": "以学生运动为先导的人民民主运动"}, {"label": "B", "text": "民主党派斗争"}, {"label": "C", "text": "人民斗争"}, {"label": "D", "text": "各党派联合斗争"}], "answer": "A", "explain": "第二条战线指国民党统治区以学生运动为先导的人民民主运动。B民主党派斗争、C人民斗争、D各党派联合斗争都不能准确概括国统区第二条战线。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 13, "question": "1945年，昆明学生发动了以“反对内战，争取自由”为口号的（ ）。", "options": [{"label": "A", "text": "一二九运动"}, {"label": "B", "text": "一二·一运动"}, {"label": "C", "text": "一二三○运动"}, {"label": "D", "text": "五二○运动"}], "answer": "B", "explain": "1945年昆明学生发动了以反对内战、争取自由为口号的一二·一运动。A一二九运动是1935年，C一二三○运动是1946年，D五二○运动是1947年，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 14, "question": "1946年，北平学生发动的抗议驻华美军暴行的斗争运动是（ ）。", "options": [{"label": "A", "text": "一二九运动"}, {"label": "B", "text": "一二·一运动"}, {"label": "C", "text": "一二三○运动"}, {"label": "D", "text": "五二○运动"}], "answer": "C", "explain": "1946年北平学生发动的抗议驻华美军暴行的斗争是一二三○运动（又称抗暴运动）。A一二九运动、B一二·一运动、D五二○运动时间与性质均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 15, "question": "不以学生为主力的是（ ）。", "options": [{"label": "A", "text": "抗暴运动"}, {"label": "B", "text": "二二八起义"}, {"label": "C", "text": "一二·一运动"}, {"label": "D", "text": "五二〇运动"}], "answer": "B", "explain": "二二八起义以台湾人民为主力反抗国民党暴政，不以学生为主力。A抗暴运动、C一二·一运动、D五二○运动均以学生为主力，故不选。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 16, "question": "中国各民主党派多数成立于（ ）。", "options": [{"label": "A", "text": "大革命时期"}, {"label": "B", "text": "十年内战时期"}, {"label": "C", "text": "抗日战争和解放战争时期"}, {"label": "D", "text": "新中国成立后"}], "answer": "C", "explain": "中国各民主党派多数成立于抗日战争和解放战争时期。A大革命时期、B十年内战时期、D新中国成立后均与多数民主党派成立时间不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 17, "question": "中国有（ ）个民主党派。", "options": [{"label": "A", "text": "6"}, {"label": "B", "text": "7"}, {"label": "C", "text": "8"}, {"label": "D", "text": "9"}], "answer": "C", "explain": "中国共有8个民主党派，包括民革、民盟、民建、民进、农工党、致公党、九三学社、台盟。A6个、B7个、D9个均与这一数量不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 18, "question": "中国共产党对各民主党派的政策是（ ）。", "options": [{"label": "A", "text": "建立爱国统一战线"}, {"label": "B", "text": "积极争取和团结"}, {"label": "C", "text": "建立合作共赢关系"}, {"label": "D", "text": "积极争取进步势力"}], "answer": "B", "explain": "中国共产党对各民主党派的政策是积极争取和团结。A建立爱国统一战线、C建立合作共赢关系、D积极争取进步势力均非对各民主党派政策的准确表述。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 19, "question": "民主党派“中间路线”的实质是（ ）。", "options": [{"label": "A", "text": "旧民主主义道路"}, {"label": "B", "text": "新民主主义道路"}, {"label": "C", "text": "资本主义道路"}, {"label": "D", "text": "民主政治道路"}], "answer": "A", "explain": "民主党派中间路线的实质是旧民主主义道路，即资产阶级共和国方案。B新民主主义道路、C资本主义道路、D民主政治道路均未准确揭示其旧民主主义本质。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 20, "question": "标志着第三条道路破产的事件是（ ）。", "options": [{"label": "A", "text": "1946年6月，蒋介石发动全面内战"}, {"label": "B", "text": "1946年11月，蒋介石下令召开伪国民大会"}, {"label": "C", "text": "1947年3月，蒋介石下令进攻延安"}, {"label": "D", "text": "1947年10月，蒋介石下令解散中国民主同盟"}], "answer": "D", "explain": "1947年10月蒋介石下令解散中国民主同盟，标志着第三条（中间）道路的破产。A1946年6月内战、B1946年11月伪国大、C1947年3月进攻延安均非第三条道路破产标志。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 21, "question": "1949年1月，李济深、沈钧儒等著名民主人士55人联合发表（ ），表示自愿接受中国共产党的领导。", "options": [{"label": "A", "text": "《对目前时局的宣言》"}, {"label": "B", "text": "《和平建国纲领》"}, {"label": "C", "text": "《对时局的意见》"}, {"label": "D", "text": "《国内和平协定》"}], "answer": "C", "explain": "1949年1月李济深、沈钧儒等55人联合发表《对时局的意见》，表示自愿接受中国共产党的领导。A《对目前时局的宣言》、B《和平建国纲领》、D《国内和平协定》均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 22, "question": "1949年元旦，蒋介石发表“求和”声明，其真实意图是（ ）。", "options": [{"label": "A", "text": "希望结束内战"}, {"label": "B", "text": "希望国共两党关系恢复到政协协议的框架下"}, {"label": "C", "text": "与中共和谈，划江而治"}, {"label": "D", "text": "争取时间，准备卷土重来"}], "answer": "D", "explain": "蒋介石1949年元旦求和声明的真实意图是争取时间、准备卷土重来。A希望结束内战、B恢复政协框架、C划江而治都不是其真实目的。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 23, "question": "宣告国民党反动统治覆灭的历史事件是（ ）。", "options": [{"label": "A", "text": "人民解放军取得三大战役的胜利"}, {"label": "B", "text": "中共召开七届二中全会"}, {"label": "C", "text": "人民解放军占领南京"}, {"label": "D", "text": "中华人民共和国成立"}], "answer": "C", "explain": "1949年4月人民解放军占领南京，宣告国民党反动统治的覆灭。A三大战役胜利只是决定性胜利，B七届二中全会是制定方针，D新中国成立稍晚于南京解放，均不直接标志国民党统治覆灭。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 24, "question": "1949年3月，中共七届二中全会召开的地点是（ ）。", "options": [{"label": "A", "text": "西柏坡"}, {"label": "B", "text": "北平"}, {"label": "C", "text": "瓦窑堡"}, {"label": "D", "text": "延安"}], "answer": "A", "explain": "1949年3月中共七届二中全会召开地点是河北省平山县西柏坡。B北平是此后进驻和建都之地，C瓦窑堡、D延安均为更早时期中共活动地点，均非全会会址。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 25, "question": "1949年3月，中共召开（ ），规定了党在全国胜利后在政治、经济、文化、外交方面应当采取的基本政策。", "options": [{"label": "A", "text": "第七次全国代表大会"}, {"label": "B", "text": "七届二中全会"}, {"label": "C", "text": "杨家沟会议"}, {"label": "D", "text": "七届三中全会"}], "answer": "B", "explain": "七届二中全会规定了党在全国胜利后在政治、经济、文化、外交方面应采取的基本政策。A七大是1945年，C杨家沟会议、D七届三中全会均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 26, "question": "1949年3月23日，毛泽东等中央领导人与中央机关、人民解放军总部进驻（ ），标志着中国革命重心从农村转向城市。", "options": [{"label": "A", "text": "天津"}, {"label": "B", "text": "西柏坡"}, {"label": "C", "text": "北平香山"}, {"label": "D", "text": "上海"}], "answer": "C", "explain": "1949年3月23日中共中央机关和解放军总部进驻北平香山，标志着中国革命重心开始从农村转向城市。A天津、B西柏坡、D上海均非当时中央进驻之地。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 27, "question": "1949年6月30日，毛泽东发表了系统阐明中国共产党关于建立新中国主张的（ ）。", "options": [{"label": "A", "text": "《对目前时局的宣言》"}, {"label": "B", "text": "《目前形势和我们的任务》"}, {"label": "C", "text": "《将革命进行到底》"}, {"label": "D", "text": "《论人民民主专政》"}], "answer": "D", "explain": "1949年6月30日毛泽东发表《论人民民主专政》，系统阐明建立新中国的主张。A《对目前时局的宣言》是1945年，B《目前形势和我们的任务》是1947年，C《将革命进行到底》是1949年元旦，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 28, "question": "毛泽东在《论人民民主专政》中指出，人民民主专政的主要基础是（  ）的联盟。", "options": [{"label": "A", "text": "工人阶级和农民阶级"}, {"label": "B", "text": "工人阶级和民族资产阶级"}, {"label": "C", "text": "农民阶级和城市小资产阶级"}, {"label": "D", "text": "城市小资产阶级和民族资产阶级"}], "answer": "A", "explain": "毛泽东在《论人民民主专政》中指出人民民主专政的主要基础是工人阶级和农民阶级的联盟。B工人阶级与民族资产阶级、C农民与城市小资产阶级、D城市小资产阶级与民族资产阶级的联盟均非其主要基础。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 29, "question": "毛泽东在《论人民民主专政》一文中，明确指出人民民主专政需要（ ）领导。", "options": [{"label": "A", "text": "工农联盟"}, {"label": "B", "text": "农民阶级"}, {"label": "C", "text": "工人阶级"}, {"label": "D", "text": "知识分子"}], "answer": "C", "explain": "毛泽东在《论人民民主专政》中指出人民民主专政需要工人阶级来领导。A工农联盟是基础而非领导，B农民阶级、D知识分子不能领导，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 30, "question": "完成创建新中国的任务，由（ ）来承担。", "options": [{"label": "A", "text": "全国人民代表大会"}, {"label": "B", "text": "中国人民政治协商会议"}, {"label": "C", "text": "中共中央政治局会议"}, {"label": "D", "text": "政治协商会议"}], "answer": "B", "explain": "完成创建新中国的任务由中国人民政治协商会议来承担。A全国人民代表大会是1954年才召开，C中共中央政治局会议、D政治协商会议表述笼统，均不符。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 31, "question": "人民政协的召开，标志着中国（ ）。", "options": [{"label": "A", "text": "民族区域自治制度的确立"}, {"label": "B", "text": "工农兵代表大会制度的确立"}, {"label": "C", "text": "人民代表大会制度的确立"}, {"label": "D", "text": "新型政党制度的确立"}], "answer": "D", "explain": "人民政协的召开标志着中国新型政党制度（中国共产党领导的多党合作和政治协商制度）的确立。A民族区域自治制度、B工农兵代表大会制度、C人民代表大会制度均非人民政协召开标志的制度。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 32, "question": "中国民主革命的主要力量是（ ）。", "options": [{"label": "A", "text": "工人、农民、城市小资产阶级群众"}, {"label": "B", "text": "学生、民族资产阶级"}, {"label": "C", "text": "各民主党派"}, {"label": "D", "text": "工人阶级、农民阶级、民族资产阶级"}], "answer": "A", "explain": "中国民主革命的主要力量是工人、农民、城市小资产阶级群众。B学生与民族资产阶级、C各民主党派、D仅工人农民民族资产阶级均表述不完整或不准确。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "single", "id": 33, "question": "中国新民主主义革命胜利的基本经验中，最重要的一条是（ ）。", "options": [{"label": "A", "text": "坚持人民民主专政"}, {"label": "B", "text": "坚持革命统一战线"}, {"label": "C", "text": "坚持中国共产党的领导"}, {"label": "D", "text": "坚持农村包围城市、武装夺取政权"}], "answer": "C", "explain": "新民主主义革命胜利的基本经验中最重要的一条是坚持中国共产党的领导。A人民民主专政、B革命统一战线、D农村包围城市武装夺取政权虽重要但非最重要一条。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 1, "question": "抗战胜利后的政治形势对中国人民实现建设新中国的目标有利，表现在（ ）。", "options": [{"label": "A", "text": "帝国主义势力遭到削弱"}, {"label": "B", "text": "社会主义国家、民族解放运动的力量有了新发展"}, {"label": "C", "text": "中国人民的觉悟程度和组织程度空前提高"}, {"label": "D", "text": "中国共产党达到了高度的团结统一"}], "answer": "ABCD", "explain": "正确答案ABCD。抗战胜利后帝国主义势力削弱、社会主义国家与民族解放运动力量发展、中国人民觉悟组织程度提高、中共高度团结统一，均有利于实现建设新中国目标。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 2, "question": "二战结束后，美国在中国追求的长远目标和短期目标分别是（ ）。", "options": [{"label": "A", "text": "推动建立一个稳定、统一的亲美政府"}, {"label": "B", "text": "阻止共产党完全控制中国"}, {"label": "C", "text": "在中国倾销商品、获取廉价原料"}, {"label": "D", "text": "遏制苏联以防中共和苏联结盟"}], "answer": "AB", "explain": "正确答案AB。美国在华长远目标是推动建立稳定统一的亲美政府，短期目标是阻止共产党完全控制中国。C倾销商品获取原料、D遏制苏联以防中苏结盟均非题目所述目标。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 3, "question": "抗战胜利后，蒋介石表示愿意与中共进行和平谈判的目的在于（ ）。", "options": [{"label": "A", "text": "有感于中国百余年的战乱不断，希望中国实现和平统一"}, {"label": "B", "text": "敷衍国内外舆论，掩盖其正在进行的内战准备"}, {"label": "C", "text": "如果谈判不成就放手发动内战，并把战争责任转嫁给中共"}, {"label": "D", "text": "诱使中共交出人民军队和解放区政权，以期不战而控制全中国"}], "answer": "BCD", "explain": "正确答案BCD。蒋介石愿谈判是为敷衍舆论掩盖内战准备、转嫁战争责任、诱使中共交出军队政权。A有感战乱希望和平统一并非其真实意图，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 4, "question": "抗战胜利后，中共为实现和平建国，在《对目前时局的宣言》中明确提出（ ）。", "options": [{"label": "A", "text": "和平"}, {"label": "B", "text": "统一"}, {"label": "C", "text": "民主"}, {"label": "D", "text": "团结"}], "answer": "ACD", "explain": "正确答案ACD。1945年8月中共发表《对目前时局的宣言》，明确提出和平、民主、团结三大口号。B统一并不属于这三大口号之一，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 5, "question": "1946年1月，政治协商会议在重庆召开，出席会议的有（ ）和无党派人士代表。", "options": [{"label": "A", "text": "国民党"}, {"label": "B", "text": "共产党"}, {"label": "C", "text": "青年党"}, {"label": "D", "text": "中国民主同盟"}], "answer": "ABCD", "explain": "正确答案ABCD。1946年1月政治协商会议在重庆召开，出席会议的代表包括国民党、共产党、青年党、中国民主同盟和无党派人士，四项均正确，故全选。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 6, "question": "全面内战爆发后，毛泽东指出：我们能够打败蒋介石，是因为（ ）。", "options": [{"label": "A", "text": "人民解放战争具有爱国性、正义性和革命性"}, {"label": "B", "text": "蒋介石发动的战争具有反人民性质"}, {"label": "C", "text": "国民党军队内部离心离德以至战斗力低下"}, {"label": "D", "text": "蒋介石军事力量的优势和美国的援助只是临时起作用"}], "answer": "ABD", "explain": "正确答案ABD。我们能够打败蒋介石是因为战争具有正义性、蒋战争反人民、其军事优势和美援只是临时起作用。C国军离心离得以致战斗力低下不是毛所论理由，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 7, "question": "1947年，国民党军队重点进攻的解放区是（ ）。", "options": [{"label": "A", "text": "中原解放区"}, {"label": "B", "text": "东北解放区"}, {"label": "C", "text": "陕北解放区"}, {"label": "D", "text": "山东解放区"}], "answer": "CD", "explain": "正确答案CD。1947年国民党军队对陕甘宁边区（陕北）解放区和山东解放区实施重点进攻。A中原解放区、B东北解放区均非当年重点进攻的目标，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 8, "question": "在1947年，首先将战争引向国民党统治区域并相互策应的三路大军是（ ）。", "options": [{"label": "A", "text": "刘伯承、邓小平率领的晋冀鲁豫野战军主力"}, {"label": "B", "text": "林彪、罗荣桓率领的东北民主联军"}, {"label": "C", "text": "陈毅、粟裕指挥的华东野战军主力"}, {"label": "D", "text": "陈赓、谢富治指挥的晋冀鲁豫野战军一部"}], "answer": "ACD", "explain": "正确答案ACD。三路大军是刘邓晋冀鲁豫野战军主力、陈粟华东野战军主力、陈谢晋冀鲁豫野战军一部。B林罗东北民主联军不在三路大军中，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 9, "question": "解放战争时期，中国共产党颁布的土地纲领有（ ）。", "options": [{"label": "A", "text": "《土地管理法》"}, {"label": "B", "text": "《关于土地问题的指示》"}, {"label": "C", "text": "《中国土地法大纲》"}, {"label": "D", "text": "《中华苏维埃共和国土地法》"}], "answer": "BC", "explain": "正确答案BC。解放战争时期中共颁布的土地纲领是《关于土地问题的指示》（五四指示）和《中国土地法大纲》。A《土地管理法》、D《中华苏维埃共和国土地法》均非此期纲领。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 10, "question": "1947年7月至9月制定和通过的《中国土地法大纲》，明确规定（ ）。", "options": [{"label": "A", "text": "废除封建性及半封建性剥削的土地制度"}, {"label": "B", "text": "实行耕者有其田的土地制度"}, {"label": "C", "text": "不分男女，统一分配土地，抽多补少，抽肥补瘦"}, {"label": "D", "text": "没收富农全部的土地及财产"}], "answer": "AB", "explain": "正确答案AB。《中国土地法大纲》规定废除封建性及半封建性剥削的土地制度、实行耕者有其田的土地制度。C抽多补少等为细分做法，D没收富农全部土地财产不符大纲规定，均不选。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 11, "question": "导致国民党迅速失去民心的主要原因，在于国民党（ ）。", "options": [{"label": "A", "text": "代表大地主、大资产阶级的利益"}, {"label": "B", "text": "执行反人民的内战政策"}, {"label": "C", "text": "勾结美帝国主义"}, {"label": "D", "text": "违背全国人民迫切要求休养生息、和平建国的意愿"}], "answer": "BD", "explain": "正确答案BD。国民党失去民心主要因其执行反人民的内战政策、违背人民休养生息和平建国的意愿。A代表大地主大资产阶级、C勾结美帝虽为事实，但非题目要点。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 12, "question": "解放战争时期，在国民党统治区爆发的爱国学生运动有（ ）。", "options": [{"label": "A", "text": "城市抢米风潮"}, {"label": "B", "text": "一二·一运动"}, {"label": "C", "text": "一二三○运动"}, {"label": "D", "text": "五二○运动"}], "answer": "BCD", "explain": "正确答案BCD。国统区爱国学生运动有一二·一运动、一二三○运动、五二○运动。A城市抢米风潮是群众自发经济斗争，非学生运动，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 13, "question": "解放战争时期，构成反蒋第二条战线的国统区人民民主运动有（ ）。", "options": [{"label": "A", "text": "城市抢米风潮"}, {"label": "B", "text": "一二·一运动"}, {"label": "C", "text": "一二三○运动"}, {"label": "D", "text": "五二○运动"}], "answer": "ABCD", "explain": "正确答案ABCD。构成反蒋第二条战线的国统区人民民主运动包括城市抢米风潮、一二·一运动、一二三○运动、五二○运动，四项均属。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 14, "question": "中国的民主党派，多数成立于（ ）。", "options": [{"label": "A", "text": "大革命时期"}, {"label": "B", "text": "土地革命战争时期"}, {"label": "C", "text": "抗日战争时期"}, {"label": "D", "text": "全国解放战争时期"}], "answer": "CD", "explain": "正确答案CD。中国的民主党派多数是在抗日战争时期和全国解放战争时期成立的。A大革命时期、B土地革命战争时期并非多数民主党派的成立时间，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 15, "question": "中国各民主党派形成时的社会基础，主要是（ ）。", "options": [{"label": "A", "text": "民族资产阶级"}, {"label": "B", "text": "城市小资产阶级"}, {"label": "C", "text": "知识分子"}, {"label": "D", "text": "其他爱国分子"}], "answer": "ABCD", "explain": "正确答案ABCD。中国各民主党派形成时的社会基础主要是民族资产阶级、城市小资产阶级以及与这些阶级相联系的知识分子和其他爱国分子，四项均属于此范围。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 16, "question": "各民主党派政纲的共同点是（ ）。", "options": [{"label": "A", "text": "主张团结、反对分裂"}, {"label": "B", "text": "主张爱国、反对卖国"}, {"label": "C", "text": "主张和平、反对内战"}, {"label": "D", "text": "主张民主、反对独裁"}], "answer": "BD", "explain": "正确答案BD。各民主党派政纲的共同点是主张爱国反对卖国、主张民主反对独裁。A主张团结反对分裂、C主张和平反对内战虽符合其倾向，但非政纲共同点。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 17, "question": "全国解放战争时期，各民主党派与中国共产党的团结合作主要表现在（ ）。", "options": [{"label": "A", "text": "同共产党一起反对国民党的内战、独裁政策，为和平民主而奔走呼号"}, {"label": "B", "text": "积极参加和支持国民党统治区的爱国民主运动"}, {"label": "C", "text": "拒绝参加国民党一手包办的伪“国民大会”，反对国民党炮制的伪“宪法”"}, {"label": "D", "text": "同共产党一道为推翻国民党的反动统治建立新中国而共同奋斗"}], "answer": "ABCD", "explain": "正确答案ABCD。民主党派与中共团结合作表现为反对内战独裁、支持爱国民主运动、拒绝伪国大、共同推翻国民党统治，四项均正确。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 18, "question": "1949年1月22日，李济深、沈钧儒等民主党派的领导人和著名的无党派民主人士55人联合发表《对时局的意见》，表示（ ）。", "options": [{"label": "A", "text": "一致拥护中国共产党提出的召开政治协商会议的主张"}, {"label": "B", "text": "一致拥护中国共产党提出的成立联合政府的主张"}, {"label": "C", "text": "愿在中共领导下，献其绵薄，共策进行"}, {"label": "D", "text": "中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导"}], "answer": "ABCD", "explain": "正确答案ABCD。1949年1月22日《对时局的意见》表示拥护召开政协与成立联合政府、愿在中共领导下并公开接受中共领导，四项均正确。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 19, "question": "从1948年9月至1949年1月，中国人民解放军发动的三大战役是（ ）。", "options": [{"label": "A", "text": "渡江战役"}, {"label": "B", "text": "平津战役"}, {"label": "C", "text": "辽沈战役"}, {"label": "D", "text": "淮海战役"}], "answer": "BCD", "explain": "正确答案BCD。三大战役指从1948年9月至1949年1月进行的辽沈战役、淮海战役、平津战役。A渡江战役发生于1949年4月，不属三大战役，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 20, "question": "《论人民民主专政》一文指出，人民民主专政的基础是（ ）的联盟。", "options": [{"label": "A", "text": "工人阶级"}, {"label": "B", "text": "农民阶级"}, {"label": "C", "text": "知识分子"}, {"label": "D", "text": "城市小资产阶级"}], "answer": "ABD", "explain": "正确答案ABD。人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟。C知识分子不在这一基础联盟表述中，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 21, "question": "《中国人民政治协商会议共同纲领》的基础是（ ）。", "options": [{"label": "A", "text": "《论人民民主专政》"}, {"label": "B", "text": "《对时局的意见》"}, {"label": "C", "text": "《新民主主义论》"}, {"label": "D", "text": "中共七届二中全会决议"}], "answer": "AD", "explain": "正确答案AD。《共同纲领》的基础是《论人民民主专政》和中共七届二中全会决议。B《对时局的意见》、C《新民主主义论》均非直接基础。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 22, "question": "1949年3月召开的中共七届二中全会的主要内容是（ ）。", "options": [{"label": "A", "text": "规定了党在全国胜利后应当采取的基本政策"}, {"label": "B", "text": "指出了中国由农业国转变为工业国的发展方向"}, {"label": "C", "text": "指出了中国由新民主主义社会转变为社会主义社会的发展方向"}, {"label": "D", "text": "提出了“两个务必”的要求"}], "answer": "ABCD", "explain": "正确答案ABCD。中共七届二中全会的主要内容是规定全国胜利后的基本政策、指出由农业国转向工业国的发展方向、指出由新民主主义社会转向社会主义社会，并提出两个务必。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 23, "question": "在七届二中全会上，毛泽东提出的“两个务必”是（ ）。", "options": [{"label": "A", "text": "务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风"}, {"label": "B", "text": "务必使同志们继续地保持艰苦奋斗的作风"}, {"label": "C", "text": "务必使同志们继续地保持密切联系群众的作风"}, {"label": "D", "text": "务必使同志们继续地保持团结协作的作风"}], "answer": "AB", "explain": "正确答案AB。毛泽东提出的两个务必是保持谦虚谨慎不骄不躁和艰苦奋斗的作风。C密切联系群众、D团结协作均非两个务必内容，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 24, "question": "中国新民主主义革命取得胜利的原因（ ）。", "options": [{"label": "A", "text": "工人、农民、城市小资产阶级群众是民主革命的主要力量"}, {"label": "B", "text": "各民主党派和无党派民主人士、各少数民族、爱国知识分子和华侨发挥积极的作用"}, {"label": "C", "text": "中国共产党的坚强领导"}, {"label": "D", "text": "国际无产阶级和人民群众的支持"}], "answer": "ABCD", "explain": "正确答案ABCD。中国新民主主义革命取得胜利的原因包括工人农民城市小资产阶级群众是主要力量、各民主党派和爱国人士发挥积极作用、中国共产党坚强领导、国际无产阶级和人民群众的支持。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "multi", "id": 25, "question": "中国革命的胜利，为实现（ ），实现中华民族伟大复兴，开辟了广阔道路。", "options": [{"label": "A", "text": "民族独立"}, {"label": "B", "text": "人民解放"}, {"label": "C", "text": "国家富强"}, {"label": "D", "text": "人民幸福"}], "answer": "CD", "explain": "正确答案CD。中国革命的胜利为实现民族独立、人民解放、国家富强、人民幸福开辟道路，其中直接对应此空白的是国家富强、人民幸福。A民族独立、B人民解放已在革命胜利时实现，故排除。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 1, "question": "抗战胜利后，国民党统治集团的根本目标是使中国恢复到战前的状态，继续走资本主义发展道路。", "answer": false, "explain": "错误。国民党统治集团抗战胜利后的根本目标是维护以蒋介石为代表的大地主大资产阶级的独裁统治，并非使中国恢复战前状态走资本主义道路。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 2, "question": "1946年6月26日，国民党进攻中原解放区，标志着全面内战爆发。", "answer": true, "explain": "正确。1946年6月26日，国民党军队大举进攻中原解放区，标志着国共全面内战至此正式爆发，蒋介石彻底撕毁了双十协定和政协决议。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 3, "question": "1947年6月，刘伯承、邓小平率军实施中央突破，千里跃进大别山，由此拉开人民解放战争战略进攻的序幕。", "answer": true, "explain": "正确。1947年6月底，刘伯承、邓小平率晋冀鲁豫野战军主力千里跃进大别山，揭开了人民解放战争从战略防御转入战略进攻的序幕。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 4, "question": "《中国土地法大纲》是中国共产党制定和颁布的第一个土地改革法令，为打败蒋介石、建立新中国的奠定了深厚的群众基础。", "answer": false, "explain": "错误。《中国土地法大纲》并非中共第一个土地法令，此前已有《井冈山土地法》（1928年）、《兴国土地法》（1929
