年）等。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 5, "question": "国统区第二条战线的形成和发展，表明不仅在军事战线上，而且在政治战线上，国民党都打了败仗。", "answer": true, "explain": "正确。国统区第二条战线的形成和发展，表明国民党不仅在军事战线上节节败退，而且在政治战线上也失去了民心，两条战线都打了败仗。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 6, "question": "中国各民主党派形成时的社会基础，主要是大资产阶级、民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他爱国分子。", "answer": false, "explain": "错误。中国各民主党派形成时的社会基础主要是民族资产阶级、城市小资产阶级以及相联系的知识分子和其他爱国分子，并不包括代表反动统治的大资产阶级。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 7, "question": "抗战胜利后，某些民主党派的领导人曾经鼓吹的“中间路线”，实质上就是资产阶级共和国方案，是旧民主主义的道路。", "answer": true, "explain": "正确。抗战胜利后，某些民主党派的领导人曾经鼓吹走中间路线，其实质就是在中国建立资产阶级共和国，也就是走旧民主主义的道路，这在中国行不通。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 8, "question": "解放战争时期的三大战役是指辽沈战役、平津战役和渡江战役。", "answer": false, "explain": "错误。解放战争的三大战役是指辽沈战役、淮海战役、平津战役；渡江战役发生于1949年4月，属于渡江战役范畴，并不属于三大战役之列。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 9, "question": "1949年9月召开的人民政协决定以五星红旗为国旗、《义勇军进行曲》为国歌。", "answer": false, "explain": "错误。1949年人民政协决定以五星红旗为国旗，而以《义勇军进行曲》为国歌的决议是2004年才正式确定的，当时为暂代国歌。"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 10, "question": "中国革命胜利的根本原因在于中国共产党的领导。", "answer": true, "explain": "正确。中国新民主主义革命能够取得最终胜利，最根本的原因在于有着中国共产党的坚强、正确的领导，这是历史和实践得出的最重要的一条经验。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 1, "question": "1949年中华人民共和国成立，标志着中国进入了（ ）。", "options": [{"label": "A", "text": "社会主义社会"}, {"label": "B", "text": "新民主主义社会"}, {"label": "C", "text": "资本主义社会"}, {"label": "D", "text": "共产主义社会"}], "answer": "B", "explain": "1949年中华人民共和国成立，标志着中国进入了新民主主义社会。A社会主义社会是1956年改造完成后才进入，C资本主义社会、D共产主义社会均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 2, "question": "1953年9月，彭德怀在一份报告中说，抗美援朝战争的胜利证明：西方侵略者几百年来只要在东方一个海岸上架起几尊大炮就可霸占一个国家的时代一去不复返了。这场战争的胜利（ ）。", "options": [{"label": "A", "text": "结束了西方列强霸权主义的历史"}, {"label": "B", "text": "打破了美国军队不可战胜的神话"}, {"label": "C", "text": "奠定了民族独立人民解放的基础"}, {"label": "D", "text": "赢得了近代以来中华民族反抗外敌入侵的第一次完全胜利"}], "answer": "B", "explain": "抗美援朝战争的胜利打破了美国军队不可战胜的神话。A并未结束西方霸权主义，C民族独立人民解放是建国时实现，D第一次完全胜利是抗日战争，均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 3, "question": "毛泽东提出：“在打倒地主阶级和官僚资产阶级以后，中国内部的主要矛盾即是工人阶级与民族资产阶级的矛盾，故不应再将民族资产阶级称为中间阶级。”毛泽东的这一论断发表于（ ）。", "options": [{"label": "A", "text": "新中国成立时"}, {"label": "B", "text": "社会主义改造基本完成后"}, {"label": "C", "text": "民主革命遗留任务完成时"}, {"label": "D", "text": "党的七届三中全会召开前夕"}], "answer": "C", "explain": "毛泽东关于主要矛盾转变的论断发表于民主革命遗留任务基本完成时（1952年底）。A新中国成立时、B社会主义改造完成后、D七届三中全会前夕均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 4, "question": "新中国成立初期，除了人民解放军在前线的胜利之外，中央人民政府为人民所作的最大一件工作是（ ）。", "options": [{"label": "A", "text": "镇压反革命"}, {"label": "B", "text": "稳定物价和统一财政工作"}, {"label": "C", "text": "“三反”运动"}, {"label": "D", "text": "“五反”运动"}], "answer": "B", "explain": "新中国成立初期中央人民政府为人民所作最大一件工作是稳定物价和统一财政工作，使国家经济站稳脚跟。A镇压反革命、C三反、D五反运动均非此期最大工作。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 5, "question": "朝鲜战争爆发后，美国实施哪项政策公然干涉中国内政？（ ）。", "options": [{"label": "A", "text": "宣布武装援助南朝鲜（韩国）"}, {"label": "B", "text": "命令驻日本的美国远东空军协助韩国作战"}, {"label": "C", "text": "授意日本向朝鲜战场秘密派出扫雷部队"}, {"label": "D", "text": "派遣第七舰队侵入台湾海峡"}], "answer": "D", "explain": "朝鲜战争爆发后美国派遣第七舰队侵入台湾海峡，公然干涉中国内政。A援助韩国、B协助韩国作战、C授意日本扫雷均属对朝鲜半岛的军事行动，非干涉中国内政。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 6, "question": "没收（ ）归人民的国家所有，是新民主主义革命的三大经济纲领之一，是《共同纲领》规定的一项历史任务。", "options": [{"label": "A", "text": "官僚资本"}, {"label": "B", "text": "地主土地"}, {"label": "C", "text": "资本家土地"}, {"label": "D", "text": "一切公用土地"}], "answer": "A", "explain": "没收官僚资本归人民的国家所有，是新民主主义革命三大经济纲领之一。B地主土地是没收给农民，C资本家土地、D一切公用土地表述均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 7, "question": "（ ）是国家独立富强的首要条件。", "options": [{"label": "A", "text": "农业改造"}, {"label": "B", "text": "社会主义工业化"}, {"label": "C", "text": "社会主义现代化"}, {"label": "D", "text": "手工业改造"}], "answer": "B", "explain": "社会主义工业化是国家独立富强的首要条件，只有实现工业化才能巩固国防、提高人民生活水平。A农业改造、C社会主义现代化、D手工业改造均非国家独立富强的首要条件。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 8, "question": "中国共产党制定的过渡时期总路线的主体是（ ）。", "options": [{"label": "A", "text": "实现国家对个体农业的社会主义改造"}, {"label": "B", "text": "实现国家对个体手工业的社会主义改造"}, {"label": "C", "text": "实现国家对资本主义工商业的社会主义改造"}, {"label": "D", "text": "实现国家的社会主义工业化"}], "answer": "D", "explain": "过渡时期总路线的核心主体是实现国家的社会主义工业化。A农业改造、B手工业改造、C资本主义工商业改造只是总路线的两翼，服务于工业化主体，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 9, "question": "所谓农业合作化，就是在中国共产党领导下，通过各种互助合作的方式，把以生产资料私有制为基础的个体农业经济，改造为以生产资料公有制为基础的农业合作经济的过程。1953年到1956年我国实行农业合作化的主要原因是（ ）。", "options": [{"label": "A", "text": "封建土地制度严重阻碍生产力的发展"}, {"label": "B", "text": "按苏联模式建设社会主义"}, {"label": "C", "text": "小农经济难以满足国民经济发展的需要"}, {"label": "D", "text": "一些领导人片面强调公有化的作用"}], "answer": "C", "explain": "1953到1956年实行农业合作化的主要原因是小农经济难以满足国民经济（尤其工业化）发展的需要。A封建土地制度已被废除，B按苏联模式、D领导人片面强调公有化均非主要原因。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 10, "question": "对资产阶级实行赎买，是（ ）提出的设想。", "options": [{"label": "A", "text": "马克思、恩格斯"}, {"label": "B", "text": "列宁"}, {"label": "C", "text": "毛泽东"}, {"label": "D", "text": "斯大林"}], "answer": "A", "explain": "对资产阶级实行和平赎买，最早是马克思、恩格斯提出的设想。B列宁、C毛泽东、D斯大林都在实践中有所发展和运用，但最初设想者应是马克思、恩格斯。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 11, "question": "新中国成立后，毛泽东多次发表讲话，强调实现国家工业化的重要性，他曾说：\"没有工业，便没有巩固的国防，便没有人民的福利，便没有国家的富强。\"与此同时，毛泽东也清醒地认识到实现国家工业化并不是一蹴而就的，而是需要一定的条件，其中，保证工业发展、实现国家工业化的一个必要条件是（ ）。", "options": [{"label": "A", "text": "比较强大的国营经济力量"}, {"label": "B", "text": "国家资本主义经济有一定程度的发展"}, {"label": "C", "text": "社会主义性质的国营经济力量相对来说比较强大"}, {"label": "D", "text": "对个体农业进行社会主义改造"}], "answer": "D", "explain": "保证工业发展、实现国家工业化的一个必要条件是必须对个体农业进行社会主义改造。A国营经济较强、B国家资本主义发展、C国营经济相对较强均非该必要条件表述。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 12, "question": "对资本主义工商业进行社会主义改造，实行的是（ ）。", "options": [{"label": "A", "text": "和平赎买政策"}, {"label": "B", "text": "没收政策"}, {"label": "C", "text": "改造政策"}, {"label": "D", "text": "统购统销政策"}], "answer": "A", "explain": "对资本主义工商业进行社会主义改造实行的是和平赎买政策。B没收政策是对官僚资本，C改造政策、D统购统销政策均非对待资本主义工商业的准确政策表述。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 13, "question": "我国进入社会主义社会的最主要标志是（ ）。", "options": [{"label": "A", "text": "社会主义改造的完成"}, {"label": "B", "text": "发展国民经济第一个五年计划的制定"}, {"label": "C", "text": "第一届全国人民代表大会的召开"}, {"label": "D", "text": "中华人民共和国的成立"}], "answer": "A", "explain": "我国进入社会主义社会的最主要标志是社会主义改造的基本完成。B一五计划制定、C一届全国人大召开、D新中国成立均非进入社会主义社会的最主要标志。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 14, "question": "1954年9月，中华人民共和国第一届全国人民代表大会第一次会议讨论通过了（ ）。", "options": [{"label": "A", "text": "《中国人民政治协商会议共同纲领》"}, {"label": "B", "text": "《中国民主同盟一届三中全会宣言》"}, {"label": "C", "text": "《中国土地法大纲》"}, {"label": "D", "text": "《中华人民共和国宪法》"}], "answer": "D", "explain": "1954年9月一届全国人大一次会议讨论通过了《中华人民共和国宪法》。A《共同纲领》是1949年政协通过的临时宪法，B、C均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 15, "question": "中华人民共和国成立、社会主义制度的建立（ ）。", "options": [{"label": "A", "text": "是中华民族有史以来最为广泛而深刻的社会变革"}, {"label": "B", "text": "成功开创了中国特色社会主义"}, {"label": "C", "text": "中华民族迎来了从富起来到强起来的伟大飞跃"}, {"label": "D", "text": "是决定当代中国前途命运的关键一招"}], "answer": "A", "explain": "中华人民共和国成立、社会主义制度的建立是中华民族有史以来最为广泛而深刻的社会变革。B开创中国特色社会主义是改革开放后，C富起来到强起来是新时代，D关键一招是改革开放，均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 16, "question": "我国最早成立的民族自治区是（ ）。", "options": [{"label": "A", "text": "新疆维吾尔自治区"}, {"label": "B", "text": "内蒙古自治区"}, {"label": "C", "text": "广西壮族自治区"}, {"label": "D", "text": "宁夏回族自治区"}], "answer": "B", "explain": "我国最早成立的民族自治区是1947年成立的内蒙古自治区。A新疆1955年、C广西1958年、D宁夏1958年，均晚于内蒙古。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 17, "question": "1956年4月，毛泽东提出把马克思列宁主义基本原理同中国具体实际进行“第二次结合”，其目的是（ ）。", "options": [{"label": "A", "text": "找出在中国怎样建设社会主义的道路"}, {"label": "B", "text": "加强中国共产党的自身建设"}, {"label": "C", "text": "为社会主义改造创造条件"}, {"label": "D", "text": "全面建设社会主义现代化强国"}], "answer": "A", "explain": "1956年4月毛泽东提出第二次结合的目的是找出在中国怎样建设社会主义的道路。B加强党建、C为改造创造条件、D建设现代化强国均非其直接目的。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 18, "question": "1954年中华人民共和国第一届全国人民代表大会讨论通过了《中华人民共和国宪法》，标志着（ ）制度这一新中国根本政治制度从此确立。", "options": [{"label": "A", "text": "政治协商"}, {"label": "B", "text": "民族区域自治"}, {"label": "C", "text": "人民代表大会"}, {"label": "D", "text": "无产阶级专政"}], "answer": "C", "explain": "1954年一届全国人大通过宪法，标志着人民代表大会制度这一根本政治制度的确立。A政治协商、B民族区域自治、D无产阶级专政均非此所确立的根本政治制度。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 19, "question": "中共八大指出，社会主义改造基本完成后我国国内的主要矛盾是（ ）。", "options": [{"label": "A", "text": "社会主义道路和资本主义道路的矛盾"}, {"label": "B", "text": "无产阶级和资产阶级的矛盾"}, {"label": "C", "text": "社会主义工业化与小农经济的矛盾"}, {"label": "D", "text": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}], "answer": "D", "explain": "中共八大指出社会主义改造基本完成后国内主要矛盾是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要之间的矛盾。A、B、C所列矛盾均属过渡时期或改造前的矛盾。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 20, "question": "1956年，中国共产党第八次全国代表大会在北京开幕，会议明确了全党全国人民的主要任务是（ ）。", "options": [{"label": "A", "text": "建立社会主义制度"}, {"label": "B", "text": "发展生产力"}, {"label": "C", "text": "加强党的建设"}, {"label": "D", "text": "阶级斗争"}], "answer": "B", "explain": "中共八大明确全党全国人民的主要任务是集中力量发展生产力。A建立社会主义制度已于1956年基本完成，C加强党建、D阶级斗争均非八大确立的主要任务。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 21, "question": "以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志是（ ）。", "options": [{"label": "A", "text": "《论十大关系》的报告"}, {"label": "B", "text": "中共八大路线的制定"}, {"label": "C", "text": "《关于正确处理人民内部矛盾的问题》的发表"}, {"label": "D", "text": "《论人民民主专政》"}], "answer": "A", "explain": "《论十大关系》的发表，标志着以毛泽东为代表的中国共产党人开始探索中国自己的社会主义建设道路。B中共八大路线制定、C《关于正确处理人民内部矛盾的问题》发表均在此之后展开，D《论人民民主专政》是建国前。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 22, "question": "新中国的工业化是在苏联的影响下起步的。走中国工业化道路，是中国共产党初步探索我国社会主义建设道路的一个重要思想。当时所讲的工业化道路问题，主要是指（ ）。", "options": [{"label": "A", "text": "中央和地方的关系问题"}, {"label": "B", "text": "经济建设和国防建设的关系问题"}, {"label": "C", "text": "重工业、轻工业和农业的发展关系问题"}, {"label": "D", "text": "沿海工业和内地工业的关系问题"}], "answer": "C", "explain": "当时所讲的工业化道路问题主要指重工业、轻工业和农业的发展关系问题。A中央与地方、B经济与国防、D沿海与内地关系虽在《论十大关系》中提及，但非工业化道路的核心所指。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 23, "question": "1956年4月初，毛泽东提出，最重要的是要（ ），把马列主义的基本原理同中国革命和建设的具体实际相结合。", "options": [{"label": "A", "text": "独立思考"}, {"label": "B", "text": "艰苦奋斗"}, {"label": "C", "text": "戒骄戒躁"}, {"label": "D", "text": "改革开放"}], "answer": "A", "explain": "1956年4月毛泽东提出最重要的是要独立思考，把马列主义基本原理同中国革命和建设具体实际相结合。B艰苦奋斗、C戒骄戒躁、D改革开放均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 24, "question": "毛泽东指出，社会主义社会的基本矛盾是（ ）。", "options": [{"label": "A", "text": "人民对于建立先进的工业国的要求同落后的农业国现实之间的矛盾"}, {"label": "B", "text": "无产阶级和资产阶级的矛盾"}, {"label": "C", "text": "人民内部矛盾"}, {"label": "D", "text": "生产力与生产关系、经济基础与上层建筑之间的矛盾"}], "answer": "D", "explain": "毛泽东指出社会主义社会的基本矛盾是生产力与生产关系、经济基础与上层建筑之间的矛盾。A建立工业国要求与农业国现实、B无产阶级与资产阶级、C人民内部矛盾均非基本矛盾的正确表述。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 25, "question": "1964年底，周恩来在三届全国人大一次会议上郑重提出“四个现代化”的历史任务，即“在不太长的历史时期内，把我国建设成为一个具有（ ）的社会主义强国，赶上和超过世界先进水平”。", "options": [{"label": "A", "text": "现代农业、现代工业、现代经济和现代交通运输业"}, {"label": "B", "text": "现代农业、现代工业、现代国防和现代科学技术"}, {"label": "C", "text": "现代农业、现代工业、现代国防和现代科学文化"}, {"label": "D", "text": "现代农业、现代工业、现代科学文化和现代交通运输业"}], "answer": "B", "explain": "1964年底周恩来提出四个现代化指现代农业、现代工业、现代国防和现代科学技术。A含现代经济与现代交通运输业、C含现代科学文化、D含现代科学文化与现代交通运输业，均不符。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 26, "question": "“文化大革命”结束的标志是（ ）。", "options": [{"label": "A", "text": "粉碎林彪反革命集团"}, {"label": "B", "text": "《评新编历史剧<海瑞罢官>》发表"}, {"label": "C", "text": "毛泽东逝世"}, {"label": "D", "text": "粉碎“四人帮”"}], "answer": "D", "explain": "1976年10月粉碎四人帮，标志着文化大革命的结束。A粉碎林彪集团是1971年，B《海瑞罢官》是文革导火索发文，C毛泽东逝世是1976年9月，均非文革结束标志。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 27, "question": "人民公社化运动对我国国民经济造成严重伤害，其错误的实质是（ ）。", "options": [{"label": "A", "text": "破坏正常的市场秩序"}, {"label": "B", "text": "生产关系的调整脱离了生产力的实际水平"}, {"label": "C", "text": "影响人民生活水平的提升"}, {"label": "D", "text": "没有注意到生态环境的保护"}], "answer": "B", "explain": "人民公社化运动错误的实质是生产关系的调整脱离了生产力的实际水平。A破坏市场秩序、C影响生活水平、D未注意生态保护都是表象，非错误实质。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 28, "question": "20世纪70年代初，毛泽东、周恩来抓住时机在中美关系上发起了（ ）。", "options": [{"label": "A", "text": "排球外交"}, {"label": "B", "text": "围棋外交"}, {"label": "C", "text": "乒乓外交"}, {"label": "D", "text": "篮球外交"}], "answer": "C", "explain": "20世纪70年代初毛泽东、周恩来抓住时机在中美关系上发起乒乓外交。A排球外交、B围棋外交、D篮球外交均非中美破冰的外交形式。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 29, "question": "1958年社会主义建设总路线的缺点是（ ）。", "options": [{"label": "A", "text": "反应了人民迫切要求改变落后状况的愿望"}, {"label": "B", "text": "忽视客观经济规律"}, {"label": "C", "text": "提出了多快好省的说法"}, {"label": "D", "text": "强调了发展速度"}], "answer": "B", "explain": "1958年社会主义建设总路线的缺点是忽视客观经济规律，片面追求高速度。A反映人民愿望是其积极一面，C提出多快好省、D强调发展速度虽体现其内容，但缺点核心是忽视规律。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 30, "question": "1961年1月，中共召开八届九中全会。全会决定了从1961年起在两三年内对国民经济实行的方针，这是党在经济工作指导方针上的重大转变。中共八届九中全会决定对国民经济实行的方针是（ ）。", "options": [{"label": "A", "text": "调整、巩固、充实、提高"}, {"label": "B", "text": "以农业为基础、以工业为主导"}, {"label": "C", "text": "在综合平衡中稳步前进"}, {"label": "D", "text": "既反保守又反冒进"}], "answer": "A", "explain": "中共八届九中全会决定对国民经济实行调整、巩固、充实、提高的方针。B以农业为基础工业为主导、C综合平衡中稳步前进、D既反保守又反冒进均非八届九中全会方针。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 1, "question": "新民主主义社会的基本矛盾是（ ）。", "options": [{"label": "A", "text": "国际上是新中国同帝国主义的矛盾"}, {"label": "B", "text": "封建主义和人民大众的矛盾"}, {"label": "C", "text": "国内是工人阶级和资产阶级的矛盾"}, {"label": "D", "text": "帝国主义和封建主义的矛盾"}], "answer": "AC", "explain": "正确答案AC。新民主主义社会的基本矛盾在国际上是新中国同帝国主义的矛盾，在国内是工人阶级和资产阶级的矛盾。B封建主义与人民大众、D帝国主义与封建主义均是新民主主义革命时期而非新民主主义社会的矛盾。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 2, "question": "开始掌握历史主动的中国人民，是中国人民志愿军的坚强后盾。主要表现包括（ )。", "options": [{"label": "A", "text": "全国各地开展波澜壮阔的抗美援朝运动"}, {"label": "B", "text": "成千上万中华儿女报名参加志愿军"}, {"label": "C", "text": "全国上下发起增加生产、厉行节约、爱国丰产等运动"}, {"label": "D", "text": "社会各界踊跃捐款"}], "answer": "ABCD", "explain": "正确答案ABCD。全国开展抗美援朝运动、中华儿女报名参军、发起增产节约等运动、社会各界踊跃捐款，均是中国人民志愿军的坚强后盾表现，四项均正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 3, "question": "新中国成立伊始，面临许多严重困难和紧迫问题，包括（ ）。", "options": [{"label": "A", "text": "能不能保卫住革命胜利成果，巩固新生人民政权"}, {"label": "B", "text": "能不能战胜严重经济困难，迅速恢复和发展国民经济"}, {"label": "C", "text": "能不能巩固民族独立，维护国家主权和安全"}, {"label": "D", "text": "能不能经受住全国执政的新考验，继续保持优良传统和作风"}], "answer": "ABCD", "explain": "新中国成立伊始百废待兴，面临保卫新生人民政权、恢复国民经济、巩固民族独立与经受执政考验等重重困难。A、B、C、D四项分别对应保卫革命成果、战胜经济困难、维护国家主权安全、经受执政考验，均属于当时面临的严重困难和紧迫问题。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 4, "question": "新中国成立伊始，以美国为首的西方资本主义阵营企图通过实行（ ）的政策，从根本上搞垮新中国。", "options": [{"label": "A", "text": "文化渗透"}, {"label": "B", "text": "政治孤立"}, {"label": "C", "text": "经济封锁"}, {"label": "D", "text": "军事包围"}], "answer": "BCD", "explain": "以美国为首的西方阵营企图通过政治孤立、经济封锁、军事包围的政策从根本上搞垮新中国，这是其包围遏制战略的核心内容。B政治孤立、C经济封锁、D军事包围正确；A文化渗透不属于当时对华包围遏制政策的典型表述，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 5, "question": "1953年，对党在过渡时期的总路线有一种通俗的解释：“好比一只鸟，它要有一个主体，这就是发展社会主义工业；它又要有一双翅膀……”这双“翅膀”是（ ）。", "options": [{"label": "A", "text": "没收官僚资本主义工矿企业"}, {"label": "B", "text": "对资本主义工商业的社会主义改造"}, {"label": "C", "text": "对手工业的社会主义改造"}, {"label": "D", "text": "对农业的社会主义改造"}], "answer": "BCD", "explain": "过渡时期总路线以社会主义工业化为主体和翅膀，对农业、手工业和资本主义工商业的三大改造是其两翼。B、C、D分别对应资本主义工商业、手工业和农业的社会主义改造；A没收官僚资本工矿企业属于建国初已完成的任务，不属于这双翅膀。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 6, "question": "对个体农业、手工业和资本主义工商业进行社会主义改造，是为了（ ）。", "options": [{"label": "A", "text": "确立社会主义生产关系"}, {"label": "B", "text": "健全社会主义上层建筑"}, {"label": "C", "text": "继续解放和发展生产力"}, {"label": "D", "text": "为实现社会主义工业化创造必要条件"}], "answer": "ACD", "explain": "对个体农业、手工业和资本主义工商业进行社会主义改造，目的是确立社会主义生产关系、继续解放和发展生产力、为实现社会主义工业化创造必要条件。A、C、D正确；B健全社会主义上层建筑不属于三大改造改造生产资料所有制的直接目的，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 7, "question": "如果不引导个体农民走合作化道路，农业生产力会受到很大限制，农村也不可能为工业化提供必要的（ ）等条件。", "options": [{"label": "A", "text": "商品粮食"}, {"label": "B", "text": "轻工业原料"}, {"label": "C", "text": "工业品市场"}, {"label": "D", "text": "工业发展所需的资金"}], "answer": "ABCD", "explain": "不引导个体农民走合作化道路，农业生产力受限，农村就无法为工业化提供商品粮食、轻工业原料、工业品市场和工业发展所需资金等条件。A、B、C、D四项都是工业化不可或缺的条件，缺一不可，均正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 8, "question": "1953年国家规定，个别企业的公私合营中，其利润分配依照\"四马分肥\"的方式，即将利润分为国家所得税、企业公积金、工人福利费、资方股息红利四个方面进行分配，其中具有社会主义性质的部分是（ ）。", "options": [{"label": "A", "text": "工人福利费"}, {"label": "B", "text": "股息红利"}, {"label": "C", "text": "国家所得税"}, {"label": "D", "text": "企业公积金"}], "answer": "ACD", "explain": "四马分肥中国家所得税、企业公积金、工人福利费都归国家和集体所有，具有社会主义性质；股息红利归资本家所有，属资本主义性质。故A工人福利费、C国家所得税、D企业公积金正确；B股息红利不具有社会主义性质，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 9, "question": "随着社会主义改造的完成，以（ ）为特征的社会主义经济制度建立起来。", "options": [{"label": "A", "text": "生产资料公有制"}, {"label": "B", "text": "按劳分配"}, {"label": "C", "text": "计划经济体制"}, {"label": "D", "text": "按资分配"}], "answer": "ABC", "explain": "社会主义改造完成后，以生产资料公有制、按劳分配和计划经济体制为特征的社会主义经济制度建立起来。A、B、C正确；D按资分配是资本主义分配原则，不属于社会主义经济制度的特征，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 10, "question": "（ ）等基本政治制度的建立，构成了我国社会主义的政治制度体系，为我国社会主义经济基础和相应的经济制度的确立，提供了政治保障。", "options": [{"label": "A", "text": "人民代表大会的根本政治制度"}, {"label": "B", "text": "中国共产党领导的多党合作和政治协商制度"}, {"label": "C", "text": "民主集中制度"}, {"label": "D", "text": "民族区域自治制度"}], "answer": "ABD", "explain": "人民代表大会的根本政治制度、中国共产党领导的多党合作和政治协商制度、民族区域自治制度共同构成我国社会主义政治制度体系。A、B、D正确；C民主集中制是党和国家的组织原则，而非一项基本政治制度，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 11, "question": "中国社会主义基本制度确立的伟大意义是（ ）。", "options": [{"label": "A", "text": "极大地提高了工人阶级和广大劳动人民的积极性、创造性，为社会生产力的大发展开辟了广阔道路"}, {"label": "B", "text": "为当代中国的一切发展进步提供了根本政治保障"}, {"label": "C", "text": "实现了马克思主义同中国实际的第二次结合"}, {"label": "D", "text": "为社会主义先进文化的发展指明了前进方向"}], "answer": "ABD", "explain": "社会主义基本制度确立极大地提高了工人阶级和劳动人民的积极性创造性，为一切发展进步提供政治保障，并为先进文化指明方向。A、B、D正确；C实现马克思主义同中国实际的第二次结合说法不准确，第二次结合的提法与本题语境不符，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 12, "question": "关于五四宪法内容的表述，正确的是（ ）。", "options": [{"label": "A", "text": "中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主国家"}, {"label": "B", "text": "人民行使权力的机关是全国人民代表大会和地方各级人民代表大会"}, {"label": "C", "text": "全国人民代表大会是最高国家行政机关"}, {"label": "D", "text": "国务院（中央）人民政府是最高国家权力机关"}], "answer": "AB", "explain": "五四宪法规定我国是工人阶级领导、以工农联盟为基础的人民民主国家，人民行使权力的机关是全国人大和地方各级人大。A、B正确；C全国人大是最高国家权力机关而非行政机关，D国务院是最高国家行政机关而非权力机关，两者表述均颠倒，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 13, "question": "1957年，毛泽东在《如何处理人民内部的矛盾》（后改为《关于正确处理人民内部矛盾的问题》）的讲话中指出，社会主义制度下，人民根本利益是一致的，但还存在着（ ）。", "options": [{"label": "A", "text": "民族矛盾"}, {"label": "B", "text": "敌我矛盾"}, {"label": "C", "text": "统治阶级内部矛盾"}, {"label": "D", "text": "人民内部矛盾"}], "answer": "BD", "explain": "毛泽东指出社会主义制度下人民根本利益一致，但仍存在敌我矛盾和人民内部矛盾两类不同性质的矛盾。B敌我矛盾、D人民内部矛盾正确；A民族矛盾、C统治阶级内部矛盾不是其所分析的两类矛盾，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 14, "question": "1957年，毛泽东对社会主义社会的基本矛盾作了分析，指出，社会主义社会中的基本矛盾可以通过社会主义制度本身的（ ）不断得到解决。", "options": [{"label": "A", "text": "自我调整"}, {"label": "B", "text": "自我完善"}, {"label": "C", "text": "自我颠覆"}, {"label": "D", "text": "自我批评"}], "answer": "AB", "explain": "毛泽东指出社会主义社会基本矛盾可通过社会主义制度本身的自我调整和自我完善不断得到解决。A自我调整、B自我完善正确；C自我颠覆违背社会主义制度自我改革的性质，D自我批评不是解决基本矛盾的表述，均排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 15, "question": "中共八大的主要贡献包括（ ）。", "options": [{"label": "A", "text": "提出正确处理人民内部矛盾"}, {"label": "B", "text": "正确分析了国内主要矛盾"}, {"label": "C", "text": "强调健全党内民主集中制"}, {"label": "D", "text": "坚持既反保守又反冒进的经济建设方针"}], "answer": "BCD", "explain": "中共八大正确分析国内主要矛盾、强调健全党内民主集中制、坚持既反保守又反冒进的经济建设方针。B、C、D正确；A提出正确处理人民内部矛盾是1957年毛泽东的成果，不属于八大内容，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 16, "question": "关于《论十大关系》的表述，正确的是（ ）。", "options": [{"label": "A", "text": "它是新中国成立以来中共中央领导集体深入调查研究的成果"}, {"label": "B", "text": "\"十大关系\"之一是中央和地方的关系"}, {"label": "C", "text": "围绕的一个基本方针，是要把国内外一切积极因素调动起来，为社会主义事业服务"}, {"label": "D", "text": "它为中共八大的召开作了理论准备"}], "answer": "ABCD", "explain": "《论十大关系》是党的领导集体深入调查研究的成果，包含中央和地方等十大关系，以调动一切积极因素为基本方针，为中共八大召开作了理论准备。A、B、C、D四项均符合史实，全部正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 17, "question": "从1958年11月第一次郑州会议到1959年7月庐山会议前期，党中央和毛泽东对社会主义建设规律有了一些新的认识，主要包括（ ）。这些认识是纠\"左\"取得初步成效的重要原因。", "options": [{"label": "A", "text": "生产关系一定要适合生产力的性质"}, {"label": "B", "text": "必须利用价值规律为社会主义服务"}, {"label": "C", "text": "综合平衡是整个经济工作的根本问题"}, {"label": "D", "text": "国民经济应当有计划按比例发展"}], "answer": "ABCD", "explain": "从郑州会议到庐山会议前期，党认识到生产关系要适合生产力、必须利用价值规律、综合平衡是经济工作根本问题、国民经济应有计划按比例发展。A、B、C、D四项均是对建设规律的新认识，全部正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 18, "question": "1960年11月，中共中央发出《关于农村人民公社当前政策问题的紧急指示信》，着手解决当时最为突出的（ ）问题。", "options": [{"label": "A", "text": "农业"}, {"label": "B", "text": "农村"}, {"label": "C", "text": "生产方式"}, {"label": "D", "text": "生产效率"}], "answer": "AB", "explain": "1960年11月中共中央发出紧急指示信，着手解决当时最为突出的农业问题和农村问题。A农业、B农村正确；C生产方式、D生产效率是抽象概念，不是指示信针对的突出问题，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 19, "question": "20世纪70年代我国取得的外交成就主要有（ ）。", "options": [{"label": "A", "text": "中日建交"}, {"label": "B", "text": "中美关系走向正常化"}, {"label": "C", "text": "恢复了在联合国的合法席位"}, {"label": "D", "text": "周恩来提出和平共处五项原则"}], "answer": "ABC", "explain": "20世纪70年代我国外交成就有中日建交、中美关系走向正常化、恢复在联合国合法席位。A、B、C正确；D和平共处五项原则是1953-1954年周恩来提出的，属50年代成就，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 20, "question": "从“一五”时期开始到1976年，是中国社会主义现代化事业打基础的重要时期，这一时期最大的建设成就，是基本建立了独立的比较完整的（ ）。", "options": [{"label": "A", "text": "工业体系"}, {"label": "B", "text": "农业体系"}, {"label": "C", "text": "交通体系"}, {"label": "D", "text": "国民经济体系"}], "answer": "AD", "explain": "从一五时期到1976年，最大的建设成就是基本建立独立的比较完整的工业体系和国民经济体系。A工业体系、D国民经济体系正确；B农业体系、C交通体系不是这一时期最大建设成就的规范表述，故排除。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 1, "question": "在执政条件下加强中国共产党自身建设方面，邓小平最早觉察到西方\"和平演变\"战略的危险。", "answer": false, "explain": "在执政条件下加强党建，最早觉察到西方和平演变战略危险的是毛泽东而非邓小平，故判断错误。本题应将邓小平改为毛泽东才符合史实。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 2, "question": "中国共产党领导的革命包括新民主主义革命和社会主义革命两个阶段。", "answer": true, "explain": "中国共产党领导的革命确分为新民主主义革命和社会主义革命两个阶段，两者既相区别又相联系，故判断正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 3, "question": "没收官僚资本工作的完成和工业建设的发展，使中国已经有了比较强大的社会主义性质的私营经济。", "answer": false, "explain": "没收官僚资本工作的完成和工业建设的发展，使中国有了比较强大的社会主义性质的国营经济而非私营经济，故判断错误。私营经济与国营经济概念混淆。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 4, "question": "对个体农业进行社会主义改造，是保证工业发展、实现国家工业化的一个必要条件。", "answer": true, "explain": "对个体农业进行社会主义改造，确是保证工业发展、实现国家工业化的一个必要条件，故判断正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 5, "question": "采用民主集中制的人民代表大会的政治制度，是同新中国的根本性质相联系的。", "answer": true, "explain": "采用民主集中制的人民代表大会制度，是同新中国的根本性质相联系的，故判断正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 6, "question": "新中国民主政治建设发展历程的标志性事件是《中华人民共和国宪法》的通过。", "answer": true, "explain": "1954年《中华人民共和国宪法》的通过确是新中国民主政治建设发展历程的标志性事件，故判断正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 7, "question": "社会主义制度建立后，国家政治生活的主题是正确处理敌我矛盾。", "answer": false, "explain": "社会主义制度建立后，国家政治生活的主题是正确处理人民内部矛盾，而非敌我矛盾，故判断错误。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 8, "question": "毛泽东第一次系统阐述社会主义社会矛盾问题的著作是《矛盾论》。", "answer": false, "explain": "毛泽东第一次系统阐述社会主义社会矛盾问题的著作是《关于正确处理人民内部矛盾的问题》，而非《矛盾论》，故判断错误。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 9, "question": "党在社会主义革命和建设中取得的独创性理论成果和巨大成就，为在新的历史时期开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。", "answer": true, "explain": "党在社会主义革命和建设中取得的独创性成果和成就，确为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础，故判断正确。"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "tf", "id": 10, "question": "“大跃进”和人民公社化运动违背了社会发展的客观规律。", "answer": true, "explain": "大跃进和人民公社化运动违背了社会发展的客观经济规律，犯了急躁冒进的错误，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 1, "question": "成为开辟中国特色社会主义新道路、开创中国特色社会主义新理论的宣言书的是（ ）。", "options": [{"label": "A", "text": "《中共十一届三中全会公报》"}, {"label": "B", "text": "《解放思想，实事求是，团结一致向前看》"}, {"label": "C", "text": "《关于建国以来党的若干历史问题的决议》"}, {"label": "D", "text": "《实践是检验真理的唯一标准》"}], "answer": "B", "explain": "《解放思想，实事求是，团结一致向前看》是开辟中国特色社会主义新道路、新理论的宣言书。A《十一届三中全会公报》、C《历史问题决议》、D《实践是检验真理的唯一标准》虽同属重要文献，但地位作用不同，均不承担宣言书这一特定定位。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 2, "question": "1978年12月，党召开了十一届三中全会。全会结束“以阶级斗争为纲”，实现党和国家工作中心战略转移，实现了新中国成立以来党的历史上具有深远意义的伟大转折。党的十一届三中全会（ ）。", "options": [{"label": "A", "text": "提出了“建设有中国特色社会主义”的重大命题"}, {"label": "B", "text": "把改革开放和现代化建设推向新阶段"}, {"label": "C", "text": "开启了改革开放和社会主义现代化建设新时期"}, {"label": "D", "text": "标志着党在指导思想上拨乱反正的胜利完成"}], "answer": "C", "explain": "党的十一届三中全会结束以阶级斗争为纲，开启了改革开放和社会主义现代化建设新时期。A建设有中国特色社会主义命题是十二大提出，B把改革开放推向新阶段是南方谈话及十四大，D指导思想的拨乱反正完成是1981年历史决议，均不属于此次全会直接成果。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 3, "question": "1981年，党的十一届六中全会通过了《关于建国以来党的若干历史问题的决议》，具有深远历史意义。《决议》的通过标志着（ ）。", "options": [{"label": "A", "text": "党重新确立了马克思主义的思想路线、政治路线、组织路线"}, {"label": "B", "text": "党在指导思想上拨乱反正的胜利完成"}, {"label": "C", "text": "社会主义初级阶段理论的形成"}, {"label": "D", "text": "我国改革开放和社会主义现代化建设新时期的开启"}], "answer": "B", "explain": "1981年《关于建国以来党的若干历史问题的决议》的通过标志着党在指导思想上拨乱反正的胜利完成。A重新确立思想政治组织路线是十一届三中全会，C社会主义初级阶段理论形成于十三大，D开启新时期也是十一届三中全会，均与此不符。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 4, "question": "《关于建国以来党的若干历史问题的决议》对毛泽东思想的活的灵魂作了概括，其中不包括（ ）。", "options": [{"label": "A", "text": "武装斗争"}, {"label": "B", "text": "群众路线"}, {"label": "C", "text": "独立自主"}, {"label": "D", "text": "实事求是"}], "answer": "A", "explain": "毛泽东思想活的灵魂是实事求是、群众路线、独立自主，不包括武装斗争。B群众路线、C独立自主、D实事求是都是活的灵魂，而A武装斗争是新民主主义革命三大法宝之一，故不属于本题应选答案。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 5, "question": "1979年3月，邓小平在理论工作务虚会上指出，要坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、（ ）这四项基本原则。", "options": [{"label": "A", "text": "共产主义理想"}, {"label": "B", "text": "中国特色社会主义理想"}, {"label": "C", "text": "毛泽东思想"}, {"label": "D", "text": "科学发展观"}], "answer": "C", "explain": "四项基本原则中包括坚持马克思列宁主义、毛泽东思想。A共产主义理想、B中国特色社会主义理想、D科学发展观都不是四项基本原则的规范表述，故C为正确答案。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 6, "question": "继延安整风之后又一场马克思主义思想解放运动是指（ ）。", "options": [{"label": "A", "text": "关于真理标准问题的大讨论"}, {"label": "B", "text": "中共十一届三中全会"}, {"label": "C", "text": "中共十三大"}, {"label": "D", "text": "十一届三中全会前的中央工作会议"}], "answer": "A", "explain": "关于真理标准问题的大讨论是继延安整风之后的又一场马克思主义思想解放运动。B十一届三中全会、C十三大、D工作会议都是具体会议，而非思想解放运动本身，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 7, "question": "《关于建国以来党的若干历史问题的决议》指出：社会主义改造基本完成以后，我国所要解决的主要矛盾是（ ）。", "options": [{"label": "A", "text": "人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾"}, {"label": "B", "text": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}, {"label": "C", "text": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}, {"label": "D", "text": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}], "answer": "B", "explain": "《决议》指出社会主义改造基本完成后主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。A、C是八大关于矛盾的表述，D是新时代我国社会主要矛盾，均与1981年《决议》的提法不符。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 8, "question": "经济体制的改革首先是在（ ）取得突破性进展。", "options": [{"label": "A", "text": "特区"}, {"label": "B", "text": "城市"}, {"label": "C", "text": "农村"}, {"label": "D", "text": "沿海地区"}], "answer": "C", "explain": "经济体制改革首先在农村取得突破性进展，以家庭联产承包责任制为开端。A特区、B城市、D沿海地区都不是改革最先突破的领域，城市改革起步晚于农村，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 9, "question": "20世纪80年代初期，邓小平对世界局势作出一个重要的判断，即（ ）已成为时代的主题。", "options": [{"label": "A", "text": "革命与发展"}, {"label": "B", "text": "和平与发展"}, {"label": "C", "text": "战争与革命"}, {"label": "D", "text": "人类命运共同体"}], "answer": "B", "explain": "20世纪80年代初期邓小平判断和平与发展已成为时代主题。A革命与发展、C战争与革命是此前时代的主题提法，D人类命运共同体是新时代提出的理念，均不符合80年代邓小平的判断。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 10, "question": "家庭联产承包责任制的普遍实行，促进了（ ）的人民公社体制解体。", "options": [{"label": "A", "text": "“公私合一”"}, {"label": "B", "text": "“军民合一”"}, {"label": "C", "text": "“政经合一”"}, {"label": "D", "text": "“政社合一”"}], "answer": "D", "explain": "家庭联产承包责任制的普遍实行，促进了政社合一的人民公社体制解体。A公私合一、B军民合一、C政经合一都不是人民公社体制的特征，只有D政社合一准确概括了人民公社政社合一的组织结构。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 11, "question": "（ ）是建立社会主义市场经济体制的中心环节，也是难点所在。", "options": [{"label": "A", "text": "国有企业改革"}, {"label": "B", "text": "个体工商业改革"}, {"label": "C", "text": "民营企业改革"}, {"label": "D", "text": "建立现代企业制度"}], "answer": "A", "explain": "国有企业改革是建立社会主义市场经济体制的中心环节，也是难点所在。B个体工商业改革、C民营企业改革都不是改革的重心，D建立现代企业制度是国企改革的方向而非中心环节本身，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 12, "question": "邓小平理论围绕（ ）这一根本问题，第一次比较系统地回答了建设有中国特色社会主义的一系列基本问题。", "options": [{"label": "A", "text": "“建设什么样的党、怎样建设党”"}, {"label": "B", "text": "“什么是社会主义、怎样建设社会主义”"}, {"label": "C", "text": "“实现什么样的发展、怎样发展”"}, {"label": "D", "text": "“发展才是硬道理”"}], "answer": "B", "explain": "邓小平理论围绕什么是社会主义、怎样建设社会主义这一根本问题展开。A建设什么样的党是三个代表主线，C实现什么样的发展是科学发展观主线，D发展才是硬道理只是一句论断，均不是邓小平理论的根本问题。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 13, "question": "“一国两制”构想首先被成功运用于解决（ ）。", "options": [{"label": "A", "text": "台湾问题"}, {"label": "B", "text": "香港问题"}, {"label": "C", "text": "澳门问题"}, {"label": "D", "text": "经济特区"}], "answer": "B", "explain": "一国两制构想首先被成功运用于解决香港问题，即1997年香港回归。A台湾问题尚未解决，C澳门问题晚于香港，D经济特区与一国两制无关，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 14, "question": "1990年，邓小平提出中国社会主义农业的改革发展会有两个飞跃，第一个飞跃是废除人民公社，实行家庭联产承包为主的责任制；第二个飞跃就是发展（ ）。", "options": [{"label": "A", "text": "集体经济"}, {"label": "B", "text": "国营经济"}, {"label": "C", "text": "私营经济"}, {"label": "D", "text": "小农经济"}], "answer": "A", "explain": "1990年邓小平提出农业改革发展第二个飞跃是发展集体经济（适度规模经营）。B国营经济、C私营经济、D小农经济都不是第二个飞跃的方向，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 15, "question": "中共十三大完整概括了中国共产党在社会主义初级阶段的基本路线是（ ）。", "options": [{"label": "A", "text": "多快好省，力争上游"}, {"label": "B", "text": "一个中心，两个基本点"}, {"label": "C", "text": "“一化三改”"}, {"label": "D", "text": "艰苦奋斗建设社会主义"}], "answer": "B", "explain": "中共十三大完整概括的社会主义初级阶段基本路线是一个中心、两个基本点。A多快好省是总路线口号，C一化三改是过渡时期总路线，D艰苦奋斗表述不完整，均不是十三大基本路线。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 16, "question": "1992年邓小平的南方谈话突出解决了（ ）。", "options": [{"label": "A", "text": "姓“资”姓“社”的问题"}, {"label": "B", "text": "“两个凡是”的思想误区"}, {"label": "C", "text": "姓“公”姓“私”的问题"}, {"label": "D", "text": "开放和封闭的问题"}], "answer": "A", "explain": "1992年邓小平南方谈话突出解决了姓资姓社的问题，提出三个有利于标准。B两个凡是是真理标准讨论解决的问题，C姓公姓私是十五大前后的问题，D开放封闭不是谈话核心，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 17, "question": "中共十三大概括了党在社会主义初级阶段“一个中心、两个基本点”的基本路线，其中的“一个中心”是指（ ）。", "options": [{"label": "A", "text": "以改革开放为中心"}, {"label": "B", "text": "以政治体制改革为中心"}, {"label": "C", "text": "以文化建设为中心"}, {"label": "D", "text": "以经济建设为中心"}], "answer": "D", "explain": "一个中心是指以经济建设为中心，这是党在社会主义初级阶段坚持的中心任务。A改革开放、B政治体制改革、C文化建设都是服从和服务于经济建设这个中心的，均不是核心，故正确答案是D。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 18, "question": "1992年召开的中共十四大明确提出，我国经济体制改革的目标是建立（ ）。", "options": [{"label": "A", "text": "社会主义市场经济体制"}, {"label": "B", "text": "社会主义有计划商品经济体制"}, {"label": "C", "text": "市场为主、计划为辅的经济体制"}, {"label": "D", "text": "计划为主、市场为辅的经济体制"}], "answer": "A", "explain": "中共十四大明确提出我国经济体制改革的目标是建立社会主义市场经济体制。B有计划商品经济是1984年提法，C、D市场与计划的组合都不是十四大明确的目标表述，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 19, "question": "20世纪90年代初，国际格局和形势呈现错综复杂的局面。这一时期，我国向国际社会提出发展以（ ）为主要特征的新型大国关系。", "options": [{"label": "A", "text": "和平共处"}, {"label": "B", "text": "开放包容"}, {"label": "C", "text": "不结盟、不对抗、不针对第三方"}, {"label": "D", "text": "睦邻合作友好"}], "answer": "C", "explain": "20世纪90年代初我国提出发展以不结盟、不对抗、不针对第三方为主要特征的新型大国关系。A和平共处五项原则是50年代提法，B开放包容、D睦邻友好都不是新型大国关系的主要特征，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 20, "question": "以（ ）为标志，改革开放和现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段，由此打开了中国经济、政治、文化发展的崭新局面。", "options": [{"label": "A", "text": "邓小平南方谈话和党的十四大"}, {"label": "B", "text": "十一届三中全会"}, {"label": "C", "text": "社会主义基本制度的确立"}, {"label": "D", "text": "社会主义改造的完成"}], "answer": "A", "explain": "以邓小平南方谈话和党的十四大为标志，进入从计划经济向社会主义市场经济体制转变的新阶段。B十一届三中全会开启改革开放，C、D社会主义制度确立和改造完成都在50年代，均与此阶段标志不符。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 21, "question": "20世纪90年代，海峡两岸关系协会与台湾海峡交流基金会达成“海峡两岸同属一个中国，共同努力谋求国家统一”的共识，后被称为（ ）。", "options": [{"label": "A", "text": "“一个中国”"}, {"label": "B", "text": "“双方共识”"}, {"label": "C", "text": "“和平共识”"}, {"label": "D", "text": "“九二共识”"}], "answer": "D", "explain": "两岸两会在90年代达成的海峡两岸同属一个中国、共谋统一的共识后被称为九二共识。A一个中国、B双方共识、C和平共识都不是这一共识的规范名称，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 22, "question": "（ ）是当代中国发展进步的根本制度保障。", "options": [{"label": "A", "text": "中国特色社会主义理论体系"}, {"label": "B", "text": "中国特色社会主义制度"}, {"label": "C", "text": "中国特色社会主义道路"}, {"label": "D", "text": "中国特色社会主义文化"}], "answer": "B", "explain": "中国特色社会主义制度是当代中国发展进步的根本制度保障。A理论体系是行动指南，C道路是实现途径，D文化是精神力量，均不是根本制度保障，故正确答案是B。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 23, "question": "坚持党的领导、人民当家作主、依法治国有机统一，其中（ ）是社会主义民主政治的本质特征。", "options": [{"label": "A", "text": "党的领导"}, {"label": "B", "text": "依法治国"}, {"label": "C", "text": "人民当家作主"}, {"label": "D", "text": "政治体制改革"}], "answer": "C", "explain": "人民当家作主是社会主义民主政治的本质特征。A党的领导是根本保证，B依法治国是基本方略，D政治体制改革是动力，均不是本质特征，故正确答案是C。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 24, "question": "中国共产党确定的新世纪头二十年的奋斗目标是（ ）。", "options": [{"label": "A", "text": "全面建设小康社会"}, {"label": "B", "text": "解决\"三农\"问题"}, {"label": "C", "text": "从计划经济体制向社会主义市场经济体制转变"}, {"label": "D", "text": "实施西部大开发战略"}], "answer": "A", "explain": "中国共产党确定的新世纪头二十年的奋斗目标是全面建设小康社会。B解决三农问题、C向市场经济转变、D西部大开发都是具体任务或战略，不是头二十年总目标，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 25, "question": "以（ ）加入世界贸易组织为标志，中国形成全方位、多层次、宽领域的对外开放格局。", "options": [{"label": "A", "text": "2001年"}, {"label": "B", "text": "2002年"}, {"label": "C", "text": "2003年"}, {"label": "D", "text": "2004年"}], "answer": "A", "explain": "以2001年加入世界贸易组织为标志，形成全方位、多层次、宽领域的对外开放格局。B2002年、C2003年、D2004年均不是中国入世年份，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 26, "question": "2005年3月14日，十届全国人大三次会议高票通过（ ），这充分表明全中国人民反对“台独”、维护国家统一和领土完整的共同意志和坚定决心。", "options": [{"label": "A", "text": "《反分裂国家法》"}, {"label": "B", "text": "《告台湾同胞书》"}, {"label": "C", "text": "《海峡两岸经济合作框架协议》"}, {"label": "D", "text": "《两岸和平发展共同愿景》"}], "answer": "A", "explain": "2005年十届全国人大三次会议高票通过的是《反分裂国家法》。B《告台湾同胞书》是1979年发表，C《海峡两岸经济合作框架协议》是2010年签署，D《两岸和平发展共同愿景》是2005年国共会谈成果，均不符。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 27, "question": "科学发展观的核心是（ ）。", "options": [{"label": "A", "text": "发展"}, {"label": "B", "text": "全面协调可持续"}, {"label": "C", "text": "以人为本"}, {"label": "D", "text": "统筹兼顾"}], "answer": "C", "explain": "科学发展观的核心是以人为本。A发展是第一要义，B全面协调可持续是基本要求，D统筹兼顾是根本方法，均不是核心，故正确答案是C。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 28, "question": "自从（ ）年开始，国家立法免征农业税，延续了两千多年的田赋至此退出中国历史的舞台。", "options": [{"label": "A", "text": "1978"}, {"label": "B", "text": "2006"}, {"label": "C", "text": "2007"}, {"label": "D", "text": "2010"}], "answer": "B", "explain": "自2006年起国家立法免征农业税，延续两千多年的田赋退出历史舞台。A1978年、C2007年、D2010年均不是免征农业税起始年份，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 29, "question": "在全面建设小康社会的进程中，中共中央坚持以（ ）为主线，紧密结合治国理政实践，继续全面推进党的建设新的伟大工程。", "options": [{"label": "A", "text": "政治建设和思想建设"}, {"label": "B", "text": "作风建设"}, {"label": "C", "text": "党风廉政建设"}, {"label": "D", "text": "执政能力建设和先进性建设"}], "answer": "D", "explain": "全面建设小康社会进程中，党建以执政能力建设和先进性建设为主线。A政治建设和思想建设、B作风建设、C党风廉政建设都是具体内容而非主线，故均不正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "single", "id": 30, "question": "科学发展观的第一要义是（ ）。", "options": [{"label": "A", "text": "发展"}, {"label": "B", "text": "以人为本"}, {"label": "C", "text": "全面协调可持续"}, {"label": "D", "text": "统筹兼顾"}], "answer": "A", "explain": "科学发展观的第一要义是发展。B以人为本是核心，C全面协调可持续是基本要求，D统筹兼顾是根本方法，均不是第一要义，故正确答案是A。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 1, "question": "1978年12月18日到22日，党的十一届三中全会在北京召开，会议的主要任务是确定把全党工作重心转移到社会主义现代化建设上来。这次全会是新中国成立以来党的历史上具有深远意义的伟大转折，全会结束了粉碎“四人帮”后两年党和国家工作在徘徊中前进的局面，标志着中国共产党（  ）。", "options": [{"label": "A", "text": "重新确立了马克思主义的思想路线、政治路线、组织路线"}, {"label": "B", "text": "开始了在思想、政治、组织等领域的全面拨乱反正"}, {"label": "C", "text": "形成了以邓小平为核心的党的中央领导集体"}, {"label": "D", "text": "揭开了社会主义改革开放的序幕"}], "answer": "ABCD", "explain": "十一届三中全会重新确立马克思主义的思想政治组织路线，开始全面拨乱反正，形成以邓小平为核心的领导集体，揭开改革开放序幕。A、B、C、D四项均是对此次全会历史意义的正确概括，全部正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 2, "question": "1981年6月，中共十一届六中全会通过的《关于建国以来党的若干历史问题的决议》的主要内容有（ ）。", "options": [{"label": "A", "text": "科学评价毛泽东和毛泽东思想的历史地位"}, {"label": "B", "text": "从根本上否定“文化大革命”的理论和实践"}, {"label": "C", "text": "对新中国成立以来的重大历史事件和重要历史人物作出基本结论"}, {"label": "D", "text": "提出了社会主义初级阶段理论"}], "answer": "ABC", "explain": "《历史决议》科学评价毛泽东和毛泽东思想、否定文化大革命的理论和实践、对重大历史事件和人物作出基本结论。A、B、C正确；D社会主义初级阶段理论是十三大提出，不属于《决议》内容，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 3, "question": "改革开放和社会主义现代化建设新时期，党面临的主要任务是（ ）。", "options": [{"label": "A", "text": "继续探索中国建设社会主义的正确道路"}, {"label": "B", "text": "解放和发展社会生产力"}, {"label": "C", "text": "使人民摆脱贫困，尽快富裕起来"}, {"label": "D", "text": "为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件"}], "answer": "ABCD", "explain": "改革开放新时期党的主要任务是探索正确道路、解放发展生产力、使人民摆脱贫困、为实现民族复兴提供体制保证和物质条件。A、B、C、D四项均属于这一时期的主要任务，全部正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 4, "question": "《关于建国以来党的若干历史问题的决议》概括的毛泽东思想的活的灵魂有（ ）。", "options": [{"label": "A", "text": "调查研究"}, {"label": "B", "text": "实事求是"}, {"label": "C", "text": "群众路线"}, {"label": "D", "text": "独立自主"}], "answer": "BCD", "explain": "毛泽东思想活的灵魂是实事求是、群众路线、独立自主。B、C、D正确；A调查研究是具体工作方法，不属于活的灵魂三方面的概括，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 5, "question": "家庭联产承包责任制的主要形式有（ ）。", "options": [{"label": "A", "text": "公私结合"}, {"label": "B", "text": "客商结合"}, {"label": "C", "text": "包产到户"}, {"label": "D", "text": "包干到户"}], "answer": "CD", "explain": "家庭联产承包责任制的主要形式是包产到户和包干到户，前者定产应产归集体，后者交够国家的剩下都是自己的。C、D正确；A公私结合、B客商结合都是杜撰的提法，不属于家庭联产承包责任制的形式，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 6, "question": "中共十三大概括了党在社会主义初级阶段“一个中心、两个基本点”的基本路线，其中的“两个基本点”是指（ ）。", "options": [{"label": "A", "text": "坚持四项基本原则"}, {"label": "B", "text": "坚持经济体制改革"}, {"label": "C", "text": "坚持改革开放"}, {"label": "D", "text": "坚持文化体制改革"}], "answer": "AC", "explain": "两个基本点是指坚持四项基本原则和坚持改革开放。A、C正确；B经济体制改革、D文化体制改革都是具体领域改革，不属于两个基本点，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 7, "question": "党的十一届三中全会召开前夕，中国外交采取了两个重大举措，即（ ）。", "options": [{"label": "A", "text": "1978年8月同日本签订和平友好条约"}, {"label": "B", "text": "1978年12月同美国发表正式建交的联合公报"}, {"label": "C", "text": "推进联美抗苏的“一条线”战略"}, {"label": "D", "text": "重申中国独立自主的外交政策"}], "answer": "AB", "explain": "十一届三中全会前夕外交两大举措是1978年8月同日本签订和平友好条约、12月同美国发表建交公报。A、B正确；C一条线战略、D重申独立自主外交政策都不是这两项具体举措，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 8, "question": "改革开放和建设社会主义现代化，需要一大批年富力强的各级领导干部。邓小平、陈云等老一辈革命家敏锐地提醒全党同志，要注意培养、选拔合格的接班人，实现干部队伍（ ），使党的事业能够后继有人。", "options": [{"label": "A", "text": "革命化"}, {"label": "B", "text": "年轻化"}, {"label": "C", "text": "知识化"}, {"label": "D", "text": "专业化"}], "answer": "ABCD", "explain": "邓小平、陈云提出干部队伍要实现革命化、年轻化、知识化、专业化的四化方针，使党的事业后继有人。A、B、C、D四项分别对应革命化、年轻化、知识化、专业化，完整准确，全部正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 9, "question": "20世纪80年代我国对外开放格局具有的特点有（ ）。", "options": [{"label": "A", "text": "点面结合"}, {"label": "B", "text": "多层次"}, {"label": "C", "text": "有重点"}, {"label": "D", "text": "内外相联"}], "answer": "ABC", "explain": "20世纪80年代我国对外开放格局具有点面结合、多层次、有重点的特点。A、B、C正确；D内外相联不是对外开放格局的规范表述，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 10, "question": "邓小平南方谈话提出的“三个有利于”是指（ ）。", "options": [{"label": "A", "text": "是否有利于国家的长治久安"}, {"label": "B", "text": "是否有利于发展社会主义社会的生产力"}, {"label": "C", "text": "是否有利于增强社会主义国家的综合国力"}, {"label": "D", "text": "是否有利于提高人民的生活水平"}], "answer": "BCD", "explain": "三个有利于是指是否有利于发展社会主义社会的生产力、增强综合国力、提高人民的生活水平。B、C、D正确；A有利于国家长治久安不是三个有利的标准之一，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 11, "question": "1989年政治风波后，以美国为首的西方国家对华实施“制裁”，为扭转局势，争取主动，党和政府确定20世纪90年代初期外交工作的两个重点是（ ）。", "options": [{"label": "A", "text": "强调中国目前的局势是稳定的"}, {"label": "B", "text": "开展睦邻外交，稳定和积极发展同周边国家的关系，加强同发展中国家的团结与合作"}, {"label": "C", "text": "打破西方国家的“制裁”，恢复和稳定同西方发达国家的关系"}, {"label": "D", "text": "朝全方位外交发展"}], "answer": "BC", "explain": "90年代初外交工作两个重点是开展睦邻外交加强同发展中国家的团结、打破西方制裁恢复同发达国家的关系。B、C正确；A强调局势稳定、D朝全方位外交发展都只是背景或后续方向，不是两个重点本身，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 12, "question": "1992年1月18日至2月21日，邓小平先后到武昌、深圳、珠海、上海等地视察，发表了一系列重要谈话，即南方谈话。邓小平的南方谈话（  ）。", "options": [{"label": "A", "text": "从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题"}, {"label": "B", "text": "是把改革开放和现代化建设推向新阶段的又一个解放思想、实事求是的宣言书"}, {"label": "C", "text": "对之后召开的党的十四大具有十分重要的指导作用"}, {"label": "D", "text": "开启了我国改革开放和社会主义现代化建设新时期"}], "answer": "ABC", "explain": "南方谈话从理论上回答束缚思想的重大问题、是解放思想实事求是的宣言书、对十四大有指导作用。A、B、C正确；D开启新时期是十一届三中全会，与南方谈话时间不符，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 13, "question": "1997年9月12日至18日，中国共产党第十五次全国代表大会在北京召开。大会提出了新的“三步走”发展战略，即（ ）。", "options": [{"label": "A", "text": "21世纪第一个十年实现国民生产总值比2000年翻一番，使人民的小康生活更加宽裕，形成比较完善的社会主义市场经济体制"}, {"label": "B", "text": "到中国共产党成立一百年时，使国民经济更加发展，各项制度更加完善"}, {"label": "C", "text": "到21世纪中叶中华人民共和国成立一百年时，基本实现现代化，建成富强民主文明的社会主义国家"}, {"label": "D", "text": "到本世纪中叶，在基本实现现代化的基础上，把我国建设成为富强民主文明和谐美丽的社会主义现代化强国"}], "answer": "ABC", "explain": "十五大新三步走是21世纪第一个十年翻一番、建党一百年国民经济更发展、建国一百年基本实现现代化。A、B、C正确；D到本世纪中叶建成现代化强国是后来（十九大）的提法，不属于十五大新三步走，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 14, "question": "党的十五大提出，建设有中国特色社会主义文化，以培育（ ）的公民为目标。", "options": [{"label": "A", "text": "有理想"}, {"label": "B", "text": "有道德"}, {"label": "C", "text": "有文化"}, {"label": "D", "text": "有纪律"}], "answer": "ABCD", "explain": "十五大提出建设有中国特色社会主义文化以培育有理想、有道德、有文化、有纪律的四有公民为目标。A、B、C、D四项完整对应四有，全部正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 15, "question": "2000年江泽民提出的“三个代表”是中国共产党要始终做到（ ）。", "options": [{"label": "A", "text": "代表中国革命的胜利"}, {"label": "B", "text": "代表中国先进文化的前进方向"}, {"label": "C", "text": "代表中国先进生产力的发展要求"}, {"label": "D", "text": "代表中国最广大人民的根本利益"}], "answer": "BCD", "explain": "三个代表是党始终代表先进生产力发展要求、先进文化前进方向、最广大人民根本利益。B、C、D正确；A代表中国革命的胜利不是三个代表的表述，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 16, "question": "党的十七届五中全会明确要求把建设（ ）社会作为重要着力点。", "options": [{"label": "A", "text": "产业结构合理型"}, {"label": "B", "text": "资源节约型"}, {"label": "C", "text": "资源密集型"}, {"label": "D", "text": "环境友好型"}], "answer": "BD", "explain": "十七届五中全会要求把建设资源节约型、环境友好型社会作为重要着力点。B、D正确；A产业结构合理型、C资源密集型都不是这一表述，均排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 17, "question": "中国共产党的自身建设面临的“两大历史性课题”指的是（ ）。", "options": [{"label": "A", "text": "提高领导水平和执政水平"}, {"label": "B", "text": "增强拒腐防变和抵御风险能力"}, {"label": "C", "text": "加强党和人民的血肉联系"}, {"label": "D", "text": "加强和改进党的作风建设"}], "answer": "AB", "explain": "党建面临的两大历史性课题是提高领导水平和执政水平、增强拒腐防变和抵御风险能力。A、B正确；C加强血肉联系、D加强作风建设是具体内容，不是两大历史性课题，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 18, "question": "体现“一国两制”构想的是（ ）。", "options": [{"label": "A", "text": "中英关于香港问题的《联合声明》"}, {"label": "B", "text": "和平共处五项原则"}, {"label": "C", "text": "中葡关于澳门问题的《联合声明》"}, {"label": "D", "text": "《告台湾同胞书》"}], "answer": "ACD", "explain": "体现一国两制构想的是中英关于香港联合声明、中葡关于澳门联合声明和《告台湾同胞书》。A、C、D正确；B和平共处五项原则是处理国际关系准则，与一国两制无关，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 19, "question": "（ ）是我国社会主义现代化建设的三个重要支点。", "options": [{"label": "A", "text": "改革"}, {"label": "B", "text": "稳定"}, {"label": "C", "text": "开放"}, {"label": "D", "text": "发展"}], "answer": "ABD", "explain": "改革、发展、稳定是我国社会主义现代化建设的三个重要支点。A、B、D正确；C开放虽重要但与改革并列，不属于三者的规范提法，故排除。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "multi", "id": 20, "question": "坚定不移贯彻（ ）的方针，保持了香港和澳门特别行政区的繁荣与稳定。", "options": [{"label": "A", "text": "一国两制"}, {"label": "B", "text": "港人治港"}, {"label": "C", "text": "澳人治澳"}, {"label": "D", "text": "高度自治"}], "answer": "ABCD", "explain": "坚定不移贯彻一国两制、港人治港、澳人治澳、高度自治的方针，保持了港澳的繁荣稳定。A、B、C、D四项完整对应这一方针，全部正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 1, "question": "《解放思想，实事求是，团结一致向前看》的讲话，是解放思想、开辟新时期新道路的宣言书。", "answer": true, "explain": "《解放思想，实事求是，团结一致向前看》确是解放思想、开辟新时期新道路的宣言书，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 2, "question": "党的十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。", "answer": true, "explain": "党的十一届三中全会确是新中国成立以来党的历史上具有深远意义的伟大转折，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 3, "question": "中国经济体制的改革，首先在城市取得突破性进展。", "answer": false, "explain": "中国经济体制改革首先在农村取得突破性进展，而非城市，故判断错误。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 4, "question": "只要坚持“四项基本原则”中坚持共产党的领导这一项，就等于坚持了社会主义现代化建设的方向。", "answer": false, "explain": "四项基本原则是一个有机整体，必须全面坚持，仅坚持党的领导一项远远不够，故判断错误。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 5, "question": "革命是解放生产力，改革也是解放生产力。", "answer": true, "explain": "革命是解放生产力，改革也是解放生产力，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 6, "question": "社会主义初级阶段是任何国家进入社会主义社会时都必须经历的阶段。", "answer": false, "explain": "社会主义初级阶段是中国这样的落后国家进入社会主义特有的阶段，并非任何国家都必须经历，故判断错误。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 7, "question": "社会主义市场经济是同社会主义基本制度结合在一起的。", "answer": true, "explain": "社会主义市场经济是同社会主义基本制度结合在一起的，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 8, "question": "没有科学发展就没有社会和谐，没有社会和谐也可以实现科学发展。", "answer": false, "explain": "没有科学发展就没有社会和谐，没有社会和谐也难以实现科学发展，二者相辅相成，故判断错误。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 9, "question": "青藏铁路、西气东输、西电东送都属于西部大开发战略的重点工程。", "answer": true, "explain": "青藏铁路、西气东输、西电东送都属于西部大开发战略的重点工程，故判断正确。"}, {"chapter": "第九章改革开放与中国特色社会主义开创和发展", "type": "tf", "id": 10, "question": "加入世界贸易组织是党为推进经济发展和改革开放而作出的重大战略决策。", "answer": true, "explain": "加入世界贸易组织是党为推进经济发展和改革开放作出的重大战略决策，故判断正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 1, "question": "2012年12月8日至14日，中共十八大在北京举行。这是我国进入全面建成小康社会决定性阶段召开的一次十分重要的大会。大会贯穿始终的一条主线，是（ ）。", "options": [{"label": "A", "text": "实事求是"}, {"label": "B", "text": "改革开放"}, {"label": "C", "text": "什么是社会主义、怎样建设社会主义"}, {"label": "D", "text": "坚持和发展中国特色社会主义"}], "answer": "D", "explain": "中共十八大贯穿始终的一条主线是坚持和发展中国特色社会主义。A实事求是、B改革开放、C什么是社会主义都是重要命题或背景，但不是贯穿全会的唯一主线，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 2, "question": "（ ）是中国特色社会主义新时代这一伟大征程的历史起点。", "options": [{"label": "A", "text": "党的十一届三中全会"}, {"label": "B", "text": "党的十八大"}, {"label": "C", "text": "党的十九大"}, {"label": "D", "text": "党的二十大"}], "answer": "B", "explain": "党的十八大是中国特色社会主义进入新时代这一伟大征程的历史起点。A十一届三中全会开启改革开放、C十九大、D二十大都在此之后，不是新时代起点，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 3, "question": "（ ）是最基本的民生。", "options": [{"label": "A", "text": "就业"}, {"label": "B", "text": "教育"}, {"label": "C", "text": "社会保障"}, {"label": "D", "text": "人民健康"}], "answer": "A", "explain": "就业是最基本的民生，是最大的民生工程，关系到人民生计和社会稳定。B教育、C社会保障、D人民健康都是重要的民生内容，但最基本的、摆在首位的民生是就业，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 4, "question": "（ ）是近代以来中国人民和中华民族最伟大的梦想。", "options": [{"label": "A", "text": "振兴中华"}, {"label": "B", "text": "不忘初心、牢记使命"}, {"label": "C", "text": "实现中华民族伟大复兴"}, {"label": "D", "text": "为人民服务"}], "answer": "C", "explain": "实现中华民族伟大复兴是近代以来中国人民和中华民族最伟大的梦想。A振兴中华是孙中山的早期口号、B不忘初心牢记使命是党建主题、D为人民服务是党的宗旨，均不是这一最伟大梦想的准确表述。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 5, "question": "（ ）是“四个全面”战略布局中具有突破性和先导性的关键环节。", "options": [{"label": "A", "text": "全面从严治党"}, {"label": "B", "text": "全面建设社会主义现代化国家"}, {"label": "C", "text": "全面依法治国"}, {"label": "D", "text": "全面深化改革"}], "answer": "D", "explain": "全面深化改革是四个全面中具有突破性和先导性的关键环节。A从严治党是根本保证、B全面建设现代化国家是战略目标、C依法治国是保障，均不是突破性先导性环节，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 6, "question": "统筹推进“五位一体”总体布局，（ ）是根本。", "options": [{"label": "A", "text": "政治建设"}, {"label": "B", "text": "思想文化建设"}, {"label": "C", "text": "经济建设"}, {"label": "D", "text": "生态文明建设"}], "answer": "C", "explain": "五位一体总体布局中经济建设是根本。A政治建设是保证、B思想文化建设是灵魂、D生态文明建设是基础，均不是根本，故正确答案是C。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 7, "question": "（ ）在“四个全面”战略布局中具有基础性、保障性作用。", "options": [{"label": "A", "text": "全面从严治党"}, {"label": "B", "text": "全面深化改革"}, {"label": "C", "text": "全面依法治国"}, {"label": "D", "text": "全面建设社会主义现代化国家"}], "answer": "C", "explain": "全面依法治国在四个全面中具有基础性、保障性作用。A从严治党是根本保证、B深化改革是动力、D全面建设现代化国家是目标，均不符合基础性保障性定位，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 8, "question": "中华优秀传统文化是中国特色社会主义植根的文化沃土。对中华优秀传统文化要（ ）。", "options": [{"label": "A", "text": "实现创造性转化、创新性发展"}, {"label": "B", "text": "坚持突出本来、防范外来、面向未来"}, {"label": "C", "text": "促进百花齐放、百家争鸣"}, {"label": "D", "text": "坚持全面继承和发展"}], "answer": "A", "explain": "对中华优秀传统文化要实现创造性转化、创新性发展。B突出本来防范外来面向未来表述有误、C百花齐放百家争鸣是文艺方针、D全面继承发展不符合扬弃精神，均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 9, "question": "政治安全是根本。坚持把维护国家政治安全特别是（ ）放在第一位。", "options": [{"label": "A", "text": "制度安全、社会安全"}, {"label": "B", "text": "制度安全、国土安全"}, {"label": "C", "text": "政权安全、国土安全"}, {"label": "D", "text": "政权安全、制度安全"}], "answer": "D", "explain": "坚持把维护国家政治安全特别是政权安全、制度安全放在第一位。A制度安全社会安全、B制度安全国土安全、C政权安全国土安全均有一项不一致，正确的组合是D政权安全和制度安全。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 10, "question": "强军目标中，（ ）是灵魂，决定军队建设的政治方向。", "options": [{"label": "A", "text": "能打胜仗"}, {"label": "B", "text": "听党指挥"}, {"label": "C", "text": "作风优良"}, {"label": "D", "text": "军民融合"}], "answer": "B", "explain": "强军目标中听党指挥是灵魂，决定军队建设的政治方向。A能打胜仗是核心、C作风优良是保证、D军民融合是发展战略，均不是灵魂，故正确答案是B。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 11, "question": "习近平新时代中国特色社会主义思想回答了（ ）重大时代课题。", "options": [{"label": "A", "text": "新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国，建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党等"}, {"label": "B", "text": "新形势下实现什么样的发展、怎样发展"}, {"label": "C", "text": "什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党"}, {"label": "D", "text": "新形势下怎样认识和发展中国特色社会主义"}], "answer": "A", "explain": "习近平新时代中国特色社会主义思想回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展等三个时代课题。B新形势发展是科学发展观、C什么是社会主义和建设什么样的党是邓小平理论和三个代表课题、D表述片面，均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 12, "question": "新时代党的组织路线，紧扣（ ）这条主线，从理论和实践结合上科学回答了党的组织建设中的一系列重大问题，彰显了把党的伟大自我革命进行到底的坚定决心。", "options": [{"label": "A", "text": "加强党的先进性和制度性建设"}, {"label": "B", "text": "加强党的长期执政能力建设、先进性和纯洁性建设"}, {"label": "C", "text": "加强党的纪律建设"}, {"label": "D", "text": "加强党的思想建设"}], "answer": "B", "explain": "新时代党的组织路线紧扣加强党的长期执政能力建设、先进性和纯洁性建设这条主线。A先进性制度性建设、C纪律建设、D思想建设都不是组织路线的主线，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 13, "question": "坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，必须坚定不移（ ），这是新时代坚持和发展中国特色社会主义的根本动力。", "options": [{"label": "A", "text": "以人民为中心"}, {"label": "B", "text": "坚持改革开放"}, {"label": "C", "text": "全面从严治党"}, {"label": "D", "text": "全面深化改革"}], "answer": "D", "explain": "全面深化改革是新时代坚持和发展中国特色社会主义的根本动力。A以人民为中心是价值取向、B坚持改革开放是基本路径、C从严治党是政治保证，均不是根本动力，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 14, "question": "中国特色社会主义制度的最大优势是（ ）。", "options": [{"label": "A", "text": "人民代表大会制度"}, {"label": "B", "text": "中国共产党领导"}, {"label": "C", "text": "中国共产党领导的多党合作和政治协商制度"}, {"label": "D", "text": "民族区域自治制度"}], "answer": "B", "explain": "中国特色社会主义制度的最大优势是中国共产党领导。A人民代表大会制度、C政协制度、D民族区域自治制度都是具体制度，不是最大优势，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 15, "question": "（ ）是党的基础性建设。", "options": [{"label": "A", "text": "政治建设"}, {"label": "B", "text": "作风建设"}, {"label": "C", "text": "制度建设"}, {"label": "D", "text": "思想建设"}], "answer": "D", "explain": "思想建设是党的基础性建设。A政治建设是根本性建设、B作风建设、C制度建设都是重要建设，但基础性建设是思想建设，故正确答案是D。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 16, "question": "中国以（ ）为着力点，构建共同而非排他的“朋友圈”，走出了一条结伴而不结盟、对话而不对抗的国与国交往新路。", "options": [{"label": "A", "text": "发展全球伙伴关系"}, {"label": "B", "text": "合作共赢"}, {"label": "C", "text": "和平发展"}, {"label": "D", "text": "互相尊重"}], "answer": "A", "explain": "中国以发展全球伙伴关系为着力点，构建结伴而不结盟、对话而不对抗的国与国交往新路。B合作共赢、C和平发展、D互相尊重都是原则，但着力点是发展全球伙伴关系，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 17, "question": "（ ）是党的形象，是观察党群干群关系、人心向背的晴雨表。", "options": [{"label": "A", "text": "党的作风"}, {"label": "B", "text": "党的思想"}, {"label": "C", "text": "党的决策"}, {"label": "D", "text": "党的领导"}], "answer": "A", "explain": "党的作风是党的形象，是观察党群干群关系、人心向背的晴雨表。B党的思想、C党的决策、D党的领导都不是这一晴雨表的准确对象，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 18, "question": "党中央提出（ ）的重大理念，深刻阐明了中国式民主的鲜明特色和显著优势，为新时代发展社会主义民主政治、建设社会主义政治文明提供了指引和遵循。", "options": [{"label": "A", "text": "人民民主"}, {"label": "B", "text": "人民当家做主"}, {"label": "C", "text": "全过程人民民主"}, {"label": "D", "text": "以人民为中心"}], "answer": "C", "explain": "全过程人民民主是党中央提出的重大理念，阐明中国式民主的特色和优势。A人民民主、B人民当家作主、D以人民为中心都是相关概念，但这一重大理念的准确提法是全过程人民民主，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 19, "question": "习近平新时代中国特色社会主义思想，植根于（ ），坚持理论指导和实践探索相统一，在指导实践、推动实践中展现出强大真理力量和独特思想魅力。", "options": [{"label": "A", "text": "坚持和发展中国特色社会主义新的伟大实践"}, {"label": "B", "text": "改革开放伟大实践"}, {"label": "C", "text": "坚持以人民为中心的发展思想"}, {"label": "D", "text": "中国之治的伟大实践"}], "answer": "A", "explain": "习近平新时代中国特色社会主义思想植根于坚持和发展中国特色社会主义新的伟大实践。B改革开放、C以人民为中心、D中国之治都是重要方面，但植根土壤是坚持和发展中国特色社会主义新的伟大实践，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 20, "question": "党的（ ）决定党的建设方向和效果，是党的建设的“灵魂”和“根基”。", "options": [{"label": "A", "text": "思想建设"}, {"label": "B", "text": "作风建设"}, {"label": "C", "text": "组织建设"}, {"label": "D", "text": "政治建设"}], "answer": "D", "explain": "党的政治建设决定党的建设方向和效果，是党的建设的灵魂和根基。A思想建设是基础、B作风建设关系形象、C组织建设是保障，均不是灵魂和根基，故正确答案是D。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 21, "question": "关于中国式现代化的表述，错误的是（ ）。", "options": [{"label": "A", "text": "中国式现代化是人口规模巨大的现代化"}, {"label": "B", "text": "中国式现代化是人与自然和谐共生的现代化"}, {"label": "C", "text": "中国式现代化是经济基础和上层建筑相协调的现代化"}, {"label": "D", "text": "中国式现代化是全体人民共同富裕的现代化"}], "answer": "C", "explain": "中国式现代化应是物质文明和精神文明相协调的现代化，经济基础和上层建筑相协调的表述错误。A人口规模巨大、B人与自然和谐共生、D全体人民共同富裕均是中国式现代化的正确特征，故C为错误项被选。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 22, "question": "2021年7月1日，习近平发表重要讲话以豪迈的自信、激昂的斗志，庄严宣告实现了第一个百年奋斗目标、全面建成了小康社会，鲜明提出（ ），郑重宣示坚持和发展新时代中国特色社会主义、向全面建成社会主义现代化强国的第二个百年奋斗目标迈进的坚定决心。", "options": [{"label": "A", "text": "伟大建党精神"}, {"label": "B", "text": "伟大脱贫攻坚精神"}, {"label": "C", "text": "对党忠诚"}, {"label": "D", "text": "不负人民"}], "answer": "A", "explain": "2021年七一讲话鲜明提出伟大建党精神。B脱贫攻坚精神是专项精神、C对党忠诚、D不负人民只是伟大建党精神内涵的一部分，故均不正确，正确答案是A。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 23, "question": "中国式现代化的本质要求不包括（ ）。", "options": [{"label": "A", "text": "坚持以人民为中心"}, {"label": "B", "text": "实现高质量发展"}, {"label": "C", "text": "促进人与自然和谐共生"}, {"label": "D", "text": "创造人类文明新形态"}], "answer": "A", "explain": "坚持以人民为中心并非中国式现代化本质要求的列举项，故本题应选A。B实现高质量发展、C促进人与自然和谐共生、D创造人类文明新形态均是中国式现代化的本质要求，故都是正确项。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 24, "question": "中国特色社会主义新时代，党面临的主要任务是（ ）。", "options": [{"label": "A", "text": "继续探索中国建设社会主义的正确道路，解放和发展社会生产力，使人民摆脱贫困，尽快富裕起来，为实现中华民族伟大复兴提供新的活力的体制保证和快速发展的物质条件"}, {"label": "B", "text": "实现全面建成小康社会的第一个百年奋斗目标，开启全面建成社会主义现代化强国的第二个百年奋斗目标新征程，朝着实现中华民族伟大复兴的宏伟目标继续前进"}, {"label": "C", "text": "实现从新民主主义到社会主义的转变，进行社会主义革命，推进社会主义建设，为实现中华民族伟大复兴奠定根本政治前提和制度基础"}, {"label": "D", "text": "反对帝国主义、封建主义、官僚资本主义，争取民族独立、人民解放，为实现中华民族伟大复兴创造根本社会条件"}], "answer": "B", "explain": "新时代党面临的主要任务是实现第一个百年奋斗目标、开启第二个百年奋斗目标新征程、朝着民族复兴宏伟目标继续前进。A是改革开放时期任务、C是过渡时期任务、D是新民主主义革命任务，均属于其他历史阶段，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 25, "question": "党的二十大指出，必须坚持（ ），深入实施科教兴国战略、人才强国战略、创新驱动发展战略，开辟发展新领域新赛道，不断塑造发展新动能新优势。", "options": [{"label": "A", "text": "科技是第一动力、人才是第一生产力、创新是第一资源"}, {"label": "B", "text": "科技是第一动力、人才是第一资源、创新是第一生产力"}, {"label": "C", "text": "科技是第一生产力、人才是第一动力、创新是第一资源"}, {"label": "D", "text": "科技是第一生产力、人才是第一资源、创新是第一动力"}], "answer": "D", "explain": "二十大强调科技是第一生产力、人才是第一资源、创新是第一动力。A、B、C三项对科技、人才、创新的三一定位均有错位，只有D项三一对应关系正确，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 26, "question": "2021年7月1日，习近平发表重要讲话郑重宣示坚持和发展新时代中国特色社会主义、向（ ）的第二个百年奋斗目标迈进的坚定决心，深刻阐述了以史为鉴、开创未来的根本要求，向全体中国共产党员发出了为党和人民争取更大光荣的伟大号召。", "options": [{"label": "A", "text": "全面建成社会主义现代化强国"}, {"label": "B", "text": "全面建设社会主义现代化强国"}, {"label": "C", "text": "全面建设社会主义现代化国家"}, {"label": "D", "text": "全面建成社会主义现代化国家"}], "answer": "A", "explain": "第二个百年奋斗目标是全面建成社会主义现代化强国。B全面建设强国、C全面建设国家、D全面建成国家表述均不规范，正确的完整表述是全面建成社会主义现代化强国，故正确答案是A。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 27, "question": "党的二十大强调，（ ）是我们立党立国、兴党兴国的根本指导思想。", "options": [{"label": "A", "text": "马克思主义"}, {"label": "B", "text": "列宁主义"}, {"label": "C", "text": "毛泽东思想"}, {"label": "D", "text": "邓小平理论"}], "answer": "A", "explain": "马克思主义是我们立党立国、兴党兴国的根本指导思想。B列宁主义、C毛泽东思想、D邓小平理论都是其继承发展，但根本指导思想是马克思主义，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 28, "question": "（ ）顺应了我国发展阶段、环境、条件的变化，是把握未来发展主动权的战略性布局和先手棋，是贯彻新发展理念的重大举措。", "options": [{"label": "A", "text": "新发展阶段"}, {"label": "B", "text": "高质量发展"}, {"label": "C", "text": "构建新发展格局"}, {"label": "D", "text": "经济新常态"}], "answer": "C", "explain": "构建新发展格局顺应发展阶段环境条件变化，是把握未来发展主动权的战略性布局和先手棋。A新发展阶段是方位、B高质量发展是主题、D经济新常态是更早阶段的表述，均不承担战略性布局和先手棋这一身份，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 29, "question": "（ ）是全面建成小康社会的底线任务。", "options": [{"label": "A", "text": "发展社会主义民主政治"}, {"label": "B", "text": "打赢脱贫攻坚战"}, {"label": "C", "text": "实施健康中国战略"}, {"label": "D", "text": "深化教育改革"}], "answer": "B", "explain": "打赢脱贫攻坚战是全面建成小康社会的底线任务。A发展民主政治、C实施健康中国、D深化教育改革都是重要任务，但底线任务是脱贫攻坚，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "single", "id": 30, "question": "党的二十大强调，（ ）是坚持和发展中国特色社会主义的必由之路。", "options": [{"label": "A", "text": "坚持党的全面领导"}, {"label": "B", "text": "坚持改革开放"}, {"label": "C", "text": "坚持四项基本原则"}, {"label": "D", "text": "坚持全面深化改革"}], "answer": "A", "explain": "坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。B改革开放、C四项基本原则、D全面深化改革都是实践路径，但必由之路是坚持党的全面领导，故均不正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 1, "question": "党的十八大以来，中国特色社会主义进入新时代。党面临的主要任务是（ ）。", "options": [{"label": "A", "text": "实现第一个百年奋斗目标"}, {"label": "B", "text": "开启实现第二个百年奋斗目标新征程"}, {"label": "C", "text": "为实现中华民族伟大复兴提供充满新的活力的体制保证和快速发展的物质条件"}, {"label": "D", "text": "朝着实现中华民族伟大复兴的宏伟目标继续前进"}], "answer": "ABD", "explain": "党的十八大以来党面临的主要任务是实现第一个百年奋斗目标、开启第二个百年奋斗目标新征程、朝着民族复兴宏伟目标继续前进。A、B、D正确；C为民族复兴提供体制保证和物质条件是改革开放新时期的任务，不属于新时代，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 2, "question": "实现中华民族伟大复兴的中国梦，就是要实现（ ）。", "options": [{"label": "A", "text": "国家富强"}, {"label": "B", "text": "民族振兴"}, {"label": "C", "text": "人类解放"}, {"label": "D", "text": "人民幸福"}], "answer": "ABD", "explain": "实现中华民族伟大复兴的中国梦就是要实现国家富强、民族振兴、人民幸福。A、B、D正确；C人类解放是马克思主义的最高理想，不属于中国梦的三维内涵，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 3, "question": "高质量发展是全面建设社会主义现代化国家的首要任务，为此必须（ ）。", "options": [{"label": "A", "text": "完整、准确、全面贯彻新发展理念"}, {"label": "B", "text": "更好统筹质的有效提升和量的合理增长"}, {"label": "C", "text": "坚定不移深化改革开放、深入转变发展方式"}, {"label": "D", "text": "以满足人民日益增长的美好生活需要为出发点和落脚点"}], "answer": "ABCD", "explain": "高质量发展必须完整准确全面贯彻新发展理念、统筹质的提升和量的增长、深化改革转变发展方式、以满足人民美好生活需要为落脚点。A、B、C、D四项均符合要求，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 4, "question": "全面建成小康社会（ ）。", "options": [{"label": "A", "text": "是决定当代中国命运的关键一招"}, {"label": "B", "text": "标志着中华民族伟大复兴中国梦迈出关键一步"}, {"label": "C", "text": "兑现了中国共产党和中国政府向人民、向历史作出的庄严承诺"}, {"label": "D", "text": "铸就中华民族伟大复兴的重要里程碑"}], "answer": "BCD", "explain": "全面建成小康社会标志着民族复兴中国梦迈出关键一步、兑现庄严承诺、铸就重要里程碑。B、C、D正确；A决定当代中国命运的关键一招是改革开放，不属于全面建成小康社会的意义，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 5, "question": "建设一支（ ）的人民军队，是实现“两个一百年”奋斗目标、实现中华民族伟大复兴的战略支撑。", "options": [{"label": "A", "text": "能打胜仗"}, {"label": "B", "text": "骁勇善战"}, {"label": "C", "text": "作风优良"}, {"label": "D", "text": "听党指挥"}], "answer": "ACD", "explain": "建设一支听党指挥、能打胜仗、作风优良的人民军队。A能打胜仗、C作风优良、D听党指挥正确；B骁勇善战不属于强军目标的规范表述，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 6, "question": "关于共同富裕的表述，正确的是（ ）。", "options": [{"label": "A", "text": "共同富裕是全体人民的富裕，是人民群众物质生活和精神生活都富裕"}, {"label": "B", "text": "全体人民共同富裕是一个总体概念，是对全社会而言的"}, {"label": "C", "text": "要增强区域发展的平衡性，确保所有地区同时达到一个富裕水准"}, {"label": "D", "text": "共同富裕是一个在动态中向前发展的过程，要持续推动，不断取得成效"}], "answer": "ABD", "explain": "共同富裕是全体人民的富裕、对全社会而言、是动态向前发展的过程。A、B、D正确；C确保所有地区同时达到一个富裕水准与共同富裕动态推进、兼顾平衡的理念相悖，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 7, "question": "习近平新时代中国特色社会主义思想，（ ），必须长期坚持并不断发展。", "options": [{"label": "A", "text": "是当代中国马克思主义"}, {"label": "B", "text": "是21世纪马克思主义"}, {"label": "C", "text": "是中华文化和中国精神的时代精华"}, {"label": "D", "text": "实现了马克思主义中国化时代化新的飞跃"}], "answer": "ABCD", "explain": "习近平新时代中国特色社会主义思想是当代中国马克思主义、21世纪马克思主义、中华文化和中国精神的时代精华、实现了马克思主义中国化时代化新的飞跃。A、B、C、D四项均是其历史地位的正确表述，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 8, "question": "关于总体国家安全观的表述，正确的是（ ）。", "options": [{"label": "A", "text": "总体国家安全观关键在“总体”，强调大安全理念"}, {"label": "B", "text": "总体国家安全观强调国家安全要贯穿到党和国家工作全局各方面、各环节"}, {"label": "C", "text": "总体国家安全观强调打总体战，形成强大合力应对重大国家安全风险挑战"}, {"label": "D", "text": "总体国家安全观是新时代国家安全工作的根本遵循和行动指南"}], "answer": "ABCD", "explain": "总体国家安全观关键在总体、贯穿全局、强调打总体战、是新时代安全工作行动指南。A、B、C、D四项均是对总体国家安全观的正确表述，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 9, "question": "中国共产党的执政地位在长期革命斗争中逐步形成，这是近现代中国历史发展的必然，是人民拥护和选择的结果。所以，坚持党的领导是（ ）。", "options": [{"label": "A", "text": "党和国家的根本所在、命脉所在"}, {"label": "B", "text": "全国各族人民的利益所系、幸福所系"}, {"label": "C", "text": "中国特色社会主义最本质的特征"}, {"label": "D", "text": "中国特色社会主义制度的最大优势"}], "answer": "ABCD", "explain": "坚持党的领导是党和国家的根本命脉、各族人民利益所系、社会主义最本质特征和制度最大优势。A、B、C、D四项完整概括坚持党的领导的地位意义，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 10, "question": "坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，是（ ）。", "options": [{"label": "A", "text": "新时代改革开放推向前进的根本要求"}, {"label": "B", "text": "应对风险挑战、赢得主动的有力保证"}, {"label": "C", "text": "实现“两个一百年”奋斗目标的重大任务"}, {"label": "D", "text": "积极引领全球治理体系改革的重大举措"}], "answer": "ABC", "explain": "推进国家治理现代化是新时代改革开放根本要求、应对风险挑战有力保证、实现两个一百年的重大任务。A、B、C正确；D积极引领全球治理体系改革与此题的三个定位不符，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 11, "question": "全面深化改革的总目标是（ ）。", "options": [{"label": "A", "text": "完善和发展社会主义市场经济体制"}, {"label": "B", "text": "坚持和发展社会主义基本经济制度"}, {"label": "C", "text": "推进国家治理体系和治理能力现代化"}, {"label": "D", "text": "完善和发展中国特色社会主义制度"}], "answer": "CD", "explain": "全面深化改革的总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化。C、D正确；A完善市场经济体制、B坚持基本经济制度都是经济层面内容，不是总目标，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 12, "question": "习近平在不同场合反复强调，领导干部要胸怀两个大局，这是我们谋划工作的基本出发点。“两个大局”是指（ ）。", "options": [{"label": "A", "text": "深化改革大局"}, {"label": "B", "text": "社会经济发展全局"}, {"label": "C", "text": "中华民族伟大复兴的战略全局"}, {"label": "D", "text": "世界百年未有之大变局"}], "answer": "CD", "explain": "两个大局是指中华民族伟大复兴的战略全局和世界百年未有之大变局。C、D正确；A深化改革大局、B社会经济发展全局都不是这一提法，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 13, "question": "党中央强调保证基本经济制度安全，保障关系国民经济命脉的重要行业和关键领域安全。把粮食安全作为治国理政的头等大事，（ ）。", "options": [{"label": "A", "text": "提出“确保谷物基本自给、口粮绝对安全”的新粮食安全观"}, {"label": "B", "text": "确立以我为主、立足国内、确保产能、适度进口、科技支撑的国家粮食安全战略"}, {"label": "C", "text": "实施“藏粮于地、藏粮于技”战略"}, {"label": "D", "text": "牢牢把住粮食安全主动权"}], "answer": "ABCD", "explain": "党中央确立新粮食安全观、国家粮食安全战略、实施藏粮于地藏粮于技战略、牢牢把住粮食安全主动权。A、B、C、D四项均是对粮食安全工作部署的正确表述，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 14, "question": "关于党的十九届六中全会通过的《决议》的表述，正确的是（ ）。", "options": [{"label": "A", "text": "是一篇马克思主义的纲领性文献"}, {"label": "B", "text": "是新时代中国共产党人牢记初心使命、坚持和发展中国特色社会主义的政治宣言"}, {"label": "C", "text": "是以史为鉴、开创未来、实现中华民族伟大复兴的行动指南"}, {"label": "D", "text": "对推动全党进一步统一思想、统一意志、统一行动，团结带领全国各族人民夺取新时代中国特色社会主义新的伟大胜利，具有重大现实意义和深远历史意义"}], "answer": "ABCD", "explain": "十九届六中全会《决议》是马克思主义纲领性文献、政治宣言、行动指南、统一思想意志行动的重要文件。A、B、C、D四项均是对《决议》地位作用的正确表述，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 15, "question": "关于全面建成小康社会的表述，正确的是（ ）。", "options": [{"label": "A", "text": "全面建成小康社会，实现了中华民族千百年来的夙愿"}, {"label": "B", "text": "全面建成小康社会，是迈向中华民族伟大复兴的关键一步"}, {"label": "C", "text": "全面建成小康社会，是对人类社会的伟大贡献"}, {"label": "D", "text": "全面建成小康社会，实现了国家治理体系和治理能力现代化"}], "answer": "ABC", "explain": "全面建成小康社会实现了千年夙愿、迈向民族复兴关键一步、是对人类社会的伟大贡献。A、B、C正确；D实现了国家治理体系和治理能力现代化尚未实现，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 16, "question": "新发展理念是一个系统的理论体系，回答了关于发展的（ ）等一系列理论和实践问题，阐明了中国共产党关于发展的政治立场、价值导向、发展模式、发展道路等重大政治问题。", "options": [{"label": "A", "text": "目的"}, {"label": "B", "text": "动力"}, {"label": "C", "text": "方式"}, {"label": "D", "text": "路径"}], "answer": "ABCD", "explain": "新发展理念回答了我们为什么要发展、依靠什么发展、怎样发展、走什么路径等一系列重大理论和实践问题。A目的、B动力、C方式、D路径四项完整对应，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 17, "question": "中国的全面小康，体现发展的（ ），是物质文明、政治文明、精神文明、社会文明、生态文明协调发展的小康。", "options": [{"label": "A", "text": "平衡性"}, {"label": "B", "text": "协调性"}, {"label": "C", "text": "可持续性"}, {"label": "D", "text": "曲折性"}], "answer": "ABC", "explain": "中国的全面小康体现发展的平衡性、协调性、可持续性，是五大文明协调发展的小康。A、B、C正确；D曲折性是事物发展的负面特征，不属于全面小康应有的发展品质，故排除。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 18, "question": "关于构建新发展格局的表述，正确的是（ ）。", "options": [{"label": "A", "text": "顺应了我国发展阶段、环境、条件的变化"}, {"label": "B", "text": "是把握未来发展主动权的战略性布局和先手棋"}, {"label": "C", "text": "是新发展阶段要着力推动完成的重大历史任务"}, {"label": "D", "text": "是贯彻新发展理念的重大举措"}], "answer": "ABCD", "explain": "构建新发展格局顺应发展阶段环境条件变化、是战略性布局先手棋、是新发展阶段要推动完成的重大任务、是贯彻新发展理念的重大举措。A、B、C、D四项均是其正确表述，全部正确。"}, {"chapter": "第十章 中国特色社会主义进入新时代", "type": "multi", "id": 19, "question": "中国共产党第二十次全国代表大会的主题是：高举中国特色社会主义伟大旗帜，全面贯彻习近平新时代中国特色社会主义思想，弘扬伟大建党精神，（ ），为全面建设社会主义现代化国家、全面推进中华民族伟大复兴而团结奋斗。", "options": [{"label": "A", "text": "自信自强"}, {
