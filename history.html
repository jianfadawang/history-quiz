<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国近现代史纲要 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 300px; max-height: 380px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.status-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.status-circle {
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid #d1d5db;
  color: var(--text-secondary);
  background: var(--surface);
}
.status-circle:hover { transform: scale(1.15); border-color: var(--primary-light); }
.status-circle.done { background: var(--correct); color: #fff; border-color: var(--correct); }
.status-circle.current { border-color: var(--primary); border-width: 2.5px; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: none; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-secondary);
  transition: all var(--transition); flex-shrink: 0;
}
.back-btn:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f3f9; }
.back-btn.visible { display: flex; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  text-align: center; box-shadow: var(--shadow-md); max-width: 320px; width: 90%;
}
.confirm-dialog p { font-size: 14px; margin-bottom: 16px; color: var(--text); }
.confirm-dialog .btns { display: flex; gap: 10px; }
.confirm-dialog .btns .btn { flex: 1; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.explain-box {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 10px;
  background: #f0f3f9; font-size: 13.5px; line-height: 1.65; color: var(--text);
}
.explain-label {
  flex-shrink: 0; background: var(--primary-light); color: #fff;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
}
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>

<script>
var ALL_QUESTIONS = [{"chapter": "导言", "type": "single", "id": 1, "question": "中国近代史上第一个不平等条约是（ ）。", "options": [{"label": "A", "text": "《辛丑条约）"}, {"label": "B", "text": "《马关条约》"}, {"label": "C", "text": "《南京条约》"}, {"label": "D", "text": "《北京条约》"}], "answer": "C", "explain": "《南京条约》签订于1842年，是中国近代史上第一个不平等条约，标志着中国开始沦为半殖民地半封建社会。A《辛丑条约》签订于1901年，B《马关条约》签订于1895年，D《北京条约》签订于1860年，均晚于《南京条约》。"}, {"chapter": "导言", "type": "single", "id": 2, "question": "中国近现代史，就其主流和本质来说，是中国人民为（ ）而英勇奋斗、艰辛探索并不断取得伟大成就的历史。", "options": [{"label": "A", "text": "民族独立和人民解放"}, {"label": "B", "text": "国家富强和人民幸福"}, {"label": "C", "text": "救亡图存和实现中华民族伟大复兴"}, {"label": "D", "text": "自力更生和实现中华民族伟大复兴"}], "answer": "C", "explain": "中国近现代史的主流和本质，是中国人民为救亡图存和实现中华民族伟大复兴而英勇奋斗、艰辛探索并不断取得伟大成就的历史。A民族独立和人民解放、B国家富强和人民幸福是近代两大历史任务，D“自力更生”表述不准确，均非本题所指的主流和本质。"}, {"chapter": "导言", "type": "single", "id": 3, "question": "区分新旧民主主义革命的根本标志是（ ）的变化。", "options": [{"label": "A", "text": "领导权"}, {"label": "B", "text": "斗争方式"}, {"label": "C", "text": "革命理论"}, {"label": "D", "text": "历史时期"}], "answer": "A", "explain": "区分新旧民主主义革命的根本标志是领导权的变化：旧民主主义革命由资产阶级领导，新民主主义革命由无产阶级（通过中国共产党）领导。B斗争方式、C革命理论、D历史时期都不是区分两种革命的根本标志，只是具体表现或外在形式。"}, {"chapter": "导言", "type": "single", "id": 4, "question": "中国现代史的起点是（ ）。", "options": [{"label": "A", "text": "中国共产党成立"}, {"label": "B", "text": "中华人民共和国成立"}, {"label": "C", "text": "五四运动爆发"}, {"label": "D", "text": "中华民国成立"}], "answer": "B", "explain": "中国现代史以1949年中华人民共和国成立为起点，自此中国进入新纪元。A中国共产党成立（1921年）、C五四运动（1919年）、D中华民国成立（1912年）都属于近代史范围内的事件，不能作为现代史起点。"}, {"chapter": "导言", "type": "single", "id": 5, "question": "实现中华民族伟大复兴的必由之路是（ ）。", "options": [{"label": "A", "text": "坚持和发展中国特色社会主义"}, {"label": "B", "text": "坚持改革开放"}, {"label": "C", "text": "坚持社会主义现代化建设"}, {"label": "D", "text": "坚持伟大斗争之路"}], "answer": "A", "explain": "实现中华民族伟大复兴的必由之路是坚持和发展中国特色社会主义。B坚持改革开放、C坚持社会主义现代化建设是这一道路的重要内容或组成部分，D坚持伟大斗争之路表述不规范，都不是统揽全局的必由之路。"}, {"chapter": "导言", "type": "single", "id": 6, "question": "实现中华民族伟大复兴的根本保证是（ ）。", "options": [{"label": "A", "text": "坚持以人民为中心"}, {"label": "B", "text": "坚持党的建设"}, {"label": "C", "text": "坚持国防建设"}, {"label": "D", "text": "坚持中国共产党的领导"}], "answer": "D", "explain": "实现中华民族伟大复兴的根本保证是坚持中国共产党的领导。A坚持以人民为中心是根本立场，B坚持党的建设是重要保证的具体内容，C坚持国防建设是保障国家安全的手段，均非最根本的保证。"}, {"chapter": "导言", "type": "multi", "id": 1, "question": "以鸦片战争为起点的中国近代史分为两个历史阶段，依次是（ ）。", "options": [{"label": "A", "text": "从鸦片战争到五四运动前夜"}, {"label": "B", "text": "从五四运动到中华人民共和国成立"}, {"label": "C", "text": "社会主义革命和建设时期"}, {"label": "D", "text": "改革开放和社会主义现代化建设新时期"}], "answer": "AB", "explain": "以鸦片战争为起点的中国近代史分为两个历史阶段，依次是从鸦片战争到五四运动前夜的旧民主主义革命时期，以及从五四运动到中华人民共和国成立的新民主主义革命时期。C社会主义革命和建设、D改革开放和社会主义现代化建设都是新中国成立以后的现代史阶段，不属于近代史的两个阶段，故排除。"}, {"chapter": "导言", "type": "multi", "id": 2, "question": "中华人民共和国成立以来的现代史，可以分为三个历史阶段，依次是（ ）。", "options": [{"label": "A", "text": "从五四运动到中华人民共和国成立"}, {"label": "B", "text": "社会主义革命和建设时期"}, {"label": "C", "text": "改革开放和社会主义现代化建设新时期"}, {"label": "D", "text": "中国特色社会主义新时代"}], "answer": "BCD", "explain": "新中国成立以来的现代史依次分为社会主义革命和建设时期、改革开放和社会主义现代化建设新时期、中国特色社会主义新时代三个阶段，故答案为BCD。A从五四运动到中华人民共和国成立属于近代史的新民主主义革命阶段，不属于建国后的现代史，故排除。"}, {"chapter": "导言", "type": "multi", "id": 3, "question": "近代以来，中国人民必须完成的历史任务是（ ）。", "options": [{"label": "A", "text": "反侵略斗争和推翻清王朝"}, {"label": "B", "text": "土地革命和解放斗争"}, {"label": "C", "text": "民族独立、人民解放"}, {"label": "D", "text": "国家富强、人民幸福"}], "answer": "CD", "explain": "近代以来中国人民必须完成的两大历史任务是民族独立、人民解放和国家富强、人民幸福，故答案为CD。A反侵略斗争和推翻清王朝、B土地革命和解放斗争都只是完成这两大任务的具体革命内容或手段，并非两大历史任务的完整表述，故排除。"}, {"chapter": "导言", "type": "multi", "id": 4, "question": "学习本课程要深刻领会“四个选择”，即（ ）。", "options": [{"label": "A", "text": "选择马克思主义"}, {"label": "B", "text": "选择中国共产党"}, {"label": "C", "text": "选择社会主义道路"}, {"label": "D", "text": "选择改革开放"}], "answer": "ABCD", "explain": "学习本课程要深刻领会“四个选择”，即选择马克思主义、选择中国共产党、选择社会主义道路、选择改革开放，ABCD四项均为正确表述。上述四个方面共同决定了中国的前途命运，缺一不可，故全选。"}, {"chapter": "导言", "type": "tf", "id": 1, "question": "从1840年鸦片战争爆发到1919年五四运动，是中国近代史。", "answer": false, "explain": "此说法错误。中国近代史是从1840年鸦片战争爆发到1949年中华人民共和国成立前的历史，而到1919年五四运动只是旧民主主义革命阶段的结束，此后还经历了新民主主义革命阶段，故说近代史止于五四运动不准确。"}, {"chapter": "导言", "type": "tf", "id": 2, "question": "争得民族独立、人民解放，实现国家富强、人民幸福，是中国人民必须完成的两大历史任务。", "answer": true, "explain": "此说法正确。争得民族独立、人民解放，实现国家富强、人民幸福，正是近代以来中国人民必须完成的两大历史任务，二者相互关联、不可分割。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 1, "question": "（ ）适应西方资本主义的发展要求而产生，并随着资本主义生产方式的演进而发展。", "options": [{"label": "A", "text": "商品经济"}, {"label": "B", "text": "自然经济"}, {"label": "C", "text": "殖民主义"}, {"label": "D", "text": "帝国主义"}], "answer": "C", "explain": "殖民主义是适应西方资本主义发展要求而产生，并随着资本主义生产方式的演进而发展的扩张掠夺体系。A商品经济、B自然经济都是经济形态而非对外扩张体系，D帝国主义是资本主义发展最高阶段，产生于19世纪末，故不符合题意。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 2, "question": "在19世纪末，资本主义进入（ ）阶段。", "options": [{"label": "A", "text": "侵略主义"}, {"label": "B", "text": "垄断主义"}, {"label": "C", "text": "殖民主义"}, {"label": "D", "text": "帝国主义"}], "answer": "D", "explain": "19世纪末，主要资本主义国家完成由自由资本主义向垄断过渡，进入帝国主义（垄断）阶段。A侵略主义、B垄断主义、C殖民主义都不是对这一阶段的准确命名，殖民主义早已存在，故均排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 3, "question": "鸦片战争前英国殖民者之所以大量向中国走私鸦片，主要目的是（ ）。", "options": [{"label": "A", "text": "牟取暴利扭转对华贸易逆差"}, {"label": "B", "text": "用鸦片毒害中国人民的身心健康"}, {"label": "C", "text": "取得在中国的贸易垄断权"}, {"label": "D", "text": "逼迫清政府增设通商口岸"}], "answer": "A", "explain": "鸦片战争前英国大量向中国走私鸦片，主要目的是牟取暴利并扭转对华贸易逆差。B毒害中国人民身心健康只是客观后果而非主要目的，C取得贸易垄断权、D逼迫清政府增设通商口岸都是之后通过战争与条约实现的，并非走私的根本动因。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 4, "question": "近代中国的社会性质是（ ）。", "options": [{"label": "A", "text": "封建社会"}, {"label": "B", "text": "半殖民地半封建社会"}, {"label": "C", "text": "资本主义社会"}, {"label": "D", "text": "旧民主主义社会"}], "answer": "B", "explain": "近代中国的社会性质是半殖民地半封建社会，这是由资本-帝国主义侵略造成中国既非完全独立又非完全封建的特殊形态。A封建社会是鸦片战争前的状态，C资本主义社会未曾在近代中国确立，D旧民主主义社会不是规范的社会性质概念。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 5, "question": "近代中国诞生的新兴的被压迫阶级是（ ）。", "options": [{"label": "A", "text": "工人阶级"}, {"label": "B", "text": "资产阶级"}, {"label": "C", "text": "手工业者"}, {"label": "D", "text": "城市贫民"}], "answer": "A", "explain": "近代中国诞生的新兴被压迫阶级是工人阶级，它伴随外国资本企业和中国民族工业的产生而形成，是近代史上最先进、最革命的阶级。B资产阶级、C手工业者、D城市贫民都不是近代才诞生的新兴阶级，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 6, "question": "近代中国社会最主要的矛盾是（ ）。", "options": [{"label": "A", "text": "封建主义和人民大众的矛盾"}, {"label": "B", "text": "地主阶级和农民阶级的矛盾"}, {"label": "C", "text": "帝国主义和中华民族的矛盾"}, {"label": "D", "text": "工人阶级和资产阶级的矛盾"}], "answer": "C", "explain": "帝国主义和中华民族的矛盾是近代中国社会最主要的矛盾，它决定其他矛盾的展开。A封建主义和人民大众的矛盾是另一主要矛盾但居于次要地位，B地主阶级和农民阶级的矛盾是封建社会内部矛盾，D工人阶级和资产阶级的矛盾此时尚未成为主要矛盾。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 7, "question": "近代中国一切灾难的总根源是（ ）。", "options": [{"label": "A", "text": "闭关锁国"}, {"label": "B", "text": "科学技术落后"}, {"label": "C", "text": "腐朽没落的清朝统治"}, {"label": "D", "text": "资本-帝国主义的侵略"}], "answer": "D", "explain": "资本-帝国主义的侵略是近代中国一切灾难的总根源，它使中国沦为半殖民地半封建并陷入深重灾难。A闭关锁国、B科学技术落后是造成中国落后的内因表现，C腐朽没落的清朝统治也是内因，均不是一切灾难的最根本总根源。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 8, "question": "资本-帝国主义列强对中国的侵略，首先和主要的是进行（ ）。", "options": [{"label": "A", "text": "军事侵略"}, {"label": "B", "text": "政治控制"}, {"label": "C", "text": "文化渗透"}, {"label": "D", "text": "经济掠夺"}], "answer": "A", "explain": "资本-帝国主义列强对中国的侵略，首先和主要的是进行军事侵略，通过战争打开中国大门。B政治控制、C文化渗透、D经济掠夺都是随军事侵略之后展开的方式，并非首先和主要的侵略途径。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 9, "question": "西方侵略者在中国建立的第一个租界是在（ ）。", "options": [{"label": "A", "text": "广州"}, {"label": "B", "text": "上海"}, {"label": "C", "text": "南京"}, {"label": "D", "text": "天津"}], "answer": "B", "explain": "西方侵略者在中国建立的第一个租界在上海，1845年英国在香港设立租界后，上海成为列强在中国最早开辟租界的城市之一。A广州、C南京、D天津的租界建立时间均晚于上海，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 10, "question": "1840年鸦片战争以来，西方列强对中国进行政治控制的主要手段不包括（ ）。", "options": [{"label": "A", "text": "控制中国的内政外交"}, {"label": "B", "text": "镇压中国人民的反抗"}, {"label": "C", "text": "发动战争侵占领土"}, {"label": "D", "text": "扶持和收买代理人"}], "answer": "C", "explain": "发动战争侵占领土属于军事侵略手段，不属于列强对中国进行政治控制的主要手段之列，故为本题不包括项。A控制内政外交、B镇压中国人民反抗、D扶持和收买代理人都是列强实施政治控制的典型方式。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 11, "question": "在中国近代史上提出“门户开放”政策的帝国主义国家是（ ）。", "options": [{"label": "A", "text": "英国"}, {"label": "B", "text": "俄国"}, {"label": "C", "text": "日本"}, {"label": "D", "text": "美国"}], "answer": "D", "explain": "1899年美国提出“门户开放”政策，要求列强在华利益均沾、机会均等。A英国、B俄国、C日本都不是门户开放政策的提出国，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 12, "question": "帝国主义在中国办报纸、杂志，翻译、出版各种书刊的根本目的是（ ）。", "options": [{"label": "A", "text": "为帝国主义制造侵略有理的舆论"}, {"label": "B", "text": "帮助中国建立民主政治制度"}, {"label": "C", "text": "宣传自然、科学的思想，促进中外文化交流"}, {"label": "D", "text": "宣扬“种族优劣论”，攻击污蔑中华民族的愚昧落后"}], "answer": "A", "explain": "帝国主义在中国办报纸杂志、翻译出版各种书刊的根本目的是为其侵略制造侵略有理的舆论，进行文化渗透和奴化宣传。B帮助中国建立民主政治制度、C促进中外文化交流都是非侵略者的真实意图，D宣扬种族优劣论只是具体手法之一而非根本目的。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 13, "question": "中国近代史上中国人民第一次大规模的反侵略武装斗争是（ ）。", "options": [{"label": "A", "text": "义和团抗击八国联军的斗争"}, {"label": "B", "text": "三元里人民的抗英斗争"}, {"label": "C", "text": "太平天国的反侵略斗争"}, {"label": "D", "text": "台湾人民的反割台斗争"}], "answer": "B", "explain": "三元里人民的抗英斗争是近代中国历史上中国人民第一次大规模的反侵略武装斗争。A义和团抗击八国联军、C太平天国反侵略斗争、D台湾人民反割台斗争发生时间均晚于三元里抗英，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 14, "question": "在中法战争期，（ ）中国造船厂工人举行罢工，拒绝修理受伤的法舰。", "options": [{"label": "A", "text": "上海"}, {"label": "B", "text": "广州"}, {"label": "C", "text": "香港"}, {"label": "D", "text": "澳门"}], "answer": "C", "explain": "中法战争期间，香港的中国造船厂工人举行罢工，拒绝修理受伤的法舰，体现了工人阶级的反侵略精神。A上海、B广州、D澳门的工人罢工均非本题所述，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 15, "question": "在反抗外来侵略斗争中，人民群众和（ ）起了主力军作用。", "options": [{"label": "A", "text": "统治阶级"}, {"label": "B", "text": "爱国官兵"}, {"label": "C", "text": "清朝政府"}, {"label": "D", "text": "地主武装"}], "answer": "B", "explain": "在反抗外来侵略斗争中，人民群众和爱国官兵起了主力军作用，他们是反侵略斗争的中坚力量。A统治阶级、C清朝政府在多数情况下妥协退让，D地主武装更非反侵略主力，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 16, "question": "帝国主义列强对中国的争夺和瓜分的图谋，在（ ）爆发后达到高潮。", "options": [{"label": "A", "text": "鸦片战争"}, {"label": "B", "text": "中法战争"}, {"label": "C", "text": "中日甲午战争"}, {"label": "D", "text": "第二次鸦片战争"}], "answer": "C", "explain": "中日甲午战争后，列强掀起瓜分中国的狂潮，帝国主义列强对中国的争夺和瓜分图谋达到高潮。A鸦片战争、B中法战争、D第二次鸦片战争之后列强尚未形成全面瓜分图谋，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 17, "question": "俄、德、法三国干涉还辽，充分表明（ ）。", "options": [{"label": "A", "text": "帝国主义国家之间既有矛盾又相互勾结"}, {"label": "B", "text": "俄法德三国是同盟国"}, {"label": "C", "text": "列强维护中国主权独立"}, {"label": "D", "text": "日本已暂时独霸中国"}], "answer": "A", "explain": "俄、德、法三国干涉还辽充分表明帝国主义国家之间为争夺在华利益既有矛盾又相互勾结。B三国是同盟国不符合史实，C列强维护中国主权独立是错误认识，D日本已暂时独霸中国的说法过于绝对，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 18, "question": "资本-帝国主义列强不能灭亡和瓜分近代中国的最根本原因是（ ）。", "options": [{"label": "A", "text": "中华民族进行的不屈不挠的反侵略斗争"}, {"label": "B", "text": "中国资产阶级开始登上历史舞台"}, {"label": "C", "text": "晚清政府的军事抵抗"}, {"label": "D", "text": "资本-帝国主义列强之间的矛盾"}], "answer": "A", "explain": "资本-帝国主义列强不能灭亡和瓜分近代中国的最根本原因是中华民族进行的不屈不挠的反侵略斗争。B民族资产阶级登上历史舞台、C晚清政府军事抵抗作用有限，D列强之间的矛盾制约只是次要原因，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 19, "question": "在（ ）时期，中国人民打击和教训了帝国主义侵略者，使其不敢为所欲为地瓜分中国。", "options": [{"label": "A", "text": "辛亥革命"}, {"label": "B", "text": "太平天国"}, {"label": "C", "text": "洋务运动"}, {"label": "D", "text": "义和团运动"}], "answer": "D", "explain": "在义和团运动时期，中国人民打击和教训了帝国主义侵略者，使其认识到瓜分中国难于实现，从而不敢为所欲为地瓜分中国。A辛亥革命、B太平天国、C洋务运动均未产生这一直接效果，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 20, "question": "中国在半殖民地半封建社会时期反侵略战争失败的最根本原因是（ ）。", "options": [{"label": "A", "text": "社会制度的腐败"}, {"label": "B", "text": "经济技术的落后"}, {"label": "C", "text": "军事装备的落后"}, {"label": "D", "text": "思想文化的保守"}], "answer": "A", "explain": "中国在半殖民地半封建社会时期反侵略战争失败的最根本原因是社会制度的腐败，这决定了清政府既无决心也无能力组织有效抗战。B经济技术的落后、C军事装备的落后只是次要原因，D思想文化的保守也不是最根本原因。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 21, "question": "近代中国睁眼看世界的第一人是（ ）。", "options": [{"label": "A", "text": "魏源"}, {"label": "B", "text": "李鸿章"}, {"label": "C", "text": "林则徐"}, {"label": "D", "text": "严复"}], "answer": "C", "explain": "林则徐是近代中国睁眼看世界的第一人，他组织翻译外国书籍、了解西方情势。A魏源是《海国图志》作者并提出师夷长技以制夷，B李鸿章是洋务派代表，D严复翻译《天演论》，均非第一人。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 22, "question": "在中国近代史上，（ ）提出“师夷长技以制夷”的主张。", "options": [{"label": "A", "text": "严复"}, {"label": "B", "text": "魏源"}, {"label": "C", "text": "龚自珍"}, {"label": "D", "text": "林则徐"}], "answer": "B", "explain": "魏源在《海国图志》中提出“师夷长技以制夷”的主张，主张学习西方长处以抵抗外来侵略。A严复翻译《天演论》，C龚自珍是近代开风气者但未提此主张，D林则徐是睁眼看世界第一人而非此口号提出者。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 23, "question": "（ ）以后，中国人民的民族意识开始普遍觉醒。", "options": [{"label": "A", "text": "鸦片战争"}, {"label": "B", "text": "中法战争"}, {"label": "C", "text": "中日甲午战争"}, {"label": "D", "text": "第二次鸦片战争"}], "answer": "C", "explain": "中日甲午战争以后，亡国灭种的危机加深，中国人民的民族意识开始普遍觉醒。A鸦片战争、B中法战争、D第二次鸦片战争之后的民族觉醒尚局限于少数先进分子，未达普遍程度。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "single", "id": 24, "question": "严复翻译《天演论》所宣传的思想是（ ）。", "options": [{"label": "A", "text": "物竞天择，适者生存"}, {"label": "B", "text": "中学为体，西学为用"}, {"label": "C", "text": "天下兴亡，匹夫有责"}, {"label": "D", "text": "师夷长技以制夷"}], "answer": "A", "explain": "严复翻译《天演论》，宣传物竞天择、适者生存的进化论思想，以警醒国人救亡图存。B中学为体西学为用是洋务派口号，C天下兴亡匹夫有责是古代思想，D师夷长技以制夷是魏源主张，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 1, "question": "殖民主义是西方列强对（  ）等地区人民的剥削、掠夺和压迫、奴役。", "options": [{"label": "A", "text": "亚洲"}, {"label": "B", "text": "非洲"}, {"label": "C", "text": "美洲"}, {"label": "D", "text": "大洋洲"}], "answer": "ABCD", "explain": "殖民主义是西方列强对亚洲、非洲、美洲、大洋洲等地区人民实行的剥削、掠夺、压迫和奴役，ABCD四大洲均是被殖民侵略与压迫的对象，故四项全部正确。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 2, "question": "鸦片战争前夕，英国对华进行鸦片走私的危害有（  ）。", "options": [{"label": "A", "text": "造成中国的白银大量外流和财政危机"}, {"label": "B", "text": "导致银贵钱贱，加重劳动人民的负担"}, {"label": "C", "text": "直接毒害中国人民的身心健康"}, {"label": "D", "text": "促进了中国通商口岸的开放"}], "answer": "ABC", "explain": "鸦片战争前夕英国对华鸦片走私的危害包括造成中国白银大量外流和财政危机、导致银贵钱贱加重劳动人民负担、直接毒害中国人民身心健康，故ABC正确。D促进了中国通商口岸的开放不是走私危害，反而通商口岸开放是此后列强侵略的结果，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 3, "question": "随着外国资本帝国主义的入侵，中国社会发生的根本性变化是（ ）。", "options": [{"label": "A", "text": "封建主义经济逐步变成资本主义经济"}, {"label": "B", "text": "独立的中国逐步变成半殖民地的中国"}, {"label": "C", "text": "封建的行商逐步变成买办资产阶级"}, {"label": "D", "text": "封建的中国逐步变成半封建的中国"}], "answer": "BD", "explain": "随着外国资本帝国主义的入侵，独立的中国逐步变成半殖民地的中国，封建的中国逐步变成半封建的中国，这是中国社会性质的根本性变化，故BD正确。A封建主义经济变成资本主义经济、C封建行商变成买办资产阶级都是局部现象而非根本性变化，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 4, "question": "近代中国的两大主要矛盾是（ ）。", "options": [{"label": "A", "text": "帝国主义和中华民族的矛盾"}, {"label": "B", "text": "地主阶级和农民阶级的矛盾"}, {"label": "C", "text": "封建主义和人民大众的矛盾"}, {"label": "D", "text": "工人阶级和资产阶级的矛盾"}], "answer": "AC", "explain": "近代中国的两大主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，故AC正确。B地主阶级和农民阶级的矛盾、D工人阶级和资产阶级的矛盾分别属于封建社会和后来的社会矛盾，不是近代中国两大主要矛盾，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 5, "question": "西方列强对中国的侵略途径是（ ）。", "options": [{"label": "A", "text": "军事侵略"}, {"label": "B", "text": "政治控制"}, {"label": "C", "text": "经济掠夺"}, {"label": "D", "text": "文化渗透"}], "answer": "ABCD", "explain": "西方列强对中国的侵略途径包括军事侵略、政治控制、经济掠夺和文化渗透四个方面，ABCD四项均为列强侵略中国的不同方面，故全部正确。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 6, "question": "帝国主义列强对中国进行文化渗透的目的是（ ）。", "options": [{"label": "A", "text": "宣扬殖民主义奴化思想"}, {"label": "B", "text": "麻醉中国人民的精神"}, {"label": "C", "text": "传播西方文化和科学"}, {"label": "D", "text": "摧毁中国人的民族自尊心和自信心"}], "answer": "ABD", "explain": "帝国主义列强对中国进行文化渗透的目的是宣扬殖民主义奴化思想、麻醉中国人民的精神、摧毁中国人的民族自尊心和自信心，故ABD正确。C传播西方文化和科学只是表象，并非侵略者文化渗透的真实目的，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 7, "question": "在19世纪，沙皇俄国趁火打劫，通过（ ）等条约侵占中国领土150多万平方公里。", "options": [{"label": "A", "text": "《瑷珲条约》"}, {"label": "B", "text": "《北京条约》"}, {"label": "C", "text": "《勘分西北界约记》"}, {"label": "D", "text": "《改订伊犁条约》和5个勘界议定书"}], "answer": "ABCD", "explain": "19世纪沙皇俄国趁火打劫，通过《瑷珲条约》《北京条约》《勘分西北界约记》《改订伊犁条约》和5个勘界议定书等条约侵占中国领土150多万平方公里，ABCD四项均为沙俄侵占中国领土的不平等条约，故全部正确。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 8, "question": "在近代中国，最终被日本割走并占据长达半个世纪之久的中国领土是（ ）", "options": [{"label": "A", "text": "辽东半岛"}, {"label": "B", "text": "福建"}, {"label": "C", "text": "台湾全岛及其附属各岛屿"}, {"label": "D", "text": "澎湖列岛"}], "answer": "CD", "explain": "《马关条约》规定割让台湾全岛及其附属各岛屿和澎湖列岛，被日本占据长达半个世纪，故CD正确。A辽东半岛虽一度被割让但因三国干涉还辽而归还，B福建并未被割让，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 9, "question": "在反抗外来侵略斗争中，（ ）起了主力军作用。", "options": [{"label": "A", "text": "人民群众"}, {"label": "B", "text": "清朝政府"}, {"label": "C", "text": "爱国官兵"}, {"label": "D", "text": "地主武装"}], "answer": "AC", "explain": "在反抗外来侵略斗争中，人民群众和爱国官兵起了主力军作用，故AC正确。B清朝政府在多数情况下奉行妥协政策，D地主武装并非反侵略主力，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 10, "question": "近代中国人民的反侵略战争（ ）。", "options": [{"label": "A", "text": "使我们的国家和民族历尽劫难、屡遭侵略而不亡"}, {"label": "B", "text": "表现出来的爱国主义精神，进一步铸成中华民族的民族魂"}, {"label": "C", "text": "阻止了中国的半封建化的进程"}, {"label": "D", "text": "阻止了中国的半殖民地化的进程"}], "answer": "AB", "explain": "近代中国人民的反侵略战争使国家和民族历尽劫难、屡遭侵略而不亡，表现出来的爱国主义精神进一步铸成中华民族的民族魂，故AB正确。C、D所谓阻止半封建化、半殖民地化进程不符合史实，反侵略战争并未阻止中国逐步沦为半殖民地半封建社会，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 11, "question": "帝国主义侵略中国的最终目的是（ ）。", "options": [{"label": "A", "text": "瓜分中国"}, {"label": "B", "text": "灭亡中国"}, {"label": "C", "text": "发展中国"}, {"label": "D", "text": "帮助中国消灭封建旧势力"}], "answer": "AB", "explain": "帝国主义侵略中国的最终目的是瓜分中国、灭亡中国，使中国成为其殖民地，故AB正确。C发展中国、D帮助中国消灭封建旧势力都是美化侵略的虚假说法，不符合列强侵略本质，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 12, "question": "19世纪末期，帝国主义列强瓜分中国的图谋并未实现，其原因有（ ）。", "options": [{"label": "A", "text": "中国地域过于广阔"}, {"label": "B", "text": "中华民族进行的不屈不挠的反侵略斗争"}, {"label": "C", "text": "清政府与列强相勾结"}, {"label": "D", "text": "帝国主义列强之间的矛盾和互相制约"}], "answer": "BD", "explain": "19世纪末帝国主义列强瓜分中国的图谋未实现，其原因有中华民族进行的不屈不挠的反侵略斗争和帝国主义列强之间的矛盾和互相制约，故BD正确。A中国地域过于广阔只是客观条件，C清政府与列强相勾结反而助长侵略，均非阻止瓜分的原因，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 13, "question": "从鸦片战争到抗日战争以前，中国的反侵略战争无不以中国的失败而告终。从中国内部因素来分析，其原因主要在于（ ）。", "options": [{"label": "A", "text": "抵抗决心不强"}, {"label": "B", "text": "社会制度腐败"}, {"label": "C", "text": "军队战斗力差"}, {"label": "D", "text": "经济技术落后"}], "answer": "BD", "explain": "从中国内部因素看，近代反侵略战争失败的主要原因在于社会制度腐败和经济技术落后，故BD正确。A抵抗决心不强、C军队战斗力差都只是社会制度腐败的具体表现或次要因素，不是并列的根本原因，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 14, "question": "关于《海国图志》的表述，正确的是（ ）", "options": [{"label": "A", "text": "提出“师夷长技以制夷”的思想"}, {"label": "B", "text": "主张学习外国先进的军事和科技技术"}, {"label": "C", "text": "期望富国强兵，抵御外国侵略"}, {"label": "D", "text": "作者是近代中国睁眼看世界的第一人"}], "answer": "ABC", "explain": "《海国图志》提出师夷长技以制夷的思想，主张学习外国先进的军事和科学技术，期望富国强兵、抵御外国侵略，故ABC正确。D作者是近代中国睁眼看世界的第一人表述有误，《海国图志》作者魏源，睁眼看世界第一人是林则徐，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 15, "question": "19世纪70年代以后，王韬、薛福成、马建忠、郑观应等早期维新思想家主张（ ）。", "options": [{"label": "A", "text": "学习西方的军事技术"}, {"label": "B", "text": "学习西方的科学技术"}, {"label": "C", "text": "吸纳西方的政治学说"}, {"label": "D", "text": "吸纳西方的经济学说"}], "answer": "BCD", "explain": "19世纪70年代以后，王韬、薛福成、马建忠、郑观应等早期维新思想家主张学习西方的科学技术、吸纳西方的政治学说和经济学说，故BCD正确。A学习西方军事技术只是洋务运动的重点，早期维新派主张已发展到政治经济层面，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "multi", "id": 16, "question": "中日甲午战争以后，民族意识普遍觉醒中的先进中国人提出的主要口号是（ ）。", "options": [{"label": "A", "text": "救亡图存"}, {"label": "B", "text": "自强、求富"}, {"label": "C", "text": "振兴中华"}, {"label": "D", "text": "师夷长技以制夷"}], "answer": "AC", "explain": "中日甲午战争以后民族意识普遍觉醒，先进中国人提出的主要口号是救亡图存和振兴中华，故AC正确。B自强、求富是洋务运动的口号，D师夷长技以制夷是魏源早先提出，均非甲午战争后民族觉醒的主要口号，故排除。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 1, "question": "英国对中国发动鸦片战争的根源在于清政府执行禁烟政策。", "answer": false, "explain": "此说法错误。英国发动鸦片战争的根源在于其资本主义对外扩张和侵略的本质，清政府禁烟政策只是导火索或借口，并非根源。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 2, "question": "帝国主义和中华民族的矛盾是近代中国社会最主要的矛盾。", "answer": true, "explain": "此说法正确。帝国主义和中华民族的矛盾是近代中国社会最主要的矛盾，它贯穿近代中国历史并起支配作用。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 3, "question": "西方列强侵略中国的目的是要帮助中国走出封建社会，发展资本主义。", "answer": false, "explain": "此说法错误。西方列强侵略中国的目的是瓜分、掠夺和奴役中国，而非帮助中国走出封建社会、发展资本主义。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 4, "question": "西方列强对中国进行文化渗透的目的是传播西方文化。", "answer": false, "explain": "此说法错误。西方列强对中国进行文化渗透的目的是宣扬奴化思想、麻醉和奴役中国人民，并非传播西方文化。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 5, "question": "中国人民包括统治阶级中的爱国人士在反侵略斗争中表现出来的爱国主义精神，进一步铸成了中华民族的民族魂。", "answer": true, "explain": "此说法正确。包括统治阶级中爱国人士在内的中国人民在反侵略斗争中表现出来的爱国主义精神，进一步铸成了中华民族的民族魂。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 6, "question": "帝国主义列强不能灭亡和瓜分中国的根本原因是帝国主义列强之间的矛盾和互相制约。", "answer": false, "explain": "此说法错误。帝国主义列强不能灭亡和瓜分中国的根本原因是中华民族进行的不屈不挠的反侵略斗争，列强之间的矛盾和互相制约只是次要原因。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 7, "question": "近代中国人民反侵略战争失败的根本原因在于当时中国武器装备落后。", "answer": false, "explain": "此说法错误。近代中国人民反侵略战争失败的根本原因在于社会制度的腐败，而非中国武器装备的落后。"}, {"chapter": "第一章  进入近代后中华民族的磨难与抗争", "type": "tf", "id": 8, "question": "民族危机激发了中华民族的觉醒，增强了中华民族的凝聚力。", "answer": true, "explain": "此说法正确。民族危机激发了中华民族的觉醒，增强了中华民族的凝聚力，促进了救亡图存运动的兴起。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 1, "question": "太平天国农民战争的领导人是（ ）。", "options": [{"label": "A", "text": "林则徐"}, {"label": "B", "text": "洪秀全"}, {"label": "C", "text": "李鸿章"}, {"label": "D", "text": "康有为"}], "answer": "B", "explain": "太平天国农民战争的领导人是洪秀全。A林则徐是禁烟派官员，C李鸿章是洋务派代表，D康有为是维新派代表，均非太平天国领导人，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 2, "question": "太平天国农民起义赖以发动的宗教组织是（ ）。", "options": [{"label": "A", "text": "白莲教"}, {"label": "B", "text": "基督教"}, {"label": "C", "text": "拜上帝教"}, {"label": "D", "text": "天地会"}], "answer": "C", "explain": "太平天国农民起义赖以发动的宗教组织是拜上帝教，由洪秀全吸收西方基督教教义结合中国实际创立。A白莲教、D天地会是中国民间秘密组织，B基督教是外来宗教而非太平天国组织，均排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 3, "question": "太平天国进行的战争是反对（ ）压迫、剥削的正义战争。", "options": [{"label": "A", "text": "清政府腐朽统治和地主阶级"}, {"label": "B", "text": "清政府腐朽统治和资产阶级"}, {"label": "C", "text": "帝国主义统治和地主阶级"}, {"label": "D", "text": "清政府腐朽统治和帝国主义"}], "answer": "A", "explain": "太平天国进行的战争是反对清政府腐朽统治和地主阶级压迫、剥削的正义战争。B资产阶级此时尚非中国主要压迫者，C帝国主义统治、D帝国主义等表述都不符合太平天国主要斗争对象，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 4, "question": "关于《天朝田亩制度》和《资政新篇》的表述，正确的是（ ）。", "options": [{"label": "A", "text": "都主张学习西方先进制度"}, {"label": "B", "text": "都具有反封建的进步性"}, {"label": "C", "text": "都代表了近代中国社会发展方向"}, {"label": "D", "text": "都有利于中国资本主义的发展"}], "answer": "B", "explain": "《天朝田亩制度》和《资政新篇》都具有反封建的进步性，前者否定封建土地所有制，后者带有发展资本主义色彩。A都主张学习西方先进制度仅《资政新篇》符合，C都代表近代中国发展方向、D都有利于资本主义发展都不准确，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 5, "question": "最能体现太平天国社会理想和农民起义特色的文件是（ ）。", "options": [{"label": "A", "text": "《海国图志》"}, {"label": "B", "text": "《天朝田亩制度》"}, {"label": "C", "text": "《资政新篇》"}, {"label": "D", "text": "《救亡决论》"}], "answer": "B", "explain": "《天朝田亩制度》以平均分配土地为核心，最能体现太平天国推翻封建土地制度的社会理想和农民起义特色。A《海国图志》是魏源著作，C《资政新篇》具有资本主义色彩但不反映农民平均土地愿望，D《救亡决论》是严复著作，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 6, "question": "中国历史上第一个比较系统的发展资本主义的方案是（ ）。", "options": [{"label": "A", "text": "《海国图志》"}, {"label": "B", "text": "《天朝田亩制度》"}, {"label": "C", "text": "《资政新篇》"}, {"label": "D", "text": "《救亡决论》"}], "answer": "C", "explain": "《资政新篇》是中国历史上第一个比较系统的发展资本主义的方案，提出发展近代工商业、交通等主张。A《海国图志》介绍西方而非资本主义建设方案，B《天朝田亩制度》是平均土地纲领，D《救亡决论》是严复文章，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 7, "question": "太平天国由盛转衰的标志是（ ）。", "options": [{"label": "A", "text": "天京事变"}, {"label": "B", "text": "洪秀全病逝"}, {"label": "C", "text": "安庆失陷"}, {"label": "D", "text": "天京陷落"}], "answer": "A", "explain": "天京事变是太平天国由盛转衰的标志，领导集团内部争权内讧严重削弱了起义力量。B洪秀全病逝、C安庆失陷、D天京陷落都发生在天京事变之后，是失败过程中的事件，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 8, "question": "太平天国运动面临的以往农民运动从未遭遇的新情况是（ ）。", "options": [{"label": "A", "text": "领导阶层的迅速腐化"}, {"label": "B", "text": "流动作战没有固定根据地"}, {"label": "C", "text": "中外反动势力的联合绞杀"}, {"label": "D", "text": "没有正确的指导思想"}], "answer": "C", "explain": "中外反动势力的联合绞杀是太平天国运动面临的以往农民运动从未遭遇的新情况，中外敌人勾结镇压使起义失败。A领导阶层腐化、B流动作战、D没有正确指导思想都是以往农民起义也存在的共性，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 9, "question": "李大钊说：“太平天国禁止了鸦片，却采用了宗教，不建设民国，而建设天国，这是他们失败的一个重要原因。”这段话说明太平天国运动（ ）。", "options": [{"label": "A", "text": "不能充分依靠人民"}, {"label": "B", "text": "缺乏科学理论指导"}, {"label": "C", "text": "没有关注群众需求"}, {"label": "D", "text": "没有彻底的革命精神"}], "answer": "B", "explain": "太平天国采用宗教、不建设民国而建设天国，说明其缺乏科学理论指导，故选择B。A不能充分依靠人民、C没有关注群众需求、D没有彻底的革命精神在材料中均未体现，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 10, "question": "太平天国起义失败的根本原因是（ ）。", "options": [{"label": "A", "text": "缺乏先进阶级的领导"}, {"label": "B", "text": "没有科学理论的指导"}, {"label": "C", "text": "脱离广大的人民群众"}, {"label": "D", "text": "对外国资本主义列强侵华野心的警惕性不够"}], "answer": "A", "explain": "太平天国起义失败的根本原因是缺乏先进阶级的领导，农民阶级不是新的生产力的代表，不可能领导革命走向彻底胜利。B没有科学理论指导、C脱离人民群众、D对列强警惕不够都是具体原因，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 11, "question": "关于洋务运动的表述，不正确的是（ ）。", "options": [{"label": "A", "text": "口号是“自强”和“求富”"}, {"label": "B", "text": "客观上促进资本主义的发展"}, {"label": "C", "text": "触及到封建统治的根基"}, {"label": "D", "text": "封建统治阶级的自救运动"}], "answer": "C", "explain": "关于洋务运动的表述，不正确的是它触及到封建统治的根基，故答案为C。A口号是自强求富、B客观促进资本主义发展、D是封建统治阶级的自救运动均为正确表述。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 12, "question": "洋务派代表的社会阶层是（ ）。", "options": [{"label": "A", "text": "地主阶级"}, {"label": "B", "text": "官僚资产阶级"}, {"label": "C", "text": "民族资产阶级"}, {"label": "D", "text": "农民阶级"}], "answer": "A", "explain": "洋务派代表的是地主阶级的利益，其根本目的在维护封建统治。B官僚资产阶级、C民族资产阶级、D农民阶级都不是洋务派的阶级属性，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 13, "question": "洋务运动的指导思想是（ ）。", "options": [{"label": "A", "text": "师夷长技以制夷"}, {"label": "B", "text": "中学为体，西学为用"}, {"label": "C", "text": "外敦和好，内要自强"}, {"label": "D", "text": "托古改制"}], "answer": "B", "explain": "洋务运动的指导思想是中学为体、西学为用，即在维护封建纲常名教的前提下学习西方技术。A师夷长技以制夷是魏源主张，C外敦和好内要自强是洋务外交策略，D托古改制是康有为手法，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 14, "question": "冯桂芬在（ ）中强调，为了应对西方的挑战，中国亟须进行改革。", "options": [{"label": "A", "text": "《仁学》"}, {"label": "B", "text": "《劝学篇》"}, {"label": "C", "text": "《盛世危言》"}, {"label": "D", "text": "《校邠庐抗议》"}], "answer": "D", "explain": "冯桂芬在《校邠庐抗议》中强调为了应对西方的挑战，中国亟须进行改革。A《仁学》是谭嗣同著作，B《劝学篇》是张之洞著作，C《盛世危言》是郑观应著作，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 15, "question": "洋务派最先兴办的是（ ）。", "options": [{"label": "A", "text": "民用工业"}, {"label": "B", "text": "军事工业"}, {"label": "C", "text": "新式学堂"}, {"label": "D", "text": "新式军队"}], "answer": "B", "explain": "洋务派最先兴办的是军事工业，如安庆内军械所、江南制造总局等，以图自强。A民用工业、C新式学堂、D新式军队的兴办均晚于军事工业，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 16, "question": "中国近代海军的建立是在（ ）。", "options": [{"label": "A", "text": "洋务运动时期"}, {"label": "B", "text": "中法战争时期"}, {"label": "C", "text": "第二次鸦片战争时期"}, {"label": "D", "text": "中日甲午战争时期"}], "answer": "A", "explain": "中国近代海军的建立是在洋务运动时期，洋务派创建了北洋、南洋、福建、广东四支新式海军。B中法战争、C第二次鸦片战争、D中日甲午战争时期均非海军建立期，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 17, "question": "在19世纪60年代到90年代，洋务派兴办洋务事业的主要目的是（ ）。", "options": [{"label": "A", "text": "发展中国的民族资本主义经济"}, {"label": "B", "text": "学习西方资本主义的政治制度，推翻封建社会"}, {"label": "C", "text": "反对西方列强的侵略，捍卫国家的主权独立和民族尊严"}, {"label": "D", "text": "在维护和巩固封建统治的前提下，学习西方近代工业和技术"}], "answer": "D", "explain": "洋务派兴办洋务事业的主要目的是在维护和巩固封建统治的前提下学习西方近代工业和技术，故答案为D。A发展民族资本主义、B学习西方政治制度推翻封建社会、C以捍卫国家主权为宗旨都不符合洋务派维护封建统治的根本目的。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 18, "question": "洋务运动失败的标志是（ ）。", "options": [{"label": "A", "text": "北洋水师全军覆没"}, {"label": "B", "text": "义和团运动兴起"}, {"label": "C", "text": "英法联军攻占北京"}, {"label": "D", "text": "八国联军入侵北京"}], "answer": "A", "explain": "甲午战争中北洋水师全军覆没，标志着洋务运动的失败。B义和团运动兴起、C英法联军攻占北京、D八国联军入侵北京都与洋务运动失败标志无关，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 19, "question": "洋务运动失败的原因不包括（ ）。", "options": [{"label": "A", "text": "具有封建性"}, {"label": "B", "text": "管理具有腐朽性"}, {"label": "C", "text": "封建统治者不支持"}, {"label": "D", "text": "对列强具有依赖性"}], "answer": "C", "explain": "洋务运动失败的原因不包括封建统治者不支持，因为洋务运动正是由封建统治者（洋务派）自上而下推动的，故答案为C。A具有封建性、B管理具有腐朽性、D对列强具有依赖性都是洋务运动失败的重要原因。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 20, "question": "洋务运动未能使中国走上富强的根本原因是（ ）。", "options": [{"label": "A", "text": "没有采用资本主义生产管理制度"}, {"label": "B", "text": "没有触动封建生产关系"}, {"label": "C", "text": "西方列强极力阻碍破坏"}, {"label": "D", "text": "单纯学习西方科技以求自强"}], "answer": "B", "explain": "洋务运动未能使中国走上富强的根本原因是没有触动封建生产关系，其封建性决定了无法从根本上改变中国落后状态。A未用资本主义管理制度、C列强阻碍破坏、D单纯学习科技都是次要原因或表现，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 21, "question": "戊戌维新运动发生在19世纪90年代的（ ）之后。", "options": [{"label": "A", "text": "鸦片战争"}, {"label": "B", "text": "八国联军侵华战争"}, {"label": "C", "text": "中法战争"}, {"label": "D", "text": "中日甲午战争"}], "answer": "D", "explain": "戊戌维新运动发生在19世纪90年代的中日甲午战争之后，甲午战败的刺激推动了维新运动。A鸦片战争、B八国联军侵华战争、C中法战争的时间及其与维新运动关系均不符，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 22, "question": "中国民族资产阶级登上政治舞台的第一次表演是（ ）。", "options": [{"label": "A", "text": "洋务运动"}, {"label": "B", "text": "戊戌维新运动"}, {"label": "C", "text": "辛亥革命"}, {"label": "D", "text": "太平天国运动"}], "answer": "B", "explain": "戊戌维新运动是中国民族资产阶级登上政治舞台的第一次表演，资产阶级维新派首次以独立政治力量开展救国活动。A洋务运动由地主阶级领导，C辛亥革命是之后的事，D太平天国运动是农民运动，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 23, "question": "资产阶级思想与封建主义思想在中国的第一次正面交锋是（ ）。", "options": [{"label": "A", "text": "维新派与守旧派的论战"}, {"label": "B", "text": "洋务派与守旧派的论战"}, {"label": "C", "text": "革命派与保皇派的论战"}, {"label": "D", "text": "革命派与维新派的论战"}], "answer": "A", "explain": "维新派与守旧派的论战是资产阶级思想与封建主义思想在中国的第一次正面交锋。B洋务派与守旧派均属地主阶级内部争论，C革命派与保皇派、D革命派与维新派的论战都发生在其后，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 24, "question": "百日维新发生于（ ）时期。", "options": [{"label": "A", "text": "洋务运动"}, {"label": "B", "text": "戊戌变法"}, {"label": "C", "text": "辛亥革命"}, {"label": "D", "text": "新文化运动"}], "answer": "B", "explain": "百日维新发生于戊戌变法时期，是1898年6月至9月光绪帝颁布新政的高潮阶段。A洋务运动、C辛亥革命、D新文化运动与百日维新时间及性质均不符，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 25, "question": "百日维新后，除（ ）被保留下来以外，其余新政措施大都被废除。", "options": [{"label": "A", "text": "改革财政"}, {"label": "B", "text": "改革行政机构"}, {"label": "C", "text": "京师大学堂"}, {"label": "D", "text": "准许旗人自谋生计"}], "answer": "C", "explain": "百日维新后，除京师大学堂被保留下来以外，其余新政措施大都被废除，故答案为C。A改革财政、B改革行政机构、D准许旗人自谋生计等新政均被废止，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 26, "question": "戊戌维新运动是一次（ ）。", "options": [{"label": "A", "text": "资产阶级改良运动"}, {"label": "B", "text": "地主阶级改良运动"}, {"label": "C", "text": "资产阶级革命运动"}, {"label": "D", "text": "地主阶级革命运动"}], "answer": "A", "explain": "戊戌维新运动是一次资产阶级改良运动，由资产阶级维新派推动、企图通过君主立宪实现改良。B地主阶级改良、C资产阶级革命、D地主阶级革命都不符合戊戌维新的阶级属性和性质，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 27, "question": "关于戊戌维新运动的表述，错误的是（ ）。", "options": [{"label": "A", "text": "一场爱国救亡运动"}, {"label": "B", "text": "一场思想再造运动"}, {"label": "C", "text": "一场政治改良运动"}, {"label": "D", "text": "一场思想启蒙运动"}], "answer": "B", "explain": "关于戊戌维新运动的表述，错误的是思想再造运动，因为戊戌维新实质是爱国救亡、政治改良和思想启蒙运动，故答案为B。A爱国救亡、C政治改良、D思想启蒙都是戊戌维新运动的正确定性。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 28, "question": "资产阶级新文化开始打破封建文化独占文化阵地的局面的起点是（ ）。", "options": [{"label": "A", "text": "新文化运动"}, {"label": "B", "text": "辛亥革命"}, {"label": "C", "text": "维新运动"}, {"label": "D", "text": "洋务运动"}], "answer": "C", "explain": "维新运动是资产阶级新文化开始打破封建文化独占文化阵地的局面的起点。A新文化运动、B辛亥革命、D洋务运动都非这一文化转折的起点，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 29, "question": "关于维新派本身具有的局限性的表述，错误的是（ ）。", "options": [{"label": "A", "text": "不主张发展民族资本主义"}, {"label": "B", "text": "对帝国主义抱有幻想"}, {"label": "C", "text": "害怕发动人民群众"}, {"label": "D", "text": "不敢根本否定封建君主制度"}], "answer": "A", "explain": "关于维新派局限性的表述，错误的是不主张发展民族资本主义，因为维新派恰恰主张发展民族资本主义，故答案为A。B对帝国主义抱有幻想、C害怕发动人民群众、D不敢根本否定封建君主制度都是维新派的真实局限。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "single", "id": 30, "question": "戊戌维新运动失败的主要原因是（ ）。", "options": [{"label": "A", "text": "没有获得广大群众的支持"}, {"label": "B", "text": "中国民族资本主义经济力量十分弱小"}, {"label": "C", "text": "维新派寄希望于没有实权的皇帝"}, {"label": "D", "text": "维新派自身的局限和强大的守旧势力的反对"}], "answer": "D", "explain": "戊戌维新运动失败的主要原因是维新派自身的局限和强大的守旧势力的反对，故答案为D。A没有获得群众支持、B民族资本主义经济力量弱小、C寄希望于无实权的皇帝都是次要或具体原因，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 1, "question": "近代对国家出路的早期探索包括（  ）。", "options": [{"label": "A", "text": "戊戌维新运动"}, {"label": "B", "text": "太平天国运动"}, {"label": "C", "text": "新文化运动"}, {"label": "D", "text": "洋务运动"}], "answer": "ABD", "explain": "近代对国家出路的早期探索包括太平天国运动、洋务运动和戊戌维新运动，故答案为ABD。C新文化运动属于近代后期思想解放运动，不属于早期国家出路探索，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 2, "question": "在对国家出路的早期探索中，先后提出自己的主张和方案的阶级主要是（ ）。", "options": [{"label": "A", "text": "地主阶级洋务派"}, {"label": "B", "text": "地主阶级顽固派"}, {"label": "C", "text": "农民阶级"}, {"label": "D", "text": "资产阶级维新派"}], "answer": "ACD", "explain": "在对国家出路的早期探索中，先后提出自己主张和方案的阶级主要是地主阶级洋务派、农民阶级和资产阶级维新派，故答案为ACD。B地主阶级顽固派反对变革，未提出救国方案，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 3, "question": "太平天国农民起义、洋务运动、戊戌维新运动的共同点是（ ）。", "options": [{"label": "A", "text": "没有找到科学的理论"}, {"label": "B", "text": "没有找到正确的道路"}, {"label": "C", "text": "没有找到可依靠的社会力量"}, {"label": "D", "text": "没有纲领性文件"}], "answer": "ABC", "explain": "太平天国农民起义、洋务运动、戊戌维新运动的共同点是都没有找到科学的理论、正确的道路和可依靠的社会力量，故答案为ABC。D没有纲领性文件表述错误，太平天国有《天朝田亩制度》等纲领，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 4, "question": "太平天国政权颁布的纲领有是（ ）。", "options": [{"label": "A", "text": "《海国图志》"}, {"label": "B", "text": "《天朝田亩制度》"}, {"label": "C", "text": "《盛世危言》"}, {"label": "D", "text": "《资政新篇》"}], "answer": "BD", "explain": "太平天国政权颁布的纲领是《天朝田亩制度》和《资政新篇》，故答案为BD。A《海国图志》是魏源著作，C《盛世危言》是郑观应著作，均非太平天国纲领，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 5, "question": "《天朝田亩制度》具有进步意义是因为（ ）", "options": [{"label": "A", "text": "体现了广大农民要求平均分配土地的强烈愿望"}, {"label": "B", "text": "对以往农民战争中“均平”“均田”思想的发展和超越"}, {"label": "C", "text": "否定了封建土地所有制"}, {"label": "D", "text": "对以往农民战争中“均贫富”“等贵贱”思想的发展和超越"}], "answer": "ABCD", "explain": "《天朝田亩制度》具有进步意义，原因在于体现广大农民平均分配土地的强烈愿望、对以往均平与均田思想的发展和超越、否定封建土地所有制，ABCD四项均正确。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 6, "question": "关于《资政新篇》的表述，正确的有（ ）。", "options": [{"label": "A", "text": "具有资本主义色彩"}, {"label": "B", "text": "未涉及农民问题和土地问题"}, {"label": "C", "text": "主张“中学为体，西学为用”思想"}, {"label": "D", "text": "缺乏实施的阶级基础和社会条件"}], "answer": "ABD", "explain": "关于《资政新篇》的正确表述有：具有资本主义色彩、未涉及农民问题和土地问题、缺乏实施的阶级基础和社会条件，故答案为ABD。C主张中学为体西学为用是洋务运动指导思想而非《资政新篇》，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 7, "question": "太平天国的历史意义有（ ）。", "options": [{"label": "A", "text": "沉重打击了封建统治阶级，强烈撼动了清政府的统治根基"}, {"label": "B", "text": "比较完整地表达了千百年来农民对拥有土地的渴望，是中国旧式农民战争的最高峰"}, {"label": "C", "text": "有力打击了外国侵略势力，冲击了西方殖民主义在亚洲的统治"}, {"label": "D", "text": "冲击了孔子和儒家经典的正统权威，在一定程度是削弱了封建统治的精神支柱"}], "answer": "ABCD", "explain": "太平天国的历史意义包括沉重打击封建统治撼动清政府根基、是旧式农民战争最高峰、打击外国侵略势力、冲击孔子和儒家经典的正统权威，ABCD四项均正确。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 8, "question": "太平天国的兴起和失败说明了（ ）。", "options": [{"label": "A", "text": "农民具有伟大的革命潜力"}, {"label": "B", "text": "农民战争是资产阶级革命的前奏"}, {"label": "C", "text": "农民自身不能担负起领导反帝反封建斗争取得胜利的重任"}, {"label": "D", "text": "单纯的农民战争不可能完成争取民族独立和人民解放的历史任务"}], "answer": "ACD", "explain": "太平天国的兴起和失败说明农民具有伟大的革命潜力、农民自身不能担负反帝反封建领导重任、单纯农民战争不能完成民族独立和人民解放任务，故答案为ACD。B农民战争是资产阶级革命的前奏表述不准确，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 9, "question": "与以往农民战争相比，太平天国运动新的时代特点表现在（ ）", "options": [{"label": "A", "text": "发动规模空前巨大"}, {"label": "B", "text": "反对封建主义同时反对帝国主义侵略"}, {"label": "C", "text": "《天朝田亩制度》的平均主义思想以及《资政新编》的资本主义色彩"}, {"label": "D", "text": "一定程度上削弱了封建统治的精神支柱"}], "answer": "ABCD", "explain": "与以往农民战争相比，太平天国运动新的时代特点包括发动规模空前、在反封建同时反对帝国主义侵略、《天朝田亩制度》的平均主义与《资政新篇》的资本主义色彩、削弱封建统治精神支柱，ABCD四项均正确。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 10, "question": "洋务运动的目标是（ ）。", "options": [{"label": "A", "text": "独立"}, {"label": "B", "text": "民主"}, {"label": "C", "text": "自强"}, {"label": "D", "text": "求富"}], "answer": "CD", "explain": "洋务运动的目标是自强和求富，故答案为CD。A独立、B民主都不是洋务运动的目标，其目的在维护封建统治，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 11, "question": "洋务派兴办的洋务事业有（ ）。", "options": [{"label": "A", "text": "兴办近代企业"}, {"label": "B", "text": "建立新式海陆军"}, {"label": "C", "text": "创办新式学堂，派遣留学生"}, {"label": "D", "text": "设议院，进行官制改革"}], "answer": "ABC", "explain": "洋务派兴办的洋务事业包括兴办近代企业、建立新式海陆军、创办新式学堂并派遣留学生，故答案为ABC。D设议院、进行官制改革是戊戌维新的主张，非洋务事业，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 12, "question": "第二次鸦片战争后，清朝统治集团内部一部分人震惊于列强的“船坚炮利”，主张学习西方以求“自强”，洋务运动由此兴起。洋务运动的一个重要内容就是创办新式学堂，主要有（ ）。", "options": [{"label": "A", "text": "翻译学堂"}, {"label": "B", "text": "工艺学堂"}, {"label": "C", "text": "军事学堂"}, {"label": "D", "text": "法政学堂"}], "answer": "ABC", "explain": "洋务派创办的新式学堂主要有翻译学堂、工艺学堂和军事学堂，故答案为ABC。D法政学堂是后来维新和清末新政时期的产物，不属于洋务派创办的主要学堂类型，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 13, "question": "关于洋务运动的表述，正确的有（ ）。", "options": [{"label": "A", "text": "不可能避免最终失败的命运"}, {"label": "B", "text": "并非要使中国朝着独立的资本主义方向发展"}, {"label": "C", "text": "不可能为中国摆脱贫弱找到出路"}, {"label": "D", "text": "目的是为了推翻清政府的统治"}], "answer": "ABC", "explain": "关于洋务运动的正确表述有：不可能避免最终失败的命运、并非要使中国朝着独立资本主义方向发展、不可能为中国摆脱贫弱找到出路，故答案为ABC。D目的是为了推翻清政府统治与事实相反，洋务运动恰是维护清统治，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 14, "question": "洋务运动失败的主要原因有（ ）。", "options": [{"label": "A", "text": "洋务运动对列强具有依赖性"}, {"label": "B", "text": "洋务运动支持资本主义的发展"}, {"label": "C", "text": "洋务企业的管理具有腐朽性"}, {"label": "D", "text": "洋务运动具有封建性"}], "answer": "ACD", "explain": "洋务运动失败的主要原因有对列强具有依赖性、洋务企业的管理具有腐朽性和洋务运动具有封建性，故答案为ACD。B支持资本主义的发展不是失败原因，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 15, "question": "戊戌维新运动发生的历史背景是（ ）。", "options": [{"label": "A", "text": "新兴民族资产阶级迫切要求在中国发展资本主义"}, {"label": "B", "text": "甲午战争的惨败，造成了新的民族危机，激发了新的民族觉醒"}, {"label": "C", "text": "19世纪90年代以后中国民族资本主义有了初步发展"}, {"label": "D", "text": "资产阶级的改良思想迅速高涨"}], "answer": "ABCD", "explain": "戊戌维新运动发生的历史背景包括新兴民族资产阶级要求发展资本主义、甲午战败造成民族危机与觉醒、民族资本主义初步发展、改良思想高涨，ABCD四项均正确。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 16, "question": "维新派与守旧派的论战焦点是（ ）。", "options": [{"label": "A", "text": "要不要变法"}, {"label": "B", "text": "要不要废八股、改科举和兴西学"}, {"label": "C", "text": "要不要兴民权、设议院，实行君主立宪"}, {"label": "D", "text": "要不要发展农业"}], "answer": "ABC", "explain": "维新派与守旧派论战的焦点是要不要变法、要不要废八股改科举兴西学、要不要兴民权设议院实行君主立宪，故答案为ABC。D要不要发展农业不是论战焦点，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 17, "question": "在向西方学习的过程中，戊戌变法区别于洋务运动的地方有（ ）", "options": [{"label": "A", "text": "学习西方的科学技术"}, {"label": "B", "text": "学习西方的政治制度"}, {"label": "C", "text": "宣传自由平等和社会进化观念，批判封建君权和封建纲常伦理"}, {"label": "D", "text": "主张用君主立宪制度取代君主专制制度"}], "answer": "BCD", "explain": "在向西方学习过程中，戊戌变法区别于洋务运动之处在于学习西方政治制度、宣传自由平等和进化观念批判封建君权纲常、主张用君主立宪取代君主专制，故答案为BCD。A学习西方科学技术是两者的共同点而非区别，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 18, "question": "戊戌维新运动是一场（ ）。", "options": [{"label": "A", "text": "爱国救亡运动"}, {"label": "B", "text": "政治改良运动"}, {"label": "C", "text": "经济改革运动"}, {"label": "D", "text": "思想启蒙运动"}], "answer": "ABD", "explain": "戊戌维新运动是一场爱国救亡运动、政治改良运动和思想启蒙运动，故答案为ABD。C经济改革运动不是对戊戌维新的准确概括，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 19, "question": "戊戌维新运动的失败，主要是由于（ ）。", "options": [{"label": "A", "text": "维新派自身的局限"}, {"label": "B", "text": "民族资产阶级缺乏社会基础"}, {"label": "C", "text": "未触及封建制度的根本"}, {"label": "D", "text": "强大的守旧势力的反对"}], "answer": "AD", "explain": "戊戌维新运动的失败主要是由于维新派自身的局限和强大的守旧势力的反对，故答案为AD。B民族资产阶级缺乏社会基础、C未触及封建制度根本都是次要原因，故排除。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "multi", "id": 20, "question": "维新派的局限性体现在（ ）。", "options": [{"label": "A", "text": "不敢否定封建主义"}, {"label": "B", "text": "对帝国主义抱有幻想"}, {"label": "C", "text": "害怕人民群众"}, {"label": "D", "text": "民族资产阶级力量弱小"}], "answer": "ABCD", "explain": "维新派的局限性体现在不敢否定封建主义、对帝国主义抱有幻想、害怕人民群众、民族资产阶级力量弱小四个方面，ABCD四项均正确。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 1, "question": "在19世纪中叶的亚洲民族解放运动中，太平天国起义是其中时间最久、规模最大、影响最深的一次。", "answer": true, "explain": "此说法正确。在19世纪中叶的亚洲民族解放运动中，太平天国起义是其中时间最久、规模最大、影响最深的一次。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 2, "question": "太平天国军事战略上出现的重大失误是导致其最后失败的根本原因。", "answer": false, "explain": "此说法错误。太平天国失败的根本原因是缺乏先进阶级的领导，军事战略失误只是次要原因而非根本原因。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 3, "question": "太平天国起义失败证明单纯的农民战争不可能完成争取民族独立和人民解放的历史任务。", "answer": true, "explain": "此说法正确。太平天国起义失败证明单纯的农民战争不可能完成争取民族独立和人民解放的历史任务。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 4, "question": "洋务运动由中国民族资产阶级发动。", "answer": false, "explain": "此说法错误。洋务运动由地主阶级洋务派发起和推动，其代表人物为曾国藩、李鸿章等洋务派官僚，而非由中国民族资产阶级发动。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 5, "question": "洋务派兴办近代企业，目的是使中国朝着资本主义方向发展。", "answer": false, "explain": "此说法错误。洋务派兴办近代企业是为了维护和巩固封建统治，并非要使中国朝着资本主义方向发展。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 6, "question": "洋务运动在客观上对中国民族资本主义发展起了促进作用。", "answer": true, "explain": "此说法正确。洋务运动在客观上引进了西方的近代生产技术，刺激并助推了中国民族资本主义的产生和发展，起了促进作用。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 7, "question": "甲午战争中北洋海军的全军覆没，标志着洋务运动的失败。", "answer": true, "explain": "此说法正确。甲午战争中北洋海军在威海卫战役中全军覆没，标志洋务运动单纯学习西方技术以自强以求富的打算彻底破产。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 8, "question": "戊戌维新运动的兴起说明中国资产阶级开始登上政治舞台。", "answer": true, "explain": "此说法正确。戊戌维新运动由民族资产阶级维新派领导推动，是中国民族资产阶级登上政治舞台的第一次表演和重要标志。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 9, "question": "戊戌维新是一场地主阶级性质的政治改良运动，更是一场思想启蒙运动。", "answer": false, "explain": "此说法错误。戊戌维新是一场资产阶级性质的政治改良运动，而非地主阶级性质的政治改良运动。"}, {"chapter": "第二章  不同社会力量对国家出路的早期探索", "type": "tf", "id": 10, "question": "戊戌维新运动的失败，说明在半殖民地半封建的中国，企图通过统治者走自上而下的改良的道路，根本行不通。", "answer": true, "explain": "此说法正确。戊戌维新运动的失败说明在半殖民地半封建的中国，企图通过统治者走自上而下的改良道路根本行不通。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 1, "question": "1904年至1905年，为了争夺在华利益而在中国东北进行战争的国家是（ ）。", "options": [{"label": "A", "text": "日本和德国"}, {"label": "B", "text": "日本和俄国"}, {"label": "C", "text": "英国和德国"}, {"label": "D", "text": "英国和俄国"}], "answer": "B", "explain": "1904年至1905年，为争夺在华利益而在中国东北进行战争（日俄战争）的国家是日本和俄国。A日本和德国、C英国和德国、D英国和俄国均不符合史实，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 2, "question": "科举考试终结于（ ）。", "options": [{"label": "A", "text": "洋务运动时期"}, {"label": "B", "text": "维新运动时期"}, {"label": "C", "text": "清末新政时期"}, {"label": "D", "text": "辛亥革命时期"}], "answer": "C", "explain": "科举考试终结于清末新政时期，1905年清政府宣布废除科举制度。A洋务运动时期、B维新运动时期、D辛亥革命时期均早于或晚于废除时间，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 3, "question": "清末“预备立宪”的根本目的在于（ ）。", "options": [{"label": "A", "text": "延续清政府的统治"}, {"label": "B", "text": "发展资本主义"}, {"label": "C", "text": "仿效欧美政体"}, {"label": "D", "text": "缓和阶级矛盾"}], "answer": "A", "explain": "清末“预备立宪”的根本目的在于延续清政府的统治，以立宪之名行维护皇权专制之实。B发展资本主义、C仿效欧美政体都只是表面现象，D缓和阶级矛盾是次要目的，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 4, "question": "资产阶级革命派的骨干是（ ）。", "options": [{"label": "A", "text": "民族资产阶级"}, {"label": "B", "text": "地主阶级开明人士"}, {"label": "C", "text": "买办资产阶级"}, {"label": "D", "text": "资产阶级、小资产阶级知识分子"}], "answer": "D", "explain": "资产阶级革命派的骨干是资产阶级、小资产阶级知识分子，他们是领导革命的中坚。A民族资产阶级整体、B地主阶级开明人士、C买办资产阶级都不是革命派骨干，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 5, "question": "1894年，孙中山在檀香山建立的革命团体是（ ）。", "options": [{"label": "A", "text": "同盟会"}, {"label": "B", "text": "兴中会"}, {"label": "C", "text": "华兴会"}, {"label": "D", "text": "光复会"}], "answer": "B", "explain": "1894年孙中山在檀香山建立的革命团体是兴中会。A同盟会成立于1905年，C华兴会、D光复会都成立于其后的国内，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 6, "question": "孙中山为首的资产阶级革命派在踏上革命道路之时，就高举起（ ）。", "options": [{"label": "A", "text": "军事革命的旗帜"}, {"label": "B", "text": "民主革命的旗帜"}, {"label": "C", "text": "社会革命的旗帜"}, {"label": "D", "text": "经济革命的旗帜"}], "answer": "B", "explain": "孙中山为首的资产阶级革命派在踏上革命道路之时就高举起民主革命的旗帜，以推翻帝制、建立共和为号召。A军事革命、C社会革命、D经济革命的旗帜均非其根本旗帜，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 7, "question": "中国近代第一个资产阶级革命政党是1905年成立的（ ）。", "options": [{"label": "A", "text": "同盟会"}, {"label": "B", "text": "国民党"}, {"label": "C", "text": "华兴会"}, {"label": "D", "text": "光复会"}], "answer": "A", "explain": "中国近代第一个资产阶级革命政党是1905年成立的同盟会。B国民党是1912年改组成立，C华兴会、D光复会是革命团体而非全国性政党，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 8, "question": "同盟会的机关报是（ ）。", "options": [{"label": "A", "text": "《国闻报》"}, {"label": "B", "text": "《时务报》"}, {"label": "C", "text": "《民报》"}, {"label": "D", "text": "《新民丛报》"}], "answer": "C", "explain": "同盟会的机关报是《民报》。A《国闻报》、B《时务报》是维新派报刊，D《新民丛报》是梁启超主办，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 9, "question": "不属于三民主义的是（ ）。", "options": [{"label": "A", "text": "民族主义"}, {"label": "B", "text": "民本主义"}, {"label": "C", "text": "民生主义"}, {"label": "D", "text": "民权主义"}], "answer": "B", "explain": "三民主义是民族主义、民权主义、民生主义三大主义，民本主义不属于其中，故答案为B。A民族主义、C民生主义、D民权主义均为三民主义内容。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 10, "question": "革命派与改良派论战的焦点是（ ）。", "options": [{"label": "A", "text": "要不要平均地权"}, {"label": "B", "text": "要不要进行社会革命"}, {"label": "C", "text": "要不要推翻帝制，实行共和"}, {"label": "D", "text": "要不要以革命手段推翻清王朝"}], "answer": "D", "explain": "革命派与改良派论战的焦点是要不要以革命手段推翻清王朝，这是双方最根本分歧。A要不要平均地权、B要不要进行社会革命、C要不要推翻帝制实行共和都是派生的争论，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 11, "question": "1911年4月爆发的黄花岗起义发生在（ ）。", "options": [{"label": "A", "text": "广州"}, {"label": "B", "text": "武汉"}, {"label": "C", "text": "南京"}, {"label": "D", "text": "上海"}], "answer": "A", "explain": "1911年4月爆发的黄花岗起义发生在广州。B武汉、C南京、D上海均非黄花岗起义地点，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 12, "question": "关于清末保路运动的表述，正确的是（ ）。", "options": [{"label": "A", "text": "一场保护道路不受破坏的运动"}, {"label": "B", "text": "一场事关民族利益和个人权益的运动"}, {"label": "C", "text": "各省立宪派自始至终都倡导武装保路"}, {"label": "D", "text": "后来直接导致清王朝的灭亡"}], "answer": "B", "explain": "清末保路运动是一场事关民族利益和个人权益的运动，人民为维护铁路主权和自身权益而斗争，故答案为B。A护路运动非保护道路不受破坏，C立宪派自始至终倡导武装保路不准确，D直接导致清王朝灭亡说法夸大了，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 13, "question": "（ ）是武昌起义的导火索。", "options": [{"label": "A", "text": "黄花岗起义"}, {"label": "B", "text": "萍浏醴起义"}, {"label": "C", "text": "护国运动"}, {"label": "D", "text": "保路运动"}], "answer": "D", "explain": "保路运动是武昌起义的导火索，四川保路运动使清廷调兵镇压，武昌新军乘机起义。A黄花岗起义、B萍浏醴起义、C护国运动均非武昌起义导火索，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 14, "question": "（ ）掀起辛亥革命的高潮，打开清王朝统治的缺口。", "options": [{"label": "A", "text": "黄花岗起义"}, {"label": "B", "text": "武昌起义"}, {"label": "C", "text": "中华民国临时政府成立"}, {"label": "D", "text": "清帝退位"}], "answer": "B", "explain": "武昌起义掀起辛亥革命的高潮，打开清王朝统治的缺口，故答案为B。A黄花岗起义是前期起义，C中华民国临时政府成立、D清帝退位在武昌起义之后，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 15, "question": "在中国延续了两千多年的封建帝制覆灭的标志是（ ）。", "options": [{"label": "A", "text": "武昌起义"}, {"label": "B", "text": "中华民国成立"}, {"label": "C", "text": "清帝退位"}, {"label": "D", "text": "新中国成立"}], "answer": "C", "explain": "清帝退位是延续两千多年的封建帝制覆灭的标志。A武昌起义、B中华民国成立、D新中国成立都不直接标志帝制覆灭，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 16, "question": "（ ）年1月1日，中华民国正式成立。", "options": [{"label": "A", "text": "1911"}, {"label": "B", "text": "1912"}, {"label": "C", "text": "1913"}, {"label": "D", "text": "1914"}], "answer": "B", "explain": "1912年1月1日中华民国正式成立，孙中山在南京就任临时大总统。A1911、C1913、D1914年都不正确，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 17, "question": "南京临时政府中占领导和主体地位的派别是（ ）。", "options": [{"label": "A", "text": "资产阶级革命派"}, {"label": "B", "text": "资产阶级立宪派"}, {"label": "C", "text": "资产阶级维新派"}, {"label": "D", "text": "资产阶级保皇派"}], "answer": "A", "explain": "南京临时政府中占领导和主体地位的派别是资产阶级革命派。B立宪派、C维新派、D保皇派都非南京临时政府的主体力量，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 18, "question": "中国历史上第一部具有资产阶级共和国宪法性质的法典是（ ）。", "options": [{"label": "A", "text": "《钦定宪法大纲》"}, {"label": "B", "text": "《资政新篇》"}, {"label": "C", "text": "《中华民国临时约法》"}, {"label": "D", "text": "《中华民国约法》"}], "answer": "C", "explain": "《中华民国临时约法》是中国历史上第一部具有资产阶级共和国宪法性质的法典。A《钦定宪法大纲》是清政府制、维护君权的，B《资政新篇》是太平天国文件，D《中华民国约法》是袁世凯炮制，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 19, "question": "近代以来，第一次比较完全意义上的资产阶级民主革命是（ ）。", "options": [{"label": "A", "text": "五四运动"}, {"label": "B", "text": "辛亥革命"}, {"label": "C", "text": "大革命"}, {"label": "D", "text": "太平天国运动"}], "answer": "B", "explain": "辛亥革命是近代以来第一次比较完全意义上的资产阶级民主革命。A五四运动是新民主主义革命开端，C大革命发生在之后，D太平天国运动是农民运动，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 20, "question": "关于辛亥革命历史意义的表述，不正确的是（ ）。", "options": [{"label": "A", "text": "打击了帝国主义的侵略势力"}, {"label": "B", "text": "推动中国人民的思想解放"}, {"label": "C", "text": "为民族资本主义的发展创造条件"}, {"label": "D", "text": "结束中国延续两千多年的封建统治"}], "answer": "D", "explain": "关于辛亥革命历史意义的表述，不正确的是结束中国延续两千多年的封建统治，因为辛亥革命结束的只是封建帝制，封建统治的社会基础未彻底铲除，故答案为D。A打击帝国主义、B推动思想解放、C为资本主义发展创造条件均为正确表述。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 21, "question": "辛亥革命的果实被（ ）的首领袁世凯窃取。", "options": [{"label": "A", "text": "西北军阀"}, {"label": "B", "text": "北洋军阀"}, {"label": "C", "text": "西南军阀"}, {"label": "D", "text": "南洋军阀"}], "answer": "B", "explain": "辛亥革命的果实被北洋军阀首领袁世凯窃取，故答案为B。A西北军阀、C西南军阀、D南洋军阀均不符合史实，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 22, "question": "北洋军阀政权代表（ ）的利益。", "options": [{"label": "A", "text": "无产阶级和广大人民"}, {"label": "B", "text": "民族资本家和中小资产阶级"}, {"label": "C", "text": "大地主和买办资产阶级"}, {"label": "D", "text": "大资产阶级"}], "answer": "C", "explain": "北洋军阀政权代表大地主和买办资产阶级的利益，故答案为C。A无产阶级和广大人民、B民族资本家和中小资产阶级、D大资产阶级都不准确，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 23, "question": "1912年8月，宋教仁以同盟会为基础，联合其他党派在北京组成（ ）。", "options": [{"label": "A", "text": "国民党"}, {"label": "B", "text": "中华革命党"}, {"label": "C", "text": "统一共和党"}, {"label": "D", "text": "国民共进会"}], "answer": "A", "explain": "1912年8月宋教仁以同盟会为基础，联合其他党派在北京组成国民党，故答案为A。B中华革命党是1914年孙中山组建，C统一共和党、D国民共进会均非本题答案，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 24, "question": "1915年5月，为了让日本支持复辟帝制，袁世凯竟然基本接受日本提出的（ ）。", "options": [{"label": "A", "text": "中日共同防敌军事协定"}, {"label": "B", "text": "承认外蒙自治"}, {"label": "C", "text": "“二十一条”"}, {"label": "D", "text": "出让川汉、粤汉铁路"}], "answer": "C", "explain": "1915年5月袁世凯为复辟帝制，基本接受日本提出的“二十一条”，故答案为C。A中日共同防敌军事协定、B承认外蒙自治、D出让川汉粤汉铁路均非二十一条对应内容，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 25, "question": "1913年宋教仁被暗杀后，孙中山毅然发动武装反袁的（ ）。", "options": [{"label": "A", "text": "护法运动"}, {"label": "B", "text": "护国运动"}, {"label": "C", "text": "辛亥革命"}, {"label": "D", "text": "二次革命"}], "answer": "D", "explain": "1913年宋教仁被暗杀后，孙中山毅然发动武装反袁的二次革命，故答案为D。A护法运动、B护国运动、C辛亥革命均非此时发动的斗争，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 26, "question": "1914年7月，孙中山在东京成立（ ），组织武装反袁。", "options": [{"label": "A", "text": "国民党"}, {"label": "B", "text": "兴中会"}, {"label": "C", "text": "中华革命党"}, {"label": "D", "text": "中国同盟会"}], "answer": "C", "explain": "1914年7月孙中山在东京成立中华革命党，组织武装反袁，故答案为C。A国民党、B兴中会、D中国同盟会均非1914年在东京成立的组织，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 27, "question": "挫败袁世凯复辟帝制阴谋的运动是（ ）。", "options": [{"label": "A", "text": "护法运动"}, {"label": "B", "text": "护国运动"}, {"label": "C", "text": "辛亥革命"}, {"label": "D", "text": "二次革命"}], "answer": "B", "explain": "挫败袁世凯复辟帝制阴谋的运动是护国运动，故答案为B。A护法运动针对北洋军阀毁法，C辛亥革命、D二次革命均非挫败帝制复辟的具体运动，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 28, "question": "1919年10月，孙中山将中华革命党改组为（ ）。", "options": [{"label": "A", "text": "国民党"}, {"label": "B", "text": "革命党"}, {"label": "C", "text": "中华国民党"}, {"label": "D", "text": "中国国民党"}], "answer": "D", "explain": "1919年10月孙中山将中华革命党改组为中国国民党，故答案为D。A国民党是1912年名称，B革命党、C中华国民党均不准确，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 29, "question": "毛泽东在谈到辛亥革命时指出，辛亥革命有它胜利的地方，也有它失败的地方。“辛亥革命把皇帝赶跑，这不是胜利了吗？说它失败，是说辛亥革命只把一个皇帝赶跑。”毛泽东这里所说的“只把一个皇帝赶跑”是指（ ）。", "options": [{"label": "A", "text": "反帝反封建的革命任务没有完成"}, {"label": "B", "text": "没有推翻帝制"}, {"label": "C", "text": "孙中山没有继续革命"}, {"label": "D", "text": "袁世凯窃取了胜利果实"}], "answer": "A", "explain": "毛泽东所说“只把一个皇帝赶跑”是指辛亥革命没有完成反帝反封建的革命任务，故答案为A。B没有推翻帝制与史实不符（辛亥革命确已推翻帝制），C孙中山没有继续革命、D袁世凯窃取果实都不是此语的确切含义，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "single", "id": 30, "question": "辛亥革命失败的根本原因是（ ）。", "options": [{"label": "A", "text": "没有提出彻底的反帝反封建的革命纲领"}, {"label": "B", "text": "不能建立坚强的革命政党"}, {"label": "C", "text": "不能充分发动和依靠人民群众"}, {"label": "D", "text": "资本主义的建国方案在半殖民地半封建的中国行不通"}], "answer": "D", "explain": "辛亥革命失败的根本原因是资本主义的建国方案在半殖民地半封建的中国行不通，故答案为D。A没有提出彻底反帝反封建纲领、B不能建立坚强革命政党、C不能充分发动人民群众都是具体原因，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 1, "question": "辛亥革命爆发的历史条件有（ ）", "options": [{"label": "A", "text": "清末“新政”及其破产"}, {"label": "B", "text": "民族危机加深，社会矛盾激化"}, {"label": "C", "text": "资产阶级革命派的宣传与组织工作"}, {"label": "D", "text": "资产阶级革命派的阶级基础和骨干力量"}], "answer": "ABD", "explain": "辛亥革命爆发的历史条件包括清末新政及其破产、民族危机加深和社会矛盾激化、资产阶级革命派的阶级基础和骨干力量，故答案为ABD。C资产阶级革命派的宣传与组织工作属于革命派自身准备而非宏观历史条件，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 2, "question": "资产阶级革命派的骨干力量是（ ）", "options": [{"label": "A", "text": "地主阶级"}, {"label": "B", "text": "资产阶级知识分子"}, {"label": "C", "text": "小资产阶级知识分子"}, {"label": "D", "text": "工农阶级"}], "answer": "BC", "explain": "资产阶级革命派的骨干力量是资产阶级知识分子和小资产阶级知识分子，故BC正确。A地主阶级、D工农阶级都不是革命派骨干力量，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 3, "question": "关于孙中山的表述，正确的有（ ）。", "options": [{"label": "A", "text": "曾经寄希望于自上而下的改革"}, {"label": "B", "text": "组建第一个革命团休兴中会"}, {"label": "C", "text": "高举起民主革命的旗帜"}, {"label": "D", "text": "主张以武装起义推翻清王朝的统治"}], "answer": "ABCD", "explain": "关于孙中山的正确表述有：曾经寄希望于自上而下的改革、组建第一个革命团体兴中会、高举起民主革命的旗帜、主张以武装起义推翻清王朝统治，ABCD四项均正确。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 4, "question": "20世纪初，各种宣传革命的书籍报刊纷纷涌现，其中著名的有（ ）。", "options": [{"label": "A", "text": "章炳麟的《驳康有为论革命书》"}, {"label": "B", "text": "陈天华的《警世钟》《猛回头》"}, {"label": "C", "text": "康有为的《孔子改制考》"}, {"label": "D", "text": "邹容的《革命军》"}], "answer": "ABD", "explain": "20世纪初宣传革命的著名书籍报刊有章炳麟的《驳康有为论革命书》、陈天华的《警世钟》《猛回头》和邹容的《革命军》，故ABD正确。C康有为的《孔子改制考》是为维新变法服务的著作，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 5, "question": "孙中山的三民主义包括（ ）。", "options": [{"label": "A", "text": "民族主义"}, {"label": "B", "text": "民权主义"}, {"label": "C", "text": "民治主义"}, {"label": "D", "text": "民生主义"}], "answer": "ABD", "explain": "孙中山的三民主义包括民族主义、民权主义和民生主义，故ABD正确。C民治主义不属于三民主义内容，故排除。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 6, "question": "关于同盟会纲领中的“民族主义”的表述，正确的是（ ）", "options": [{"label": "A", "text": "以革命手段推翻清政府"}, {"label": "B", "text": "建立中华民族“独立的国家”"}, {"label": "C", "text": "反对帝国主义"}, {"label": "D", "text": "把军阀、官僚、地主作为革命的对象"}], "answer": "AB", "explain": "同盟会民族主义主张以革命手段推翻清政府、建立中华民族独立的国家，故AB正确。C错误，民族主义没有明确提出反对帝国主义的口号；D错误，把军阀、官僚、地主作为革命对象并非民族主义的本义表述。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 7, "question": "1905年至1907年间，资产阶级革命派与改良派展开论战的主要舆论阵地分别是（ ）。", "options": [{"label": "A", "text": "《国闻报》"}, {"label": "B", "text": "《时务报》"}, {"label": "C", "text": "《民报》"}, {"label": "D", "text": "《新民丛报》。"}], "answer": "CD", "explain": "1905至1907年论战中，革命派以《民报》为阵地、改良派以《新民丛报》为阵地，故CD正确。A《国闻报》是戊戌维新时期严复主编，B《时务报》是梁启超主编的维新刊物，均非此次论战阵地。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 8, "question": "辛亥革命前革命与改良的辩论的重大意义有（ ）。", "options": [{"label": "A", "text": "划清了革命与改良的界限"}, {"label": "B", "text": "传播了民主革命思想"}, {"label": "C", "text": "促进了革命形势的发展"}, {"label": "D", "text": "使改良主义思想销声匿迹"}], "answer": "ABC", "explain": "这场论战划清了革命与改良的界限、传播了民主革命思想并促进了革命形势发展，故ABC正确。D错误，论战虽使革命派占了上风，但改良主义思想并未从此销声匿迹。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 9, "question": "发动武昌起义的革命团体是（ ）。", "options": [{"label": "A", "text": "文学社"}, {"label": "B", "text": "兴中会"}, {"label": "C", "text": "华兴会"}, {"label": "D", "text": "共进会"}], "answer": "AD", "explain": "发动武昌起义的革命团体是文学社和共进会，故AD正确。B兴中会、C华兴会是早期资产阶级革命团体，后并入同盟会，并非直接发动武昌起义的团体。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 10, "question": "关于武昌起义的表述，正确的是（ ）", "options": [{"label": "A", "text": "由共进会和光复会两个革命团体联合行动"}, {"label": "B", "text": "新军工程第八营的革命党人打响了起义的第一枪"}, {"label": "C", "text": "掀起辛亥革命的高潮，打开清王朝统治的缺口"}, {"label": "D", "text": "起义过程中，资产阶级革命派暴露了软弱性和妥协态度"}], "answer": "BCD", "explain": "武昌起义由新军工程第八营打响第一枪，掀起辛亥革命高潮并打开清王朝统治缺口，且暴露了革命派的软弱妥协，故BCD正确。A错误，共同行动的是共进会和文学社，而非共进会与光复会。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 11, "question": "南京临时政府是一个资产阶级共和国性质的革命政权，这是因为（ ）。", "options": [{"label": "A", "text": "资产阶级革命派在这个政权中占有领导和主体的地位"}, {"label": "B", "text": "同盟会会员在国家立法机关临时参议院中占多数"}, {"label": "C", "text": "各项政策措施集中代表和反映了中国民族资产阶级的愿望和利益"}, {"label": "D", "text": "各项政策措施在相当程度上也符合广大中国人民的利益"}], "answer": "ABC", "explain": "南京临时政府中资产阶级革命派居领导和主体地位、同盟会会员在临时参议院占多数、政策反映民族资产阶级愿望利益，故ABC正确。D符合人民利益体现政权的进步性，但不是说明其资产阶级共和国性质的直接依据。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 12, "question": "南京临时政府的局限性包括（ ）", "options": [{"label": "A", "text": "维护封建土地制度以及官僚、地主所占有的土地财产"}, {"label": "B", "text": "主体是资产阶级革命派建立的资产阶级共和国"}, {"label": "C", "text": "承认清政府与列强所订的一切不平等条约和一切外债有效"}, {"label": "D", "text": "没有提出任何可以满足农民土地要求的政策和措施"}], "answer": "ACD", "explain": "南京临时政府局限包括维护封建土地财产、承认不平等条约和外债、未提农民土地要求，故ACD正确。B是资产阶级共和国政权的性质表述，不属于局限性。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 13, "question": "关于《中华民国临时约法》的表述，正确的有（ ）。", "options": [{"label": "A", "text": "中国历史上第一部具有资产阶级共和国宪法性质的法典"}, {"label": "B", "text": "废除了两千多年来的封建君主专制制度"}, {"label": "C", "text": "确认了资产阶级共和国的政治制度"}, {"label": "D", "text": "不完全，有缺点，但带有革命性、民主性"}], "answer": "ABCD", "explain": "《中华民国临时约法》是中国历史上第一部具有资产阶级共和国宪法性质的法典，废除了两千多年的封建君主专制制度，确认了资产阶级共和国的政治制度，虽不完善但带有革命性、民主性，故ABCD均正确。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 14, "question": "辛亥革命的历史意义有（ ）", "options": [{"label": "A", "text": "推翻清王朝的统治， 终结封建君主专制制度"}, {"label": "B", "text": "推动中国人民的思想解放"}, {"label": "C", "text": "推动中国的社会变革"}, {"label": "D", "text": "打击帝国主义，推动亚洲各国民族解放运动的高涨"}], "answer": "ABCD", "explain": "辛亥革命推翻了清王朝统治、终结封建君主专制制度，推动了中国人民思想解放和社会变革，并打击了帝国主义、推动亚洲民族解放运动高涨，故ABCD均正确。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 15, "question": "为制约袁世凯，孙中山辞去中华民国临时大总统的附属条件是（ ）。", "options": [{"label": "A", "text": "以南京为首都"}, {"label": "B", "text": "总统在南京就职"}, {"label": "C", "text": "清帝退位"}, {"label": "D", "text": "遵守《中华民国临时约法》"}], "answer": "ABD", "explain": "孙中山辞职的附属条件是定都南京、总统在南京就职、遵守《临时约法》，故ABD正确。C清帝退位是袁世凯借此窃取革命果实的条件，并非制约袁世凯的附属条件。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 16, "question": "中华民国建立后中国曾出现的帝制复辟有（ ）。", "options": [{"label": "A", "text": "张勋复辟"}, {"label": "B", "text": "袁世凯复辟"}, {"label": "C", "text": "段祺瑞复辟"}, {"label": "D", "text": "黎元洪复辟"}], "answer": "AB", "explain": "中华民国建立后发生的帝制复辟只有袁世凯称帝和张勋扶清帝复辟两次，故AB正确。C段祺瑞、D黎元洪都是北洋军阀或政客，并未实行帝制复辟。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 17, "question": "中国陷入军阀割据局面的主要原因在于（ ）。", "options": [{"label": "A", "text": "帝国主义国家采取分裂剥削的政策"}, {"label": "B", "text": "帝国主义国家支持资产阶级革命派"}, {"label": "C", "text": "中国主要是地方性的农业经济"}, {"label": "D", "text": "中国没有形成统一的资本主义市场"}], "answer": "ACD", "explain": "军阀割据源于帝国主义分裂剥削政策、地方性农业经济及未形成统一资本主义市场，故ACD正确。B错误，帝国主义并不支持资产阶级革命派，而是扶植各派军阀以分而治之。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 18, "question": "北洋政府的反攻倒算，主要表现在（ ）。", "options": [{"label": "A", "text": "在政治上，实行军阀官僚的专制统治"}, {"label": "B", "text": "在经济上，竭力维护帝国主义、地主阶级和买办资产阶级的利益"}, {"label": "C", "text": "在军事上，连年混战以至人民困苦不堪"}, {"label": "D", "text": "在文化思想上，尊孔复古思潮猖獗一时"}], "answer": "ABD", "explain": "北洋政府政治上实行军阀官僚专制、经济上维护帝国主义地主买办利益、文化上尊孔复古，故ABD正确。C军事上连年混战虽属其表现，但不是教材所归纳的反攻倒算主要方面。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 19, "question": "辛亥革命是我国近代史上一次比较完全意义上的资产阶级民主革命。这是因为辛亥革命（ ）。", "options": [{"label": "A", "text": "建立了中国近代史上第一个资产阶级政党"}, {"label": "B", "text": "制定了比较完整的资产阶级民主革命纲领"}, {"label": "C", "text": "提出了平均地权，耕者有其田的重要原则"}, {"label": "D", "text": "结束了封建君主专制制度，建立了资产阶级共和国"}], "answer": "ABD", "explain": "辛亥革命建立第一个资产阶级政党、制定比较完整的民主革命纲领并结束帝制建立共和，故ABD正确。C错误，耕者有其田是新三民主义才提出的，三民主义仅有平均地权。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "multi", "id": 20, "question": "辛亥革命失败的主要原因在于（ ）。", "options": [{"label": "A", "text": "没有提出彻底的反帝反封建的革命纲领"}, {"label": "B", "text": "不能建立坚强的革命政党"}, {"label": "C", "text": "不能充分发动和依靠人民群众"}, {"label": "D", "text": "资本主义的建国方案在半殖民地半封建的中国行不通"}], "answer": "ABCD", "explain": "辛亥革命失败的主要原因是既没有提出彻底的反帝反封建纲领，又不能建立坚强的革命政党，也不能充分发动和依靠人民群众，且资本主义建国方案在半殖民地半封建的中国根本行不通，故ABCD均正确。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 1, "question": "资产阶级革命派的骨干是一批资产阶级、小资产阶级知识分子及工商业资本家。", "answer": false, "explain": "该判断错误。资产阶级革命派的骨干是一批资产阶级、小资产阶级知识分子，而非工商业资本家，工商业资本家并未成为革命派的骨干力量。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 2, "question": "兴中会是近代中国第一个资产阶级革命团体。", "answer": true, "explain": "该判断正确。1894年孙中山在檀香山发起成立兴中会，是近代中国第一个资产阶级革命团体，标志着反清民主革命有了最早的组织起点。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 3, "question": "同盟会是近代中国第一个资产阶级革命政党。", "answer": true, "explain": "该判断正确。1905年孙中山联合各革命团体在日本东京成立的中国同盟会，是近代中国第一个全国性的资产阶级革命政党，政纲为三民主义。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 4, "question": "三民主义是一个比较完备而又彻底的资产阶级革命纲领。", "answer": false, "explain": "该判断错误。三民主义虽然是一个比较完备的资产阶级革命纲领，但它并不彻底，因为没有提出明确的反帝纲领，也没有彻底的土地纲领。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 5, "question": "革命派与改良派辩论的焦点是要不要推翻帝制，实行共和。", "answer": false, "explain": "该判断错误。革命派与改良派论战的焦点是要不要以革命手段推翻清王朝的统治，而并不在于题目所说推翻帝制实行共和这一提法。这一焦点涉及根本道路的选择。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 6, "question": "武昌起义掀起辛亥革命的高潮，打开清王朝统治的缺口。", "answer": true, "explain": "该判断正确。1911年武昌起义掀起辛亥革命的高潮，打开了清王朝统治的缺口，此后各省纷纷宣布脱离清政府而独立响应。这是辛亥革命推翻帝制的直接导火事件。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 7, "question": "南京临时政府不是一个资产阶级性质的政权。", "answer": false, "explain": "该判断错误。南京临时政府实际上是一个资产阶级共和国性质的革命政权，而不是非资产阶级政权，它由革命派领导并反映民族资产阶级利益。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 8, "question": "北洋军阀是中国近代史上代表大地主和买办资产阶级利益的军事政治集团。", "answer": true, "explain": "该判断正确。北洋军阀是代表大地主和买办资产阶级利益的军事政治集团，其统治具有明显的封建性、买办性和反动性特征。它对外投靠帝国主义，对内实行独裁。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 9, "question": "辛亥革命终结在中国延续两千多年的封建统治。", "answer": false, "explain": "该判断错误。辛亥革命终结的是延续两千多年的封建君主专制制度，而不是整个封建制度，封建土地制度和旧思想观念仍然长期存在。因此不能说终结了全部封建统治。"}, {"chapter": "第三章 辛亥革命与君主专制制度的终结", "type": "tf", "id": 10, "question": "辛亥革命失败说明，民族资产阶级不能承担彻底的反帝反封建的历史重任。", "answer": true, "explain": "该判断正确。辛亥革命失败的教训说明，中国民族资产阶级软弱妥协，无力承担彻底反帝反封建的历史重任。这一结论为后来新民主主义革命所印证。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 1, "question": "1915年9月，陈独秀在上海创办《青年杂志》。他在该刊发刊词中宣称，“盖改造青年之思想，辅导青年之修养，为本志之天职。批评时政，非其旨也。”此时陈独秀把主要注意力倾注于思想变革的原因是（ ）。", "options": [{"label": "A", "text": "他认为批评时政不利于改造青年思想"}, {"label": "B", "text": "他对资产阶级民主主义产生了怀疑"}, {"label": "C", "text": "他认定改造国民性是政治变革的前提"}, {"label": "D", "text": "他对政治问题不感兴趣"}], "answer": "C", "explain": "陈独秀认定改造国民性是实行政治变革的前提，故把注意力倾注于思想变革，选C。A批评时政非旨趣是因为他认为应先改造国民思想；B此时他仍信仰资产阶级民主；D他并非不关心政治，而是主张先思想后政治。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 2, "question": "五四以前的新文化运动的指导思想是（ ）。", "options": [{"label": "A", "text": "民主和科学"}, {"label": "B", "text": "自强和求富"}, {"label": "C", "text": "社会主义"}, {"label": "D", "text": "马克思主义"}], "answer": "A", "explain": "五四以前新文化运动的指导思想是民主与科学，选A。B自强求富是洋务运动的口号；C社会主义、D马克思主义是五四之后才在中国兴起。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 3, "question": "五四以前的新文化运动的性质是（ ）。", "options": [{"label": "A", "text": "无产阶级的文化运动"}, {"label": "B", "text": "资产阶级的文化运动"}, {"label": "C", "text": "地主阶级的文化运动"}, {"label": "D", "text": "工人阶级的文化运动"}], "answer": "B", "explain": "五四以前新文化运动的性质是资产阶级的文化运动，选B。A无产阶级、D工人阶级的文化运动是新民主主义革命后的性质，C地主阶级明显不符。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 4, "question": "（ ）推动中国先进分子把目光从西方转向东方，从资产阶级民主主义转向社会主义。", "options": [{"label": "A", "text": "新文化运动"}, {"label": "B", "text": "巴黎和会"}, {"label": "C", "text": "五四运动"}, {"label": "D", "text": "俄国十月革命"}], "answer": "D", "explain": "俄国十月革命推动中国先进分子从西方转向东方、从资产阶级民主主义转向社会主义，选D。A新文化运动、B巴黎和会、C五四运动都不是这一转向的直接推动力量。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 5, "question": "在中国大地上率先举起马克思主义旗帜的是（ ）。", "options": [{"label": "A", "text": "鲁迅"}, {"label": "B", "text": "李大钊"}, {"label": "C", "text": "蔡元培"}, {"label": "D", "text": "陈独秀"}], "answer": "B", "explain": "率先在中国大地上举起马克思主义旗帜的是李大钊，选B。A鲁迅是文学家，C蔡元培是教育家，D陈独秀传播马克思主义晚于李大钊。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 6, "question": "中国第一篇比较系统地介绍马克思主义理论的文章是（ ）。", "options": [{"label": "A", "text": "《谈政治》"}, {"label": "B", "text": "《庶民的胜利》"}, {"label": "C", "text": "《法俄革命之比较观》"}, {"label": "D", "text": "《我的马克思主义观》"}], "answer": "D", "explain": "中国第一篇比较系统地介绍马克思主义理论的文章是李大钊的《我的马克思主义观》，选D。A《谈政治》、B《庶民的胜利》、C《法俄革命之比较观》都不是系统介绍之作。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 7, "question": "五四运动的直接导火线是（ ）。", "options": [{"label": "A", "text": "俄国十月革命的影响"}, {"label": "B", "text": "巴黎和会上中国外交的失败"}, {"label": "C", "text": "新文化运动的推动"}, {"label": "D", "text": "中国共产党的成立"}], "answer": "B", "explain": "五四运动的直接导火线是巴黎和会上中国外交的失败，选B。A十月革命、C新文化运动是时代背景，D中国共产党成立在五四运动之后。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 8, "question": "五四运动后期斗争的主力是（ ）。", "options": [{"label": "A", "text": "学生"}, {"label": "B", "text": "农民"}, {"label": "C", "text": "工人"}, {"label": "D", "text": "商人"}], "answer": "C", "explain": "五四运动后期斗争的主力是工人阶级，选C。A学生是运动前期的先锋和发动者，B农民阶级、D商人在运动中虽有参加，但都不是后期的主力。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 9, "question": "新民主主义革命的开端是（ ）。", "options": [{"label": "A", "text": "中共二大"}, {"label": "B", "text": "中国共产党的成立"}, {"label": "C", "text": "中国无产阶级的产生"}, {"label": "D", "text": "五四运动"}], "answer": "D", "explain": "五四运动是新民主主义革命的开端，选D。A中共二大提出民主革命纲领，B中共成立标志着革命有了新领导核心，C无产阶级产生则是更早的事，均非新民主主义开端。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 10, "question": "伟大的五四精神的核心是（ ）。", "options": [{"label": "A", "text": "民主科学"}, {"label": "B", "text": "爱国主义"}, {"label": "C", "text": "国际主义"}, {"label": "D", "text": "反帝反封建"}], "answer": "B", "explain": "伟大的五四精神的核心是爱国主义，选B。A民主和科学是新文化运动的口号，C国际主义、D反帝反封建是运动体现的性质而非核心。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 11, "question": "马克思主义在中国广泛传播并得到中国知识分子系统介绍是在（ ）之后。", "options": [{"label": "A", "text": "五四运动"}, {"label": "B", "text": "十月革命"}, {"label": "C", "text": "辛亥革命"}, {"label": "D", "text": "新文化运动"}], "answer": "A", "explain": "马克思主义在中国广泛传播并得到系统介绍是在五四运动之后，选A。B十月革命只是送来马克思主义，C辛亥革命、D新文化运动时期均未达到广泛传播。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 12, "question": "中国早期马克思主义者队伍的主体部分是（ ）。", "options": [{"label": "A", "text": "新文化运动的思想领袖"}, {"label": "B", "text": "五四爱国运动的左翼骨干"}, {"label": "C", "text": "欧美留学生"}, {"label": "D", "text": "原中国同盟会会员、辛亥革命时期的活动家"}], "answer": "B", "explain": "中国早期马克思主义者队伍的主体部分是五四爱国运动的左翼骨干，选B。A新文化思想领袖、C欧美留学生、D原同盟会活动家都只是其中的少数。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 13, "question": "马克思主义与中国工人运动相结合过程体现的是（ ）相结合。", "options": [{"label": "A", "text": "小资产阶级与工人群众"}, {"label": "B", "text": "农民群众与工人群众"}, {"label": "C", "text": "先进知识分子与工人群众"}, {"label": "D", "text": "先进知识分子与农民群众"}], "answer": "C", "explain": "马克思主义与中国工人运动相结合，体现为先进知识分子与工人群众相结合，选C。A小资产阶级、B农民群众、D农民与工人结合均不符合这一结合的内涵。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 14, "question": "在（ ）成立的共产党早期组织，实际上是共产党的发起组织。", "options": [{"label": "A", "text": "北京"}, {"label": "B", "text": "上海"}, {"label": "C", "text": "长沙"}, {"label": "D", "text": "武汉"}], "answer": "B", "explain": "在上海成立的共产党早期组织实际上是共产党的发起组织，选B。A北京、C长沙、D武汉的早期组织都是在上海组织联系和推动下相继成立的。"}, {"chapter": "第四章 中国共产党成立和中国革命新局面", "type": "single", "id": 15, "question": "中国共产党早期组织领导的第一个工会是（ ）。", "options": [{"label": "A", "text": "上海机器工会"}, {"label": "B", "text": "长辛店工人俱乐部"}, {"label": "C", "text": "武汉工会"}, {"label": "D", "text": "长沙工会"}], "answer": "A"
