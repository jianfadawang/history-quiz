军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "明显的继承性"}], "answer": "ABD", "explain": "军事思想具有鲜明的阶级性、强烈的时代感和明显的继承性，而“权威性”不属于其特征，故选ABD。"}, {"chapter": "军事思想", "type": "multi", "id": 366, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（）", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "ABCD", "explain": "春秋战国时期影响较大的兵书有《六韬》《孙膑兵法》《尉缭子》和《孙子兵法》，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 367, "question": "宋神宗时期，把（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《吴子》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《司马法》"}], "answer": "ABCD", "explain": "宋神宗时期将《吴子》《三略》《尉缭子》《司马法》等七部兵书定为武学必修，统称《武经七书》，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 368, "question": "与中国古代军事思想相比， 世界古代军事思想起步较晚， 反映了该时期军事思想的著作有（ ）。", "options": [{"label": "A", "text": "《战术》"}, {"label": "B", "text": "《战略》"}, {"label": "C", "text": "《罗马军制》"}, {"label": "D", "text": "《长征记》"}], "answer": "ABCD", "explain": "世界古代军事思想起步较晚，反映该时期的有《战术》《战略》《罗马军制》《长征记》等著作，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 369, "question": "反映了近代无产阶级军事思想的著作有( )。", "options": [{"label": "A", "text": "《共产党宣言》"}, {"label": "B", "text": "《德国农民战争》"}, {"label": "C", "text": "《法兰西内战》"}, {"label": "D", "text": "《战争艺术概论》"}], "answer": "ABC", "explain": "近代无产阶级军事思想见于《共产党宣言》《德国农民战争》《法兰西内战》，《战争艺术概论》属资产阶级军事理论，故选ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 370, "question": "中国古代军事思想中战争论的内容有（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争胜败观"}, {"label": "D", "text": "战争经济观"}], "answer": "ABD", "explain": "中国古代军事思想战争论包含战争本质观、战争和平观和战争经济观，战争胜败观不属其战争论内容，故选ABD。"}, {"chapter": "军事思想", "type": "multi", "id": 371, "question": "中国古代军事思想战备论中战备的内容有（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "文化上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "外交上备战"}], "answer": "ACD", "explain": "中国古代战备论中战备内容包括政治上、思想上和外交上备战，不涉及文化上备战，故选ACD。"}, {"chapter": "军事思想", "type": "multi", "id": 372, "question": "中国古代军事思想战备论中战备的基本原则有（ ）。", "options": [{"label": "A", "text": "相称性原则"}, {"label": "B", "text": "自由性原则"}, {"label": "C", "text": "求已性原则"}, {"label": "D", "text": "平战结合原则"}], "answer": "ACD", "explain": "中国古代战备的基本原则有相称性原则、求已性原则和平战结合原则，无自由性原则，故选ACD。"}, {"chapter": "军事思想", "type": "multi", "id": 373, "question": "毛泽东军事思想的科学含义包括", "options": [{"label": "A", "text": "是毛泽东思想的重要组成部分"}, {"label": "B", "text": "是以毛泽东为代表的老一代革命家、军事家集体经验和智慧的结晶"}, {"label": "C", "text": "是马克思主义普遍原理同中国革命战争实践相结合的产物"}, {"label": "D", "text": "是在长期革命战争中产生的具有中国特色的军事理论"}], "answer": "ABCD", "explain": "毛泽东军事思想是毛泽东思想重要组成部分，是老一辈革命家集体智慧结晶，是马克思主义同中国革命实践结合的产物，也是中国特色军事理论，全选。"}, {"chapter": "军事思想", "type": "multi", "id": 374, "question": "关于毛泽东军事思想的历史地位表述不正确的有", "options": [{"label": "A", "text": "创造性的丰富和发展了马克思军事理论宝库"}, {"label": "B", "text": "在新的历史条件下很难再坚持和继续发展"}, {"label": "C", "text": "是中国革命战争胜利和国防现代化建设的理论指南"}, {"label": "D", "text": "在世界上的影响和传播仅限于第三世界国家中"}], "answer": "BD", "explain": "“难以再坚持和继续发展”及“影响仅限于第三世界”是对毛泽东军事思想历史地位的错误表述，故应选这两项BD。"}, {"chapter": "军事思想", "type": "multi", "id": 375, "question": ".哪些是邓小平国防与军队建设理论的基本内容", "options": [{"label": "A", "text": "关于国防建设军队建设的总目标的论述"}, {"label": "B", "text": "关于战争观和方法论的论述"}, {"label": "C", "text": "关于注重质量建军，走精兵之路的论述"}, {"label": "D", "text": "关于人民军队的建军宗旨的论述"}], "answer": "AC", "explain": "邓小平国防军队建设理论基本内容包括国防军队建设总目标论述和注重质量建军走精兵之路的论述，战争观方法和建军宗旨不属于其基本内容，故选AC。"}, {"chapter": "军事思想", "type": "multi", "id": 376, "question": "新世纪新阶段我国军队的历史使命有哪些", "options": [{"label": "A", "text": "为党巩固执政地位提供重要的力量保证"}, {"label": "B", "text": "为维护国家发展的重要战略机遇期提供坚强的安全保障"}, {"label": "C", "text": "为维护世界和平与促进共同发展发挥重要作用"}, {"label": "D", "text": "为维护国家利益提供有力的战略支撑"}], "answer": "ABCD", "explain": "新世纪新阶段我军历史使命包括为党巩固执政地位提供力量保证、维护重要战略机遇期安全保障、维护世界和平促进共同发展、维护国家利益战略支撑，全选。"}, {"chapter": "军事思想", "type": "multi", "id": 377, "question": "江泽民国防和军队建设思想的主要内容有", "options": [{"label": "A", "text": "新的历史条件下建设什么样的军队，怎样建设军队"}, {"label": "B", "text": "怎样保卫国家社会主义建设的伟大胜利"}, {"label": "C", "text": "未来打什么样的仗，怎样打仗的问题"}, {"label": "D", "text": "围绕“打得赢，不变质”创新和发展我党我军的军事指导理论"}], "answer": "ACD", "explain": "江泽民军队建设思想主要内容有建设什么样军队怎样建设军队、打什么仗怎样打仗以及围绕打得赢不变质创新军事指导理论，故选ACD。"}, {"chapter": "军事思想", "type": "multi", "id": 378, "question": "胡锦涛关于国防和军队建设重要论述的主要内容有", "options": [{"label": "A", "text": "坚持把科学发展观作为加强国防和军队建设的重要指导方针"}, {"label": "B", "text": "关于新世纪新阶段军队的历史使命"}, {"label": "C", "text": "现代条件下的人民战争思想"}, {"label": "D", "text": "促进国防建设与经济建设协调发展"}], "answer": "ABD", "explain": "胡锦涛重要论述包括以科学发展观为指导方针、新世纪新阶段军队历史使命和促进国防经济协调发展，现代条件下人民战争思想不属其内容，故选ABD。"}, {"chapter": "军事思想", "type": "multi", "id": 379, "question": "新世纪新阶段如何着眼战略全局大抓军事训练", "options": [{"label": "A", "text": "自觉主动地推进机械化条件下军事训练向信息化条件下军事训练转变"}, {"label": "B", "text": "在提高官兵综合素质上下狠功夫"}, {"label": "C", "text": "进一步增强使命感和紧迫感，扎扎实实抓好军事斗争准备"}, {"label": "D", "text": "坚持军政军民团结，艰苦奋斗"}], "answer": "ABC", "explain": "大抓军事训练要求推进机械向信息化训练转变、提高官兵综合素质、增强使命感抓好军事斗争准备，军政军民团结艰苦奋斗不属训练内容，故选ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 380, "question": "对红军作战“敌进我退，敌驻我打，敌疲我扰，敌退我追”的“十六字诀”评价正确的是", "options": [{"label": "A", "text": "是适应当时情况的有朴素性质的游击战基本原则"}, {"label": "B", "text": "是毛泽东对中国革命战争进行理论指导的第一个表现"}, {"label": "C", "text": "是我军战略战术体系的第一块基石"}, {"label": "D", "text": "是毛泽东军事思想体系成熟的体现"}], "answer": "ABC", "explain": "十六字诀是朴素的游击战基本原则、毛泽东指导革命战争的首个理论表现和我军战略战术体系的第一块基石，但非军事思想成熟体现，故选ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 381, "question": "习近平国防和军队建设重要论述的主要内容包括 ( ) 。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "BCD", "explain": "“以人为本”是胡锦涛建军治军原则而非习近平思想，其余听党指挥能打胜仗作风优良、绝对忠诚纯洁可靠、召之即来来之能战均为习近平内容，故选BCD。"}, {"chapter": "军事思想", "type": "multi", "id": 382, "question": "习近平国防和军队建设重要论述的主要内容包括 ( ) 。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "BD", "explain": "以人为本是胡锦涛原则、科学发展观是胡锦涛指导方针，均非习近平内容，故选习近平思想的BD即造就优秀人才和完善军事制度。"}, {"chapter": "军事思想", "type": "multi", "id": 383, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "严格的强制性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "明显的继承性"}], "answer": "BD", "explain": "军事思想特征为强烈的时代感和明显的继承性，严格的强制性和权威性并非其特征，故选BD。"}, {"chapter": "军事思想", "type": "multi", "id": 384, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（ ）", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙膑兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《黄石公三略》"}], "answer": "ABC", "explain": "《黄石公三略》成书较晚不属春秋战国时期，其余《六韬》《孙膑兵法》《尉缭子》均为该时期兵书，故选ABC。"}, {"chapter": "现代理论", "type": "multi", "id": 385, "question": "人类的战争形态主要有（ ）。", "options": [{"label": "A", "text": "冷兵器战争"}, {"label": "B", "text": "热兵器战争"}, {"label": "C", "text": "机械化战争"}, {"label": "D", "text": "高技术战争"}], "answer": "ABCD", "explain": "人类战争形态主要包括冷兵器战争、热兵器战争、机械化战争和高技术战争四种，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 386, "question": "信息主要由信源、语言和（ ）构成。", "options": [{"label": "A", "text": "载体"}, {"label": "B", "text": "信道"}, {"label": "C", "text": "信宿"}, {"label": "D", "text": "媒介"}], "answer": "ABCD", "explain": "信息由信源、语言以及载体、信道、信宿、媒介等要素构成，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 387, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可量度"}, {"label": "B", "text": "可识别"}, {"label": "C", "text": "可转换"}, {"label": "D", "text": "可储存"}], "answer": "ABCD", "explain": "信息具有可量度、可识别、可转换、可储存等特征，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 388, "question": "高技术战争的萌芽阶段中，具有代表性的战争是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "AB", "explain": "高技术战争萌芽阶段的代表性战争是朝鲜战争和越南战争，马岛战争和海湾战争属于更晚阶段，故选AB。"}, {"chapter": "现代理论", "type": "multi", "id": 389, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "第五次中东战争"}], "answer": "BCD", "explain": "高技术战争初期发展与基本形成阶段的代表是第四次中东战争、马岛战争和第五次中东战争，朝鲜战争属萌芽阶段，故选BCD。"}, {"chapter": "现代理论", "type": "multi", "id": 390, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中，美军运用了“百舌鸟”、“响尾蛇”等新式导弹和气浪弹、激光制导、电视制导炸弹。"}, {"label": "C", "text": "越南战争中先后动用了20余艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合， 进行“蛙跳” 式的袭击作战。"}], "answer": "ABCD", "explain": "选项四个关于越南战争的表述均正确，它处于高技术战争萌芽期并动用了新式导弹、航母和直升机蛙跳作战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 391, "question": "对第四次中东战争描述正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "在第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "第四次中东战争中，首次利用空中卫星进行战场侦察。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "ABC", "explain": "第四次中东战争中首次利用空中卫星进行战场侦察这一说法不准确，其余关于导弹大规模使用等表述正确，故选ABC。"}, {"chapter": "现代理论", "type": "multi", "id": 392, "question": "在信息化战争雏形阶段中，典型的是（ ）。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "BCD", "explain": "信息化战争雏形阶段的典型是科索沃战争、阿富汗战争和伊拉克战争，海湾战争是萌芽或初步阶段，故选BCD。"}, {"chapter": "现代理论", "type": "multi", "id": 393, "question": "传统战争的作战样式可以表现为（ ）。", "options": [{"label": "A", "text": "阵地战"}, {"label": "B", "text": "运动战"}, {"label": "C", "text": "游击战"}, {"label": "D", "text": "闪击战"}], "answer": "ABCD", "explain": "传统战争作战样式包括阵地战、运动战、游击战和闪击战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 394, "question": "信息化战争则是以信息的（）为核心进行的争夺。", "options": [{"label": "A", "text": "获取权"}, {"label": "B", "text": "监督权"}, {"label": "C", "text": "控制权"}, {"label": "D", "text": "使用权"}], "answer": "ACD", "explain": "信息化战争以信息的获取权、控制权和使用权为核心争夺，监督权不属其核心内容，故选ACD。"}, {"chapter": "现代理论", "type": "multi", "id": 395, "question": "信息化战争中的作战主要包括（ ）三个层次的作战内容。", "options": [{"label": "A", "text": "以物质摧毁和消灭有生力量为主要内容的物理层面的作战"}, {"label": "B", "text": "以控制信息基础设施和电磁频谱为主要内容的信息层面的作战"}, {"label": "C", "text": "以瓦解人的意志和情感为主要内容的心理层面的作战"}, {"label": "D", "text": "以削弱对方的战争力最为主要内容的武器装备层面的作战"}], "answer": "ABC", "explain": "信息化战争作战包括物理层面、信息层面和心理层面三个层次，武器装备层面不属此三层次，故选ABC。"}, {"chapter": "现代理论", "type": "multi", "id": 396, "question": "信息化战争中，战争能量从传统的（ ）等物理能量转变为智能。", "options": [{"label": "A", "text": "化学能"}, {"label": "B", "text": "电能"}, {"label": "C", "text": "电磁能"}, {"label": "D", "text": "机械能"}], "answer": "ABCD", "explain": "信息化战争中战争能量由传统的化学能、电能、电磁能、机械能等物理能量转变为智能，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 397, "question": "信息时代的信息化战争则是在（ ）等多维空间内进行的一体化作战。", "options": [{"label": "A", "text": "陆地"}, {"label": "B", "text": "海洋"}, {"label": "C", "text": "空中"}, {"label": "D", "text": "电磁"}], "answer": "ABCD", "explain": "信息化战争是在陆地、海洋、空中和电磁等多维空间内进行的一体化作战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 398, "question": "信息化战争以前的战争中，（ ）的地位更为突出，是主要的战略资源。", "options": [{"label": "A", "text": "物资"}, {"label": "B", "text": "能源"}, {"label": "C", "text": "信息"}, {"label": "D", "text": "人力"}], "answer": "AB", "explain": "信息化战争以前，物资和能源地位更为突出是主要战略资源，信息是信息化战争的核心资源，故选AB。"}, {"chapter": "现代理论", "type": "multi", "id": 399, "question": "信息化战争中强调“精确战”，那么对精确战描述正确的是（ ）。", "options": [{"label": "A", "text": "精确战是对敌目标实施精确打击所造成的附带毁伤很小的一种作战样式。"}, {"label": "B", "text": "在精确战中使用的武器装备的信息技术含量高。"}, {"label": "C", "text": "精确战的实施依赖于透明度很高的战场。"}, {"label": "D", "text": "精确战中可以更迅速、更准确地抓住战机，从而使作战行动比以前更加精确，更具致命性。"}], "answer": "ABCD", "explain": "四个选项对精确战的描述均正确，精确打击附带毁伤小、武器信息技术含量高、依赖透明战场、更快更准更致命，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 400, "question": "信息化战争的作战样式有（ ）。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "ABCD", "explain": "信息化战争作战样式包括战争潜力削弱战、指挥中枢瘫痪战、战争结构破坏战和心理系统瓦解战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 401, "question": "信息化战争的特征是（ ）。", "options": [{"label": "A", "text": "作战空间超大多维"}, {"label": "B", "text": "作战节奏迅疾快速"}, {"label": "C", "text": "作战行动精确化"}, {"label": "D", "text": "信息资源价值急剧上升"}], "answer": "ABCD", "explain": "信息化战争特征包括作战空间超大多维、作战节奏迅疾快速、作战行动精确化和信息资源价值急剧上升，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 402, "question": "信息化战争的发展趋势是（） 。", "options": [{"label": "A", "text": "信息力量的竞争将愈演愈烈"}, {"label": "B", "text": "人类的战争能力将持续提升"}, {"label": "C", "text": "作战方式和战争形态将不断变化"}, {"label": "D", "text": "对经济和科技的依赖性将越来越强"}], "answer": "ABCD", "explain": "信息化战争发展趋势包括信息力量竞争加剧、战争能力持续提升、作战方式形态不断变化和对经济科技依赖增强，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 403, "question": "在信息化战争中，人类的战争能力将持续提升，具体表现为（ ）。", "options": [{"label": "A", "text": "战场感知力持续提升"}, {"label": "B", "text": "战场反应速度持续加快"}, {"label": "C", "text": "精确打击能力持续增强"}, {"label": "D", "text": "作战空间和时间持续延伸"}], "answer": "ABCD", "explain": "人类战争能力持续提升表现为战场感知力提升、反应速度加快、精确打击能力增强和作战时空延伸，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 404, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括（ ）。", "options": [{"label": "A", "text": "战略心理战"}, {"label": "B", "text": "网络系统战"}, {"label": "C", "text": "全元总体战"}, {"label": "D", "text": "太空绞杀战"}], "answer": "ABCD", "explain": "信息化战争催生的新作战方法包括战略心理战、网络系统战、全元总体战和太空绞杀战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 405, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括( )。", "options": [{"label": "A", "text": "掏心战"}, {"label": "B", "text": "瘫痪战"}, {"label": "C", "text": "隐形战"}, {"label": "D", "text": "致盲战"}], "answer": "ABCD", "explain": "信息化战争新作战方法还包括掏心战、瘫痪战、隐形战和致盲战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 406, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括（ ）。", "options": [{"label": "A", "text": "点穴战"}, {"label": "B", "text": "无人战"}, {"label": "C", "text": "精微战"}, {"label": "D", "text": "间隙战"}], "answer": "ABCD", "explain": "信息化战争新作战方法还有点穴战、无人战、精微战和间隙战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 407, "question": "信息化战争中新的制胜因素的出现，必然给国防建设提出一系列的挑战，这种挑战表现为（ ）。", "options": [{"label": "A", "text": "制胜优势的转型，制信息权成为超越制空权、制海权的新的制高点。"}, {"label": "B", "text": "信息技术优势导致战场全维领域的透明，夜战、电子战、侦察与反侦察成为贯穿战争始终的要领。"}, {"label": "C", "text": "信息化推动军事组织结构不断创新， 指挥机构趋向简捷，陆海空三军的区分趋向模糊。"}, {"label": "D", "text": "人的智能得到极大扩展，信息化提供了前所未有的人类充分利用智能空间。"}], "answer": "ABCD", "explain": "信息化战争给国防建设带来制胜优势转型、战场透明、军事组织创新和人的智能扩展等挑战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 408, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可传递"}, {"label": "B", "text": "可再生"}, {"label": "C", "text": "可压缩"}, {"label": "D", "text": "可量度"}], "answer": "ABCD", "explain": "信息具有可传递、可再生、可压缩、可量度等特征，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 409, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为（ ）。", "options": [{"label": "A", "text": "“第三次浪潮战争”"}, {"label": "B", "text": "“非接触战争”"}, {"label": "C", "text": "“第六代战争”"}, {"label": "D", "text": "“第五代战争”"}], "answer": "BC", "explain": "俄罗斯军事理论家斯里普琴科从武器装备发展角度将信息化战争称为“非接触战争”和“第六代战争”，故选BC。"}, {"chapter": "现代理论", "type": "multi", "id": 410, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了20艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合，进行 “蛙跳”式的袭击作战。"}], "answer": "ACD", "explain": "越南战争处于高技术战争萌芽阶段，动用了20艘航母20万架次舰载机和直升机蛙跳袭击；“首次利用卫星侦察”说法错误，故选ACD。"}, {"chapter": "现代理论", "type": "multi", "id": 411, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "BC", "explain": "高技术战争初期发展与基本形成阶段的代表是第四次中东战争和马岛战争，朝鲜战争属萌芽、海湾战争更晚，故选BC。"}, {"chapter": "现代理论", "type": "multi", "id": 412, "question": "对第四次中东战争描述正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "在第四次中东战争中出现了直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "AB", "explain": "第四次中东战争处于初期发展与基本形成阶段且普遍运用高技术导弹，“蛙跳”和“17种制导武器”属于其他战争，故选AB。"}, {"chapter": "现代理论", "type": "multi", "id": 413, "question": "信息化战争中，战争能量从传统的（ ）等物理能量转变为智能。", "options": [{"label": "A", "text": "化学能"}, {"label": "B", "text": "体能"}, {"label": "C", "text": "机械能"}, {"label": "D", "text": "核能"}], "answer": "ABCD", "explain": "信息化战争战争能量由化学能、体能、机械能、核能等物理能量转变为智能，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 414, "question": "信息时代的信息化战争则是在（）等多维空间内进行的一体化作战。", "options": [{"label": "A", "text": "太空"}, {"label": "B", "text": "心理"}, {"label": "C", "text": "网络"}, {"label": "D", "text": "电磁"}], "answer": "ABCD", "explain": "信息化战争是在太空、心理、网络和电磁等多维空间内进行的一体化作战，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 415, "question": "信息化战争的作战样式有（ ）。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "制信息权争夺战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "ABCD", "explain": "信息化战争作战样式包括战争潜力削弱战、指挥中枢瘫痪战、制信息权争夺战和心理系统瓦解战，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 416, "question": "信息化战争的特征是（ ）。", "options": [{"label": "A", "text": "作战空间超大多维"}, {"label": "B", "text": "作战要素一体化"}, {"label": "C", "text": "武器装备高度信息化"}, {"label": "D", "text": "信息资源价值急剧上升"}], "answer": "ABCD", "explain": "信息化战争特征包括作战空间超大多维、作战要素一体化、武器装备高度信息化和信息资源价值急剧上升，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 417, "question": "在信息化战争中，人类的战争能力将持续提升，具体表现为（ ）。", "options": [{"label": "A", "text": "战场感知力持续提升"}, {"label": "B", "text": "战场效能持续提高"}, {"label": "C", "text": "精确打击能力持续增强"}, {"label": "D", "text": "作战空间和时间待续延伸"}], "answer": "ABCD", "explain": "人类战争能力持续提升表现为战场感知力提升、战场效能提高、精确打击能力增强和作战时空延伸，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 418, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可处理"}, {"label": "B", "text": "可再生"}, {"label": "C", "text": "实效性"}, {"label": "D", "text": "可共享"}], "answer": "ABCD", "explain": "信息具有可处理、可再生、实效性和可共享等特征，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 419, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了2艘航空母舰，舰载机出动达20余万架次以上。"}, {"label": "D", "text": "越南战争中交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "AC", "explain": "越南战争处于高技术战争萌芽期、首次利用空中卫星进行战场侦察，交战国动用核武器等说法不准确，故选AC。"}, {"chapter": "现代理论", "type": "multi", "id": 420, "question": "信息化战争的发展趋势是（ ）。", "options": [{"label": "A", "text": "战争的不对称表现日趋多样"}, {"label": "B", "text": "人类的战争能力将持续提升"}, {"label": "C", "text": "作战方式和战争形态将不断变化"}, {"label": "D", "text": "对经济和科技的依赖性将越来越强"}], "answer": "ABCD", "explain": "信息化战争发展趋势包括战争不对称表现日趋多样、战争能力持续提升、作战方式形态不断变化和对经济科技依赖增强，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 421, "question": "要想打赢未来的信息化战争，实现伟大祖国的和平统一，实现中华民族的伟大复兴，我们应该（ ）。", "options": [{"label": "A", "text": "要提高对信息化战争的全面认识，增强信息制胜的思维意识"}, {"label": "B", "text": "要打破传统观念，树立新型信息制胜观念，确立“综合制胜”的观念"}, {"label": "C", "text": "要着力铸造“撒手铜”，为打赢创造物质条件"}, {"label": "D", "text": "要树立新型人才观念，打造应对信息化战争的高素质军事人才"}], "answer": "ABCD", "explain": "打赢信息化战争应提高认识增强信息制胜思维、树立综合制胜观念、铸造“撒手铜”和培养高素质人才，全选。"}, {"chapter": "现代理论", "type": "multi", "id": 422, "question": "新军事革命，就是在以信息技术为核心的高技术迅猛发展推动下，将（  ）有机地结合在一起而形成的、能彻底改变旧作战方式，极大地提高军事效能的军事革命。", "options": [{"label": "A", "text": "信息化武器系统"}, {"label": "B", "text": "创新军事理论"}, {"label": "C", "text": "体制变革"}, {"label": "D", "text": "科技发展"}], "answer": "ABC", "explain": "新军事革命是将信息化武器系统、创新军事理论和体制变革有机结合，科技发展本身不属此三项范畴，故选ABC。"}, {"chapter": "现代理论", "type": "multi", "id": 423, "question": "新军事革命的涵义（ ）", "options": [{"label": "A", "text": "新军事革命是进入机械化战争时代的重要革命"}, {"label": "B", "text": "新军事革命是整个社会变革的重要组成，强调要从社会整体变化来认识新军事变革。"}, {"label": "C", "text": "新军事变革是科学技术发展和应用的必然结果，必须从现代科学技术的发展来认识新军事变革。"}, {"label": "D", "text": "新军事变革是军事领域的整体变革，必须从军事发展的全局来认识新军事变革。"}], "answer": "BCD", "explain": "新军事革命不是进入机械化战争时代的革命，而是信息时代革命，其余社会变革组成、科技必然结果、军事整体变革均正确，故选BCD。"}, {"chapter": "现代理论", "type": "multi", "id": 424, "question": "新军事革命的主要内容有（  ）", "options": [{"label": "A", "text": "创新军事技术，实现武器装备的信息化"}, {"label": "B", "text": "创新体制编制，重组军队组织结构"}, {"label": "C", "text": "创新军事理论，推动军队建设转型"}, {"label": "D", "text": "创新作战方式，适应新的战争形态"}], "answer": "ABCD", "explain": "新军事革命内容包括创新军事技术、创新体制编制、创新军事理论和创新作战方式四个方面，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 425, "question": "电子信息处理能力战斗效能的提高主要依靠电子信息系统对目标的(    )。", "options": [{"label": "A", "text": "识别"}, {"label": "B", "text": "制导、指挥"}, {"label": "C", "text": "战斗部件威力加大"}, {"label": "D", "text": "控制能力增强"}], "answer": "ABD", "explain": "电子信息处理能力战斗效能提高依靠电子信息系统对目标的识别、制导指挥和控制能力，战斗部件威力加大不属此类，故选ABD。"}, {"chapter": "信息化武装", "type": "multi", "id": 426, "question": "信息化战争的形成是下列(    )因素作用的结果。", "options": [{"label": "A", "text": "政治"}, {"label": "B", "text": "经济"}, {"label": "C", "text": "科技"}, {"label": "D", "text": "自然"}], "answer": "ABC", "explain": "信息化战争形成是政治、经济和科技因素共同作用的结果，自然因素不属其形成因素，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 427, "question": "信息化战争中,要取得胜利,需要具备(    )。", "options": [{"label": "A", "text": "制陆权、制海权"}, {"label": "B", "text": "制空权"}, {"label": "C", "text": "制天权"}, {"label": "D", "text": "制电磁权"}], "answer": "ABCD", "explain": "信息化战争取胜需具备制陆权、制海权、制空权、制天权和制电磁权，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 428, "question": "20世纪80年代以来的局部战争的特点是(    )。", "options": [{"label": "A", "text": "战争目的有限"}, {"label": "B", "text": "战争规模不大"}, {"label": "C", "text": "战争持续时间短"}, {"label": "D", "text": "电子信息领域的对抗对战争进程影响不大"}], "answer": "ABC", "explain": "20世纪80年代以来局部战争特点是目的有限、规模不大、持续时间短，电子信息对抗影响已经很大而非不大，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 429, "question": "从信息化战争的本质而言,包含了(    )等方面的含义。", "options": [{"label": "A", "text": "信息化战争还将是核威慑下的高技术常规战争"}, {"label": "B", "text": "武器系统的信息智能化和作战行动的一体化"}, {"label": "C", "text": "信息化战争当前已经处于辉煌阶段"}, {"label": "D", "text": "信息化战争的性质仍然是政治的暴力继续"}], "answer": "ABD", "explain": "信息化战争本质包含核威慑下的高技术常规战争、武器信息智能化和作战一体化、政治暴力继续的含义，当前已处辉煌阶段说法错误，故选ABD。"}, {"chapter": "信息化武装", "type": "multi", "id": 430, "question": "信息化战争在打击目标的控制上,主要是打击(    )。", "options": [{"label": "A", "text": "指挥控制枢纽"}, {"label": "B", "text": "重要军事设施"}, {"label": "C", "text": "重兵集团"}, {"label": "D", "text": "前线所有部队"}], "answer": "ABC", "explain": "信息化战争打击目标主要是指挥控制枢纽、重要军事设施和重兵集团，而非前线所有部队，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 431, "question": "现在军队的指挥自动化系统的薄弱环节有(    )。", "options": [{"label": "A", "text": "系统不完善"}, {"label": "B", "text": "生存能力低"}, {"label": "C", "text": "保密系统不健全"}, {"label": "D", "text": "互通性差"}], "answer": "ABCD", "explain": "军队指挥自动化系统的薄弱环节有系统不完善、生存能力低、保密系统不健全和互通性差，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 432, "question": "21世纪整个军队的发展趋势来看,主要是(    )。", "options": [{"label": "A", "text": "数字化"}, {"label": "B", "text": "小型化"}, {"label": "C", "text": "职业化"}, {"label": "D", "text": "规模化"}], "answer": "ABC", "explain": "21世纪军队发展趋势是数字化、小型化和职业化，规模化与其趋势相反，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 433, "question": "信息化战争是新军事变革的产物,会形成以下(    )新的作战领域。", "options": [{"label": "A", "text": "空间战"}, {"label": "B", "text": "精确打击"}, {"label": "C", "text": "主宰机动"}, {"label": "D", "text": "信息战"}], "answer": "ABCD", "explain": "信息化战争形成的新作战领域包括空间战、精确打击、主宰机动和信息战，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 434, "question": "国防动员体制机制有(    )。", "options": [{"label": "A", "text": "平战转换机制"}, {"label": "B", "text": "军地协调机制"}, {"label": "C", "text": "激励补偿机制"}, {"label": "D", "text": "监督约束机制"}], "answer": "ABCD", "explain": "国防动员体制机制包括平战转换机制、军地协调机制、激励补偿机制和监督约束机制，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 435, "question": "信息化战争消耗巨大的原因(    )。", "options": [{"label": "A", "text": "武器装备费用上升"}, {"label": "B", "text": "战争物资消耗增多"}, {"label": "C", "text": "战争时间持续过长"}, {"label": "D", "text": "战争过于频繁"}], "answer": "AB", "explain": "信息化战争消耗巨大的原因是武器装备费用上升和战争物资消耗增多，战争时间过长和过于频繁并非其消耗大的主因，故选AB。"}, {"chapter": "信息化武装", "type": "multi", "id": 436, "question": "下列叙述正确的是(    )。", "options": [{"label": "A", "text": "未来战争能否取得胜利,最终的决定性因素还是军事技术先进性。"}, {"label": "B", "text": "军用信息技术在军队信息化建设中起着十分关键的基础作用"}, {"label": "C", "text": "军队信息化建设需要有强大的经济实力做后盾"}, {"label": "D", "text": "通过加速信息化提升现代作战能力成为军队建设的必然要求"}], "answer": "BCD", "explain": "未来战争胜负的决定性因素是人和综合因素而非单纯军事技术先进性，其余信息化基础、经济后盾、加速信息化均正确，故选BCD。"}, {"chapter": "信息化武装", "type": "multi", "id": 437, "question": "信息化战争的可控性主要表现在以下几个方面(    )。", "options": [{"label": "A", "text": "能有效控制战争的进程"}, {"label": "B", "text": "能有效控制战争的规模"}, {"label": "C", "text": "能有效减少战争物资的消耗"}, {"label": "D", "text": "能有效控制打击的目标"}], "answer": "ABD", "explain": "信息化战争可控性表现为能控制战争进程、规模和打击目标，减少物资消耗不属可控性的表现，故选ABD。"}, {"chapter": "信息化武装", "type": "multi", "id": 438, "question": "信息化战争的特征有(    )。", "options": [{"label": "A", "text": "战争消耗相对较少"}, {"label": "B", "text": "战争可控性强"}, {"label": "C", "text": "系统对抗突出"}, {"label": "D", "text": "指挥控制自动化"}], "answer": "BCD", "explain": "信息化战争特征是战争可控性强、系统对抗突出和指挥控制自动化，战争消耗相对较少说法错误，故选BCD。"}, {"chapter": "信息化武装", "type": "multi", "id": 439, "question": "“海湾战争”是冷战结束以后(    )的一场局部战争。", "options": [{"label": "A", "text": "规模最大"}, {"label": "B", "text": "参战国最多"}, {"label": "C", "text": "战争消耗最大"}, {"label": "D", "text": "现代化程度很高"}], "answer": "ABD", "explain": "海湾战争是冷战结束后规模最大、参战国最多、现代化程度很高的一场局部战争，战争消耗最大说法不准确，故选ABD。"}, {"chapter": "信息化武装", "type": "multi", "id": 440, "question": "下列(    )是信息化战争对国防建设的要求。", "options": [{"label": "A", "text": "着力培养高素质军事人才,全面提高军队质量"}, {"label": "B", "text": "加大国防科研力度,加速发展高技术武器装备"}, {"label": "C", "text": "优化军队编制体制,提高战斗力"}, {"label": "D", "text": "加强高技术战争的理论研究,创新军事理论"}], "answer": "ABCD", "explain": "四个选项均为信息化战争对国防建设的要求：培养人才、研发装备、优化编制和创新理论，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 441, "question": "信息化战争的作战特点有（    ）。", "options": [{"label": "A", "text": "局部战争全局化"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "进攻作战网络化"}, {"label": "D", "text": "防御作战总体化"}], "answer": "ACD", "explain": "信息化战争作战特点包括局部战争全局化、进攻作战网络化和防御作战总体化，科索沃战争是具体战争而非特点，故选ACD。"}, {"chapter": "信息化武装", "type": "multi", "id": 442, "question": "对于下列信息化战争形成原因的表述,正确的是(    )。", "options": [{"label": "A", "text": "不断更新的作战理念是信息化战争形成的“催产剂”"}, {"label": "B", "text": "军事斗争的需要是信息化战争形成的先导"}, {"label": "C", "text": "以信息技术为代表的科学技术的发展是信息化战争形成的物质技术基础"}, {"label": "D", "text": "不断发生的局部战争是信息化战争形成的“试验场”"}], "answer": "CD", "explain": "信息化战争形成原因中，科技发展是物质技术基础、局部战争是试验场，作战理念和军事斗争需要的主语表述对调错误，故选CD。"}, {"chapter": "信息化武装", "type": "multi", "id": 443, "question": "下列(    )有利于优化军队编制体制。", "options": [{"label": "A", "text": "保持适度的军队规模"}, {"label": "B", "text": "优先发展海空军,加强技术兵种的建设"}, {"label": "C", "text": "搞好各军兵种部队的科学编组"}, {"label": "D", "text": "精简机关,充实部队"}], "answer": "ABCD", "explain": "优化军队编制体制的做法包括保持适度规模、优先发展海空军、搞好科学编组和精简机关充实部队，全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 444, "question": "下列(    )体现了信息化战争的战场空间广阔。", "options": [{"label": "A", "text": "从区域战场向全球战场延伸"}, {"label": "B", "text": "从军事战场向经济战场延伸"}, {"label": "C", "text": "从空中战场向太空战场延伸"}, {"label": "D", "text": "从有形战场向无形战场延伸"}], "answer": "ACD", "explain": "信息化战争战场空间广阔体现为向全球战场、太空战场、无形战场延伸，“向经济战场延伸”不属于战场空间范畴，故选ACD。"}, {"chapter": "信息化武装", "type": "multi", "id": 445, "question": "“海湾战争”改变了传统的作战样式,表现在(    )。", "options": [{"label": "A", "text": "空中力量发挥了决定性作用,开创了以空中力量为主体赢得战争的先例"}, {"label": "B", "text": "电子战成为未来战争的核心,对战争进程和结果产生重要影响"}, {"label": "C", "text": "作战空域空前扩大,战场向大纵深、高度立体化方向发展"}, {"label": "D", "text": "高技术武器大大提高了作战能力,使作战行动向高速度、全天候、全时域发展"}], "answer": "ABCD", "explain": "海湾战争改变了传统作战样式，表现在空中力量决定性作用、电子战成核心、作战空域扩大和武器高速全天候，全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 446, "question": "引发战争的原因有(    )。", "options": [{"label": "A", "text": "领土争端"}, {"label": "B", "text": "经济矛盾"}, {"label": "C", "text": "民族矛盾"}, {"label": "D", "text": "宗教矛盾"}], "answer": "ABCD", "explain": "引发战争的原因包括领土争端、经济矛盾、民族矛盾和宗教矛盾，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 447, "question": "信息化战争的作战方式,将从过去的以陆地为主、侧重对敌实施地面作战,发展为一体化的联合作战。(    )", "options": [{"label": "A", "text": "陆"}, {"label": "B", "text": "海"}, {"label": "C", "text": "电"}, {"label": "D", "text": "天"}], "answer": "ABCD", "explain": "信息化战争作战方式发展为陆、海、电、天一体化的联合作战，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 448, "question": "军队信息化建设中的信息化改造要求围绕(    )。", "options": [{"label": "A", "text": "高可靠性和可维修性"}, {"label": "B", "text": "高效能、多功能"}, {"label": "C", "text": "通用化"}, {"label": "D", "text": "模块化"}], "answer": "ABCD", "explain": "军队信息化改造围绕高可靠性和可维修性、高效能多功能、通用化和模块化展开，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 449, "question": "后勤信息化建设要求后勤(    )。", "options": [{"label": "A", "text": "信息化装备"}, {"label": "B", "text": "信息化保障手段建设"}, {"label": "C", "text": "指挥自动化"}, {"label": "D", "text": "保障社会化、可视化、和精确化水平"}], "answer": "ABCD", "explain": "后勤信息化建设要求信息化装备、信息化保障手段建设、指挥自动化和保障社会化可视化精确化，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 450, "question": "加强军事信息资源战略管理,抓好信息资源的标准化建设要求是(    )。", "options": [{"label": "A", "text": "统一软件规范"}, {"label": "B", "text": "统一内外网共享"}, {"label": "C", "text": "统一规划和设计各类计算机信息管理系统"}, {"label": "D", "text": "统一硬件标准"}], "answer": "ACD", "explain": "加强军事信息资源标准化建设要求统一软件规范、统一规划设计和统一硬件标准，内外网共享不属标准化要求，故选ACD。"}, {"chapter": "信息化武装", "type": "multi", "id": 451, "question": "“海湾战争”改变了传统的作战样式,表现在(    )。", "options": [{"label": "A", "text": "空中力量发挥了决定性作用,开创了以空中力量为主体赢得战争的先例"}, {"label": "B", "text": "信息战成为未来战争的核心,对战争进程和结果产生重要影响"}, {"label": "C", "text": "作战空域空前扩大,战场向大纵深、高度立体化方向发展"}, {"label": "D", "text": "高技术武器大大提高了作战能力,使作战行动向高速度、全天候、全时域发展"}], "answer": "ABCD", "explain": "海湾战争改变传统作战样式的四个方面（空中力量、信息战、空域扩大、高速度全天候）均正确，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 452, "question": "数字化的轻型武装侦察直升机的特点有(    )。", "options": [{"label": "A", "text": "360度全角度激光探测能力"}, {"label": "B", "text": "在150千米高空进行军事侦察"}, {"label": "C", "text": "机身装满数字化武器"}, {"label": "D", "text": "可携带火箭弹及反坦克导弹"}], "answer": "ACD", "explain": "数字化轻型武装侦察直升机特点有360度激光探测、机载数字化武器和可携带火箭弹反坦克导弹，150千米高空侦察不是直升机特点，故选ACD。"}, {"chapter": "信息化武装", "type": "multi", "id": 453, "question": "关于美军数字化师的叙述正确的(    )。", "options": [{"label": "A", "text": "作战能力相当1个非数字化军"}, {"label": "B", "text": "控制地域可以达到24000平方千米"}, {"label": "C", "text": "2001年正式投入使用"}, {"label": "D", "text": "数字化师比普通部队反应迅速"}], "answer": "ABCD", "explain": "美军数字化师作战能力相当一个非数字化军、控制地域24000平方千米、2001年投入使用且反应迅速，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 454, "question": "以下有关“海湾战争”叙述正确的是(    )。", "options": [{"label": "A", "text": "“海湾战争”发生在20世纪90年代初"}, {"label": "B", "text": "GBU-28激光制导炸弹长5.85米"}, {"label": "C", "text": "“沙漠风暴”行动发生在海湾战争中"}, {"label": "D", "text": "“斩首行动”发生在海湾战争中"}], "answer": "ABC", "explain": "海湾战争发生在20世纪90年代初、GBU-28激光制导炸弹长5.85米、“沙漠风暴”是其行动，斩首行动是伊拉克战争，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 455, "question": "以下叙述正确的(    )。", "options": [{"label": "A", "text": "一般来说,信息化战争的发展将历经三个阶段"}, {"label": "B", "text": "军事斗争的需要是信息化战争形成的“催产剂”"}, {"label": "C", "text": "霸权主义引起的军备竞争,促进了信息化武器装备的发展"}, {"label": "D", "text": "不断更新的作战理念是信息化战争形成的先导"}], "answer": "ABCD", "explain": "四个叙述（信息化战争历经三阶段、军事斗争需要是催产剂、霸权军备竞争促进发展、作战理念是先导）均正确，全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 456, "question": "以下叙述正确的(    )。", "options": [{"label": "A", "text": "机械化战争是数量决定效能"}, {"label": "B", "text": "信息化战争是信息决定效能"}, {"label": "C", "text": "信息化战争的作战指挥控制是横向连接的树状结构"}, {"label": "D", "text": "机械化战争的作战指挥是扁平状的网络结构"}], "answer": "AB", "explain": "机械化战争是数量决定效能、信息化战争是信息决定效能，其指挥结构表述正相反（机械是树状、信息是扁平网络），故选AB。"}, {"chapter": "信息化武装", "type": "multi", "id": 457, "question": "以下叙述错误的(    )。", "options": [{"label": "A", "text": "1998年对南联盟的军事行动中,美军使用了多种信息化武器装备"}, {"label": "B", "text": "2000年对阿富汗的战争,美军基本实现了信息化作战"}, {"label": "C", "text": "1991年,美军发动了“海湾战争”,主战武器是信息化武器"}, {"label": "D", "text": "2003年,美军发动对伊拉克的战争,投入了90%的信息化武器"}], "answer": "ABC", "explain": "1998年南联盟、2000年阿富汗、1991年海湾战争相关表述均与事实不符，2003年伊拉克战争投入九成信息化武器是对的，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 458, "question": "下列叙述正确的是(    )。", "options": [{"label": "A", "text": "今后若不幸发生新的世界大战,整个太空将成为一个广阔的战场"}, {"label": "B", "text": "在未来信息化战争中,远战将会取代近战,作为主要作战方式"}, {"label": "C", "text": "未来信息化战争是综合国力的对抗"}, {"label": "D", "text": "从信息化战争的发展趋势看,后勤保障将向“局部化”方向发展"}], "answer": "ABC", "explain": "后勤保障应走向精确化而非局部化，其余太空战场、远战取代近战、综合国力对抗均正确，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 459, "question": "随着科技的不断发展,武器装备的发展方向是(    )。", "options": [{"label": "A", "text": "大型化"}, {"label": "B", "text": "智能化"}, {"label": "C", "text": "自动化"}, {"label": "D", "text": "集约化"}], "answer": "BCD", "explain": "武器装备发展方向是智能化、自动化和集约化，大型化与其小型化趋势相反，故选BCD。"}, {"chapter": "信息化武装", "type": "multi", "id": 460, "question": "在科索沃战争中,已经显露了(    )等信息化战争的作战特点。", "options": [{"label": "A", "text": "防御作战总体化"}, {"label": "B", "text": "主战兵器机械化"}, {"label": "C", "text": "进攻作战网络化"}, {"label": "D", "text": "局部战争全局化"}], "answer": "ACD", "explain": "科索沃战争显露防御作战总体化、进攻作战网络化和局部战争全局化特点，主战兵器机械化是旧特点，故选ACD。"}, {"chapter": "信息化武装", "type": "multi", "id": 461, "question": "世界各国在加强军队指挥的自动化系统建设方面的行动有(    )。", "options": [{"label": "A", "text": "健全和完善自动化体系,实现全军统一的自动化指挥系统"}, {"label": "B", "text": "采用标准化计算机网络,提高各种指挥自动化系统的互通性和工作效率"}, {"label": "C", "text": "发展新一代通信卫星,建立新的通信系统"}, {"label": "D", "text": "研制神经网络计算机和光子计算机,提高自动化指挥系统的人工智能水平"}], "answer": "ABCD", "explain": "四个选项均为各国加强军队指挥自动化系统建设的行动，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 462, "question": "有关信息化战争的概念,正确的是(    )。", "options": [{"label": "A", "text": "以系统集成和信息控制为主导"}, {"label": "B", "text": "发生在信息时代"}, {"label": "C", "text": "以信息为基础并以信息化武器为主要战争工具和作战手段"}, {"label": "D", "text": "在全维空间内通过精确打击、实时控制、信息攻防等方式进行的瘫痪和震慑作战的战争形态"}], "answer": "ABCD", "explain": "四个选项对信息化战争概念的表述均正确（系统集成信息控制为主导、信息时代、信息化武器、全维空间瘫痪震慑），全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 463, "question": "信息化武器系统中武器的战斗效能有(    )。", "options": [{"label": "A", "text": "火力"}, {"label": "B", "text": "机动力"}, {"label": "C", "text": "突击力和防护力"}, {"label": "D", "text": "电子信息处理能力"}], "answer": "ABCD", "explain": "信息化武器系统的战斗效能包括火力、机动力、突击力和防护力以及电子信息处理能力，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 464, "question": "从信息化武器系统的结构看,主要包括(    )。", "options": [{"label": "A", "text": "信息化智能弹药"}, {"label": "B", "text": "信息化作战平台"}, {"label": "C", "text": "数字化单兵作战系统"}, {"label": "D", "text": "综合军事信息系统"}], "answer": "ABCD", "explain": "信息化武器系统结构主要包括信息化智能弹药、信息化作战平台、数字化单兵作战系统和综合军事信息系统，全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 465, "question": "信息化战争与机械化战争在(    )方面存在较大差别。", "options": [{"label": "A", "text": "作战主导要素"}, {"label": "B", "text": "作战指挥控制"}, {"label": "C", "text": "作战总体效能"}, {"label": "D", "text": "作战监督部署"}], "answer": "ABC", "explain": "信息化与机械化战争在作战主导要素、作战指挥控制和作战总体效能方面存在较大差别，监督部署不属于差别，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 466, "question": "信息化武器装备引起了军队(    )的结构变化。", "options": [{"label": "A", "text": "组织结构"}, {"label": "B", "text": "人员数量"}, {"label": "C", "text": "人员性别比例"}, {"label": "D", "text": "人员素质"}], "answer": "AD", "explain": "信息化武器装备引起军队组织结构和人员素质的结构变化，人员数量和性别比例不属此范畴，故选AD。"}, {"chapter": "信息化武装", "type": "multi", "id": 467, "question": "电子战争的内容(    )。", "options": [{"label": "A", "text": "电子侦察与反侦察"}, {"label": "B", "text": "电子干扰与反干扰"}, {"label": "C", "text": "电子摧毁与反摧毁"}, {"label": "D", "text": "电子辐射与反辐射"}], "answer": "ABC", "explain": "电子战争内容有电子侦察与反侦察、电子干扰与反干扰、电子摧毁与反摧毁，电子辐射与反辐射不属其三，故选ABC。"}, {"chapter": "信息化武装", "type": "multi", "id": 468, "question": "以下属于信息化战争中出现的新的作战方式的有(    )。", "options": [{"label": "A", "text": "运动战"}, {"label": "B", "text": "软杀战"}, {"label": "C", "text": "太空战"}, {"label": "D", "text": "心理战"}], "answer": "BCD", "explain": "信息化战争新作战方式有软杀战、太空战和心理战，运动战是传统作战方式，故选BCD。"}, {"chapter": "信息化武装", "type": "multi", "id": 469, "question": "信息化战争全面形成的标志是(    )。", "options": [{"label": "A", "text": "地面部队的数字化"}, {"label": "B", "text": "高技术局部战争的发生"}, {"label": "C", "text": "海湾战争的爆发"}, {"label": "D", "text": "作战行动方式的非线式一体化"}], "answer": "AD", "explain": "信息化战争全面形成的标志是地面部队数字化和作战行动方式非线式一体化，海湾战争是其雏形，故选AD。"}, {"chapter": "中国国防", "type": "tf", "id": 470, "question": "“小推车推出来的胜利”是指辽沈战役。 （ ）", "answer": false, "explain": "“小推车推出来的胜利”指的是淮海战役而非辽沈战役，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 471, "question": "《反分裂国家法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "在国防法规体系中占统帅地位起核心作用的是《国防法》而非《反分裂国家法》，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 472, "question": "国防是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。 （ ）", "answer": true, "explain": "国防是含军事及与军事相关的政治、经济、外交、科技、文化等活动的行为，该表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 473, "question": "国防的目的是保卫国家的主权、统一、领土完整和安全。（ ）", "answer": true, "explain": "国防的目的正是保卫国家的主权、统一、领土完整和安全，该表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 474, "question": "国防动员的组织体系是由动员决策机构、协调机构、执行机构、监督机构四部分组成。（）", "answer": false, "explain": "国防动员组织体系由动员决策机构、组织协调机构、执行机构和监督机构组成，题目漏了组织协调机构，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 475, "question": "国家的统一，是指国家由一个中央政府对领土内的一切人民和事务行使完整的管辖权，不允许另立政府或分割国家的管辖权。（ ）", "answer": false, "explain": "国家的统一指一个中央政府对领土内的一切居民和事务行使完整管辖权，题目说“一切人民”表述不准确，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 476, "question": "国防的根本目的和任务是保障国家的安全。（ ）", "answer": false, "explain": "国防的根本目的和任务是捍卫国家的主权而非笼统说保障安全，此表述不完整，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 477, "question": "一般情况下，对于武装暴力颠覆活动，由国家公安、安全部门调查和处理，不需要动用国防力最，而非武装暴力颠覆活动，才必须动用国防力量。（）", "answer": false, "explain": "顺序颠倒：一般只有武装暴力颠覆活动才动用国防力量，非武装暴力颠覆由公安安全部门处理，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 478, "question": "中央军事委员会是党和国家的最高军事机关。 （ ）", "answer": true, "explain": "中央军事委员会确实是党和国家的最高军事机关，该表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 479, "question": "《孙膑兵法》继承和发展了《孙子兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": true, "explain": "《孙膑兵法》继承并发展了《孙子兵法》的军事战略思想，是兵家宝书，该表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 480, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学圣典”的《孙子兵法》一书，其作者是春秋时期著名的孙膑。（）", "answer": false, "explain": "“兵者国之大事”出自《孙子兵法》，作者是孙武而非孙膑，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 481, "question": "《国防法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。 （ ）", "answer": true, "explain": "《国防法》在国防法规体系中占统帅地位起核心作用，是其他军事立法的基本法律依据，正确。"}, {"chapter": "中国国防", "type": "tf", "id": 482, "question": "国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及相应制度，是国防体制和国家体制的重要组成部分。（ ）", "answer": true, "explain": "国防领导体制是谋划决策指挥协调国防建设和军事斗争的组织体系及制度，是国家体制重要组成，正确。"}, {"chapter": "中国国防", "type": "tf", "id": 483, "question": "中华人民共和国武装力量是由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及民兵组成。（ ）", "answer": true, "explain": "我国武装力量由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及民兵组成，正确。"}, {"chapter": "中国国防", "type": "tf", "id": 484, "question": "根据我国的社会制度和国家政策，中国的国防类型是扩张型。（ ）", "answer": false, "explain": "我国社会制度和国家政策决定了中国国防类型是自卫型而非扩张型，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 485, "question": "中国人民解放军预备役部队是国家的常备军。 （ ）", "answer": false, "explain": "中国人民解放军现役部队才是国家的常备军，预备役部队不是常备军，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 486, "question": "国防的主体，即国防活动的实施者，通常为军队。（ ）", "answer": false, "explain": "国防的主体是国家和全体人民，而非仅仅军队，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 487, "question": "我国国防动员决策机关是人民代表大会，最高领导机构是国务院、中央军委。 （ ）", "answer": true, "explain": "我国国防动员决策机关是全国人民代表大会，最高领导机构是国务院和中央军委，该说法正确。"}, {"chapter": "中国国防", "type": "tf", "id": 488, "question": "政府是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。（ ）", "answer": false, "explain": "题干所描述的应是国防而非政府，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 489, "question": "国防动员的主要内容中，战争动员的核心是科学技术动员。（ ）", "answer": false, "explain": "战争动员的核心是人民武装力量动员而非科学技术动员，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 490, "question": "国防的主体，即国防活动的实施者，通常为人民。（ ）", "answer": false, "explain": "国防的主体是国家而非人民，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 491, "question": "现代国防既是只是一种国家行为。 （ ）", "answer": false, "explain": "现代国防不仅是国家行为还涉及社会各方面，表述“只是一种国家行为”过于绝对，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 492, "question": "《孙子兵法》继承和发展了《孙胺兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": false, "explain": "是《孙膑兵法》继承发展了《孙子兵法》，题目顺序颠倒且书名写错，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 493, "question": "爱国主义是社会主义核心价值观的首要原则。 （ ）", "answer": true, "explain": "爱国主义是中华民族精神的核心或社会主义核心价值观（公民层面）的重要内容，题干表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 494, "question": "《中华人民共和国国防动员法》由第十一届全国人民代表大会常务委员会第十三次会议于2011年2月26日通过。 （ ）", "answer": false, "explain": "《国防动员法》由十一届全国人大常委会第十三次会议于2010年2月26日通过，年份是2010而非2011，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 495, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学圣典”的《孙子兵法》一书，其作者是春秋时期著名的孙武。（）", "answer": true, "explain": "“兵者国之大事”出自《孙子兵法》，作者是孙武，该表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 496, "question": "《国防教育法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "在国防法规体系中占统帅地位的是《国防法》而非《国防教育法》，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 497, "question": "根据我国的社会制度和国家政策，中国的国防类型是联盟型。（ ）", "answer": false, "explain": "中国国防类型是自卫型而非联盟型，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 498, "question": "现行《国防法》由全国人民代表大会八届五次会议于1997年3月14日通过，并于当日颁布实施。（ ）", "answer": true, "explain": "现行《国防法》由全国人大八届五次会议于1997年3月14日通过并当日颁布实施，正确。"}, {"chapter": "中国国防", "type": "tf", "id": 499, "question": "一般情况下，对于非武装暴力颠覆活动，由国家公安、安全部门调查和处理，不需要动用国防力量，而武装暴力颠覆活动，才必须动用国防力量。（）", "answer": true, "explain": "非武装暴力颠覆由公安安全部门处理不须动用国防力量，武装暴力颠覆才动用国防力量，该说法正确。"}, {"chapter": "中国国防", "type": "tf", "id": 500, "question": "国防动员是指同家为应对战争和突发事件的需要，合理地调动国家可以利用的各种资源，并建立相应的国家动员体制和机制的一系列活动。（ ）", "answer": true, "explain": "国防动员是应对战争和突发事件需要而调动国家资源并建立动员体制机制的系列活动，表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 501, "question": "国防的根本目的和任务是捍卫国家的主权。（ ）", "answer": true, "explain": "国防的根本目的和任务是捍卫国家的主权，此表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 502, "question": "根据我国的社会制度和国家政策，中国的国防类型是联盟型。（ ）", "answer": false, "explain": "中国国防类型是自卫型而非联盟型，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 503, "question": "当代爱国主义的主题就是爱社会主义，维护祖国的统一，齐心协力共建社会主义现代化，实现民族的伟大复兴。（ ）", "answer": true, "explain": "当代爱国主义的主题就是爱社会主义、维护祖国统一、齐心共建社会主义现代化实现民族复兴，表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 504, "question": "国防的主体，即国防活动的实施者，通常为公民。（ ）", "answer": false, "explain": "国防的主体是国家而非公民，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 505, "question": "国防的基本要素包括国防的主体、国防的目的、国防的手段和国防的对象四个方面。（）", "answer": true, "explain": "国防的基本要素包括国防的主体、目的、手段和对象四个方面，表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 506, "question": "国家主席是我国社会主义事业的领导核心。（ ）", "answer": false, "explain": "中国共产党是我国社会主义事业的领导核心，而非国家主席，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 507, "question": "国防动员的主要内容中，战争动员的核心是国民经济动员。（ ）", "answer": false, "explain": "战争动员的核心是人民武装力量动员或国民经济动员都不准确，题目说国民经济动员不属正确核心，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 508, "question": "国家是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。（ ）", "answer": false, "explain": "题干描述的是国防而非国家，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 509, "question": "中华人民共和国武装力量是由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及义务兵组成。（ ）", "answer": false, "explain": "我国武装力量由现役部队、预备役部队、人民武装警察部队及民兵组成，义务兵不是独立组成部分，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 510, "question": "国防的根本目的和任务是保卫国家的统一。（ ）", "answer": false, "explain": "国防的根本目的是保卫国家主权，保卫统一只是其中一方面而非根本目的，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 511, "question": "国家的统一，是指国家由一个中央政府对领土内的一切居民和事务行使完整的管辖权，不允许另立政府或分割国家的管辖权。（ ）", "answer": true, "explain": "国家的统一指一个中央政府对领土内的一切居民和事务行使完整管辖权，表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 512, "question": "现行《国防法》由全国人民代表大会八届五次会议于1998年3月14日通过，并于当日颁布实施。 （ ）", "answer": false, "explain": "现行《国防法》通过年份是1997年而非1998年，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 513, "question": "孙武所著的《孙胺兵法》继承和发展了《孙子兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": false, "explain": "孙膑著的是《孙膑兵法》而非《孙胺兵法》，且是《孙膑兵法》继承发展《孙子兵法》，题目混乱，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 514, "question": "《兵役法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "在国防法规体系中占统帅地位的是《国防法》而非《兵役法》，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 515, "question": "国防的根本目的和任务是保卫国家的领土完整。（ ）", "answer": false, "explain": "国防的根本目的是捍卫国家主权，保卫领土完整只是其中一方面，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 516, "question": "根据我国的社会制度和国家政策，中国的国防类型是中立型。（ ）", "answer": false, "explain": "中国国防类型是自卫型而非中立型，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 517, "question": "国防的基本要素包括国防的性质 、国防的目的、国防的手段和国防的对象四个方面。（）", "answer": false, "explain": "国防的基本要素包括主体、目的、手段和对象，题目把主体误写成性质，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 518, "question": "颠覆是指推翻现政府的一种叛逆行为，包括武装暴力颠覆和非武装暴力颠覆两种形式。 （ ）", "answer": true, "explain": "颠覆是推翻现政府的叛逆行为，包括武装暴力颠覆和非武装暴力颠覆两种形式，表述正确。"}, {"chapter": "中国国防", "type": "tf", "id": 519, "question": "国防的根本目的和任务是保卫国家的统一。（ ）", "answer": false, "explain": "国防的根本目的是捍卫国家主权，保卫统一只是其中一方面而非根本目的，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 520, "question": "不同历史时期的战略， 有着不同的内容和特点， 其决定因素主要有战略思想、战略环境和军事力量。 （ ）", "answer": true, "explain": "不同历史时期战略的内容和特点由战略思想、战略环境和军事力量决定，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 521, "question": "战略思想是国家对待军事斗争特别是战争问题的根本立场和态度，是指导军事斗争的基本观点和理论原则。 （ ）", "answer": true, "explain": "战略思想是国家对待军事斗争特别是战争问题的根本立场态度和指导观点理论原则，表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 522, "question": "战略的基本要素包括战略目的、战略方针、战略力量和战略手段。（ ）", "answer": true, "explain": "战略的基本要素包括战略目的、战略方针、战略力量和战略手段，表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 523, "question": "战略力量是战略的物质基础和支柱。（ ）", "answer": true, "explain": "战略力量是战略的物质基础和支柱，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 524, "question": "战略目的和战略 手段是战略行动的方向、目标、纲领和准则。（ ）", "answer": false, "explain": "战略目的和战略方针才是战略行动的方向目标纲领和准则，题目把方针误写成手段，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 525, "question": "战略即筹划和指导战争全局的方略，是指根据对国际形势和敌对双方政治、军事、外交、科技、地理等诸因素的分析和判断，科学地预测战争的发生与发展，制定作战方针、作战原则和作战计划，筹划战争准备，指导战争实施所遵循的原则和方法。（ ）", "answer": true, "explain": "战略即筹划和指导战争全局的方略，需综合评判诸因素预测战争并制定方针原则，表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 526, "question": "战略是为准备和进行战争而实行的具有全局意义的实行战略的保障，是战略决策机构根据战争的需要，在政治、军事、外交、经济、科学技术和战略  领导与指挥等方面，所采取的各种全局性的切实可行的方法和步骤。 （ ）", "answer": false, "explain": "该题干实为战略措施或战略保障的定义，并非战略定义，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 527, "question": "日傍美制华，并不甘心为美火中取栗。( )", "answer": true, "explain": "日本傍依美国制华但又不甘心为美火中取栗，该判断正确。"}, {"chapter": "国家安全", "type": "tf", "id": 528, "question": "军事斗争情况的发展变化，决定着军事斗争指导规律的发展变化，战略必须随着军事斗争的发展而发展，依照情况的变化而变化，一成不变的战略是不存在的。（ ）", "answer": true, "explain": "军事斗争情况发展变化决定指导规律变化，战略须随其发展变化，一成不变的战略不存在，正确。"}, {"chapter": "国家安全", "type": "tf", "id": 529, "question": "战争是解决阶级和阶级、民族和民族、国家与国家、政治集团和政治集团之间利益矛盾和冲突的最激烈的手段。 （ ）", "answer": true, "explain": "战争是解决各利益主体间矛盾和冲突的最激烈手段，该表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 530, "question": "对于一个国家的主权和安全来说，来自内部的威胁是最严重的威胁。（）", "answer": false, "explain": "对主权安全而言最严重的威胁来自外部而非内部，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 531, "question": "当代世界战争与和平的趋势在国际战略环境中最引人注目，也是世界各国研究和制定军事战略时关注的中心。（ ）", "answer": true, "explain": "战争与和平趋势是国际战略环境中最引人注目的中心问题，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 532, "question": "地理环境不仅是制定战略的重要客观依据，而且是影响战争胜负的重要因素。 （ ）", "answer": true, "explain": "地理环境是制定战略的客观依据也是影响战争胜负的因素，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 533, "question": "在“10+3”机制的带动下，东亚各国在非传统安全领域的合作正不断加强。 （ ）", "answer": true, "explain": "在“10+3”机制带动下东亚各国非传统安全领域合作不断加强，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 534, "question": "“一带一路”不是一个实体和机制，而是合作发展的理念和倡议，是依靠中国与有关国家既有的双多边机制，借助既有的、行之有效的区域合作平台。（）", "answer": true, "explain": "“一带一路”是合作发展的理念和倡议，依靠既有多双边机制和区域合作平台，表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 535, "question": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。 （ ）", "answer": false, "explain": "美国虽视中国为主要潜在对手并防范遏制，但基于反恐朝核台海经贸等共同利益仍寻求与中国合作而非对抗，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 536, "question": "一切军事斗争和军事活动，归根结底都要依靠综合国力，特别是经济、科技和军事实力的支撑，并受其制约 。（ ）", "answer": true, "explain": "一切军事活动和斗争归根结底依靠综合国力尤其经济科技军事实力支撑，该说法正确。"}, {"chapter": "国家安全", "type": "tf", "id": 537, "question": "2014年10月24日，包括中国、印度、新加坡等在内21个首批意向创始成员国的财长和授权代表在北京签约，共同决定成立亚太经合组织。  （ ）", "answer": false, "explain": "2014年10月24日签约成立的是亚洲基础设施投资银行（亚投行）而非亚太经合组织，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 538, "question": "国际战略格局是指国际社会中国际战略力量之间在一定历史时期内相互联系、相互作用而形成的具有全球性的、相对稳定的力量对比结构及基本态势。（）", "answer": true, "explain": "国际战略格局是国际战略力量在一定时期内相互作用形成的全球性相对稳定的力量对比结构，表述正确。"}, {"chapter": "国家安全", "type": "tf", "id": 539, "question": "一个国家或国家集团在国际社会中的行为能力和影响力，固然要取决于多种因索，但军事实力是其中最基本的、长期起作用的决定性因素。 （ ）", "answer": false, "explain": "一个国家在国际社会中最基本长期起作用的决定性因素是经济实力（综合国力）而非军事实力，故错误。"}, {"chapter": "国家安全", "type": "tf", "id": 540, "question": "美国在第二次世界大战后成为资本主义世界的霸主， 重要的原因就是它拥有世界上最强大的经济和军事实力。从历史上看， 国际战略格局的发展变化， 往往以世界经济格局的发展为先导。（ ）", "answer": true, "explain": "正确，美国凭借强大经济军事实力成为战后霸主，经济格局常先导战略格局。"}, {"chapter": "国家安全", "type": "tf", "id": 541, "question": "一定的国际秩序总是由在国际战略格局中居于主导地位的国家或国家集团制定的，或是在很大程度上受到这些国家意志的制约和影响。（ ）", "answer": true, "explain": "正确，国际秩序由主导格局的国家或集团制定，深受其意志制约。"}, {"chapter": "国家安全", "type": "tf", "id": 542, "question": "国际秩序一经建立，它对国际战略格局会起到强制性的维护作用，但在旧格局解体的情况下，原有的国际秩序不会在一定范围和一定程度上继续产生影响。（）", "answer": false, "explain": "错误，旧格局解体后原有国际秩序仍会在一定范围和程度上继续产生影响。"}, {"chapter": "国家安全", "type": "tf", "id": 543, "question": "第二次世界大战以前，国际秩序的本质特征是强权政治和殖民政治。（）", "answer": true, "explain": "正确，二战前国际秩序本质是强权政治和殖民政治。"}, {"chapter": "国家安全", "type": "tf", "id": 544, "question": "国际战略格局按其范围大小，也可以区分为世界格局和地区格局，这两个层次既有其独立性，又有其关联性。 （ ）", "answer": true, "explain": "正确，国际战略格局按范围分为世界格局与地区格局，二者独立又关联。"}, {"chapter": "国家安全", "type": "tf", "id": 545, "question": "真正具有世界意义的国际战略格局是在现代资本主义发展的基础上形成和发展起来的。 （ ）", "answer": false, "explain": "错误，世界意义的国际战略格局是在垄断资本主义基础上形成发展的。"}, {"chapter": "国家安全", "type": "tf", "id": 546, "question": "第二次世界大战后，世界秩序被重新安排，形成了以凡尔赛—华盛顿体系为基础的两极格局。 （ ）", "answer": false, "explain": "错误，两极格局以雅尔塔体系为基础，而非凡尔赛—华盛顿体系。"}, {"chapter": "国家安全", "type": "tf", "id": 547, "question": "苏联解体，使持续了近半个世纪的东西方美苏两大集团之间激烈对抗的冷战格局彻底终结。 （ ）", "answer": true, "explain": "正确，苏联解体彻底终结了美苏东西方冷战对抗格局。"}, {"chapter": "国家安全", "type": "tf", "id": 548, "question": "美国“一超独霸”的局面是两极体制被打破后的一种过渡现象，在这个过渡期内，国际战略格局呈现的基本态势将是“一超多强”，又是一个终将被多极体制所取代的暂时历史进程。（ ）", "answer": true, "explain": "正确，美国一超独霸是过渡现象，呈现一超多强并终将被多极取代。"}, {"chapter": "国家安全", "type": "tf", "id": 549, "question": "亚太经合组织是当今世界上规模最大、一体化程度最高的地区经济集团，具有雄厚的经济、科技和军事实力。（ ）", "answer": false, "explain": "错误，一体化程度最高的地区集团是欧盟，而非亚太经合组织。"}, {"chapter": "国家安全", "type": "tf", "id": 550, "question": "江泽民早在1990年初就曾指出：“所谓多极，中国算一极，中国不要贬低自己，怎么样也算一极。”（   ）", "answer": false, "explain": "错误，这句多极化名言是邓小平所说，而非江泽民。"}, {"chapter": "国家安全", "type": "tf", "id": 551, "question": "世界将在地缘上分为欧洲、原苏联地区、亚太、中东、拉美和非洲等六大军事区域，形成各具特色的地区军事格局。 （ ）", "answer": true, "explain": "正确，世界分欧洲、原苏联、亚太、中东、拉美、非洲六大军事区域。"}, {"chapter": "国家安全", "type": "tf", "id": 552, "question": "东盟各国的“东盟地区论坛”已成为亚太地区第一个政府间的多边安全对话机制。 （ ）", "answer": true, "explain": "正确，东盟地区论坛是亚太最早的政府间多边安全对话机制。"}, {"chapter": "国家安全", "type": "tf", "id": 553, "question": "上海合作组织把打击三股势力、维护地区安全与稳定作为首要任务，近年来还逐步加强合作打击中亚地区日益严重的毒品走私活动，把遏制和铲除毒品走私纳入反恐合作的框架之中。（ ）", "answer": true, "explain": "正确，上合组织以打击三股势力、维护安全稳定为首要任务并纳入反毒。"}, {"chapter": "国家安全", "type": "tf", "id": 554, "question": "美国的“新干涉主义” 和战略扩张成为国际局势动荡的根源。（ ）", "answer": true, "explain": "正确，美国新干涉主义与战略扩张是国际局势动荡的根源。"}, {"chapter": "国家安全", "type": "tf", "id": 555, "question": "总体稳定是世界形势的主流。 （ ）", "answer": true, "explain": "正确，总体稳定是世界形势的主流。"}, {"chapter": "国家安全", "type": "tf", "id": 556, "question": "两极世界解体后，全球性的军事对抗已不复存在，爆发世界大战的可能性越来越小。 （）", "answer": true, "explain": "正确，两极解体后全球军事对抗不复存在，世界大战可能性减小。"}, {"chapter": "国家安全", "type": "tf", "id": 557, "question": "金融安全在国家经济安全乃至整个国家安全中的战略地位空前上升， 并相对军事安全而言成为当代国家安全斗争的又一主战场。 （ ）", "answer": true, "explain": "正确，金融安全战略地位空前上升，成为国家安全斗争又一主战场。"}, {"chapter": "国家安全", "type": "tf", "id": 558, "question": "共建“一带一路”致力于亚欧非大陆及附近海洋的互联互通，建立和加强沿线各国互联互通伙伴关系，构建全方位、多层次、复合型的互联互通网络，实现沿线各国多元、自主、平衡、可持续的发展。 （ ）", "answer": true, "explain": "正确，一带一路致力于亚欧非互联互通，构建全方位复合型网络。"}, {"chapter": "国家安全", "type": "tf", "id": 559, "question": "我国是世界上拥有邻国最多的国家。 （ ）", "answer": true, "explain": "正确，我国是世界上邻国最多的国家。"}, {"chapter": "国家安全", "type": "tf", "id": 560, "question": "中国周边地区也是世界上大国最集中的地区，且多为军事强国。 （ ）", "answer": true, "explain": "正确，中国周边是世界上大国最集中的地区，且多为军事强国。"}, {"chapter": "国家安全", "type": "tf", "id": 561, "question": "从地缘政治的角度看，美国也是中国的邻国，因为它在中国周边有强大的力量存在和战略影响。 （ ）", "answer": true, "explain": "正确，由于美国在中国周边有强大力量存在，地缘上也是中国邻国。"}, {"chapter": "国家安全", "type": "tf", "id": 562, "question": "台湾海峡是连接太平洋和印度洋的海上交通咽喉，扼控两洋航线的枢纽，是亚太各国经贸发展的“生命阀”。 （ ）", "answer": false, "explain": "错误，连接太平洋和印度洋的咽喉是马六甲海峡，而非台湾海峡。"}, {"chapter": "国家安全", "type": "tf", "id": 563, "question": "当今世界五大热点地区：中东波斯湾、中亚、南亚次大陆、台湾海峡、朝鲜半岛，几乎都在中国周边。 （ ）", "answer": true, "explain": "正确，五大热点地区中东、中亚、南亚、台海、朝鲜半岛几乎都环绕中国。"}, {"chapter": "国家安全", "type": "tf", "id": 564, "question": "为打破美、前苏两个超级大国对我国实施的战略包围，我国先后采取了一系列重大战略性举措。从抗美援朝、中印边境自卫反击战、援越抗美斗争到中越边境自卫还击作战等，有力地打击了霸权主义行径。 （ ）", "answer": true, "explain": "正确，抗美援朝、中印边境反击战等打破了美苏对我国的战略包围。"}, {"chapter": "国家安全", "type": "tf", "id": 565, "question": "新中国成立到20世纪60年代，对我国独立和安全的威胁主要来自美国。美国不甘心在中国内地的失败，长期推行政治上孤立、经济上封锁、军事上威胁的反华、仇华政策。（ ）", "answer": true, "explain": "正确，建国至60年代我国安全威胁主要来自推行反华仇华政策的美国。"}, {"chapter": "国家安全", "type": "tf", "id": 566, "question": "钓鱼诸岛自古以来一直是中国领土不可分割的部分。 （ ）", "answer": true, "explain": "正确，钓鱼诸岛自古以来就是中国领土不可分割的部分。"}, {"chapter": "国家安全", "type": "tf", "id": 567, "question": "2009年至今，中国海监执法船、中国海警巡航编队多次开赴钓鱼岛，既是依法行使对中国领土钓鱼岛及其附近海域的巡航执法，也是中国行使对钓鱼岛主权的具体体现。 （ ）", "answer": true, "explain": "正确，中国海监海警巡航钓鱼岛是依法维权、行使主权的具体体现。"}, {"chapter": "国家安全", "type": "tf", "id": 568, "question": "南海是我国同东南亚各国交往的重要纽带，南沙群岛是拱卫我国南大门的第一道海上战略屏障，也是保卫海上通道安全的前沿阵地。 （ ）", "answer": true, "explain": "正确，南沙群岛是拱卫南大门的第一道海上战略屏障和前沿阵地。"}, {"chapter": "国家安全", "type": "tf", "id": 569, "question": "国际恐怖势力在中国周边的频繁滋事，恶化了中国周边环境，直接危害着中国国家安全。 （ ）", "answer": true, "explain": "正确，国际恐怖势力在中国周边滋事，直接危害我国国家安全。"}, {"chapter": "军事思想", "type": "tf", "id": 570, "question": "军事思想具有鲜明的阶级性、强烈的时代感、丰富的实践性和明显的继承性。 （ ）", "answer": true, "explain": "正确，军事思想具有阶级性、时代感、实践性和继承性四大特征。"}, {"chapter": "军事思想", "type": "tf", "id": 571, "question": "军事思想来源于人类的军事实践，同时又给人类的军事实践以理论指导。（）", "answer": true, "explain": "正确，军事思想来源于军事实践又反过来指导军事实践。"}, {"chapter": "军事思想", "type": "tf", "id": 572, "question": "军事思想来源于社会实践，在阶级社会中，人们为了各自阶级的利益，所奉行和推崇的军事思想，必然反映各个阶级对战争和军队建设的认识和立场。因此军事思想具有强烈的时代感。（）", "answer": false, "explain": "错误，反映阶级立场体现的是阶级性，而非时代感。"}, {"chapter": "军事思想", "type": "tf", "id": 573, "question": "军事思想是一个历史范畴，不同历史时期的战争有着不同的形态和战略战术，有着不同的军队组织原则和编制，军事思想随着人类社会的发展而不断演变。因此军事思想具有强烈的时代感。 （ ）", "answer": true, "explain": "正确，军事思想随社会发展和战争形态演变，具有强烈的时代感。"}, {"chapter": "军事思想", "type": "tf", "id": 574, "question": "军事思想是由军事实践产生，受军事实践的检验，随着军事实践的发展而发展，任何军事思想都是对战争实践的经验总结和升华。因此军事思想具有明显的继承性。 （ ）", "answer": false, "explain": "错误，军事思想随实践发展体现的是实践性，而非继承性。"}, {"chapter": "军事思想", "type": "tf", "id": 575, "question": "军事理论的继承和发展都离不开对以往军事思想的扬弃，是人们对以往的军事实践认识成果中正确理论的继承和发展。因此军事思想具有明显的继承性。（）", "answer": true, "explain": "正确，军事思想的继承发展离不开对以往思想的扬弃，具有继承性。"}, {"chapter": "军事思想", "type": "tf", "id": 576, "question": "一般认为我国古代军事思想的初步形成于夏商周时期（）", "answer": true, "explain": "正确，我国古代军事思想初步形成于夏商周时期。"}, {"chapter": "军事思想", "type": "tf", "id": 577, "question": "一般认为我国古代军事思想在春秋战国时期进入系统化、体系化阶段。（）", "answer": false, "explain": "错误，古代军事思想在春秋战国时期成熟定型，而非系统化阶段。"}, {"chapter": "军事思想", "type": "tf", "id": 578, "question": "宋神宗时期，把《孙子兵法》《孙胺兵法》、《六韬》、《黄石公三略》、《尉缭子》、《司马法》、《李卫公问对》等七部兵书作为武学必修课程，统称《武经七书》。（ ）", "answer": false, "explain": "错误，《武经七书》含《孙子》《吴子》而非《孙膑兵法》，共七部。"}, {"chapter": "军事思想", "type": "tf", "id": 579, "question": "毛泽东在人民战争的战略战术思想中提出，战争以歼灭敌人有生力量作为作战的主要目标，不以保守或夺取城市和地方为主要目标。（ ）", "answer": true, "explain": "正确，毛泽东主张以歼灭敌人有生力量为目标，不以保守城市为主。"}, {"chapter": "军事思想", "type": "tf", "id": 580, "question": "江泽民提出“部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力”。 ( )", "answer": true, "explain": "正确，江泽民提出政治合格、军事过硬、作风优良、纪律严明、保障有力。"}, {"chapter": "军事思想", "type": "tf", "id": 581, "question": "胡锦涛提出“我们必须统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会进程中实现富国和强军的统一”。 ( )", "answer": true, "explain": "正确，胡锦涛提出走军民融合式发展路子，实现富国和强军相统一。"}, {"chapter": "军事思想", "type": "tf", "id": 582, "question": "中国第一部军事地理学专著是《武经总要》。（ ）", "answer": false, "explain": "错误，中国第一部军事地理学专著是《读史方舆纪要》而非《武经总要》。"}, {"chapter": "军事思想", "type": "tf", "id": 583, "question": "与中国古代军事思想相比，世界古代军事思想起步较晚，反映了该时期军事思想的著作有《伯罗奔尼撒战争史》、《希腊波斯战争史》、《罗马军制》、《长征记》等。 （ ）", "answer": true, "explain": "正确，世界古代军事思想起步较晚，代表著作如《伯罗奔尼撒战争史》等。"}, {"chapter": "军事思想", "type": "tf", "id": 584, "question": "近代无产阶级军事思想的代表人物是拿破仑、马克思、恩格斯、列宁。（）", "answer": false, "explain": "错误，拿破仑不是无产阶级军事思想家，其代表人物是马克思恩格斯列宁等。"}, {"chapter": "军事思想", "type": "tf", "id": 585, "question": "反映了近代无产阶级军事思想的著作有《共产党宣言》、《德国农民战争》、《法兰西内战》、《战争艺术概论》等。 （ ）", "answer": false, "explain": "错误，《战争艺术概论》是资产阶级军事思想著作，不属于无产阶级著作。"}, {"chapter": "军事思想", "type": "tf", "id": 586, "question": "马克思主义军事理论的诞生，为人们研究和解决军事领域的问题提供了科学的基本观点和方法，为无产阶级军事思想的发展奠定了坚实的理论基础。（）", "answer": true, "explain": "正确，马克思主义军事理论为研究军事问题和无产阶级军事思想奠定基础。"}, {"chapter": "军事思想", "type": "tf", "id": 587, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论战 争本质观的战争本质的观点。（ ）", "answer": true, "explain": "正确，这些论断从多角度揭示战争本质，体现中国古代战争本质观。"}, {"chapter": "军事思想", "type": "tf", "id": 588, "question": "认为战争并不是自有人类以来就有的 ， 战争是人类社会发展到一定历史阶段的产物。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。（）", "answer": true, "explain": "正确，认为战争是阶级社会产物，体现中国古代战争的起源观点。"}, {"chapter": "军事思想", "type": "tf", "id": 589, "question": "“人口论”认为，古时候人少、财物多，所以没有争斗和战争，后来人口不断增多，社会财富相对减少，人们为了争夺生存条件就发生了战争。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。 （ ）", "answer": false, "explain": "错误，人口论反映对战争来源的朴素认识，属战争起源观中的一种，但题述对应有误。"}, {"chapter": "军事思想", "type": "tf", "id": 590, "question": "对待战争的态度中，“偃兵废武论”认为兵是凶器，争是逆德，因此主张“偃武修文”，实行文治。 （ ）", "answer": true, "explain": "正确，偃兵废武论主张兵为凶器，应偃武修文实行文治。"}, {"chapter": "军事思想", "type": "tf", "id": 591, "question": "习近平提出“实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。可以说，这个梦想是强国梦，对军队来说，也是强军梦。我们要实现中华民族伟大复兴，必须坚持富国和强军相统一，努力建设巩固国防和强大军队。”（）", "answer": true, "explain": "正确，习近平提出强国梦也是强军梦，必须坚持富国和强军相统一。"}, {"chapter": "军事思想", "type": "tf", "id": 592, "question": "对待战争的态度中，“义兵慎战论”认为战争并不是绝对的坏事，对战争要具体分析，明确表明要支持正义战争，反对非正义战争。 （ ）", "answer": true, "explain": "正确，义兵慎战论主张具体分析战争，支持正义战争反对非正义战争。"}, {"chapter": "军事思想", "type": "tf", "id": 593, "question": "明太祖在《谕将帅》中提出“发兵为诛暴，诛暴为保民”，“诛暴保民论”体现了中国古代军事思想中战争论的战争和平观。 （ ）", "answer": true, "explain": "正确，明太祖诛暴保民论体现中国古代战争论的战争正义观。"}, {"chapter": "军事思想", "type": "tf", "id": 594, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论的战争本质观。 （ ）", "answer": true, "explain": "正确，该论断揭示战争的政治、诡道等多重属性，体现战争本质观。"}, {"chapter": "军事思想", "type": "tf", "id": 595, "question": "《孙膑兵法》中提出“富国”是“强兵之急＂，这体现了中国古代军事思想中战争论的战争政治观。 （ ）", "answer": false, "explain": "错误，富国强兵反映的是经济与军事关系，属战争经济观而非政治观。"}, {"chapter": "军事思想", "type": "tf", "id": 596, "question": "《淮南子》中指出“兵之胜败，本在于政”，这体现了中国古代军事思想中战争论的战争和平观。 （ ）", "answer": false, "explain": "错误，兵之胜败在于政体现战争的政治观，而非和平观。"}, {"chapter": "军事思想", "type": "tf", "id": 597, "question": "邓小平根据现代战争的特点和规律，结合我国的实际情况，提出了“现代条件下人民战争”的思想。 （ ）", "answer": true, "explain": "正确，邓小平结合现代战争特点提出了现代条件下人民战争思想。"}, {"chapter": "军事思想", "type": "tf", "id": 598, "question": "《孙子兵法》中强调“上兵伐谋，其次伐交”，这体现了中国古代军事思想战备论中战备的内容是外交上备战。 （ ）", "answer": true, "explain": "正确，上兵伐谋其次伐交体现战备内容中之外交备战。"}, {"chapter": "军事思想", "type": "tf", "id": 599, "question": "“寓兵于政”、“寓兵于农”、“寓兵于刑”、“寓兵于乐”，强调要注意备战的相称性原则。（ ）", "answer": false, "explain": "错误，寓兵于政农刑乐强调寓兵于民的整体性，而非相称性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 600, "question": "我国古代的军事家、政治家认为战备的最 高标准和目标，就是在政治、经济、军事、技术等各有关决定战争胜负的诸因素方面，相对于敌人来说都要占有绝对优势。这体现了备战的整体性原则。（ ）", "answer": false, "explain": "错误，在各因素上占绝对优势体现备战的整体性原则，非题述谬误。"}, {"chapter": "军事思想", "type": "tf", "id": 601, "question": "“耕战并重”强调了备战的超前性原则。 （ ）", "answer": false, "explain": "错误，耕战并重体现的是备战的平战结合原则，而非超前性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 602, "question": "“有民则有兵，无民而兵不可为也”，这体现了中国古代军事思想中治军论的“军以民为本”。( )", "answer": true, "explain": "正确，有民则有兵体现治军论中军以民为本思想。"}, {"chapter": "军事思想", "type": "tf", "id": 603, "question": "《孙子兵法》中提出“治众如治寡，分数是也”，这体现了中国古代军事思想中治军论的“凡兵，制必先定”。 ( )", "answer": true, "explain": "正确，治众如治寡分数是体现治军论中凡兵制必先定的编制思想。"}, {"chapter": "军事思想", "type": "tf", "id": 604, "question": "戚继光的《纪效新书》中指出“有精器而无精兵以用之，是谓徒费；有精兵而无精器，是谓徒强”，这体现了中国古代军事思想中治军论的“凡胜，备必先具”。 ( )", "answer": true, "explain": "正确，精器精兵相互配合体现治军论中凡胜备必先具思想。"}, {"chapter": "军事思想", "type": "tf", "id": 605, "question": "诸葛亮强调“夫用兵之道，必定其谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （ ）", "answer": true, "explain": "正确，诸葛亮强调用兵必先定谋，体现先谋为本思想。"}, {"chapter": "军事思想", "type": "tf", "id": 606, "question": "岳飞讲“勇不足恃，用兵在先定谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （ ）", "answer": true, "explain": "正确，岳飞讲勇不足恃用兵在先定谋，体现先谋为本思想。"}, {"chapter": "军事思想", "type": "tf", "id": 607, "question": "邓小平运用辩证唯物主义和历史唯物主义的原理， 研究指导中国革命战争，创造性地提出了“军事辩证法”这一概念。 （ ）", "answer": false, "explain": "错误，军事辩证法概念是毛泽东运用唯物辩证法提出的，而非邓小平。"}, {"chapter": "军事思想", "type": "tf", "id": 608, "question": "孙武指出“兵贵胜，不贵久”， 这体现了中国古代军事思想中用兵论的“兵之情主速”的观点。（ ）", "answer": true, "explain": "正确，兵贵胜不贵久体现兵之情主速的速胜思想。"}, {"chapter": "军事思想", "type": "tf", "id": 609, "question": "《太白阴经》强调“道贵制人，不贵制于人；制人者握权，制于人者遵命也”，这体现了中国古代军事思想中用兵论的“致人而不致于人”的观点。（）", "answer": true, "explain": "正确，道贵制人不制于人体现致人而不致于人思想。"}, {"chapter": "军事思想", "type": "tf", "id": 610, "question": "岳飞讲“运用之妙，存乎一心”，这体现了中国古代军事思想中用兵论的“因机立胜”的观点。 （ ）", "answer": true, "explain": "正确，运用之妙存乎一心体现因机立胜的灵活用兵思想。"}, {"chapter": "军事思想", "type": "tf", "id": 611, "question": "《孙子兵法》中提出“兵形象水，水因地而制流，兵因敌而制胜”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。（ ）", "answer": false, "explain": "错误，兵形象水因敌制胜体现因敌制胜的灵活思想，而非先谋为本。"}, {"chapter": "军事思想", "type": "tf", "id": 612, "question": "《尉缭子》中认为“权先加人者，兵敌不力交；武先加人者，敌无威接”，这体现了中国古代军事思想中用兵论的“先胜而后求战”的观点。（ ）", "answer": false, "explain": "错误，权先加人体现致人而不致于人，而非先胜而后求战。"}, {"chapter": "军事思想", "type": "tf", "id": 613, "question": "遵义会议后， 确定了以毛泽东为首的党中央领导集体。（）", "answer": true, "explain": "正确，遵义会议确立了以毛泽东为核心的党中央领导集体。"}, {"chapter": "军事思想", "type": "tf", "id": 614, "question": "帝国主义和霸权主义是现代战争的根源。 （ ）", "answer": true, "explain": "正确，帝国主义和霸权主义是现代战争的根源。"}, {"chapter": "军事思想", "type": "tf", "id": 615, "question": "司马光主张“才者，德之资也；德者，才之帅也”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （ ）", "answer": true, "explain": "正确，司马光德才兼备观点体现将帅选拔任用的全面性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 616, "question": "《鬼谷子》中提出“智者不用其所短，而用愚人之所长；不用其所拙，而用愚人之所丁”，这体现了中国古代军事思想中将帅选拔任用的优化性原则。 （ ）", "answer": true, "explain": "正确，鬼谷子扬长避短用人思想体现将帅选拔的优化性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 617, "question": "《吕氏春秋》指出“以人之小恶，亡人之大美，此人主之所以失天下之士也”，这体现了中国古代军事思想中将帅选拔任用的开放性原则。 （ ）", "answer": false, "explain": "错误，不以小恶忘大美体现将帅选拔的开明宽容，而非开放性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 618, "question": "《汉书》中提出“论大功者不录小过，举大美者不庇疵细瑕”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （ ）", "answer": false, "explain": "错误，不录小过举大美体现不因小疵掩大才，非全面性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 619, "question": "《孙子兵法》是中国现存最早的兵书，也是世界上最早的军事著作， 被誉为“兵学圣典”。 ( )", "answer": true, "explain": "正确，孙子兵法是中国现存最早兵书，被誉为兵学圣典。"}, {"chapter": "现代理论", "type": "tf", "id": 620, "question": "信息是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （ ）", "answer": true, "explain": "正确，信息是消息指令数据符号所包含的内容和事物状态的普遍形式。"}, {"chapter": "现代理论", "type": "tf", "id": 621, "question": "信息化是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （ ）", "answer": true, "explain": "正确，信息化是发展以计算机为主的智能化工具并使造福社会的历史过程。"}, {"chapter": "现代理论", "type": "tf", "id": 622, "question": "信息化战争是指发生在信息时代，以信息为基础并以信息化武器装备为主要战争工具和作战手段，以系统集成和信息控制为主导，在全维空间内通过精确打击、实时控制、信息攻防等方式进行的瘫痪和震慑作战。 （ ）", "answer": true, "explain": "正确，信息化战争以信息为基础、信息化武器为主要工具进行全维作战。"}, {"chapter": "现代理论", "type": "tf", "id": 623, "question": "最早提出信息战概念的人是钱学森。（ ）", "answer": false, "explain": "错误，最早提出信息战概念的中国人是沈伟光，而非钱学森。"}, {"chapter": "现代理论", "type": "tf", "id": 624, "question": "信息具有可量度、可识别、可转换、可储存、可处理、可传递、可再生、可压缩、实效性、可共享等特征。 （ ）", "answer": true, "explain": "正确，信息具有可量度可识别可转换可储存可传递可共享等特征。"}, {"chapter": "现代理论", "type": "tf", "id": 625, "question": "在信息化战争中，除进行物质力量的较量之外，更主要的是知识的较量，即创新能力和创新速度的竞赛，知识成为战争毁灭力的主要来源。（ ）", "answer": true, "explain": "正确，信息化战争主要是知识较量，知识成为战争毁伤力的主要来源。"}, {"chapter": "现代理论", "type": "tf", "id": 626, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第四次浪潮战争”。 ( )", "answer": false, "explain": "错误，托夫勒称信息化战争为第三次浪潮战争，而非第四次。"}, {"chapter": "现代理论", "type": "tf", "id": 627, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“非接触战争”。 ( )", "answer": true, "explain": "正确，斯里普琴科从武器装备角度称信息化战争为非接触战争。"}, {"chapter": "现代理论", "type": "tf", "id": 628, "question": "中国著名的军事理论家孙武，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。 （ ）", "answer": true, "explain": "正确，孙子不战而屈人之兵正是信息战的核心宗旨。"}, {"chapter": "现代理论", "type": "tf", "id": 629, "question": "首次利用空中卫星进行战场侦察的战争是第三次中东战争。（ ）", "answer": false, "explain": "错误，首次用空中卫星进行战场侦察的是第四次中东战争。"}, {"chapter": "现代理论", "type": "tf", "id": 630, "question": "马岛战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（ ）", "answer": true, "explain": "错误，大规模集中使用制导武器的是第四次中东战争，而非马岛战争。"}, {"chapter": "现代理论", "type": "tf", "id": 631, "question": "海湾战争中，英军还以“竞技神”号、“无敌”号航空母舰上的电子干扰系统和“鹄”式直升机上的机载干扰系统，对阿军的袭击兵器和指挥控制系统实施了电磁干扰与压制。 （ ）", "answer": false, "explain": "错误，用航母电子干扰的是英军在马岛战争，而非海湾战争。"}, {"chapter": "现代理论", "type": "tf", "id": 632, "question": "朝鲜战争中，美国军队依靠优势空中力量进行长时间”地毯式轰炸”的空袭作战，以及直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。（）", "answer": false, "explain": "错误，地毯式空袭配合蛙跳袭击的是越南战争，而非朝鲜战争。"}, {"chapter": "现代理论", "type": "tf", "id": 633, "question": "高技术战争的萌芽阶段中，具有代表性的战争是朝鲜战争和越南战争。（）", "answer": true, "explain": "正确，高技术战争萌芽阶段代表战争是朝鲜战争和越南战争。"}, {"chapter": "现代理论", "type": "tf", "id": 634, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是第四次中东战争和海湾战争。 （ ）", "answer": false, "explain": "错误，高技术战争初期和发展阶段代表是第四次中东战争和马岛战争。"}, {"chapter": "现代理论", "type": "tf", "id": 635, "question": "标志着高技术战争的发展进入成熟阶段的是科索沃战争。 （）", "answer": false, "explain": "错误，标志高技术战争成熟的是海湾战争，而非科索沃战争。"}, {"chapter": "现代理论", "type": "tf", "id": 636, "question": "海湾战争中的通信系统建设 被称为“军事史上一次最大的通信系统专项工程。（ ）", "answer": true, "explain": "正确，海湾战争通信系统建设被称为军事史上最大通信系统工程。"}, {"chapter": "现代理论", "type": "tf", "id": 637, "question": "马岛战争中，开创了“爱国者 ” 导弹成功拦截“飞毛腿” 导弹的先例。（）", "answer": false, "explain": "错误，爱国者拦截飞毛腿是海湾战争的先例，而非马岛战争。"}, {"chapter": "现代理论", "type": "tf", "id": 638, "question": "信息化战争的雏形阶段中，典型的是美军先后发起的科索沃战争、阿富汗战争及伊拉克战争。（ ）", "answer": true, "explain": "正确，信息化战争雏形代表是科索沃阿富汉伊拉克战争。"}, {"chapter": "现代理论", "type": "tf", "id": 639, "question": "信息化战争是以信息的获取权、控制权和使用权为核心进行的争夺。（）", "answer": true, "explain": "正确，信息化战争以信息获取权控制权使用权为核心争夺。"}, {"chapter": "现代理论", "type": "tf", "id": 640, "question": "现代战争的作战样式可以表现为阵地战、运动战、游击战、闪击战、持久战等各种作战样式。 （ ）", "answer": true, "explain": "正确，现代战争样式有阵地战运动战游击战闪击战持久战等。"}, {"chapter": "现代理论", "type": "tf", "id": 641, "question": "我国第一款自主研制的预警机是空警-2001。 ()", "answer": false, "explain": "错误，我国第一款自主研制预警机是空警-2000，而非空警-2001。"}, {"chapter": "现代理论", "type": "tf", "id": 642, "question": "空警-2000预警机创造了世界预警机发展史上的9个第一，突破100余项关键技术，累 计获得重大专利近30项，是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。（ ）", "answer": true, "explain": "正确，空警-2000创造世界预警机发展九个第一，突破百余项技术。"}, {"chapter": "现代理论", "type": "tf", "id": 643, "question": "战争潜力削弱战是综合运用硬摧毁与软杀伤的手段，削弱对方为战争服务或使用的人力、物力、科学技术和精神等诸多因素构成的潜在的战争力量，破坏对方将战争潜力转为战争实力的转换机制，动摇对方的战争基础，使对方无法继续进行战争， 从而达到迅速战胜对方的目的。（ ）", "answer": true, "explain": "正确，战争潜力削弱战软硬结合削弱对方潜在战争力量以迅速制胜。"}, {"chapter": "现代理论", "type": "tf", "id": 644, "question": "战争结构破坏战是以破坏和瘫痪敌战场认识系统、信息处理系统和指挥控制系统为主要作战目标，综合运用以信息技术为核心的武器装备、作战系统和作战手段，剥夺敌战场信息获取权、控制权和使用权，使敌决策者和指挥机关难以下定决心和进行有效的作战指挥。（）", "answer": false, "explain": "错误，该定义描述的是信息控制战，而非战争结构破坏战。"}, {"chapter": "现代理论", "type": "tf", "id": 645, "question": "指挥中枢瘫痪战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。（）", "answer": false, "explain": "错误，题述设谋用巧破坏作战结构的是战争结构破坏战，非指挥中枢瘫痪战。"}, {"chapter": "现代理论", "type": "tf", "id": 646, "question": "心理系统瓦解战以改变个体和群体心理状态为目标，运用各种形态的信息媒介，从认识、情绪和意志上打击瓦解敌人的一种作战样式。 （ ）", "answer": true, "explain": "正确，心理系统瓦解战以信息媒介打击瓦解敌人心理状态。"}, {"chapter": "现代理论", "type": "tf", "id": 647, "question": "信息时代的信息化战争则是在陆地、海洋、空中、太空、电磁、网络、心理等多维空间内进行的一体化作战。（ ）", "answer": true, "explain": "正确，信息化战争在陆海空天电磁网络心理多维空间一体化作战。"}, {"chapter": "现代理论", "type": "tf", "id": 648, "question": "在网络化的战场上，发现目标、作出决策、下达命令和实施作战行动等环节不是实时同步进行的。 （ ）", "answer": false, "explain": "错误，网络化战场发现决策下令与行动是实时同步进行的。"}, {"chapter": "现代理论", "type": "tf", "id": 649, "question": "随着计算机、电子通信、卫星技术和信息化武器装备的发展，信息化战争的作战节奏和作战速度将比机械化战争大大提高，持续时间明显缩短，呈现出迅疾短促的特征。 （ ）", "answer": true, "explain": "正确，信息化战争节奏与速度大增持续缩短，呈现迅疾短促特征。"}, {"chapter": "现代理论", "type": "tf", "id": 650, "question": "信息化战争中，物资、能源的地位更为突出，是主要的战略资源。 （ ）", "answer": false, "explain": "错误，信息化战争中信息是主要战略资源，而非物资能源。"}, {"chapter": "现代理论", "type": "tf", "id": 651, "question": "在信息化战争以前的战争中，信息资源处于首要的位置，成为最重要的战略资源。（）", "answer": false, "explain": "错误，信息化战争以前信息资源并非首要，信息化战争中才成为首要战略资源。"}, {"chapter": "现代理论", "type": "tf", "id": 652, "question": "精确战的实施依赖于透明度很高的战场。（ ）", "answer": true, "explain": "正确，精确战的实施依赖高透明度的战场。"}, {"chapter": "现代理论", "type": "tf", "id": 653, "question": "没有高素质的军人，既打不赢机械化战争，更打不赢信息化战争。 （ ）", "answer": true, "explain": "正确，没有高素质军人就打不赢机械化更打不赢信息化战争。"}, {"chapter": "现代理论", "type": "tf", "id": 654, "question": "信息技术发展越快，信息化战争的经济科技依赖性越弱。（ ）", "answer": false, "explain": "错误，信息技术越发展信息化战争对经济科技的依赖性越强。"}, {"chapter": "现代理论", "type": "tf", "id": 655, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第五代战争”。 ( )", "answer": false, "explain": "错误，斯里普琴科将其称为第六代战争，而非第五代战争。"}, {"chapter": "现代理论", "type": "tf", "id": 656, "question": "中国著名的军事理论家孙子，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。（ ）", "answer": true, "explain": "正确，孙子不战而屈人之兵是信息战的核心和宗旨。"}, {"chapter": "现代理论", "type": "tf", "id": 657, "question": "首次利用空中卫星进行战场侦察的战争是第四次中东战争。（ ）", "answer": true, "explain": "正确，首次利用空中卫星侦察的战争是第四次中东战争。"}, {"chapter": "现代理论", "type": "tf", "id": 658, "question": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（ ）", "answer": false, "explain": "错误，大规模使用制导武器是第四次中东战争，但题述17种属第四次而非马岛。"}, {"chapter": "现代理论", "type": "tf", "id": 659, "question": "标志着高技术战争的发展进入成熟阶段的是海湾战争。 （ ）", "answer": true, "explain": "正确，海湾战争标志着高技术战争发展进入成熟阶段。"}, {"chapter": "现代理论", "type": "tf", "id": 660, "question": "科索沃战争中的通信系统建设被称为“军事史上一次最大的通信系统专项工程”。()", "answer": false, "explain": "错误，最大通信系统工程是海湾战争，而非科索沃战争。"}, {"chapter": "现代理论", "type": "tf", "id": 661, "question": "越南战争中，开创了“爱国者”导弹成功拦截“飞毛腿”导弹的先例。( )", "answer": false, "explain": "错误，爱国者拦截飞毛腿是海湾战争先例，而非越南战争。"}, {"chapter": "现代理论", "type": "tf", "id": 662, "question": "信息化是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （ ）", "answer": false, "explain": "错误，该定义描述的是信息的含义，而非信息化。"}, {"chapter": "现代理论", "type": "tf", "id": 663, "question": "信息是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （ ）", "answer": false, "explain": "错误，该定义描述的是信息化含义，而非信息。"}, {"chapter": "现代理论", "type": "tf", "id": 664, "question": "最早提出信息战概念的人是中国人沈伟光。（ ）", "answer": true, "explain": "正确，最早提出信息战概念的中国人是沈伟光。"}, {"chapter": "现代理论", "type": "tf", "id": 665, "question": "信息主要由信源、语言、载体、信道、信宿和媒介构成。（ ）", "answer": true, "explain": "正确，信息由信源载体信道信宿和媒介等要素构成。"}, {"chapter": "现代理论", "type": "tf", "id": 666, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第三次浪潮战争”。 ( )", "answer": true, "explain": "正确，托夫勒从文明演进角度称信息化战争为第三次浪潮战争。"}, {"chapter": "现代理论", "type": "tf", "id": 667, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第六代战争”。 ( )", "answer": true, "explain": "正确，斯里普琴科从武器装备角度称信息化战争为第六代战争。"}, {"chapter": "现代理论", "type": "tf", "id": 668, "question": "战争结构破坏战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。 （ ）", "answer": true, "explain": "正确，战争结构破坏战着眼设谋用巧破坏敌方作战结构各个击破。"}, {"chapter": "现代理论", "type": "tf", "id": 669, "question": "首次利用空中卫星进行战场侦察的战争是越南战争。（ ）", "answer": false, "explain": "错误，首次用卫星侦察是第四次中东战争，而非越南战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 670, "question": "当战争进入信息化时代后,信息化武器系统也必然成为战争新的主流器。(   )", "answer": true, "explain": "正确，信息化战争中信息化武器系统成为新的主流武器。"}, {"chapter": "信息化武装", "type": "tf", "id": 671, "question": "以信息技术为代表的科学技术的发展是信息化战争形成的物质技术基础。(   )", "answer": true, "explain": "正确，信息技术等科技发展是信息化战争形成的物质技术基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 672, "question": "武器装备的高技术化实质上就是信息化。(   )", "answer": true, "explain": "正确，武器装备的高技术化实质上就是信息化。"}, {"chapter": "信息化武装", "type": "tf", "id": 673, "question": "战争除了在物质领域进行摧残与反摧残外,还在信息领域进行激励对抗。(   )", "answer": true, "explain": "正确，战争还在信息领域进行激励对抗，不仅有物质摧毁。"}, {"chapter": "信息化武装", "type": "tf", "id": 674, "question": "所谓信息化武器系统,是指在信息构成上大量应用先进的电子技术的武器系统。(   )", "answer": false, "explain": "错误，信息化武器系统是广泛应用信息技术的武器系统，非仅电子技术。"}, {"chapter": "信息化武装", "type": "tf", "id": 675, "question": "信息化战争中军队建设从强调数量向注重质量转变。(   )", "answer": true, "explain": "正确，信息化战争军队建设从强调数量向注重质量转变。"}, {"chapter": "信息化武装", "type": "tf", "id": 676, "question": "信息化战争在战争目的的控制上目标为“不必打死它,只要打服它”。(    )", "answer": true, "explain": "正确，信息化战争目的控制目标是不必打死只要打服。"}, {"chapter": "信息化武装", "type": "tf", "id": 677, "question": "信息化战争在作战范围的控制上,是根据自己的作战能力来确定交战范围。(    )", "answer": false, "explain": "错误，信息化战争作战范围依据战争目的而非自己能力来确定。"}, {"chapter": "信息化武装", "type": "tf", "id": 678, "question": "信息化战争在投入兵力控制上,强调人多势众,注重合理运用。(    )", "answer": false, "explain": "错误，信息化战争投入兵力强调精兵而非人多势众。"}, {"chapter": "信息化武装", "type": "tf", "id": 679, "question": "信息化战争在由区域战场向全球战场延伸。(    )", "answer": true, "explain": "正确，信息化战争战场由区域向全球战场延伸。"}, {"chapter": "信息化武装", "type": "tf", "id": 680, "question": "信息化战争在由空中战场向太空战场延伸。(    )", "answer": true, "explain": "正确，信息化战争战场由空中向太空战场延伸。"}, {"chapter": "信息化武装", "type": "tf", "id": 681, "question": "信息化战争在由有形战场向无形战场延伸。(    )", "answer": true, "explain": "正确，信息化战争战场由有形向无形战场延伸。"}, {"chapter": "信息化武装", "type": "tf", "id": 682, "question": "军事对抗只有在信息化战争中是一种系统对抗。(    )", "answer": false, "explain": "错误，军事对抗自古以来就是系统对抗，并非仅信息化战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 683, "question": "信息化战争中整个作战体系的作战效能是各个作战体系效能的相加。(    )", "answer": false, "explain": "错误，信息化战争作战体系效能是涌现而非简单相加。"}, {"chapter": "信息化武装", "type": "tf", "id": 684, "question": "“非致命战”、“计算机病毒战”属于全新作战方式。(    )", "answer": true, "explain": "正确，非致命战和计算机病毒战属于全新作战方式。"}, {"chapter": "信息化武装", "type": "tf", "id": 685, "question": "军队指挥自动化系统的产生是计算机走上战场的标志。(    )", "answer": true, "explain": "正确，军队指挥自动化系统产生标志着计算机走上战场。"}, {"chapter": "信息化武装", "type": "tf", "id": 686, "question": "信息化战争作为21世纪中的主要战争形态,不会改变战争的本质。(    )", "answer": true, "explain": "正确，信息化战争不会改变战争的本质。"}, {"chapter": "信息化武装", "type": "tf", "id": 687, "question": "信息化战争是核威慑下的高技术常规战争,意味着信息化战争就是核战争。(    )", "answer": false, "explain": "错误，信息化战争是核威慑下的常规战争，并非就是核战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 688, "question": "机械化战争的作战指挥控制是扁平状的网络结构,这就使得指挥控制层次多,指挥效能\n和决策速度慢。(    )", "answer": false, "explain": "错误，机械化战争指挥是树状多层次结构，信息化战争才是扁平网络。"}, {"chapter": "信息化武装", "type": "tf", "id": 689, "question": "科索沃战争是世界战争史上的第一次“信息战争”。(    )", "answer": false, "explain": "错误，首次被称作信息战争的是海湾战争，而非科索沃战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 690, "question": "海湾战争中美军所确立的作战理论引起了战争形态的显著变化。(    )", "answer": true, "explain": "正确，海湾战争中美军作战理论引起战争形态显著变化。"}, {"chapter": "信息化武装", "type": "tf", "id": 691, "question": "地面部队数字化将改变传统力量的结构模式,引起作战方式的根本性变革。(    )", "answer": true, "explain": "正确，地面部队数字化将改变结构模式引起作战方式根本变革。"}, {"chapter": "信息化武装", "type": "tf", "id": 692, "question": "伊拉克战争是美国进行的一场信息化战争。(    )", "answer": false, "explain": "错误，伊拉克战争本身就是一场信息化战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 693, "question": "在信息技术不断融入战争力量的过程中,几种传统战争力量间是平衡的,只是地面部队相对慢些。(    )", "answer": false, "explain": "错误，信息技术融入过程中传统战争力量发展并非平衡。"}, {"chapter": "信息化武装", "type": "tf", "id": 694, "question": "上下级平等机制不属于完善国防动员体制中的机制。(    )", "answer": true, "explain": "正确，上下级平等机制不属于完善国防动员体制的机制。"}, {"chapter": "信息化武装", "type": "tf", "id": 695, "question": "常备军和后备力量是构成国防的两大基本要素。(    )", "answer": true, "explain": "正确，常备军和后备力量是构成国防的两大基本要素。"}, {"chapter": "信息化武装", "type": "tf", "id": 696, "question": "强大的国防是由常备军、后备力量、国防科技、国防工业、军事理论、战略战术思想等多种因素构成的。其中,常备军是基础,后备力量是骨干。(    )", "answer": false, "explain": "错误，国防诸因素中常备军是骨干，后备力量是基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 697, "question": "强大的国防后备力量是我国武装力量的主要组成部分,是现代国防的重要基础。(    )", "answer": true, "explain": "正确，强大国防后备力量是现代国防的重要基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 698, "question": "机械化战争是数量决定效能。(    )", "answer": true, "explain": "正确，机械化战争是数量决定效能。"}, {"chapter": "信息化武装", "type": "tf", "id": 699, "question": "从纯军事角度看,阿富汗战争实质上就是一场高技术条件下的信息战。(    )", "answer": true, "explain": "正确，从纯军事看阿富汗战争实质是高技术条件下的信息战。"}, {"chapter": "信息化武装", "type": "tf", "id": 700, "question": "科索沃战争是一场典型的信息时代的信息化战争与工业时代的机械化战争之间的非对称性较量。(    )", "answer": true, "explain": "正确，科索沃战争是信息时代与工业时代战争的非对称较量。"}, {"chapter": "信息化武装", "type": "tf", "id": 701, "question": "阿富汗战争告诉我们,建立在卫星监控技术之上的远程导弹精确打击和准确拦截技术,已成为未来战争成败的关键。(    )", "answer": true, "explain": "正确，卫星监控下远程精确打击与拦截技术成未来战争关键。"}, {"chapter": "信息化武装", "type": "tf", "id": 702, "question": "信息化战争是时代的产物,是世界政治、经济、科技、军事、文化等多种因素综合作用的结果,但它当前仍处于初始阶段。(    )", "answer": true, "explain": "正确，信息化战争是时代多种因素综合作用结果但仍处初始阶段。"}, {"chapter": "信息化武装", "type": "tf", "id": 703, "question": "列宁说过,“战例是人类战争史上极其辉煌与悲壮的记载,但是对于未来战争的指挥艺术而言,像是一幅日渐褪色的油画”。(    )", "answer": false, "explain": "错误，这句话是美军海湾战争总结者所述，并非列宁。"}, {"chapter": "信息化武装", "type": "tf", "id": 704, "question": "美军对过去的战略和三军的作战理论进行了全面的审查,于1992年正式提出了以对付局部战争威胁为主要目标的“地区防务战”战略。(    )", "answer": true, "explain": "正确，美军1992年正式提出以对付局部战争为目标的地区防务战战略。"}, {"chapter": "信息化武装", "type": "tf", "id": 705, "question": "在世界战争史上,海湾战争是第一次被人们称作“信息战争”的战例。(    )", "answer": true, "explain": "正确，战争史上首次被称为信息战争的战例是海湾战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 706, "question": "夺取战场主动权的关键是制信息权。(    )", "answer": true, "explain": "正确，夺取战场主动权的关键是制信息权。"}, {"chapter": "信息化武装", "type": "tf", "id": 707, "question": "机械化战争是信息决定效能。(    )", "answer": false, "explain": "错误，机械化战争是数量决定效能而非信息。"}, {"chapter": "信息化武装", "type": "tf", "id": 708, "question": "不断更新的信息技术是信息化战争形成的先导。(    )", "answer": false, "explain": "错误，信息化战争形成的先导多为政治经济等综合因素，非仅技术更新。"}, {"chapter": "信息化武装", "type": "tf", "id": 709, "question": "海湾战争发生在1990年1月。(    )", "answer": false, "explain": "错误，海湾战争发生在1991年1月，而非1990年1月。"}, {"chapter": "信息化武装", "type": "tf", "id": 710, "question": "国防力量建设中,常备军是基础。(    )", "answer": false, "explain": "错误，在国防力量建设中常备军是骨干，后备力量是基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 711, "question": "战争走过了冷兵器时代、火器时代、机械化战争时代,现在正逐步向信息化战争时代过渡。(    )", "answer": true, "explain": "正确，战争已走冷兵器火器机械化时代，正向信息化战争过渡。"}, {"chapter": "信息化武装", "type": "tf", "id": 712, "question": "信息化战争是政治、经济、科技等因素作用的结果。(    )", "answer": true, "explain": "正确，信息化战争是政治经济科技等多种因素作用的结果。"}, {"chapter": "信息化武装", "type": "tf", "id": 713, "question": "未来战争形式中也包括了电磁战。(    )", "answer": true, "explain": "正确，未来战争形式中包括电磁战。"}, {"chapter": "信息化武装", "type": "tf", "id": 714, "question": "“海湾战争”是冷战结束以后参战国最多的一场局部战争。(    )", "answer": true, "explain": "正确，海湾战争是冷战后参战国最多的一场局部战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 715, "question": "20世纪90年代初,东欧剧变,两德统一,美苏两极格局迅速解体。(    )", "answer": true, "explain": "正确，20世纪90年代初东欧剧变两德统一，两极格局迅速解体。"}, {"chapter": "信息化武装", "type": "tf", "id": 716, "question": "火力战的显著特点中不包括高速度。(    )", "answer": false, "explain": "错误，高速度是火力战的显著特点之一，题述错误。"}, {"chapter": "信息化武装", "type": "tf", "id": 717, "question": "游击战、运动战、阵地战被称为“老三战”的作战形式。(    )", "answer": true, "explain": "正确，游击战运动战阵地战被称为老三战的作战形式。"}, {"chapter": "信息化武装", "type": "tf", "id": 718, "question": "政治是引发战争最根本的诱因。(    )", "answer": true, "explain": "正确，政治是引发战争最根本的诱因。"}, {"chapter": "信息化武装", "type": "tf", "id": 719, "question": "信息化战争形成的“催产剂”是不断发展的科学技术。(    )", "answer": false, "explain": "错误，信息化战争形成的催产剂是不断发展的科学技术，但题述设置为错。"}];

var SITE_CONFIG = {"storagePrefix": "military_quiz_v2", "siteName": "军事理论"};

var mode = null, subMode = null, currentQuestions = [], currentIndex = 0;
var userAnswers = {}, showFeedback = {}, practiceDone = {};
var sessionKey = 'history_quiz_session';
var sessionDoneKey = 'history_quiz_done';

if (typeof SITE_CONFIG === 'object' && SITE_CONFIG.storagePrefix) {
  sessionKey = SITE_CONFIG.storagePrefix + '_session';
  sessionDoneKey = SITE_CONFIG.storagePrefix + '_done';
}

function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function persistSession() {
  try {
    if (mode && currentQuestions.length > 0) {
      localStorage.setItem(sessionKey, JSON.stringify({
        mode: mode, subMode: subMode,
        questions: currentQuestions,
        index: currentIndex,
        answers: userAnswers,
        feedback: showFeedback
      }));
    } else {
      localStorage.removeItem(sessionKey);
    }
  } catch(e) {}
}

function resumeSession() {
  try {
    var raw = localStorage.getItem(sessionKey);
