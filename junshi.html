  try { var d = localStorage.getItem(sessionDoneKey); practiceDone = d ? JSON.parse(d) : {}; } catch(e) { practiceDone = {}; }
}
function savePracticeDone() {
  try { localStorage.setItem(sessionDoneKey, JSON.stringify(practiceDone)); } catch(e) {}
}
function isDone(q) { return !!practiceDone[getGlobalIdx(q)]; }
function markDone(q) { practiceDone[getGlobalIdx(q)] = true; savePracticeDone(); }

function goBack() {
  if (Object.keys(userAnswers).length === 0) {
    doGoBack();
    return;
  }
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-dialog"><p>确定要返回吗？<br>当前答题进度将丢失。</p><div class="btns"><button class="btn btn-outline btn-sm" id="confirmCancel">取消</button><button class="btn btn-primary btn-sm" id="confirmOk" style="background:#c0392b">确认返回</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmCancel').addEventListener('click', function() { overlay.remove(); });
  overlay.querySelector('#confirmOk').addEventListener('click', function() { overlay.remove(); doGoBack(); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function doGoBack() {
  if (mode === 'practice' && subMode) {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  } else if (mode === 'test') {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    mode = null;
    persistSession();
    renderMain();
  } else {
    mode = null; subMode = null;
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  }
}

function renderHeader() {
  var backBtn = document.getElementById('headerBackBtn');
  var el = document.getElementById('headerRight');
  if (!mode || currentQuestions.length === 0) {
    el.innerHTML = '';
    backBtn.classList.remove('visible');
    return;
  }
  backBtn.classList.add('visible');
  var total = currentQuestions.length;
  var answered = Object.keys(userAnswers).length;
  var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  var html = '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-text">' + answered + '/' + total + '</span></div>';
  html += '<div style="position:relative"><button class="status-btn" id="statusBtn">📋</button><div class="status-panel" id="statusPanel"></div></div>';
  el.innerHTML = html;
  document.getElementById('statusBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    var panel = document.getElementById('statusPanel');
    renderStatusPanel();
    panel.classList.toggle('show');
  });
  document.addEventListener('click', function() { var p = document.getElementById('statusPanel'); if (p) p.classList.remove('show'); });
}

function renderStatusPanel() {
  var el = document.getElementById('statusPanel'); if (!el) return;
  var total = currentQuestions.length;
  var doneCount = 0;
  var html = '<h4>完成状态（<span id="statusDoneCount">0</span>/' + total + '）<br><span style="font-weight:400;font-size:11px">绿色=已答 灰色=未答 蓝色框=当前</span></h4><div class="status-grid">';
  currentQuestions.forEach(function(q, i) {
    var d = (userAnswers[i] !== undefined);
    if (mode === 'practice') d = d || isDone(q);
    if (d) doneCount++;
    var cur = (i === currentIndex) ? ' current' : '';
    html += '<div class="status-circle' + (d ? ' done' : '') + cur + '" data-idx="' + i + '" title="第' + (i+1) + '题' + (d ? ' ✓' : '') + '">' + (i + 1) + '</div>';
  });
  html += '</div>';
  if (mode === 'test') {
    html += '<div style="text-align:center;margin-top:14px"><button class="btn btn-primary btn-sm" id="panelSubmitBtn" style="width:auto;padding:8px 32px;background:#c0392b">提交试卷</button></div>';
  }
  el.innerHTML = html;
  el.querySelector('#statusDoneCount').textContent = doneCount;
  el.querySelectorAll('.status-circle').forEach(function(circle) {
    circle.addEventListener('click', function(e) {
      e.stopPropagation();
      currentIndex = parseInt(circle.dataset.idx);
      renderQuiz();
      el.classList.remove('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  var psb = el.querySelector('#panelSubmitBtn');
  if (psb) psb.addEventListener('click', function(e) {
    e.stopPropagation();
    if (Object.keys(userAnswers).length === 0) { alert('请至少回答一道题再提交'); return; }
    var ok = confirm('确定要提交试卷吗？未作答的题目将计为错误。');
    if (ok) {
      el.classList.remove('show');
      renderResult(document.getElementById('main'));
      renderHeader();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
}

function renderMain() {
  var el = document.getElementById('main');
  if (!mode) { renderModeSelect(el); }
  else if (currentQuestions.length === 0) { renderSubModeSelect(el); }
  else { renderQuiz(); }
  renderHeader();
}

function renderModeSelect(el) {
  var totalCount = ALL_QUESTIONS.length;
  var testDesc = '';
  var tc = (SITE_CONFIG && SITE_CONFIG.testCounts) || { single: 20, multi: 20, tf: 10 };
  var parts = [];
  if (tc.single) parts.push('单选' + tc.single + '题');
  if (tc.multi) parts.push('多选' + tc.multi + '题');
  if (tc.tf) parts.push('判断' + tc.tf + '题');
  testDesc = parts.join(' + ');
  el.innerHTML = '<div class="page-title"><h2>军事理论</h2><p>题库练习与测试系统 · 共 ' + totalCount + ' 题</p></div><div class="mode-grid"><div class="mode-card" data-mode="practice"><div class="icon">📝</div><h3>刷题模式</h3><p>按题型分类练习<br>即时反馈，记录进度</p></div><div class="mode-card" data-mode="test"><div class="icon">📋</div><h3>测试模式</h3><p>' + testDesc + '<br>每题2分</p></div></div>';
  el.querySelectorAll('.mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      mode = card.dataset.mode;
      currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
      if (mode === 'test') { startTest(); }
      else if (SITE_CONFIG && SITE_CONFIG.subModes && SITE_CONFIG.subModes.length === 1) {
        subMode = SITE_CONFIG.subModes[0];
        currentQuestions = ALL_QUESTIONS.filter(function(q) { return q.type === subMode; });
        persistSession();
        renderMain();
      } else { persistSession(); renderMain(); }
    });
  });
}

function renderSubModeSelect(el) {
  var counts = { single: 0, multi: 0, tf: 0 };
  ALL_QUESTIONS.forEach(function(q) { counts[q.type]++; });
  var subs = (SITE_CONFIG && SITE_CONFIG.subModes) || ['single', 'multi', 'tf'];
  var labels = { single: '单选题', multi: '多选题', tf: '判断题' };
  var cardsHtml = '';
  subs.forEach(function(s) {
    cardsHtml += '<div class="sub-mode-card" data-sub="' + s + '">' + labels[s] + '<br><span style="font-size:12px;color:var(--text-secondary);font-weight:400">' + counts[s] + ' 题</span></div>';
  });
  el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px"><button class="btn btn-outline btn-sm" id="backBtn">← 返回</button><h2 style="font-weight:600;font-size:17px">刷题模式 · 选择题型</h2></div><div class="sub-mode-grid">' + cardsHtml + '</div>';
  el.querySelector('#backBtn').addEventListener('click', function() { mode = null; persistSession(); renderMain(); });
  el.querySelectorAll('.sub-mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      subMode = card.dataset.sub;
      currentQuestions = ALL_QUESTIONS.filter(function(q) { return q.type === subMode; });
      currentIndex = 0; userAnswers = {}; showFeedback = {};
      persistSession();
      renderMain();
    });
  });
}

function coveragePick(pool, n) {
  var byK = {};
  pool.forEach(function(q) {
    var k = q.kpoint || '其他';
    (byK[k] = byK[k] || []).push(q);
  });
  var keys = shuffle(Object.keys(byK));
  var picked = [];
  var pickedSet = {};
  function markPicked(q) { picked.push(q); pickedSet[q.id + '_' + q.chapter] = true; }
  keys.forEach(function(k) {
    var arr = shuffle(byK[k]);
    arr.sort(function(a, b) { return (b.hot || 0) - (a.hot || 0); });
    if (arr.length) markPicked(arr[0]);
  });
  if (picked.length > n) picked = picked.slice(0, n);
  var rest = shuffle(pool.filter(function(q) { return !pickedSet[q.id + '_' + q.chapter]; }));
  rest.sort(function(a, b) { return (b.hot || 0) - (a.hot || 0); });
  picked = picked.concat(rest.slice(0, n - picked.length));
  return shuffle(picked);
}

function startTest() {
  var tc = (SITE_CONFIG && SITE_CONFIG.testCounts) || { single: 20, multi: 20, tf: 10 };
  var singlesPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; });
  var multisPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; });
  var tfsPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'tf'; });
  var useCoverage = SITE_CONFIG && SITE_CONFIG.testSelection === 'coverage';
  var singles = useCoverage ? coveragePick(singlesPool, tc.single || 0) : shuffle(singlesPool).slice(0, tc.single || 0);
  var multis = shuffle(multisPool).slice(0, tc.multi || 0);
  var tfs = shuffle(tfsPool).slice(0, tc.tf || 0);
  currentQuestions = singles.concat(multis).concat(tfs);
  currentIndex = 0; userAnswers = {}; showFeedback = {};
  persistSession();
  renderMain();
}

function renderQuiz() {
  var el = document.getElementById('main');
  var total = currentQuestions.length;
  if (currentIndex >= total) { renderResult(el); renderHeader(); return; }
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  var typeLabel = { single: '单选题', multi: '多选题', tf: '判断题' }[q.type];
  var hasAnswered = showFeedback[currentIndex];
  var userAns = userAnswers[currentIndex];
  var optionsHtml = '';
  if (q.type === 'tf') {
    var tfLabels = ['对', '错'];
    var tfLetters = ['A', 'B'];
    optionsHtml = '<div class="options">';
    tfLabels.forEach(function(label, i) {
      var cls = 'option';
      var ansVal = i === 0;
      if (hasAnswered) cls += ' disabled';
      if (userAns !== undefined && userAns === ansVal) cls += ' selected';
      if (hasAnswered) {
        if (q.answer === ansVal) cls += ' correct';
        if (userAns !== undefined && userAns === ansVal && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-answer="' + ansVal + '"><span class="option-letter">' + tfLetters[i] + '</span><span>' + label + '</span></div>';
    });
    optionsHtml += '</div>';
  } else if (q.type === 'multi') {
    optionsHtml = (hasAnswered ? '' : '<div class="multi-hint">可多选，选择后点击确认</div>') + '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      var selected = userAns && userAns.indexOf(opt.label) !== -1;
      if (selected) cls += ' selected';
      if (hasAnswered) {
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (selected && q.answer.indexOf(opt.label) === -1) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  } else {
    optionsHtml = '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      if (userAns === opt.label) cls += ' selected';
      if (hasAnswered) {
        if (opt.label === q.answer) cls += ' correct';
        if (userAns === opt.label && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  }

  var feedbackHtml = '';
  if (hasAnswered) {
    var isMulti = q.type === 'multi';
    var userDisplay, correctDisplay, isCorrect;
    if (isMulti) {
      userDisplay = userAns ? userAns.split('').sort().join('') : '未作答';
      correctDisplay = q.answer;
      isCorrect = (userAns || '').split('').sort().join('') === q.answer;
    } else if (q.type === 'tf') {
      userDisplay = userAns === true ? '对' : userAns === false ? '错' : '未作答';
      correctDisplay = q.answer === true ? '对' : '错';
      isCorrect = userAns === q.answer;
    } else {
      userDisplay = userAns || '未作答';
      correctDisplay = q.answer;
      isCorrect = userAns === q.answer;
    }
    feedbackHtml = '<div class="feedback show ' + (isCorrect ? 'correct' : 'incorrect') + '">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误，正确答案是 <strong>' + correctDisplay + '</strong>') + '</div>';
    if (q.explain) {
      feedbackHtml += '<div class="explain-box"><span class="explain-label">解析</span><span class="explain-text">' + q.explain + '</span></div>';
    }
  }

  var navHtml = '';
  var isLast = (currentIndex >= total - 1);
  if (hasAnswered) {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    navHtml += '<button class="btn btn-primary" id="nextBtn">' + (isLast ? '查看结果' : '下一题') + '</button>';
  } else {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    if (q.type === 'multi') {
      var mSel = userAnswers[currentIndex];
      var mDisabled = (!mSel || mSel === '');
      navHtml += '<button class="btn btn-primary" id="confirmBtn" style="flex:1;' + (mDisabled ? 'opacity:.45;pointer-events:none' : '') + '">确认答案</button>';
    } else {
      var cSel = userAnswers[currentIndex];
      var cDisabled = (cSel === undefined || cSel === '');
      var confStyle = 'flex:1;' + (cDisabled ? 'opacity:.45;pointer-events:none' : '');
      if (mode === 'test' && isLast) {
        navHtml += '<button class="btn btn-primary" id="submitTestBtn" style="flex:1;background:#c0392b">提交</button>';
        navHtml += '<button class="btn btn-primary" id="confirmBtn" style="' + confStyle + '">确认</button>';
      } else {
        navHtml += '<button class="btn btn-outline" id="skipBtn">下一题</button>';
        navHtml += '<button class="btn btn-primary" id="confirmBtn" style="' + confStyle + '">确认</button>';
      }
    }
  }

  el.innerHTML = '<div class="quiz-header"><div class="quiz-info"><span>' + typeLabel + '</span> · 第 <span>' + qNum + '</span>/<span>' + total + '</span> 题' + (mode === 'test' ? '' : '<span class="chapter-tag">' + q.chapter + '</span>') + '</div></div><div class="question-card"><div class="question-num">第 ' + qNum + ' 题</div><div class="question-text">' + q.question + '</div>' + optionsHtml + feedbackHtml + '</div><div class="nav-btns">' + navHtml + '</div>';

  if (!hasAnswered) {
    if (q.type === 'single') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.label;
          renderQuiz(); persistSession();
        });
      });
      var scb = el.querySelector('#confirmBtn');
      if (scb) scb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    } else if (q.type === 'multi') {
      if (!userAnswers[currentIndex]) userAnswers[currentIndex] = '';
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          var label = opt.dataset.label;
          var sel = userAnswers[currentIndex] || '';
          userAnswers[currentIndex] = sel.indexOf(label) !== -1 ? sel.replace(label, '') : sel + label;
          renderQuiz(); persistSession();
        });
      });
      var cb = el.querySelector('#confirmBtn');
      if (cb) cb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    } else if (q.type === 'tf') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.answer === 'true';
          renderQuiz(); persistSession();
        });
      });
      var tcb = el.querySelector('#confirmBtn');
      if (tcb) tcb.addEventListener('click', function() {
        if (userAnswers[currentIndex] === undefined) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    }
    var sb = el.querySelector('#skipBtn');
    if (sb) sb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var stb = el.querySelector('#submitTestBtn');
    if (stb) stb.addEventListener('click', function() {
      var ok = confirm('确定要提交吗？未作答的题目将计为错误。');
      if (ok) { renderResult(el); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  }

  var pb = el.querySelector('#prevBtn');
  if (pb) pb.addEventListener('click', function() { currentIndex--; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var nb = el.querySelector('#nextBtn');
  if (nb) nb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function renderResult(el) {
  var total = currentQuestions.length;
  var correct = 0, singleTotal = 0, singleCorrect = 0, multiTotal = 0, multiCorrect = 0, tfTotal = 0, tfCorrect = 0;
  var wrongIdx = [];
  currentQuestions.forEach(function(q, i) {
    var ua = userAnswers[i], isCorrect;
    if (q.type === 'multi') { isCorrect = (ua || '').split('').sort().join('') === q.answer; }
    else { isCorrect = ua === q.answer; }
    if (isCorrect) correct++; else wrongIdx.push(i);
    if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
    else if (q.type === 'multi') { multiTotal++; if (isCorrect) multiCorrect++; }
    else { tfTotal++; if (isCorrect) tfCorrect++; }
  });
  var score = mode === 'test' ? correct * 2 : correct;
  var maxScore = mode === 'test' ? total * 2 : total;
  var pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  var gridHtml = '';
  if (singleTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + singleCorrect + '/' + singleTotal + '</div><div class="label">单选题</div></div>';
  if (multiTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + multiCorrect + '/' + multiTotal + '</div><div class="label">多选题</div></div>';
  if (tfTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + tfCorrect + '/' + tfTotal + '</div><div class="label">判断题</div></div>';

  el.innerHTML = '<div class="result-card"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">' + (mode === 'test' ? '测试完成' : '章节完成') + '</div><div class="result-score">' + score + '<span style="font-size:18px;color:var(--text-secondary);font-weight:400"> / ' + maxScore + '</span></div><div class="result-detail">正确率 ' + pct + '% · 共 ' + total + ' 题，答对 ' + correct + ' 题</div><div class="result-grid">' + gridHtml + '</div><div style="display:flex;gap:10px"><button class="btn btn-outline" id="reviewBtn" style="flex:1">查看错题 (' + wrongIdx.length + ')</button><button class="btn btn-primary" id="restartBtn" style="flex:1">' + (mode === 'test' ? '重新测试' : '返回') + '</button></div></div>';

  el.querySelector('#restartBtn').addEventListener('click', function() {
    if (mode === 'test') { currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; startTest(); }
    else { mode = null; subMode = null; currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; persistSession(); renderMain(); }
  });
  el.querySelector('#reviewBtn').addEventListener('click', function() {
    if (wrongIdx.length === 0) { alert('全部正确，没有错题！'); return; }
    currentIndex = wrongIdx[0];
    renderQuiz(); renderHeader(); persistSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

loadPracticeDone();
document.getElementById('headerBackBtn').addEventListener('click', goBack);

function renderResumeBanner() {
  var main = document.getElementById('main');
  if (!main) return;
  var banner = document.createElement('div');
  banner.style.cssText = 'background:#eef2fa;border:1px solid #2d5a9e;color:#1e3a5f;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap';
  banner.innerHTML = '<span>检测到上次的答题进度：第 <strong id="resumeIdx"></strong> 题（共 ' + currentQuestions.length + ' 题）</span><span style="display:flex;gap:8px"><button id="resumeBtn" style="background:#1e3a5f;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:13px;cursor:pointer;font-weight:600">继续答题</button><button id="discardBtn" style="background:#fff;color:#6b7280;border:1px solid #d1d5db;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer">放弃进度</button></span>';
  main.insertBefore(banner, main.firstChild);
  document.getElementById('resumeIdx').textContent = currentIndex + 1;
  document.getElementById('resumeBtn').addEventListener('click', function() { renderMain(); });
  document.getElementById('discardBtn').addEventListener('click', function() {
    mode = null; subMode = null; currentQuestions = []; currentIndex = 0;
    userAnswers = {}; showFeedback = {};
    persistSession();
    renderMain();
  });
}

function startApp() {
  if (resumeSession()) {
    renderModeSelect(document.getElementById('main'));
    renderResumeBanner();
  } else {
    renderMain();
  }
}

window.addEventListener('beforeunload', persistSession);

startApp();
</script>
</body>
