<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>军事理论刷题 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 300px; max-height: 380px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.status-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.status-circle {
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid #d1d5db;
  color: var(--text-secondary);
  background: var(--surface);
}
.status-circle:hover { transform: scale(1.15); border-color: var(--primary-light); }
.status-circle.done { background: var(--correct); color: #fff; border-color: var(--correct); }
.status-circle.current { border-color: var(--primary); border-width: 2.5px; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: none; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-secondary);
  transition: all var(--transition); flex-shrink: 0;
}
.back-btn:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f3f9; }
.back-btn.visible { display: flex; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  text-align: center; box-shadow: var(--shadow-md); max-width: 320px; width: 90%;
}
.confirm-dialog p { font-size: 14px; margin-bottom: 16px; color: var(--text); }
.confirm-dialog .btns { display: flex; gap: 10px; }
.confirm-dialog .btns .btn { flex: 1; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.explain-box {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 10px;
  background: #f0f3f9; font-size: 13.5px; line-height: 1.65; color: var(--text);
}
.explain-label {
  flex-shrink: 0; background: var(--primary-light); color: #fff;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
}
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>

<script>
var ALL_QUESTIONS = [{"chapter": "中国国防", "type": "single", "id": 0, "question": "（）是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。", "options": [{"label": "A", "text": "国家"}, {"label": "B", "text": "军队"}, {"label": "C", "text": "武装集团"}, {"label": "D", "text": "国防"}], "answer": "D", "explain": "国防是国家为防备和抵抗侵略、制止武装颠覆而进行的军事及军事相关的活动，故答案为国防。A项国家是国防的主体而非活动本身，B项军队只是武装力量的组成部分，C项武装集团仅指军事组织，均不能概括题干所述的全部活动。"}, {"chapter": "中国国防", "type": "single", "id": 1, "question": "国防的主体，即国防活动的实施者，通常为（ ）", "options": [{"label": "A", "text": "政府"}, {"label": "B", "text": "国家"}, {"label": "C", "text": "公民"}, {"label": "D", "text": "军队"}], "answer": "B", "explain": "国防的主体即实施者是整个国家，而非单一机构或个人，故答案为B。A项政府只是一个执行机关，C项公民是国防的参与者之一，D项军队仅是武装力量的组成部分，均不是国防活动的实施主体。"}, {"chapter": "中国国防", "type": "single", "id": 2, "question": "国防的根本目的和任务是（ ）。", "options": [{"label": "A", "text": "保卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫国家的领土完整"}, {"label": "D", "text": "保障国家的安全"}], "answer": "A", "explain": "国防的根本目的和任务是保卫国家的主权，主权是国家最根本的标志和最高利益。B项统一、C项领土完整、D项安全均从属于主权，是主权的派生和保障，不能作为根本目的。"}, {"chapter": "中国国防", "type": "single", "id": 3, "question": "根据我国的社会制度和国家政策，中国的国防类型是（ ）。", "options": [{"label": "A", "text": "扩张型"}, {"label": "B", "text": "中立型"}, {"label": "C", "text": "侵略型"}, {"label": "D", "text": "自卫型"}], "answer": "D", "explain": "我国坚持防御性国防政策，不侵略扩张也不与他国结盟，故国防类型是自卫型。A项扩张型、C项侵略型均主张对外扩张，B项中立型主张不参与任何军事同盟，皆与我国实际不符。"}, {"chapter": "中国国防", "type": "single", "id": 4, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学盛典”的《孙子兵法》一书，其作者是春秋时期著名的（ ）。", "options": [{"label": "A", "text": "孙权"}, {"label": "B", "text": "孙膑"}, {"label": "C", "text": "孙武"}, {"label": "D", "text": "孙文"}], "answer": "C", "explain": "此语出自春秋末年军事家孙武所著《孙子兵法》，孙武被尊为兵圣。A项孙权是三国吴主，B项孙膑是战国军事家著《孙膑兵法》，D项孙文是孙中山，均非《孙子兵法》作者。"}, {"chapter": "中国国防", "type": "single", "id": 5, "question": "下列不属于国防法规的特性是（ ）。", "options": [{"label": "A", "text": "调整对象的军事性"}, {"label": "B", "text": "目标体系的多样性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "B", "explain": "国防法规的目标体系是统一明确的，不具有多样性，故B项目标体系的多样性不属于其特性。A项调整对象的军事性、C项公开程度的有限性、D项司法适用的优先性均为国防法规的固有特性。"}, {"chapter": "中国国防", "type": "single", "id": 6, "question": "现行《国防法》由全国人民代表大会八届五次会议于（ ）通过，并于当日颁布实施。", "options": [{"label": "A", "text": "1997年3月14日"}, {"label": "B", "text": "1997年4月13日"}, {"label": "C", "text": "1999年3月14日"}, {"label": "D", "text": "1999年4月13日"}], "answer": "A", "explain": "现行《国防法》于1997年3月14日由八届全国人大五次会议通过并当日施行。B项4月13日月份错误，C项1999年、D项1999年4月年份均不正确。"}, {"chapter": "中国国防", "type": "single", "id": 7, "question": "下列哪个不属于我国的国防法规（ ）。", "options": [{"label": "A", "text": "《兵役法》"}, {"label": "B", "text": "《反分裂国家法》"}, {"label": "C", "text": "《义务教育法》"}, {"label": "D", "text": "《民兵工作条例》"}], "answer": "C", "explain": "《义务教育法》属于教育领域法律，不属于我国国防法规体系，故答案为C。A项《兵役法》、B项《反分裂国家法》、D项《民兵工作条例》均为国防法规的组成部分。"}, {"chapter": "中国国防", "type": "single", "id": 8, "question": "下列哪个不是中华人民共和国武装力量的组成部分。（ ）。", "options": [{"label": "A", "text": "义务兵"}, {"label": "B", "text": "中国人民解放军现役部队和预备役部队"}, {"label": "C", "text": "中国人民武装警察部队"}, {"label": "D", "text": "民兵"}], "answer": "A", "explain": "义务兵是一种服役身份而非武装力量的组成部分，故答案为A。我国武装力量由B项解放军现役和预备役部队、C项武警部队、D项民兵三部分构成。"}, {"chapter": "中国国防", "type": "single", "id": 9, "question": "( )在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。", "options": [{"label": "A", "text": "《兵役法》"}, {"label": "B", "text": "《反分裂国家法》"}, {"label": "C", "text": "《国防教育法》"}, {"label": "D", "text": "《国防法》"}], "answer": "D", "explain": "《国防法》在国防法规体系中居统帅地位并起核心作用，是其他军事立法的基本依据。A项《兵役法》、B项《反分裂国家法》、C项《国防教育法》均属具体法规，不具备统帅和核心地位。"}, {"chapter": "中国国防", "type": "single", "id": 10, "question": "( ) 是指在一个固定的时期内， 根据国际形势、周边环境以及国内条件的发展趋势，在已有的国防建设的基础上，运用国家的各种条件和力量，在国防建设上所要达到的预期目的和结果。", "options": [{"label": "A", "text": "国防法规"}, {"label": "B", "text": "国防领导体制"}, {"label": "C", "text": "国防动员"}, {"label": "D", "text": "国防建设目标"}], "answer": "D", "explain": "国防建设目标是指在一定时期内运用的各种条件和力量所要达到的预期目的和结果。A项国防法规是行为规则，B项国防领导体制是组织体系，C项国防动员是战备活动，均与预期目标含义不符。"}, {"chapter": "中国国防", "type": "single", "id": 11, "question": "每年的（ ）为国家烈士纪念日。", "options": [{"label": "A", "text": "8月3日"}, {"label": "B", "text": "9月3日"}, {"label": "C", "text": "8月30日"}, {"label": "D", "text": "9月30日"}], "answer": "D", "explain": "每年9月30日为国家烈士纪念日，以缅怀为国捐躯的英烈。A项8月3日、B项9月3日（抗战胜利纪念日）、C项8月30日均非烈士纪念日。"}, {"chapter": "中国国防", "type": "single", "id": 12, "question": "国防是指国家为防备和抵抗侵略，制止武装颠覆，保卫国家主权统一、领土完整和安全所进行的军事及军事有关的政治、经济、外交、科技、教育等方面活动。国防的基本要素不包括（ ）。", "options": [{"label": "A", "text": "国防的性质"}, {"label": "B", "text": "国防的对象"}, {"label": "C", "text": "国防的目的"}, {"label": "D", "text": "国防的手段"}], "answer": "A", "explain": "国防的基本要素包括对象、目的、手段等，国防的性质不在其中，故答案为A。B项国防的对象、C项国防的目的、D项国防的手段均是国防基本要素的组成部分。"}, {"chapter": "中国国防", "type": "single", "id": 13, "question": "下列哪个不是我国的国防手段( ) 。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "文化手段"}, {"label": "D", "text": "经济手段"}], "answer": "C", "explain": "我国国防手段包括政治、外交、经济、军事等手段，文化手段不属于国防手段，故答案为C。A项政治手段、B项外交手段、D项经济手段均是我国国防的重要手段。"}, {"chapter": "中国国防", "type": "single", "id": 14, "question": "下列不属于国防法规的特性是（ ）。", "options": [{"label": "A", "text": "法律条例的自由性"}, {"label": "B", "text": "处罚措施的严厉性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "A", "explain": "国防法规不具有法律条例的自由性，故A项不属于其特性。B项处罚措施的严厉性、C项公开程度的有限性、D项司法适用的优先性均是国防法规的固有特性。"}, {"chapter": "中国国防", "type": "single", "id": 15, "question": "( ),我国第一颗原子弹爆炸成功。", "options": [{"label": "A", "text": "1964年10月16日"}, {"label": "B", "text": "1965年10月16日"}, {"label": "C", "text": "1966年10月16日"}, {"label": "D", "text": "1967年10月16日"}], "answer": "A", "explain": "1964年10月16日我国第一颗原子弹爆炸成功，标志着打破核垄断。B项1965年、C项1966年、D项1967年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 16, "question": "下列哪个不是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "武装力量动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "文化动员"}, {"label": "D", "text": "国民经济动员"}], "answer": "C", "explain": "文化动员不属于国防动员的主要内容，故答案为C。A项武装力量动员、B项科学技术动员、D项国民经济动员均是国防动员的重要组成部分。"}, {"chapter": "中国国防", "type": "single", "id": 17, "question": "《孙胺兵法》继承和发展了（ ）的军事战略思想，这是一部享誉世间的兵家宝书。", "options": [{"label": "A", "text": "《后汉书》"}, {"label": "B", "text": "《汉书》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "D", "explain": "《孙膑兵法》继承和发展了其祖师孙武《孙子兵法》的军事战略思想，二者一脉相承。A项《后汉书》、B项《汉书》是史书，C项《司马法》是另一部兵书，均非其思想源头。"}, {"chapter": "中国国防", "type": "single", "id": 18, "question": "“国防”一词在我国最早见于( ) 。", "options": [{"label": "A", "text": "《孙子兵法》"}, {"label": "B", "text": "《孙膑兵法》"}, {"label": "C", "text": "《汉书》"}, {"label": "D", "text": "《后汉书》"}], "answer": "D", "explain": "国防一词在我国最早见于《后汉书》，此前多以军旅、武备等称呼。A项《孙子兵法》、B项《孙膑兵法》是兵书，C项《汉书》成书更早但未用此词。"}, {"chapter": "中国国防", "type": "single", "id": 19, "question": "从2013年开始，征兵工作由冬季改为（ ）。", "options": [{"label": "A", "text": "春夏季"}, {"label": "B", "text": "夏秋季"}, {"label": "C", "text": "秋冬季"}, {"label": "D", "text": "冬春季"}], "answer": "B", "explain": "从2013年起我国征兵工作由冬季改为夏秋季，便于与青年学生毕业时间相衔接。A项春夏季、C项秋冬季、D项冬春季均不正确。"}, {"chapter": "中国国防", "type": "single", "id": 20, "question": "民兵是解放军的助手和国家的后备武装力量， 在建设祖国、保卫祖国中发挥了重大作用，民兵的使命是（ ）。", "options": [{"label": "A", "text": "积极参加生产建设；担负战备勤务，保卫边境，维护社会治安与稳定；应召入伍，抵抗侵略，保卫祖国"}, {"label": "B", "text": "巩固国防，抵抗侵略，保卫祖国，保卫人民的和平劳动，参加国家建设任务"}, {"label": "C", "text": "全心全意为人民服务"}, {"label": "D", "text": "维护国家主权和尊严；维护社会治安，保卫党政领导机关、重要目标和人民生命财产的安全。"}], "answer": "A", "explain": "民兵既参加生产建设又担负战备勤务、保卫边境和应召入伍，故答案为A。B项是解放军的职责，C项是解放军的宗旨，D项是武警和公安的职责，均非民兵使命。"}, {"chapter": "中国国防", "type": "single", "id": 21, "question": "中国人民解放军是我国武装力量的主体，它诞生于（ ）的战火中。", "options": [{"label": "A", "text": "平津战役"}, {"label": "B", "text": "皇姑屯战役"}, {"label": "C", "text": "九一八事变"}, {"label": "D", "text": "南昌起义"}], "answer": "D", "explain": "中国人民解放军于1927年南昌起义的战火中诞生，八一因此成为建军节。A项平津战役、B项皇姑屯战役、C项九一八事变均发生于此后，不是解放军诞生的标志。"}, {"chapter": "中国国防", "type": "single", "id": 22, "question": "中国人民解放军海军于（ ）诞生于江苏泰州白马庙。", "options": [{"label": "A", "text": "1949年4月"}, {"label": "B", "text": "1950年4月"}, {"label": "C", "text": "1951年4月"}, {"label": "D", "text": "1952年4月"}], "answer": "A", "explain": "中国人民解放军海军于1949年4月诞生于江苏泰州白马庙。B项1950年、C项1951年、D项1952年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 23, "question": "国防是（ ）的全面体现。", "options": [{"label": "A", "text": "国家综合力量"}, {"label": "B", "text": "国家经济实力"}, {"label": "C", "text": "国家军事力量"}, {"label": "D", "text": "国家科技实力"}], "answer": "A", "explain": "国防是国家综合力量的全面体现，涵盖政治、经济、军事、科技等各要素。B项经济实力、C项军事力量、D项科技实力均只是综合力量的一个方面，不能概括国防全貌。"}, {"chapter": "中国国防", "type": "single", "id": 24, "question": "(     )是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及相应制度，包括国防领导机构的设置、职权划分、相互关系及相关制度等，是国防体制和国家体制的重要组成部分。", "options": [{"label": "A", "text": "国防法规"}, {"label": "B", "text": "国防领导体制"}, {"label": "C", "text": "国防动员"}, {"label": "D", "text": "国防建设目标"}], "answer": "B", "explain": "国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及相应制度。A项国防法规是行为规则，C项国防动员是战备活动，D项国防建设目标是预期结果，均不符题意。"}, {"chapter": "中国国防", "type": "single", "id": 25, "question": "当代爱国主义的主题是（ ）。", "options": [{"label": "A", "text": "爱祖国"}, {"label": "B", "text": "爱人民"}, {"label": "C", "text": "爱社会主义"}, {"label": "D", "text": "爱共产主义"}], "answer": "C", "explain": "当代爱国主义的主题是爱社会主义，爱国与爱社会主义、爱中国共产党的领导相统一。A项爱祖国、B项爱人民是爱国主义的普遍内容，D项爱共产主义是远大理想，均非当代主题。"}, {"chapter": "中国国防", "type": "single", "id": 26, "question": "“对待同志要像春天般的温暖，对待工作要像夏天一样火热，对待个人主义要像秋风扫落叶一样，对待敌人要像严冬一样残酷无情”，这种强烈的阶级情感，正是（ ）精神的精髓。", "options": [{"label": "A", "text": "邱少云"}, {"label": "B", "text": "王进喜"}, {"label": "C", "text": "袁隆平"}, {"label": "D", "text": "雷锋"}], "answer": "D", "explain": "这句名言出自雷锋，体现其鲜明的阶级情感和全心全意为人民服务的雷锋精神。A项邱少云以严守纪律著称，B项王进喜是铁人精神代表，C项袁隆平贡献于农业科技，均与此名言无关。"}, {"chapter": "中国国防", "type": "single", "id": 27, "question": "每年的（ ）为南京大屠杀死难者国家公祭日。", "options": [{"label": "A", "text": "11月3日\n"}, {"label": "B", "text": "12月3日"}, {"label": "C", "text": "11月13日"}, {"label": "D", "text": "12月13日"}], "answer": "D", "explain": "每年12月13日为南京大屠杀死难者国家公祭日。A项11月3日、B项12月3日、C项11月13日均不正确。"}, {"chapter": "中国国防", "type": "single", "id": 28, "question": "以下哪个不是国防动员的基本原则（ ）。", "options": [{"label": "A", "text": "服从大局，长期准备"}, {"label": "B", "text": "优先准备，灵活多样"}, {"label": "C", "text": "严密组织，快速高效"}, {"label": "D", "text": "因故因势，协调灵活"}], "answer": "B", "explain": "优先准备、灵活多样不是国防动员的基本原则，故答案为B。A项服从大局长期准备、C项严密组织快速高效、D项因故因势协调灵活均属国防动员的基本要求。"}, {"chapter": "中国国防", "type": "single", "id": 29, "question": "“香玉剧社号”这架飞机，是著名豫剧表演艺术家常香玉带领香玉剧社的全体演职员，通过义演，募集资金，为（ ）捐献的。", "options": [{"label": "A", "text": "抗日战争"}, {"label": "B", "text": "解放战争"}, {"label": "C", "text": "抗美援朝"}, {"label": "D", "text": "越南战争"}], "answer": "C", "explain": "常香玉率香玉剧社义演募资捐献的飞机捐赠给了抗美援朝前线。A项抗日战争、B项解放战争、D项越南战争均与捐赠背景不符。"}, {"chapter": "中国国防", "type": "single", "id": 30, "question": "《中华人民共和国国防动员法》由第十一届全国人民代表大会常务委员会第十三次会议于（ ）通过。", "options": [{"label": "A", "text": "2009年2月26日"}, {"label": "B", "text": "2010年2月26日"}, {"label": "C", "text": "2011年2月26日"}, {"label": "D", "text": "2012年2月26日"}], "answer": "B", "explain": "《中华人民共和国国防动员法》由十一届全国人大常委会第十三次会议于2010年2月26日通过。A项2009年、C项2011年、D项2012年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 31, "question": "国防动员的组织体系不是由（ ）组成的。", "options": [{"label": "A", "text": "决策机构"}, {"label": "B", "text": "协调机构"}, {"label": "C", "text": "执行机构"}, {"label": "D", "text": "监督机构"}], "answer": "D", "explain": "国防动员组织体系由决策、协调、执行机构组成，监督机构不在其中，故答案为D。A项决策机构、B项协调机构、C项执行机构均是其组成部分。"}, {"chapter": "中国国防", "type": "single", "id": 32, "question": "“小推车推出来的胜利”是指（ ）。", "options": [{"label": "A", "text": "辽沈战役"}, {"label": "B", "text": "平津战役"}, {"label": "C", "text": "淮海战役"}, {"label": "D", "text": "渡江战役"}], "answer": "C", "explain": "淮海战役靠人民群众用小车支前，被称为小推车推出来的胜利。A项辽沈战役、B项平津战役、D项渡江战役均无此特定称谓。"}, {"chapter": "中国国防", "type": "single", "id": 33, "question": "国防动员的主要内容中，战争动员的核心是（ ）。", "options": [{"label": "A", "text": "武装力量动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "人民防空动员"}, {"label": "D", "text": "国民经济动员"}], "answer": "A", "explain": "武装力量动员是战争动员的核心，直接形成作战能力。B项科学技术动员、C项人民防空动员、D项国民经济动员均是重要支撑而非核心。"}, {"chapter": "中国国防", "type": "single", "id": 34, "question": "“兵民是胜利之本”，这是（ ）提出的军事理论。", "options": [{"label": "A", "text": "朱德"}, {"label": "B", "text": "彭德怀"}, {"label": "C", "text": "毛泽东"}, {"label": "D", "text": "周恩来"}], "answer": "C", "explain": "毛泽东提出兵民是胜利之本，强调人民力量是战争胜利的根本。A项朱德、B项彭德怀、D项周恩来均是革命军事家，但未提出此论断。"}, {"chapter": "中国国防", "type": "single", "id": 35, "question": "( )是我国社会主义事业的领导核心。", "options": [{"label": "A", "text": "国家主席"}, {"label": "B", "text": "全国人民代表大会"}, {"label": "C", "text": "中央军事委员会"}, {"label": "D", "text": "中国共产党"}], "answer": "D", "explain": "中国共产党是我国社会主义事业的领导核心。A项国家主席、B项全国人民代表大会、C项中央军事委员会均是国家机关或最高军事机关，不是领导核心。"}, {"chapter": "中国国防", "type": "single", "id": 36, "question": "根据（ ）和《中华人民共和国国防法》，中华人民共和国的国防领导权由中共中央、全国人大及其常务委员会、国家主席、国务院、中央军委来行驶。", "options": [{"label": "A", "text": "《中华人民共和国宪法》"}, {"label": "B", "text": "《中华人民共和国国防教育法》"}, {"label": "C", "text": "《兵役法》"}, {"label": "D", "text": "《反分裂国家法》"}], "answer": "A", "explain": "根据宪法和国防法，国防领导权由中共中央、全国人大及常委会、国家主席、国务院、中央军委行使。B项国防教育法、C项兵役法、D项反分裂国家法均不规定国防领导权的行使主体。"}, {"chapter": "中国国防", "type": "single", "id": 37, "question": "( )指的是为国家安全利益需要，提高国防能力而进行的各方面的 建设，是国家建设的重要组成部分。", "options": [{"label": "A", "text": "国防法规"}, {"label": "B", "text": "国防建设"}, {"label": "C", "text": "国防动员"}, {"label": "D", "text": "国防建设目标"}], "answer": "B", "explain": "国防建设指为国家安全利益需要、提高国防能力而进行的各方面建设，是国家建设的重要组成部分。A项国防法规是行为规则，C项国防动员是战备活动，D项国防建设目标是预期结果，均不符题意。"}, {"chapter": "中国国防", "type": "single", "id": 38, "question": "根据《中华人民共和国宪法》和（ ），中华人民共和国的国防领导权由中共中央、全国人大及其常务委员会、国家主席、国务院、中央军委来行使。", "options": [{"label": "A", "text": "《中华人民共和国国防法》"}, {"label": "B", "text": "《中华人民共和国国防教育法》"}, {"label": "C", "text": "《兵役法》"}, {"label": "D", "text": "《反分裂国家法》"}], "answer": "A", "explain": "根据宪法和国防法规定国防领导权的行使主体，二者共同构成国防领导体制的法律基础。B项国防教育法、C项兵役法、D项反分裂国家法均不涉及国防领导权行使的规定。"}, {"chapter": "中国国防", "type": "single", "id": 39, "question": "( )是党和国家的最高军事机关。", "options": [{"label": "A", "text": "国家主席"}, {"label": "B", "text": "全国人民代表大会"}, {"label": "C", "text": "国务院"}, {"label": "D", "text": "中央军事委员会"}], "answer": "D", "explain": "中央军事委员会是党和国家的最高军事机关。A项国家主席代表国家，B项全国人民代表大会是最高权力机关，C项国务院是最高行政机关，均非最高军事机关。"}, {"chapter": "中国国防", "type": "single", "id": 40, "question": "2012年9月，我国第一艘航空母舰（ ）交接入列，对于建设强大海军和维护海上安全具有深远意义。", "options": [{"label": "A", "text": "大连舰"}, {"label": "B", "text": "辽宁舰"}, {"label": "C", "text": "沈阳舰"}, {"label": "D", "text": "吉林舰"}], "answer": "B", "explain": "2012年9月我国第一艘航空母舰辽宁舰交接入列，标志着航母事业的重大突破。A项大连舰、C项沈阳舰、D项吉林舰均无此航母，我国首艘航母名为辽宁舰。"}, {"chapter": "中国国防", "type": "single", "id": 41, "question": "中国人民解放军空军成立于（ ）。", "options": [{"label": "A", "text": "1949年"}, {"label": "B", "text": "1950年"}, {"label": "C", "text": "1951年"}, {"label": "D", "text": "1952年"}], "answer": "A", "explain": "中国人民解放军空军于1949年11月11日正式宣布成立。B项1950年、C项1951年、D项1952年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 42, "question": "中国人民解放军战略支援部队成立于（ ）。", "options": [{"label": "A", "text": "2012年"}, {"label": "B", "text": "2013年"}, {"label": "C", "text": "2014年"}, {"label": "D", "text": "2015年"}], "answer": "D", "explain": "中国人民解放军战略支援部队成立于2015年。A项2012年、B项2013年、C项2014年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 43, "question": "( )是我国的根本大法，具有最高的法律效力和最大的权威。", "options": [{"label": "A", "text": "《中华人民共和国国防法》"}, {"label": "B", "text": "《中华人民共和国兵役法》"}, {"label": "C", "text": "《中华人民共和国国防教育法》"}, {"label": "D", "text": "《中华人民共和兵国宪法》"}], "answer": "D", "explain": "宪法是我国的根本大法，具有最高的法律效力和最大的权威。A项国防法、B项兵役法、C项国防教育法均是普通法律，效力低于宪法。"}, {"chapter": "中国国防", "type": "single", "id": 44, "question": "《中华人民共和国国防教育法》规定，每年9月（ ）为全民国防教育日。", "options": [{"label": "A", "text": "第一个星期六"}, {"label": "B", "text": "第二个星期六"}, {"label": "C", "text": "第三个星期六"}, {"label": "D", "text": "第四个星期六"}], "answer": "C", "explain": "每年9月第三个星期六为全民国防教育日。A项第一个星期六、B项第二个星期六、D项第四个星期六均不正确。"}, {"chapter": "中国国防", "type": "single", "id": 45, "question": "《反分裂国家法》于( ) 3月14日第十届全国人民代表大会第三次会议表决通过。", "options": [{"label": "A", "text": "2005年"}, {"label": "B", "text": "2006年"}, {"label": "C", "text": "2007年"}, {"label": "D", "text": "2008年"}], "answer": "A", "explain": "《反分裂国家法》于2005年3月14日十届全国人大三次会议表决通过。B项2006年、C项2007年、D项2008年均年份错误。"}, {"chapter": "中国国防", "type": "single", "id": 46, "question": "每年的（ ）为中国人民抗日战争胜利纪念日。", "options": [{"label": "A", "text": "8月3日"}, {"label": "B", "text": "9月3日"}, {"label": "C", "text": "8月13日"}, {"label": "D", "text": "9月13日"}], "answer": "B", "explain": "每年9月3日为中国人民抗日战争胜利纪念日。A项8月3日、C项8月13日、D项9月13日均不正确。"}, {"chapter": "中国国防", "type": "single", "id": 47, "question": "( )是国防巩固的根本。", "options": [{"label": "A", "text": "政治昌明"}, {"label": "B", "text": "经济强盛"}, {"label": "C", "text": "军备建设"}, {"label": "D", "text": "统一和民族团结"}], "answer": "A", "explain": "政治昌明是国防巩固的根本，政治清明稳定决定国防的巩固。B项经济强盛、C项军备建设、D项统一和民族团结均是国防巩固的重要条件而非根本。"}, {"chapter": "中国国防", "type": "single", "id": 48, "question": "( )是指国家为了加强防务，尤其是加强武装力量建设，用法律形式确定并以国家强制手段保证其实施的行为规则的总称。", "options": [{"label": "A", "text": "国防法规"}, {"label": "B", "text": "国防建设"}, {"label": "C", "text": "国防动员"}, {"label": "D", "text": "国防建设目标"}], "answer": "A", "explain": "国防法规是用法律形式确定并以国家强制手段保证实施的国防行为规则总称。B项国防建设是建设活动，C项国防动员是战备活动，D项国防建设目标是预期结果，均不符题意。"}, {"chapter": "中国国防", "type": "single", "id": 49, "question": "( ), 国民政府颁布了我国历史上第一部《兵役法》，宣布废除募兵制，开始实行征兵制。", "options": [{"label": "A", "text": "1930年"}, {"label": "B", "text": "1931年"}, {"label": "C", "text": "1932年"}, {"label": "D", "text": "1933年"}], "answer": "D", "explain": "1933年国民政府颁布我国历史上第一部《兵役法》，废除募兵制实行征兵制。A项1930年、B项1931年、C项1932年均年份错误。"}, {"chapter": "国家安全", "type": "single", "id": 50, "question": "不同历史时期的战略，有着不同的内容和特点，下列（ ）不是战略的决定因素。", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "战略环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "D", "explain": "经济基础不是战略的决定因素，故答案为D。战略由战略思想、战略环境、军事力量等因素决定，经济基础是客观条件而非决定因素。"}, {"chapter": "国家安全", "type": "single", "id": 51, "question": "( )是国家对待军事斗争特别是战争问题的根本立场和态度，是指导军事斗争的基本观点和理论原则。", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "战略环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "战略格局"}], "answer": "A", "explain": "战略思想是国家对待军事斗争和战争问题的根本立场、态度和指导原则。B项战略环境是客观条件，C项军事力量是物质基础，D项战略格局是力量对比结构，均不符题意。"}, {"chapter": "国家安全", "type": "single", "id": 52, "question": "战略的基本要素不包括( ) 。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "B", "explain": "战略的基本要素含目的、力量、手段、方针等，战略形式不在其中，故答案为B。A项战略目的、C项战略力量、D项战略手段均是战略的基本要素。"}, {"chapter": "国家安全", "type": "single", "id": 53, "question": "( )是战略的物质基础和支柱。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "C", "explain": "战略力量是战略的物质基础和支柱，是实施战略的实力依托。A项战略目的确定目标，B项战略方针指导全局，D项战略手段是实现途径，均非物质基础和支柱。"}, {"chapter": "国家安全", "type": "single", "id": 54, "question": "( )即筹划和指导战争全局的方略，是指根据对国际形势和敌对双方政治、军事、外交、科技、地理等诸因素的分析和判断，科学地预测战争的发生与发展，制定作战方针、作战原则和作战计划，筹划战争准备，指导战争实施所遵循的原则和方法。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略"}, {"label": "D", "text": "战略手段"}], "answer": "C", "explain": "战略是筹划和指导战争全局的方略，综合各因素预测战争并制定作战方针原则。A项战略目的、B项战略方针、D项战略手段均只是战略的构成要素，不能涵盖其全部定义。"}, {"chapter": "国家安全", "type": "single", "id": 55, "question": "(    )也称战略措施，是为准备和进行战争而实行的具有全局意义的实行战略的保障，是战略决策机构根据战争的需要，在政治、军事、外交、经济、科学技术和战略领导与指挥等方面，所采取的各种全局性的切实可行的方法和步骤。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略"}, {"label": "D", "text": "战略手段"}], "answer": "D", "explain": "战略手段也称战略措施，是为进行战争而在政治、军事、外交等方面采取的方法步骤。A项战略目的确定目标，B项战略方针指导全局，C项战略是总的方略，均不符题意。"}, {"chapter": "国家安全", "type": "single", "id": 56, "question": "战略的特点不包括( )", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "多样性"}], "answer": "D", "explain": "多样性不是战略的特点，故答案为D。战略具有全局性、对抗性、谋略性、相对稳定性等特点。A项全局性、B项对抗性、C项谋略性均为其固有特点。"}, {"chapter": "国家安全", "type": "single", "id": 57, "question": "( )在国际战略环境中最引人注目，也是世界各国研究和制定军事战略时关注的中心。", "options": [{"label": "A", "text": "时代特征"}, {"label": "B", "text": "世界战略格局"}, {"label": "C", "text": "主要国家的战略动向"}, {"label": "D", "text": "当代世界战争与和平的趋势"}], "answer": "D", "explain": "当代世界战争与和平的趋势最引人注目，是各国研究制定战略时关注的中心。A项时代特征、B项世界战略格局、C项主要国家战略动向虽重要，但均非关注的中心。"}, {"chapter": "国家安全", "type": "single", "id": 58, "question": "依照《中华人民共和国宪法》规定，中国社会主义建设事业的根本指导思想不包括（ ）。", "options": [{"label": "A", "text": "马克思列宁主义"}, {"label": "B", "text": "毛泽东思想"}, {"label": "C", "text": "邓小平理论"}, {"label": "D", "text": "江泽民思想"}], "answer": "D", "explain": "江泽民思想不属于宪法规定的根本指导思想，正确的提法是三个代表重要思想，故答案为D。A项马克思列宁主义、B项毛泽东思想、C项邓小平理论均在宪法规定之内。"}, {"chapter": "国家安全", "type": "single", "id": 59, "question": "依照《中华人民共和国宪法》规定，国家的根本任务不包括( )。", "options": [{"label": "A", "text": "大力发展文化产业"}, {"label": "B", "text": "进行社会主义现代化建设"}, {"label": "C", "text": "完成统一祖国的大业"}, {"label": "D", "text": "维护国家的独立和安全"}], "answer": "A", "explain": "大力发展文化产业不属于宪法规定的国家根本任务，故答案为A。B项社会主义现代化建设、C项统一祖国、D项维护独立和安全均为宪法规定的根本任务。"}, {"chapter": "国家安全", "type": "single", "id": 60, "question": "中国奉行（ ）的外交政策。", "options": [{"label": "A", "text": "自力更生"}, {"label": "B", "text": "自由民主"}, {"label": "C", "text": "独立自主"}, {"label": "D", "text": "联盟型"}], "answer": "C", "explain": "中国奉行独立自主的和平外交政策。A项自力更生是建设方针，B项自由民主是价值理念，D项联盟型是结盟外交，均不符。"}, {"chapter": "国家安全", "type": "single", "id": 61, "question": "2014年10月24日，包括中国、印度、新加坡等在内21个首批意向创始成员国的财长和授权代表在北京签约，共同决定成立（ ）。", "options": [{"label": "A", "text": "亚洲银行"}, {"label": "B", "text": "亚太经合组织"}, {"label": "C", "text": "经济互助委员会"}, {"label": "D", "text": "亚投行"}], "answer": "D", "explain": "2014年10月24日包括中印在内的21国在北京签约决定成立亚投行。A项亚洲银行、B项亚太经合组织、C项经济互助委员会均不是此次签约成立的组织。"}, {"chapter": "国家安全", "type": "single", "id": 62, "question": "( )是指国际社会中国际战略力量之间在一定历史时期内相互联系、相互作用而形成的具有全球性的、相对稳定的力最对比结构及基本态势。", "options": [{"label": "A", "text": "世界战略格局"}, {"label": "B", "text": "国际战略格局"}, {"label": "C", "text": "国内战略格局"}, {"label": "D", "text": "中国战略格局"}], "answer": "B", "explain": "国际战略格局指国际战略力量在一定时期相互作用而形成的全球性力量对比结构。A项世界战略格局表述过泛，C项国内战略格局、D项中国战略格局范围不符。"}, {"chapter": "国家安全", "type": "single", "id": 63, "question": "第二次世界大战后，世界秩序被重新安排，形成了以（ ）为基础的两极格局。", "options": [{"label": "A", "text": "维也纳体系"}, {"label": "B", "text": "凡尔赛——华盛顿体系"}, {"label": "C", "text": "雅尔塔体系"}, {"label": "D", "text": "多极化"}], "answer": "C", "explain": "二战后形成以雅尔塔体系为基础的两极格局，美苏对峙。A项维也纳体系、B项凡尔赛华盛顿体系均为一战前后格局，D项多极化是后冷战趋势。"}, {"chapter": "国家安全", "type": "single", "id": 64, "question": "( )使持续了近半个世纪的东西方美苏两大集团之间激烈对抗的冷战格局彻底终结。", "options": [{"label": "A", "text": "第二次世界大战"}, {"label": "B", "text": "“柏林墙”倒塌"}, {"label": "C", "text": "东欧剧变"}, {"label": "D", "text": "苏联解体"}], "answer": "D", "explain": "苏联解体使持续近半个世纪的美苏冷战格局彻底终结。A项二战是更大规模战争，B项柏林墙倒塌是东欧剧变标志，C项东欧剧变标志冷战动摇，均非最终终结。"}, {"chapter": "国家安全", "type": "single", "id": 65, "question": "( )是当今世界上规模最大、一体化程度最高的地区经济集团，具 有雄厚的经济、科技和军事实力。", "options": [{"label": "A", "text": "欧共体"}, {"label": "B", "text": "亚太经合组织"}, {"label": "C", "text": "欧盟"}, {"label": "D", "text": "亚投行"}], "answer": "C", "explain": "欧盟是当今规模最大、一体化程度最高的地区经济集团，实力雄厚。A项欧共体是欧盟前身，B项亚太经合组织是论坛性质，D项亚投行是金融组织，均不符。"}, {"chapter": "国家安全", "type": "single", "id": 66, "question": "( ) 早在1990年初就曾指出：”所谓多极，中国算一极。中国不要贬低自己，怎么样也算一极。＂", "options": [{"label": "A", "text": "邓小平"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "习近平"}], "answer": "A", "explain": "邓小平1990年初提出多极格局中中国算一极。B项江泽民、C项胡锦涛、D项习近平均非此言提出者。"}, {"chapter": "国家安全", "type": "single", "id": 67, "question": "1991年12月，欧洲马斯特里赫特首脑会议通过《马斯特里赫特条约》（简称《马约》）。1993年11月1日，《马约》正式生效，（ ）正式诞生。", "options": [{"label": "A", "text": "欧共体"}, {"label": "B", "text": "亚太经合组织"}, {"label": "C", "text": "欧盟"}, {"label": "D", "text": "亚投行"}], "answer": "C", "explain": "1993年11月1日马约正式生效，欧盟正式诞生。A项欧共体是欧盟前身，B项亚太经合组织是亚太组织，D项亚投行是金融组织，均不符。"}, {"chapter": "国家安全", "type": "single", "id": 68, "question": "美国的（ ）和战略扩张成为国际局势动荡的根源。", "options": [{"label": "A", "text": "“新干涉主义”"}, {"label": "B", "text": "“干涉主义”"}, {"label": "C", "text": "“大国主义”"}, {"label": "D", "text": "“美国队长主义”"}], "answer": "A", "explain": "美国的新干涉主义和战略扩张成为国际局势动荡的根源。B项干涉主义表述不完整，C项大国主义、D项美国队长主义均非标准提法。"}, {"chapter": "国家安全", "type": "single", "id": 69, "question": "国际战略格局的特点不包括（ ）。", "options": [{"label": "A", "text": "世界形势总体稳定，局部动荡"}, {"label": "B", "text": "大国关系相对稳定，地区国家相互靠拢"}, {"label": "C", "text": "世界军备下降幅度参差不齐，质量建军成为主要竞争形势"}, {"label": "D", "text": "美国是世界唯一超级大国，积极发动战争以获取更大的国家利益。"}], "answer": "D", "explain": "美国虽为唯一超级大国但并未因发动战争获得更大利益，此项不属于国际战略格局特点，故答案为D。A项总体稳定局部动荡、B项大国关系相对稳定、C项质量建军均是其特点。"}, {"chapter": "国家安全", "type": "single", "id": 70, "question": "1989年11月9日，“柏林墙倒塌”事件发生后，加速了（ ）的进程。", "options": [{"label": "A", "text": "第二次世界大战"}, {"label": "B", "text": "多极化格局"}, {"label": "C", "text": "东欧剧变"}, {"label": "D", "text": "苏联解体"}], "answer": "C", "explain": "1989年11月9日柏林墙倒塌加速了东欧剧变的进程。A项二战早已结束，B项多极化是长期趋势，D项苏联解体在1991年，均非此事件直接加速的进程。"}, {"chapter": "国家安全", "type": "single", "id": 71, "question": "2015年4月22日上午，亚非领导人会议在印度尼西亚首都雅加达举行。国家主席习近平出席会议并发表题为《弘扬万隆精神推进合作共赢》的重要讲话，习近平就弘扬万隆精神提出倡议，下列（ ）不是其倡议的内容。", "options": [{"label": "A", "text": "深化亚非合作，面对新机遇新挑战"}, {"label": "B", "text": "拓展南南合作"}, {"label": "C", "text": "推进南北合作"}, {"label": "D", "text": "加强同西方国家的合作和发展"}], "answer": "D", "explain": "加强同西方国家合作发展不是习近平弘扬万隆精神倡议的内容，故答案为D。A项深化亚非合作、B项拓展南南合作、C项推进南北合作均是其倡议内容。"}, {"chapter": "国家安全", "type": "single", "id": 72, "question": "在未来国际战略格局多极化发展的进程中，起主导作用的国家不包括", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "欧盟"}, {"label": "D", "text": "日本"}], "answer": "C", "explain": "欧盟不是未来多极化进程中起主导作用的国家，而是国家集团，故答案为C。A项美国、B项中国、D项日本均是以国家身份在多极化中起主导作用的主体。"}, {"chapter": "国家安全", "type": "single", "id": 73, "question": "( )是欧亚大陆心脏地带，且油气资源丰富，四周分别与俄罗斯、中国和南亚、西亚相连。", "options": [{"label": "A", "text": "东北亚"}, {"label": "B", "text": "东南亚"}, {"label": "C", "text": "南亚"}, {"label": "D", "text": "中亚"}], "answer": "D", "explain": "中亚地处欧亚大陆心脏地带，油气资源丰富，连接俄罗斯、中国与南亚西亚。A项东北亚、B项东南亚、C项南亚均不处心脏地带且地理特征不符。"}, {"chapter": "国家安全", "type": "single", "id": 74, "question": "( )是连接太平洋和印度洋的海上交通咽喉，扼控两洋航线的枢纽，是亚太各国经贸发展的“生命阀\" 。", "options": [{"label": "A", "text": "台湾海峡"}, {"label": "B", "text": "白令海峡"}, {"label": "C", "text": "马六甲海峡"}, {"label": "D", "text": "英吉利海峡"}], "answer": "C", "explain": "马六甲海峡扼控太平洋与印度洋航线枢纽，是亚太经贸发展的生命阀。A项台湾海峡、B项白令海峡、D项英吉利海峡均非连接两洋的咽喉枢纽。"}, {"chapter": "国家安全", "type": "single", "id": 75, "question": "钓鱼诸岛自古以来一直是中国领土不可分割的部分，由于中国在中日甲午战争中战败， 1895年4月17日，清政府被迫与日本签订了丧权辱国的（ ），将台湾及其附近岛屿包括钓鱼诸岛等一并割让给了日本。", "options": [{"label": "A", "text": "《辛丑条约》"}, {"label": "B", "text": "《南京条约》"}, {"label": "C", "text": "《天津条约》"}, {"label": "D", "text": "《马关条约》"}], "answer": "D", "explain": "1895年清政府战败签订《马关条约》，将台湾及钓鱼诸岛割让给日本。A项辛丑条约、B项南京条约、C项天津条约均与割让台湾及钓鱼岛无关。"}, {"chapter": "国家安全", "type": "single", "id": 76, "question": "1992年2月25日, 中国方面公布（ ），写明钓鱼岛等岛屿是中国领土。", "options": [{"label": "A", "text": "《中华人民共和国宪法》"}, {"label": "B", "text": "《中华人民共和国国防法》"}, {"label": "C", "text": "《中华人民共和国反分裂国家法》"}, {"label": "D", "text": "《中华人民共和国领海及毗连区法》"}], "answer": "D", "explain": "1992年2月25日中国公布《领海及毗连区法》，写明钓鱼岛等岛屿是中国领土。A项宪法、B项国防法、C项反分裂国家法均非此次公布的法律。"}, {"chapter": "国家安全", "type": "single", "id": 77, "question": "南海诸岛中，（ ）距离我国大陆最远、分布最广、包括岛礁最多的一个群岛，其周围海域的自然资源特别是油气蕴藏十分丰富，人称第二个波斯湾。", "options": [{"label": "A", "text": "东沙群岛"}, {"label": "B", "text": "西沙群岛"}, {"label": "C", "text": "中沙群岛"}, {"label": "D", "text": "南沙群岛"}], "answer": "D", "explain": "南沙群岛距离大陆最远、分布最广、岛礁最多，油气资源丰富称第二个波斯湾。A项东沙、B项西沙、C项中沙群岛均不符此特征。"}, {"chapter": "国家安全", "type": "single", "id": 78, "question": "中国周边安全环境的特点不包括（ ）。", "options": [{"label": "A", "text": "邻国众多，强邻环伺"}, {"label": "B", "text": "战略区位重要，大国利益交汇"}, {"label": "C", "text": "多样性突出，热点矛盾集中"}, {"label": "D", "text": "相安无事，和平安全"}], "answer": "D", "explain": "我国周边并非相安无事和平安全，故此项不属于周边安全特点，答案为D。A项邻国众多强邻环伺、B项战略区位重要、C项多样性突出热点集中均是周边安全特点。"}, {"chapter": "国家安全", "type": "single", "id": 79, "question": "大国关系的相对平稳发展是中国周边继续保持缓和的基础，下列大国关系描述错误的是（ ）。", "options": [{"label": "A", "text": "日傍美制华，并不甘心为美火中取栗。"}, {"label": "B", "text": "印美关系虽发展迅速，但印度不会全面倒向美国，沦为美遏制中国的棋子。"}, {"label": "C", "text": "美国虽视中国为主要潜在对手， 并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。"}, {"label": "D", "text": "遭受美国战略挤压的俄罗斯，在国力未得到全面恢复前，仍将是中国主要战略伙伴，中俄关系有望继续稳固发展。"}], "answer": "C", "explain": "美国虽对华防范遏制但并未要求与中国全面对抗，此描述与事实不符，故答案为C。A项日傍美制华、B项印度不倒向美国、D项中俄关系稳固发展均符合事实。"}, {"chapter": "国家安全", "type": "single", "id": 80, "question": "(    )把打击三股势力、维护地区安全与稳定作为首要任务，近年来还逐步加强合作打击中亚地区日益严重的毒品走私活动，把遏制和铲除毒品走私纳入反恐合作的框架之中。", "options": [{"label": "A", "text": "上海合作组织"}, {"label": "B", "text": "亚太经合组织"}, {"label": "C", "text": "经济互助委员会"}, {"label": "D", "text": "亚投行"}], "answer": "A", "explain": "上海合作组织以打击三股势力、维护地区安全稳定为首要任务。B项亚太经合组织、C项经济互助委员会、D项亚投行均非以反恐安全为首要任务的地区组织。"}, {"chapter": "国家安全", "type": "single", "id": 81, "question": "中国周边安全环境的发展趋势不包括( )。", "options": [{"label": "A", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "B", "text": "大国关系的相对平稳发展是中国周边继续保持缓和的基础"}, {"label": "C", "text": "地区热点发生热战的可能性较低"}, {"label": "D", "text": "非传统安全问题将成为地区安全合作的催化剂"}], "answer": "A", "explain": "我国周边恐怖主义活动并未使我国威胁增大，此项不属于周边安全趋势，答案为A。B项大国关系平稳、C项地区热点热战可能性低、D项非传统安全合作均是其趋势。"}, {"chapter": "国家安全", "type": "single", "id": 82, "question": "我国在发展大国关系政策上有新的定位，其内容不包括（ ）。", "options": [{"label": "A", "text": "是不对抗、不结盟、不针对第三国的原则定位"}, {"label": "B", "text": "是包容整体利益的双赢策略定位"}, {"label": "C", "text": "是多重角色并举、灵活多变、万变不离其宗的角色定位。"}, {"label": "D", "text": "以和平共处五项原则为政治基础"}], "answer": "D", "explain": "和平共处五项原则是我国睦邻政策的核心，而非大国关系政策的定位内容，故答案为D。A项不对抗不结盟、B项双赢策略、C项灵活角色定位均是大国关系政策的定位。"}, {"chapter": "国家安全", "type": "single", "id": 83, "question": "我国的睦邻政策是以（ ）为核心。", "options": [{"label": "A", "text": "不对抗原则"}, {"label": "B", "text": "不结盟原则"}, {"label": "C", "text": "和平共处五项原则"}, {"label": "D", "text": "不针对第三国原则"}], "answer": "C", "explain": "我国睦邻政策以和平共处五项原则为核心。A项不对抗、B项不结盟、D项不针对第三国均是大国关系政策原则，非睦邻政策核心。"}, {"chapter": "国家安全", "type": "single", "id": 84, "question": "战略的特点不包括 ( )。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "权威性"}, {"label": "D", "text": "相对稳定性"}], "answer": "C", "explain": "权威性不是战略的特点，答案为C。A项全局性、B项对抗性、D项相对稳定性均为战略的固有特点。"}, {"chapter": "国家安全", "type": "single", "id": 85, "question": "1955年万隆会议，（ ）不负众望，以卓越的外交才能在会议上三次力挽狂澜，树立了和平共处、求同存异的“万隆精神”。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "周恩来"}, {"label": "C", "text": "朱德"}, {"label": "D", "text": "林彪"}], "answer": "B", "explain": "1955年万隆会议上周恩来以卓越外交才能三次力挽狂澜，树立求同存异的万隆精神。A项毛泽东、C项朱德、D项林彪均未参加万隆会议发挥此作用。"}, {"chapter": "国家安全", "type": "single", "id": 86, "question": "2015年5月18日，黑龙江省政府批准将黑河市爱辉区爱辉镇政区名称用字恢复为瑷珲，这一名称恢复可以让世人永铭惨痛的历史，因为瑷珲是（ ）签订地", "options": [{"label": "A", "text": "《辛丑条约》"}, {"label": "B", "text": "《南京条约》"}, {"label": "C", "text": "《瑷珲条约》"}, {"label": "D", "text": "《马关条约》"}], "answer": "C", "explain": "瑷珲是1858年《瑷珲条约》签订地，清政府在此割让大片领土。A项辛丑条约、B项南京条约、D项马关条约均非在瑷珲签订。"}, {"chapter": "国家安全", "type": "single", "id": 87, "question": "(   ) 9月7日， 习近平主席在哈萨克斯坦发表重要演讲，首次提出了加强政策沟通、道路联通、贸易畅通、货币流通、民心相通，共同建设“丝绸之路经济带”的战略倡议。", "options": [{"label": "A", "text": "2012年"}, {"label": "B", "text": "2013年"}, {"label": "C", "text": "2014年"}, {"label": "D", "text": "2015年"}], "answer": "B", "explain": "2013年9月7日习近平在哈萨克斯坦首次提出共建丝绸之路经济带倡议。A项2012年、C项2014年、D项2015年均年份错误。"}, {"chapter": "国家安全", "type": "single", "id": 88, "question": "2015年3月12日，（ ）正式申请加入亚投行，成为首个申请加入亚投行的主要西方国家。", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "英国"}, {"label": "C", "text": "法国"}, {"label": "D", "text": "德国"}], "answer": "B", "explain": "2015年3月12日英国正式申请加入亚投行，是首个申请加入的主要西方国家。A项美国、C项法国、D项德国均非首个申请加入的主要西方国家。"}, {"chapter": "国家安全", "type": "single", "id": 89, "question": "战略是国家关于军事问题的最高决策，处于军事领域的最高层次，统筹军事斗争的各个方面和各个部分，指导军事斗争的全部过程，是各项工作的和总纲，是各种活动的依据，因此战略具有（ ）的特点。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "相对稳定性"}], "answer": "A", "explain": "战略统筹全局、指导全面、是各项工作的总纲，体现其全局性特点。B项对抗性、C项谋略性、D项相对稳定性均非题干所描述的统筹全面的特征。"}, {"chapter": "国家安全", "type": "single", "id": 90, "question": "战略是主客观结合的产物。战略的重点和枢纽的把握，战略方针的确定，军事力量和斗争方式的运用，战略调整和转变等，这些活动都是计谋、策略、艺术的结合，是智与谋的生动表现，这表明战略具有（ ）的特点。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "相对稳定性"}], "answer": "C", "explain": "战略中方针确定、力量运用、调整转变均体现智谋结合，表明其谋略性特点。A项全局性、B项对抗性、D项相对稳定性均非题干所述智谋艺术结合的特征。"}, {"chapter": "国家安全", "type": "single", "id": 91, "question": "( )是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性的影响。", "options": [{"label": "A", "text": "文化"}, {"label": "B", "text": "政治"}, {"label": "C", "text": "教育制度"}, {"label": "D", "text": "经济"}], "answer": "B", "explain": "政治是国内政治环境的本质和核心，对军事斗争全局具有决定性影响。A项文化、C项教育制度、D项经济均非国内政治环境的核心。"}, {"chapter": "国家安全", "type": "single", "id": 92, "question": "战略的基本要素包括（ ）。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略方向"}, {"label": "D", "text": "战略体制"}], "answer": "A", "explain": "战略的基本要素包括战略目的，它是战略的首要要素。B项战略形式、C项战略方向、D项战略体制均非战略基本要素的组成部分。"}, {"chapter": "国家安全", "type": "single", "id": 93, "question": "中国周边安全环境的特点没有（ ）。", "options": [{"label": "A", "text": "邻国众多，强邻环伺"}, {"label": "B", "text": "战略区位重要，大国利益交汇"}, {"label": "C", "text": "多性突出，热点矛盾集中"}, {"label": "D", "text": "相安无事，和平安全"}], "answer": "D", "explain": "我国周边并非相安无事和平安全，故此项不属于周边安全特点，答案为D。A项邻国众多强邻环伺、B项战略区位重要、C项多样性突出热点集中均是周边安全特点。"}, {"chapter": "国家安全", "type": "single", "id": 94, "question": "第二次世界大战以前，国际秩序的本质特征是（ ）。", "options": [{"label": "A", "text": "强权政治"}, {"label": "B", "text": "单极化"}, {"label": "C", "text": "封建政治"}, {"label": "D", "text": "多极化"}], "answer": "A", "explain": "二战前国际秩序的本质特征是强权政治，列强以武力瓜分世界。B项单极化、C项封建政治、D项多极化均不符二战前国际秩序的本质。"}, {"chapter": "国家安全", "type": "single", "id": 95, "question": "美国的（ ）成为国际局势动荡的根源。", "options": [{"label": "A", "text": "“新干涉主义”"}, {"label": "B", "text": "“干涉主义”"}, {"label": "C", "text": "“大国主义”"}, {"label": "D", "text": "战略干涉"}], "answer": "A", "explain": "美国的新干涉主义是国际局势动荡的根源。B项干涉主义表述不完整，C项大国主义、D项战略干涉均非标准提法。"}, {"chapter": "国家安全", "type": "single", "id": 96, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略形式"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "C", "explain": "军事力量是战略的物质基础和决定因素，故为其决定因素，答案为C。A项战略形式非基本要素，B项政治环境、D项经济基础均非战略的决定因素。"}, {"chapter": "国家安全", "type": "single", "id": 97, "question": "战略的特点不包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "多样性"}], "answer": "D", "explain": "多样性不是战略的特点，答案为D。A项全局性、B项对抗性、C项谋略性均为战略的固有特点。"}, {"chapter": "国家安全", "type": "single", "id": 98, "question": "我国在发展大国关系政策上有新的定位坚持的原则不包括（ ）。", "options": [{"label": "A", "text": "不对抗"}, {"label": "B", "text": "不结盟"}, {"label": "C", "text": "不合作"}, {"label": "D", "text": "不针对第三国"}], "answer": "C", "explain": "不合作不是我国发展大国关系的原则，答案为C。我国坚持不对抗、不结盟、不针对第三国的原则，A项不对抗、B项不结盟、D项不针对第三国均属其内容。"}, {"chapter": "国家安全", "type": "single", "id": 99, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "日本"}, {"label": "B", "text": "沙特"}, {"label": "C", "text": "超限"}, {"label": "D", "text": "以色列"}], "answer": "C", "explain": "超限是核武器部署概念而非国家，中国周边有核国家包括印度、巴基斯坦、俄罗斯等，故答案为C。A项日本、B项沙特、D项以色列均不属此列。"}, {"chapter": "军事思想", "type": "single", "id": 100, "question": "( )提出“我们必须统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会进程中实现富国和强军的统一”。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "D", "explain": "胡锦涛提出统筹经济建设和国防建设，走中国特色军民融合式发展路子。A项毛泽东、B项邓小平、C项江泽民均未提出此军民融合式发展论述。"}, {"chapter": "军事思想", "type": "single", "id": 101, "question": "军事思想来源于社会实践，在阶级社会中，人们为了各自阶级的利益，所奉行和推崇的军事思想，必然反映各个阶级对战争和军队建设的认识和立场，因此军事思想具有（ ）", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "丰富的实践性"}, {"label": "D", "text": "明显的继承性"}], "answer": "A", "explain": "军事思想反映各阶级对战争和军队建设的立场和认识，因而具有鲜明的阶级性。B项时代感、C项实践性、D项继承性虽也是特征，但题干所反映的是阶级利益立场。"}, {"chapter": "军事思想", "type": "single", "id": 102, "question": "一般认为我国古代军事思想的初步形成于（  ） 时期。", "options": [{"label": "A", "text": "夏商周"}, {"label": "B", "text": "春秋战国"}, {"label": "C", "text": "秦朝"}, {"label": "D", "text": "汉朝"}], "answer": "A", "explain": "我国古代军事思想初步形成于夏商周时期。B项春秋战国是成熟时期，C项秦朝、D项汉朝均晚于初步形成时期。"}, {"chapter": "军事思想", "type": "single", "id": 103, "question": "春秋战国时期，我国古代军事思想已基本成熟，（  ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《三略》"}], "answer": "D", "explain": "《三略》相传为秦汉之际或更晚的兵书，非春秋战国时期兵书，答案为D。A项《六韬》、B项《孙膑兵法》、C项《尉缭子》均为春秋战国时期影响较大的兵书。"}, {"chapter": "军事思想", "type": "single", "id": 104, "question": "一般认为我国古代军事思想在（ ）时期进入系统化、体系化阶段。", "options": [{"label": "A", "text": "夏商周"}, {"label": "B", "text": "春秋战国"}, {"label": "C", "text": "秦至五代"}, {"label": "D", "text": "宋至清前期"}], "answer": "D", "explain": "我国古代军事思想在宋至清前期进入系统化、体系化阶段，答案为D。A项夏商周是初步形成，B项春秋战国是成熟，C项秦至五代是丰富发展阶段。"}, {"chapter": "军事思想", "type": "single", "id": 105, "question": "宋神宗时期，把《孙子兵法》、《孙胺兵法》、《六韬》、《尉缭子》、《司马法》、《李卫公问对》和（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《黄石公三略》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《吴子》"}, {"label": "D", "text": "《太白阴经》"}], "answer": "B", "explain": "宋神宗将《孙子兵法》《孙膑兵法》《六韬》《尉缭子》《司马法》《李卫公问对》和《三略》合称《武经七书》。A项《黄石公三略》即三略的古称但非书名原称，C项《吴子》、D项《太白阴经》均不在七书之列。"}, {"chapter": "军事思想", "type": "single", "id": 106, "question": "中国第一部军制史专著是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "A", "explain": "《历代兵制》是中国第一部军制史专著。B项《百将传》是名将传记，C项《武经总要》是军事类书，D项《读史方舆纪要》是军事地理专著，均不符。"}, {"chapter": "军事思想", "type": "single", "id": 107, "question": "中国第一部名将传记是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "B", "explain": "《百将传》是中国第一部专门辑录名将生平的名将传记。A项《历代兵制》是军制史，C项《武经总要》是军事类书，D项《读史方舆纪要》是军事地理专著，均不符。"}, {"chapter": "军事思想", "type": "single", "id": 108, "question": "中国第一部专门军事类书是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "C", "explain": "《武经总要》是中国第一部专门军事类书。A项《历代兵制》是军制史，B项《百将传》是名将传记，D项《读史方舆纪要》是军事地理专著，均不符。"}, {"chapter": "军事思想", "type": "single", "id": 109, "question": "中国第一部军事地理学专著是（ ）", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "D", "explain": "《读史方舆纪要》是中国第一部军事地理学专著。A项《历代兵制》是军制史，B项《百将传》是名将传记，C项《武经总要》是军事类书，均不符。"}, {"chapter": "军事思想", "type": "single", "id": 110, "question": "与中国古代军事思想相比，世界古代军事思想起步较晚，没有反映该时期军事思想的著作是（ ）。", "options": [{"label": "A", "text": "《伯罗奔尼撒战争史》"}, {"label": "B", "text": "《希腊波斯战争史》"}, {"label": "C", "text": "《长征记》"}, {"label": "D", "text": "《战争艺术概论》"}], "answer": "D", "explain": "《战争艺术概论》是近代约米尼所著，不属于世界古代军事思想著作，答案为D。A项《伯罗奔尼撒战争史》、B项《希腊波斯战争史》、C项《长征记》均为世界古代军事思想著作。"}, {"chapter": "军事思想", "type": "single", "id": 111, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "A", "explain": "此五说从不同侧面论述战争凶险、重大、诡诈、文武、礼义的本质，体现战争本质观，答案为A。B项起源、C项起因、D项态度均非题干所述战争本体的论述。"}, {"chapter": "军事思想", "type": "single", "id": 112, "question": "认为战争并不是自有人类以来就有的，战争是人类社会发展到一定历史阶段的产物。这体现了中国古代军事思想战争论中战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "B", "explain": "战争并非从来就有而是社会发展到一定阶段的产物，体现战争起源观，答案为B。A项本质、C项起因、D项态度均非题干所述战争产生历史的论述。"}, {"chapter": "军事思想", "type": "single", "id": 113, "question": "“人口论”认为，古时候人少、财物多，所以没有争斗和战争，后来人口不断增多，社会财富相对减少，人们为了争夺生存条件就发生了战争。这体现了中国古代军事思想战争论中战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "C", "explain": "人口论以人口增长争夺生存条件解释战争产生，体现战争起因观，答案为C。A项本质、B项起源、D项态度均不符人口论所论述的战争直接原因。"}, {"chapter": "军事思想", "type": "single", "id": 114, "question": "习近平国防和军队建设重要论述的主要内容不包括（ ）。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "A", "explain": "以人为本是胡锦涛的建军治军原则，不属于习近平国防和军队建设论述内容，答案为A。B项听党指挥能打胜仗、C项绝对忠诚纯洁可靠、D项召之即来来之能战均属习近平论述。"}, {"chapter": "军事思想", "type": "single", "id": 115, "question": "春秋战国时期，我国古代军事思想已基本成熟，（ ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《尉缭子》"}, {"label": "C", "text": "《太白阴经》"}, {"label": "D", "text": "《孙胺兵法》"}], "answer": "C", "explain": "《太白阴经》是唐代兵书，不属于春秋战国时期影响较大的兵书，答案为C。A项《六韬》、B项《尉缭子》、D项《孙膑兵法》均为春秋战国时期的重要兵书。"}, {"chapter": "军事思想", "type": "single", "id": 116, "question": "对待战争的态度中，（ ）认为战争并不是绝对的坏事，对战争要具体分析，明确表明要支持正义战争，反对非正义战争。", "options": [{"label": "A", "text": "兵战兴邦论"}, {"label": "B", "text": "偃兵废武论"}, {"label": "C", "text": "穷兵赎武论"}, {"label": "D", "text": "义兵慎战论"}], "answer": "D", "explain": "义兵慎战论主张支持正义战争、反对非正义战争，对战争需具体分析，答案为D。A项兵战兴邦论主张以战强国，B项偃兵废武论主张废除战争，C项穷兵黩武论主张滥用武力，均不符。"}, {"chapter": "军事思想", "type": "single", "id": 117, "question": "明太祖在《谕将帅》中提出“发兵为诛暴，诛暴为保民”，“诛暴保民论”体现了中国古代军事思想中战争论的（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "B", "explain": "诛暴保民论体现战争和平观，主张以战止战、战争为了和平保民，答案为B。A项本质观、C项政治观、D项经济观均非诛暴保民所体现的观点。"}, {"chapter": "军事思想", "type": "single", "id": 118, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论的（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "A", "explain": "此五说论述战争的凶险、重大、诡诈等本质特征，体现战争本质观，答案为A。B项和平观、C项政治观、D项经济观均不符题意。"}, {"chapter": "军事思想", "type": "single", "id": 119, "question": "不属于毛泽东军事理论创新的是（ ）。", "options": [{"label": "A", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}, {"label": "B", "text": "创建了一支新型的人民军队"}, {"label": "C", "text": "创造了适合中国特点的人民战争的战略战术"}, {"label": "D", "text": "建设一支强大的现代化正规化的革命军队"}], "answer": "D", "explain": "建设一支强大的现代化正规化革命军队是邓小平的思想，非毛泽东军事理论创新，答案为D。A项农村包围城市、B项创建新型人民军队、C项人民战争战略战术均为毛泽东的军事理论创新。"}, {"chapter": "军事思想", "type": "single", "id": 120, "question": "《淮南子》中指出“兵之胜败，本在于政”，这体现了中国古代军事思想中战争论的（）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "C", "explain": "兵之胜败本在于政，强调政治决定战争胜负，体现战争政治观，答案为C。A项本质观、B项和平观、D项经济观均不符题意。"}, {"chapter": "军事思想", "type": "single", "id": 121, "question": "“没有一个人民的军队，便没有人民的一切”，这是（ ）提出的人民军队的思想。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "邓小平"}], "answer": "A", "explain": "毛泽东提出没有一个人民的军队便没有人民的一切。B项江泽民、C项胡锦涛、D项邓小平均非此论断提出者。"}, {"chapter": "军事思想", "type": "single", "id": 122, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "严格的强制性"}, {"label": "B", "text": "鲜明的阶级性"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "公开的有限性"}], "answer": "B", "explain": "军事思想特征包括鲜明的阶级性、强烈的时代感、丰富的实践性、明显的继承性等，答案为B。A项强制性、C项权威性、D项公开有限性均非军事思想的特征而是法规特性。"}, {"chapter": "军事思想", "type": "single", "id": 123, "question": "朱神宗时期， 把《孙子兵法》、 《孙胺兵法》、 《六韬》、 《尉缭子》等七部兵书作为武学必修课程，统称为《武经七书》，下列（ ）不是《武经七书》的部分。", "options": [{"label": "A", "text": "《隆中对》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《李卫公问对》"}], "answer": "A", "explain": "《隆中对》是战略策论而非《武经七书》之兵书，答案为A。B项《三略》、C项《司马法》、D项《李卫公问对》均为《武经七书》的组成部分。"}, {"chapter": "军事思想", "type": "single", "id": 124, "question": "《孙子兵法》中强调“上兵伐谋，其次伐交”，这体现了中国古代军事思想战备论中战备的内容是（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "经济上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "外交上备战"}], "answer": "D", "explain": "上兵伐谋其次伐交强调以外交手段分化敌人，体现外交上备战，答案为D。A项政治上备战、B项经济上备战、C项思想上备战均非伐交所体现的内容。"}, {"chapter": "军事思想", "type": "single", "id": 125, "question": "( )军事理论的诞生，为人们研究和解决军事领域的问题提供了科学的基本观点和方法，为无产阶级军事思想的发展奠定了坚实的理论基础。", "options": [{"label": "A", "text": "列宁主义"}, {"label": "B", "text": "马克思主义"}, {"label": "C", "text": "恩格斯主义"}, {"label": "D", "text": "毛泽东思想"}], "answer": "B", "explain": "马克思主义军事理论为研究解决军事问题提供科学观点和方法，奠定无产阶级军事思想基础，答案为B。A项列宁主义、C项恩格斯主义、D项毛泽东思想均非此理论基础的最初来源。"}, {"chapter": "军事思想", "type": "single", "id": 126, "question": "我国古代的军事家、政治家认为战备的最高标准和目标，就是在政治、经济、军事、技术等各有关决定战争胜负的诸因素方面，相对于敌人来说都要占有绝对优势。这体现了备战的（ ）", "options": [{"label": "A", "text": "超前性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "整体性原则"}, {"label": "D", "text": "隐蔽性原则"}], "answer": "B", "explain": "战备最高目标是相对敌人各因素占绝对优势，体现超盖性原则，答案为B。A项超前性、C项整体性、D项隐蔽性均非题干所述绝对优势的要求。"}, {"chapter": "军事思想", "type": "single", "id": 127, "question": "“耕战并重”强调了备战的（ ）。", "options": [{"label": "A", "text": "相称性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "求已性原则"}, {"label": "D", "text": "平战结合原则"}], "answer": "D", "explain": "耕战并重强调平时农战结合，体现平战结合原则，答案为D。A项相称性、B项超盖性、C项求已性均非耕战并重所体现的原则。"}, {"chapter": "军事思想", "type": "single", "id": 128, "question": "春秋战国时期，我国古代军事思想已基本成熟，（ ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《李卫公问对》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《孙胺兵法》"}], "answer": "B", "explain": "《李卫公问对》是唐代兵书，不属于春秋战国时期影响较大的兵书，答案为B。A项《六韬》、C项《尉缭子》、D项《孙膑兵法》均为春秋战国时期的兵书。"}, {"chapter": "军事思想", "type": "single", "id": 129, "question": "( )后，确定了以毛泽东为首的党中央领导集体。", "options": [{"label": "A", "text": "八七会议"}, {"label": "B", "text": "遵义会议"}, {"label": "C", "text": "瓦窑堡会议"}, {"label": "D", "text": "洛川会议"}], "answer": "B", "explain": "遵义会议后确定了以毛泽东为首的党中央领导集体。A项八七会议、C项瓦窑堡会议、D项洛川会议均未确立毛泽东的领导核心地位。"}, {"chapter": "军事思想", "type": "single", "id": 130, "question": "戚继光的《纪效新书》中指出“有精器而无精兵以用之，是谓徒费；有精兵而无精器，是谓徒强”，这体现了中国古代军事思想中治军论的（ ）。", "options": [{"label": "A", "text": "国以军为辅"}, {"label": "B", "text": "兵不在众，以治为胜"}, {"label": "C", "text": "凡兵，制必先定"}, {"label": "D", "text": "凡胜，备必先具"}], "answer": "D", "explain": "有精器有精兵方能制胜强调装备与人结合，体现凡胜备必先具的观点，答案为D。A项国以军为辅、B项兵不在众以治为胜、C项凡兵制必先定均不符题意。"}, {"chapter": "军事思想", "type": "single", "id": 131, "question": "江泽民国防和军队建设思想的理论体系不包括( )。", "options": [{"label": "A", "text": "解决好打得赢、不变质两个历史性课题"}, {"label": "B", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "坚持依法治军、从严治军"}], "answer": "C", "explain": "把科学发展观作为指导方针是胡锦涛思想，非江泽民国防军队建设思想体系内容，答案为C。A项解决好两个课题、B项五句话总要求、D项依法治军从严治军均属江泽民思想。"}, {"chapter": "军事思想", "type": "single", "id": 132, "question": "诸葛亮强调“夫用兵之道，必定其谋”， 这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "致人而不致于人"}], "answer": "A", "explain": "夫用兵之道必定其谋体现了用兵之道先谋为本的观点，答案为A。B项先胜而后求战、C项因机立胜、D项致人而不致于人均不符合定谋为本的含义。"}, {"chapter": "军事思想", "type": "single", "id": 133, "question": "不属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "提高军队建设的正规化水平"}, {"label": "B", "text": "坚定不移地走有中国特色的精兵之路"}, {"label": "C", "text": "中心是解决现代化的问题"}, {"label": "D", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}], "answer": "D", "explain": "农村包围城市武装夺取政权是毛泽东军事理论，非邓小平新时期军队建设思想，答案为D。A项提高正规化水平、B项走精兵之路、C项解决现代化问题均为邓小平军队建设思想。"}, {"chapter": "军事思想", "type": "single", "id": 134, "question": "下列没有体现中国古代军事思想用兵论中“用兵之道，先谋为本”的观点是（ ）。", "options": [{"label": "A", "text": "备必预具，虑必先定"}, {"label": "B", "text": "夫用兵之道，必先定其谋"}, {"label": "C", "text": "勇不足恃，用兵在先定谋"}, {"label": "D", "text": "兵不在众，以治为胜"}], "answer": "D", "explain": "兵不在众以治为胜属治军论，未体现用兵先谋为本的观点，答案为D。A项备必预具、B项必先定其谋、C项勇不足恃先定谋均体现先谋为本的观点。"}, {"chapter": "军事思想", "type": "single", "id": 135, "question": "孙武指出“兵贵胜，不贵久”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "兵之情主速"}], "answer": "D", "explain": "兵贵胜不贵久强调速战速决，体现兵之情主速的观点，答案为D。A项先谋为本、B项先胜而后求战、C项因机立胜均不符兵贵神速的含义。"}, {"chapter": "军事思想", "type": "single", "id": 136, "question": "习近平国防和军队建设重要论述的主要内容不包括（ ）。", "options": [{"label": "A", "text": "始终保持我军光荣传统和优良作风"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "C", "explain": "把科学发展观作为指导方针是胡锦涛思想，不属于习近平国防军队建设论述内容，答案为C。A项保持光荣传统、B项造就军事人才、D项完善军事制度均属习近平论述。"}, {"chapter": "军事思想", "type": "single", "id": 137, "question": "( )运用辩证唯物主义和历史唯物主义的原理，研究指导中国革命战争，创造性地提出了“军事辩证法”这一概念。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "邓小平"}], "answer": "A", "explain": "毛泽东运用辩证唯物主义和历史唯物主义创造性地提出军事辩证法概念。B项江泽民、C项胡锦涛、D项邓小平均非此概念的提出者。"}, {"chapter": "军事思想", "type": "single", "id": 138, "question": "《兵畾三十六年·迅》中提出“时不再来，机不可失，则速攻之，速围之，速逐之，速持捣之，靡有不胜”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "兵之情主速"}], "answer": "D", "explain": "时不再来机不可失速攻速围强调快速行动，体现兵之情主速的观点，答案为D。A项先谋为本、B项先胜而后求战、C项因机立胜均不符迅速行动的含义。"}, {"chapter": "军事思想", "type": "single", "id": 139, "question": "下列没有体现中国古代军事思想用兵论中“兵之情主速＂的观点是（ ）。", "options": [{"label": "A", "text": "兵贵胜，不贵久"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "夫用兵之道，必先定其谋"}, {"label": "D", "text": "兵闻拙速，未睹巧之久也"}], "answer": "C", "explain": "夫用兵之道必先定其谋属于先谋为本，未体现兵之情主速的观点，答案为C。A项兵贵胜不贵久、B项久则钝兵、D项兵闻拙速均体现速战速决的观点。"}, {"chapter": "军事思想", "type": "single", "id": 140, "question": "《太白阴经》强调“道贵制人，不贵制于人；制人者握权，制于人者遵命也”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "致人而不致于人"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "B", "explain": "道贵制人不贵制于人强调掌握主动权调动敌人，体现致人而不致于人的观点，答案为B。A项先谋为本、C项因机立胜、D项先胜而后求战均不符掌握主动权调动敌人的含义。"}, {"chapter": "军事思想", "type": "single", "id": 141, "question": "( )指出：“我们未来反侵略战争，究竟采取什么样的战略方针？我赞成就是‘积极防御’四个字。”", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "B", "explain": "邓小平提出未来反侵略战争采取积极防御的战略方针。A项毛泽东、C项江泽民、D项胡锦涛均非此言提出者。"}, {"chapter": "军事思想", "type": "single", "id": 142, "question": "岳飞讲“运用之妙，存乎一心”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道， 先谋为本"}, {"label": "B", "text": "致人而不致于人"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "C", "explain": "运用之妙存乎一心强调灵活用兵把握战机，体现因机立胜的观点，答案为C。A项先谋为本、B项致人而不致于人、D项先胜而后求战均不符灵活把握战机的含义。"}, {"chapter": "军事思想", "type": "single", "id": 143, "question": "( )提出“部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力”。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "C", "explain": "江泽民提出部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力的五句话总要求。A项毛泽东、B项邓小平、D项胡锦涛均非此要求的提出者。"}, {"chapter": "军事思想", "type": "single", "id": 144, "question": "《尉缭子》中认为“权先加人者，兵敌不力交；武先加人者，敌无威接”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "攻是守之机， 守是攻之策"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "B", "explain": "权武先加人者强调攻守互相依存转化，体现攻是守之机、守是攻之策的观点，答案为B。A项先谋为本、C项因机立胜、D项先胜而后求战均不符攻守转化的含义。"}, {"chapter": "军事思想", "type": "single", "id": 145, "question": "胡锦涛国防和军队建设思想的主要内容不包括( )。", "options": [{"label": "A", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "B", "text": "积极推进国防和军队建设各领域改革"}, {"label": "C", "text": "把以人为本作为重要的建军治军原则"}, {"label": "D", "text": "走中国特色军民融合式发展的路。"}], "answer": "A", "explain": "按照五句话总要求加强军队建设是江泽民思想，非胡锦涛国防军队建设思想内容，答案为A。B项推进各领域改革、C项以人为本建军治军、D项军民融合式发展均属胡锦涛思想。"}, {"chapter": "军事思想", "type": "single", "id": 146, "question": "《淮南子》中提出“良将之用卒也，同其心，一其力”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "激人之心，励士之气"}, {"label": "D", "text": "兵之情主速"}], "answer": "C", "explain": "良将同其心一其力强调凝聚军心士气，体现激人之心、励士之气的观点，答案为C。A项先谋为本、B项先胜而后求战、D项兵之情主速均不符凝聚士气的含义。"}, {"chapter": "军事思想", "type": "single", "id": 147, "question": "( )根据现代战争的特点和规律，结合我国的实际情况，提出了“现代条件下人民战争＂的思想。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "B", "explain": "邓小平提出现代条件下人民战争的思想。A项毛泽东、C项江泽民、D项胡锦涛均非此思想的提出者。"}, {"chapter": "军事思想", "type": "single", "id": 148, "question": "(   )提出“实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。可以说，这个梦想是强国梦，对军队来说，也是强军梦。我们要实现中华民族伟大复兴，必须坚持富国和强军相统一，努力建设巩固国防和强大军队。", "options": [{"label": "A", "text": "邓小平"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "习近平"}], "answer": "D", "explain": "习近平提出强军梦，强调富国和强军相统一、建设巩固国防和强大军队。A项邓小平、B项江泽民、C项胡锦涛均非此论述的提出者。"}, {"chapter": "军事思想", "type": "single", "id": 149, "question": "《吕氏春秋》指出“以人之小恶，亡人之大美，此人主之所以失天下之士也”，这体现了中国古代军事思想中将帅选拔任用的（ ）原则。", "options": [{"label": "A", "text": "全面性"}, {"label": "B", "text": "辩证性"}, {"label": "C", "text": "优化性"}, {"label": "D", "text": "开放性"}], "answer": "B", "explain": "不因小恶弃大美体现看人一分为二的辩证观点，体现将帅选拔任用的辩证性原则，答案为B。A项全面性、C项优化性、D项开放性均不符一分为二看人的要求。"}, {"chapter": "现代理论", "type": "single", "id": 150, "question": "最早提出信息战概念的人是（ ）。", "options": [{"label": "A", "text": "钱学森"}, {"label": "B", "text": "沈伟光"}, {"label": "C", "text": "钱三强"}, {"label": "D", "text": "邓稼先"}], "answer": "B", "explain": "中国学者沈伟光最早提出信息战概念。A项钱学森、C项钱三强、D项邓稼先均为科学家，未提出信息战概念。"}, {"chapter": "现代理论", "type": "single", "id": 151, "question": "社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为( )。", "options": [{"label": "A", "text": "\"第三次浪潮战争\""}, {"label": "B", "text": "\"第四次浪潮战争\""}, {"label": "C", "text": "\" 第五代战争\""}, {"label": "D", "text": "\"非接触战争”"}], "answer": "A", "explain": "托夫勒从文明演进角度将信息化战争称为第三次浪潮战争。B项第四次浪潮、C项第五代战争、D项非接触战争均非托夫勒的提法。"}, {"chapter": "现代理论", "type": "single", "id": 152, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为（ ）。", "options": [{"label": "A", "text": "第三次浪潮战争"}, {"label": "B", "text": "第四次浪潮战争"}, {"label": "C", "text": "第五代战争"}, {"label": "D", "text": "第六代战争"}], "answer": "D", "explain": "斯里普琴科从武器装备发展角度将信息化战争称为第六代战争。A项第三次浪潮、B项第四次浪潮、C项第五代战争均非斯里普琴科的提法。"}, {"chapter": "现代理论", "type": "single", "id": 153, "question": "中国著名的军事理论家（ ），早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。", "options": [{"label": "A", "text": "孙权"}, {"label": "B", "text": "孙胺"}, {"label": "C", "text": "孙武"}, {"label": "D", "text": "孙文"}], "answer": "C", "explain": "孙武两千多年前提出不战而屈人之兵，这是信息战的核心宗旨。A项孙权、B项孙膑、D项孙文均非此论断的提出者。"}, {"chapter": "现代理论", "type": "single", "id": 154, "question": "首次利用空中卫星进行战场侦察的战争是 ( )。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "第四次中东战争首次利用空中卫星进行战场侦察。A项朝鲜战争、C项马岛战争、D项海湾战争均非首次利用卫星侦察的战争。"}, {"chapter": "现代理论", "type": "single", "id": 155, "question": "( ) 中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "C", "explain": "马岛战争中交战双方第一次大规模集中使用17种类型制导武器对抗。A项朝鲜战争、B项第四次中东战争、D项海湾战争均无此大规模使用制导武器的记录。"}, {"chapter": "现代理论", "type": "single", "id": 156, "question": "( )中，英军还以“竞技神”号、“无敌”号航空母舰上的电子干扰系统和＂鸥＂式直升机上的机载干扰系统，对阿军的袭击兵器和指挥控制系统实施了电磁干扰与压制。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "C", "explain": "马岛战争中英军以电子干扰系统对阿军实施电磁干扰与压制。A项朝鲜战争、B项第四次中东战争、D项海湾战争均非此次电磁干扰事件。"}, {"chapter": "现代理论", "type": "single", "id": 157, "question": "( )中，美国军队依靠优势空中力量进行长时间“地毯式轰炸＂的空袭作战，以及直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "越南战争中美军以空中优势进行地毯式轰炸及直升机与特种部队结合的蛙跳式作战。A项朝鲜战争、C项马岛战争、D项海湾战争均无此独特作战方式。"}, {"chapter": "现代理论", "type": "single", "id": 158, "question": "标志着高技术战争的发展进入成熟阶段的是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争标志着高技术战争发展进入成熟阶段。A项朝鲜战争、B项越南战争、C项马岛战争均为高技术战争萌芽或形成阶段，非成熟阶段。"}, {"chapter": "现代理论", "type": "single", "id": 159, "question": "()中的通信系统建设被称为“军事史上一次最大的通信系统专项工程 ” 。", "options": [{"label": "A", "text": "朝鲜战"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争的通信系统建设被称为军事史上最大的一次通信系统专项工程。A项朝鲜战争、B项越南战争、C项马岛战争均无此通信系统专项工程之称。"}, {"chapter": "现代理论", "type": "single", "id": 160, "question": "( )中，开创了“爱国者”导弹成功拦截“飞毛腿”导弹的先例。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争中爱国者导弹成功拦截飞毛腿导弹开创了导弹拦截先例。A项朝鲜战争、B项越南战争、C项马岛战争均无此导弹拦截记录。"}, {"chapter": "现代理论", "type": "single", "id": 161, "question": "对越南战争描述不正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了2艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合， 进行“蛙跳” 式的袭击作战。"}], "answer": "B", "explain": "首次利用卫星战场侦察发生在第四次中东战争，越南战争中未出现此项，答案为B。A项处于萌芽阶段、C项动用大量航母、D项蛙跳式作战等描述均符合越南战争实际。"}, {"chapter": "现代理论", "type": "single", "id": 162, "question": "高技术战争的初期发展与基本形成阶段中， 不是该阶段的战争是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "第五次中东战争"}], "answer": "A", "explain": "朝鲜战争早于高技术战争初期形成阶段，不属于该阶段战争，答案为A。B项第四次中东战争、C项马岛战争、D项第五次中东战争均属高技术战争初期形成阶段。"}, {"chapter": "现代理论", "type": "single", "id": 163, "question": "对第四次中东战争描述不正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "在第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "第四次中东战争中，首次利用空中卫星进行战场侦察。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "D", "explain": "大规模集中使用17种制导武器发生于马岛战争，非第四次中东战争，答案为D。A项处于初期形成阶段、B项普遍运用各型导弹、C项首次卫星侦察均符合第四次中东战争实际。"}, {"chapter": "现代理论", "type": "single", "id": 164, "question": "我国第一款自主研制的预警机是（ ）。", "options": [{"label": "A", "text": "空警-1999"}, {"label": "B", "text": "空警-2000"}, {"label": "C", "text": "空警-2001"}, {"label": "D", "text": "空警-2002"}], "answer": "B", "explain": "我国第一款自主研制的预警机是空警-2000。A项空警-1999、C项空警-2001、D项空警-2002均为干扰项，不存在此型号。"}, {"chapter": "现代理论", "type": "single", "id": 165, "question": "预警机（ ）创造了世界预警机发展史上的9个第一，突破100余项关键技术，累计获得重大专利近30项， 是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。", "options": [{"label": "A", "text": "空警1999"}, {"label": "B", "text": "空警-2000"}, {"label": "C", "text": "空警-2001"}, {"label": "D", "text": "空警-2002"}], "answer": "B", "explain": "空警-2000创造世界预警机发展史上9个第一、突破百项关键技术，答案为B。A项空警1999、C项空警2001、D项空警2002均不符此成就。"}, {"chapter": "现代理论", "type": "single", "id": 166, "question": "(       )是以破坏和瘫痪敌战场认识系统、信息处理系统和指挥控制系统为主要作战目标，综合运用以信息技术为核心的武器装备、作战系统和作战手段，剥夺敌方战场信息获取权、控制权和使用权，使敌决策者和指挥机关难以下定决心和进行有效的作战指挥。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "B", "explain": "以破坏瘫痪敌认识系统、信息处理和指挥控制系统为主要目标的是指挥中枢瘫痪战，答案为B。A项制信息权争夺战、C项战争结构破坏战、D项心理系统瓦解战均非以瘫痪指挥中枢为目标。"}, {"chapter": "现代理论", "type": "single", "id": 167, "question": "( )着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力最各个击破，达到瓦解、歼灭敌军的目的。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "C", "explain": "着眼全局设谋用巧打击敌方协调关节、造成结构紊乱的是战争结构破坏战，答案为C。A项制信息权争夺战、B项指挥中枢瘫痪战、D项心理系统瓦解战均不符打击结构关节的目标。"}, {"chapter": "现代理论", "type": "single", "id": 168, "question": "( )以改变个体和群体心理状态为目标，运用各种形态的信息媒介，从认识、情绪和意志上打击瓦解敌人的一种作战样式。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "D", "explain": "以改变个体群体心理状态为目标、从认识情绪意志打击敌人的是心理系统瓦解战，答案为D。A项制信息权争夺战、B项指挥中枢瘫痪战、C项战争结构破坏战均非以心理瓦解为目标。"}, {"chapter": "现代理论", "type": "single", "id": 169, "question": "(   )是综合运用硬摧毁与软杀伤的手段，削弱对方为战争服务或使用的人力、物力、科学技术和精神等诸多因素构成的潜在的战争力散，破坏对方将战争潜力转为战争实力的转换机制，动摇对方的战争基础，使对方无法继续进行战争，从而达到迅速战胜对方的目的。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "A", "explain": "综合硬摧毁与软杀伤削弱敌人力物力科技潜力、动摇战争基础的是战争潜力削弱战，答案为A。B项指挥中枢瘫痪战、C项战争结构破坏战、D项心理系统瓦解战均不符削弱战争潜力的目标。"}, {"chapter": "现代理论", "type": "single", "id": 170, "question": "( )是运用多种手段以夺取一定时空范围内战场信息控制权为目的的作战。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "制信息权争夺战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "C", "explain": "运用多种手段夺取一定时空范围内战场信息控制权的是制信息权争夺战，答案为C。A项战争潜力削弱战、B项指挥中枢瘫痪战、D项心理系统瓦解战均非以夺取信息控制权为目标。"}, {"chapter": "现代理论", "type": "single", "id": 171, "question": "在信息化战争中，（ ）资源处于首要的位置， 成为最重要的战略资源。", "options": [{"label": "A", "text": "物资"}, {"label": "B", "text": "能源"}, {"label": "C", "text": "信息"}, {"label": "D", "text": "人力"}], "answer": "C", "explain": "信息化战争中信息资源处于首要位置，成为最重要的战略资源，答案为C。A项物资、B项能源、D项人力均是传统战争的重要资源，在信息化战争中退居次要。"}, {"chapter": "现代理论", "type": "single", "id": 172, "question": "习近平提出要“改变机械化战争的思维定势思维定式，树立信息化战争的思想观念”，这个思维转变可以体现出是军事变革中（）的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "A", "explain": "改变机械化思维树立信息化观念体现剑指世界潮流的变革方向，答案为A。B项剑指国家安全、C项剑指实战形态、D项剑指统筹保障均不符顺应世界信息化潮流的方向。"}, {"chapter": "现代理论", "type": "single", "id": 173, "question": "习近平提出要“改变维护传统安全的思维定势思维定式，树立维护国家综合安全和战略利益拓展的思想观念＂，这个思维转变可以体现出是军事变革中（ ）的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "B", "explain": "改变传统安全思维树立综合安全观念体现剑指国家安全的变革方向，答案为B。A项剑指世界潮流、C项剑指实战形态、D项剑指统筹保障均不符维护国家安全的方向。"}, {"chapter": "现代理论", "type": "single", "id": 174, "question": "习近平提出“改变单一军种作战的思维定势思维定式，树立诸军兵种一体化联合作战的思想观念”，这个思维转变可以体现出是军事变革中（ ） 的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "C", "explain": "改变单一军种思维树立一体化联合作战观念体现剑指实战形态的变革方向，答案为C。A项剑指世界潮流、B项剑指国家安全、D项剑指统筹保障均不符作战形态变革的方向。"}, {"chapter": "现代理论", "type": "single", "id": 175, "question": "习近平提出“改变固守部门利益的思维定势思维定式，树立全军一盘棋、全国一盘棋的思想观念”，这个思维转变可以体现出是军事变革中（ ） 的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "D", "explain": "改变固守部门利益树立全军一盘棋观念体现剑指统筹保障的变革方向，答案为D。A项剑指世界潮流、B项剑指国家安全、C项剑指实战形态均不符统筹全局保障的方向。"}, {"chapter": "现代理论", "type": "single", "id": 176, "question": "对越南战争描述不正确的是( ) 。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中，美军运用了“百舌鸟”、“响尾蛇”等新式导弹和气浪弹、激光制导、电视制导炸弹。"}, {"label": "C", "text": "越南战争中先后动用了20余艘航空母舰，舰载机出动达20余万架次以上。"}, {"label": "D", "text": "越南战争中交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "D", "explain": "大规模集中使用17种制导武器发生于马岛战争，越南战争中未出现，答案为D。A项处于萌芽阶段、B项使用新式导弹炸弹、C项动用多艘航母均符合越南战争实际。"}, {"chapter": "现代理论", "type": "single", "id": 177, "question": "新军事革命的涵义不包括（ ）", "options": [{"label": "A", "text": "新军事革命是进入机械化战争时代的重要革命"}, {"label": "B", "text": "新军事革命是整个社会变革的重要组成，强调要从社会整体变化来认识新军事变革。"}, {"label": "C", "text": "新军事变革是科学技术发展和应用的必然结果，必须从现代科学技术的发展来认识新军事变革。"}, {"label": "D", "text": "新军事变革是军事领域的整体变革，必须从军事发展的全局来认识新军事变革。"}], "answer": "A", "explain": "新军事革命是进入信息化战争时代的重要革命，而非机械化战争时代，答案为A。B项社会变革组成、C项科技发展必然结果、D项军事领域整体变革均属新军事革命涵义。"}, {"chapter": "现代理论", "type": "single", "id": 178, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "越南战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "高技术战争初期发展与基本形成阶段的代表性战争是第四次中东战争，答案为B。A项朝鲜战争更早、C项越南战争属萌芽阶段、D项海湾战争属成熟阶段。"}, {"chapter": "现代理论", "type": "single", "id": 179, "question": "对第四次中东战争描述正确的是（）。", "options": [{"label": "A", "text": "处于高技术战争的高速发展阶段。"}, {"label": "B", "text": "第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "在第四次中东战争中出现了直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "B", "explain": "第四次中东战争处于高技术战争初期形成阶段，交战各方普遍运用各型导弹和先进装甲车辆较量，答案为B。A项并非高速发展阶段，C项蛙跳式作战属越南战争，D项17种制导武器属马岛战争。"}, {"chapter": "信息化武装", "type": "single", "id": 180, "question": "在世界战争史上第一次被人们称作“信息战争”的战例是（   ）。", "options": [{"label": "A", "text": "第四次中东战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "海湾战争"}, {"label": "D", "text": "阿富汗战争"}], "answer": "C", "explain": "海湾战争首次大规模运用信息技术，是世界战争史上第一次被称为“信息战争”的战例。A项第四次中东战争虽用电子战但尚未称信息战争，B项科索沃战争时间更晚，D项阿富汗战争发生在海湾战争之后。"}, {"chapter": "信息化武装", "type": "single", "id": 181, "question": "未来战争能否取得胜利,最终的决定性因素是（   ）。", "options": [{"label": "A", "text": "武器"}, {"label": "B", "text": "参战国的国际地位"}, {"label": "C", "text": "人"}, {"label": "D", "text": "作战的理论与方法"}], "answer": "C", "explain": "人是战争胜负的最终决定性因素，武器再先进也要由人掌握运用。A项武器只是客观条件不能脱离人的作用，B项国际地位不直接决定胜负，D项作战理论与方法也由人来制定和掌握。"}, {"chapter": "信息化武装", "type": "single", "id": 182, "question": "信息化战争战场空间广阔的特征表现在（   ）。", "options": [{"label": "A", "text": "陆地和海"}, {"label": "B", "text": "海洋和空中"}, {"label": "C", "text": "陆地、海洋、空中的三维空间"}, {"label": "D", "text": "陆、海、空、天、电多维空间"}], "answer": "D", "explain": "信息化战争战场拓展到陆、海、空、天、电的多维空间。A项仅陆海两维过于片面，B项海洋空中仍是二维，C项三维空间遗漏了天、电这两个信息化战争新增的维度。"}, {"chapter": "信息化武装", "type": "single", "id": 183, "question": "（   ）是冷战结束后规模最大、参战国最多、现代化程度最高的一场局部战争。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "伊拉克战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "科索沃战争"}], "answer": "A", "explain": "海湾战争是冷战结束后规模最大、参战国最多、现代化程度最高的局部战争。B项伊拉克战争规模与参与面不及，C项阿富汗战争现代化程度有限，D项科索沃战争以空袭为主未及海湾战争全貌。"}, {"chapter": "信息化武装", "type": "single", "id": 184, "question": "下列对20世纪90年代初的“海湾战争”表述正确的是（   ）。", "options": [{"label": "A", "text": "拉开了信息化战争时代的序幕"}, {"label": "B", "text": "是全面信息化战争的雏形"}, {"label": "C", "text": "使信息化战争达到鼎盛时期"}, {"label": "D", "text": "是信息化战争全面形成的标志"}], "answer": "B", "explain": "海湾战争信息化程度尚不充分，只算全面信息化战争的雏形。A项拉开序幕的是更早的高技术局部战争，C项信息化战争此后才逐渐走向鼎盛，D项全面形成的标志并非海湾战争而是地面部队数字化。"}, {"chapter": "信息化武装", "type": "single", "id": 185, "question": "信息化战争全面形成的标志是（   ）", "options": [{"label": "A", "text": "大量信息技术在战争中的使用"}, {"label": "B", "text": "高技术局部战争的发生"}, {"label": "C", "text": "海湾战争的爆发"}, {"label": "D", "text": "地面部队的数字化和作战行动方式的非线式一体化"}], "answer": "D", "explain": "地面部队数字化和作战行动方式的非线式一体化标志着信息化战争全面形成。A项使用信息技术只是技术手段，B项高技术局部战争不等于全面信息化，C项海湾战争仅是雏形而非形成标志。"}, {"chapter": "信息化武装", "type": "single", "id": 186, "question": "集指挥、控制、通信、计算机、情报、监视和侦查于一体的（   ）系统是信息化战场上军队行动的“大脑和中枢神经”。", "options": [{"label": "A", "text": "指挥控制"}, {"label": "B", "text": "后勤保障"}, {"label": "C", "text": "参谋策划"}, {"label": "D", "text": "协调联系"}], "answer": "A", "explain": "集指挥、控制、通信、计算机、情报、监视和侦察于一体的指挥控制系统是信息化战场军队行动的“大脑和中枢神经”。B项后勤保障只管供应保障，C项参谋策划只是辅助决策，D项协调联系不具中枢地位。"}, {"chapter": "信息化武装", "type": "single", "id": 187, "question": "机械化战争的主导要素是（   ）力量。", "options": [{"label": "A", "text": "精神"}, {"label": "B", "text": "物质"}, {"label": "C", "text": "技术"}, {"label": "D", "text": "信息"}], "answer": "B", "explain": "机械化战争以物质力量为主导要素，依赖火力、装甲和机动力取胜。A项精神起重要但非主导作用，C项技术是信息化战争侧重之处，D项信息是信息化战争的主导要素。"}, {"chapter": "信息化武装", "type": "single", "id": 188, "question": "随着大量高技术武器装备使用于战场,产生了许多新的作战形式,下面不属于新的作战形式的是（   ）。", "options": [{"label": "A", "text": "自然战"}, {"label": "B", "text": "软杀战"}, {"label": "C", "text": "运动战"}, {"label": "D", "text": "电子战"}], "answer": "C", "explain": "运动战是传统作战形式，并非高技术催生的新作战形式。A项自然战、B项软杀战、D项电子战都是随着大量高技术武器装备投入使用而产生的新作战形式。"}, {"cha
