<title>军事理论刷题 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 300px; max-height: 380px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.status-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.status-circle {
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid #d1d5db;
  color: var(--text-secondary);
  background: var(--surface);
}
.status-circle:hover { transform: scale(1.15); border-color: var(--primary-light); }
.status-circle.done { background: var(--correct); color: #fff; border-color: var(--correct); }
.status-circle.current { border-color: var(--primary); border-width: 2.5px; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: none; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-secondary);
  transition: all var(--transition); flex-shrink: 0;
}
.back-btn:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f3f9; }
.back-btn.visible { display: flex; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  text-align: center; box-shadow: var(--shadow-md); max-width: 320px; width: 90%;
}
.confirm-dialog p { font-size: 14px; margin-bottom: 16px; color: var(--text); }
.confirm-dialog .btns { display: flex; gap: 10px; }
.confirm-dialog .btns .btn { flex: 1; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.explain-box {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 10px;
  background: #f0f3f9; font-size: 13.5px; line-height: 1.65; color: var(--text);
}
.explain-label {
  flex-shrink: 0; background: var(--primary-light); color: #fff;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
}
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>

<script>
var ALL_QUESTIONS = [{"chapter": "中国国防", "type": "single", "id": 0, "question": "（）是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。", "options": [{"label": "A", "text": "国家"}, {"label": "B", "text": "军队"}, {"label": "C", "text": "武装集团"}, {"label": "D", "text": "国防"}], "answer": "D", "explain": "国防是国家为防备和抵抗侵略、制止武装颠覆而进行的军事及军事相关政治、经济、外交、科技、文化等活动。"}, {"chapter": "中国国防", "type": "single", "id": 1, "question": "国防的主体，即国防活动的实施者，通常为（ ）", "options": [{"label": "A", "text": "政府"}, {"label": "B", "text": "国家"}, {"label": "C", "text": "公民"}, {"label": "D", "text": "军队"}], "answer": "B", "explain": "国防的主体是国家，即国防活动的实施者是整个国家而非军队或个人。"}, {"chapter": "中国国防", "type": "single", "id": 2, "question": "国防的根本目的和任务是（ ）。", "options": [{"label": "A", "text": "保卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫国家的领土完整"}, {"label": "D", "text": "保障国家的安全"}], "answer": "A", "explain": "国防的首要任务是保卫国家的主权，主权是国家的根本标志和最高利益。"}, {"chapter": "中国国防", "type": "single", "id": 3, "question": "根据我国的社会制度和国家政策，中国的国防类型是（ ）。", "options": [{"label": "A", "text": "扩张型"}, {"label": "B", "text": "中立型"}, {"label": "C", "text": "侵略型"}, {"label": "D", "text": "自卫型"}], "answer": "D", "explain": "我国坚持防御性国防政策，国防类型是自卫型，不侵略他国也不与他国结盟扩张。"}, {"chapter": "中国国防", "type": "single", "id": 4, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学盛典”的《孙子兵法》一书，其作者是春秋时期著名的（ ）。", "options": [{"label": "A", "text": "孙权"}, {"label": "B", "text": "孙膑"}, {"label": "C", "text": "孙武"}, {"label": "D", "text": "孙文"}], "answer": "C", "explain": "此语出自春秋军事家孙武所著《孙子兵法》，孙武被尊为兵圣。"}, {"chapter": "中国国防", "type": "single", "id": 5, "question": "下列不属于国防法规的特性是（ ）。", "options": [{"label": "A", "text": "调整对象的军事性"}, {"label": "B", "text": "目标体系的多样性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "B", "explain": "国防法规的目标体系是统一明确的，不具多样性，这是其不符合的特性。"}, {"chapter": "中国国防", "type": "single", "id": 6, "question": "现行《国防法》由全国人民代表大会八届五次会议于（ ）通过，并于当日颁布实施。", "options": [{"label": "A", "text": "1997年3月14日"}, {"label": "B", "text": "1997年4月13日"}, {"label": "C", "text": "1999年3月14日"}, {"label": "D", "text": "1999年4月13日"}], "answer": "A", "explain": "现行《国防法》于1997年3月14日由八届全国人大五次会议通过并当日施行。"}, {"chapter": "中国国防", "type": "single", "id": 7, "question": "下列哪个不属于我国的国防法规（ ）。", "options": [{"label": "A", "text": "《兵役法》"}, {"label": "B", "text": "《反分裂国家法》"}, {"label": "C", "text": "《义务教育法》"}, {"label": "D", "text": "《民兵工作条例》"}], "answer": "C", "explain": "《义务教育法》属于教育领域法律，不属我国国防法规体系。"}, {"chapter": "中国国防", "type": "single", "id": 8, "question": "下列哪个不是中华人民共和国武装力量的组成部分。（ ）。", "options": [{"label": "A", "text": "义务兵"}, {"label": "B", "text": "中国人民解放军现役部队和预备役部队"}, {"label": "C", "text": "中国人民武装警察部队"}, {"label": "D", "text": "民兵"}], "answer": "A", "explain": "义务兵是服役身份而非武装力量组成，我国武装力量由解放军现役和预备役、武警、民兵构成。"}, {"chapter": "中国国防", "type": "single", "id": 9, "question": "( )在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。", "options": [{"label": "A", "text": "《兵役法》"}, {"label": "B", "text": "《反分裂国家法》"}, {"label": "C", "text": "《国防教育法》"}, {"label": "D", "text": "《国防法》"}], "answer": "D", "explain": "《国防法》在国防法规体系中居统帅地位并起核心作用，是其他军事立法的基本依据。"}, {"chapter": "中国国防", "type": "single", "id": 10, "question": "( ) 是指在一个固定的时期内， 根据国际形势、周边环境以及国内条件的发展趋势，在已有的国防建设的基础上，运用国家的各种条件和力量，在国防建设上所要达到的预期目的和结果。", "options": [{"label": "A", "text": "国防法规"}, {"label": "B", "text": "国防领导体制"}, {"label": "C", "text": "国防动员"}, {"label": "D", "text": "国防建设目标"}], "answer": "D", "explain": "国防建设目标指在一定时期内国防建设所要达到的预期目的和结果。"}, {"chapter": "中国国防", "type": "single", "id": 11, "question": "每年的（ ）为国家烈士纪念日。", "options": [{"label": "A", "text": "8月3日"}, {"label": "B", "text": "9月3日"}, {"label": "C", "text": "8月30日"}, {"label": "D", "text": "9月30日"}], "answer": "D", "explain": "每年的9月30日为国家烈士纪念日，缅怀为国家和人民牺牲的英烈。"}, {"chapter": "中国国防", "type": "single", "id": 12, "question": "国防是指国家为防备和抵抗侵略，制止武装颠覆，保卫国家主权统一、领土完整和安全所进行的军事及军事有关的政治、经济、外交、科技、教育等方面活动。国防的基本要素不包括（ ）。", "options": [{"label": "A", "text": "国防的性质"}, {"label": "B", "text": "国防的对象"}, {"label": "C", "text": "国防的目的"}, {"label": "D", "text": "国防的手段"}], "answer": "A", "explain": "国防的基本要素包括目的、对象、手段等，国防的性质不在其中。"}, {"chapter": "中国国防", "type": "single", "id": 13, "question": "下列哪个不是我国的国防手段( ) 。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "文化手段"}, {"label": "D", "text": "经济手段"}], "answer": "C", "explain": "我国国防手段含政治、外交、经济、军事等，文化手段不属于国防手段。"}, {"chapter": "中国国防", "type": "single", "id": 14, "question": "下列不属于国防法规的特性是（ ）。", "options": [{"label": "A", "text": "法律条例的自由性"}, {"label": "B", "text": "处罚措施的严厉性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "A", "explain": "国防法规不具有法律条例的自由性，其处罚严厉、公开有限、司法优先。"}, {"chapter": "中国国防", "type": "single", "id": 15, "question": "( ),我国第一颗原子弹爆炸成功。", "options": [{"label": "A", "text": "1964年10月16日"}, {"label": "B", "text": "1965年10月16日"}, {"label": "C", "text": "1966年10月16日"}, {"label": "D", "text": "1967年10月16日"}], "answer": "A", "explain": "1964年10月16日我国第一颗原子弹爆炸成功，打破核垄断。"}, {"chapter": "中国国防", "type": "single", "id": 16, "question": "下列哪个不是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "武装力量动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "文化动员"}, {"label": "D", "text": "国民经济动员"}], "answer": "C", "explain": "文化动员不属于国防动员主要内容，动员含武装力量、国民经济、科学技术等。"}, {"chapter": "中国国防", "type": "single", "id": 17, "question": "《孙胺兵法》继承和发展了（ ）的军事战略思想，这是一部享誉世间的兵家宝书。", "options": [{"label": "A", "text": "《后汉书》"}, {"label": "B", "text": "《汉书》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "D", "explain": "《孙膑兵法》继承和发展了《孙子兵法》的军事战略思想，是一脉相承的兵家宝书。"}, {"chapter": "中国国防", "type": "single", "id": 18, "question": "“国防”一词在我国最早见于( ) 。", "options": [{"label": "A", "text": "《孙子兵法》"}, {"label": "B", "text": "《孙膑兵法》"}, {"label": "C", "text": "《汉书》"}, {"label": "D", "text": "《后汉书》"}], "answer": "D", "explain": "国防一词在我国最早见于《后汉书》，此前多以军旅、武备等称之。"}, {"chapter": "中国国防", "type": "single", "id": 19, "question": "从2013年开始，征兵工作由冬季改为（ answer": "A", "explain": "二战前国际秩序的本质特征是强权政治，列强以武力瓜分世界。"}, {"chapter": "国家安全", "type": "single", "id": 95, "question": "美国的（ ）成为国际局势动荡的根源。", "options": [{"label": "A", "text": "“新干涉主义”"}, {"label": "B", "text": "“干涉主义”"}, {"label": "C", "text": "“大国主义”"}, {"label": "D", "text": "战略干涉"}], "answer": "A", "explain": "美国的新干涉主义是国际局势动荡的根源。"}, {"chapter": "国家安全", "type": "single", "id": 96, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略形式"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "C", "explain": "军事力量是战略的物质基础和决定因素，故为其决定因素。"}, {"chapter": "国家安全", "type": "single", "id": 97, "question": "战略的特点不包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "多样性"}], "answer": "D", "explain": "多样性不是战略的特点，战略具全局性、对抗性、谋略性等特点。"}, {"chapter": "国家安全", "type": "single", "id": 98, "question": "我国在发展大国关系政策上有新的定位坚持的原则不包括（ ）。", "options": [{"label": "A", "text": "不对抗"}, {"label": "B", "text": "不结盟"}, {"label": "C", "text": "不合作"}, {"label": "D", "text": "不针对第三国"}], "answer": "C", "explain": "不合作不是我国发展大国关系的原则，应为不对抗、不结盟、不针对第三国。"}, {"chapter": "国家安全", "type": "single", "id": 99, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "日本"}, {"label": "B", "text": "沙特"}, {"label": "C", "text": "超限"}, {"label": "D", "text": "以色列"}], "answer": "C", "explain": "超限是核武器部署概念非国家，中国周边有核国家包括印度、巴基斯坦、俄罗斯等。"}, {"chapter": "军事思想", "type": "single", "id": 100, "question": "( )提出“我们必须统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会进程中实现富国和强军的统一”。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "D", "explain": "胡锦涛提出统筹经济建设和国防建设，走中国特色军民融合式发展路子。"}, {"chapter": "军事思想", "type": "single", "id": 101, "question": "军事思想来源于社会实践，在阶级社会中，人们为了各自阶级的利益，所奉行和推崇的军事思想，必然反映各个阶级对战争和军队建设的认识和立场，因此军事思想具有（ ）", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "丰富的实践性"}, {"label": "D", "text": "明显的继承性"}], "answer": "A", "explain": "军事思想反映各阶级立场和认识，因而具有鲜明的阶级性。"}, {"chapter": "军事思想", "type": "single", "id": 102, "question": "一般认为我国古代军事思想的初步形成于（  ） 时期。", "options": [{"label": "A", "text": "夏商周"}, {"label": "B", "text": "春秋战国"}, {"label": "C", "text": "秦朝"}, {"label": "D", "text": "汉朝"}], "answer": "A", "explain": "我国古代军事思想初步形成于夏商周时期。"}, {"chapter": "军事思想", "type": "single", "id": 103, "question": "春秋战国时期，我国古代军事思想已基本成熟，（  ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《三略》"}], "answer": "D", "explain": "《三略》非春秋战国时期兵书，是秦汉之际或更晚的传世之作。"}, {"chapter": "军事思想", "type": "single", "id": 104, "question": "一般认为我国古代军事思想在（ ）时期进入系统化、体系化阶段。", "options": [{"label": "A", "text": "夏商周"}, {"label": "B", "text": "春秋战国"}, {"label": "C", "text": "秦至五代"}, {"label": "D", "text": "宋至清前期"}], "answer": "D", "explain": "我国古代军事思想在宋至清前期进入系统化、体系化阶段。"}, {"chapter": "军事思想", "type": "single", "id": 105, "question": "宋神宗时期，把《孙子兵法》、《孙胺兵法》、《六韬》、《尉缭子》、《司马法》、《李卫公问对》和（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《黄石公三略》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《吴子》"}, {"label": "D", "text": "《太白阴经》"}], "answer": "B", "explain": "宋神宗将《孙子兵法》《孙膑兵法》《六韬》《尉缭子》《司马法》《李卫公问对》和《三略》合称《武经七书》。"}, {"chapter": "军事思想", "type": "single", "id": 106, "question": "中国第一部军制史专著是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "A", "explain": "《历代兵制》是中国第一部军制史专著。"}, {"chapter": "军事思想", "type": "single", "id": 107, "question": "中国第一部名将传记是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "B", "explain": "《百将传》是中国第一部专门辑录名将生平的名将传记。"}, {"chapter": "军事思想", "type": "single", "id": 108, "question": "中国第一部专门军事类书是（ ）。", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "C", "explain": "《武经总要》是中国第一部专门军事类书。"}, {"chapter": "军事思想", "type": "single", "id": 109, "question": "中国第一部军事地理学专著是（ ）", "options": [{"label": "A", "text": "《历代兵制》"}, {"label": "B", "text": "《百将传》"}, {"label": "C", "text": "《武经总要》"}, {"label": "D", "text": "《读史方舆纪要》"}], "answer": "D", "explain": "《读史方舆纪要》是中国第一部军事地理学专著。"}, {"chapter": "军事思想", "type": "single", "id": 110, "question": "与中国古代军事思想相比，世界古代军事思想起步较晚，没有反映该时期军事思想的著作是（ ）。", "options": [{"label": "A", "text": "《伯罗奔尼撒战争史》"}, {"label": "B", "text": "《希腊波斯战争史》"}, {"label": "C", "text": "《长征记》"}, {"label": "D", "text": "《战争艺术概论》"}], "answer": "D", "explain": "《战争艺术概论》是近代约米尼所著，不属于世界古代军事思想著作。"}, {"chapter": "军事思想", "type": "single", "id": 111, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "A", "explain": "此五说从不同侧面论述战争，体现了中国古代军事思想战争本质观的观点。"}, {"chapter": "军事思想", "type": "single", "id": 112, "question": "认为战争并不是自有人类以来就有的，战争是人类社会发展到一定历史阶段的产物。这体现了中国古代军事思想战争论中战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "B", "explain": "战争并非从来就有而是社会发展到一定阶段的产物，体现战争起源观。"}, {"chapter": "军事思想", "type": "single", "id": 113, "question": "“人口论”认为，古时候人少、财物多，所以没有争斗和战争，后来人口不断增多，社会财富相对减少，人们为了争夺生存条件就发生了战争。这体现了中国古代军事思想战争论中战争本质观的（ ）的观点。", "options": [{"label": "A", "text": "战争本质"}, {"label": "B", "text": "战争起源"}, {"label": "C", "text": "战争起因"}, {"label": "D", "text": "战争态度"}], "answer": "C", "explain": "人口论以人口增长争夺生存条件解释战争，体现战争起因观。"}, {"chapter": "军事思想", "type": "single", "id": 114, "question": "习近平国防和军队建设重要论述的主要内容不包括（ ）。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "A", "explain": "以人为本是胡锦涛建军治军原则，不属于习近平国防和军队建设论述内容。"}, {"chapter": "军事思想", "type": "single", "id": 115, "question": "春秋战国时期，我国古代军事思想已基本成熟，（ ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《尉缭子》"}, {"label": "C", "text": "《太白阴经》"}, {"label": "D", "text": "《孙胺兵法》"}], "answer": "C", "explain": "《太白阴经》是唐代兵书，不属于春秋战国时期影响较大的兵书。"}, {"chapter": "军事思想", "type": "single", "id": 116, "question": "对待战争的态度中，（ ）认为战争并不是绝对的坏事，对战争要具体分析，明确表明要支持正义战争，反对非正义战争。", "options": [{"label": "A", "text": "兵战兴邦论"}, {"label": "B", "text": "偃兵废武论"}, {"label": "C", "text": "穷兵赎武论"}, {"label": "D", "text": "义兵慎战论"}], "answer": "D", "explain": "义兵慎战论主张支持正义战争、反对非正义战争，对战争需具体分析。"}, {"chapter": "军事思想", "type": "single", "id": 117, "question": "明太祖在《谕将帅》中提出“发兵为诛暴，诛暴为保民”，“诛暴保民论”体现了中国古代军事思想中战争论的（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "B", "explain": "诛暴保民论体现战争和平观，主张以战止战、战争为了和平保民。"}, {"chapter": "军事思想", "type": "single", "id": 118, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论的（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "A", "explain": "此五说论述战争的凶险、重大、诡诈等本质，体现战争本质观。"}, {"chapter": "军事思想", "type": "single", "id": 119, "question": "不属于毛泽东军事理论创新的是（ ）。", "options": [{"label": "A", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}, {"label": "B", "text": "创建了一支新型的人民军队"}, {"label": "C", "text": "创造了适合中国特点的人民战争的战略战术"}, {"label": "D", "text": "建设一支强大的现代化正规化的革命军队"}], "answer": "D", "explain": "建设一支强大的现代化正规化革命军队是邓小平的思想，非毛泽东军事理论创新。"}, {"chapter": "军事思想", "type": "single", "id": 120, "question": "《淮南子》中指出“兵之胜败，本在于政”，这体现了中国古代军事思想中战争论的（）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "C", "explain": "兵之胜败本在于政，强调政治决定战争胜负，体现战争政治观。"}, {"chapter": "军事思想", "type": "single", "id": 121, "question": "“没有一个人民的军队，便没有人民的一切”，这是（ ）提出的人民军队的思想。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "邓小平"}], "answer": "A", "explain": "毛泽东提出没有一个人民的军队便没有人民的一切。"}, {"chapter": "军事思想", "type": "single", "id": 122, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "严格的强制性"}, {"label": "B", "text": "鲜明的阶级性"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "公开的有限性"}], "answer": "B", "explain": "军事思想特征包括鲜明的阶级性、强烈的时代感、丰富的实践性、明显的继承性等。"}, {"chapter": "军事思想", "type": "single", "id": 123, "question": "朱神宗时期， 把《孙子兵法》、 《孙胺兵法》、 《六韬》、 《尉缭子》等七部兵书作为武学必修课程，统称为《武经七书》，下列（ ）不是《武经七书》的部分。", "options": [{"label": "A", "text": "《隆中对》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《李卫公问对》"}], "answer": "A", "explain": "《隆中对》是战略策论而非《武经七书》之兵书。"}, {"chapter": "军事思想", "type": "single", "id": 124, "question": "《孙子兵法》中强调“上兵伐谋，其次伐交”，这体现了中国古代军事思想战备论中战备的内容是（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "经济上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "外交上备战"}], "answer": "D", "explain": "上兵伐谋其次伐交强调以外交手段分化敌人，体现外交上备战。"}, {"chapter": "军事思想", "type": "single", "id": 125, "question": "( )军事理论的诞生，为人们研究和解决军事领域的问题提供了科学的基本观点和方法，为无产阶级军事思想的发展奠定了坚实的理论基础。", "options": [{"label": "A", "text": "列宁主义"}, {"label": "B", "text": "马克思主义"}, {"label": "C", "text": "恩格斯主义"}, {"label": "D", "text": "毛泽东思想"}], "answer": "B", "explain": "马克思主义军事理论为研究解决军事问题提供科学观点和方法，奠定无产阶级军事思想基础。"}, {"chapter": "军事思想", "type": "single", "id": 126, "question": "我国古代的军事家、政治家认为战备的最高标准和目标，就是在政治、经济、军事、技术等各有关决定战争胜负的诸因素方面，相对于敌人来说都要占有绝对优势。这体现了备战的（ ）", "options": [{"label": "A", "text": "超前性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "整体性原则"}, {"label": "D", "text": "隐蔽性原则"}], "answer": "B", "explain": "战备最高目标是相对敌人各因素占绝对优势，体现超盖性原则。"}, {"chapter": "军事思想", "type": "single", "id": 127, "question": "“耕战并重”强调了备战的（ ）。", "options": [{"label": "A", "text": "相称性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "求已性原则"}, {"label": "D", "text": "平战结合原则"}], "answer": "D", "explain": "耕战并重强调平时农战结合，体现平战结合原则。"}, {"chapter": "军事思想", "type": "single", "id": 128, "question": "春秋战国时期，我国古代军事思想已基本成熟，（ ）不是该时期影响较大的兵书。", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《李卫公问对》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《孙胺兵法》"}], "answer": "B", "explain": "《李卫公问对》是唐代兵书，不属于春秋战国时期影响较大的兵书。"}, {"chapter": "军事思想", "type": "single", "id": 129, "question": "( )后，确定了以毛泽东为首的党中央领导集体。", "options": [{"label": "A", "text": "八七会议"}, {"label": "B", "text": "遵义会议"}, {"label": "C", "text": "瓦窑堡会议"}, {"label": "D", "text": "洛川会议"}], "answer": "B", "explain": "遵义会议后确定了以毛泽东为首的党中央领导集体。"}, {"chapter": "军事思想", "type": "single", "id": 130, "question": "戚继光的《纪效新书》中指出“有精器而无精兵以用之，是谓徒费；有精兵而无精器，是谓徒强”，这体现了中国古代军事思想中治军论的（ ）。", "options": [{"label": "A", "text": "国以军为辅"}, {"label": "B", "text": "兵不在众，以治为胜"}, {"label": "C", "text": "凡兵，制必先定"}, {"label": "D", "text": "凡胜，备必先具"}], "answer": "D", "explain": "有精器有精兵方能制胜强调装备与人的结合，体现凡胜备必先具。"}, {"chapter": "军事思想", "type": "single", "id": 131, "question": "江泽民国防和军队建设思想的理论体系不包括( )。", "options": [{"label": "A", "text": "解决好打得赢、不变质两个历史性课题"}, {"label": "B", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "坚持依法治军、从严治军"}], "answer": "C", "explain": "把科学发展观作为指导方针是胡锦涛思想，非江泽民国防军队建设思想体系内容。"}, {"chapter": "军事思想", "type": "single", "id": 132, "question": "诸葛亮强调“夫用兵之道，必定其谋”， 这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "致人而不致于人"}], "answer": "A", "explain": "夫用兵之道必定其谋体现了用兵之道先谋为本的观点。"}, {"chapter": "军事思想", "type": "single", "id": 133, "question": "不属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "提高军队建设的正规化水平"}, {"label": "B", "text": "坚定不移地走有中国特色的精兵之路"}, {"label": "C", "text": "中心是解决现代化的问题"}, {"label": "D", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}], "answer": "D", "explain": "农村包围城市武装夺取政权是毛泽东军事理论，非邓小平新时期军队建设思想。"}, {"chapter": "军事思想", "type": "single", "id": 134, "question": "下列没有体现中国古代军事思想用兵论中“用兵之道，先谋为本”的观点是（ ）。", "options": [{"label": "A", "text": "备必预具，虑必先定"}, {"label": "B", "text": "夫用兵之道，必先定其谋"}, {"label": "C", "text": "勇不足恃，用兵在先定谋"}, {"label": "D", "text": "兵不在众，以治为胜"}], "answer": "D", "explain": "兵不在众以治为胜属治军论，未体现用兵先谋为本的观点。"}, {"chapter": "军事思想", "type": "single", "id": 135, "question": "孙武指出“兵贵胜，不贵久”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "兵之情主速"}], "answer": "D", "explain": "兵贵胜不贵久强调速战速决，体现兵之情主速的观点。"}, {"chapter": "军事思想", "type": "single", "id": 136, "question": "习近平国防和军队建设重要论述的主要内容不包括（ ）。", "options": [{"label": "A", "text": "始终保持我军光荣传统和优良作风"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "C", "explain": "把科学发展观作为指导方针是胡锦涛思想，不属于习近平国防军队建设论述内容。"}, {"chapter": "军事思想", "type": "single", "id": 137, "question": "( )运用辩证唯物主义和历史唯物主义的原理，研究指导中国革命战争，创造性地提出了“军事辩证法”这一概念。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "邓小平"}], "answer": "A", "explain": "毛泽东运用辩证唯物主义和历史唯物主义创造性地提出军事辩证法概念。"}, {"chapter": "军事思想", "type": "single", "id": 138, "question": "《兵畾三十六年·迅》中提出“时不再来，机不可失，则速攻之，速围之，速逐之，速持捣之，靡有不胜”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "兵之情主速"}], "answer": "D", "explain": "时不再来机不可失速攻速围强调快速行动，体现兵之情主速的观点。"}, {"chapter": "军事思想", "type": "single", "id": 139, "question": "下列没有体现中国古代军事思想用兵论中“兵之情主速＂的观点是（ ）。", "options": [{"label": "A", "text": "兵贵胜，不贵久"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "夫用兵之道，必先定其谋"}, {"label": "D", "text": "兵闻拙速，未睹巧之久也"}], "answer": "C", "explain": "夫用兵之道必先定其谋属于先谋为本，未体现兵之情主速的观点。"}, {"chapter": "军事思想", "type": "single", "id": 140, "question": "《太白阴经》强调“道贵制人，不贵制于人；制人者握权，制于人者遵命也”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "致人而不致于人"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "B", "explain": "道贵制人不贵制于人强调掌握主动权调动敌人，体现致人而不致于人的观点。"}, {"chapter": "军事思想", "type": "single", "id": 141, "question": "( )指出：“我们未来反侵略战争，究竟采取什么样的战略方针？我赞成就是‘积极防御’四个字。”", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "B", "explain": "邓小平提出未来反侵略战争采取积极防御的战略方针。"}, {"chapter": "军事思想", "type": "single", "id": 142, "question": "岳飞讲“运用之妙，存乎一心”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道， 先谋为本"}, {"label": "B", "text": "致人而不致于人"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "C", "explain": "运用之妙存乎一心强调灵活用兵把握战机，体现因机立胜的观点。"}, {"chapter": "军事思想", "type": "single", "id": 143, "question": "( )提出“部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力”。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "C", "explain": "江泽民提出部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力。"}, {"chapter": "军事思想", "type": "single", "id": 144, "question": "《尉缭子》中认为“权先加人者，兵敌不力交；武先加人者，敌无威接”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "攻是守之机， 守是攻之策"}, {"label": "C", "text": "因机立胜"}, {"label": "D", "text": "先胜而后求战"}], "answer": "B", "explain": "权武先加人者强调攻守互相依存转化，体现攻是守之机、守是攻之策的观点。"}, {"chapter": "军事思想", "type": "single", "id": 145, "question": "胡锦涛国防和军队建设思想的主要内容不包括( )。", "options": [{"label": "A", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "B", "text": "积极推进国防和军队建设各领域改革"}, {"label": "C", "text": "把以人为本作为重要的建军治军原则"}, {"label": "D", "text": "走中国特色军民融合式发展的路。"}], "answer": "A", "explain": "按照五句话总要求加强军队建设是江泽民思想，非胡锦涛国防军队建设思想内容。"}, {"chapter": "军事思想", "type": "single", "id": 146, "question": "《淮南子》中提出“良将之用卒也，同其心，一其力”，这体现了中国古代军事思想中用兵论的（ ）的观点。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "激人之心，励士之气"}, {"label": "D", "text": "兵之情主速"}], "answer": "C", "explain": "良将同其心一其力强调凝聚军心士气，体现激人之心、励士之气的观点。"}, {"chapter": "军事思想", "type": "single", "id": 147, "question": "( )根据现代战争的特点和规律，结合我国的实际情况，提出了“现代条件下人民战争＂的思想。", "options": [{"label": "A", "text": "毛泽东"}, {"label": "B", "text": "邓小平"}, {"label": "C", "text": "江泽民"}, {"label": "D", "text": "胡锦涛"}], "answer": "B", "explain": "邓小平提出现代条件下人民战争的思想。"}, {"chapter": "军事思想", "type": "single", "id": 148, "question": "(   )提出“实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。可以说，这个梦想是强国梦，对军队来说，也是强军梦。我们要实现中华民族伟大复兴，必须坚持富国和强军相统一，努力建设巩固国防和强大军队。", "options": [{"label": "A", "text": "邓小平"}, {"label": "B", "text": "江泽民"}, {"label": "C", "text": "胡锦涛"}, {"label": "D", "text": "习近平"}], "answer": "D", "explain": "习近平提出强军梦，强调富国和强军相统一、建设巩固国防和强大军队。"}, {"chapter": "军事思想", "type": "single", "id": 149, "question": "《吕氏春秋》指出“以人之小恶，亡人之大美，此人主之所以失天下之士也”，这体现了中国古代军事思想中将帅选拔任用的（ ）原则。", "options": [{"label": "A", "text": "全面性"}, {"label": "B", "text": "辩证性"}, {"label": "C", "text": "优化性"}, {"label": "D", "text": "开放性"}], "answer": "B", "explain": "不因小恶弃大美体现看人一分为二的辩证观点，体现将帅选拔任用的辩证性原则。"}, {"chapter": "现代理论", "type": "single", "id": 150, "question": "最早提出信息战概念的人是（ ）。", "options": [{"label": "A", "text": "钱学森"}, {"label": "B", "text": "沈伟光"}, {"label": "C", "text": "钱三强"}, {"label": "D", "text": "邓稼先"}], "answer": "B", "explain": "中国学者沈伟光最早提出信息战概念。"}, {"chapter": "现代理论", "type": "single", "id": 151, "question": "社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为( )。", "options": [{"label": "A", "text": "\"第三次浪潮战争\""}, {"label": "B", "text": "\"第四次浪潮战争\""}, {"label": "C", "text": "\" 第五代战争\""}, {"label": "D", "text": "\"非接触战争”"}], "answer": "A", "explain": "托夫勒从文明演进角度将信息化战争称为第三次浪潮战争。"}, {"chapter": "现代理论", "type": "single", "id": 152, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为（ ）。", "options": [{"label": "A", "text": "第三次浪潮战争"}, {"label": "B", "text": "第四次浪潮战争"}, {"label": "C", "text": "第五代战争"}, {"label": "D", "text": "第六代战争"}], "answer": "D", "explain": "斯里普琴科从武器装备发展角度将信息化战争称为第六代战争。"}, {"chapter": "现代理论", "type": "single", "id": 153, "question": "中国著名的军事理论家（ ），早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。", "options": [{"label": "A", "text": "孙权"}, {"label": "B", "text": "孙胺"}, {"label": "C", "text": "孙武"}, {"label": "D", "text": "孙文"}], "answer": "C", "explain": "孙武两千多年前提出不战而屈人之兵，这是信息战的核心宗旨。"}, {"chapter": "现代理论", "type": "single", "id": 154, "question": "首次利用空中卫星进行战场侦察的战争是 ( )。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "第四次中东战争首次利用空中卫星进行战场侦察。"}, {"chapter": "现代理论", "type": "single", "id": 155, "question": "( ) 中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "C", "explain": "马岛战争中交战双方第一次大规模集中使用17种类型制导武器对抗。"}, {"chapter": "现代理论", "type": "single", "id": 156, "question": "( )中，英军还以“竞技神”号、“无敌”号航空母舰上的电子干扰系统和＂鸥＂式直升机上的机载干扰系统，对阿军的袭击兵器和指挥控制系统实施了电磁干扰与压制。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "C", "explain": "马岛战争中英军以电子干扰系统对阿军实施电磁干扰与压制。"}, {"chapter": "现代理论", "type": "single", "id": 157, "question": "( )中，美国军队依靠优势空中力量进行长时间“地毯式轰炸＂的空袭作战，以及直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "越南战争中美军以空中优势进行地毯式轰炸及直升机与特种部队结合的蛙跳式作战。"}, {"chapter": "现代理论", "type": "single", "id": 158, "question": "标志着高技术战争的发展进入成熟阶段的是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争标志着高技术战争发展进入成熟阶段。"}, {"chapter": "现代理论", "type": "single", "id": 159, "question": "()中的通信系统建设被称为“军事史上一次最大的通信系统专项工程 ” 。", "options": [{"label": "A", "text": "朝鲜战"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争的通信系统建设被称为军事史上最大的一次通信系统专项工程。"}, {"chapter": "现代理论", "type": "single", "id": 160, "question": "( )中，开创了“爱国者”导弹成功拦截“飞毛腿”导弹的先例。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "D", "explain": "海湾战争中爱国者导弹成功拦截飞毛腿导弹开创了导弹拦截先例。"}, {"chapter": "现代理论", "type": "single", "id": 161, "question": "对越南战争描述不正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了2艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合， 进行“蛙跳” 式的袭击作战。"}], "answer": "B", "explain": "首次利用卫星战场侦察发生在第四次中东战争，越南战争中未出现此项。"}, {"chapter": "现代理论", "type": "single", "id": 162, "question": "高技术战争的初期发展与基本形成阶段中， 不是该阶段的战争是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "第五次中东战争"}], "answer": "A", "explain": "朝鲜战争早于高技术战争初期形成阶段，不属于该阶段战争。"}, {"chapter": "现代理论", "type": "single", "id": 163, "question": "对第四次中东战争描述不正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "在第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "第四次中东战争中，首次利用空中卫星进行战场侦察。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "D", "explain": "大规模集中使用17种制导武器发生于马岛战争，非第四次中东战争。"}, {"chapter": "现代理论", "type": "single", "id": 164, "question": "我国第一款自主研制的预警机是（ ）。", "options": [{"label": "A", "text": "空警-1999"}, {"label": "B", "text": "空警-2000"}, {"label": "C", "text": "空警-2001"}, {"label": "D", "text": "空警-2002"}], "answer": "B", "explain": "我国第一款自主研制的预警机是空警-2000。"}, {"chapter": "现代理论", "type": "single", "id": 165, "question": "预警机（ ）创造了世界预警机发展史上的9个第一，突破100余项关键技术，累计获得重大专利近30项， 是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。", "options": [{"label": "A", "text": "空警1999"}, {"label": "B", "text": "空警-2000"}, {"label": "C", "text": "空警-2001"}, {"label": "D", "text": "空警-2002"}], "answer": "B", "explain": "空警-2000创造世界预警机发展史上9个第一、突破百项关键技术。"}, {"chapter": "现代理论", "type": "single", "id": 166, "question": "(       )是以破坏和瘫痪敌战场认识系统、信息处理系统和指挥控制系统为主要作战目标，综合运用以信息技术为核心的武器装备、作战系统和作战手段，剥夺敌方战场信息获取权、控制权和使用权，使敌决策者和指挥机关难以下定决心和进行有效的作战指挥。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "B", "explain": "以破坏瘫痪敌认识系统、信息处理和指挥控制系统为主要目标的是指挥中枢瘫痪战。"}, {"chapter": "现代理论", "type": "single", "id": 167, "question": "( )着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力最各个击破，达到瓦解、歼灭敌军的目的。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "C", "explain": "着眼全局设谋用巧打击敌方协调关节、造成结构紊乱的是战争结构破坏战。"}, {"chapter": "现代理论", "type": "single", "id": 168, "question": "( )以改变个体和群体心理状态为目标，运用各种形态的信息媒介，从认识、情绪和意志上打击瓦解敌人的一种作战样式。", "options": [{"label": "A", "text": "制信息权争夺战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "D", "explain": "以改变个体群体心理状态为目标、从认识情绪意志打击敌人的是心理系统瓦解战。"}, {"chapter": "现代理论", "type": "single", "id": 169, "question": "(   )是综合运用硬摧毁与软杀伤的手段，削弱对方为战争服务或使用的人力、物力、科学技术和精神等诸多因素构成的潜在的战争力散，破坏对方将战争潜力转为战争实力的转换机制，动摇对方的战争基础，使对方无法继续进行战争，从而达到迅速战胜对方的目的。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "A", "explain": "综合硬摧毁与软杀伤削弱敌人力物力科技潜力、动摇战争基础的是战争潜力削弱战。"}, {"chapter": "现代理论", "type": "single", "id": 170, "question": "( )是运用多种手段以夺取一定时空范围内战场信息控制权为目的的作战。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "制信息权争夺战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "C", "explain": "运用多种手段夺取一定时空范围内战场信息控制权的是制信息权争夺战。"}, {"chapter": "现代理论", "type": "single", "id": 171, "question": "在信息化战争中，（ ）资源处于首要的位置， 成为最重要的战略资源。", "options": [{"label": "A", "text": "物资"}, {"label": "B", "text": "能源"}, {"label": "C", "text": "信息"}, {"label": "D", "text": "人力"}], "answer": "C", "explain": "信息化战争中信息资源处于首要位置，成为最重要的战略资源。"}, {"chapter": "现代理论", "type": "single", "id": 172, "question": "习近平提出要“改变机械化战争的思维定势思维定式，树立信息化战争的思想观念”，这个思维转变可以体现出是军事变革中（）的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "A", "explain": "改变机械化思维树立信息化观念体现剑指世界潮流的变革方向。"}, {"chapter": "现代理论", "type": "single", "id": 173, "question": "习近平提出要“改变维护传统安全的思维定势思维定式，树立维护国家综合安全和战略利益拓展的思想观念＂，这个思维转变可以体现出是军事变革中（ ）的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "B", "explain": "改变传统安全思维树立综合安全观念体现剑指国家安全的变革方向。"}, {"chapter": "现代理论", "type": "single", "id": 174, "question": "习近平提出“改变单一军种作战的思维定势思维定式，树立诸军兵种一体化联合作战的思想观念”，这个思维转变可以体现出是军事变革中（ ） 的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "C", "explain": "改变单一军种思维树立一体化联合作战观念体现剑指实战形态的变革方向。"}, {"chapter": "现代理论", "type": "single", "id": 175, "question": "习近平提出“改变固守部门利益的思维定势思维定式，树立全军一盘棋、全国一盘棋的思想观念”，这个思维转变可以体现出是军事变革中（ ） 的方向。", "options": [{"label": "A", "text": "剑指世界潮流"}, {"label": "B", "text": "剑指国家安全"}, {"label": "C", "text": "剑指实战形态"}, {"label": "D", "text": "剑指统筹保障"}], "answer": "D", "explain": "改变固守部门利益树立全军一盘棋观念体现剑指统筹保障的变革方向。"}, {"chapter": "现代理论", "type": "single", "id": 176, "question": "对越南战争描述不正确的是( ) 。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中，美军运用了“百舌鸟”、“响尾蛇”等新式导弹和气浪弹、激光制导、电视制导炸弹。"}, {"label": "C", "text": "越南战争中先后动用了20余艘航空母舰，舰载机出动达20余万架次以上。"}, {"label": "D", "text": "越南战争中交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "D", "explain": "大规模集中使用17种制导武器发生于马岛战争，越南战争中未出现。"}, {"chapter": "现代理论", "type": "single", "id": 177, "question": "新军事革命的涵义不包括（ ）", "options": [{"label": "A", "text": "新军事革命是进入机械化战争时代的重要革命"}, {"label": "B", "text": "新军事革命是整个社会变革的重要组成，强调要从社会整体变化来认识新军事变革。"}, {"label": "C", "text": "新军事变革是科学技术发展和应用的必然结果，必须从现代科学技术的发展来认识新军事变革。"}, {"label": "D", "text": "新军事变革是军事领域的整体变革，必须从军事发展的全局来认识新军事变革。"}], "answer": "A", "explain": "新军事革命是进入信息化战争时代的重要革命，而非机械化战争时代。"}, {"chapter": "现代理论", "type": "single", "id": 178, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "越南战争"}, {"label": "D", "text": "海湾战争"}], "answer": "B", "explain": "高技术战争初期发展与基本形成阶段的代表性战争是第四次中东战争。"}, {"chapter": "现代理论", "type": "single", "id": 179, "question": "对第四次中东战争描述正确的是（）。", "options": [{"label": "A", "text": "处于高技术战争的高速发展阶段。"}, {"label": "B", "text": "第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "在第四次中东战争中出现了直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "B", "explain": "第四次中东战争处于高技术战争初期形成阶段，交战各方普遍运用各型导弹和先进装甲车辆较量。"}, {"chapter": "信息化武装", "type": "single", "id": 180, "question": "在世界战争史上第一次被人们称作“信息战争”的战例是（   ）。", "options": [{"label": "A", "text": "第四次中东战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "海湾战争"}, {"label": "D", "text": "阿富汗战争"}], "answer": "C", "explain": "正确答案C：海湾战争首次运用大量信息技术，是世界战争史上第一次被称为“信息战争”的战例。"}, {"chapter": "信息化武装", "type": "single", "id": 181, "question": "未来战争能否取得胜利,最终的决定性因素是（   ）。", "options": [{"label": "A", "text": "武器"}, {"label": "B", "text": "参战国的国际地位"}, {"label": "C", "text": "人"}, {"label": "D", "text": "作战的理论与方法"}], "answer": "C", "explain": "正确答案C：无论武器如何先进，人是战争胜负的决定性因素。"}, {"chapter": "信息化武装", "type": "single", "id": 182, "question": "信息化战争战场空间广阔的特征表现在（   ）。", "options": [{"label": "A", "text": "陆地和海"}, {"label": "B", "text": "海洋和空中"}, {"label": "C", "text": "陆地、海洋、空中的三维空间"}, {"label": "D", "text": "陆、海、空、天、电多维空间"}], "answer": "D", "explain": "正确答案D：信息化战争战场空间拓展到陆、海、空、天、电多维空间。"}, {"chapter": "信息化武装", "type": "single", "id": 183, "question": "（   ）是冷战结束后规模最大、参战国最多、现代化程度最高的一场局部战争。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "伊拉克战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "科索沃战争"}], "answer": "A", "explain": "正确答案A：海湾战争是冷战结束后规模最大、参战国最多、现代化程度最高的局部战争。"}, {"chapter": "信息化武装", "type": "single", "id": 184, "question": "下列对20世纪90年代初的“海湾战争”表述正确的是（   ）。", "options": [{"label": "A", "text": "拉开了信息化战争时代的序幕"}, {"label": "B", "text": "是全面信息化战争的雏形"}, {"label": "C", "text": "使信息化战争达到鼎盛时期"}, {"label": "D", "text": "是信息化战争全面形成的标志"}], "answer": "B", "explain": "正确答案B：海湾战争信息化程度尚不充分，只是全面信息化战争的雏形。"}, {"chapter": "信息化武装", "type": "single", "id": 185, "question": "信息化战争全面形成的标志是（   ）", "options": [{"label": "A", "text": "大量信息技术在战争中的使用"}, {"label": "B", "text": "高技术局部战争的发生"}, {"label": "C", "text": "海湾战争的爆发"}, {"label": "D", "text": "地面部队的数字化和作战行动方式的非线式一体化"}], "answer": "D", "explain": "正确答案D：地面部队数字化和作战行动非线式一体化标志着信息化战争全面形成。"}, {"chapter": "信息化武装", "type": "single", "id": 186, "question": "集指挥、控制、通信、计算机、情报、监视和侦查于一体的（   ）系统是信息化战场上军队行动的“大脑和中枢神经”。", "options": [{"label": "A", "text": "指挥控制"}, {"label": "B", "text": "后勤保障"}, {"label": "C", "text": "参谋策划"}, {"label": "D", "text": "协调联系"}], "answer": "A", "exp 国防动员的组织体系是由（  ）三部分组成。", "options": [{"label": "A", "text": "动员决策机构"}, {"label": "B", "text": "组织结构"}, {"label": "C", "text": "协调机构"}, {"label": "D", "text": "执行机构"}], "answer": "ACD", "explain": "正确答案ACD：国防动员组织体系由动员决策机构、协调机构、执行机构组成。"}, {"chapter": "中国国防", "type": "multi", "id": 270, "question": "中国人民解放军现有的军种包括（ ）", "options": [{"label": "A", "text": "联勤保障部队"}, {"label": "B", "text": "陆军"}, {"label": "C", "text": "火箭军"}, {"label": "D", "text": "空军"}], "answer": "BCD", "explain": "正确答案BCD：解放军现有军种含陆军、火箭军、空军，联勤保障部队非军种（题干为现役军种）。"}, {"chapter": "中国国防", "type": "multi", "id": 271, "question": "大学生入伍享受哪些优惠政策( )。", "options": [{"label": "A", "text": "保留入学资格或学籍"}, {"label": "B", "text": "享受学费补偿和国家助学贷款代偿"}, {"label": "C", "text": "大学生士兵退役后享受升学优惠政策"}, {"label": "D", "text": "大学毕业生可选拔为军官"}], "answer": "ABCD", "explain": "正确答案ABCD：大学生入伍享有保留学籍、学费补偿代偿、退役升学优惠、毕业可选拔军官等政策。"}, {"chapter": "中国国防", "type": "multi", "id": 272, "question": "国防领导体制是国家（  ）国防建设和军事斗争的组织体系及相应制度，是国防体制和国家体制的重要组成部分。", "options": [{"label": "A", "text": "谋划"}, {"label": "B", "text": "决策"}, {"label": "C", "text": "指挥"}, {"label": "D", "text": "协调"}], "answer": "ABCD", "explain": "正确答案ABCD：国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系。"}, {"chapter": "中国国防", "type": "multi", "id": 273, "question": "根据《中华人民共和国宪法》和《中华人民共和国国防法》， 中华人民共和国的国防领导权由（ ）行使", "options": [{"label": "A", "text": "中共中央"}, {"label": "B", "text": "省人大及其常务委员会"}, {"label": "C", "text": "国家主席"}, {"label": "D", "text": "中央军委"}], "answer": "ACD", "explain": "正确答案ACD：国防领导权由中共中央、国家主席、中央军委等行使，非省人大。"}, {"chapter": "中国国防", "type": "multi", "id": 274, "question": "下列哪些是我国经典军事著作（ ）", "options": [{"label": "A", "text": "《孙子兵法》"}, {"label": "B", "text": "《六韬》"}, {"label": "C", "text": "《五轮书》"}, {"label": "D", "text": "《武经总要》"}], "answer": "ABD", "explain": "正确答案ABD：《孙子兵法》《六韬》《武经总要》是我国经典兵书，《五轮书》是日本兵书。"}, {"chapter": "中国国防", "type": "multi", "id": 275, "question": "国防的目的是（ ）。", "options": [{"label": "A", "text": "捍卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫邻国国家的领土完整"}, {"label": "D", "text": "保障公民的安全"}], "answer": "AB", "explain": "正确答案AB：国防目的在于捍卫国家主权、保卫国家统一。"}, {"chapter": "中国国防", "type": "multi", "id": 276, "question": "我国的国防手段包括（ ）。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "文化手段"}, {"label": "D", "text": "体育手段"}], "answer": "AB", "explain": "正确答案AB：我国国防手段含政治手段、外交手段等。"}, {"chapter": "中国国防", "type": "multi", "id": 277, "question": "国防法规的特性是（ ）。", "options": [{"label": "A", "text": "目标体系的多样性"}, {"label": "B", "text": "处罚措施的严厉性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "法律条例的自由性"}], "answer": "BC", "explain": "正确答案BC：国防法规特性有处罚措施的严厉性和公开程度的有限性。"}, {"chapter": "中国国防", "type": "multi", "id": 278, "question": "以下哪些是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "国民经济动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "人民防空动员"}, {"label": "D", "text": "文化动员"}], "answer": "ABC", "explain": "正确答案ABC：国防动员主要内容含国民经济、科学技术、人民防空动员，不含文化动员。"}, {"chapter": "中国国防", "type": "multi", "id": 279, "question": "以下哪些是国防动员的基本原则( ) 。", "options": [{"label": "A", "text": "优先准备，灵活多样"}, {"label": "B", "text": "全面规划，统筹兼顾"}, {"label": "C", "text": "军民结合，平战结合"}, {"label": "D", "text": "因故因势，协调灵活"}], "answer": "BCD", "explain": "正确答案BCD：国防动员基本原则含全面规划统筹兼顾、军民结合平战结合、因故因势协调灵活。"}, {"chapter": "国家安全", "type": "multi", "id": 280, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "战略环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "ABC", "explain": "正确答案ABC：战略的决定因素主要有战略思想、战略环境、军事力量。"}, {"chapter": "国家安全", "type": "multi", "id": 281, "question": "战略的基本要素包括（ )", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "ABCD", "explain": "正确答案ABCD：战略基本要素包括战略目的、战略方针、战略力量、战略手段。"}, {"chapter": "国家安全", "type": "multi", "id": 282, "question": "( )是战略行动的方向、目标、纲领和准则", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "AB", "explain": "正确答案AB：战略目的和战略方针是战略行动的方向、目标、纲领和准则。"}, {"chapter": "国家安全", "type": "multi", "id": 283, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "相对稳定性"}], "answer": "ABCD", "explain": "正确答案ABCD：战略特点有全局性、对抗性、谋略性、相对稳定性。"}, {"chapter": "国家安全", "type": "multi", "id": 284, "question": "一个国家制定战略， 应考虑以下（ ）几个方面。", "options": [{"label": "A", "text": "时代特征"}, {"label": "B", "text": "世界战略格局"}, {"label": "C", "text": "主要国家的战略动向"}, {"label": "D", "text": "当代世界战争与和平的趋势"}], "answer": "ABCD", "explain": "正确答案ABCD：制定战略需考虑时代特征、世界战略格局、主要国家战略动向、战争与和平趋势。"}, {"chapter": "国家安全", "type": "multi", "id": 285, "question": "国内战略环境是指对筹划、指导军事斗争全局具有重大影响的国内社会环境与自然环境，主要包括国家的政治、经济、军事、地理等方面的基本状况，其中，对战略具有直接影响的是( )", "options": [{"label": "A", "text": "国家的地理环境"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "综合国力状况"}, {"label": "D", "text": "外交政策"}], "answer": "ABC", "explain": "正确答案ABC：对战略有直接影响的是地理环境、政治环境、综合国力状况。"}, {"chapter": "国家安全", "type": "multi", "id": 286, "question": "( )是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性的影响。", "options": [{"label": "A", "text": "文化"}, {"label": "B", "text": "政治"}, {"label": "C", "text": "法律制度"}, {"label": "D", "text": "基本国策"}], "answer": "BCD", "explain": "正确答案BCD：法律制度和基本国策等是国内政治环境的本质核心，对军事斗争有决定性影响。"}, {"chapter": "国家安全", "type": "multi", "id": 287, "question": "我国的国家安全政策包括（ ）。", "options": [{"label": "A", "text": "构筑软实力强化新战略安全观"}, {"label": "B", "text": "独立自主、和平推进多极格局形成"}, {"label": "C", "text": "重塑国家安全体制和区域合作机制"}, {"label": "D", "text": "继续贯彻与邻为善、以邻为伴， 倡导互信、互利、平等、协作的周边外交方针"}], "answer": "ABCD", "explain": "正确答案ABCD：我国国家安全政策含构筑软实力、独立自主推进多极、重塑安全体制、周边外交方针等。"}, {"chapter": "国家安全", "type": "multi", "id": 288, "question": "依照《中华人民共和国宪法》规定，（ ）是中国社会主义建设事业的根本指导思想。", "options": [{"label": "A", "text": "马克思列宁主义"}, {"label": "B", "text": "毛泽东思想"}, {"label": "C", "text": "邓小平理论"}, {"label": "D", "text": "江泽民思想"}], "answer": "ABC", "explain": "正确答案ABC：宪法规定马列主义、毛泽东思想、邓小平理论为根本指导思想。"}, {"chapter": "国家安全", "type": "multi", "id": 289, "question": "依照《中华人民共和国宪法》规定，国家的根本任务是( ) 。", "options": [{"label": "A", "text": "大力发展文化产业"}, {"label": "B", "text": "进行社会主义现代化建设"}, {"label": "C", "text": "完成统一祖国的大业"}, {"label": "D", "text": "维护国家的独立和安全"}], "answer": "BCD", "explain": "正确答案BCD：国家根本任务是社会主义现代化建设、完成统一祖国大业、维护国家独立和安全。"}, {"chapter": "国家安全", "type": "multi", "id": 290, "question": "第二次世界大战以前，国际秩序的本质特征是（ ）。", "options": [{"label": "A", "text": "强权政治"}, {"label": "B", "text": "殖民政治"}, {"label": "C", "text": "封建政治"}, {"label": "D", "text": "多极化"}], "answer": "AB", "explain": "正确答案AB：二战前国际秩序本质特征是强权政治和殖民政治。"}, {"chapter": "国家安全", "type": "multi", "id": 291, "question": "国际战略格局的特征包括（ ）。", "options": [{"label": "A", "text": "国际战略格局与时代的发展密切相关"}, {"label": "B", "text": "国际战略格局同世界经济格局相适应"}, {"label": "C", "text": "国际战略格局各层次相对独立、相互影响"}, {"label": "D", "text": "国际秩序是国际战略格局的现状在国际准则上的反映"}], "answer": "ABCD", "explain": "正确答案ABCD：国际战略格局特征含与时代密切相关、与经济格局相适应、各层次相对独立、国际秩序是反映等。"}, {"chapter": "国家安全", "type": "multi", "id": 292, "question": "美国的（ ）成为国际局势动荡的根源。", "options": [{"label": "A", "text": "“新干涉主义”"}, {"label": "B", "text": "“干涉主义”"}, {"label": "C", "text": "\"大国主义\""}, {"label": "D", "text": "战略扩张"}], "answer": "AD", "explain": "正确答案AD：美国的“新干涉主义”和战略扩张成为国际局势动荡的根源。"}, {"chapter": "国家安全", "type": "multi", "id": 293, "question": "总体稳定是世界形势的主流，尽管发生世界大战的可能性越来越小，但局部战争的危险依然存在，由于（ ）等因素导致局部战争和武装冲突此起彼伏，一度出现增多的势头。", "options": [{"label": "A", "text": "历史结怨"}, {"label": "B", "text": "民族矛盾"}, {"label": "C", "text": "格局转换"}, {"label": "D", "text": "宗教对立"}], "answer": "ABCD", "explain": "正确答案ABCD：历史结怨、民族矛盾、格局转换、宗教对立等导致局部战争频发。"}, {"chapter": "国家安全", "type": "multi", "id": 294, "question": "总体稳定是世界形势的主流， 尽管发生世界大战的可能性越来越，但局部战争的危险依然存在，由于（ ）等因素导致局部战争和武装冲突此起彼伏，一度出现增多的势头。", "options": [{"label": "A", "text": "力量失衡"}, {"label": "B", "text": "资源纠纷"}, {"label": "C", "text": "外部插手"}, {"label": "D", "text": "武器扩散"}], "answer": "ABCD", "explain": "正确答案ABCD：力量失衡、资源纠纷、外部插手、武器扩散等导致局部冲突此起彼伏。"}, {"chapter": "国家安全", "type": "multi", "id": 295, "question": "战略的基本要素包括（ ）。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略体制"}], "answer": "AC", "explain": "正确答案AC：战略基本要素包括战略目的、战略力量。"}, {"chapter": "国家安全", "type": "multi", "id": 296, "question": "国际战略格局的现状是（ ）。", "options": [{"label": "A", "text": "美国仍是世界唯一超级大国"}, {"label": "B", "text": "世界多极化的趋势正在发展"}, {"label": "C", "text": "新的各种安全结构正在建立和完善"}, {"label": "D", "text": "经济因素在国际事务中的作用上升"}], "answer": "ABCD", "explain": "正确答案ABCD：美国仍唯一超级大国、多极化发展、新安全结构建立完善、经济因素上升是国际格局现状。"}, {"chapter": "国家安全", "type": "multi", "id": 297, "question": "国际战略格局的特点是（ ）。", "options": [{"label": "A", "text": "世界形势总体稳定，局部动荡"}, {"label": "B", "text": "大国关系相对稳定，地区国家相互靠拢"}, {"label": "C", "text": "世界军备下降幅度参差不齐，质量建军成为主要竞争形势"}, {"label": "D", "text": "美国是世界唯一超级大国，积极发动战争以获取更大的国家利益。"}], "answer": "ABC", "explain": "正确答案ABC：国际格局特点是总体稳定局部动荡、大国关系相对稳定、质量建军成为主流竞争。"}, {"chapter": "国家安全", "type": "multi", "id": 298, "question": "2015年4月22日上午 ，亚非领导人会议在印度尼西亚首都雅加达举行。国家主席习近平出席会议并发表题为《弘扬万隆精神推进合作共赢》的重要讲话，习近平就弘扬万隆精神提出（ ）倡议。", "options": [{"label": "A", "text": "深化亚非合作。面对新机遇新挑战"}, {"label": "B", "text": "拓展南南合作"}, {"label": "C", "text": "推进南北合作"}, {"label": "D", "text": "加强同西方国家的合作和发展"}], "answer": "ABC", "explain": "正确答案ABC：习近平就弘扬万隆精神提出深化亚非合作、拓展南南合作、推进南北合作等倡议。"}, {"chapter": "国家安全", "type": "multi", "id": 299, "question": "美国倚仗其经济科技实力和超强的军事力量，企图建立以美国为领导的单极世界，充当世界的领袖，但是，这些因素（     ）使得美国并不能凭借自己的优势地位在世界上为所欲为。", "options": [{"label": "A", "text": "几乎所在国家都不赞成建立以“美国为轴心的世界”新格局"}, {"label": "B", "text": "美国在国内面临众多的社会问题和经济问题，不具备承担“领导世界重任”的能力"}, {"label": "C", "text": "在国际上欧洲、日本等国家和地区的挑战，对美国的“世界新秩序”形成一大制约"}, {"label": "D", "text": "当今世界仍有许多尖锐矛盾和复杂问题，无论美国如何强大和富有，都不可能包揽解决所有问题"}], "answer": "ABCD", "explain": "正确答案ABCD：多数国家反对单极世界、美国内问题、欧日挑战、世界矛盾复杂使美国不能为所欲为。"}, {"chapter": "国家安全", "type": "multi", "id": 300, "question": "在未来国际战略格局多极化发展的进程中，起主导作用的国家是", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "俄罗斯"}, {"label": "D", "text": "日本"}], "answer": "ABCD", "explain": "正确答案ABCD：未来多极化进程中美国、中国、俄罗斯、日本等起主导作用（按教材）。"}, {"chapter": "国家安全", "type": "multi", "id": 301, "question": "未来国际战略格局的发展趋势是（ ）。", "options": [{"label": "A", "text": "“多极化”将是未来国际战略格局发展的必然趋势。"}, {"label": "B", "text": "美国“一超独霸＂的局面将维持很长一段时间"}, {"label": "C", "text": "未来国际战略格局中各方关系将日趋复杂化"}, {"label": "D", "text": "维护国家利益的“软战争”将对国际战略格局产生重要影响"}], "answer": "ACD", "explain": "正确答案ACD：多极化是必然趋势，各方关系复杂化，软战争影响格局；美国独霸非长期。"}, {"chapter": "国家安全", "type": "multi", "id": 302, "question": "世界上军队在100万以上的国家，除中国外还有( )。", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "俄罗斯"}, {"label": "C", "text": "印度"}, {"label": "D", "text": "朝鲜"}], "answer": "ABCD", "explain": "正确答案ABCD：军队百万以上国家除中国外还有美国、俄罗斯、印度、朝鲜。"}, {"chapter": "国家安全", "type": "multi", "id": 303, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "印度"}, {"label": "B", "text": "巴基斯坦"}, {"label": "C", "text": "朝鲜"}, {"label": "D", "text": "俄罗斯"}], "answer": "ABCD", "explain": "正确答案ABCD：公开宣称拥核的印度、巴基斯坦、朝鲜、俄罗斯在中国周边。"}, {"chapter": "国家安全", "type": "multi", "id": 304, "question": "当今世界五大热点地区，（ ）都在中国周边。", "options": [{"label": "A", "text": "中东波斯湾"}, {"label": "B", "text": "朝鲜半岛"}, {"label": "C", "text": "南亚次大陆"}, {"label": "D", "text": "台湾海峡"}], "answer": "ABCD", "explain": "正确答案ABCD：中东波斯湾、朝鲜半岛、南亚次大陆、台湾海峡等热点在中国周边。"}, {"chapter": "国家安全", "type": "multi", "id": 305, "question": "从新中国成立到20世纪60年代， 对我国独立和安全的威胁主要来自美国，美国不甘心在中国内地的失败，长期推行（ ）政策。", "options": [{"label": "A", "text": "政治上孤立"}, {"label": "B", "text": "经济上封锁"}, {"label": "C", "text": "军事上威胁"}, {"label": "D", "text": "反华、仇华"}], "answer": "ABCD", "explain": "正确答案ABCD：美国对我国长期推行政治孤立、经济封锁、军事威胁、反华仇华政策。"}, {"chapter": "国家安全", "type": "multi", "id": 306, "question": "为打破美、前苏两个超级大国对我国实施的战略包围 ， 我国先后采取了一系列重大战略性举措，（ ）有力地打击了霸权主义行径。", "options": [{"label": "A", "text": "抗美援朝"}, {"label": "B", "text": "中印边境自卫反击战"}, {"label": "C", "text": "援越抗美斗争"}, {"label": "D", "text": "中越边境自卫还击作战"}], "answer": "ABCD", "explain": "正确答案ABCD：抗美援朝、中印边境自卫反击战、援越抗美、中越边境自卫还击等打击了霸权主义。"}, {"chapter": "国家安全", "type": "multi", "id": 307, "question": "当前，出于应对（ ）等方面的需要，中美关系在政治、经济、军事等领域均得到了很大改善。", "options": [{"label": "A", "text": "全球经济金融"}, {"label": "B", "text": "气候危机"}, {"label": "C", "text": "联合反恐"}, {"label": "D", "text": "反对霸权主义"}], "answer": "ABC", "explain": "正确答案ABC：应对全球金融、气候危机、联合反恐等需要使中美关系改善。"}, {"chapter": "国家安全", "type": "multi", "id": 308, "question": "美国在不放松对中国在经济、政治、文化等方面遏制的同时， 在军事方面采取的措施有（ ）。", "options": [{"label": "A", "text": "实现了在中亚的军事存在"}, {"label": "B", "text": "增强了其在东亚、东南亚、南亚地区的军事存在"}, {"label": "C", "text": "提升关岛美军的军备水平和战略威慑能力， 形成日本和关岛两大地区兵力投送中心"}, {"label": "D", "text": "调整了其在亚太地区的军事战略部署，强化了美国与日、韩、澳等盟国的军事同盟关系"}], "answer": "ABCD", "explain": "正确答案ABCD：美对华军事遏制表现为中亚存在、增强东亚东南亚军事存在、提升关岛、调整亚太部署。"}, {"chapter": "国家安全", "type": "multi", "id": 309, "question": "中日之间存在一系列的矛盾和斗争，这体现在（ ）方面。", "options": [{"label": "A", "text": "中日之间在钓鱼岛方面存在严重争端"}, {"label": "B", "text": "中日之间在东海大陆架和东海油气资源方面存在严重争端"}, {"label": "C", "text": "日本在台湾问题上挑战中国的国家核心利益"}, {"label": "D", "text": "日本当局歪曲历史，美化侵略战争，拒绝承担战争责任"}], "answer": "ABCD", "explain": "正确答案ABCD：中日矛盾体现在钓鱼岛、东海大陆架油气、台湾问题、歪曲历史美化侵略等。"}, {"chapter": "国家安全", "type": "multi", "id": 310, "question": "境内的恐怖势力与境外“三股恶势力”遥相呼应， 在西方反华势力的支待下正走出“垫伏期”，不断进行干扰破坏活动，暴力化趋势日益增强下列（ ）给各族群众生命财产造成重大损失，给当地正常秩序和社会稳定 造成严重破坏。", "options": [{"label": "A", "text": "西藏“3·14”事件"}, {"label": "B", "text": "乌鲁木齐“7·5”严重暴力犯罪事件"}, {"label": "C", "text": "昆明火车站暴力恐怖案件"}, {"label": "D", "text": "云南腾冲除夕血案"}], "answer": "ABCD", "explain": "正确答案ABCD：西藏3·14、乌鲁木齐7·5、昆明火车站暴恐、云南腾冲案件均造成重大损失。"}, {"chapter": "国家安全", "type": "multi", "id": 311, "question": "中国周边安全环境的特点是（ ）。", "options": [{"label": "A", "text": "邻国众多，强邻环伺"}, {"label": "B", "text": "战略区位重要，大国利益交汇"}, {"label": "C", "text": "多性突出，热点矛盾集中"}, {"label": "D", "text": "相安无事，和平安全"}], "answer": "ABC", "explain": "正确答案ABC：周边安全特点是邻国众多强邻环伺、战略区位重要大国利益交汇、热点矛盾集中。"}, {"chapter": "国家安全", "type": "multi", "id": 312, "question": "中国周边安全环境的现状是( )。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "中日之间存在一系列的矛盾和斗争"}, {"label": "C", "text": "恐怖主义活动猖獗， 对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "正确答案ABCD：周边安全现状含美国视我为对手、中日矛盾、恐怖主义猖獗、海洋权益受挑战。"}, {"chapter": "国家安全", "type": "multi", "id": 313, "question": "大国关系的相对平稳发展是中国周边继续保待缓和的基础，下列大国关系描述正确的是（ ）。", "options": [{"label": "A", "text": "日傍美制华，并不甘心为美火中取栗。"}, {"label": "B", "text": "美借日制华，却不希望中日交恶而不可收拾。"}, {"label": "C", "text": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，但双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，并不希望与中国发生对抗。"}, {"label": "D", "text": "遭受美国战略挤压的俄罗斯，在国力未得到全面恢复前 ，仍将是中国主荌战略伙伴，中俄关系有望继续稳固发展。"}], "answer": "ABCD", "explain": "正确答案ABCD：日傍美、美借日且不与中国对抗、美国不与中国对抗、中俄关系稳固等大国关系描述正确。"}, {"chapter": "国家安全", "type": "multi", "id": 314, "question": "中国周边地区热点问题包括（ ）。", "options": [{"label": "A", "text": "印巴矛盾"}, {"label": "B", "text": "朝鲜半岛"}, {"label": "C", "text": "东海岛屿争端"}, {"label": "D", "text": "南海岛屿争端"}], "answer": "ABCD", "explain": "正确答案ABCD：周边热点问题含印巴矛盾、朝鲜半岛、东海岛屿争端、南海岛屿争端。"}, {"chapter": "国家安全", "type": "multi", "id": 315, "question": "中国周边安全环境的发展趋势是（ ）。", "options": [{"label": "A", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "B", "text": "大国关系的相对平稳发展是中国周边继续保持缓和的基础"}, {"label": "C", "text": "地区热点发生热战的可能性较低"}, {"label": "D", "text": "非传统安全问题将成为地区安全合作的催化剂"}], "answer": "BCD", "explain": "正确答案BCD：发展趋势是大国关系平稳、地区热点热战可能低、非传统安全问题成合作催化剂。"}, {"chapter": "国家安全", "type": "multi", "id": 316, "question": "综合安全观认为国际安全问题除了以主权概念为核心的政治安全和军事安全之外，还有（ ）等一系列新的安全问题。", "options": [{"label": "A", "text": "经济安全"}, {"label": "B", "text": "环境安全"}, {"label": "C", "text": "文化安全"}, {"label": "D", "text": "社会安全"}], "answer": "ABCD", "explain": "正确答案ABCD：综合安全观除政治军事外还包括经济、环境、文化、社会安全。"}, {"chapter": "国家安全", "type": "multi", "id": 317, "question": "我国的新战略安全观主要包括( ) 。", "options": [{"label": "A", "text": "以国家安全为主体，突出主权安全"}, {"label": "B", "text": "以和平共处五项原则为政治基础"}, {"label": "C", "text": "以相互安全为理论前提"}, {"label": "D", "text": "以综合安全为安全维护的内容"}], "answer": "ABCD", "explain": "正确答案ABCD：新战略安全观含以国家安全为主体、和平共处五项原则为基础、相互安全为前提、综合安全为内容。"}, {"chapter": "国家安全", "type": "multi", "id": 318, "question": "我国在发展大国关系政策上有新的定位，其内容包括 ( )。", "options": [{"label": "A", "text": "是不对抗、不结盟、不针对第三国的原则定位"}, {"label": "B", "text": "是包容整体利益的双赢策略定位"}, {"label": "C", "text": "是多重角色并举、灵活多变、万变不离其宗的角色定位。"}, {"label": "D", "text": "以和平共处五项原则为政治基础"}], "answer": "ABC", "explain": "正确答案ABC：我国大国关系政策定位为不对抗不结盟不针对第三国、双赢、多重角色灵活等。"}, {"chapter": "国家安全", "type": "multi", "id": 319, "question": "2012年6月21日，国务院正式批准成立地级市“三沙市”，对其描述正确的是（）", "options": [{"label": "A", "text": "三沙市是中国地理纬度位置最南端的市"}, {"label": "B", "text": "三沙市的设立标志着中国继浙江省舟山市之后，出现了第二个以群岛为行政区划设立的地级市"}, {"label": "C", "text": "三沙市的设立标志着中国对南海及其附属岛屿、岛礁及有关领海的控制，有了更为有利的法理依据"}, {"label": "D", "text": "设立三沙市有利于进一步加强中国对西沙群岛 、中沙群岛、南沙群岛的岛礁及其海域的行政管理和开发建设，保护南海海洋环境"}], "answer": "ABCD", "explain": "正确答案ABCD：三沙市是中国最南端地级市、第二个群岛地级市、提供法理依据、利于行政管理开发保护环境。"}, {"chapter": "国家安全", "type": "multi", "id": 320, "question": "2012年6月21日，国务院将以前设立的县级三沙市升格为地级市“三沙市”，管辖（）的岛礁及其海域。", "options": [{"label": "A", "text": "东沙群岛"}, {"label": "B", "text": "西沙群岛"}, {"label": "C", "text": "中沙群岛"}, {"label": "D", "text": "南沙群岛"}], "answer": "BCD", "explain": "正确答案BCD：三沙市管辖西沙群岛、中沙群岛、南沙群岛及其海域。"}, {"chapter": "国家安全", "type": "multi", "id": 321, "question": "我国的国家安全政策包括（ ）。", "options": [{"label": "A", "text": "构筑软实力强化新战略安全观"}, {"label": "B", "text": "致力于发展新型大国关系"}, {"label": "C", "text": "重塑国家安全体制和区域合作机制"}, {"label": "D", "text": "继续贯彻与邻为善、以邻为伴，倡导互信、互利、平等、协作的周边外交方针"}], "answer": "ABCD", "explain": "正确答案ABCD：我国国家安全政策含构筑软实力、发展新型大国关系、重塑安全体制、周边外交方针等。"}, {"chapter": "国家安全", "type": "multi", "id": 322, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "AC", "explain": "正确答案AC：战略决定因素主要有战略思想、军事力量。"}, {"chapter": "国家安全", "type": "multi", "id": 323, "question": "战略的基本要素包括（ ）。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "ACD", "explain": "正确答案ACD：战略基本要素包括战略目的、战略力量、战略手段。"}, {"chapter": "国家安全", "type": "multi", "id": 324, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "多样性"}], "answer": "ABC", "explain": "正确答案ABC：战略特点有全局性、对抗性、谋略性。"}, {"chapter": "国家安全", "type": "multi", "id": 325, "question": "一个国家制定战略，应考虑以下（ ）几个方面。", "options": [{"label": "A", "text": "时代特征"}, {"label": "B", "text": "周边安全形势"}, {"label": "C", "text": "主要国家的战略动向"}, {"label": "D", "text": "当代世界战争与和平的趋势"}], "answer": "ABCD", "explain": "正确答案ABCD：制定战略需考虑时代特征、周边安全形势、主要国家战略动向、战争与和平趋势。"}, {"chapter": "国家安全", "type": "multi", "id": 326, "question": "( )是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性的影响。", "options": [{"label": "A", "text": "文化"}, {"label": "B", "text": "政治"}, {"label": "C", "text": "教育制度"}, {"label": "D", "text": "基本国策"}], "answer": "BD", "explain": "正确答案BD：政治和基本国策是国内政治环境的本质核心，对军事斗争有决定性影响。"}, {"chapter": "国家安全", "type": "multi", "id": 327, "question": "中国周边安全环境的现状是（ ）。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "台海局势出现重大积极变化， 但反“台独”斗争依然严峻、复杂"}, {"label": "C", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "正确答案ABCD：周边安全现状含美国视我为对手、台海反台独斗争、恐怖主义、海洋权益受挑战。"}, {"chapter": "国家安全", "type": "multi", "id": 328, "question": "在未来国际战略格局多极化发展的进程中，起主导作用的国家是", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "欧盟"}, {"label": "D", "text": "日本"}], "answer": "ABD", "explain": "正确答案ABD：未来多极化进程中美国、中国、日本起主导作用（按教材）。"}, {"chapter": "国家安全", "type": "multi", "id": 329, "question": "世界上军队在100万以上的国家，除中国外还有( )。", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "俄罗斯"}, {"label": "C", "text": "印度"}, {"label": "D", "text": "日本"}], "answer": "ABC", "explain": "正确答案ABC：军队百万以上国家除中国外还有美国、俄罗斯、印度。"}, {"chapter": "国家安全", "type": "multi", "id": 330, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "日本"}, {"label": "B", "text": "巴基斯坦"}, {"label": "C", "text": "朝鲜"}, {"label": "D", "text": "俄罗斯"}], "answer": "BCD", "explain": "正确答案BCD：巴基斯坦、朝鲜、俄罗斯等拥核国家在中国周边，日本无核。"}, {"chapter": "国家安全", "type": "multi", "id": 331, "question": "中国周边安全环境的现状是（ ）。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "台海局势出现重大积极变化，但反“台独”斗争依然严峻、复杂"}, {"label": "C", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "正确答案ABCD：周边安全现状含美国视我为对手、台海反台独斗争、恐怖主义猖獗、海洋权益受挑战。"}, {"chapter": "国家安全", "type": "multi", "id": 332, "question": "大国关系的相对平稳发展是中国周边继续保持缓和的基础，下列大国关系描述正确的是（ ）。", "options": [{"label": "A", "text": "日傍美制华，并不甘心为美火中取栗"}, {"label": "B", "text": "印美关系虽发展迅速，但印度不会全面倒向美国，沦为美遏制中国的棋子。"}, {"label": "C", "text": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。"}, {"label": "D", "text": "遭受美国战略挤压的俄罗斯，在国力未得到全面恢复前，仍将是中国主要战略伙伴，中俄关系有望继续稳固发展。"}], "answer": "ABD", "explain": "正确答案ABD：日傍美、印度不倒向美国、中俄关系稳固正确，美国不要求对抗表述错误。"}, {"chapter": "国家安全", "type": "multi", "id": 333, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "多样性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "权威性"}, {"label": "D", "text": "相对稳定性"}], "answer": "BD", "explain": "正确答案BD：战略特点包括对抗性和相对稳定性。"}, {"chapter": "国家安全", "type": "multi", "id": 334, "question": "我国的新战略安全观主要包括( )。", "options": [{"label": "A", "text": "以共同安全和普通安全为目标"}, {"label": "B", "text": "以和平共处五项原则为政治基础"}, {"label": "C", "text": "以合作安全为现实安全的途径"}, {"label": "D", "text": "以“互信、互利、平等、协作”为新安全观的核心"}], "answer": "ABCD", "explain": "正确答案ABCD：新战略安全观含共同安全、和平共处五项原则、合作安全、互信互利平等协作等。"}, {"chapter": "国家安全", "type": "multi", "id": 335, "question": "我国在发展大国关系政策上有新的定位坚持（ ）的原则。", "options": [{"label": "A", "text": "不对抗"}, {"label": "B", "text": "不结盟"}, {"label": "C", "text": "不合作"}, {"label": "D", "text": "不针对第三国"}], "answer": "ABD", "explain": "正确答案ABD：我国发展大国关系坚持不对抗、不结盟、不针对第三国原则。"}, {"chapter": "军事思想", "type": "multi", "id": 336, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "丰富的实践性"}, {"label": "D", "text": "明显的继承性"}], "answer": "ABCD", "explain": "正确答案ABCD：军事思想特征有鲜明的阶级性、强烈的时代感、丰富的实践性、明显的继承性。"}, {"chapter": "军事思想", "type": "multi", "id": 337, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（ ）", "options": [{"label": "A", "text": "《吴子》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "ABCD", "explain": "正确答案ABCD：春秋战国时期《吴子》《孙膑兵法》《司马法》《孙子兵法》影响较大。"}, {"chapter": "军事思想", "type": "multi", "id": 338, "question": "与中国古代军事思想相比， 世界古代军事思想起步较晚， 反映了该时期军事思想的著作有（ ）。", "options": [{"label": "A", "text": "《伯罗奔尼撒战争史》"}, {"label": "B", "text": "《希腊波斯战争史》"}, {"label": "C", "text": "《罗马军制》"}, {"label": "D", "text": "《长征记》"}], "answer": "ABCD", "explain": "正确答案ABCD：《伯罗奔尼撒战争史》《希腊波斯战争史》《罗马军制》《长征记》反映世界古代军事思想。"}, {"chapter": "军事思想", "type": "multi", "id": 339, "question": "宋神宗时期，把（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《黄石公三略》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《太白阴经》"}], "answer": "ABC", "explain": "正确答案ABC：《黄石公三略》《三略》《尉缭子》属《武经七书》，《太白阴经》不在其中。"}, {"chapter": "军事思想", "type": "multi", "id": 340, "question": "无产阶级军事思想的代表人物是（ ）。", "options": [{"label": "A", "text": "拿破仑"}, {"label": "B", "text": "马克思"}, {"label": "C", "text": "恩格斯"}, {"label": "D", "text": "列宁"}], "answer": "BCD", "explain": "正确答案BCD：马克思、恩格斯、列宁是无产阶级军事思想代表人物。"}, {"chapter": "军事思想", "type": "multi", "id": 341, "question": "反映了近代无产阶级军事思想的著作有( )。", "options": [{"label": "A", "text": "《共产党宣言》"}, {"label": "B", "text": "《德国农民战争》"}, {"label": "C", "text": "《法兰西内战》"}, {"label": "D", "text": "《步枪史》"}], "answer": "ABCD", "explain": "正确答案ABCD：《共产党宣言》《德国农民战争》《法兰西内战》《步枪史》反映近代无产阶级军事思想。"}, {"chapter": "军事思想", "type": "multi", "id": 342, "question": "体现了中国古代军事思想中战争论战争本质观的有( )。", "options": [{"label": "A", "text": "兵者，拨乱之神物也"}, {"label": "B", "text": "兵者，刑也"}, {"label": "C", "text": "兵者，文武也"}, {"label": "D", "text": "兵者，礼义忠信也"}], "answer": "ABCD", "explain": "正确答案ABCD：兵者刑也、文武也、拨乱神物、礼义忠信均体现战争本质观。"}, {"chapter": "军事思想", "type": "multi", "id": 343, "question": "中国古代军事思想中战争论的内容有（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "ABCD", "explain": "正确答案ABCD：中国古代军事思想战争论含本质观、和平观、政治观、经济观。"}, {"chapter": "军事思想", "type": "multi", "id": 344, "question": "中国古代军事思想战争论中“战争和平观”对待战争的态度有（ ）。", "options": [{"label": "A", "text": "偃武修文"}, {"label": "B", "text": "偃兵废武"}, {"label": "C", "text": "穷兵赎武"}, {"label": "D", "text": "义兵慎战"}], "answer": "ABCD", "explain": "正确答案ABCD：战争和平观对战争态度有偃武修文、偃兵废武、穷兵黩武、义兵慎战。"}, {"chapter": "军事思想", "type": "multi", "id": 345, "question": "中国古代军事思想战备论中战备的内容有（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "经济上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "军事上备战"}], "answer": "ABCD", "explain": "正确答案ABCD：战备内容包括政治上、经济上、思想上、军事上备战。"}, {"chapter": "军事思想", "type": "multi", "id": 346, "question": "中国古代军事思想战备论中战备的基本原则有（ ）。", "options": [{"label": "A", "text": "超前性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "整体性原则"}, {"label": "D", "text": "隐蔽性原则"}], "answer": "ABCD", "explain": "正确答案ABCD：战备基本原则有超前性、超盖性、整体性、隐蔽性原则。"}, {"chapter": "军事思想", "type": "multi", "id": 347, "question": "中国古代军事思想中治军论的内容有（ ）。", "options": [{"label": "A", "text": "国以军为辅"}, {"label": "B", "text": "军以民为本"}, {"label": "C", "text": "凡兵，制必先定"}, {"label": "D", "text": "凡胜，备必先具"}], "answer": "ABCD", "explain": "正确答案ABCD：治军论含国以军为辅、军以民为本、凡兵制必先定、凡胜备必先具。"}, {"chapter": "军事思想", "type": "multi", "id": 348, "question": "中国古代军事思想用兵论的主要内容有( )。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "兵之情主速"}, {"label": "D", "text": "致人而不致于人"}], "answer": "ABCD", "explain": "正确答案ABCD：用兵论主要内容含先谋为本、先胜而后求战、兵之情主速、致人而不致于人。"}, {"chapter": "军事思想", "type": "multi", "id": 349, "question": "下列体现了中国古代军事思想用兵论中“用兵之道，先谋为本”的观点是（）", "options": [{"label": "A", "text": "备必预豫具，虑必先圣定"}, {"label": "B", "text": "夫用兵之道，必定其谋"}, {"label": "C", "text": "勇不足恃，用兵在先定谋"}, {"label": "D", "text": "兵不在众，以治为胜"}], "answer": "ABC", "explain": "正确答案ABC：备必预豫具、必定其谋、用兵在先定谋体现先谋为本，兵以治为胜不同。"}, {"chapter": "军事思想", "type": "multi", "id": 350, "question": "下列体现了中国古代军事思想用兵论中“兵之情主速＂ 的观点是（ ）。", "options": [{"label": "A", "text": "兵贵胜，不贵久"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "夫用兵之道，必定其谋"}, {"label": "D", "text": "兵闻拙速，未睹巧之久也"}], "answer": "ABD", "explain": "正确答案ABD：兵贵胜不贵久、久则钝兵、兵闻拙速体现兵之情主速，必定其谋不在此。"}, {"chapter": "军事思想", "type": "multi", "id": 351, "question": "下列体现了中国古代军事思想用兵论中“因机立胜”的观点是", "options": [{"label": "A", "text": "运用之妙，存乎一心"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "兵形象水，水因地而制流，兵因敌而制胜"}, {"label": "D", "text": "时不再来，机不可失，则速攻之，速围之，速逐之，速持捣之，靡有不胜"}], "answer": "AC", "explain": "正确答案AC：运用之妙存乎一心、兵因敌而制胜体现因机立胜。"}, {"chapter": "军事思想", "type": "multi", "id": 352, "question": "以下（ ）体现了中国古代军事思想中将帅选拔任用的开放性原则。", "options": [{"label": "A", "text": "不论贵贱，唯才是举"}, {"label": "B", "text": "不论亲疏，唯能是用"}, {"label": "C", "text": "不拘一格，唯才是用"}, {"label": "D", "text": "德才兼备，以德为先"}], "answer": "ABC", "explain": "正确答案ABC：不论贵贱唯才是举、不论亲疏唯能是用、不拘一格唯才是用体现选拔开放性。"}, {"chapter": "军事思想", "type": "multi", "id": 353, "question": "下列属于中国古代军事思想中将帅选拔任用原则的是（ ）。", "options": [{"label": "A", "text": "全面性"}, {"label": "B", "text": "实践性"}, {"label": "C", "text": "优化性"}, {"label": "D", "text": "专任性"}], "answer": "ABCD", "explain": "正确答案ABCD：将帅选拔任用原则含全面性、实践性、优化性、专任性。"}, {"chapter": "军事思想", "type": "multi", "id": 354, "question": "毛泽东军事思想的科学含义是（ ）。", "options": [{"label": "A", "text": "毛泽东军事思想是马列主义的基本原理与中国革命战争具体实践相结合的产物"}, {"label": "B", "text": "毛泽东军事思想是中国人民革命战争和国防建设实践经验的总结"}, {"label": "C", "text": "毛泽东军事思想是中国共产党集体智慧的结晶"}, {"label": "D", "text": "毛泽东军事思想是毛泽东思想的重要组成部分"}], "answer": "ABCD", "explain": "正确答案ABCD：毛泽东思想科学含义含与马列结合、革命实践总结、集体智慧结晶、思想重要组成部分。"}, {"chapter": "军事思想", "type": "multi", "id": 355, "question": "现代战争的根源是（ ）。", "options": [{"label": "A", "text": "殖民主义"}, {"label": "B", "text": "帝国主义"}, {"label": "C", "text": "霸权主义"}, {"label": "D", "text": "恐怖主义"}], "answer": "BC", "explain": "正确答案BC：现代战争根源是帝国主义和霸权主义。"}, {"chapter": "军事思想", "type": "multi", "id": 356, "question": "属于毛泽东军事理论创新的是（ ）。", "options": [{"label": "A", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}, {"label": "B", "text": "创建了一支新型的人民军队"}, {"label": "C", "text": "创造了适合中国特点的人民战争的战略战术"}, {"label": "D", "text": "科学地阐明了关于研究和指导战争的战争观和方法论"}], "answer": "ABCD", "explain": "正确答案ABCD：农村包围城市、创建新型人民军队、人民战争战略战术、战争观方法论均属毛泽东思想创新。"}, {"chapter": "军事思想", "type": "multi", "id": 357, "question": "属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "军队和国防建设指导思想实行战略性转变"}, {"label": "B", "text": "实行积极防御的军事战略方针"}, {"label": "C", "text": "建设一支强大的现代化正规化的革命军队"}, {"label": "D", "text": "始终不渝地坚持人民军队的性质"}], "answer": "ABCD", "explain": "正确答案ABCD：邓小平军队思想含指导思想战略性转变、积极防御方针、建设现代化革命军队、坚持人民军队性质。"}, {"chapter": "军事思想", "type": "multi", "id": 358, "question": "属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "提高军队建设的正规化水平"}, {"label": "B", "text": "坚定不移地走有中国特色的精兵之路"}, {"label": "C", "text": "中心是解决现代化的问题"}, {"label": "D", "text": "要把教育训练提高到战略地位"}], "answer": "ABCD", "explain": "正确答案ABCD：邓小平军队思想含提高正规化水平、走精兵之路、解决现代化、教育训练战略地位。"}, {"chapter": "军事思想", "type": "multi", "id": 359, "question": "江泽民国防和军队建设思想的理论体系包括( )。", "options": [{"label": "A", "text": "解决好打得赢、不变质两个历史性课题"}, {"label": "B", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "C", "text": "实施科技强军战略， 加强军队质量建设"}, {"label": "D", "text": "坚持依法治军、从严治军"}], "answer": "ABCD", "explain": "正确答案ABCD：江国防思想体系含打得赢不变质、五句话总要求、科技强军、依法治军从严治军。"}, {"chapter": "军事思想", "type": "multi", "id": 360, "question": "江泽民国防和军队建设思想的理论体系包括( )。", "options": [{"label": "A", "text": "积极推进中国特色的军事变革"}, {"label": "B", "text": "用新时期军事战略方针统揽军队建设全局"}, {"label": "C", "text": "培养和造就大批高素质的新型军事人才"}, {"label": "D", "text": "走出一条投入较少、效益较高的军队现代化建设路子"}], "answer": "ABCD", "explain": "江泽民国防和军队建设思想涵盖推进中国特色军事变革、以新时期军事战略方针统揽全局、培养高素质新型军事人才和走投入较少效益较高之路，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 361, "question": "胡锦涛国防和军队建设思想的主要内容包括( )。", "options": [{"label": "A", "text": "学肩负起确立新世纪新阶段军队历史使命"}, {"label": "B", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "C", "text": "创新发展新形势下思想政治建设"}, {"label": "D", "text": "全面提高军队有效履行使命任务的能力"}], "answer": "ABCD", "explain": "胡锦涛国防和军队建设思想包括肩负新世纪新阶段历史使命、以科学发展观为指导方针、创新发展思想政治建设和全面提高履行使命能力，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 362, "question": "胡锦涛国防和军队建设思想的主要内容包括( )。", "options": [{"label": "A", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "B", "text": "积极推进国防和军队建设各领域改革"}, {"label": "C", "text": "把以人为本作为重要的建军治军原则"}, {"label": "D", "text": "走中国特色军民融合式发展的路。"}], "answer": "BCD", "explain": "“五句话”总要求是江泽民提出的，不属于胡锦涛军队建设思想，其余推进改革、以人为本、军民融合式发展均为胡锦涛内容，故选BCD。"}, {"chapter": "军事思想", "type": "multi", "id": 363, "question": "习近平国防和军队建设重要论述的主要内容包括（ ）。", "options": [{"label": "A", "text": "为实现中国梦提供坚强力量保证"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "ABCD", "explain": "习近平强军思想包括为实现中国梦提供力量保证、建设听党指挥能打胜仗作风优良的人民军队，以及绝对忠诚纯洁可靠和召之即来来之能战战之必胜，全选。"}, {"chapter": "军事思想", "type": "multi", "id": 364, "question": "习近平国防和军队建设重要论述的主要内容包括（ ）。", "options": [{"label": "A", "text": "始终保持我军光荣传统和优良作风"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "为实现强军目标提供坚强思想和组织保证"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "ABCD", "explain": "习近平强军思想还包括保持光荣传统优良作风、造就担当强军重任的优秀人才、为实现强军目标提供思想和组织保证、完善中国特色军事制度，全选。"}, {"chapter": "军事思想", "type": "multi", "id": 365, "question": "
