CD", "explain": "信息化战争新的制胜因素给国防建设带来挑战，表现为制胜优势转型（制信息权成为新制高点）、战场全维透明、军事组织结构创新（陆海空区分模糊）、人的智能极大扩展。四项分别对应制胜权、战场透明、组织创新和智能扩展，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 408, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可传递"}, {"label": "B", "text": "可再生"}, {"label": "C", "text": "可压缩"}, {"label": "D", "text": "可量度"}], "answer": "ABCD", "explain": "信息具有可传递、可再生、可压缩、可量度等特征。A项指信息可传播，B项指信息可重新生成，C项指信息可压缩存储，D项指信息可计量，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 409, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为（ ）。", "options": [{"label": "A", "text": "“第三次浪潮战争”"}, {"label": "B", "text": "“非接触战争”"}, {"label": "C", "text": "“第六代战争”"}, {"label": "D", "text": "“第五代战争”"}], "answer": "BC", "explain": "正确答案为BC。俄罗斯军事理论家斯里普琴科从武器装备发展角度将信息化战争称为“非接触战争”和“第六代战争”。A项“第三次浪潮战争”和D项“第五代战争”不是他的提法。"}, {"chapter": "现代理论", "type": "multi", "id": 410, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了20艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合，进行 “蛙跳”式的袭击作战。"}], "answer": "ACD", "explain": "正确答案为ACD。越南战争处于高技术战争萌芽阶段，先后动用20艘航母舰载机出动20万架次以上，出现直升机与特种部队相结合的“蛙跳”式袭击。B项排除：首次利用空中卫星进行战场侦察是第四次中东战争的特点。"}, {"chapter": "现代理论", "type": "multi", "id": 411, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "BC", "explain": "正确答案为BC。高技术战争初期发展与基本形成阶段的代表是第四次中东战争和马岛战争。A项排除：朝鲜战争属萌芽阶段；D项排除：海湾战争是信息化战争初步显现，阶段更晚。"}, {"chapter": "现代理论", "type": "multi", "id": 412, "question": "对第四次中东战争描述正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "在第四次中东战争中出现了直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "AB", "explain": "正确答案为AB。第四次中东战争处于高技术战争初期发展与基本形成阶段，双方普遍运用高技术导弹和先进装甲车辆较量。C项排除：“蛙跳”式袭击是越南战争的特点；D项排除：该表述涉及17种制导武器说法不属第四次中东战争准确概况。"}, {"chapter": "现代理论", "type": "multi", "id": 413, "question": "信息化战争中，战争能量从传统的（ ）等物理能量转变为智能。", "options": [{"label": "A", "text": "化学能"}, {"label": "B", "text": "体能"}, {"label": "C", "text": "机械能"}, {"label": "D", "text": "核能"}], "answer": "ABCD", "explain": "信息化战争中战争能量由传统的化学能、体能、机械能、核能等物理能量转变为智能。A项化学能、B项体能、C项机械能、D项核能均属传统物理能量，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 414, "question": "信息时代的信息化战争则是在（）等多维空间内进行的一体化作战。", "options": [{"label": "A", "text": "太空"}, {"label": "B", "text": "心理"}, {"label": "C", "text": "网络"}, {"label": "D", "text": "电磁"}], "answer": "ABCD", "explain": "信息化战争是在太空、心理、网络和电磁等多维空间内进行的一体化作战。A项太空、B项心理、C项网络、D项电磁均属信息化战争的多维空间，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 415, "question": "信息化战争的作战样式有（ ）。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "制信息权争夺战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "ABCD", "explain": "信息化战争作战样式包括战争潜力削弱战、指挥中枢瘫痪战、制信息权争夺战和心理系统瓦解战。A项削弱潜力，B项瘫痪指挥，C项争夺制信息权，D项瓦解心理，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 416, "question": "信息化战争的特征是（ ）。", "options": [{"label": "A", "text": "作战空间超大多维"}, {"label": "B", "text": "作战要素一体化"}, {"label": "C", "text": "武器装备高度信息化"}, {"label": "D", "text": "信息资源价值急剧上升"}], "answer": "ABCD", "explain": "信息化战争特征包括作战空间超大多维、作战要素一体化、武器装备高度信息化和信息资源价值急剧上升。A项空间特征，B项要素一体化，C项武器信息化，D项信息价值上升，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 417, "question": "在信息化战争中，人类的战争能力将持续提升，具体表现为（ ）。", "options": [{"label": "A", "text": "战场感知力持续提升"}, {"label": "B", "text": "战场效能持续提高"}, {"label": "C", "text": "精确打击能力持续增强"}, {"label": "D", "text": "作战空间和时间待续延伸"}], "answer": "ABCD", "explain": "信息化战争中人类战争能力持续提升具体表现为战场感知力持续提升、战场效能持续提高、精确打击能力持续增强和作战空间时间持续延伸。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 418, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可处理"}, {"label": "B", "text": "可再生"}, {"label": "C", "text": "实效性"}, {"label": "D", "text": "可共享"}], "answer": "ABCD", "explain": "信息具有可处理、可再生、实效性和可共享等特征。A项指信息可加工处理，B项指信息可再生，C项指信息有实效，D项指信息可共享，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 419, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中出现了首次利用空中卫星进行战场侦察。"}, {"label": "C", "text": "越南战争中先后动用了2艘航空母舰，舰载机出动达20余万架次以上。"}, {"label": "D", "text": "越南战争中交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "AC", "explain": "正确答案为AC。越南战争处于高技术战争萌芽阶段，先后动用（20余艘）航空母舰、舰载机出动大量架次。B项排除：首次利用空中卫星侦察属第四次中东战争；D项排除：17种制导武器大规模使用不在越南战争。"}, {"chapter": "现代理论", "type": "multi", "id": 420, "question": "信息化战争的发展趋势是（ ）。", "options": [{"label": "A", "text": "战争的不对称表现日趋多样"}, {"label": "B", "text": "人类的战争能力将持续提升"}, {"label": "C", "text": "作战方式和战争形态将不断变化"}, {"label": "D", "text": "对经济和科技的依赖性将越来越强"}], "answer": "ABCD", "explain": "信息化战争发展趋势包括战争不对称表现日趋多样、人类战争能力持续提升、作战方式和战争形态不断变化、对经济和科技的依赖性越来越强。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 421, "question": "要想打赢未来的信息化战争，实现伟大祖国的和平统一，实现中华民族的伟大复兴，我们应该（ ）。", "options": [{"label": "A", "text": "要提高对信息化战争的全面认识，增强信息制胜的思维意识"}, {"label": "B", "text": "要打破传统观念，树立新型信息制胜观念，确立“综合制胜”的观念"}, {"label": "C", "text": "要着力铸造“撒手铜”，为打赢创造物质条件"}, {"label": "D", "text": "要树立新型人才观念，打造应对信息化战争的高素质军事人才"}], "answer": "ABCD", "explain": "要打赢未来信息化战争、实现祖国和平统一和民族复兴，应提高对信息化战争的全面认识增强信息制胜思维、打破传统观念树立综合制胜观念、着力铸造“撒手锏”为打赢创造物质条件、树立新型人才观念打造高素质军事人才。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 422, "question": "新军事革命，就是在以信息技术为核心的高技术迅猛发展推动下，将（  ）有机地结合在一起而形成的、能彻底改变旧作战方式，极大地提高军事效能的军事革命。", "options": [{"label": "A", "text": "信息化武器系统"}, {"label": "B", "text": "创新军事理论"}, {"label": "C", "text": "体制变革"}, {"label": "D", "text": "科技发展"}], "answer": "ABC", "explain": "正确答案为ABC。新军事革命是以信息技术为核心，将信息化武器系统、创新军事理论和体制变革有机结合而引发的军事革命。D项排除：科技发展是背景和动力，不属于三者有机结合的具体对象。"}, {"chapter": "现代理论", "type": "multi", "id": 423, "question": "新军事革命的涵义（ ）", "options": [{"label": "A", "text": "新军事革命是进入机械化战争时代的重要革命"}, {"label": "B", "text": "新军事革命是整个社会变革的重要组成，强调要从社会整体变化来认识新军事变革。"}, {"label": "C", "text": "新军事变革是科学技术发展和应用的必然结果，必须从现代科学技术的发展来认识新军事变革。"}, {"label": "D", "text": "新军事变革是军事领域的整体变革，必须从军事发展的全局来认识新军事变革。"}], "answer": "BCD", "explain": "正确答案为BCD。新军事革命的涵义包括：它是整个社会变革的重要组成、是科学技术发展和应用的必然结果、是军事领域的整体变革。A项排除：新军事革命是进入信息化战争时代的革命，而非机械化战争时代。"}, {"chapter": "现代理论", "type": "multi", "id": 424, "question": "新军事革命的主要内容有（  ）", "options": [{"label": "A", "text": "创新军事技术，实现武器装备的信息化"}, {"label": "B", "text": "创新体制编制，重组军队组织结构"}, {"label": "C", "text": "创新军事理论，推动军队建设转型"}, {"label": "D", "text": "创新作战方式，适应新的战争形态"}], "answer": "ABCD", "explain": "新军事革命主要内容包括创新军事技术实现武器装备信息化、创新体制编制重组军队组织结构、创新军事理论推动军队建设转型、创新作战方式适应新的战争形态。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 425, "question": "电子信息处理能力战斗效能的提高主要依靠电子信息系统对目标的(    )。", "options": [{"label": "A", "text": "识别"}, {"label": "B", "text": "制导、指挥"}, {"label": "C", "text": "战斗部件威力加大"}, {"label": "D", "text": "控制能力增强"}], "answer": "ABD", "explain": "正确答案为ABD。电子信息处理能力战斗效能的提高主要依靠电子信息系统对目标的识别、制导指挥和控制能力的增强。C项排除：战斗部件威力加大属于武器杀伤力范畴，不属电子信息处理能力。"}, {"chapter": "信息化武装", "type": "multi", "id": 426, "question": "信息化战争的形成是下列(    )因素作用的结果。", "options": [{"label": "A", "text": "政治"}, {"label": "B", "text": "经济"}, {"label": "C", "text": "科技"}, {"label": "D", "text": "自然"}], "answer": "ABC", "explain": "正确答案为ABC。信息化战争的形成是政治、经济和科技因素共同作用的结果。D项排除：自然因素不属信息化战争形成的主要因素。"}, {"chapter": "信息化武装", "type": "multi", "id": 427, "question": "信息化战争中,要取得胜利,需要具备(    )。", "options": [{"label": "A", "text": "制陆权、制海权"}, {"label": "B", "text": "制空权"}, {"label": "C", "text": "制天权"}, {"label": "D", "text": "制电磁权"}], "answer": "ABCD", "explain": "信息化战争中要取得胜利需具备制陆权、制海权、制空权、制天权和制电磁权（制信息权）。A项陆海、B项空、C项天、D项电磁均属必须掌控的领域，四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 428, "question": "20世纪80年代以来的局部战争的特点是(    )。", "options": [{"label": "A", "text": "战争目的有限"}, {"label": "B", "text": "战争规模不大"}, {"label": "C", "text": "战争持续时间短"}, {"label": "D", "text": "电子信息领域的对抗对战争进程影响不大"}], "answer": "ABC", "explain": "正确答案为ABC。20世纪80年代以来局部战争特点是战争目的有限、战争规模不大、战争持续时间短。D项排除：电子信息领域对抗对战争进程影响已经很大，并非不大。"}, {"chapter": "信息化武装", "type": "multi", "id": 429, "question": "从信息化战争的本质而言,包含了(    )等方面的含义。", "options": [{"label": "A", "text": "信息化战争还将是核威慑下的高技术常规战争"}, {"label": "B", "text": "武器系统的信息智能化和作战行动的一体化"}, {"label": "C", "text": "信息化战争当前已经处于辉煌阶段"}, {"label": "D", "text": "信息化战争的性质仍然是政治的暴力继续"}], "answer": "ABD", "explain": "正确答案为ABD。信息化战争的本质含义包括：是核威慑下的高技术常规战争、武器系统信息智能化和作战行动一体化、其性质仍然是政治的暴力继续。C项排除：信息化战争当前尚未到辉煌阶段，此表述错误。"}, {"chapter": "信息化武装", "type": "multi", "id": 430, "question": "信息化战争在打击目标的控制上,主要是打击(    )。", "options": [{"label": "A", "text": "指挥控制枢纽"}, {"label": "B", "text": "重要军事设施"}, {"label": "C", "text": "重兵集团"}, {"label": "D", "text": "前线所有部队"}], "answer": "ABC", "explain": "正确答案为ABC。信息化战争在打击目标控制上主要是打击指挥控制枢纽、重要军事设施和重兵集团。D项排除：打击前线所有部队不符合信息化战争精确打击要害的目标控制特点。"}, {"chapter": "信息化武装", "type": "multi", "id": 431, "question": "现在军队的指挥自动化系统的薄弱环节有(    )。", "options": [{"label": "A", "text": "系统不完善"}, {"label": "B", "text": "生存能力低"}, {"label": "C", "text": "保密系统不健全"}, {"label": "D", "text": "互通性差"}], "answer": "ABCD", "explain": "军队指挥自动化系统的薄弱环节有系统不完善、生存能力低、保密系统不健全和互通性差。这些薄弱环节制约了指挥自动化的效能发挥，四项均属其薄弱环节，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 432, "question": "21世纪整个军队的发展趋势来看,主要是(    )。", "options": [{"label": "A", "text": "数字化"}, {"label": "B", "text": "小型化"}, {"label": "C", "text": "职业化"}, {"label": "D", "text": "规模化"}], "answer": "ABC", "explain": "正确答案为ABC。进入21世纪，整个军队的发展趋势主要是数字化、小型化和职业化，以适应信息化战争需要。D项排除：规模化与军队精干小型化的趋势相反。"}, {"chapter": "信息化武装", "type": "multi", "id": 433, "question": "信息化战争是新军事变革的产物,会形成以下(    )新的作战领域。", "options": [{"label": "A", "text": "空间战"}, {"label": "B", "text": "精确打击"}, {"label": "C", "text": "主宰机动"}, {"label": "D", "text": "信息战"}], "answer": "ABCD", "explain": "信息化战争作为新军事变革的产物，形成空间战、精确打击、主宰机动和信息战等新的作战领域。A项争夺太空，B项精确打击，C项掌握机动主动权，D项信息对抗，四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 434, "question": "国防动员体制机制有(    )。", "options": [{"label": "A", "text": "平战转换机制"}, {"label": "B", "text": "军地协调机制"}, {"label": "C", "text": "激励补偿机制"}, {"label": "D", "text": "监督约束机制"}], "answer": "ABCD", "explain": "国防动员体制机制包括平战转换机制、军地协调机制、激励补偿机制和监督约束机制，它们共同构成完整的国防动员运行体系。四项均属国防动员体制机制，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 435, "question": "信息化战争消耗巨大的原因(    )。", "options": [{"label": "A", "text": "武器装备费用上升"}, {"label": "B", "text": "战争物资消耗增多"}, {"label": "C", "text": "战争时间持续过长"}, {"label": "D", "text": "战争过于频繁"}], "answer": "AB", "explain": "正确答案为AB。信息化战争消耗巨大的原因是武器装备费用上升和战争物资消耗增多。C项排除：信息化战争持续时间缩短而非过长；D项排除：战争过于频繁不是消耗巨大的主要原因。"}, {"chapter": "信息化武装", "type": "multi", "id": 436, "question": "下列叙述正确的是(    )。", "options": [{"label": "A", "text": "未来战争能否取得胜利,最终的决定性因素还是军事技术先进性。"}, {"label": "B", "text": "军用信息技术在军队信息化建设中起着十分关键的基础作用"}, {"label": "C", "text": "军队信息化建设需要有强大的经济实力做后盾"}, {"label": "D", "text": "通过加速信息化提升现代作战能力成为军队建设的必然要求"}], "answer": "BCD", "explain": "正确答案为BCD。军用信息技术在军队信息化建设中起关键基础作用，军队信息化建设需要强大经济实力做后盾，加速信息化提升现代作战能力是必然要求。A项排除：未来战争胜负的决定性因素是人和综合因素，而非单纯军事技术先进性。"}, {"chapter": "信息化武装", "type": "multi", "id": 437, "question": "信息化战争的可控性主要表现在以下几个方面(    )。", "options": [{"label": "A", "text": "能有效控制战争的进程"}, {"label": "B", "text": "能有效控制战争的规模"}, {"label": "C", "text": "能有效减少战争物资的消耗"}, {"label": "D", "text": "能有效控制打击的目标"}], "answer": "ABD", "explain": "正确答案为ABD。信息化战争的可控性主要表现在能有效控制战争进程、控制战争规模和控制打击目标。C项排除：有效减少战争物资消耗不属战争可控性的范畴。"}, {"chapter": "信息化武装", "type": "multi", "id": 438, "question": "信息化战争的特征有(    )。", "options": [{"label": "A", "text": "战争消耗相对较少"}, {"label": "B", "text": "战争可控性强"}, {"label": "C", "text": "系统对抗突出"}, {"label": "D", "text": "指挥控制自动化"}], "answer": "BCD", "explain": "正确答案为BCD。信息化战争特征是战争可控性强、系统对抗突出和指挥控制自动化。A项排除：信息化战争消耗巨大而并非相对较少。"}, {"chapter": "信息化武装", "type": "multi", "id": 439, "question": "“海湾战争”是冷战结束以后(    )的一场局部战争。", "options": [{"label": "A", "text": "规模最大"}, {"label": "B", "text": "参战国最多"}, {"label": "C", "text": "战争消耗最大"}, {"label": "D", "text": "现代化程度很高"}], "answer": "ABD", "explain": "正确答案为ABD。海湾战争是冷战结束以后规模最大、参战国最多、现代化程度很高的一场局部战争。C项排除：就当时而言战争消耗最大这一说法并不准确。"}, {"chapter": "信息化武装", "type": "multi", "id": 440, "question": "下列(    )是信息化战争对国防建设的要求。", "options": [{"label": "A", "text": "着力培养高素质军事人才,全面提高军队质量"}, {"label": "B", "text": "加大国防科研力度,加速发展高技术武器装备"}, {"label": "C", "text": "优化军队编制体制,提高战斗力"}, {"label": "D", "text": "加强高技术战争的理论研究,创新军事理论"}], "answer": "ABCD", "explain": "信息化战争对国防建设的要求包括着力培养高素质军事人才全面提高军队质量、加大国防科研力度加速发展高技术武器装备、优化军队编制体制提高战斗力、加强高技术战争理论研究创新军事理论。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 441, "question": "信息化战争的作战特点有（    ）。", "options": [{"label": "A", "text": "局部战争全局化"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "进攻作战网络化"}, {"label": "D", "text": "防御作战总体化"}], "answer": "ACD", "explain": "正确答案为ACD。信息化战争的作战特点包括局部战争全局化、进攻作战网络化和防御作战总体化。B项排除：科索沃战争是具体战争实例，不是作战特点。"}, {"chapter": "信息化武装", "type": "multi", "id": 442, "question": "对于下列信息化战争形成原因的表述,正确的是(    )。", "options": [{"label": "A", "text": "不断更新的作战理念是信息化战争形成的“催产剂”"}, {"label": "B", "text": "军事斗争的需要是信息化战争形成的先导"}, {"label": "C", "text": "以信息技术为代表的科学技术的发展是信息化战争形成的物质技术基础"}, {"label": "D", "text": "不断发生的局部战争是信息化战争形成的“试验场”"}], "answer": "CD", "explain": "正确答案为CD。信息化战争形成的原因中，以信息技术为代表的科技发展是其物质技术基础，不断发生的局部战争是其“试验场”。A项和B项对“催产剂”“先导”的对应表述颠倒错位，故排除。"}, {"chapter": "信息化武装", "type": "multi", "id": 443, "question": "下列(    )有利于优化军队编制体制。", "options": [{"label": "A", "text": "保持适度的军队规模"}, {"label": "B", "text": "优先发展海空军,加强技术兵种的建设"}, {"label": "C", "text": "搞好各军兵种部队的科学编组"}, {"label": "D", "text": "精简机关,充实部队"}], "answer": "ABCD", "explain": "优化军队编制体制的做法包括保持适度的军队规模、优先发展海空军加强技术兵种建设、搞好各军兵种部队的科学编组、精简机关充实部队。四项均有利于优化编制体制，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 444, "question": "下列(    )体现了信息化战争的战场空间广阔。", "options": [{"label": "A", "text": "从区域战场向全球战场延伸"}, {"label": "B", "text": "从军事战场向经济战场延伸"}, {"label": "C", "text": "从空中战场向太空战场延伸"}, {"label": "D", "text": "从有形战场向无形战场延伸"}], "answer": "ACD", "explain": "正确答案为ACD。信息化战争战场空间广阔体现为从区域战场向全球战场延伸、从空中战场向太空战场延伸、从有形战场向无形战场延伸。B项排除：从军事战场向经济战场延伸不属于战场空间范畴。"}, {"chapter": "信息化武装", "type": "multi", "id": 445, "question": "“海湾战争”改变了传统的作战样式,表现在(    )。", "options": [{"label": "A", "text": "空中力量发挥了决定性作用,开创了以空中力量为主体赢得战争的先例"}, {"label": "B", "text": "电子战成为未来战争的核心,对战争进程和结果产生重要影响"}, {"label": "C", "text": "作战空域空前扩大,战场向大纵深、高度立体化方向发展"}, {"label": "D", "text": "高技术武器大大提高了作战能力,使作战行动向高速度、全天候、全时域发展"}], "answer": "ABCD", "explain": "海湾战争改变了传统作战样式，表现在空中力量发挥决定性作用开创以空制胜先例、电子战成为未来战争核心、作战空域空前扩大向大纵深立体化发展、高技术武器使作战向高速度全天候全时域发展。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 446, "question": "引发战争的原因有(    )。", "options": [{"label": "A", "text": "领土争端"}, {"label": "B", "text": "经济矛盾"}, {"label": "C", "text": "民族矛盾"}, {"label": "D", "text": "宗教矛盾"}], "answer": "ABCD", "explain": "引发战争的原因包括领土争端、经济矛盾、民族矛盾和宗教矛盾。A项领土、B项经济、C项民族、D项宗教均为战争的重要诱因，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 447, "question": "信息化战争的作战方式,将从过去的以陆地为主、侧重对敌实施地面作战,发展为一体化的联合作战。(    )", "options": [{"label": "A", "text": "陆"}, {"label": "B", "text": "海"}, {"label": "C", "text": "电"}, {"label": "D", "text": "天"}], "answer": "ABCD", "explain": "信息化战争作战方式从以陆地为主发展为陆、海、电、天一体化的联合作战。A项陆、B项海、C项电、D项天均属一体化联合作战的组成维度，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 448, "question": "军队信息化建设中的信息化改造要求围绕(    )。", "options": [{"label": "A", "text": "高可靠性和可维修性"}, {"label": "B", "text": "高效能、多功能"}, {"label": "C", "text": "通用化"}, {"label": "D", "text": "模块化"}], "answer": "ABCD", "explain": "军队信息化建设中的信息化改造要求围绕高可靠性和可维修性、高效能多功能、通用化和模块化展开。四项均属信息化改造要求，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 449, "question": "后勤信息化建设要求后勤(    )。", "options": [{"label": "A", "text": "信息化装备"}, {"label": "B", "text": "信息化保障手段建设"}, {"label": "C", "text": "指挥自动化"}, {"label": "D", "text": "保障社会化、可视化、和精确化水平"}], "answer": "ABCD", "explain": "后勤信息化建设要求后勤实现信息化装备、加强信息化保障手段建设、实现指挥自动化和提高保障社会化可视化精确化水平。四项均属后勤信息化建设要求，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 450, "question": "加强军事信息资源战略管理,抓好信息资源的标准化建设要求是(    )。", "options": [{"label": "A", "text": "统一软件规范"}, {"label": "B", "text": "统一内外网共享"}, {"label": "C", "text": "统一规划和设计各类计算机信息管理系统"}, {"label": "D", "text": "统一硬件标准"}], "answer": "ACD", "explain": "正确答案为ACD。加强军事信息资源战略管理抓好标准化建设要求统一软件规范、统一规划设计各类计算机信息管理系统、统一硬件标准。B项排除：统一内外网共享不属信息资源的标准化要求。"}, {"chapter": "信息化武装", "type": "multi", "id": 451, "question": "“海湾战争”改变了传统的作战样式,表现在(    )。", "options": [{"label": "A", "text": "空中力量发挥了决定性作用,开创了以空中力量为主体赢得战争的先例"}, {"label": "B", "text": "信息战成为未来战争的核心,对战争进程和结果产生重要影响"}, {"label": "C", "text": "作战空域空前扩大,战场向大纵深、高度立体化方向发展"}, {"label": "D", "text": "高技术武器大大提高了作战能力,使作战行动向高速度、全天候、全时域发展"}], "answer": "ABCD", "explain": "海湾战争改变了传统作战样式，表现在空中力量发挥决定性作用、信息战成为未来战争核心、作战空域扩大向大纵深立体化发展、高技术武器使作战向高速度全天候全时域发展。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 452, "question": "数字化的轻型武装侦察直升机的特点有(    )。", "options": [{"label": "A", "text": "360度全角度激光探测能力"}, {"label": "B", "text": "在150千米高空进行军事侦察"}, {"label": "C", "text": "机身装满数字化武器"}, {"label": "D", "text": "可携带火箭弹及反坦克导弹"}], "answer": "ACD", "explain": "正确答案为ACD。数字化轻型武装侦察直升机特点有360度全角度激光探测能力、机身装满数字化武器、可携带火箭弹及反坦克导弹。B项排除：在150千米高空侦察不是直升机的特点。"}, {"chapter": "信息化武装", "type": "multi", "id": 453, "question": "关于美军数字化师的叙述正确的(    )。", "options": [{"label": "A", "text": "作战能力相当1个非数字化军"}, {"label": "B", "text": "控制地域可以达到24000平方千米"}, {"label": "C", "text": "2001年正式投入使用"}, {"label": "D", "text": "数字化师比普通部队反应迅速"}], "answer": "ABCD", "explain": "关于美军数字化师的叙述均正确：其作战能力相当于一个非数字化军，控制地域可达24000平方千米，2001年正式投入使用，且比普通部队反应迅速。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 454, "question": "以下有关“海湾战争”叙述正确的是(    )。", "options": [{"label": "A", "text": "“海湾战争”发生在20世纪90年代初"}, {"label": "B", "text": "GBU-28激光制导炸弹长5.85米"}, {"label": "C", "text": "“沙漠风暴”行动发生在海湾战争中"}, {"label": "D", "text": "“斩首行动”发生在海湾战争中"}], "answer": "ABC", "explain": "正确答案为ABC。海湾战争发生在20世纪90年代初，GBU-28激光制导炸弹长5.85米，“沙漠风暴”行动发生在海湾战争中。D项排除：“斩首行动”发生在伊拉克战争而非海湾战争。"}, {"chapter": "信息化武装", "type": "multi", "id": 455, "question": "以下叙述正确的(    )。", "options": [{"label": "A", "text": "一般来说,信息化战争的发展将历经三个阶段"}, {"label": "B", "text": "军事斗争的需要是信息化战争形成的“催产剂”"}, {"label": "C", "text": "霸权主义引起的军备竞争,促进了信息化武器装备的发展"}, {"label": "D", "text": "不断更新的作战理念是信息化战争形成的先导"}], "answer": "ABCD", "explain": "四个叙述均正确：信息化战争发展将历经三个阶段；军事斗争需要是信息化战争形成的“催产剂”；霸权主义军备竞争促进了信息化武器装备发展；不断更新的作战理念是信息化战争形成的先导。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 456, "question": "以下叙述正确的(    )。", "options": [{"label": "A", "text": "机械化战争是数量决定效能"}, {"label": "B", "text": "信息化战争是信息决定效能"}, {"label": "C", "text": "信息化战争的作战指挥控制是横向连接的树状结构"}, {"label": "D", "text": "机械化战争的作战指挥是扁平状的网络结构"}], "answer": "AB", "explain": "正确答案为AB。机械化战争是数量决定效能，信息化战争是信息决定效能。C项排除：信息化战争指挥控制是扁平状网络结构而非树状；D项排除：机械化战争指挥是树状结构而非扁平网络结构。"}, {"chapter": "信息化武装", "type": "multi", "id": 457, "question": "以下叙述错误的(    )。", "options": [{"label": "A", "text": "1998年对南联盟的军事行动中,美军使用了多种信息化武器装备"}, {"label": "B", "text": "2000年对阿富汗的战争,美军基本实现了信息化作战"}, {"label": "C", "text": "1991年,美军发动了“海湾战争”,主战武器是信息化武器"}, {"label": "D", "text": "2003年,美军发动对伊拉克的战争,投入了90%的信息化武器"}], "answer": "ABC", "explain": "本题问“错误”的叙述，答案为ABC。D项正确：2003年伊拉克战争美军投入大量（约九成）信息化武器。A项错在1998年对南联盟军事行动时间不准确；B项错在2000年美军尚未基本实现信息化作战；C项错在1991年海湾战争主战武器并非信息化武器。"}, {"chapter": "信息化武装", "type": "multi", "id": 458, "question": "下列叙述正确的是(    )。", "options": [{"label": "A", "text": "今后若不幸发生新的世界大战,整个太空将成为一个广阔的战场"}, {"label": "B", "text": "在未来信息化战争中,远战将会取代近战,作为主要作战方式"}, {"label": "C", "text": "未来信息化战争是综合国力的对抗"}, {"label": "D", "text": "从信息化战争的发展趋势看,后勤保障将向“局部化”方向发展"}], "answer": "ABC", "explain": "正确答案为ABC。今后若发生新的世界大战太空将成广阔战场；未来信息化战争远战将取代近战作为主要作战方式；未来信息化战争是综合国力的对抗。D项排除：后勤保障应走向精确化而非“局部化”。"}, {"chapter": "信息化武装", "type": "multi", "id": 459, "question": "随着科技的不断发展,武器装备的发展方向是(    )。", "options": [{"label": "A", "text": "大型化"}, {"label": "B", "text": "智能化"}, {"label": "C", "text": "自动化"}, {"label": "D", "text": "集约化"}], "answer": "BCD", "explain": "正确答案为BCD。随着科技不断发展，武器装备的发展方向是智能化、自动化和集约化。A项排除：大型化与武器装备小型化、精干化的发展趋势相反。"}, {"chapter": "信息化武装", "type": "multi", "id": 460, "question": "在科索沃战争中,已经显露了(    )等信息化战争的作战特点。", "options": [{"label": "A", "text": "防御作战总体化"}, {"label": "B", "text": "主战兵器机械化"}, {"label": "C", "text": "进攻作战网络化"}, {"label": "D", "text": "局部战争全局化"}], "answer": "ACD", "explain": "正确答案为ACD。科索沃战争已显露防御作战总体化、进攻作战网络化和局部战争全局化的信息化作战特点。B项排除：主战兵器机械化是旧特点，不是信息化作战特点。"}, {"chapter": "信息化武装", "type": "multi", "id": 461, "question": "世界各国在加强军队指挥的自动化系统建设方面的行动有(    )。", "options": [{"label": "A", "text": "健全和完善自动化体系,实现全军统一的自动化指挥系统"}, {"label": "B", "text": "采用标准化计算机网络,提高各种指挥自动化系统的互通性和工作效率"}, {"label": "C", "text": "发展新一代通信卫星,建立新的通信系统"}, {"label": "D", "text": "研制神经网络计算机和光子计算机,提高自动化指挥系统的人工智能水平"}], "answer": "ABCD", "explain": "各国加强军队指挥自动化系统建设的行动包括健全完善自动化体系实现全军统一、采用标准化计算机网络提高互通性和工作效率、发展新一代通信卫星建立新通信系统、研制神经网络和光子计算机提高人工智能水平。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 462, "question": "有关信息化战争的概念,正确的是(    )。", "options": [{"label": "A", "text": "以系统集成和信息控制为主导"}, {"label": "B", "text": "发生在信息时代"}, {"label": "C", "text": "以信息为基础并以信息化武器为主要战争工具和作战手段"}, {"label": "D", "text": "在全维空间内通过精确打击、实时控制、信息攻防等方式进行的瘫痪和震慑作战的战争形态"}], "answer": "ABCD", "explain": "信息化战争的概念包括以系统集成和信息控制为主导、发生在信息时代、以信息为基础并以信息化武器为主要战争工具、在全维空间通过精确打击实时控制信息攻防进行瘫痪震慑作战。四项均属，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 463, "question": "信息化武器系统中武器的战斗效能有(    )。", "options": [{"label": "A", "text": "火力"}, {"label": "B", "text": "机动力"}, {"label": "C", "text": "突击力和防护力"}, {"label": "D", "text": "电子信息处理能力"}], "answer": "ABCD", "explain": "信息化武器系统的战斗效能包括火力、机动力、突击力和防护力以及电子信息处理能力，其中电子信息处理能力是信息化武器的核心标志。四项均属武器战斗效能，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 464, "question": "从信息化武器系统的结构看,主要包括(    )。", "options": [{"label": "A", "text": "信息化智能弹药"}, {"label": "B", "text": "信息化作战平台"}, {"label": "C", "text": "数字化单兵作战系统"}, {"label": "D", "text": "综合军事信息系统"}], "answer": "ABCD", "explain": "信息化武器系统结构主要包括信息化智能弹药、信息化作战平台、数字化单兵作战系统和综合军事信息系统。四项均属其结构组成，故全选。"}, {"chapter": "信息化武装", "type": "multi", "id": 465, "question": "信息化战争与机械化战争在(    )方面存在较大差别。", "options": [{"label": "A", "text": "作战主导要素"}, {"label": "B", "text": "作战指挥控制"}, {"label": "C", "text": "作战总体效能"}, {"label": "D", "text": "作战监督部署"}], "answer": "ABC", "explain": "正确答案为ABC。信息化战争与机械化战争在作战主导要素、作战指挥控制和作战总体效能方面存在较大差别。D项排除：作战监督部署不属两者的本质差别。"}, {"chapter": "信息化武装", "type": "multi", "id": 466, "question": "信息化武器装备引起了军队(    )的结构变化。", "options": [{"label": "A", "text": "组织结构"}, {"label": "B", "text": "人员数量"}, {"label": "C", "text": "人员性别比例"}, {"label": "D", "text": "人员素质"}], "answer": "AD", "explain": "正确答案为AD。信息化武器装备引起了军队组织结构和人员素质的结构变化。B项人员数量和C项人员性别比例均不属信息化武器装备引起的结构变化范畴。"}, {"chapter": "信息化武装", "type": "multi", "id": 467, "question": "电子战争的内容(    )。", "options": [{"label": "A", "text": "电子侦察与反侦察"}, {"label": "B", "text": "电子干扰与反干扰"}, {"label": "C", "text": "电子摧毁与反摧毁"}, {"label": "D", "text": "电子辐射与反辐射"}], "answer": "ABC", "explain": "正确答案为ABC。电子战争的内容有电子侦察与反侦察、电子干扰与反干扰、电子摧毁与反摧毁。D项排除：电子辐射与反辐射不属电子战争的三方面内容。"}, {"chapter": "信息化武装", "type": "multi", "id": 468, "question": "以下属于信息化战争中出现的新的作战方式的有(    )。", "options": [{"label": "A", "text": "运动战"}, {"label": "B", "text": "软杀战"}, {"label": "C", "text": "太空战"}, {"label": "D", "text": "心理战"}], "answer": "BCD", "explain": "正确答案为BCD。信息化战争中出现的新作战方式有软杀战（以软杀伤为主）、太空战和心理战。A项排除：运动战是传统机械化战争的作战方式。"}, {"chapter": "信息化武装", "type": "multi", "id": 469, "question": "信息化战争全面形成的标志是(    )。", "options": [{"label": "A", "text": "地面部队的数字化"}, {"label": "B", "text": "高技术局部战争的发生"}, {"label": "C", "text": "海湾战争的爆发"}, {"label": "D", "text": "作战行动方式的非线式一体化"}], "answer": "AD", "explain": "正确答案为AD。信息化战争全面形成的标志是地面部队的数字化和作战行动方式的非线式一体化。B项和C项海湾战争及高技术局部战争是其雏形或初步阶段的标志，不属于全面形成。"}, {"chapter": "中国国防", "type": "tf", "id": 470, "question": "“小推车推出来的胜利”是指辽沈战役。 （ ）", "answer": false, "explain": "此题错误。“小推车推出来的胜利”指的是淮海战役，陈毅元帅曾感叹淮海战役的胜利是人民群众用小推车推出来的，而非辽沈战役。淮海战役是解放战争三大战役之一，人民支前是制胜的关键因素。"}, {"chapter": "中国国防", "type": "tf", "id": 471, "question": "《反分裂国家法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "此题错误。在我国国防法规体系中占有统帅地位、起着核心作用的是《国防法》，它是其他军事立法的基本法律依据，而非《反分裂国家法》。"}, {"chapter": "中国国防", "type": "tf", "id": 472, "question": "国防是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。 （ ）", "answer": true, "explain": "此题正确。国防正是国家为防备和抵抗侵略、制止武装颠覆、保卫国家主权统一领土完整和安全而进行的军事及与军事有关的政治经济外交科技文化等活动。"}, {"chapter": "中国国防", "type": "tf", "id": 473, "question": "国防的目的是保卫国家的主权、统一、领土完整和安全。（ ）", "answer": true, "explain": "此题正确。国防的目的就是保卫国家的主权、统一、领土完整和安全，这四方面构成国防目的的完整内涵。主权、统一、领土完整和安全共同构成国防目的的核心内涵。"}, {"chapter": "中国国防", "type": "tf", "id": 474, "question": "国防动员的组织体系是由动员决策机构、协调机构、执行机构、监督机构四部分组成。（）", "answer": false, "explain": "此题错误。国防动员组织体系由动员决策机构、动员协调机构、动员执行机构和动员监督机构四部分组成，题干把“协调机构”表述不完整，故错误。"}, {"chapter": "中国国防", "type": "tf", "id": 475, "question": "国家的统一，是指国家由一个中央政府对领土内的一切人民和事务行使完整的管辖权，不允许另立政府或分割国家的管辖权。（ ）", "answer": false, "explain": "此题错误。国家统一是指一个中央政府对领土内的一切居民和事务行使完整管辖权，题干把“居民”误写为“人民”，表述不准确。“居民”强调实际居住于领土内的人，与政治意义上的“人民”不同。"}, {"chapter": "中国国防", "type": "tf", "id": 476, "question": "国防的根本目的和任务是保障国家的安全。（ ）", "answer": false, "explain": "此题错误。国防的根本目的和任务是捍卫国家的主权，而不是笼统地保障国家安全，此表述扩大了国防根本目的的内涵。捍卫主权是国防最根本的职责，保障安全只是其派生的具体任务。"}, {"chapter": "中国国防", "type": "tf", "id": 477, "question": "一般情况下，对于武装暴力颠覆活动，由国家公安、安全部门调查和处理，不需要动用国防力最，而非武装暴力颠覆活动，才必须动用国防力量。（）", "answer": false, "explain": "此题错误。顺序颠倒：一般情况下非武装暴力颠覆活动由公安安全部门调查处理，不需动用国防力量，而武装暴力颠覆活动才必须动用国防力量。"}, {"chapter": "中国国防", "type": "tf", "id": 478, "question": "中央军事委员会是党和国家的最高军事机关。 （ ）", "answer": true, "explain": "此题正确。我国实行共产党对军队的绝对领导，中央军事委员会是党和国家的最高军事机关，统帅全国武装力量。中央军委对全国武装力量实施统一领导指挥，是国家军事领导体制的核心。"}, {"chapter": "中国国防", "type": "tf", "id": 479, "question": "《孙膑兵法》继承和发展了《孙子兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": true, "explain": "此题正确。《孙膑兵法》是战国时期孙膑及其弟子所著，继承并发展了《孙子兵法》的军事战略思想，被誉为兵家宝书。两部兵书一脉相承，共同奠定了我国古代军事思想的重要基础。"}, {"chapter": "中国国防", "type": "tf", "id": 480, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学圣典”的《孙子兵法》一书，其作者是春秋时期著名的孙膑。（）", "answer": false, "explain": "此题错误。“兵者，国之大事，死生之地，存亡之道，不可不察也”出自《孙子兵法》，其作者是春秋时期著名军事家孙武，而非孙膑。"}, {"chapter": "中国国防", "type": "tf", "id": 481, "question": "《国防法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。 （ ）", "answer": true, "explain": "此题正确。《国防法》在国防法规体系中占有统帅地位、起着核心作用，是其他军事立法的基本法律依据，符合我国国防立法实际。《国防法》是国防领域的基本法，规范国防建设和武装力量建设的根本性问题。"}, {"chapter": "中国国防", "type": "tf", "id": 482, "question": "国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及相应制度，是国防体制和国家体制的重要组成部分。（ ）", "answer": true, "explain": "此题正确。国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及相应制度，是国防体制和国家体制的重要组成部分。"}, {"chapter": "中国国防", "type": "tf", "id": 483, "question": "中华人民共和国武装力量是由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及民兵组成。（ ）", "answer": true, "explain": "此题正确。中华人民共和国武装力量由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及民兵三部分组成。预备役部队平时寓兵于民，战时补充现役部队，是武装力量的重要组成部分。"}, {"chapter": "中国国防", "type": "tf", "id": 484, "question": "根据我国的社会制度和国家政策，中国的国防类型是扩张型。（ ）", "answer": false, "explain": "此题错误。根据我国的社会主义制度和国家政策，坚持和平发展、积极防御，中国的国防类型是自卫型，而非扩张型。自卫型国防立足本土防御，不谋求对外扩张和控制他国。"}, {"chapter": "中国国防", "type": "tf", "id": 485, "question": "中国人民解放军预备役部队是国家的常备军。 （ ）", "answer": false, "explain": "此题错误。中国人民解放军现役部队才是国家的常备军，预备役部队是以现役军人为骨干、以后备人员为基础组建的准军事力量，不是常备军。"}, {"chapter": "中国国防", "type": "tf", "id": 486, "question": "国防的主体，即国防活动的实施者，通常为军队。（ ）", "answer": false, "explain": "此题错误。国防的主体是国家，是国家和全体人民的共同事业，而非仅仅军队这一武装集团。国家是国防的主体，全体人民是国防活动最深厚的力量源泉。"}, {"chapter": "中国国防", "type": "tf", "id": 487, "question": "我国国防动员决策机关是人民代表大会，最高领导机构是国务院、中央军委。 （ ）", "answer": true, "explain": "此题正确。我国国防动员决策机关是全国人民代表大会，最高领导机构是国务院和中央军事委员会，由它们统一组织实施国防动员。人民代表大会决定动员事项，国务院和中央军委领导实施，形成完整决策体系。"}, {"chapter": "中国国防", "type": "tf", "id": 488, "question": "政府是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。（ ）", "answer": false, "explain": "此题错误。题干所描述的是国防的活动，主体是国家，而非政府，应把“政府”改为“国防”。政府仅是国防活动的执行主体之一，国家才是国防的真正主体。"}, {"chapter": "中国国防", "type": "tf", "id": 489, "question": "国防动员的主要内容中，战争动员的核心是科学技术动员。（ ）", "answer": false, "explain": "此题错误。战争动员的核心是人民武装力量动员，即组织人民武装力量参军参战，科学技术动员是其重要内容而非核心。人民武装力量动员直接关系到战争初期的兵员补充和战斗力形成。"}, {"chapter": "中国国防", "type": "tf", "id": 490, "question": "国防的主体，即国防活动的实施者，通常为人民。（ ）", "answer": false, "explain": "此题错误。国防的主体是国家，人民是国防活动的重要依靠和力量源泉，但国防主体并非人民。国家以主权为标志发动国防活动，人民则是支持和参与国防的根本力量。"}, {"chapter": "中国国防", "type": "tf", "id": 491, "question": "现代国防既是只是一种国家行为。 （ ）", "answer": false, "explain": "此题错误。现代国防不仅是国家行为，还涉及政治、经济、科技、外交等社会各个方面，具有全民性和综合性，题干“只是一种国家行为”过于绝对。"}, {"chapter": "中国国防", "type": "tf", "id": 492, "question": "《孙子兵法》继承和发展了《孙胺兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": false, "explain": "此题错误。正确的表述是《孙膑兵法》继承并发展了《孙子兵法》的军事战略思想，题干颠倒了二者关系且把“孙膑”误写为“孙胺”。"}, {"chapter": "中国国防", "type": "tf", "id": 493, "question": "爱国主义是社会主义核心价值观的首要原则。 （ ）", "answer": true, "explain": "此题正确。爱国主义是中华民族精神的核心，也是社会主义核心价值观在公民层面的首要价值要求，题干表述正确。在当代中国，爱国与爱社会主义、爱中国共产党是高度统一的。"}, {"chapter": "中国国防", "type": "tf", "id": 494, "question": "《中华人民共和国国防动员法》由第十一届全国人民代表大会常务委员会第十三次会议于2011年2月26日通过。 （ ）", "answer": false, "explain": "此题错误。《中华人民共和国国防动员法》由第十一届全国人大常委会第十三次会议于2010年2月26日通过，题干“2011年”错误。"}, {"chapter": "中国国防", "type": "tf", "id": 495, "question": "“兵者，国之大事也，死生之地，存亡之道，不可不察也。”这是出自于被誉为“兵学圣典”的《孙子兵法》一书，其作者是春秋时期著名的孙武。（）", "answer": true, "explain": "此题正确。“兵者，国之大事，死生之地，存亡之道，不可不察也”出自《孙子兵法》，其作者是春秋时期著名军事家孙武。孙武被尊为“兵圣”，《孙子兵法》被奉为“兵学圣典”。"}, {"chapter": "中国国防", "type": "tf", "id": 496, "question": "《国防教育法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "此题错误。在国防法规体系中占有统帅地位、起着核心作用的是《国防法》，而非《国防教育法》，后者只是国防法规体系中的一部分。"}, {"chapter": "中国国防", "type": "tf", "id": 497, "question": "根据我国的社会制度和国家政策，中国的国防类型是联盟型。（ ）", "answer": false, "explain": "此题错误。根据我国社会主义制度和国家政策，中国国防类型是自卫型，坚持防御性国防，而非联盟型。中国坚持独立自主、积极防御的国防政策，不与他国结成军事同盟。"}, {"chapter": "中国国防", "type": "tf", "id": 498, "question": "现行《国防法》由全国人民代表大会八届五次会议于1997年3月14日通过，并于当日颁布实施。（ ）", "answer": true, "explain": "此题正确。现行《国防法》由第八届全国人民代表大会第五次会议于1997年3月14日通过，并于当日颁布实施。《国防法》的颁布实施标志着我国国防法制建设进入新阶段。"}, {"chapter": "中国国防", "type": "tf", "id": 499, "question": "一般情况下，对于非武装暴力颠覆活动，由国家公安、安全部门调查和处理，不需要动用国防力量，而武装暴力颠覆活动，才必须动用国防力量。（）", "answer": true, "explain": "此题正确。非武装暴力颠覆活动由国家公安、安全部门调查处理，不需动用国防力量，而武装暴力颠覆活动才必须动用国防力量。正确区分两类颠覆活动，有利于依法合理运用国防力量。"}, {"chapter": "中国国防", "type": "tf", "id": 500, "question": "国防动员是指同家为应对战争和突发事件的需要，合理地调动国家可以利用的各种资源，并建立相应的国家动员体制和机制的一系列活动。（ ）", "answer": true, "explain": "此题正确。国防动员是国家为应对战争和突发事件的需要，合理调动国家可利用的各种资源，并建立相应国家动员体制和机制的一系列活动。"}, {"chapter": "中国国防", "type": "tf", "id": 501, "question": "国防的根本目的和任务是捍卫国家的主权。（ ）", "answer": true, "explain": "此题正确。国防的根本目的和任务是捍卫国家的主权，这是国防活动的出发点和落脚点。主权是国家存在的根本标志，捍卫主权是国防的第一要务。"}, {"chapter": "中国国防", "type": "tf", "id": 502, "question": "根据我国的社会制度和国家政策，中国的国防类型是联盟型。（ ）", "answer": false, "explain": "此题错误。根据我国社会制度和国家政策，中国国防类型是自卫型，而非联盟型。中国不结盟、不称霸，其国防性质由社会主义制度所决定。"}, {"chapter": "中国国防", "type": "tf", "id": 503, "question": "当代爱国主义的主题就是爱社会主义，维护祖国的统一，齐心协力共建社会主义现代化，实现民族的伟大复兴。（ ）", "answer": true, "explain": "此题正确。当代爱国主义的主题就是爱社会主义、维护祖国统一、齐心协力共建社会主义现代化、实现中华民族伟大复兴。爱国主义既有历史传承，又随时代发展不断赋予新的内涵。"}, {"chapter": "中国国防", "type": "tf", "id": 504, "question": "国防的主体，即国防活动的实施者，通常为公民。（ ）", "answer": false, "explain": "此题错误。国防的主体是国家，公民是国防的参与者、依靠力量，但并非国防的主体。公民依法履行国防义务，但国防的主体始终是国家。"}, {"chapter": "中国国防", "type": "tf", "id": 505, "question": "国防的基本要素包括国防的主体、国防的目的、国防的手段和国防的对象四个方面。（）", "answer": true, "explain": "此题正确。国防的基本要素包括国防的主体、国防的目的、国防的手段和国防的对象四个方面。主体、目的、手段、对象四者相互联系，共同构成完整的国防内涵。"}, {"chapter": "中国国防", "type": "tf", "id": 506, "question": "国家主席是我国社会主义事业的领导核心。（ ）", "answer": false, "explain": "此题错误。中国共产党是我国社会主义事业的领导核心，而不是国家主席，二者不能混淆。党是最高政治领导力量，对社会主义事业实行全面领导。"}, {"chapter": "中国国防", "type": "tf", "id": 507, "question": "国防动员的主要内容中，战争动员的核心是国民经济动员。（ ）", "answer": false, "explain": "此题错误。战争动员的核心是人民武装力量动员，国民经济动员是其重要组成部分，而非核心。国民经济动员为战争提供物资保障，而人民武装力量动员才是核心。"}, {"chapter": "中国国防", "type": "tf", "id": 508, "question": "国家是为防备和抵抗侵略，制止武装颠覆，保卫国家的主权、统一、领土完整和安全，而进行的军事及与军事有关的政治、经济、外交、科技、文化等方面的活动。（ ）", "answer": false, "explain": "此题错误。题干所描述的是国防的活动，主体是国家，而非国家本身，应把“国家”改为“国防”。国家是中性的政治概念，国防则是国家为安全而开展的具体活动。"}, {"chapter": "中国国防", "type": "tf", "id": 509, "question": "中华人民共和国武装力量是由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及义务兵组成。（ ）", "answer": false, "explain": "此题错误。我国武装力量由中国人民解放军现役部队和预备役部队、中国人民武装警察部队及民兵组成，义务兵不是独立组成部分。民兵是武装力量的重要组成部分，义务兵则指现役士兵而非独立力量。"}, {"chapter": "中国国防", "type": "tf", "id": 510, "question": "国防的根本目的和任务是保卫国家的统一。（ ）", "answer": false, "explain": "此题错误。国防的根本目的是捍卫国家的主权，保卫国家统一只是国防目的的一个方面，而非根本目的。主权是国防目的的集中体现，统一和领土完整都由主权派生而来。"}, {"chapter": "中国国防", "type": "tf", "id": 511, "question": "国家的统一，是指国家由一个中央政府对领土内的一切居民和事务行使完整的管辖权，不允许另立政府或分割国家的管辖权。（ ）", "answer": true, "explain": "此题正确。国家的统一是指国家由一个中央政府对领土内的一切居民和事务行使完整管辖权，不允许另立政府或分割国家管辖权。统一既包括领土的统一，也包括政令军令的统一和国家主权的完整。"}, {"chapter": "中国国防", "type": "tf", "id": 512, "question": "现行《国防法》由全国人民代表大会八届五次会议于1998年3月14日通过，并于当日颁布实施。 （ ）", "answer": false, "explain": "此题错误。现行《国防法》是1997年3月14日通过的，题干“1998年”错误。1997年3月14日通过是准确时间，国防法制化由此奠基。"}, {"chapter": "中国国防", "type": "tf", "id": 513, "question": "孙武所著的《孙胺兵法》继承和发展了《孙子兵法》的军事战略思想，这是一部享誉世间的兵家宝书。（ ）", "answer": false, "explain": "此题错误。孙膑所著的是《孙膑兵法》，它是继承发展《孙子兵法》的兵家宝书，题干把“膑”误写为“胺”且作者关系混乱。《孙子兵法》在前，《孙膑兵法》在后，二者是继承发展关系。"}, {"chapter": "中国国防", "type": "tf", "id": 514, "question": "《兵役法》在国防法规体系中占有统帅地位并起着核心作用，是其他军事立法的基本法律依据。（ ）", "answer": false, "explain": "此题错误。在国防法规体系中占有统帅地位、起核心作用的是《国防法》，而非《兵役法》。《兵役法》专门规范兵役制度，其法律位阶低于基本法性质的《国防法》。"}, {"chapter": "中国国防", "type": "tf", "id": 515, "question": "国防的根本目的和任务是保卫国家的领土完整。（ ）", "answer": false, "explain": "此题错误。国防的根本目的是捍卫国家的主权，保卫领土完整只是国防目的的一个方面，而非根本目的。捍卫主权最根本，领土完整是主权在空间上的具体体现。"}, {"chapter": "中国国防", "type": "tf", "id": 516, "question": "根据我国的社会制度和国家政策，中国的国防类型是中立型。（ ）", "answer": false, "explain": "此题错误。根据我国社会制度和国家政策，中国国防类型是自卫型，而非中立型。中立型国防以签约形式保证不卷入战争，我国不采取此种类型。"}, {"chapter": "中国国防", "type": "tf", "id": 517, "question": "国防的基本要素包括国防的性质 、国防的目的、国防的手段和国防的对象四个方面。（）", "answer": false, "explain": "此题错误。国防的基本要素包括国防的主体、目的、手段和对象四个方面，题干把“主体”误写成“性质”。“主体”回答“谁在实施国防”，而“性质”回答“国防属于何种类型”。"}, {"chapter": "中国国防", "type": "tf", "id": 518, "question": "颠覆是指推翻现政府的一种叛逆行为，包括武装暴力颠覆和非武装暴力颠覆两种形式。 （ ）", "answer": true, "explain": "此题正确。颠覆是指推翻现政府的一种叛逆行为，包括武装暴力颠覆和非武装暴力颠覆两种形式。区分两种颠覆形式，为依法运用武装力量提供了明确依据。"}, {"chapter": "中国国防", "type": "tf", "id": 519, "question": "国防的根本目的和任务是保卫国家的统一。（ ）", "answer": false, "explain": "此题错误。国防的根本目的是捍卫国家的主权，保卫国家统一只是其中一个方面，而非根本目的。主权、统一、领土完整、安全相互关联，根本归宿都是捍卫主权。"}, {"chapter": "国家安全", "type": "tf", "id": 520, "question": "不同历史时期的战略， 有着不同的内容和特点， 其决定因素主要有战略思想、战略环境和军事力量。 （ ）", "answer": true, "explain": "此题正确。不同历史时期的战略有着不同的内容和特点，其决定因素主要有战略思想、战略环境和军事力量。战略思想反映国家的政策意图，战略环境提供客观条件，军事力量提供物质基础。"}, {"chapter": "国家安全", "type": "tf", "id": 521, "question": "战略思想是国家对待军事斗争特别是战争问题的根本立场和态度，是指导军事斗争的基本观点和理论原则。 （ ）", "answer": true, "explain": "此题正确。战略思想是国家对待军事斗争特别是战争问题的根本立场和态度，是指导军事斗争的基本观点和理论原则。战略思想具有鲜明的阶级性和国家利益取向，是战略制定与实施的灵魂。"}, {"chapter": "国家安全", "type": "tf", "id": 522, "question": "战略的基本要素包括战略目的、战略方针、战略力量和战略手段。（ ）", "answer": true, "explain": "此题正确。战略的基本要素包括战略目的、战略方针、战略力量和战略手段四个方面。四要素中战略目的是核心，方针是准则，力量是基础，手段是保证。"}, {"chapter": "国家安全", "type": "tf", "id": 523, "question": "战略力量是战略的物质基础和支柱。（ ）", "answer": true, "explain": "此题正确。战略力量是战略的物质基础和支柱，是达成战略目的的重要依靠。没有雄厚而可靠的战略力量作强力支撑，任何宏伟的战略目标都难以最终实现。"}, {"chapter": "国家安全", "type": "tf", "id": 524, "question": "战略目的和战略 手段是战略行动的方向、目标、纲领和准则。（ ）", "answer": false, "explain": "此题错误。战略目的和战略方针才是战略行动的方向、目标、纲领和准则，题干把“方针”误写为“手段”。方针是行动的基本准则，手段是实现目的的工具，二者不可混淆。"}, {"chapter": "国家安全", "type": "tf", "id": 525, "question": "战略即筹划和指导战争全局的方略，是指根据对国际形势和敌对双方政治、军事、外交、科技、地理等诸因素的分析和判断，科学地预测战争的发生与发展，制定作战方针、作战原则和作战计划，筹划战争准备，指导战争实施所遵循的原则和方法。（ ）", "answer": true, "explain": "此题正确。战略即筹划和指导战争全局的方略，需综合分析国际形势和各因素，预测战争发生发展，制定作战方针原则计划。战略是从全局和长远的高度对战争进行谋划与指导的科学。"}, {"chapter": "国家安全", "type": "tf", "id": 526, "question": "战略是为准备和进行战争而实行的具有全局意义的实行战略的保障，是战略决策机构根据战争的需要，在政治、军事、外交、经济、科学技术和战略  领导与指挥等方面，所采取的各种全局性的切实可行的方法和步骤。 （ ）", "answer": false, "explain": "此题错误。题干所描述的是战略措施（即战略保障）的定义，而非战略的定义，二者内涵不同。战略是全局性方略，而战略措施是落实战略的具体办法和步骤。"}, {"chapter": "国家安全", "type": "tf", "id": 527, "question": "日傍美制华，并不甘心为美火中取栗。( )", "answer": true, "explain": "此题正确。日本在军事上傍依美国共同制华，但又不甘心完全为美国火中取栗，处于既合作又自保的两难状态，该判断正确。日本既想借助美国遏制中国，又不愿为此损害其自身利益。"}, {"chapter": "国家安全", "type": "tf", "id": 528, "question": "军事斗争情况的发展变化，决定着军事斗争指导规律的发展变化，战略必须随着军事斗争的发展而发展，依照情况的变化而变化，一成不变的战略是不存在的。（ ）", "answer": true, "explain": "此题正确。军事斗争情况的发展变化决定军事斗争指导规律的发展变化，战略须随其发展而变化，一成不变的战略是不存在的。战略的生命力在于随势而变，因循守旧必然导致被动挨打。"}, {"chapter": "国家安全", "type": "tf", "id": 529, "question": "战争是解决阶级和阶级、民族和民族、国家与国家、政治集团和政治集团之间利益矛盾和冲突的最激烈的手段。 （ ）", "answer": true, "explain": "此题正确。战争是解决阶级之间、民族之间、国家之间、政治集团之间利益矛盾和冲突的最激烈的手段。战争是政治通过另一种手段的继续，其实质是暴力的激烈运用。"}, {"chapter": "国家安全", "type": "tf", "id": 530, "question": "对于一个国家的主权和安全来说，来自内部的威胁是最严重的威胁。（）", "answer": false, "explain": "此题错误。对一个国家主权和安全来说，来自外部的威胁（如侵略、干涉）才是最严重的威胁，而非内部威胁。外部威胁直接危及国家生存，内部威胁多通过外部力量转化放大。"}, {"chapter": "国家安全", "type": "tf", "id": 531, "question": "当代世界战争与和平的趋势在国际战略环境中最引人注目，也是世界各国研究和制定军事战略时关注的中心。（ ）", "answer": true, "explain": "此题正确。当代世界战争与和平的趋势在国际战略环境中最引人注目，也是各国研究和制定军事战略时关注的中心。战争与和平的判断直接影响各国的军事建设和战略选择。"}, {"chapter": "国家安全", "type": "tf", "id": 532, "question": "地理环境不仅是制定战略的重要客观依据，而且是影响战争胜负的重要因素。 （ ）", "answer": true, "explain": "此题正确。地理环境既是制定战略的重要客观依据，也是影响战争胜负的重要因素，古今战争皆受其制约。地形、气候、海洋等地理因素历来制约着军事行动的展开。"}, {"chapter": "国家安全", "type": "tf", "id": 533, "question": "在“10+3”机制的带动下，东亚各国在非传统安全领域的合作正不断加强。 （ ）", "answer": true, "explain": "此题正确。在“10+3”机制的带动下，东亚各国在打击恐怖主义、跨国犯罪、防灾减灾等非传统安全领域的合作正不断加强。非传统安全威胁具有跨国性，需要地区各国携手合作应对。"}, {"chapter": "国家安全", "type": "tf", "id": 534, "question": "“一带一路”不是一个实体和机制，而是合作发展的理念和倡议，是依靠中国与有关国家既有的双多边机制，借助既有的、行之有效的区域合作平台。（）", "answer": true, "explain": "此题正确。“一带一路”不是实体和机制，而是合作发展的理念和倡议，依靠中国与有关国家既有的双多边机制和有效的区域合作平台。“一带一路”秉持共商共建共享原则，是开放包容的倡议。"}, {"chapter": "国家安全", "type": "tf", "id": 535, "question": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。 （ ）", "answer": false, "explain": "此题错误。美国虽视中国为主要潜在对手并防范遏制，但基于反恐、朝核、台海稳定及经贸等共同利益仍寻求与中国合作，而非要求对抗。中美关系既有竞争又需合作，对抗并非双方唯一选项。"}, {"chapter": "国家安全", "type": "tf", "id": 536, "question": "一切军事斗争和军事活动，归根结底都要依靠综合国力，特别是经济、科技和军事实力的支撑，并受其制约 。（ ）", "answer": true, "explain": "此题正确。一切军事斗争和军事活动归根结底都要依靠综合国力，特别是经济、科技和军事实力的支撑，并受其制约。综合国力是战争胜负的最终决定因素，军事对抗本质是国力较量。"}, {"chapter": "国家安全", "type": "tf", "id": 537, "question": "2014年10月24日，包括中国、印度、新加坡等在内21个首批意向创始成员国的财长和授权代表在北京签约，共同决定成立亚太经合组织。  （ ）", "answer": false, "explain": "此题错误。2014年10月24日21国财长和授权代表在北京签约成立的是亚洲基础设施投资银行（亚投行），而非亚太经合组织。亚投行是中国倡议成立的政府间多边金融机构，总部设在北京。"}, {"chapter": "国家安全", "type": "tf", "id": 538, "question": "国际战略格局是指国际社会中国际战略力量之间在一定历史时期内相互联系、相互作用而形成的具有全球性的、相对稳定的力量对比结构及基本态势。（）", "answer": true, "explain": "此题正确。国际战略格局是指国际社会中各战略力量在一定历史时期内相互作用形成的具有全球性、相对稳定的力量对比结构及态势。力量对比的相对稳定与动态变化共同推动国际格局的演变。"}, {"chapter": "国家安全", "type": "tf", "id": 539, "question": "一个国家或国家集团在国际社会中的行为能力和影响力，固然要取决于多种因索，但军事实力是其中最基本的、长期起作用的决定性因素。 （ ）", "answer": false, "explain": "此题错误。一个国家在国际社会中的行为能力和影响力，最基本、长期起作用的决定性因素是经济实力（综合国力），而非军事实力。经济是基础、是起长远作用的因素，军事实力建立在经济实力之上。"}, {"chapter": "国家安全", "type": "tf", "id": 540, "question": "美国在第二次世界大战后成为资本主义世界的霸主， 重要的原因就是它拥有世界上最强大的经济和军事实力。从历史上看， 国际战略格局的发展变化， 往往以世界经济格局的发展为先导。（ ）", "answer": true, "explain": "正确。美国凭借战后世界最强大的经济与军事实力成为资本主义世界霸主；从历史上看，世界经济格局的发展变化往往先于并牵引国际战略格局的演变。"}, {"chapter": "国家安全", "type": "tf", "id": 541, "question": "一定的国际秩序总是由在国际战略格局中居于主导地位的国家或国家集团制定的，或是在很大程度上受到这些国家意志的制约和影响。（ ）", "answer": true, "explain": "正确。一定的国际秩序，总是由在国际战略格局中占据主导地位的国家或国家集团主导制定，并在很大程度上受到这些国家意志的制约和影响。"}, {"chapter": "国家安全", "type": "tf", "id": 542, "question": "国际秩序一经建立，它对国际战略格局会起到强制性的维护作用，但在旧格局解体的情况下，原有的国际秩序不会在一定范围和一定程度上继续产生影响。（）", "answer": false, "explain": "错误。旧格局解体后，原有的国际秩序不会立即消失，仍会在一定范围和程度上继续产生影响，其约束作用需要相当长的过渡期才会逐步消退。"}, {"chapter": "国家安全", "type": "tf", "id": 543, "question": "第二次世界大战以前，国际秩序的本质特征是强权政治和殖民政治。（）", "answer": true, "explain": "正确。第二次世界大战以前，国际秩序本质上由少数帝国主义列强支配，其根本特征是强权政治和殖民政治，弱国小国在国际舞台上只能任人宰割。"}, {"chapter": "国家安全", "type": "tf", "id": 544, "question": "国际战略格局按其范围大小，也可以区分为世界格局和地区格局，这两个层次既有其独立性，又有其关联性。 （ ）", "answer": true, "explain": "正确。国际战略格局按范围大小可划分为世界格局与地区格局两个层次，这两者既相对独立又相互关联，共同构成整体的国际战略态势。"}, {"chapter": "国家安全", "type": "tf", "id": 545, "question": "真正具有世界意义的国际战略格局是在现代资本主义发展的基础上形成和发展起来的。 （ ）", "answer": false, "explain": "错误。真正具有世界意义的国际战略格局，是在垄断资本主义（帝国主义）形成并瓜分世界的基础上形成和发展起来的，而非一般的现代资本主义阶段。"}, {"chapter": "国家安全", "type": "tf", "id": 546, "question": "第二次世界大战后，世界秩序被重新安排，形成了以凡尔赛—华盛顿体系为基础的两极格局。 （ ）", "answer": false, "explain": "错误。二战后形成的两极格局是以雅尔塔体系为基础的；凡尔赛—华盛顿体系是一战后建立、后被法西斯侵略所破坏的旧格局，二者不能混为一谈。"}, {"chapter": "国家安全", "type": "tf", "id": 547, "question": "苏联解体，使持续了近半个世纪的东西方美苏两大集团之间激烈对抗的冷战格局彻底终结。 （ ）", "answer": true, "explain": "正确。1991年苏联解体，持续近半个世纪的东西方美苏两大军事集团的冷战对抗格局彻底终结，世界由此进入新旧格局转换的过渡时期。"}, {"chapter": "国家安全", "type": "tf", "id": 548, "question": "美国“一超独霸”的局面是两极体制被打破后的一种过渡现象，在这个过渡期内，国际战略格局呈现的基本态势将是“一超多强”，又是一个终将被多极体制所取代的暂时历史进程。（ ）", "answer": true, "explain": "正确。美国一超独霸只是两极体制瓦解后的过渡现象，这一时期的国际战略格局呈现一超多强的基本态势，终将被多极化格局逐步取代。"}, {"chapter": "国家安全", "type": "tf", "id": 549, "question": "亚太经合组织是当今世界上规模最大、一体化程度最高的地区经济集团，具有雄厚的经济、科技和军事实力。（ ）", "answer": false, "explain": "错误。当今世界上规模最大、一体化程度最高的地区政治经济集团是欧盟，而非亚太经合组织；亚太经合组织是较为松散的经济合作论坛。"}, {"chapter": "国家安全", "type": "tf", "id": 550, "question": "江泽民早在1990年初就曾指出：“所谓多极，中国算一极，中国不要贬低自己，怎么样也算一极。”（   ）", "answer": false, "explain": "错误。「所谓多极，中国算一极，中国不要贬低自己，怎么样也算一极」这句多极化格局的著名论断是邓小平在1990年所述，并非江泽民。"}, {"chapter": "国家安全", "type": "tf", "id": 551, "question": "世界将在地缘上分为欧洲、原苏联地区、亚太、中东、拉美和非洲等六大军事区域，形成各具特色的地区军事格局。 （ ）", "answer": true, "explain": "正确。从地缘上看，世界可分为欧洲、原苏联地区、亚太、中东、拉美和非洲等六大军事区域，从而形成各具特色的地区军事格局。理解六大军事区域的划分，有助于把握世界地区军事格局的全貌。"}, {"chapter": "国家安全", "type": "tf", "id": 552, "question": "东盟各国的“东盟地区论坛”已成为亚太地区第一个政府间的多边安全对话机制。 （ ）", "answer": true, "explain": "正确。「东盟地区论坛」是东盟各国主导建立的、亚太地区第一个政府间的多边安全对话机制，为地区安全合作提供了重要的对话平台。"}, {"chapter": "国家安全", "type": "tf", "id": 553, "question": "上海合作组织把打击三股势力、维护地区安全与稳定作为首要任务，近年来还逐步加强合作打击中亚地区日益严重的毒品走私活动，把遏制和铲除毒品走私纳入反恐合作的框架之中。（ ）", "answer": true, "explain": "正确。上海合作组织把打击三股势力、维护地区安全与稳定作为首要任务，并将遏制和铲除毒品走私纳入反恐合作框架，逐步加强禁毒合作。"}, {"chapter": "国家安全", "type": "tf", "id": 554, "question": "美国的“新干涉主义” 和战略扩张成为国际局势动荡的根源。（ ）", "answer": true, "explain": "正确。美国的「新干涉主义」和战略扩张行径，是冷战后国际局势动荡不安的重要根源，也是当前霸权主义和强权政治的突出表现。新干涉主义以“人权高于主权”为幌子，实质是干涉他国内政、推行霸权。"}, {"chapter": "国家安全", "type": "tf", "id": 555, "question": "总体稳定是世界形势的主流。 （ ）", "answer": true, "explain": "正确。总体缓和、局部动荡是当代国际形势的基本特征，和平与发展仍然是当今时代的主题，总体稳定是世界形势发展的主流。全球性大战打不起来、局部冲突此起彼伏，构成了冷战后国际形势的基本画面。"}, {"chapter": "国家安全", "type": "tf", "id": 556, "question": "两极世界解体后，全球性的军事对抗已不复存在，爆发世界大战的可能性越来越小。 （）", "answer": true, "explain": "正确。两极世界解体后，全球性的军事对抗已不复存在，爆发世界大战的可能性越来越小，战争形态日益转向局部高技术战争。世界大战威胁降低，但地区性局部战争和高技术冲突依然频发，不可掉以轻心。"}, {"chapter": "国家安全", "type": "tf", "id": 557, "question": "金融安全在国家经济安全乃至整个国家安全中的战略地位空前上升， 并相对军事安全而言成为当代国家安全斗争的又一主战场。 （ ）", "answer": true, "explain": "正确。在经济全球化背景下，金融安全在国家经济安全乃至整个国家安全中的战略地位空前上升，成为与军事安全并立的当代国家安全斗争又一主战场。"}, {"chapter": "国家安全", "type": "tf", "id": 558, "question": "共建“一带一路”致力于亚欧非大陆及附近海洋的互联互通，建立和加强沿线各国互联互通伙伴关系，构建全方位、多层次、复合型的互联互通网络，实现沿线各国多元、自主、平衡、可持续的发展。 （ ）", "answer": true, "explain": "正确。「一带一路」倡议致力于亚欧非大陆及附近海洋的互联互通，通过建立和加强沿线伙伴关系，构建全方位、多层次、复合型的互联互通网络，实现多元、自主、平衡、可持续的发展。"}, {"chapter": "国家安全", "type": "tf", "id": 559, "question": "我国是世界上拥有邻国最多的国家。 （ ）", "answer": true, "explain": "正确。我国陆地与海上邻国众多，是世界上拥有邻国数量最多的国家之一，周边环境十分复杂，面临的周边地缘安全形势相当严峻。多达二十余个陆上和海上邻国环列，决定了我国周边安全环境的高度复杂性。"}, {"chapter": "国家安全", "type": "tf", "id": 560, "question": "中国周边地区也是世界上大国最集中的地区，且多为军事强国。 （ ）", "answer": true, "explain": "正确。中国周边地区是世界大国分布最集中的区域，俄罗斯、日本、印度等大国环列，且多拥有较强的军事实力和重大的战略影响力。大国集中、强邻环伺，使我国周边成为世界上安全环境最复杂的地区之一。"}, {"chapter": "国家安全", "type": "tf", "id": 561, "question": "从地缘政治的角度看，美国也是中国的邻国，因为它在中国周边有强大的力量存在和战略影响。 （ ）", "answer": true, "explain": "正确。从地缘政治角度看，美国凭借在中国周边的军事基地、驻军和强大的战略影响力，也被视为中国周边一个重要的地缘力量。美国通过前沿部署和军事同盟，对我国周边形成强大的地缘战略牵制。"}, {"chapter": "国家安全", "type": "tf", "id": 562, "question": "台湾海峡是连接太平洋和印度洋的海上交通咽喉，扼控两洋航线的枢纽，是亚太各国经贸发展的“生命阀”。 （ ）", "answer": false, "explain": "错误。连接太平洋与印度洋的海上交通咽喉是马六甲海峡，而非台湾海峡，马六甲海峡扼控两洋航线枢纽，被誉为海上生命线。马六甲海峡是世界上航运最繁忙的海峡之一，对全球能源运输意义重大。"}, {"chapter": "国家安全", "type": "tf", "id": 563, "question": "当今世界五大热点地区：中东波斯湾、中亚、南亚次大陆、台湾海峡、朝鲜半岛，几乎都在中国周边。 （ ）", "answer": true, "explain": "正确。中东波斯湾、中亚、南亚次大陆、台湾海峡、朝鲜半岛是当今世界五大热点地区，几乎都分布在中国周边，直接影响我国安全。热点问题盘根错节、环环相扣，使我国周边安全长期面临多重压力。"}, {"chapter": "国家安全", "type": "tf", "id": 564, "question": "为打破美、前苏两个超级大国对我国实施的战略包围，我国先后采取了一系列重大战略性举措。从抗美援朝、中印边境自卫反击战、援越抗美斗争到中越边境自卫还击作战等，有力地打击了霸权主义行径。 （ ）", "answer": true, "explain": "正确。为打破美苏两个超级大国对我国的战略包围，我国先后进行了抗美援朝、中印边境自卫反击战、援越抗美和中越边境自卫还击作战等，有力打击了霸权主义。"}, {"chapter": "国家安全", "type": "tf", "id": 565, "question": "新中国成立到20世纪60年代，对我国独立和安全的威胁主要来自美国。美国不甘心在中国内地的失败，长期推行政治上孤立、经济上封锁、军事上威胁的反华、仇华政策。（ ）", "answer": true, "explain": "正确。从新中国成立到20世纪60年代，我国安全的主要威胁来自美国，其长期推行政治上孤立、经济上封锁、军事上威胁的反华仇华政策。"}, {"chapter": "国家安全", "type": "tf", "id": 566, "question": "钓鱼诸岛自古以来一直是中国领土不可分割的部分。 （ ）", "answer": true, "explain": "正确。钓鱼岛及其附属岛屿自古以来就是中国领土不可分割的一部分，中国对其拥有无可争辩的主权，有充分的历史和法理依据。历史上中国渔民长期在钓鱼岛海域生产作业，日本窃取钓鱼岛是非法的。"}, {"chapter": "国家安全", "type": "tf", "id": 567, "question": "2009年至今，中国海监执法船、中国海警巡航编队多次开赴钓鱼岛，既是依法行使对中国领土钓鱼岛及其附近海域的巡航执法，也是中国行使对钓鱼岛主权的具体体现。 （ ）", "answer": true, "explain": "正确。2009年以来，中国海监、海警执法编队多次巡航钓鱼岛海域，是依法行使管辖权、维护钓鱼岛主权的具体体现和常态化维权行动。"}, {"chapter": "国家安全", "type": "tf", "id": 568, "question": "南海是我国同东南亚各国交往的重要纽带，南沙群岛是拱卫我国南大门的第一道海上战略屏障，也是保卫海上通道安全的前沿阵地。 （ ）", "answer": true, "explain": "正确。南海是我国与东南亚各国交往的重要纽带，南沙群岛是拱卫祖国南大门的第一道海上战略屏障，也是保卫海上通道安全的前沿阵地。"}, {"chapter": "国家安全", "type": "tf", "id": 569, "question": "国际恐怖势力在中国周边的频繁滋事，恶化了中国周边环境，直接危害着中国国家安全。 （ ）", "answer": true, "explain": "正确。国际恐怖势力在中国周边频繁滋事，恶化了中国周边安全环境，直接危害我国的国家安全、社会稳定和人民生命财产安全。“东突”等势力与境外恐怖组织勾连，是我国反恐维稳斗争的重点。"}, {"chapter": "军事思想", "type": "tf", "id": 570, "question": "军事思想具有鲜明的阶级性、强烈的时代感、丰富的实践性和明显的继承性。 （ ）", "answer": true, "explain": "正确。军事思想具有鲜明的阶级性、强烈的时代感、丰富的实践性和明显的继承性四大基本特征，是军事理论体系的核心内容。四大特征相互联系，共同构成军事思想的本质属性和理论品格。"}, {"chapter": "军事思想", "type": "tf", "id": 571, "question": "军事思想来源于人类的军事实践，同时又给人类的军事实践以理论指导。（）", "answer": true, "explain": "正确。军事思想来源于军事实践，同时又反过来给军事实践以理论指导，二者相互促进、辩证统一，共同推动军事领域不断发展。理论与实践的辩证统一，是军事思想不断发展前行的内在动力。"}, {"chapter": "军事思想", "type": "tf", "id": 572, "question": "军事思想来源于社会实践，在阶级社会中，人们为了各自阶级的利益，所奉行和推崇的军事思想，必然反映各个阶级对战争和军队建设的认识和立场。因此军事思想具有强烈的时代感。（）", "answer": false, "explain": "错误。在阶级社会中，军事思想必然反映一定阶级的利益、立场和对战争的认识，这体现的是鲜明的阶级性，而非时代感。阶级属性是军事思想的首要特征，时代性主要体现为随时代而更新。"}, {"chapter": "军事思想", "type": "tf", "id": 573, "question": "军事思想是一个历史范畴，不同历史时期的战争有着不同的形态和战略战术，有着不同的军队组织原则和编制，军事思想随着人类社会的发展而不断演变。因此军事思想具有强烈的时代感。 （ ）", "answer": true, "explain": "正确。军事思想是历史范畴，随社会发展和战争形态的演变而不断更新，不同时代有不同的军事理论，正体现了其强烈的时代感。战争形态从冷兵器到信息化不断演进，军事理论也随之不断推陈出新。"}, {"chapter": "军事思想", "type": "tf", "id": 574, "question": "军事思想是由军事实践产生，受军事实践的检验，随着军事实践的发展而发展，任何军事思想都是对战争实践的经验总结和升华。因此军事思想具有明显的继承性。 （ ）", "answer": false, "explain": "错误。军事思想来源于军事实践、受军事实践检验并随军事实践的发展而发展，这体现的是丰富的实践性，而非继承性。任何军事思想都源于实践又受实践检验，这正是实践性的内涵所在。"}, {"chapter": "军事思想", "type": "tf", "id": 575, "question": "军事理论的继承和发展都离不开对以往军事思想的扬弃，是人们对以往的军事实践认识成果中正确理论的继承和发展。因此军事思想具有明显的继承性。（）", "answer": true, "explain": "正确。军事理论的继承和发展离不开对以往军事思想的扬弃，是批判继承前人正确认识成果的过程，体现了明显的继承性特征。继承前人优秀成果又结合现实加以创新，军事思想才得以代代相传。"}, {"chapter": "军事思想", "type": "tf", "id": 576, "question": "一般认为我国古代军事思想的初步形成于夏商周时期（）", "answer": true, "explain": "正确。一般认为，我国古代军事思想在夏、商、周时期，随着战争规模的扩大和军事活动的不断增多而初步形成。夏商周时期战争频繁，为古代军事思想的初步形成提供了实践土壤。"}, {"chapter": "军事思想", "type": "tf", "id": 577, "question": "一般认为我国古代军事思想在春秋战国时期进入系统化、体系化阶段。（）", "answer": false, "explain": "错误。我国古代军事思想在春秋战国时期进入繁荣成熟、奠基定型的阶段，涌现出《孙子兵法》等经典著作，而非才开始系统化体系化。"}, {"chapter": "军事思想", "type": "tf", "id": 578, "question": "宋神宗时期，把《孙子兵法》《孙胺兵法》、《六韬》、《黄石公三略》、《尉缭子》、《司马法》、《李卫公问对》等七部兵书作为武学必修课程，统称《武经七书》。（ ）", "answer": false, "explain": "错误。《武经七书》包括《孙子》《吴子》《司马法》《六韬》《尉缭子》《三略》《李卫公问对》七部兵书，其中并无《孙膑兵法》。"}, {"chapter": "军事思想", "type": "tf", "id": 579, "question": "毛泽东在人民战争的战略战术思想中提出，战争以歼灭敌人有生力量作为作战的主要目标，不以保守或夺取城市和地方为主要目标。（ ）", "answer": true, "explain": "正确。毛泽东在人民战争的战略战术中提出，战争以歼灭敌人有生力量为主要目标，不以保守或夺取城市和地方为主要目标。不以攻城略地为目标而以歼敌有生力量为主，是人民战争的重要指导原则。"}, {"chapter": "军事思想", "type": "tf", "id": 580, "question": "江泽民提出“部队要做到政治合格、军事过硬、作风优良、纪律严明、保障有力”。 ( )", "answer": true, "explain": "正确。江泽民对我军建设提出「政治合格、军事过硬、作风优良、纪律严明、保障有力」的五句话总要求，是全军建设的行动指南。“五句话”总要求从政治、军事、作风、纪律、保障五方面规范了军队建设。"}, {"chapter": "军事思想", "type": "tf", "id": 581, "question": "胡锦涛提出“我们必须统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会进程中实现富国和强军的统一”。 ( )", "answer": true, "explain": "正确。胡锦涛提出统筹经济建设和国防建设，走中国特色军民融合式发展路子，在全面建设小康社会的进程中实现富国和强军的统一。军民融合式发展路子，是统筹富国与强军、实现国防建设科学发展的必由之路。"}, {"chapter": "军事思想", "type": "tf", "id": 582, "question": "中国第一部军事地理学专著是《武经总要》。（ ）", "answer": false, "explain": "错误。中国第一部军事地理学专著是明末清初顾祖禹的《读史方舆纪要》，《武经总要》是宋代编纂的综合性军事著作而非军事地理专著。"}, {"chapter": "军事思想", "type": "tf", "id": 583, "question": "与中国古代军事思想相比，世界古代军事思想起步较晚，反映了该时期军事思想的著作有《伯罗奔尼撒战争史》、《希腊波斯战争史》、《罗马军制》、《长征记》等。 （ ）", "answer": true, "explain": "正确。世界古代军事思想起步较晚，反映该时期军事思想的著作有《伯罗奔尼撒战争史》《希腊波斯战争史》《罗马军制》《长征记》等。"}, {"chapter": "军事思想", "type": "tf", "id": 584, "question": "近代无产阶级军事思想的代表人物是拿破仑、马克思、恩格斯、列宁。（）", "answer": false, "explain": "错误。近代无产阶级军事思想的代表人物是马克思、恩格斯、列宁和斯大林等；拿破仑是资产阶级军事家，不属于无产阶级军事思想家。"}, {"chapter": "军事思想", "type": "tf", "id": 585, "question": "反映了近代无产阶级军事思想的著作有《共产党宣言》、《德国农民战争》、《法兰西内战》、《战争艺术概论》等。 （ ）", "answer": false, "explain": "错误。《战争艺术概论》是资产阶级军事理论家若米尼的著作，属于资产阶级军事思想，不应列入无产阶级军事思想的代表性著作。无产阶级军事思想代表著作应以马恩列斯的经典论著为准，若米尼属资产阶级阵营。"}, {"chapter": "军事思想", "type": "tf", "id": 586, "question": "马克思主义军事理论的诞生，为人们研究和解决军事领域的问题提供了科学的基本观点和方法，为无产阶级军事思想的发展奠定了坚实的理论基础。（）", "answer": true, "explain": "正确。马克思主义军事理论的创立，为研究和解决军事领域问题提供了科学的世界观和方法论，为无产阶级军事思想发展奠定了坚实的理论基础。"}, {"chapter": "军事思想", "type": "tf", "id": 587, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论战 争本质观的战争本质的观点。（ ）", "answer": true, "explain": "正确。「兵者，凶器也」「国之大事」「诡道」「文武」「礼义忠信」等论断从多角度揭示了战争的本质属性，体现了中国古代军事思想中的战争本质观。"}, {"chapter": "军事思想", "type": "tf", "id": 588, "question": "认为战争并不是自有人类以来就有的 ， 战争是人类社会发展到一定历史阶段的产物。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。（）", "answer": true, "explain": "正确。认为战争并非从来就有、而是人类社会发展到一定历史阶段的产物，这体现的是古代军事思想中关于战争起源的观点。战争起源观认为战争是阶级社会特有的历史现象，并非与人类同步产生。"}, {"chapter": "军事思想", "type": "tf", "id": 589, "question": "“人口论”认为，古时候人少、财物多，所以没有争斗和战争，后来人口不断增多，社会财富相对减少，人们为了争夺生存条件就发生了战争。这体现了中国古代军事思想战争论中战争本质观的战争起源的观点。 （ ）", "answer": false, "explain": "错误。「人口论」把战争根源简单归于人口增多导致财富相对不足，是对战争起源的一种朴素甚至片面的认识，并不属于正确的战争起源观。"}, {"chapter": "军事思想", "type": "tf", "id": 590, "question": "对待战争的态度中，“偃兵废武论”认为兵是凶器，争是逆德，因此主张“偃武修文”，实行文治。 （ ）", "answer": true, "explain": "正确。「偃兵废武论」认为兵为凶器、争为逆德，因而主张偃武修文、实行文治，反对穷兵黩武，这是一种带和平主义色彩的战争观。偃兵废武论反映了古代某些思想家对和平的向往，但也有脱离现实的局限。"}, {"chapter": "军事思想", "type": "tf", "id": 591, "question": "习近平提出“实现中华民族伟大复兴，是中华民族近代以来最伟大的梦想。可以说，这个梦想是强国梦，对军队来说，也是强军梦。我们要实现中华民族伟大复兴，必须坚持富国和强军相统一，努力建设巩固国防和强大军队。”（）", "answer": true, "explain": "正确。习近平指出，实现中华民族伟大复兴是中华民族近代以来最伟大的梦想，对军队来说也是强军梦，必须坚持富国和强军相统一，建设巩固国防和强大军队。"}, {"chapter": "军事思想", "type": "tf", "id": 592, "question": "对待战争的态度中，“义兵慎战论”认为战争并不是绝对的坏事，对战争要具体分析，明确表明要支持正义战争，反对非正义战争。 （ ）", "answer": true, "explain": "正确。「义兵慎战论」认为战争并非绝对坏事，主张对战争具体分析，明确支持正义战争、反对非正义战争，采取慎重对待战争的态度。"}, {"chapter": "军事思想", "type": "tf", "id": 593, "question": "明太祖在《谕将帅》中提出“发兵为诛暴，诛暴为保民”，“诛暴保民论”体现了中国古代军事思想中战争论的战争和平观。 （ ）", "answer": true, "explain": "正确。明太祖在《谕将帅》中提出「发兵为诛暴，诛暴为保民」，其诛暴保民论体现了中国古代军事思想战争论中的战争正义观。诛暴保民说把战争定性为伐无道、救民于水火的正义之举，源于儒家仁政思想。"}, {"chapter": "军事思想", "type": "tf", "id": 594, "question": "“兵者，凶器也，战者危事；兵者，国之大事也；兵者，诡道也；兵者，文武也；兵者，礼义忠信也”。这体现了中国古代军事思想中战争论的战争本质观。 （ ）", "answer": true, "explain": "正确。「兵者，凶器也」「国之大事」「诡道」「文武」「礼义忠信」等从政治、谋略、道义等多重属性揭示战争本质，体现了古代军事思想的战争本质观。"}, {"chapter": "军事思想", "type": "tf", "id": 595, "question": "《孙膑兵法》中提出“富国”是“强兵之急＂，这体现了中国古代军事思想中战争论的战争政治观。 （ ）", "answer": false, "explain": "错误。《孙膑兵法》提出「富国」是「强兵之急」，讲的是经济富足是强兵的根本，体现的是战争的经济观，而非战争政治观。经济是战争的物质基础，富国才能强兵，这属于战争经济观而非政治观。"}, {"chapter": "军事思想", "type": "tf", "id": 596, "question": "《淮南子》中指出“兵之胜败，本在于政”，这体现了中国古代军事思想中战争论的战争和平观。 （ ）", "answer": false, "explain": "错误。《淮南子》中「兵之胜败，本在于政」强调政治清明是战争胜败的根本，体现的是战争的政治观，而非和平观。政治决定战争的胜负，这是《淮南子》战争政治观的集中体现。"}, {"chapter": "军事思想", "type": "tf", "id": 597, "question": "邓小平根据现代战争的特点和规律，结合我国的实际情况，提出了“现代条件下人民战争”的思想。 （ ）", "answer": true, "explain": "正确。邓小平根据现代战争的特点和规律，结合我国的实际情况，创造性地提出了「现代条件下人民战争」这一重要思想。现代条件下人民战争强调依靠人民、运用高技术手段进行总体战。"}, {"chapter": "军事思想", "type": "tf", "id": 598, "question": "《孙子兵法》中强调“上兵伐谋，其次伐交”，这体现了中国古代军事思想战备论中战备的内容是外交上备战。 （ ）", "answer": true, "explain": "正确。《孙子兵法》强调「上兵伐谋，其次伐交」，把运用谋略和外交手段瓦解敌方作为上策，体现了战备内容中的外交备战。把伐谋伐交置于军事打击之上，体现了孙子重视外交和谋略的备战思想。"}, {"chapter": "军事思想", "type": "tf", "id": 599, "question": "“寓兵于政”、“寓兵于农”、“寓兵于刑”、“寓兵于乐”，强调要注意备战的相称性原则。（ ）", "answer": false, "explain": "错误。「寓兵于政、寓兵于农、寓兵于刑、寓兵于乐」强调的是把兵员、武力寓于社会各领域、实现全民皆兵的整体性备战，而非相称性原则。"}, {"chapter": "军事思想", "type": "tf", "id": 600, "question": "我国古代的军事家、政治家认为战备的最 高标准和目标，就是在政治、经济、军事、技术等各有关决定战争胜负的诸因素方面，相对于敌人来说都要占有绝对优势。这体现了备战的整体性原则。（ ）", "answer": false, "explain": "错误。认为战备的最高标准是在政治、经济、军事、技术等各决定战争胜负的因素上对敌全面占有优势，这正是整体性原则，命题判断本身错误。"}, {"chapter": "军事思想", "type": "tf", "id": 601, "question": "“耕战并重”强调了备战的超前性原则。 （ ）", "answer": false, "explain": "错误。「耕战并重」强调平时务农、战时从军，体现的是军民结合、平战结合的备战原则，而非超前性原则。农耕社会寓兵于农、农战合一，是古代平战结合思想的生动体现。"}, {"chapter": "军事思想", "type": "tf", "id": 602, "question": "“有民则有兵，无民而兵不可为也”，这体现了中国古代军事思想中治军论的“军以民为本”。( )", "answer": true, "explain": "正确。「有民则有兵，无民而兵不可为也」强调民众是军队的根本来源，体现了治军论中「军以民为本」的重要思想。民为邦本、兵出于民，民众的支持是军队立足的根本和源泉。"}, {"chapter": "军事思想", "type": "tf", "id": 603, "question": "《孙子兵法》中提出“治众如治寡，分数是也”，这体现了中国古代军事思想中治军论的“凡兵，制必先定”。 ( )", "answer": true, "explain": "正确。《孙子兵法》「治众如治寡，分数是也」强调靠编制组织来统御大军，体现了治军论中「凡兵，制必先定」的思想。严密的组织编制是统御千军万马的前提，先定制而后成军。"}, {"chapter": "军事思想", "type": "tf", "id": 604, "question": "戚继光的《纪效新书》中指出“有精器而无精兵以用之，是谓徒费；有精兵而无精器，是谓徒强”，这体现了中国古代军事思想中治军论的“凡胜，备必先具”。 ( )", "answer": true, "explain": "正确。戚继光《纪效新书》指出精器与精兵缺一不可、须相互配合，精良武器和精锐士卒相结合，体现了治军论「凡胜，备必先具」思想。"}, {"chapter": "军事思想", "type": "tf", "id": 605, "question": "诸葛亮强调“夫用兵之道，必定其谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （ ）", "answer": true, "explain": "正确。诸葛亮强调「夫用兵之道，必定其谋」，把先定计谋作为用兵的首要，体现了「用兵之道，先谋为本」的观点。谋定而后动是先胜思想的体现，诸葛亮以此作为用兵的第一要义。"}, {"chapter": "军事思想", "type": "tf", "id": 606, "question": "岳飞讲“勇不足恃，用兵在先定谋”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。 （ ）", "answer": true, "explain": "正确。岳飞讲「勇不足恃，用兵在先定谋」，强调作战须先有谋略、谋定而后动，体现了「用兵之道，先谋为本」的观点。岳飞以身经百战的实践印证了先谋后兵、以谋制胜的军事原则。"}, {"chapter": "军事思想", "type": "tf", "id": 607, "question": "邓小平运用辩证唯物主义和历史唯物主义的原理， 研究指导中国革命战争，创造性地提出了“军事辩证法”这一概念。 （ ）", "answer": false, "explain": "错误。「军事辩证法」这一概念是毛泽东运用辩证唯物主义和历史唯物主义研究指导中国革命战争时创造性地提出的，而非邓小平。毛泽东把唯物辩证法和历史唯物主义运用于军事，实现了军事理论的科学化。"}, {"chapter": "军事思想", "type": "tf", "id": 608, "question": "孙武指出“兵贵胜，不贵久”， 这体现了中国古代军事思想中用兵论的“兵之情主速”的观点。（ ）", "answer": true, "explain": "正确。孙武指出「兵贵胜，不贵久」，主张速战速决、避免久拖不决，体现了用兵论中「兵之情主速」的速胜思想。久拖不决耗国疲民，故孙子力主速胜，这是其军事经济思想的体现。"}, {"chapter": "军事思想", "type": "tf", "id": 609, "question": "《太白阴经》强调“道贵制人，不贵制于人；制人者握权，制于人者遵命也”，这体现了中国古代军事思想中用兵论的“致人而不致于人”的观点。（）", "answer": true, "explain": "正确。《太白阴经》「道贵制人，不贵制于人」强调争取主动、调动敌人而非受制于敌，体现了「致人而不致于人」的思想。制人而不制于是掌握战场主动权的核心，是古今用兵通则。"}, {"chapter": "军事思想", "type": "tf", "id": 610, "question": "岳飞讲“运用之妙，存乎一心”，这体现了中国古代军事思想中用兵论的“因机立胜”的观点。 （ ）", "answer": true, "explain": "正确。岳飞讲「运用之妙，存乎一心」，强调用兵要随战场情况变化而灵活运用，体现了「因机立胜」的灵活用兵观点。战局瞬息万变，只有随机应变、因势利导才能克敌制胜。"}, {"chapter": "军事思想", "type": "tf", "id": 611, "question": "《孙子兵法》中提出“兵形象水，水因地而制流，兵因敌而制胜”，这体现了中国古代军事思想中用兵论的“用兵之道，先谋为本”的观点。（ ）", "answer": false, "explain": "错误。《孙子兵法》「兵形象水，水因地而制流，兵因敌而制胜」强调根据敌情变化灵活制胜，体现的是因敌制胜思想，而非先谋为本。"}, {"chapter": "军事思想", "type": "tf", "id": 612, "question": "《尉缭子》中认为“权先加人者，兵敌不力交；武先加人者，敌无威接”，这体现了中国古代军事思想中用兵论的“先胜而后求战”的观点。（ ）", "answer": false, "explain": "错误。《尉缭子》「权先加人」「武先加人」强调先发制人、赢得战场主动，体现的是「致人而不致于人」的思想，而非先胜而后求战。"}, {"chapter": "军事思想", "type": "tf", "id": 613, "question": "遵义会议后， 确定了以毛泽东为首的党中央领导集体。（）", "answer": true, "explain": "正确。遵义会议结束了左倾错误在党中央的统治，确立了以毛泽东为核心的党中央的正确领导，成为党的历史上生死攸关的转折点。这一转折确立了正确的军事路线和组织路线，为长征胜利提供了组织保证。"}, {"chapter": "军事思想", "type": "tf", "id": 614, "question": "帝国主义和霸权主义是现代战争的根源。 （ ）", "answer": true, "explain": "正确。当今时代，帝国主义和霸权主义是诱发和挑动战争的重要根源，是现代战争的根源所在，必须高度警惕并坚决斗争。反对霸权主义、维护世界和平，是我国始终不渝的原则立场。"}, {"chapter": "军事思想", "type": "tf", "id": 615, "question": "司马光主张“才者，德之资也；德者，才之帅也”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （ ）", "answer": true, "explain": "正确。司马光主张「才者德之资，德者才之帅」，强调德才兼备、以德为先，体现了将帅选拔任用的全面性原则。德才兼备、以德为先，是用人的根本标准，历代兵家都高度重视。"}, {"chapter": "军事思想", "type": "tf", "id": 616, "question": "《鬼谷子》中提出“智者不用其所短，而用愚人之所长；不用其所拙，而用愚人之所丁”，这体现了中国古代军事思想中将帅选拔任用的优化性原则。 （ ）", "answer": true, "explain": "正确。《鬼谷子》主张用人应扬长避短、因才施用、各尽其能，体现了将帅选拔任用中的优化性原则。人尽其才、扬长避短，才能充分发挥各类人才的战斗力。"}, {"chapter": "军事思想", "type": "tf", "id": 617, "question": "《吕氏春秋》指出“以人之小恶，亡人之大美，此人主之所以失天下之士也”，这体现了中国古代军事思想中将帅选拔任用的开放性原则。 （ ）", "answer": false, "explain": "错误。《吕氏春秋》「不以小恶亡大美」强调用人应宽容其小过、看重其大才，体现的是将帅选拔的宽容开明态度，而非开放性。用人贵在不求全责备，宽容其短、善用其长，方能广纳贤才。"}, {"chapter": "军事思想", "type": "tf", "id": 618, "question": "《汉书》中提出“论大功者不录小过，举大美者不庇疵细瑕”，这体现了中国古代军事思想中将帅选拔任用的全面性原则。 （ ）", "answer": false, "explain": "错误。《汉书》「论大功不录小过，举大美不疵细瑕」强调看大节不究小节，体现的是用人的宽容态度而非全面性原则。不以言举人、不以人废言，选拔将帅应着眼于大节和才能。"}, {"chapter": "军事思想", "type": "tf", "id": 619, "question": "《孙子兵法》是中国现存最早的兵书，也是世界上最早的军事著作， 被誉为“兵学圣典”。 ( )", "answer": true, "explain": "正确。《孙子兵法》是中国现存最早的兵书，也是世界现存最早的军事著作，被誉为「兵学圣典」，对后世产生了深远影响。孙子兵法十三篇蕴含的谋略思想，两千多年来影响深远、历久弥新。"}, {"chapter": "现代理论", "type": "tf", "id": 620, "question": "信息是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （ ）", "answer": true, "explain": "正确。信息是事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍反映形式。信息概念的准确把握，是理解信息化战争一系列理论的前提和基础。"}, {"chapter": "现代理论", "type": "tf", "id": 621, "question": "信息化是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （ ）", "answer": true, "explain": "正确。信息化是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会、推动社会进步的历史过程。信息化的本质是以信息技术改造社会各领域、创新生产生活方式。"}, {"chapter": "现代理论", "type": "tf", "id": 622, "question": "信息化战争是指发生在信息时代，以信息为基础并以信息化武器装备为主要战争工具和作战手段，以系统集成和信息控制为主导，在全维空间内通过精确打击、实时控制、信息攻防等方式进行的瘫痪和震慑作战。 （ ）", "answer": true, "explain": "正确。信息化战争发生在信息时代，以信息为基础、以信息化武器装备为主要工具，以系统集成和信息控制为主导，在全维空间进行精确打击、实时控制和信息攻防。"}, {"chapter": "现代理论", "type": "tf", "id": 623, "question": "最早提出信息战概念的人是钱学森。（ ）", "answer": false, "explain": "错误。最早系统提出信息战概念的中国军事理论家是沈伟光，而非钱学森，钱学森是著名的科学家而非军事理论家。沈伟光作为我国最早的信息战理论奠基人，其贡献应当准确掌握。"}, {"chapter": "现代理论", "type": "tf", "id": 624, "question": "信息具有可量度、可识别、可转换、可储存、可处理、可传递、可再生、可压缩、实效性、可共享等特征。 （ ）", "answer": true, "explain": "正确。信息具有可量度、可识别、可转换、可储存、可处理、可传递、可再生、可压缩、有实效性和可共享等多种特征。信息的这些特征推动了信息技术在军事领域的广泛应用和融合。"}, {"chapter": "现代理论", "type": "tf", "id": 625, "question": "在信息化战争中，除进行物质力量的较量之外，更主要的是知识的较量，即创新能力和创新速度的竞赛，知识成为战争毁灭力的主要来源。（ ）", "answer": true, "explain": "正确。信息化战争中，除物质力量较量外更主要是知识的较量，即创新能力和创新速度的竞赛，知识成为战争毁伤力的主要来源。信息化战争胜负更多地取决于科技含量和人才素质，而非单纯拼数量。"}, {"chapter": "现代理论", "type": "tf", "id": 626, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第四次浪潮战争”。 ( )", "answer": false, "explain": "错误。托夫勒从人类文明演进角度将信息化战争称为「第三次浪潮战争」（信息社会浪潮），而非第四次浪潮战争。托夫勒用“三次浪潮”划分人类文明，第三次浪潮即信息社会。"}, {"chapter": "现代理论", "type": "tf", "id": 627, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“非接触战争”。 ( )", "answer": true, "explain": "正确。俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，把信息化战争称之为「非接触战争」，突出了超视距精确打击的特点。"}, {"chapter": "现代理论", "type": "tf", "id": 628, "question": "中国著名的军事理论家孙武，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。 （ ）", "answer": true, "explain": "正确。中国军事家孙武早在两千多年前就提出「不战而屈人之兵」，这一思想也正是信息战所追求的核心和宗旨。这一古老智慧与信息战“不战而胜”理念高度契合，跨越时空。"}, {"chapter": "现代理论", "type": "tf", "id": 629, "question": "首次利用空中卫星进行战场侦察的战争是第三次中东战争。（ ）", "answer": false, "explain": "错误。首次利用空中卫星进行战场侦察的战争是第四次中东战争（1973年），而非第三次中东战争。第三次中东战争（1967年）尚未使用卫星侦察，卫星侦察首次亮相于1973年。"}, {"chapter": "现代理论", "type": "tf", "id": 630, "question": "马岛战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（ ）", "answer": true, "explain": "正确。马岛战争中，交战双方第一次大规模集中使用制导武器，共投入17种类型的战术导弹、制导鱼雷和炸弹进行对抗，开精确制导武器实战先河。"}, {"chapter": "现代理论", "type": "tf", "id": 631, "question": "海湾战争中，英军还以“竞技神”号、“无敌”号航空母舰上的电子干扰系统和“鹄”式直升机上的机载干扰系统，对阿军的袭击兵器和指挥控制系统实施了电磁干扰与压制。 （ ）", "answer": false, "explain": "错误。利用航母电子干扰系统对阿军实施电磁干扰压制的，是英军在马岛战争中的做法，而非海湾战争。马岛战争是英军运用电子战和制导武器的经典战例，而非海湾战争。"}, {"chapter": "现代理论", "type": "tf", "id": 632, "question": "朝鲜战争中，美国军队依靠优势空中力量进行长时间”地毯式轰炸”的空袭作战，以及直升机与特种作战部队相结合，进行“蛙跳”式的袭击作战。（）", "answer": false, "explain": "错误。以优势空中力量进行长时间地毯式轰炸，并与直升机、特种部队结合实施蛙跳袭击的，是美军在越南战争中的做法，并非朝鲜战争。"}, {"chapter": "现代理论", "type": "tf", "id": 633, "question": "高技术战争的萌芽阶段中，具有代表性的战争是朝鲜战争和越南战争。（）", "answer": true, "explain": "正确。高技术战争的萌芽阶段，具有代表性的战争是朝鲜战争和越南战争，此时高技术武器装备开始应用于实战。朝鲜战争中喷气式飞机大量参战，越南战争则首次大规模使用了直升机。"}, {"chapter": "现代理论", "type": "tf", "id": 634, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是第四次中东战争和海湾战争。 （ ）", "answer": false, "explain": "错误。高技术战争的初期发展与基本形成阶段，代表性战争是第四次中东战争和马岛战争，而非海湾战争。第四次中东战争的制导武器、马岛战争的电子战，都是高技术战争形成的标志。"}, {"chapter": "现代理论", "type": "tf", "id": 635, "question": "标志着高技术战争的发展进入成熟阶段的是科索沃战争。 （）", "answer": false, "explain": "错误。标志着高技术战争发展进入成熟阶段的是海湾战争（1991年），它展示了高技术武器的巨大威力，而非科索沃战争。海湾战争综合运用隐身、精确制导、卫星侦察等技术，标志高技术战争成熟。"}, {"chapter": "现代理论", "type": "tf", "id": 636, "question": "海湾战争中的通信系统建设 被称为“军事史上一次最大的通信系统专项工程。（ ）", "answer": true, "explain": "正确。海湾战争中的通信系统建设规模空前，被称为「军事史上一次最大的通信系统专项工程」，通信保障作用凸显。大规模通信保障确保了多国部队的指挥协同，是海湾战争胜利的重要支撑。"}, {"chapter": "现代理论", "type": "tf", "id": 637, "question": "马岛战争中，开创了“爱国者 ” 导弹成功拦截“飞毛腿” 导弹的先例。（）", "answer": false, "explain": "错误。「爱国者」导弹成功拦截「飞毛腿」导弹的先例出现在海湾战争，开创了导弹防御实战的先河，而非马岛战争。“爱国者”拦截“飞毛腿”首次实现导弹打导弹，掀开了反导实战的序幕。"}, {"chapter": "现代理论", "type": "tf", "id": 638, "question": "信息化战争的雏形阶段中，典型的是美军先后发起的科索沃战争、阿富汗战争及伊拉克战争。（ ）", "answer": true, "explain": "正确。信息化战争雏形阶段的典型战例，是美军先后发起的科索沃战争、阿富汗战争和伊拉克战争。这三场战争运用了信息化侦察、精确打击等手段，展示了信息化战争的雏形。"}, {"chapter": "现代理论", "type": "tf", "id": 639, "question": "信息化战争是以信息的获取权、控制权和使用权为核心进行的争夺。（）", "answer": true, "explain": "正确。信息化战争以信息的获取权、控制权和使用权为核心，围绕制信息权展开争夺，制信息权成为夺取胜利的关键。谁掌握了制信息权，谁就占据了战场的主动权和制胜先机。"}, {"chapter": "现代理论", "type": "tf", "id": 640, "question": "现代战争的作战样式可以表现为阵地战、运动战、游击战、闪击战、持久战等各种作战样式。 （ ）", "answer": true, "explain": "正确。现代战争的作战样式可表现为阵地战、运动战、游击战、闪击战、持久战等多种样式，作战形式日趋多样化。作战样式多样化是信息化战争的重要特征，也体现了联合作战的趋势。"}, {"chapter": "现代理论", "type": "tf", "id": 641, "question": "我国第一款自主研制的预警机是空警-2001。 ()", "answer": false, "explain": "错误。我国第一款自主研制的预警机是空警-2000，而非空警-2001，空警-2000实现了我国预警机的零的突破。空警-2000的问世，标志着我国预警机研制跨入世界先进行列。"}, {"chapter": "现代理论", "type": "tf", "id": 642, "question": "空警-2000预警机创造了世界预警机发展史上的9个第一，突破100余项关键技术，累 计获得重大专利近30项，是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。（ ）", "answer": true, "explain": "正确。空警-2000预警机创造了世界预警机发展史上的9个第一，突破100余项关键技术，是世界上看得最远、功能最多、系统集成最复杂的机载信息化武器装备之一。"}, {"chapter": "现代理论", "type": "tf", "id": 643, "question": "战争潜力削弱战是综合运用硬摧毁与软杀伤的手段，削弱对方为战争服务或使用的人力、物力、科学技术和精神等诸多因素构成的潜在的战争力量，破坏对方将战争潜力转为战争实力的转换机制，动摇对方的战争基础，使对方无法继续进行战争， 从而达到迅速战胜对方的目的。（ ）", "answer": true, "explain": "正确。战争潜力削弱战综合运用硬摧毁与软杀伤手段，削弱对方人力、物力、科技、精神等战争潜力，破坏其潜力转化机制，动摇其战争基础，以求迅速取胜。"}, {"chapter": "现代理论", "type": "tf", "id": 644, "question": "战争结构破坏战是以破坏和瘫痪敌战场认识系统、信息处理系统和指挥控制系统为主要作战目标，综合运用以信息技术为核心的武器装备、作战系统和作战手段，剥夺敌战场信息获取权、控制权和使用权，使敌决策者和指挥机关难以下定决心和进行有效的作战指挥。（）", "answer": false, "explain": "错误。题干所描述打击认识、信息处理和指挥控制系统的，是信息控制战，而非战争结构破坏战；战争结构破坏战着眼于破坏敌方作战体系的结构与协同。"}, {"chapter": "现代理论", "type": "tf", "id": 645, "question": "指挥中枢瘫痪战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。（）", "answer": false, "explain": "错误。题干所描述设谋用巧、破坏作战结构的，是战争结构破坏战，而非指挥中枢瘫痪战；指挥中枢瘫痪战直接摧毁敌指挥系统以使其丧失指挥。"}, {"chapter": "现代理论", "type": "tf", "id": 646, "question": "心理系统瓦解战以改变个体和群体心理状态为目标，运用各种形态的信息媒介，从认识、情绪和意志上打击瓦解敌人的一种作战样式。 （ ）", "answer": true, "explain": "正确。心理系统瓦解战以改变个体和群体心理状态为目标，运用各种信息媒介从认识、情绪和意志等多个层面打击瓦解敌人。心理战作为“软杀伤”手段，在现代战争中的地位和作用日益凸显。"}, {"chapter": "现代理论", "type": "tf", "id": 647, "question": "信息时代的信息化战争则是在陆地、海洋、空中、太空、电磁、网络、心理等多维空间内进行的一体化作战。（ ）", "answer": true, "explain": "正确。信息化战争是信息时代在陆地、海洋、空中、太空、电磁、网络、心理等多维空间内进行的一体化作战，战场空间大大拓展。多维一体作战打破了传统陆海空界限，是信息化战争形态的标志。"}, {"chapter": "现代理论", "type": "tf", "id": 648, "question": "在网络化的战场上，发现目标、作出决策、下达命令和实施作战行动等环节不是实时同步进行的。 （ ）", "answer": false, "explain": "错误。在网络化战场上，发现目标、作出决策、下达命令和实施作战行动等环节已能实时同步进行，指挥控制效率大幅提高。实时同步指挥使“发现即摧毁”成为可能，极大提高了作战效率。"}, {"chapter": "现代理论", "type": "tf", "id": 649, "question": "随着计算机、电子通信、卫星技术和信息化武器装备的发展，信息化战争的作战节奏和作战速度将比机械化战争大大提高，持续时间明显缩短，呈现出迅疾短促的特征。 （ ）", "answer": true, "explain": "正确。随着计算机、电子通信、卫星技术和信息化装备发展，信息化战争作战节奏与速度远高于机械化战争，持续时间明显缩短，呈迅疾短促特征。"}, {"chapter": "现代理论", "type": "tf", "id": 650, "question": "信息化战争中，物资、能源的地位更为突出，是主要的战略资源。 （ ）", "answer": false, "explain": "错误。信息化战争中，信息取代物资和能源成为最主要的战略资源，物资和能源在战争中的地位相对下降。信息成为制胜的决定性资源，是信息化战争区别于机械化战争的根本标志。"}, {"chapter": "现代理论", "type": "tf", "id": 651, "question": "在信息化战争以前的战争中，信息资源处于首要的位置，成为最重要的战略资源。（）", "answer": false, "explain": "错误。在信息化战争以前的战争（如机械化战争）中，物资和能源居于首要地位；只有进入信息化战争，信息才成为最重要的战略资源。"}, {"chapter": "现代理论", "type": "tf", "id": 652, "question": "精确战的实施依赖于透明度很高的战场。（ ）", "answer": true, "explain": "正确。精确战的实施，依赖于对战场态势的高透明度掌握和高精度侦察定位，从而实现精确打击和精确毁伤。精确打击以精确侦察定位为前提，二者相辅相成、缺一不可。"}, {"chapter": "现代理论", "type": "tf", "id": 653, "question": "没有高素质的军人，既打不赢机械化战争，更打不赢信息化战争。 （ ）", "answer": true, "explain": "正确。没有高素质的军人，既打不赢机械化战争，更打不赢信息化战争，人才是信息化战争制胜的决定性因素。人才是信息化战争制胜之本，必须下大力气培养高素质军事人才。"}, {"chapter": "现代理论", "type": "tf", "id": 654, "question": "信息技术发展越快，信息化战争的经济科技依赖性越弱。（ ）", "answer": false, "explain": "错误。信息技术越发展，信息化战争对经济和科学技术的依赖性就越强，而非越弱，二者呈现正比关系。信息化战争的门槛更高、依赖性更强，对综合国力提出了更高要求。"}, {"chapter": "现代理论", "type": "tf", "id": 655, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第五代战争”。 ( )", "answer": false, "explain": "错误。斯里普琴科从武器装备发展的角度将信息化战争称为「第六代战争」，而非第五代战争，命题答错了代际划分。题目混淆了斯里普琴科提出的代际划分，务必记牢。"}, {"chapter": "现代理论", "type": "tf", "id": 656, "question": "中国著名的军事理论家孙子，早在两千多年前就提出“不战而屈人之兵”，这也是信息战的核心和宗旨。（ ）", "answer": true, "explain": "正确。中国军事家孙子早在两千多年前提出「不战而屈人之兵」，这正体现了信息战追求的不战而胜的核心和宗旨。孙子“不战而屈人之兵”被奉为信息战的最高境界和目标追求。"}, {"chapter": "现代理论", "type": "tf", "id": 657, "question": "首次利用空中卫星进行战场侦察的战争是第四次中东战争。（ ）", "answer": true, "explain": "正确。首次利用空中卫星进行战场侦察的战争是第四次中东战争（1973年），卫星侦察自此开始应用于实战。第四次中东战争首次将卫星侦察用于实战，开创了太空侦察的先例。"}, {"chapter": "现代理论", "type": "tf", "id": 658, "question": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器，共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。（ ）", "answer": false, "explain": "错误。大规模集中使用制导武器、投入17种战术导弹及制导鱼雷炸弹的，是第四次中东战争，命题的错误在于张冠李戴。17种制导武器的规模使用发生在第四次中东战争，题目误作马岛战争。"}, {"chapter": "现代理论", "type": "tf", "id": 659, "question": "标志着高技术战争的发展进入成熟阶段的是海湾战争。 （ ）", "answer": true, "explain": "正确。1991年的海湾战争，标志着高技术战争发展进入成熟阶段，是战争史上具有里程碑意义的战例。海湾战争的胜利深刻改变了人们对现代战争的认识，具有里程碑意义。"}, {"chapter": "现代理论", "type": "tf", "id": 660, "question": "科索沃战争中的通信系统建设被称为“军事史上一次最大的通信系统专项工程”。()", "answer": false, "explain": "错误。被称为「军事史上一次最大的通信系统专项工程」的通信系统建设是海湾战争，而非科索沃战争，题目张冠李戴。海湾战争才是这项庞大通信系统专项工程，注意区分两场战争。"}, {"chapter": "现代理论", "type": "tf", "id": 661, "question": "越南战争中，开创了“爱国者”导弹成功拦截“飞毛腿”导弹的先例。( )", "answer": false, "explain": "错误。「爱国者」导弹成功拦截「飞毛腿」导弹的先例出现在海湾战争，而非越南战争，越南战争时期尚无此类防空反导系统。「爱国者」对「飞毛腿」的拦截是海湾战争的标志性事件，务必记清发生地点。"}, {"chapter": "现代理论", "type": "tf", "id": 662, "question": "信息化是指事物发出的消息、指令、数据、符号等所包含的内容，是客观事物状态和运动特征的一种普遍形式。 （ ）", "answer": false, "explain": "错误。题干所述消息、指令、数据、符号所含内容是事物状态和运动特征的普遍形式，这是「信息」的定义，而非「信息化」的定义。准确区分“信息”与“信息化”两个概念，是学习本章的基础。"}, {"chapter": "现代理论", "type": "tf", "id": 663, "question": "信息是指培养、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。 （ ）", "answer": false, "explain": "错误。题干所述培养以计算机为主的智能化工具为代表的新生产力的历史过程，是「信息化」的定义，而非「信息」的定义。“信息化”是过程，“信息”是内容，二者内涵迥异，切勿混淆。"}, {"chapter": "现代理论", "type": "tf", "id": 664, "question": "最早提出信息战概念的人是中国人沈伟光。（ ）", "answer": true, "explain": "正确。最早系统提出信息战概念的中国军事理论家是沈伟光，他率先倡导并系统论述了信息战理论。沈伟光提出的信息战理论，在军事学术界产生了广泛而深远的影响。"}, {"chapter": "现代理论", "type": "tf", "id": 665, "question": "信息主要由信源、语言、载体、信道、信宿和媒介构成。（ ）", "answer": true, "explain": "正确。信息主要由信源、语言、载体、信道、信宿和媒介等要素构成，这些要素共同完成信息的传递过程。信源、信道、信宿等要素构成完整的信息流，是实现信息传递的基础。"}, {"chapter": "现代理论", "type": "tf", "id": 666, "question": "美国社会预测学家托夫勒从人类社会文明演进的角度，将信息化战争称之为“第三次浪潮战争”。 ( )", "answer": true, "explain": "正确。托夫勒从人类文明演进的角度，将信息化战争称之为「第三次浪潮战争」，对应的是信息社会的浪潮。信息社会浪潮带来战争形态的深刻变革，托夫勒的观点颇具前瞻性。"}, {"chapter": "现代理论", "type": "tf", "id": 667, "question": "俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为“第六代战争”。 ( )", "answer": true, "explain": "正确。斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为「第六代战争」，这是其关于战争代际划分的著名观点。斯里普琴科关于第六代战争的论断常被考查，应准确记忆。"}, {"chapter": "现代理论", "type": "tf", "id": 668, "question": "战争结构破坏战是着眼战争全局，通过设谋用巧、避实就虚，打击敌方作战协调行动的关节，造成敌方作战力量结构的紊乱和作战行动程序结构的脱节，致使敌方整体作战能力迅速降低，进而集中力量各个击破，达到瓦解、歼灭敌军的目的。 （ ）", "answer": true, "explain": "正确。战争结构破坏战着眼全局，通过避实就虚打击敌方作战协调关节，造成其作战力量结构紊乱与行动程序脱节，进而各个击破、瓦解歼灭敌军。"}, {"chapter": "现代理论", "type": "tf", "id": 669, "question": "首次利用空中卫星进行战场侦察的战争是越南战争。（ ）", "answer": false, "explain": "错误。首次利用空中卫星进行战场侦察的战争是第四次中东战争（1973年），而非越南战争。越南战争未使用卫星侦察，卫星侦察首次用于第四次中东战争，需牢记区分。"}, {"chapter": "信息化武装", "type": "tf", "id": 670, "question": "当战争进入信息化时代后,信息化武器系统也必然成为战争新的主流器。(   )", "answer": true, "explain": "正确。战争进入信息化时代后，信息化武器系统必然取代机械化装备，成为战争新的主流武器，这是战争形态演变的客观趋势。信息化武器系统成为主流武器，是战争形态发展的客观规律，应理解把握。"}, {"chapter": "信息化武装", "type": "tf", "id": 671, "question": "以信息技术为代表的科学技术的发展是信息化战争形成的物质技术基础。(   )", "answer": true, "explain": "正确。以信息技术为代表的科学技术发展，是信息化战争形成的物质技术基础，为其提供了技术和物质支撑。没有信息技术的高度发展，就没有信息化战争的物质技术基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 672, "question": "武器装备的高技术化实质上就是信息化。(   )", "answer": true, "explain": "正确。武器装备的高技术化，其实质和核心内容就是信息化，信息化是高技术化发展的必然趋势和主要体现。高技术化与信息化实质一体，这一判断常作考点，应准确掌握。"}, {"chapter": "信息化武装", "type": "tf", "id": 673, "question": "战争除了在物质领域进行摧残与反摧残外,还在信息领域进行激励对抗。(   )", "answer": true, "explain": "正确。战争除了在物质领域进行摧残与反摧残，还在信息领域进行激烈的对抗，信息对抗日益成为现代战争的重要方面。信息领域的攻防对抗，已成为现代战争形态的重要组成部分。"}, {"chapter": "信息化武装", "type": "tf", "id": 674, "question": "所谓信息化武器系统,是指在信息构成上大量应用先进的电子技术的武器系统。(   )", "answer": false, "explain": "错误。信息化武器系统是广泛采用信息技术（而非仅先进电子技术）的武器系统，其核心是信息技术的一体化集成。信息技术在武器系统中的深度集成和一体化，是其本质特征所在。"}, {"chapter": "信息化武装", "type": "tf", "id": 675, "question": "信息化战争中军队建设从强调数量向注重质量转变。(   )", "answer": true, "explain": "正确。信息化战争中，军队建设从片面强调数量规模向注重质量效能转变，注重走质量效能型的精兵之路。引导军队由数量规模型向质量效能型转变，是强军兴军的必然选择。"}, {"chapter": "信息化武装", "type": "tf", "id": 676, "question": "信息化战争在战争目的的控制上目标为“不必打死它,只要打服它”。(    )", "answer": true, "explain": "正确。信息化战争在战争目的的控制上，目标是「不必打死它，只要打服它」，追求威慑与屈人之兵而非简单消灭。信息化战争的目的在于震慑和瘫痪，而非大量杀伤，体现了人道化倾向。"}, {"chapter": "信息化武装", "type": "tf", "id": 677, "question": "信息化战争在作战范围的控制上,是根据自己的作战能力来确定交战范围。(    )", "answer": false, "explain": "错误。信息化战争在作战范围的控制上，是根据战争目的和政治需要来确定交战范围，而非仅依自身作战能力来确定。交战范围的确定服从政治需要，是战争受政治支配的必然要求。"}, {"chapter": "信息化武装", "type": "tf", "id": 678, "question": "信息化战争在投入兵力控制上,强调人多势众,注重合理运用。(    )", "answer": false, "explain": "错误。信息化战争在投入兵力的控制上，强调精兵制胜、注重质量和合理运用，而非人多势众，人海战术已不适应信息化作战。信息化战争投入兵力讲精兵制胜，人多势众是机械化时代的观念，注意纠正。"}, {"chapter": "信息化武装", "type": "tf", "id": 679, "question": "信息化战争在由区域战场向全球战场延伸。(    )", "answer": true, "explain": "正确。信息化战争使战场由区域战场向全球战场延伸，凭借远距离精确打击和信息能力，战场空间空前扩大。战场向全球延伸，是信息化战争远距离打击能力的直接体现。"}, {"chapter": "信息化武装", "type": "tf", "id": 680, "question": "信息化战争在由空中战场向太空战场延伸。(    )", "answer": true, "explain": "正确。信息化战争使战场由空中战场进一步向太空战场延伸，争夺制天权和制信息权日益成为重要内容。战场向太空延伸，凸显了制天权在信息化战争中的重要地位。"}, {"chapter": "信息化武装", "type": "tf", "id": 681, "question": "信息化战争在由有形战场向无形战场延伸。(    )", "answer": true, "explain": "正确。信息化战争使战场由有形战场向电磁、网络、心理等无形战场延伸，无形空间的较量日益突出。无形战场涵盖电磁、网络、心理等空间，是信息化战争区别于机械化战争的显著特征。"}, {"chapter": "信息化武装", "type": "tf", "id": 682, "question": "军事对抗只有在信息化战争中是一种系统对抗。(    )", "answer": false, "explain": "错误。军事对抗自古以来就是系统的对抗，并非只有信息化战争才具有系统对抗的性质，只是信息化战争使系统性更加突出。军事对抗的系统性是古今战争共性，信息化战争只是把系统性推向新高度。"}, {"chapter": "信息化武装", "type": "tf", "id": 683, "question": "信息化战争中整个作战体系的作战效能是各个作战体系效能的相加。(    )", "answer": false, "explain": "错误。信息化战争中，整个作战体系的效能是各要素通过系统集成产生的涌现效能，并非各分系统效能的简单相加。体系效能的涌现性说明信息化战争更强调整体合成而非单件相加。"}, {"chapter": "信息化武装", "type": "tf", "id": 684, "question": "“非致命战”、“计算机病毒战”属于全新作战方式。(    )", "answer": true, "explain": "正确。「非致命战」和「计算机病毒战」是信息化时代出现的全新作战方式，极大地拓展了作战手段。非致命战和病毒战等新样式，大大丰富了信息化战争的作战手段。"}, {"chapter": "信息化武装", "type": "tf", "id": 685, "question": "军队指挥自动化系统的产生是计算机走上战场的标志。(    )", "answer": true, "explain": "正确。军队指挥自动化系统的产生，标志着计算机正式走上战场并得到广泛运用，是军事信息化的重要起点。指挥自动化系统的出现，是计算机技术进入军事领域的标志性事件。"}, {"chapter": "信息化武装", "type": "tf", "id": 686, "question": "信息化战争作为21世纪中的主要战争形态,不会改变战争的本质。(    )", "answer": true, "explain": "正确。信息化战争作为21世纪的主要战争形态，改变的只是战争方式和手段，并不改变战争的政治本质。虽形态演变、手段更新，但战争是政治继续的本质始终未变。"}, {"chapter": "信息化武装", "type": "tf", "id": 687, "question": "信息化战争是核威慑下的高技术常规战争,意味着信息化战争就是核战争。(    )", "answer": false, "explain": "错误。信息化战争是在核威慑条件下的高技术常规战争，但它本身是高技术常规战争，并非等于打核战争。核威慑条件下的常规战争，仍是信息化战争的基本定位，勿与核战混淆。"}, {"chapter": "信息化武装", "type": "tf", "id": 688, "question": "机械化战争的作战指挥控制是扁平状的网络结构,这就使得指挥控制层次多,指挥效能\n和决策速度慢。(    )", "answer": false, "explain": "错误。机械化战争的指挥控制是树状的多层次结构，指挥层次多、效能与决策速度慢；扁平化网络结构是信息化战争的特征。机械化战争指挥层级多、反应慢，信息化战争则追求扁平高效。"}, {"chapter": "信息化武装", "type": "tf", "id": 689, "question": "科索沃战争是世界战争史上的第一次“信息战争”。(    )", "answer": false, "explain": "错误。世界战争史上第一次被称为「信息战争」的战例是海湾战争，而非科索沃战争，海湾战争首次大规模运用信息技术。海湾战争首次大规模运用信息技术，因此被公认为第一场信息战争。"}, {"chapter": "信息化武装", "type": "tf", "id": 690, "question": "海湾战争中美军所确立的作战理论引起了战争形态的显著变化。(    )", "answer": true, "explain": "正确。海湾战争中，美军所确立和运用的作战理论与信息化手段，引起了战争形态的显著变化，展示了高技术战争的威力。海湾战争中美军作战理论的创新，直接推动了战争形态向信息化转变。"}, {"chapter": "信息化武装", "type": "tf", "id": 691, "question": "地面部队数字化将改变传统力量的结构模式,引起作战方式的根本性变革。(    )", "answer": true, "explain": "正确。地面部队数字化将改变传统力量的结构模式，引起作战方式的根本性变革，使地面力量实现信息联通与一体化。地面部队数字化，实现了陆战力量的信息互通与一体协同。"}, {"chapter": "信息化武装", "type": "tf", "id": 692, "question": "伊拉克战争是美国进行的一场信息化战争。(    )", "answer": false, "explain": "错误。伊拉克战争本身就是美国进行的一场信息化战争，命题的判断与客观事实相反。伊拉克战争大量运用信息化手段，本身就是一场信息化战争，题目判断有误。"}, {"chapter": "信息化武装", "type": "tf", "id": 693, "question": "在信息技术不断融入战争力量的过程中,几种传统战争力量间是平衡的,只是地面部队相对慢些。(    )", "answer": false, "explain": "错误。在信息技术不断融入战争力量的过程中，传统战争力量间的发展并不平衡，各军兵种信息化进展各异。各军兵种信息化发展不平衡，是军队转型过程中面临的现实问题。"}, {"chapter": "信息化武装", "type": "tf", "id": 694, "question": "上下级平等机制不属于完善国防动员体制中的机制。(    )", "answer": true, "explain": "正确。上下级平等机制不属于完善国防动员体制的范畴，国防动员体制强调的是动员准备、实施和复员等环节，不存在这种机制。国防动员体制围绕动员流程展开，上下级平等机制与之无关。"}, {"chapter": "信息化武装", "type": "tf", "id": 695, "question": "常备军和后备力量是构成国防的两大基本要素。(    )", "answer": true, "explain": "正确。常备军和后备力量是构成国防的两大基本要素，二者共同构成完整的国防力量体系，缺一不可。常备军与后备力量共同构成国防两大基本要素，缺一不可。"}, {"chapter": "信息化武装", "type": "tf", "id": 696, "question": "强大的国防是由常备军、后备力量、国防科技、国防工业、军事理论、战略战术思想等多种因素构成的。其中,常备军是基础,后备力量是骨干。(    )", "answer": false, "explain": "错误。在构成强大国防的诸因素中，常备军是骨干，后备力量是基础，命题把二者的地位颠倒了。常备军为骨干、后备力量为基础，这是国防力量建设的基本定位。"}, {"chapter": "信息化武装", "type": "tf", "id": 697, "question": "强大的国防后备力量是我国武装力量的主要组成部分,是现代国防的重要基础。(    )", "answer": true, "explain": "正确。强大的国防后备力量是我国武装力量的主要组成部分，是现代国防的重要基础，是国防潜力的重要体现。强大国防后备力量是国防潜力的重要体现，支撑着威慑与动员能力。"}, {"chapter": "信息化武装", "type": "tf", "id": 698, "question": "机械化战争是数量决定效能。(    )", "answer": true, "explain": "正确。机械化战争以数量规模和火力规模决定作战效能，是典型的数量决定效能，靠人海和火海取胜。机械化战争依靠数量和火力规模取胜，是数量决定效能的典型形态。"}, {"chapter": "信息化武装", "type": "tf", "id": 699, "question": "从纯军事角度看,阿富汗战争实质上就是一场高技术条件下的信息战。(    )", "answer": true, "explain": "正确。从纯军事角度看，阿富汗战争实质上就是一场高技术条件下的信息战，体现了信息化作战的特点。阿富汗战争展现了远程精确打击和信息化侦察的作战效能。"}, {"chapter": "信息化武装", "type": "tf", "id": 700, "question": "科索沃战争是一场典型的信息时代的信息化战争与工业时代的机械化战争之间的非对称性较量。(    )", "answer": true, "explain": "正确。科索沃战争是一场信息时代的信息化战争与工业时代的机械化战争之间的非对称性较量，展现了战争形态的代差。科索沃战争凸显了信息化战争对机械化战争的非对称优势。"}, {"chapter": "信息化武装", "type": "tf", "id": 701, "question": "阿富汗战争告诉我们,建立在卫星监控技术之上的远程导弹精确打击和准确拦截技术,已成为未来战争成败的关键。(    )", "answer": true, "explain": "正确。阿富汗战争表明，建立在卫星监控技术之上的远程导弹精确打击与准确拦截技术，已成为未来战争成败的关键。远程精确打击与拦截技术，成为衡量信息化战争能力的重要标尺。"}, {"chapter": "信息化武装", "type": "tf", "id": 702, "question": "信息化战争是时代的产物,是世界政治、经济、科技、军事、文化等多种因素综合作用的结果,但它当前仍处于初始阶段。(    )", "answer": true, "explain": "正确。信息化战争是时代的产物，是世界政治、经济、科技、军事、文化等多种因素综合作用的结果，但目前仍处于初始阶段。信息化战争尚在演进之中，其规律和形态仍在不断发展完善。"}, {"chapter": "信息化武装", "type": "tf", "id": 703, "question": "列宁说过,“战例是人类战争史上极其辉煌与悲壮的记载,但是对于未来战争的指挥艺术而言,像是一幅日渐褪色的油画”。(    )", "answer": false, "explain": "错误。关于「战例像日渐褪色的油画」这一论述并非列宁所说，列宁没有这样的表述，命题属于张冠李戴。类似表述常被误植于名人名下，答题时应注意甄别其真实出处。"}, {"chapter": "信息化武装", "type": "tf", "id": 704, "question": "美军对过去的战略和三军的作战理论进行了全面的审查,于1992年正式提出了以对付局部战争威胁为主要目标的“地区防务战”战略。(    )", "answer": true, "explain": "正确。美军对过去战略和三军作战理论全面审查后，于1992年正式提出以对付局部战争威胁为主要目标的「地区防务战」战略。地区防务战战略标志着美军由冷战型转向局部战争型的战略调整。"}, {"chapter": "信息化武装", "type": "tf", "id": 705, "question": "在世界战争史上,海湾战争是第一次被人们称作“信息战争”的战例。(    )", "answer": true, "explain": "正确。在世界战争史上，海湾战争是第一次被人们称为「信息战争」的战例，标志着战争形态向信息化转变。海湾战争作为首场信息战争，具有标志性的历史意义。"}, {"chapter": "信息化武装", "type": "tf", "id": 706, "question": "夺取战场主动权的关键是制信息权。(    )", "answer": true, "explain": "正确。在信息化战争中，夺取战场主动权的关键在于夺取制信息权，制信息权是制胜的先决条件。制信息权是信息化战争制胜的先决条件，必须牢牢掌握。"}, {"chapter": "信息化武装", "type": "tf", "id": 707, "question": "机械化战争是信息决定效能。(    )", "answer": false, "explain": "错误。机械化战争是数量决定效能，信息化战争才是信息决定效能，二者的效能决定因素各不相同。数量与信息的不同决定作用，是区分机械化与信息化战争的关键。"}, {"chapter": "信息化武装", "type": "tf", "id": 708, "question": "不断更新的信息技术是信息化战争形成的先导。(    )", "answer": false, "explain": "错误。信息化战争形成的先导是政治、经济、军事等多种因素的综合作用，不断更新的信息技术只是物质基础和必要条件，而非唯一先导。"}, {"chapter": "信息化武装", "type": "tf", "id": 709, "question": "海湾战争发生在1990年1月。(    )", "answer": false, "explain": "错误。海湾战争爆发于1991年1月，而非1990年1月，1990年只是伊拉克入侵科威特的时间。海湾战争爆发时间被记为1991年1月，与伊拉克入侵科威特的时间应区别。"}, {"chapter": "信息化武装", "type": "tf", "id": 710, "question": "国防力量建设中,常备军是基础。(    )", "answer": false, "explain": "错误。在国防力量建设中，常备军是骨干，后备力量是基础，命题未准确区分二者的地位和关系。常备军与后备力量的地位是常见考点，务必区分为骨干与基础。"}, {"chapter": "信息化武装", "type": "tf", "id": 711, "question": "战争走过了冷兵器时代、火器时代、机械化战争时代,现在正逐步向信息化战争时代过渡。(    )", "answer": true, "explain": "正确。人类战争形态已走过了冷兵器时代、火器时代和机械化战争时代，目前正逐步向信息化战争时代过渡。战争形态的演进脉络深刻反映了科学技术对军事领域的巨大推动。"}, {"chapter": "信息化武装", "type": "tf", "id": 712, "question": "信息化战争是政治、经济、科技等因素作用的结果。(    )", "answer": true, "explain": "正确。信息化战争是政治、经济、科技等多种因素综合作用的结果，是多种因素交织催生的历史现象。信息化战争是政治、经济、科技等因素交织作用的产物。"}, {"chapter": "信息化武装", "type": "tf", "id": 713, "question": "未来战争形式中也包括了电磁战。(    )", "answer": true, "explain": "正确。未来战争形式中包含电磁战，电磁对抗日益成为重要作战方式，制电磁权的重要性不断上升。电磁战是未来重要作战方式，制电磁权日益成为制胜要素。"}, {"chapter": "信息化武装", "type": "tf", "id": 714, "question": "“海湾战争”是冷战结束以后参战国最多的一场局部战争。(    )", "answer": true, "explain": "正确。「海湾战争」是冷战结束以后参战国最多的一场局部战争，多国部队参战规模空前。海湾战争参战国众多，是冷战后规模最大的局部战争之一。"}, {"chapter": "信息化武装", "type": "tf", "id": 715, "question": "20世纪90年代初,东欧剧变,两德统一,美苏两极格局迅速解体。(    )", "answer": true, "explain": "正确。20世纪90年代初，东欧剧变、两德统一，美苏两极格局迅速解体，世界格局进入多极化加速期。两极格局瓦解标志世界进入多极化加速发展的新时期。"}, {"chapter": "信息化武装", "type": "tf", "id": 716, "question": "火力战的显著特点中不包括高速度。(    )", "answer": false, "explain": "错误。高速度是火力战的显著特点之一，命题说「不包括」高速度是错误的，火力战同样强调快速机动与火力突击。高速度正是火力战显著特点之一，题目否定它是错误的。"}, {"chapter": "信息化武装", "type": "tf", "id": 717, "question": "游击战、运动战、阵地战被称为“老三战”的作战形式。(    )", "answer": true, "explain": "正确。游击战、运动战、阵地战被称为「老三战」的作战形式，是革命战争年代我军最主要的三种作战样式。「老三战」即游击战、运动战、阵地战，是我军传统作战形式。"}, {"chapter": "信息化武装", "type": "tf", "id": 718, "question": "政治是引发战争最根本的诱因。(    )", "answer": true, "explain": "正确。政治是引发战争最根本的诱因，战争是政治的继续，这是马克思主义战争观的基本原理。战争是政治的继续，政治是战争最根本的诱因，这是战争观基本原理。"}, {"chapter": "信息化武装", "type": "tf", "id": 719, "question": "信息化战争形成的“催产剂”是不断发展的科学技术。(    )", "answer": false, "explain": "错误。信息化战争形成的「催产剂」是政治、经济等多种因素综合作用的结果，不断发展的科学技术只是重要的物质前提和条件之一，但不能简单归结为唯一催产剂。"}];

var SITE_CONFIG = {"storagePrefix": "military_quiz_v2", "siteName": "军事理论"};

var mode = null, subMode = null, currentQuestions = [], currentIndex = 0;
var userAnswers = {}, showFeedback = {}, practiceDone = {};
var sessionKey = 'history_quiz_session';
var sessionDoneKey = 'history_quiz_done';

if (typeof SITE_CONFIG === 'object' && SITE_CONFIG.storagePrefix) {
  sessionKey = SITE_CONFIG.storagePrefix + '_session';
  sessionDoneKey = SITE_CONFIG.storagePrefix + '_done';
}

function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function persistSession() {
  try {
    if (mode && currentQuestions.length > 0) {
      localStorage.setItem(sessionKey, JSON.stringify({
        mode: mode, subMode: subMode,
        questions: currentQuestions,
        index: currentIndex,
        answers: userAnswers,
        feedback: showFeedback
      }));
    } else {
      localStorage.removeItem(sessionKey);
    }
  } catch(e) {}
}

function resumeSession() {
  try {
    var raw = localStorage.getItem(sessionKey);
    if (!raw) return false;
    var s = JSON.parse(raw);
    if (!s || !s.questions || !s.questions.length) return false;
    mode = s.mode || null; subMode = s.subMode || null;
    currentQuestions = s.questions; currentIndex = s.index || 0;
    userAnswers = s.answers || {}; showFeedback = s.feedback || {};
    if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
    return true;
  } catch(e) { return false; }
}

function getGlobalIdx(q) {
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    if (ALL_QUESTIONS[i].chapter === q.chapter && ALL_QUESTIONS[i].type === q.type && ALL_QUESTIONS[i].id === q.id) return i;
  }
  return -1;
}

function loadPracticeDone() {
