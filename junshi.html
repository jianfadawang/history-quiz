pter": "信息化武装", "type": "single", "id": 189, "question": "在信息化战争中夺取战场主动权的关键是（   ）。", "options": [{"label": "A", "text": "制陆权"}, {"label": "B", "text": "制空权"}, {"label": "C", "text": "制天权"}, {"label": "D", "text": "制信息权"}], "answer": "D", "explain": "信息化战争中夺取制信息权是掌握战场主动权的关键。A项制陆权、B项制空权、C项制天权都是传统或局部领域的控制权，无法替代信息的主导地位。"}, {"chapter": "信息化武装", "type": "single", "id": 190, "question": "信息化战争的作战指挥控制结构为（   ）状的网络结构。", "options": [{"label": "A", "text": "扁平"}, {"label": "B", "text": "椭圆"}, {"label": "C", "text": "矩形"}, {"label": "D", "text": "菱形"}], "answer": "A", "explain": "信息化战争的作战指挥控制结构呈扁平的网状结构，减少中间层次以提高指挥效率。B项椭圆、C项矩形、D项菱形都不是信息网络化指挥结构的典型形态。"}, {"chapter": "信息化武装", "type": "single", "id": 191, "question": "信息技术革命改变了战争所依赖的（   ）基础,促使武器装备发生质的变化。", "options": [{"label": "A", "text": "物质"}, {"label": "B", "text": "信息"}, {"label": "C", "text": "技术"}, {"label": "D", "text": "保障"}], "answer": "A", "explain": "信息技术革命改变了战争所依赖的物质基础，促使武器装备发生质的变化。B项信息本身是内容而非基础，C项技术范围过宽不够具体，D项保障只是后勤环节。"}, {"chapter": "信息化武装", "type": "single", "id": 192, "question": "不断更新的（   ）是信息化战争形成的先导。", "options": [{"label": "A", "text": "作战理论"}, {"label": "B", "text": "武器装备"}, {"label": "C", "text": "人员质量"}, {"label": "D", "text": "信息技术"}], "answer": "A", "explain": "不断更新的作战理论是信息化战争形成的先导。B项武器装备是物质基础而非先导，C项人员质量是主体条件，D项信息技术是支撑手段而非先导。"}, {"chapter": "信息化武装", "type": "single", "id": 193, "question": "第三次中东战争中, （   ）以电子——火力交战方式显示军事优势。", "options": [{"label": "A", "text": "以色列"}, {"label": "B", "text": "伊拉克"}, {"label": "C", "text": "巴勒斯坦"}, {"label": "D", "text": "伊朗"}], "answer": "A", "explain": "第三次中东战争中以色列以电子—火力交战方式显示了军事优势。B项伊拉克、C项巴勒斯坦、D项伊朗都不是该次战争中展示这种电子火力优势的一方。"}, {"chapter": "信息化武装", "type": "single", "id": 194, "question": "全面信息化战争的雏形是（   ）战争。", "options": [{"label": "A", "text": "阿富汗"}, {"label": "B", "text": "伊拉克"}, {"label": "C", "text": "海湾"}, {"label": "D", "text": "科索沃"}], "answer": "C", "explain": "海湾战争是全面信息化战争的雏形。A项阿富汗战争、B项伊拉克战争、D项科索沃战争都发生在海湾战争之后，属于信息化战争的发展与成熟阶段而非雏形。"}, {"chapter": "信息化武装", "type": "single", "id": 195, "question": "对于信息化战争在打击目标的控制上,下列不属于主要打击目标是（   ）。", "options": [{"label": "A", "text": "储备物资"}, {"label": "B", "text": "重要军事设施"}, {"label": "C", "text": "重兵集团"}, {"label": "D", "text": "指挥控制枢纽"}], "answer": "A", "explain": "储备物资不是信息化战争的主要打击目标，重点是打击指挥控制枢纽、重兵集团和重要军事设施。B项重要军事设施、C项重兵集团、D项指挥控制枢纽均属重点打击目标。"}, {"chapter": "信息化武装", "type": "single", "id": 196, "question": "在信息化战争中,对战争的控制除政治因素外,关键在于（   ）的高技术化。", "options": [{"label": "A", "text": "人员配备"}, {"label": "B", "text": "武器装备"}, {"label": "C", "text": "作战理论"}, {"label": "D", "text": "军事技术"}], "answer": "B", "explain": "除政治因素外，武器装备的高技术化是控制战争的关键。A项人员配备不构成核心控制手段，C项作战理论是指导而非直接控制，D项军事技术范围过宽、不如武器装备具体。"}, {"chapter": "信息化武装", "type": "single", "id": 197, "question": "高技术武器能够通过对A重要目标的打击,直接达成战略目的。", "options": [{"label": "A", "text": "纵深"}, {"label": "B", "text": "横向"}, {"label": "C", "text": "扁平"}, {"label": "D", "text": "阵地前沿"}], "answer": "A", "explain": "高技术武器能够通过对纵深重要目标的打击直接达成战略目的。B项横向、C项扁平都不是描述空间打击重点的准确用语，D项阵地前沿属战术层面而非战略纵深。"}, {"chapter": "信息化武装", "type": "single", "id": 198, "question": "下列哪个不是“海湾战争”体现出来的主要特点（   ）。", "options": [{"label": "A", "text": "机械化武器大大提高了作战能力。"}, {"label": "B", "text": "战场向大纵深、高度立体化方向发展"}, {"label": "C", "text": "空中力量发挥了决定性作用"}, {"label": "D", "text": "电子战成为战争的核心,对战争进程和结果产生重要影响"}], "answer": "A", "explain": "海湾战争体现的是信息化作战特征，而非机械化武器提高作战能力。B项战场大纵深立体化、C项空中力量决定性作用、D项电子战成为核心都是海湾战争的主要特点。"}, {"chapter": "信息化武装", "type": "single", "id": 199, "question": "下列叙述正确的（   ）。", "options": [{"label": "A", "text": "信息化战争是一个关于战争形态发展的现实概念"}, {"label": "B", "text": "信息化战争是一个关于战争形态发展的虚拟概念"}, {"label": "C", "text": "两次世界大战之后,世界局部范围的武装冲突很少有发生"}, {"label": "D", "text": "两次世界大战之后,全局范围的武装冲突从未间断"}], "answer": "A", "explain": "信息化战争是关于战争形态发展的现实概念。B项把它说成虚拟概念是错误的，C项二战后局部武装冲突其实频发不断，D项把局部冲突说成全局武装冲突不符事实。"}, {"chapter": "信息化武装", "type": "single", "id": 200, "question": "美国在1986年4月5日对利比亚采取（   ）式的空袭作战方式,使美军在极短时间达到作战目的。", "options": [{"label": "A", "text": "瘫痪"}, {"label": "B", "text": "点"}, {"label": "C", "text": "软杀伤"}, {"label": "D", "text": "外科手术"}], "answer": "D", "explain": "美国1986年4月空袭利比亚采取的是外科手术式作战方式，精准打击快速达成作战目的。A项瘫痪、B项点、C项软杀伤都不是对这种精准快速空袭的准确概括。"}, {"chapter": "信息化武装", "type": "single", "id": 201, "question": "使用导弹、航空兵、舰艇、炮兵、激光、粒子束等多种火力,摧毁敌方指挥中心、通信枢纽、交通要道、机场、港口、导弹基地、后方仓库等重要军事目标以及打击敌方重兵集团等的作战形式是（   ）。", "options": [{"label": "A", "text": "软杀战"}, {"label": "B", "text": "自然战"}, {"label": "C", "text": "太空战"}, {"label": "D", "text": "火力战"}], "answer": "D", "explain": "使用多种火力摧毁敌方指挥中心等重要目标的作战形式是火力战。A项软杀战针对电子信息系统，B项自然战利用自然条件，C项太空战在太空空间进行。"}, {"chapter": "信息化武装", "type": "single", "id": 202, "question": "一场以（   ）为核心的新军事变革引起了军事领域的深刻变革。", "options": [{"label": "A", "text": "信息技术"}, {"label": "B", "text": "电子技术"}, {"label": "C", "text": "电磁技术"}, {"label": "D", "text": "人员素质"}], "answer": "A", "explain": "以信息技术为核心的新军事变革引起军事领域的深刻变革。B项电子技术、C项电磁技术只是信息技术的部分内容，D项人员素质是主体条件而非变革的核心技术。"}, {"chapter": "信息化武装", "type": "single", "id": 203, "question": "（   ）机制是把民用科技支前潜力迅速转化为战场上现实战斗力的运行方式。", "options": [{"label": "A", "text": "军地协调"}, {"label": "B", "text": "平战转换"}, {"label": "C", "text": "激励补偿"}, {"label": "D", "text": "监督约束"}], "answer": "B", "explain": "平战转换机制是把民用科技支前潜力迅速转化为战场现实战斗力的运行方式。A项军地协调是组织协调方式，C项激励补偿是政策手段，D项监督约束是管理机制。"}, {"chapter": "信息化武装", "type": "single", "id": 204, "question": "科索沃战争的以大规模的（   ）为最主要的作战方式。", "options": [{"label": "A", "text": "地面攻击"}, {"label": "B", "text": "空袭"}, {"label": "C", "text": "坦克战"}, {"label": "D", "text": "导弹攻击"}], "answer": "B", "explain": "科索沃战争以大规模空袭为最主要的作战方式。A项地面攻击不是其主要方式，C项坦克战鲜少出现，D项导弹攻击只是空袭手段的一部分而非整体方式。"}, {"chapter": "信息化武装", "type": "single", "id": 205, "question": "美军在伊拉克战争中的奇招是把第一个（   ）师投入战场。", "options": [{"label": "A", "text": "数字化"}, {"label": "B", "text": "信息化"}, {"label": "C", "text": "小型化"}, {"label": "D", "text": "机械化"}], "answer": "A", "explain": "美军在伊拉克战争的奇招是把第一个数字化师投入战场。B项信息化不如数字化准确指代具体的师级编制，C项小型化、D项机械化都不是该师的准确属性。"}, {"chapter": "信息化武装", "type": "single", "id": 206, "question": "数字化的轻型武装侦察直升机广泛采用高技术航空（   ）设备", "options": [{"label": "A", "text": "电子"}, {"label": "B", "text": "信息化"}, {"label": "C", "text": "电磁"}, {"label": "D", "text": "遥感"}], "answer": "A", "explain": "数字化轻型武装侦察直升机广泛采用高技术航空电子设备。B项信息化、C项电磁、D项遥感都不如“航空电子”准确地对应直升机的航电系统设备。"}, {"chapter": "信息化武装", "type": "single", "id": 207, "question": "下列哪项不是战争可控性强的表现（   ）。", "options": [{"label": "A", "text": "能有效控制作战人员"}, {"label": "B", "text": "能有效控制打击的目标"}, {"label": "C", "text": "能有效控制战争的规模"}, {"label": "D", "text": "能有效控制战争的进程"}], "answer": "A", "explain": "能有效控制作战人员不是战争可控性强的表现，可控性主要体现在控制打击目标、战争规模和进程。B项控制打击目标、C项控制规模、D项控制进程才是可控性的表现。"}, {"chapter": "信息化武装", "type": "single", "id": 208, "question": "下列（   ）战争是在核威慑下的20世纪最经典的高技术局部战争。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "A", "explain": "海湾战争是核威慑下20世纪最经典的高技术局部战争。B项科索沃战争、C项阿富汗战争、D项伊拉克战争在规模和典型性上均不及海湾战争。"}, {"chapter": "信息化武装", "type": "single", "id": 209, "question": "在下列（   ）战争中首次使用了B-2隐形轰炸机。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "B", "explain": "B-2隐形轰炸机在科索沃战争中首次投入使用。A项海湾战争、C项阿富汗战争、D项伊拉克战争中B-2的使用都在科索沃战争之后，均非首次。"}, {"chapter": "信息化武装", "type": "single", "id": 210, "question": "下列（   ）是在科索沃战争中首次使用的。", "options": [{"label": "A", "text": "CBU-105传感器引信武器"}, {"label": "B", "text": "EC-130“罗盘呼叫”"}, {"label": "C", "text": "B-2隐形轰炸机、集束炸弹"}, {"label": "D", "text": "EA-6B“徘徊者”飞机"}], "answer": "C", "explain": "B-2隐形轰炸机和集束炸弹在科索沃战争中首次使用。A项CBU-105传感器引信武器、B项EC-130“罗盘呼叫”、D项EA-6B“徘徊者”不对应科索沃战争首次投入使用。"}, {"chapter": "信息化武装", "type": "single", "id": 211, "question": "人们通常把（   ）称为“力量的倍增器”", "options": [{"label": "A", "text": "C4ISR系统"}, {"label": "B", "text": "NMD国家导弹防御系统"}, {"label": "C", "text": "GPS全球定位系统"}, {"label": "D", "text": "TMD战区导弹防御系统"}], "answer": "A", "explain": "C4ISR系统被称为“力量的倍增器”。B项NMD国家导弹防御系统、C项GPS全球定位系统、D项TMD战区导弹防御系统各有自身功能，但不承担“力量倍增器”这一称谓。"}, {"chapter": "信息化武装", "type": "single", "id": 212, "question": "“如果发生第三次世界大战,获胜者必将是最善于控制和运用电磁频谱的一方。”这个大胆的预言是（   ）提出来的。", "options": [{"label": "A", "text": "克劳塞维茨"}, {"label": "B", "text": "鲍威尔"}, {"label": "C", "text": "克林顿"}, {"label": "D", "text": "穆勒"}], "answer": "D", "explain": "“获胜者必是最善于控制和运用电磁频谱的一方”这一预言由穆勒提出。A项克劳塞维茨是《战争论》作者，B项鲍威尔与C项克林顿是政军人物，均非此人。"}, {"chapter": "信息化武装", "type": "single", "id": 213, "question": "机械化战争与信息化战争的差别不体现在（   ）。", "options": [{"label": "A", "text": "作战总体效能不同"}, {"label": "B", "text": "作战主导要素不同"}, {"label": "C", "text": "作战指挥控制不同"}, {"label": "D", "text": "作战人员素质不同"}], "answer": "D", "explain": "作战人员素质不同不是机械化战争与信息化战争差别的体现，两者的实质差别在于作战总体效能、主导要素和指挥控制方式。A项效能、B项主导要素、C项指挥控制都是两者的实质差别。"}, {"chapter": "信息化武装", "type": "single", "id": 214, "question": "信息化武器系统的特征是:武器的战斗效能除了具有传统武器的火力、机动力、突击力和防护力外,还有较强的（   ）能力。", "options": [{"label": "A", "text": "电子信息处理"}, {"label": "B", "text": "控制"}, {"label": "C", "text": "指挥"}, {"label": "D", "text": "识别"}], "answer": "A", "explain": "信息化武器除火力、机动力、突击力、防护力外，还有较强的电子信息处理能力。B项控制、C项指挥、D项识别都是次要功能，电子信息处理才是信息化武器的核心特征。"}, {"chapter": "信息化武装", "type": "single", "id": 215, "question": "以信息技术为代表的科学技术的发展是信息化战争形成的（   ）。", "options": [{"label": "A", "text": "物质技术基础"}, {"label": "B", "text": "催产剂"}, {"label": "C", "text": "先导"}, {"label": "D", "text": "试验场"}], "answer": "A", "explain": "以信息技术为代表的科学技术发展是信息化战争形成的物质技术基础。B项催产剂指局部战争，C项先导指作战理论，D项试验场指战争实践。"}, {"chapter": "信息化武装", "type": "single", "id": 216, "question": "从总的发展趋势看,信息化战争的后勤保障将向（   ）方向发展。", "options": [{"label": "A", "text": "整体"}, {"label": "B", "text": "科学化"}, {"label": "C", "text": "职业"}, {"label": "D", "text": "全程化"}], "answer": "A", "explain": "信息化战争的后勤保障将向整体方向发展，实现各保障系统一体化。B项科学化、C项职业、D项全程化都不是信息化战争后勤保障发展的主流方向表述。"}, {"chapter": "信息化武装", "type": "single", "id": 217, "question": "敌对双方使用特殊的电脑侦查设备和计算机“病毒”,获取敌方电脑的军事情报和使敌方电脑失灵、瘫痪的作战形式是（   ）。", "options": [{"label": "A", "text": "电脑战"}, {"label": "B", "text": "电子战"}, {"label": "C", "text": "自然战"}, {"label": "D", "text": "信息战"}], "answer": "A", "explain": "用电脑侦查设备和病毒获取情报、使敌电脑失灵瘫痪的作战形式是电脑战。B项电子战针对电磁频谱，C项自然战利用自然条件，D项信息战范围更广但此处特指计算机网络。"}, {"chapter": "信息化武装", "type": "single", "id": 218, "question": "下列不属于信息化战争的发展趋势的是（   ）。", "options": [{"label": "A", "text": "武器装备高技术化"}, {"label": "B", "text": "作战方式近战化"}, {"label": "C", "text": "作战形式更加多样化"}, {"label": "D", "text": "作战指挥高度自动化"}], "answer": "B", "explain": "作战方式近战化不是信息化战争的发展趋势，信息化战争反而趋向远程化、精确化。A项武器装备高技术化、C项作战形式多样化、D项指挥高度自动化都是信息化战争的发展趋势。"}, {"chapter": "信息化武装", "type": "single", "id": 219, "question": "在当今社会,掌握（   ）,将成为和平时期各国竞争的核心内容和战争时期的重要作战手段。", "options": [{"label": "A", "text": "制太空权"}, {"label": "B", "text": "制经济权"}, {"label": "C", "text": "制资源权"}, {"label": "D", "text": "制信息权"}], "answer": "D", "explain": "掌握制信息权成为和平时期各国竞争的核心内容和战争时期的重要作战手段。A项制太空权、B项制经济权、C项制资源权都不是当今时代竞争的核心内容。"}, {"chapter": "信息化武装", "type": "single", "id": 220, "question": "当战争进入信息化时代后, （   ）系统必然成为战争新的主流武器。", "options": [{"label": "A", "text": "信息化武器"}, {"label": "B", "text": "机械化武器"}, {"label": "C", "text": "核武器"}, {"label": "D", "text": "太空武器"}], "answer": "A", "explain": "进入信息化时代，信息化武器必然成为战争新的主流武器。B项机械化武器是上一时代主流，C项核武器与D项太空武器都不是信息化时代占据主导的武器系统。"}, {"chapter": "信息化武装", "type": "single", "id": 221, "question": "TMD是（   ）的缩写。", "options": [{"label": "A", "text": "国家导弹防御系统"}, {"label": "B", "text": "战区导弹防御系统"}, {"label": "C", "text": "全球定位系统"}, {"label": "D", "text": "安全防卫系统"}], "answer": "B", "explain": "TMD是战区导弹防御系统（Theater Missile Defense）的缩写。A项国家导弹防御系统缩写为NMD，C项全球定位系统缩写为GPS，D项安全防卫系统无此对应。"}, {"chapter": "信息化武装", "type": "single", "id": 222, "question": "下列不属于电子战的内容的是", "options": [{"label": "A", "text": "电子侦察与反侦察"}, {"label": "B", "text": "电子干扰与反干扰"}, {"label": "C", "text": "电子辐射与反辐射"}, {"label": "D", "text": "电子摧毁与反摧毁"}], "answer": "C", "explain": "电子战内容包括电子侦察与反侦察、干扰与反干扰、摧毁与反摧毁，不含电子辐射与反辐射。A项侦察反侦察、B项干扰反干扰、D项摧毁反摧毁都属于电子战的基本内容。"}, {"chapter": "信息化武装", "type": "single", "id": 223, "question": "下列对信息化战争的本质的表述,错误的是", "options": [{"label": "A", "text": "信息化战争改变了战争的本质"}, {"label": "B", "text": "信息化战争的性质仍是政治的暴力继续"}, {"label": "C", "text": "信息化战争还将是核威慑下的高技术常规战争"}, {"label": "D", "text": "武器系统的信息智能化和作战行动的一体化"}], "answer": "A", "explain": "信息化战争并未改变战争是政治的暴力继续这一本质，故“改变了战争的本质”表述错误。B项仍是政治暴力继续、C项仍是核威慑下的高技术常规战争、D项武器智能化与行动一体化都是正确表述。"}, {"chapter": "信息化武装", "type": "single", "id": 224, "question": "首次使用“全球鹰”无人机承担攻击协调和侦察任务的是在( )战争中。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "D", "explain": "全球鹰无人机首次在伊拉克战争中承担攻击协调和侦察任务。A项海湾战争、B项科索沃战争、C项阿富汗战争都发生在该无人机承担此任务之前，均非首次。"}, {"chapter": "信息化武装", "type": "single", "id": 225, "question": "不断发生的局部战争是信息化战争形成的( )", "options": [{"label": "A", "text": "物质技术基础"}, {"label": "B", "text": "催产剂"}, {"label": "C", "text": "先导"}, {"label": "D", "text": "试验场"}], "answer": "D", "explain": "不断发生的局部战争是信息化战争形成的试验场，为其提供了检验和完善的舞台。A项物质技术基础指科技发展，B项催产剂表述不确切，C项先导指不断更新的作战理论。"}, {"chapter": "信息化武装", "type": "single", "id": 226, "question": "有人将( )战役称为“第三次浪潮时代”的开篇之作。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "A", "explain": "海湾战争被称作“第三次浪潮时代”的开篇之作，因其率先展示信息化战争雏形。B项科索沃战争、C项阿富汗战争、D项伊拉克战争都发生在其后，不承担这一称谓。"}, {"chapter": "信息化武装", "type": "single", "id": 227, "question": "有学者认为, （   ）战争是美军按空地一体战理论打的一场标准式战争。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "A", "explain": "海湾战争是美军按空地一体战理论打的一场标准式战争。B项科索沃战争以空袭为主，C项阿富汗战争、D项伊拉克战争的作战样式均与之不同。"}, {"chapter": "信息化武装", "type": "single", "id": 228, "question": "美军入侵格林纳达、空袭利比亚、出兵巴拿马等,都因为大量使用带有信息处理功能的高尖端技术武器,在极短的时间内,迅速达成行动目的,开创了被人们称为（   ）的战争新样式。", "options": [{"label": "A", "text": "导弹袭击式"}, {"label": "B", "text": "外科手术式"}, {"label": "C", "text": "破坏结构式"}, {"label": "D", "text": "指挥控制式"}], "answer": "B", "explain": "美军入侵格林纳达、空袭利比亚、出兵巴拿马开创了“外科手术式”战争新样式。A项导弹袭击式、C项破坏结构式、D项指挥控制式都不是这种精准快速打击样式的名称。"}, {"chapter": "信息化武装", "type": "single", "id": 229, "question": "（   ）战争不仅是冷战时期向冷战后时期的转折点,也是机械化战争时代向信息化战争时代的重大转折点。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "A", "explain": "海湾战争既是冷战到冷战后、也是机械化战争向信息化战争转变的重大转折点。B项科索沃战争、C项阿富汗战争、D项伊拉克战争都是这一转变之后的战例，不承担转折点地位。"}, {"chapter": "中国国防", "type": "multi", "id": 230, "question": "根据不同社会制度国家国防政策和国防目标的不同，目前世界上的国防类型主要有（）", "options": [{"label": "A", "text": "扩张型"}, {"label": "B", "text": "友好型"}, {"label": "C", "text": "中立型"}, {"label": "D", "text": "自卫型"}], "answer": "ACD", "explain": "根据社会制度、国防政策和目标不同，世界国防类型主要有扩张型、联盟型、中立型、自卫型。A项扩张型、C项中立型、D项自卫型均为标准分类，B项友好型不是国防类型的规范划分，故答案为ACD。"}, {"chapter": "中国国防", "type": "multi", "id": 231, "question": "国防是指国家为防备和抵抗侵略，制止武装颠覆，保卫国家主权统一、领土完整和安全所进行的军事及军事有关的政治、经济、外交、科技、教育等方面活动。国防的基本要素包括( ) 。", "options": [{"label": "A", "text": "国防的主体"}, {"label": "B", "text": "国防的对象"}, {"label": "C", "text": "国防的目的"}, {"label": "D", "text": "国防的手段"}], "answer": "ABCD", "explain": "国防基本要素包括主体、对象、目的和手段四项。A项主体、B项对象、C项目的、D项手段分别完整对应这四个基本要素，均正确，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 232, "question": "国防的目的是（ ）。", "options": [{"label": "A", "text": "捍卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫国家的领土完整"}, {"label": "D", "text": "保障国家的安全"}], "answer": "ABCD", "explain": "国防目的在于捍卫国家主权、保卫国家统一、保卫领土完整和保障国家安全。A项捍卫主权、B项保卫统一、C项保卫领土完整、D项保障安全分别对应目的的四个方面，均正确，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 233, "question": "我国的国防手段包括（ ）。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "军事手段"}, {"label": "D", "text": "经济手段"}], "answer": "ABCD", "explain": "我国国防手段包括政治、经济、军事、外交等多种手段。A项政治手段、B项外交手段、C项军事手段、D项经济手段均属于国防手段的范畴，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 234, "question": "国防法规的特性是（ ）。", "options": [{"label": "A", "text": "调整对象的军事性"}, {"label": "B", "text": "目标体系的多样性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "ACD", "explain": "国防法规的特性包括调整对象的军事性、公开程度的有限性和司法适用的优先性。B项目标体系的多样性不属于国防法规的固有特性，故排除B项，答案为ACD。"}, {"chapter": "中国国防", "type": "multi", "id": 235, "question": "联盟型是指为弥补自身力量的不足，以结盟的形式联合他国进行防卫，可分为（ ）。", "options": [{"label": "A", "text": "二元体系联盟"}, {"label": "B", "text": "一元体系联盟"}, {"label": "C", "text": "多元体系联盟"}, {"label": "D", "text": "混合体系联盟"}], "answer": "BC", "explain": "联盟型国防按结盟的体系结构分为一元体系联盟和多元体系联盟。B项一元体系联盟、C项多元体系联盟正确，A项二元体系联盟和D项混合体系联盟均为杜撰，故答案为BC。"}, {"chapter": "中国国防", "type": "multi", "id": 236, "question": "中华人民共和国武装力量是由（ ）组成。", "options": [{"label": "A", "text": "义务兵"}, {"label": "B", "text": "中国人民解放军现役部队和预备役部队"}, {"label": "C", "text": "中国人民武装警察部队"}, {"label": "D", "text": "民兵"}], "answer": "BCD", "explain": "我国武装力量由解放军现役部队和预备役部队、武装警察部队、民兵组成。A项义务兵只是兵员身份而非武装力量组成部分，故答案为BCD。"}, {"chapter": "中国国防", "type": "multi", "id": 237, "question": "中国人民解放军包括以下哪几个军种（ ）。", "options": [{"label": "A", "text": "海军"}, {"label": "B", "text": "火箭军"}, {"label": "C", "text": "空军"}, {"label": "D", "text": "战略支援部队"}], "answer": "ABCD", "explain": "解放军军种包括陆军、海军、空军、火箭军和战略支援部队等。A项海军、B项火箭军、C项空军、D项战略支援部队均为解放军军种，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 238, "question": "以下哪些是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "国民经济动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "人民防空动员"}, {"label": "D", "text": "国防交通动员"}], "answer": "ABCD", "explain": "国防动员内容包括国民经济动员、科学技术动员、人民防空动员、国防交通动员等。A项国民经济动员、B项科学技术动员、C项人民防空动员、D项国防交通动员均属主要内容，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 239, "question": "根据《中华人民共和国宪法》和《中华人民共和国国防法》，中华人民共和国的国防领导权由（ ）行", "options": [{"label": "A", "text": "中共中央"}, {"label": "B", "text": "全国人大及其常务委员会"}, {"label": "C", "text": "国家主席"}, {"label": "D", "text": "中央军委"}], "answer": "ABCD", "explain": "国防领导权由中共中央、全国人大及其常委会、国家主席、中央军委等主体共同行使。A项中共中央、B项全国人大及其常委会、C项国家主席、D项中央军委均为国防领导主体，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 240, "question": "根据不同社会制度国家国防政策和国防目标的不同，目前世界上的国防类型主要有（）。", "options": [{"label": "A", "text": "扩张型"}, {"label": "B", "text": "联盟型"}, {"label": "C", "text": "中立型"}, {"label": "D", "text": "自卫型"}], "answer": "ABCD", "explain": "世界国防类型主要有扩张型、联盟型、中立型、自卫型四种。A项扩张型、B项联盟型、C项中立型、D项自卫型分别对应这四种类型，均正确，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 241, "question": "国防是指国家为防备和抵抗侵略，制止武装颠覆，保卫国家主权统一、领土完整和安全所进行的军事及军事有关的政治、经济、外交、科技、教育等方面活动。国防的基本要素包括( ) 。", "options": [{"label": "A", "text": "国防的性质"}, {"label": "B", "text": "国防的对象"}, {"label": "C", "text": "国防的目的"}, {"label": "D", "text": "国防的手段"}], "answer": "BCD", "explain": "国防基本要素包括主体、对象、目的和手段四项。B项国防的对象、C项国防的目的、D项国防的手段均属基本要素；A项国防的性质不属于基本要素的范畴，故答案为BCD。"}, {"chapter": "中国国防", "type": "multi", "id": 242, "question": "国防的目的是（ ）。", "options": [{"label": "A", "text": "捍卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫国家的领土完整"}, {"label": "D", "text": "保障人民的安全"}], "answer": "ABC", "explain": "国防目的在于捍卫国家主权、保卫国家统一、保卫领土完整。D项保障人民安全表述不准确，国防保障的应是国家的安全而非仅人民安全，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 243, "question": "我国的国防手段包括( )。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "文化手段"}, {"label": "D", "text": "经济手段"}], "answer": "ABD", "explain": "我国国防手段包括政治、经济、军事、外交等，其中政治、外交、经济手段符合题意。A项政治手段、B项外交手段、D项经济手段正确，C项文化手段不属于国防手段，故答案为ABD。"}, {"chapter": "中国国防", "type": "multi", "id": 244, "question": "国防法规的特性是（ ）。", "options": [{"label": "A", "text": "调整对象的军事性"}, {"label": "B", "text": "处罚措施的严厉性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "司法适用的优先性"}], "answer": "ABCD", "explain": "国防法规特性含调整对象的军事性、处罚措施的严厉性、公开程度的有限性和司法适用的优先性。A项军事性、B项严厉性、C项有限性、D项优先性均为其特性，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 245, "question": "( ) 是国家法律的一般特性。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "普遍的适用性"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "相对的稳定性"}], "answer": "ABCD", "explain": "国家法律一般特性有鲜明的阶级性、普遍的适用性、高度的权威性、相对的稳定性。A项阶级性、B项适用性、C项权威性、D项稳定性均为法律的一般特性，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 246, "question": "( )体现了国防后备力量建设取得了长足的发展。", "options": [{"label": "A", "text": "健全了国防动员机构，保证国家能很快由平时状态转入战时状态，调动足够的人力、物力、财力应付战争的需要。"}, {"label": "B", "text": "确立并实行了民兵与预备役相结合的制度，初步形成了具有中国特色的国防后备力量体系。"}, {"label": "C", "text": "加强了国防教育，使国防教育正逐步纳入到整个国民教育体系之中，走上了法制化、规范化的轨道。"}, {"label": "D", "text": "民兵、预备役部队在参战支前、保卫边疆、发展生产、扶贫帮困、抢险救灾、维护社会治安等方面发挥了重要作用，为国家的改革、发展和稳定做出了巨大的贡献。"}], "answer": "ABCD", "explain": "国防后备力量建设成果体现在健全动员机构、确立民兵预备役制度、加强国防教育、民兵发挥作用等方面。四个选项均体现这一进展，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 247, "question": "以下哪些是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "国民经济动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "人民防空动员"}, {"label": "D", "text": "政治动员"}], "answer": "ABCD", "explain": "国防动员内容包括国民经济动员、科学技术动员、人民防空动员、政治动员等。A项国民经济动员、B项科学技术动员、C项人民防空动员、D项政治动员均属主要内容，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 248, "question": "以下哪些是国防动员的基本原则（ ）。", "options": [{"label": "A", "text": "服从大局，长期准备"}, {"label": "B", "text": "优先准备，灵活多样"}, {"label": "C", "text": "严密组织，快速高效"}, {"label": "D", "text": "因故因势，协调灵活"}], "answer": "ACD", "explain": "国防动员基本原则有服从大局长期准备、严密组织快速高效、因故因势协调灵活。B项优先准备灵活多样不是规范表述，故答案为ACD。"}, {"chapter": "中国国防", "type": "multi", "id": 249, "question": "大学生入伍享受哪些优惠政策( )。", "options": [{"label": "A", "text": "享受优先政策"}, {"label": "B", "text": "享受优待政策"}, {"label": "C", "text": "大学毕业生可选拔为军官"}, {"label": "D", "text": "优先选取为士官"}], "answer": "ABCD", "explain": "大学生入伍享有优先、优待政策，大学毕业生可选拔为军官，也可优先选取士官。A项优先政策、B项优待政策、C项选拔军官、D项优先选取士官均为优惠政策，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 250, "question": "爱国主义在社会主义核心价值观中的地位是（ ）。", "options": [{"label": "A", "text": "爱国主义是社会主义核心价值观的首要原则"}, {"label": "B", "text": "爱国主义是社会主义核心价值观的重要基础"}, {"label": "C", "text": "爱国主义是社会主义核心价值观的动力之源"}, {"label": "D", "text": "爱国主义产生于社会主义核心价值观"}], "answer": "ABC", "explain": "爱国主义是社会主义核心价值观的首要原则、重要基础和动力之源。D项该爱国主义产生于社会主义核心价值观，因果倒置且不符实际，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 251, "question": "“政治昌明是国防巩固的根本”，以下事例（ ）体现了国防的巩固离不开昌明的政治。", "options": [{"label": "A", "text": "商鞅变法"}, {"label": "B", "text": "文景之治"}, {"label": "C", "text": "贞观之治"}, {"label": "D", "text": "康乾盛世"}], "answer": "ABCD", "explain": "商鞅变法、文景之治、贞观之治、康乾盛世均体现政治昌明对国防巩固的支撑作用。A项商鞅变法、B项文景之治、C项贞观之治、D项康乾盛世皆为昌明政治巩固国防的例证，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 252, "question": "国防法规的特性是（ ）。", "options": [{"label": "A", "text": "目标体系的多样性"}, {"label": "B", "text": "职能部门的专门性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "处罚措施的严厉性"}], "answer": "CD", "explain": "国防法规特性中有公开程度的有限性和处罚措施的严厉性。A项目标体系的多样性、B项职能部门的专门性不属于国防法规特指特性，故答案为CD。"}, {"chapter": "中国国防", "type": "multi", "id": 253, "question": "国防动员的组织体系是由（ ）组成。", "options": [{"label": "A", "text": "决策机构"}, {"label": "B", "text": "协调机构"}, {"label": "C", "text": "执行机构"}, {"label": "D", "text": "监督机构"}], "answer": "ABC", "explain": "国防动员组织体系由决策机构、协调机构、执行机构三个部分构成，共同支撑国防动员的运转。A项决策机构、B项协调机构、C项执行机构正确，D项监督机构不属于该三部分，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 254, "question": "中国人民解放军五大战区是（ ）。", "options": [{"label": "A", "text": "东部战区"}, {"label": "B", "text": "南部战区"}, {"label": "C", "text": "西部战区"}, {"label": "D", "text": "北部战区"}], "answer": "ABCD", "explain": "中国人民解放军五大战区为东部、南部、西部、北部、中部战区。A项东部、B项南部、C项西部、D项北部均为战区名称，题目列出其中四个，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 255, "question": "以下哪些是国防动员的基本原则( )。", "options": [{"label": "A", "text": "服从大局，长期准备"}, {"label": "B", "text": "全面规划，统筹兼顾"}, {"label": "C", "text": "严密组织，快速高效"}, {"label": "D", "text": "因故因势，协调灵活"}], "answer": "ABCD", "explain": "国防动员基本原则含服从大局长期准备、全面规划统筹兼顾、严密组织快速高效、因故因势协调灵活。四个选项均为基本原则，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 256, "question": "根据（ ），中华人民共和国的国防领导权由中共中央、全国人大及其常务委员会、国家主席、国务院、中央军委来行", "options": [{"label": "A", "text": "《中华人民共和国国防法》"}, {"label": "B", "text": "《中华人民共和国国防教育法》"}, {"label": "C", "text": "《中华人民共和国宪法》"}, {"label": "D", "text": "《反分裂国家法》"}], "answer": "AC", "explain": "国防领导权的行使依据《中华人民共和国国防法》和《中华人民共和国宪法》。B项国防教育法、D项反分裂国家法均不规定国防领导体制，故答案为AC。"}, {"chapter": "中国国防", "type": "multi", "id": 257, "question": "( )体现了国防后备力量建设取得了长足的发展。", "options": [{"label": "A", "text": "实现了指导思想的战略性转变， 走上了相对和平时期稳步发展的轨道。"}, {"label": "B", "text": "确立并实行了民兵与预备役相结合的制度，初步形成了具有中国特色的国防后备力量体系。"}, {"label": "C", "text": "注重宏观指导，合理布局，边海防、大中城市和重点地区的民兵工作得到加强。"}, {"label": "D", "text": "民兵、预备役部队在参战支前、保卫边疆、发展生产、扶贫帮困、抢险救灾、维护社会治安等方面发挥了重要作用，为国家的改革、发展和稳定做出了巨大的贡献。"}], "answer": "ABCD", "explain": "国防后备力量建设体现在指导思想战略转变、确立民兵预备役制度、注重宏观指导、民兵发挥作用等方面。四个选项均体现成果，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 258, "question": "( )是国家法律的一般特性。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "严格的强制性"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "相对的稳定性"}], "answer": "ABCD", "explain": "国家法律一般特性有鲜明的阶级性、严格的强制性、高度的权威性、相对的稳定性。A项阶级性、B项强制性、C项权威性、D项稳定性均为法律特性，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 259, "question": "中华人民共和国武装力量是由（ ）组成。", "options": [{"label": "A", "text": "民兵"}, {"label": "B", "text": "中国人民解放军现役部队和预备役部队"}, {"label": "C", "text": "义务兵"}, {"label": "D", "text": "志愿兵"}], "answer": "AB", "explain": "我国武装力量由解放军现役部队和预备役部队、民兵组成。C项义务兵、D项志愿兵只是兵役身份而非武装力量的组成部分，故答案为AB。"}, {"chapter": "中国国防", "type": "multi", "id": 260, "question": "我国公民的国防义务包括（）", "options": [{"label": "A", "text": "兵役义务"}, {"label": "B", "text": "接受国防教育的义务"}, {"label": "C", "text": "保护国防设施的义务"}, {"label": "D", "text": "保守国防秘密的义务"}], "answer": "ABCD", "explain": "公民国防义务含兵役义务、接受国防教育、保护国防设施、保守国防秘密等。A项兵役义务、B项接受国防教育、C项保护国防设施、D项保守国防秘密均为国防义务，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 261, "question": "以下事例（）证明了了通过加强军备建设，巩固国防取得了巨大的成果。", "options": [{"label": "A", "text": "战国时期赵国推行“胡服骑射”等军事改革"}, {"label": "B", "text": "秦统一后实行“刀枪入库”、“马放南山”的政策"}, {"label": "C", "text": "汉朝整肃军备"}, {"label": "D", "text": "清朝晚期实行洋务运动"}], "answer": "AC", "explain": "胡服骑射和汉朝整肃军备体现了加强军备建设巩固国防。B项刀枪入库马放南山是忽视武备的消极做法，D项洋务运动是近代引进而非传统军备建设，故答案为AC。"}, {"chapter": "中国国防", "type": "multi", "id": 262, "question": "“政治昌明是国防巩固的根本”，以下事例（ ）体现了国防的巩固离不开昌明的政治。", "options": [{"label": "A", "text": "商鞅变法"}, {"label": "B", "text": "文景之治"}, {"label": "C", "text": "贞观之治"}, {"label": "D", "text": "宦官专政"}], "answer": "ABC", "explain": "商鞅变法、文景之治、贞观之治均体现政治昌明对国防巩固的根本支撑作用。A项商鞅变法、B项文景之治、C项贞观之治正确，D项宦官专政是政治腐败、削弱国防的反例，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 263, "question": "清政府创建了中国的近代新式海军，组建了（ ）三大水师。", "options": [{"label": "A", "text": "北洋"}, {"label": "B", "text": "南洋"}, {"label": "C", "text": "厦门"}, {"label": "D", "text": "福建"}], "answer": "ABD", "explain": "清政府开展洋务运动创建了中国近代新式海军，组建了北洋、南洋、福建三大水师。A项北洋、B项南洋、D项福建正确，C项厦门只是一处港口而非独立水师建制，故答案为ABD。"}, {"chapter": "中国国防", "type": "multi", "id": 264, "question": "明朝杰出的军事家、民族英雄戚继光，在抗击倭寇和打击蒙古族内犯的多年里，写下了（ ）等著名的兵书。", "options": [{"label": "A", "text": "《纪效新书》"}, {"label": "B", "text": "《练兵实纪》"}, {"label": "C", "text": "《孙子兵法》"}, {"label": "D", "text": "《司马法》"}], "answer": "AB", "explain": "戚继光著有《纪效新书》《练兵实纪》。C项《孙子兵法》为孙武所著，D项《司马法》为古代兵书，均非戚继光著作，故答案为AB。"}, {"chapter": "中国国防", "type": "multi", "id": 265, "question": "我国公民的国防权利包括（ ）。", "options": [{"label": "A", "text": "对国防建设提出建议的权利"}, {"label": "B", "text": "制止、检举危害国防利益行为的权利"}, {"label": "C", "text": "国防活动中受到损失有获得补偿的权利"}, {"label": "D", "text": "履行兵役的义务"}], "answer": "ABC", "explain": "我国公民的国防权利包括对国防建设提出建议、制止检举危害国防利益行为、国防活动受损获补偿。A项建议权、B项制止检举权、C项获补偿权正确，D项履行兵役是义务而非权利，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 266, "question": "我国有些法规是公开的，有些则不公开，下面公开的法规有（ ）。", "options": [{"label": "A", "text": "《中华人民共和国国防法》"}, {"label": "B", "text": "《中华人民共和国兵役法》"}, {"label": "C", "text": "《战备工作条令》"}, {"label": "D", "text": "《军事设施保护法》"}], "answer": "ABD", "explain": "《国防法》《兵役法》《军事设施保护法》属于对外公开的国防法规。A项国防法、B项兵役法、D项军事设施保护法公开，C项《战备工作条令》涉密不宜公开，故答案为ABD。"}, {"chapter": "中国国防", "type": "multi", "id": 267, "question": "我国公民的国防义务包括（ ）。", "options": [{"label": "A", "text": "兵役义务"}, {"label": "B", "text": "维护国家统一和安全的义务"}, {"label": "C", "text": "保护国防设施的义务"}, {"label": "D", "text": "协助国防活动的义务"}], "answer": "ABCD", "explain": "我国公民的国防义务包括兵役义务、维护国家统一和安全、保护国防设施、协助国防活动等。四个选项均为公民应当履行的国防义务，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 268, "question": "国防是指国家为防备和抵抗侵略，制止武装颠覆，保卫国家主权统一、领土完整和安全所进行的军事及军事有关的政治、经济、外交、科技、教育等方面活动。国防的基本要素包括（ ）。", "options": [{"label": "A", "text": "国防的意义"}, {"label": "B", "text": "国防的对象"}, {"label": "C", "text": "国防的目的"}, {"label": "D", "text": "国防的性质"}], "answer": "BC", "explain": "国防基本要素包括主体、对象、目的、手段，其中对象和目的符合题意。A项国防的意义、D项国防的性质不属于基本要素，故答案为BC。"}, {"chapter": "中国国防", "type": "multi", "id": 269, "question": "国防动员的组织体系是由（  ）三部分组成。", "options": [{"label": "A", "text": "动员决策机构"}, {"label": "B", "text": "组织结构"}, {"label": "C", "text": "协调机构"}, {"label": "D", "text": "执行机构"}], "answer": "ACD", "explain": "国防动员组织体系由动员决策机构、协调机构、执行机构三部分组成。B项组织结构表述笼统、不是规范的体系要素，故答案为ACD。"}, {"chapter": "中国国防", "type": "multi", "id": 270, "question": "中国人民解放军现有的军种包括（ ）", "options": [{"label": "A", "text": "联勤保障部队"}, {"label": "B", "text": "陆军"}, {"label": "C", "text": "火箭军"}, {"label": "D", "text": "空军"}], "answer": "BCD", "explain": "中国人民解放军现有军种包括陆军、海军、空军、火箭军、战略支援部队等。B项陆军、C项火箭军、D项空军均为军种，A项联勤保障部队属保障力量而非独立军种，故答案为BCD。"}, {"chapter": "中国国防", "type": "multi", "id": 271, "question": "大学生入伍享受哪些优惠政策( )。", "options": [{"label": "A", "text": "保留入学资格或学籍"}, {"label": "B", "text": "享受学费补偿和国家助学贷款代偿"}, {"label": "C", "text": "大学生士兵退役后享受升学优惠政策"}, {"label": "D", "text": "大学毕业生可选拔为军官"}], "answer": "ABCD", "explain": "大学生入伍享有保留入学资格或学籍、学费补偿和助学贷款代偿、退役后升学优惠、毕业生可选拔为军官等政策。四个选项均为优惠政策，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 272, "question": "国防领导体制是国家（  ）国防建设和军事斗争的组织体系及相应制度，是国防体制和国家体制的重要组成部分。", "options": [{"label": "A", "text": "谋划"}, {"label": "B", "text": "决策"}, {"label": "C", "text": "指挥"}, {"label": "D", "text": "协调"}], "answer": "ABCD", "explain": "国防领导体制是国家谋划、决策、指挥、协调国防建设和军事斗争的组织体系及制度。A项谋划、B项决策、C项指挥、D项协调均为体系职能环节，答案为ABCD。"}, {"chapter": "中国国防", "type": "multi", "id": 273, "question": "根据《中华人民共和国宪法》和《中华人民共和国国防法》， 中华人民共和国的国防领导权由（ ）行使", "options": [{"label": "A", "text": "中共中央"}, {"label": "B", "text": "省人大及其常务委员会"}, {"label": "C", "text": "国家主席"}, {"label": "D", "text": "中央军委"}], "answer": "ACD", "explain": "根据宪法和国防法，国防领导权由中共中央、国家主席、中央军委等主体行使。A项中共中央、C项国家主席、D项中央军委正确，B项省人大及其常委会是地方权力机关、无国防领导权，故答案为ACD。"}, {"chapter": "中国国防", "type": "multi", "id": 274, "question": "下列哪些是我国经典军事著作（ ）", "options": [{"label": "A", "text": "《孙子兵法》"}, {"label": "B", "text": "《六韬》"}, {"label": "C", "text": "《五轮书》"}, {"label": "D", "text": "《武经总要》"}], "answer": "ABD", "explain": "《孙子兵法》《六韬》《武经总要》是我国经典军事著作。A项孙子兵法、B项六韬、D项武经总要正确，C项《五轮书》是日本兵书而非中国著作，故答案为ABD。"}, {"chapter": "中国国防", "type": "multi", "id": 275, "question": "国防的目的是（ ）。", "options": [{"label": "A", "text": "捍卫国家的主权"}, {"label": "B", "text": "保卫国家的统一"}, {"label": "C", "text": "保卫邻国国家的领土完整"}, {"label": "D", "text": "保障公民的安全"}], "answer": "AB", "explain": "国防目的在于捍卫国家主权、保卫国家统一。C项保卫邻国领土完整偏离了国防自卫的目的，D项应为保障国家安全而非仅保障公民安全，故答案为AB。"}, {"chapter": "中国国防", "type": "multi", "id": 276, "question": "我国的国防手段包括（ ）。", "options": [{"label": "A", "text": "政治手段"}, {"label": "B", "text": "外交手段"}, {"label": "C", "text": "文化手段"}, {"label": "D", "text": "体育手段"}], "answer": "AB", "explain": "我国国防手段包含政治手段、外交手段等。A项政治手段、B项外交手段正确；C项文化手段、D项体育手段都不属于国防手段的范畴，故答案为AB。"}, {"chapter": "中国国防", "type": "multi", "id": 277, "question": "国防法规的特性是（ ）。", "options": [{"label": "A", "text": "目标体系的多样性"}, {"label": "B", "text": "处罚措施的严厉性"}, {"label": "C", "text": "公开程度的有限性"}, {"label": "D", "text": "法律条例的自由性"}], "answer": "BC", "explain": "国防法规特性有处罚措施的严厉性和公开程度的有限性。A项目标体系的多样性不属此特性，D项法律条例的自由性表述错误，故答案为BC。"}, {"chapter": "中国国防", "type": "multi", "id": 278, "question": "以下哪些是国防动员的主要内容（ ）。", "options": [{"label": "A", "text": "国民经济动员"}, {"label": "B", "text": "科学技术动员"}, {"label": "C", "text": "人民防空动员"}, {"label": "D", "text": "文化动员"}], "answer": "ABC", "explain": "国防动员的主要内容含国民经济动员、科学技术动员、人民防空动员等。A项国民经济动员、B项科学技术动员、C项人民防空动员正确，D项文化动员不属于主要类别，故答案为ABC。"}, {"chapter": "中国国防", "type": "multi", "id": 279, "question": "以下哪些是国防动员的基本原则( ) 。", "options": [{"label": "A", "text": "优先准备，灵活多样"}, {"label": "B", "text": "全面规划，统筹兼顾"}, {"label": "C", "text": "军民结合，平战结合"}, {"label": "D", "text": "因故因势，协调灵活"}], "answer": "BCD", "explain": "国防动员基本原则含全面规划统筹兼顾、军民结合平战结合、因故因势协调灵活。A项优先准备灵活多样不是规范表述，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 280, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "战略环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "ABC", "explain": "战略的决定因素主要有战略思想、战略环境、军事力量三项。D项经济基础不列为直接的、决定战略内容与特点的因素，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 281, "question": "战略的基本要素包括（ )", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "ABCD", "explain": "战略基本要素包括战略目的、战略方针、战略力量、战略手段四项。A项目、B项方针、C项力量、D项手段均为基本要素，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 282, "question": "( )是战略行动的方向、目标、纲领和准则", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略方针"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "AB", "explain": "战略目的和战略方针是战略行动的方向、目标、纲领和准则。C项战略力量、D项战略手段是战略实施的条件与方法，不承担方向准则作用，故答案为AB。"}, {"chapter": "国家安全", "type": "multi", "id": 283, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "相对稳定性"}], "answer": "ABCD", "explain": "战略特点有全局性、对抗性、谋略性、相对稳定性四项。A项全局性、B项对抗性、C项谋略性、D项相对稳定性均为战略特点，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 284, "question": "一个国家制定战略， 应考虑以下（ ）几个方面。", "options": [{"label": "A", "text": "时代特征"}, {"label": "B", "text": "世界战略格局"}, {"label": "C", "text": "主要国家的战略动向"}, {"label": "D", "text": "当代世界战争与和平的趋势"}], "answer": "ABCD", "explain": "制定战略需考虑时代特征、世界战略格局、主要国家战略动向和战争与和平趋势。四个选项均为制定战略必须考虑的因素，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 285, "question": "国内战略环境是指对筹划、指导军事斗争全局具有重大影响的国内社会环境与自然环境，主要包括国家的政治、经济、军事、地理等方面的基本状况，其中，对战略具有直接影响的是( )", "options": [{"label": "A", "text": "国家的地理环境"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "综合国力状况"}, {"label": "D", "text": "外交政策"}], "answer": "ABC", "explain": "对战略具有直接影响的是国家地理环境、政治环境和综合国力状况。D项外交政策属对外因素而非国内战略环境的直接构成要素，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 286, "question": "( )是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性的影响。", "options": [{"label": "A", "text": "文化"}, {"label": "B", "text": "政治"}, {"label": "C", "text": "法律制度"}, {"label": "D", "text": "基本国策"}], "answer": "BCD", "explain": "法律制度和基本国策等是国内政治环境的本质和核心，对军事斗争全局的筹划指导有决定性影响。A项文化不是此处的本质核心，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 287, "question": "我国的国家安全政策包括（ ）。", "options": [{"label": "A", "text": "构筑软实力强化新战略安全观"}, {"label": "B", "text": "独立自主、和平推进多极格局形成"}, {"label": "C", "text": "重塑国家安全体制和区域合作机制"}, {"label": "D", "text": "继续贯彻与邻为善、以邻为伴， 倡导互信、互利、平等、协作的周边外交方针"}], "answer": "ABCD", "explain": "我国国家安全政策含构筑软实力强化安全观、独立自主推进多极、重塑安全体制、贯彻周边外交方针等。四个选项均为国家安全政策，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 288, "question": "依照《中华人民共和国宪法》规定，（ ）是中国社会主义建设事业的根本指导思想。", "options": [{"label": "A", "text": "马克思列宁主义"}, {"label": "B", "text": "毛泽东思想"}, {"label": "C", "text": "邓小平理论"}, {"label": "D", "text": "江泽民思想"}], "answer": "ABC", "explain": "宪法规定马克思列宁主义、毛泽东思想、邓小平理论为中国社会主义建设事业的根本指导思想。D项江泽民思想不列为根本指导思想，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 289, "question": "依照《中华人民共和国宪法》规定，国家的根本任务是( ) 。", "options": [{"label": "A", "text": "大力发展文化产业"}, {"label": "B", "text": "进行社会主义现代化建设"}, {"label": "C", "text": "完成统一祖国的大业"}, {"label": "D", "text": "维护国家的独立和安全"}], "answer": "BCD", "explain": "国家根本任务是进行社会主义现代化建设、完成统一祖国大业、维护国家独立和安全。A项大力发展文化产业只是具体任务而非根本任务，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 290, "question": "第二次世界大战以前，国际秩序的本质特征是（ ）。", "options": [{"label": "A", "text": "强权政治"}, {"label": "B", "text": "殖民政治"}, {"label": "C", "text": "封建政治"}, {"label": "D", "text": "多极化"}], "answer": "AB", "explain": "第二次世界大战以前，国际秩序的本质特征是强权政治和殖民政治，强国支配弱国、列强瓜分殖民地。A项强权政治、B项殖民政治正确，C项封建政治和D项多极化均非其本质，故答案为AB。"}, {"chapter": "国家安全", "type": "multi", "id": 291, "question": "国际战略格局的特征包括（ ）。", "options": [{"label": "A", "text": "国际战略格局与时代的发展密切相关"}, {"label": "B", "text": "国际战略格局同世界经济格局相适应"}, {"label": "C", "text": "国际战略格局各层次相对独立、相互影响"}, {"label": "D", "text": "国际秩序是国际战略格局的现状在国际准则上的反映"}], "answer": "ABCD", "explain": "国际战略格局特征含与时代发展密切相关、与世界经济格局相适应、各层次相对独立、国际秩序是格局在国际准则上的反映。四个选项均为特征，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 292, "question": "美国的（ ）成为国际局势动荡的根源。", "options": [{"label": "A", "text": "“新干涉主义”"}, {"label": "B", "text": "“干涉主义”"}, {"label": "C", "text": "\"大国主义\""}, {"label": "D", "text": "战略扩张"}], "answer": "AD", "explain": "美国的“新干涉主义”和战略扩张成为国际局势动荡的根源。B项干涉主义表述笼统不准确，C项大国主义不是规范表述，故答案为AD。"}, {"chapter": "国家安全", "type": "multi", "id": 293, "question": "总体稳定是世界形势的主流，尽管发生世界大战的可能性越来越小，但局部战争的危险依然存在，由于（ ）等因素导致局部战争和武装冲突此起彼伏，一度出现增多的势头。", "options": [{"label": "A", "text": "历史结怨"}, {"label": "B", "text": "民族矛盾"}, {"label": "C", "text": "格局转换"}, {"label": "D", "text": "宗教对立"}], "answer": "ABCD", "explain": "历史结怨、民族矛盾、格局转换、宗教对立等因素相互交织，导致局部战争和武装冲突此起彼伏、一度增多。四个选项均为引发局部战争与冲突的直接致因，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 294, "question": "总体稳定是世界形势的主流， 尽管发生世界大战的可能性越来越，但局部战争的危险依然存在，由于（ ）等因素导致局部战争和武装冲突此起彼伏，一度出现增多的势头。", "options": [{"label": "A", "text": "力量失衡"}, {"label": "B", "text": "资源纠纷"}, {"label": "C", "text": "外部插手"}, {"label": "D", "text": "武器扩散"}], "answer": "ABCD", "explain": "力量失衡、资源纠纷、外部插手、武器扩散等因素导致局部战争和武装冲突此起彼伏、一度增多。四个选项均为引发局部冲突的因素，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 295, "question": "战略的基本要素包括（ ）。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略体制"}], "answer": "AC", "explain": "战略的基本要素包括战略目的、战略方针、战略力量和战略手段，题干选项中战略目的、战略力量符合。A项战略目的、C项战略力量正确，B项战略形式、D项战略体制不是基本要素，故答案为AC。"}, {"chapter": "国家安全", "type": "multi", "id": 296, "question": "国际战略格局的现状是（ ）。", "options": [{"label": "A", "text": "美国仍是世界唯一超级大国"}, {"label": "B", "text": "世界多极化的趋势正在发展"}, {"label": "C", "text": "新的各种安全结构正在建立和完善"}, {"label": "D", "text": "经济因素在国际事务中的作用上升"}], "answer": "ABCD", "explain": "美国仍唯一超级大国、多极化趋势发展、新安全结构建立完善、经济因素作用上升是国际战略格局现状。四个选项均为现状描述，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 297, "question": "国际战略格局的特点是（ ）。", "options": [{"label": "A", "text": "世界形势总体稳定，局部动荡"}, {"label": "B", "text": "大国关系相对稳定，地区国家相互靠拢"}, {"label": "C", "text": "世界军备下降幅度参差不齐，质量建军成为主要竞争形势"}, {"label": "D", "text": "美国是世界唯一超级大国，积极发动战争以获取更大的国家利益。"}], "answer": "ABC", "explain": "国际格局特点是总体稳定局部动荡、大国关系相对稳定、质量建军成为主流竞争。D项“美国积极发动战争”表述片面且不符实际，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 298, "question": "2015年4月22日上午 ，亚非领导人会议在印度尼西亚首都雅加达举行。国家主席习近平出席会议并发表题为《弘扬万隆精神推进合作共赢》的重要讲话，习近平就弘扬万隆精神提出（ ）倡议。", "options": [{"label": "A", "text": "深化亚非合作。面对新机遇新挑战"}, {"label": "B", "text": "拓展南南合作"}, {"label": "C", "text": "推进南北合作"}, {"label": "D", "text": "加强同西方国家的合作和发展"}], "answer": "ABC", "explain": "习近平就弘扬万隆精神提出深化亚非合作、拓展南南合作、推进南北合作等倡议。D项加强同西方合作不在三项倡议之内，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 299, "question": "美国倚仗其经济科技实力和超强的军事力量，企图建立以美国为领导的单极世界，充当世界的领袖，但是，这些因素（     ）使得美国并不能凭借自己的优势地位在世界上为所欲为。", "options": [{"label": "A", "text": "几乎所在国家都不赞成建立以“美国为轴心的世界”新格局"}, {"label": "B", "text": "美国在国内面临众多的社会问题和经济问题，不具备承担“领导世界重任”的能力"}, {"label": "C", "text": "在国际上欧洲、日本等国家和地区的挑战，对美国的“世界新秩序”形成一大制约"}, {"label": "D", "text": "当今世界仍有许多尖锐矛盾和复杂问题，无论美国如何强大和富有，都不可能包揽解决所有问题"}], "answer": "ABCD", "explain": "多数国家反对单极世界、美国国内社会与经济问题、欧日挑战、世界矛盾复杂等因素使美国不能凭借优势为所欲为。四个选项均为制约因素，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 300, "question": "在未来国际战略格局多极化发展的进程中，起主导作用的国家是", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "俄罗斯"}, {"label": "D", "text": "日本"}], "answer": "ABCD", "explain": "未来国际战略格局多极化发展的进程中，美国、中国、俄罗斯、日本等国起主导作用。四个选项均为对多极化格局走向具有主导作用的国家，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 301, "question": "未来国际战略格局的发展趋势是（ ）。", "options": [{"label": "A", "text": "“多极化”将是未来国际战略格局发展的必然趋势。"}, {"label": "B", "text": "美国“一超独霸＂的局面将维持很长一段时间"}, {"label": "C", "text": "未来国际战略格局中各方关系将日趋复杂化"}, {"label": "D", "text": "维护国家利益的“软战争”将对国际战略格局产生重要影响"}], "answer": "ACD", "explain": "多极化是必然趋势、各方关系复杂化、软战争影响格局是发展趋势。B项美国一超独霸局面长期维持不符合多极化方向，故答案为ACD。"}, {"chapter": "国家安全", "type": "multi", "id": 302, "question": "世界上军队在100万以上的国家，除中国外还有( )。", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "俄罗斯"}, {"label": "C", "text": "印度"}, {"label": "D", "text": "朝鲜"}], "answer": "ABCD", "explain": "世界上军队在100万以上的国家除中国外还有美国、俄罗斯、印度、朝鲜。四个选项均为军队规模超过百万的国家，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 303, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "印度"}, {"label": "B", "text": "巴基斯坦"}, {"label": "C", "text": "朝鲜"}, {"label": "D", "text": "俄罗斯"}], "answer": "ABCD", "explain": "公开宣称拥有核武器的国家中，印度、巴基斯坦、朝鲜、俄罗斯均位于中国周边。四个选项都是中国周边公开拥核的国家，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 304, "question": "当今世界五大热点地区，（ ）都在中国周边。", "options": [{"label": "A", "text": "中东波斯湾"}, {"label": "B", "text": "朝鲜半岛"}, {"label": "C", "text": "南亚次大陆"}, {"label": "D", "text": "台湾海峡"}], "answer": "ABCD", "explain": "当今世界五大热点地区中，中东波斯湾、朝鲜半岛、南亚次大陆、台湾海峡都位于中国周边。四个选项均为中国周边的热点地区，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 305, "question": "从新中国成立到20世纪60年代， 对我国独立和安全的威胁主要来自美国，美国不甘心在中国内地的失败，长期推行（ ）政策。", "options": [{"label": "A", "text": "政治上孤立"}, {"label": "B", "text": "经济上封锁"}, {"label": "C", "text": "军事上威胁"}, {"label": "D", "text": "反华、仇华"}], "answer": "ABCD", "explain": "新中国成立到20世纪60年代，美国不甘心在中国的失败，长期推行政治孤立、经济封锁、军事威胁以及反华仇华的政策。四个选项均为美国对华推行的敌对政策，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 306, "question": "为打破美、前苏两个超级大国对我国实施的战略包围 ， 我国先后采取了一系列重大战略性举措，（ ）有力地打击了霸权主义行径。", "options": [{"label": "A", "text": "抗美援朝"}, {"label": "B", "text": "中印边境自卫反击战"}, {"label": "C", "text": "援越抗美斗争"}, {"label": "D", "text": "中越边境自卫还击作战"}], "answer": "ABCD", "explain": "为打破美苏战略包围，我国采取抗美援朝、中印边境自卫反击战、援越抗美、中越边境自卫还击等重大战略举措，有力打击了霸权主义。四个选项均为打击霸权主义的举措，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 307, "question": "当前，出于应对（ ）等方面的需要，中美关系在政治、经济、军事等领域均得到了很大改善。", "options": [{"label": "A", "text": "全球经济金融"}, {"label": "B", "text": "气候危机"}, {"label": "C", "text": "联合反恐"}, {"label": "D", "text": "反对霸权主义"}], "answer": "ABC", "explain": "出于应对全球经济金融、气候危机、联合反恐等共同需要的推动，中美关系在政治、经济、军事等领域得到很大改善。A项全球金融、B项气候危机、C项联合反恐正确，D项反对霸权主义不构成改善动因，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 308, "question": "美国在不放松对中国在经济、政治、文化等方面遏制的同时， 在军事方面采取的措施有（ ）。", "options": [{"label": "A", "text": "实现了在中亚的军事存在"}, {"label": "B", "text": "增强了其在东亚、东南亚、南亚地区的军事存在"}, {"label": "C", "text": "提升关岛美军的军备水平和战略威慑能力， 形成日本和关岛两大地区兵力投送中心"}, {"label": "D", "text": "调整了其在亚太地区的军事战略部署，强化了美国与日、韩、澳等盟国的军事同盟关系"}], "answer": "ABCD", "explain": "美国对华军事遏制表现为实现中亚军事存在、增强东亚东南亚军事存在、提升关岛战备水平、调整亚太部署强化盟国同盟。四个选项均为其措施，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 309, "question": "中日之间存在一系列的矛盾和斗争，这体现在（ ）方面。", "options": [{"label": "A", "text": "中日之间在钓鱼岛方面存在严重争端"}, {"label": "B", "text": "中日之间在东海大陆架和东海油气资源方面存在严重争端"}, {"label": "C", "text": "日本在台湾问题上挑战中国的国家核心利益"}, {"label": "D", "text": "日本当局歪曲历史，美化侵略战争，拒绝承担战争责任"}], "answer": "ABCD", "explain": "中日矛盾体现在钓鱼岛争端、东海大陆架与油气争端、台湾问题、歪曲历史美化侵略等方面。四个选项均为矛盾的具体表现，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 310, "question": "境内的恐怖势力与境外“三股恶势力”遥相呼应， 在西方反华势力的支待下正走出“垫伏期”，不断进行干扰破坏活动，暴力化趋势日益增强下列（ ）给各族群众生命财产造成重大损失，给当地正常秩序和社会稳定 造成严重破坏。", "options": [{"label": "A", "text": "西藏“3·14”事件"}, {"label": "B", "text": "乌鲁木齐“7·5”严重暴力犯罪事件"}, {"label": "C", "text": "昆明火车站暴力恐怖案件"}, {"label": "D", "text": "云南腾冲除夕血案"}], "answer": "ABCD", "explain": "西藏3·14、乌鲁木齐7·5、昆明火车站暴恐、云南腾冲等案件均造成重大损失和严重破坏。四个选项均为具体暴力恐怖事件，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 311, "question": "中国周边安全环境的特点是（ ）。", "options": [{"label": "A", "text": "邻国众多，强邻环伺"}, {"label": "B", "text": "战略区位重要，大国利益交汇"}, {"label": "C", "text": "多性突出，热点矛盾集中"}, {"label": "D", "text": "相安无事，和平安全"}], "answer": "ABC", "explain": "周边安全特点是邻国众多强邻环伺、战略区位重要大国利益交汇、热点矛盾集中。D项相安无事和平安全与我国周边实际不符，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 312, "question": "中国周边安全环境的现状是( )。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "中日之间存在一系列的矛盾和斗争"}, {"label": "C", "text": "恐怖主义活动猖獗， 对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "中国周边安全环境的现状是：美国视中国为主要潜在竞争对手、中日之间存在一系列矛盾斗争、恐怖主义活动猖獗威胁增大、海洋权益遭遇严峻挑战。四个选项均为现状表现，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 313, "question": "大国关系的相对平稳发展是中国周边继续保待缓和的基础，下列大国关系描述正确的是（ ）。", "options": [{"label": "A", "text": "日傍美制华，并不甘心为美火中取栗。"}, {"label": "B", "text": "美借日制华，却不希望中日交恶而不可收拾。"}, {"label": "C", "text": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，但双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，并不希望与中国发生对抗。"}, {"label": "D", "text": "遭受美国战略挤压的俄罗斯，在国力未得到全面恢复前 ，仍将是中国主荌战略伙伴，中俄关系有望继续稳固发展。"}], "answer": "ABCD", "explain": "日傍美制华但不愿为美火中取栗、美借日制华又不愿中日交恶不可收拾、中俄战略伙伴关系稳固等大国关系描述正确。四个选项均符合大国关系的实际，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 314, "question": "中国周边地区热点问题包括（ ）。", "options": [{"label": "A", "text": "印巴矛盾"}, {"label": "B", "text": "朝鲜半岛"}, {"label": "C", "text": "东海岛屿争端"}, {"label": "D", "text": "南海岛屿争端"}], "answer": "ABCD", "explain": "中国周边地区热点问题包括印巴矛盾、朝鲜半岛问题、东海岛屿争端、南海岛屿争端等。四个选项均为中国周边地区突出的热点问题，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 315, "question": "中国周边安全环境的发展趋势是（ ）。", "options": [{"label": "A", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "B", "text": "大国关系的相对平稳发展是中国周边继续保持缓和的基础"}, {"label": "C", "text": "地区热点发生热战的可能性较低"}, {"label": "D", "text": "非传统安全问题将成为地区安全合作的催化剂"}], "answer": "BCD", "explain": "发展趋势是大国关系平稳发展、地区热点热战可能性低、非传统安全问题成安全合作催化剂。A项恐怖主义猖獗威胁增大是现状而非趋势，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 316, "question": "综合安全观认为国际安全问题除了以主权概念为核心的政治安全和军事安全之外，还有（ ）等一系列新的安全问题。", "options": [{"label": "A", "text": "经济安全"}, {"label": "B", "text": "环境安全"}, {"label": "C", "text": "文化安全"}, {"label": "D", "text": "社会安全"}], "answer": "ABCD", "explain": "综合安全观认为，国际安全问题除政治安全和军事安全外，还包括经济安全、环境安全、文化安全、社会安全等一系列新的安全问题。四个选项均为综合安全观新增的安全领域，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 317, "question": "我国的新战略安全观主要包括( ) 。", "options": [{"label": "A", "text": "以国家安全为主体，突出主权安全"}, {"label": "B", "text": "以和平共处五项原则为政治基础"}, {"label": "C", "text": "以相互安全为理论前提"}, {"label": "D", "text": "以综合安全为安全维护的内容"}], "answer": "ABCD", "explain": "新战略安全观含以国家安全为主体、和平共处五项原则为基础、相互安全为前提、综合安全为内容。四个选项均为其内容，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 318, "question": "我国在发展大国关系政策上有新的定位，其内容包括 ( )。", "options": [{"label": "A", "text": "是不对抗、不结盟、不针对第三国的原则定位"}, {"label": "B", "text": "是包容整体利益的双赢策略定位"}, {"label": "C", "text": "是多重角色并举、灵活多变、万变不离其宗的角色定位。"}, {"label": "D", "text": "以和平共处五项原则为政治基础"}], "answer": "ABC", "explain": "我国大国关系政策定位为不对抗不结盟不针对第三国、双赢策略、多重角色灵活。D项和平共处五项原则是安全观基础而非大国关系政策定位，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 319, "question": "2012年6月21日，国务院正式批准成立地级市“三沙市”，对其描述正确的是（）", "options": [{"label": "A", "text": "三沙市是中国地理纬度位置最南端的市"}, {"label": "B", "text": "三沙市的设立标志着中国继浙江省舟山市之后，出现了第二个以群岛为行政区划设立的地级市"}, {"label": "C", "text": "三沙市的设立标志着中国对南海及其附属岛屿、岛礁及有关领海的控制，有了更为有利的法理依据"}, {"label": "D", "text": "设立三沙市有利于进一步加强中国对西沙群岛 、中沙群岛、南沙群岛的岛礁及其海域的行政管理和开发建设，保护南海海洋环境"}], "answer": "ABCD", "explain": "三沙市是中国最南端地级市、第二个群岛地级市、提供南海管辖法理依据、利于行政管理与开发保护环境。四个选项均描述正确，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 320, "question": "2012年6月21日，国务院将以前设立的县级三沙市升格为地级市“三沙市”，管辖（）的岛礁及其海域。", "options": [{"label": "A", "text": "东沙群岛"}, {"label": "B", "text": "西沙群岛"}, {"label": "C", "text": "中沙群岛"}, {"label": "D", "text": "南沙群岛"}], "answer": "BCD", "explain": "三沙市管辖西沙群岛、中沙群岛、南沙群岛的岛礁及其海域。B项西沙群岛、C项中沙群岛、D项南沙群岛正确，A项东沙群岛不属三沙市管辖，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 321, "question": "我国的国家安全政策包括（ ）。", "options": [{"label": "A", "text": "构筑软实力强化新战略安全观"}, {"label": "B", "text": "致力于发展新型大国关系"}, {"label": "C", "text": "重塑国家安全体制和区域合作机制"}, {"label": "D", "text": "继续贯彻与邻为善、以邻为伴，倡导互信、互利、平等、协作的周边外交方针"}], "answer": "ABCD", "explain": "我国国家安全政策含构筑软实力、发展新型大国关系、重塑安全体制、贯彻周边外交方针。四个选项均为国家安全政策，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 322, "question": "不同历史时期的战略，有着不同的内容和特点，其决定因素主要有", "options": [{"label": "A", "text": "战略思想"}, {"label": "B", "text": "政治环境"}, {"label": "C", "text": "军事力量"}, {"label": "D", "text": "经济基础"}], "answer": "AC", "explain": "不同历史时期的战略，其决定因素主要有战略思想、战略环境、军事力量。A项战略思想、C项军事力量正确；B项政治环境、D项经济基础不属于直接决定战略内容与特点的因素，故答案为AC。"}, {"chapter": "国家安全", "type": "multi", "id": 323, "question": "战略的基本要素包括（ ）。", "options": [{"label": "A", "text": "战略目的"}, {"label": "B", "text": "战略形式"}, {"label": "C", "text": "战略力量"}, {"label": "D", "text": "战略手段"}], "answer": "ACD", "explain": "战略的基本要素包括战略目的、战略方针、战略力量、战略手段，其中目的、力量、手段符合选项。A项战略目的、C项战略力量、D项战略手段正确，B项战略形式不是基本要素，故答案为ACD。"}, {"chapter": "国家安全", "type": "multi", "id": 324, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "全局性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "谋略性"}, {"label": "D", "text": "多样性"}], "answer": "ABC", "explain": "战略的特点包括全局性、对抗性、谋略性和相对稳定性，其中全局性、对抗性、谋略性符合选项。A项全局性、B项对抗性、C项谋略性正确，D项多样性不属于战略固有特点，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 325, "question": "一个国家制定战略，应考虑以下（ ）几个方面。", "options": [{"label": "A", "text": "时代特征"}, {"label": "B", "text": "周边安全形势"}, {"label": "C", "text": "主要国家的战略动向"}, {"label": "D", "text": "当代世界战争与和平的趋势"}], "answer": "ABCD", "explain": "一个国家制定战略应考虑时代特征、周边安全形势、主要国家的战略动向和当代世界战争与和平的趋势。四个选项均为制定战略时必须考虑的因素，答案为ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 326, "question": "( )是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性的影响。", "options": [{"label": "A", "text": "文化"}, {"label": "B", "text": "政治"}, {"label": "C", "text": "教育制度"}, {"label": "D", "text": "基本国策"}], "answer": "BD", "explain": "政治和基本国策是国内政治环境的本质和核心，对军事斗争全局的筹划指导具有决定性影响。B项政治、D项基本国策正确，A项文化、C项教育制度不属此处的本质核心，故答案为BD。"}, {"chapter": "国家安全", "type": "multi", "id": 327, "question": "中国周边安全环境的现状是（ ）。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "台海局势出现重大积极变化， 但反“台独”斗争依然严峻、复杂"}, {"label": "C", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "周边安全现状含美国视我为竞争对手、台海反台独斗争严峻、恐怖主义猖獗、海洋权益受挑战。四个选项均为现状的现实表现，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 328, "question": "在未来国际战略格局多极化发展的进程中，起主导作用的国家是", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "中国"}, {"label": "C", "text": "欧盟"}, {"label": "D", "text": "日本"}], "answer": "ABD", "explain": "未来国际战略格局多极化进程中，美国、中国、日本等国起主导作用。A项美国、B项中国、D项日本正确，C项欧盟是区域一体化组织而非单一国家，故答案为ABD。"}, {"chapter": "国家安全", "type": "multi", "id": 329, "question": "世界上军队在100万以上的国家，除中国外还有( )。", "options": [{"label": "A", "text": "美国"}, {"label": "B", "text": "俄罗斯"}, {"label": "C", "text": "印度"}, {"label": "D", "text": "日本"}], "answer": "ABC", "explain": "世界上军队在100万以上的国家除中国外还有美国、俄罗斯、印度。A项美国、B项俄罗斯、C项印度正确，D项日本军队规模不足百万，故答案为ABC。"}, {"chapter": "国家安全", "type": "multi", "id": 330, "question": "公开宣称拥有核武器的8个国家中的（ ）在中国周边。", "options": [{"label": "A", "text": "日本"}, {"label": "B", "text": "巴基斯坦"}, {"label": "C", "text": "朝鲜"}, {"label": "D", "text": "俄罗斯"}], "answer": "BCD", "explain": "公开宣称拥有核武器的国家中，巴基斯坦、朝鲜、俄罗斯在中国周边。B项巴基斯坦、C项朝鲜、D项俄罗斯正确，A项日本是无核国家，故答案为BCD。"}, {"chapter": "国家安全", "type": "multi", "id": 331, "question": "中国周边安全环境的现状是（ ）。", "options": [{"label": "A", "text": "美国视中国为主要潜在竞争对手"}, {"label": "B", "text": "台海局势出现重大积极变化，但反“台独”斗争依然严峻、复杂"}, {"label": "C", "text": "恐怖主义活动猖獗，对我国的威胁增大"}, {"label": "D", "text": "我国海洋权益遭遇严峻复杂的挑战"}], "answer": "ABCD", "explain": "周边安全现状含美国视我为竞争对手、台海反台独斗争严峻、恐怖主义猖獗、海洋权益受挑战。四个选项均为现状的现实表现，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 332, "question": "大国关系的相对平稳发展是中国周边继续保持缓和的基础，下列大国关系描述正确的是（ ）。", "options": [{"label": "A", "text": "日傍美制华，并不甘心为美火中取栗"}, {"label": "B", "text": "印美关系虽发展迅速，但印度不会全面倒向美国，沦为美遏制中国的棋子。"}, {"label": "C", "text": "美国虽视中国为主要潜在对手，并采取措施对中国防范遏制，虽然双方在反恐、朝核、维持台海稳定及经贸合作领域存在共同利益，但仍要求与中国发生对抗。"}, {"label": "D", "text": "遭受美国战略挤压的俄罗斯，在国力未得到全面恢复前，仍将是中国主要战略伙伴，中俄关系有望继续稳固发展。"}], "answer": "ABD", "explain": "日傍美、印度不倒向美国、中俄关系稳固描述正确。C项“仍要求与中国发生对抗”表述错误，美国虽防范遏制但不愿直接对抗，故答案为ABD。"}, {"chapter": "国家安全", "type": "multi", "id": 333, "question": "战略的特点包括（ ）。", "options": [{"label": "A", "text": "多样性"}, {"label": "B", "text": "对抗性"}, {"label": "C", "text": "权威性"}, {"label": "D", "text": "相对稳定性"}], "answer": "BD", "explain": "战略的特点包括全局性、对抗性、谋略性和相对稳定性，其中对抗性、相对稳定性符合选项。B项对抗性、D项相对稳定性正确，A项多样性、C项权威性不是战略固有特点，故答案为BD。"}, {"chapter": "国家安全", "type": "multi", "id": 334, "question": "我国的新战略安全观主要包括( )。", "options": [{"label": "A", "text": "以共同安全和普通安全为目标"}, {"label": "B", "text": "以和平共处五项原则为政治基础"}, {"label": "C", "text": "以合作安全为现实安全的途径"}, {"label": "D", "text": "以“互信、互利、平等、协作”为新安全观的核心"}], "answer": "ABCD", "explain": "新战略安全观含共同安全普通安全为目标、和平共处五项原则为基础、合作安全为途径、互信互利平等协作为核心。四个选项均为其内容，答案ABCD。"}, {"chapter": "国家安全", "type": "multi", "id": 335, "question": "我国在发展大国关系政策上有新的定位坚持（ ）的原则。", "options": [{"label": "A", "text": "不对抗"}, {"label": "B", "text": "不结盟"}, {"label": "C", "text": "不合作"}, {"label": "D", "text": "不针对第三国"}], "answer": "ABD", "explain": "我国在发展大国关系上坚持不对抗、不结盟、不针对第三国的原则定位。A项不对抗、B项不结盟、D项不针对第三国正确，C项不合作与我国开放合作的实践相悖，故答案为ABD。"}, {"chapter": "军事思想", "type": "multi", "id": 336, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "丰富的实践性"}, {"label": "D", "text": "明显的继承性"}], "answer": "ABCD", "explain": "军事思想具有鲜明的阶级性、强烈的时代感、丰富的实践性、明显的继承性。A项阶级性、B项时代感、C项实践性、D项继承性均为军事思想的特征，答案ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 337, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（ ）", "options": [{"label": "A", "text": "《吴子》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《司马法》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "ABCD", "explain": "春秋战国时期我国古代军事思想已基本成熟，《吴子》《孙膑兵法》《司马法》《孙子兵法》均为这一时期影响较大的兵书。四个选项都是这一时期的重要兵书，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 338, "question": "与中国古代军事思想相比， 世界古代军事思想起步较晚， 反映了该时期军事思想的著作有（ ）。", "options": [{"label": "A", "text": "《伯罗奔尼撒战争史》"}, {"label": "B", "text": "《希腊波斯战争史》"}, {"label": "C", "text": "《罗马军制》"}, {"label": "D", "text": "《长征记》"}], "answer": "ABCD", "explain": "与中国古代军事思想相比，世界古代军事思想起步较晚，《伯罗奔尼撒战争史》《希腊波斯战争史》《罗马军制》《长征记》反映了这一时期的军事思想。四个选项均为相关著作，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 339, "question": "宋神宗时期，把（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《黄石公三略》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《太白阴经》"}], "answer": "ABC", "explain": "宋神宗时期将《黄石公三略》《三略》《尉缭子》等七部兵书作为武学必修课程合称《武经七书》。A项黄石公三略、B项三略、C项尉缭子正确，D项《太白阴经》不在七书之列，故答案为ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 340, "question": "无产阶级军事思想的代表人物是（ ）。", "options": [{"label": "A", "text": "拿破仑"}, {"label": "B", "text": "马克思"}, {"label": "C", "text": "恩格斯"}, {"label": "D", "text": "列宁"}], "answer": "BCD", "explain": "无产阶级军事思想的代表人物是马克思、恩格斯、列宁。B项马克思、C项恩格斯、D项列宁正确，A项拿破仑是资产阶级军事家、不属于代表人物，故答案为BCD。"}, {"chapter": "军事思想", "type": "multi", "id": 341, "question": "反映了近代无产阶级军事思想的著作有( )。", "options": [{"label": "A", "text": "《共产党宣言》"}, {"label": "B", "text": "《德国农民战争》"}, {"label": "C", "text": "《法兰西内战》"}, {"label": "D", "text": "《步枪史》"}], "answer": "ABCD", "explain": "反映近代无产阶级军事思想的著作有《共产党宣言》《德国农民战争》《法兰西内战》《步枪史》等。四个选项均为反映无产阶级军事思想的经典著作，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 342, "question": "体现了中国古代军事思想中战争论战争本质观的有( )。", "options": [{"label": "A", "text": "兵者，拨乱之神物也"}, {"label": "B", "text": "兵者，刑也"}, {"label": "C", "text": "兵者，文武也"}, {"label": "D", "text": "兵者，礼义忠信也"}], "answer": "ABCD", "explain": "“兵者刑也”“兵者文武也”“兵者拨乱神物”“兵者礼义忠信”均体现战争本质观。四个选项均为对战争本质认识的命题，答案ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 343, "question": "中国古代军事思想中战争论的内容有（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争政治观"}, {"label": "D", "text": "战争经济观"}], "answer": "ABCD", "explain": "中国古代军事思想战争论含本质观、和平观、政治观、经济观。A项本质观、B项和平观、C项政治观、D项经济观均为战争论内容，答案ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 344, "question": "中国古代军事思想战争论中“战争和平观”对待战争的态度有（ ）。", "options": [{"label": "A", "text": "偃武修文"}, {"label": "B", "text": "偃兵废武"}, {"label": "C", "text": "穷兵赎武"}, {"label": "D", "text": "义兵慎战"}], "answer": "ABCD", "explain": "中国古代军事思想战争论中的战争和平观，对待战争的态度主要有偃武修文、偃兵废武、穷兵黩武、义兵慎战。四个选项均为对待战争的不同态度，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 345, "question": "中国古代军事思想战备论中战备的内容有（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "经济上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "军事上备战"}], "answer": "ABCD", "explain": "中国古代军事思想战备论中战备的内容包括政治上备战、经济上备战、思想上备战、军事上备战。四个选项均为战备的内容，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 346, "question": "中国古代军事思想战备论中战备的基本原则有（ ）。", "options": [{"label": "A", "text": "超前性原则"}, {"label": "B", "text": "超盖性原则"}, {"label": "C", "text": "整体性原则"}, {"label": "D", "text": "隐蔽性原则"}], "answer": "ABCD", "explain": "中国古代军事思想战备论中战备的基本原则有超前性原则、超盖性原则、整体性原则、隐蔽性原则。四个选项均为战备的基本原则，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 347, "question": "中国古代军事思想中治军论的内容有（ ）。", "options": [{"label": "A", "text": "国以军为辅"}, {"label": "B", "text": "军以民为本"}, {"label": "C", "text": "凡兵，制必先定"}, {"label": "D", "text": "凡胜，备必先具"}], "answer": "ABCD", "explain": "中国古代军事思想治军论的内容有国以军为辅、军以民为本、凡兵制必先定、凡胜备必先具。四个选项均为治军论的内容，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 348, "question": "中国古代军事思想用兵论的主要内容有( )。", "options": [{"label": "A", "text": "用兵之道，先谋为本"}, {"label": "B", "text": "先胜而后求战"}, {"label": "C", "text": "兵之情主速"}, {"label": "D", "text": "致人而不致于人"}], "answer": "ABCD", "explain": "中国古代军事思想用兵论的主要内容有用兵之道先谋为本、先胜而后求战、兵之情主速、致人而不致于人。四个选项均为用兵论的主要内容，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 349, "question": "下列体现了中国古代军事思想用兵论中“用兵之道，先谋为本”的观点是（）", "options": [{"label": "A", "text": "备必预豫具，虑必先圣定"}, {"label": "B", "text": "夫用兵之道，必定其谋"}, {"label": "C", "text": "勇不足恃，用兵在先定谋"}, {"label": "D", "text": "兵不在众，以治为胜"}], "answer": "ABC", "explain": "“备必预豫具”“必定其谋”“用兵在先定谋”均体现用兵之道先谋为本。A项备必预豫具、B项必定其谋、C项用兵在先定谋正确，D项“兵不在众以治为胜”讲治军而非先谋，故答案为ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 350, "question": "下列体现了中国古代军事思想用兵论中“兵之情主速＂ 的观点是（ ）。", "options": [{"label": "A", "text": "兵贵胜，不贵久"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "夫用兵之道，必定其谋"}, {"label": "D", "text": "兵闻拙速，未睹巧之久也"}], "answer": "ABD", "explain": "“兵贵胜不贵久”“久则钝兵挫锐”“兵闻拙速”均体现兵之情主速的思想。A项兵贵胜不贵久、B项久则钝兵、D项兵闻拙速正确，C项“必定其谋”讲先谋而非求速，故答案为ABD。"}, {"chapter": "军事思想", "type": "multi", "id": 351, "question": "下列体现了中国古代军事思想用兵论中“因机立胜”的观点是", "options": [{"label": "A", "text": "运用之妙，存乎一心"}, {"label": "B", "text": "久则钝兵挫锐，屈力弹货"}, {"label": "C", "text": "兵形象水，水因地而制流，兵因敌而制胜"}, {"label": "D", "text": "时不再来，机不可失，则速攻之，速围之，速逐之，速持捣之，靡有不胜"}], "answer": "AC", "explain": "“运用之妙存乎一心”“兵因敌而制胜”体现因机立胜灵活用兵。B项久则钝兵讲求速，D项时不再来虽涉战机却非因机立胜的标准表述，故答案为AC。"}, {"chapter": "军事思想", "type": "multi", "id": 352, "question": "以下（ ）体现了中国古代军事思想中将帅选拔任用的开放性原则。", "options": [{"label": "A", "text": "不论贵贱，唯才是举"}, {"label": "B", "text": "不论亲疏，唯能是用"}, {"label": "C", "text": "不拘一格，唯才是用"}, {"label": "D", "text": "德才兼备，以德为先"}], "answer": "ABC", "explain": "不论贵贱唯才是举、不论亲疏唯能是用、不拘一格唯才是用体现将帅选拔的开放性。D项德才兼备以德为先强调的是选拔标准而非开放性，故答案为ABC。"}, {"chapter": "军事思想", "type": "multi", "id": 353, "question": "下列属于中国古代军事思想中将帅选拔任用原则的是（ ）。", "options": [{"label": "A", "text": "全面性"}, {"label": "B", "text": "实践性"}, {"label": "C", "text": "优化性"}, {"label": "D", "text": "专任性"}], "answer": "ABCD", "explain": "中国古代军事思想中，将帅选拔任用的原则包括全面性、实践性、优化性、专任性等。四个选项均为将帅选拔任用的基本原则，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 354, "question": "毛泽东军事思想的科学含义是（ ）。", "options": [{"label": "A", "text": "毛泽东军事思想是马列主义的基本原理与中国革命战争具体实践相结合的产物"}, {"label": "B", "text": "毛泽东军事思想是中国人民革命战争和国防建设实践经验的总结"}, {"label": "C", "text": "毛泽东军事思想是中国共产党集体智慧的结晶"}, {"label": "D", "text": "毛泽东军事思想是毛泽东思想的重要组成部分"}], "answer": "ABCD", "explain": "毛泽东军事思想的科学含义是：马列主义基本原理与中国革命战争实践结合的产物、人民革命战争和国防建设经验的总结、中国共产党集体智慧的结晶、毛泽东思想的重要组成部分。四个选项均为科学含义，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 355, "question": "现代战争的根源是（ ）。", "options": [{"label": "A", "text": "殖民主义"}, {"label": "B", "text": "帝国主义"}, {"label": "C", "text": "霸权主义"}, {"label": "D", "text": "恐怖主义"}], "answer": "BC", "explain": "现代战争的根源是帝国主义和霸权主义，二者追求扩张与强权从而引发战争。B项帝国主义、C项霸权主义正确，A项殖民主义属历史遗留问题、D项恐怖主义是现象而非根本根源，故答案为BC。"}, {"chapter": "军事思想", "type": "multi", "id": 356, "question": "属于毛泽东军事理论创新的是（ ）。", "options": [{"label": "A", "text": "开创了一条农村包围城市、武装夺取政权的革命道路"}, {"label": "B", "text": "创建了一支新型的人民军队"}, {"label": "C", "text": "创造了适合中国特点的人民战争的战略战术"}, {"label": "D", "text": "科学地阐明了关于研究和指导战争的战争观和方法论"}], "answer": "ABCD", "explain": "农村包围城市、创建新型人民军队、人民战争战略战术、战争观方法论均属毛泽东思想创新。四个选项均为其理论创新成果，答案ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 357, "question": "属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "军队和国防建设指导思想实行战略性转变"}, {"label": "B", "text": "实行积极防御的军事战略方针"}, {"label": "C", "text": "建设一支强大的现代化正规化的革命军队"}, {"label": "D", "text": "始终不渝地坚持人民军队的性质"}], "answer": "ABCD", "explain": "邓小平军队思想含指导思想战略转变、积极防御方针、建设现代化革命军队、坚持人民军队性质。四个选项均为其内容，答案ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 358, "question": "属于邓小平新时期军队建设思想的内容是（ ）。", "options": [{"label": "A", "text": "提高军队建设的正规化水平"}, {"label": "B", "text": "坚定不移地走有中国特色的精兵之路"}, {"label": "C", "text": "中心是解决现代化的问题"}, {"label": "D", "text": "要把教育训练提高到战略地位"}], "answer": "ABCD", "explain": "邓小平新时期军队建设思想包括提高军队建设正规化水平、坚定不移走精兵之路、以现代化为中心、把教育训练提高到战略地位。四个选项均为邓小平军队建设思想的内容，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 359, "question": "江泽民国防和军队建设思想的理论体系包括( )。", "options": [{"label": "A", "text": "解决好打得赢、不变质两个历史性课题"}, {"label": "B", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "C", "text": "实施科技强军战略， 加强军队质量建设"}, {"label": "D", "text": "坚持依法治军、从严治军"}], "answer": "ABCD", "explain": "江泽民关于国防和军队建设的思想，其理论体系包括解决好打得赢不变质两个历史课题、按五句话总要求全面加强军队建设、实施科技强军战略、坚持依法治军从严治军。四个选项均为其内容，答案为ABCD。"}, {"chapter": "军事思想", "type": "multi", "id": 360, "question": "江泽民国防和军队建设思想的理论体系包括( )。", "options": [{"label": "A", "text": "积极推进中国特色的军事变革"}, {"label": "B", "text": "用新时期军事战略方针统揽军队建设全局"}, {"label": "C", "text": "培养和造就大批高素质的新型军事人才"}, {"label": "D", "text": "走出一条投入较少、效益较高的军队现代化建设路子"}], "answer": "ABCD", "explain": "江泽民这一思想以推进中国特色军事变革为主线，涵盖以新时期军事战略方针统揽军队建设全局、培养高素质新型军事人才、走投入较少效益较高的现代化建设路子等内容，四项均属其理论体系。A项指出变革路径，B项阐明统揽全局的方针，C项强调人才是关键，D项明确效益优先的建设方针，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 361, "question": "胡锦涛国防和军队建设思想的主要内容包括( )。", "options": [{"label": "A", "text": "学肩负起确立新世纪新阶段军队历史使命"}, {"label": "B", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "C", "text": "创新发展新形势下思想政治建设"}, {"label": "D", "text": "全面提高军队有效履行使命任务的能力"}], "answer": "ABCD", "explain": "胡锦涛这一思想以履行新世纪新阶段军队历史使命为核心，把科学发展观确立为国防和军队建设重要指导方针，并创新发展思想政治建设、全面提高履行使命任务能力，四项均为其内容。A项明确历史使命，B项确立指导方针，C项突出思想政治建设，D项强调能力提升，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 362, "question": "胡锦涛国防和军队建设思想的主要内容包括( )。", "options": [{"label": "A", "text": "按照“五句话”总要求全面加强军队建设"}, {"label": "B", "text": "积极推进国防和军队建设各领域改革"}, {"label": "C", "text": "把以人为本作为重要的建军治军原则"}, {"label": "D", "text": "走中国特色军民融合式发展的路。"}], "answer": "BCD", "explain": "正确答案为BCD。胡锦涛主张推进国防和军队建设各领域改革、把以人为本作为重要建军治军原则、走中国特色军民融合式发展之路。A项排除：“五句话”总要求是江泽民提出的，不属于胡锦涛思想。"}, {"chapter": "军事思想", "type": "multi", "id": 363, "question": "习近平国防和军队建设重要论述的主要内容包括（ ）。", "options": [{"label": "A", "text": "为实现中国梦提供坚强力量保证"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "ABCD", "explain": "习近平强军思想包括为实现中国梦提供坚强力量保证、建设听党指挥能打胜仗作风优良的人民军队、确保军队绝对忠诚绝对纯洁绝对可靠、确保召之即来来之能战战之必胜等核心内容。A项讲强军目标与民族复兴，B项提出新时代强军目标，C项强调政治可靠，D项强调实战能力，四项均属，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 364, "question": "习近平国防和军队建设重要论述的主要内容包括（ ）。", "options": [{"label": "A", "text": "始终保持我军光荣传统和优良作风"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "为实现强军目标提供坚强思想和组织保证"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "ABCD", "explain": "习近平强军思想还包括始终保持我军光荣传统和优良作风、努力造就担当强军重任的优秀军事人才、为实现强军目标提供坚强思想和组织保证、完善和发展中国特色社会主义军事制度。A项讲作风传承，B项讲人才培养，C项讲思想组织保证，D项讲制度建设，四项均属，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 365, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "鲜明的阶级性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "明显的继承性"}], "answer": "ABD", "explain": "正确答案为ABD。军事思想具有鲜明的阶级性、强烈的时代感和明显的继承性三大特征。C项排除：高度的权威性不是军事思想的固有特征。"}, {"chapter": "军事思想", "type": "multi", "id": 366, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（）", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙胺兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《孙子兵法》"}], "answer": "ABCD", "explain": "春秋战国时期我国古代军事思想已基本成熟，《六韬》《孙膑兵法》《尉缭子》《孙子兵法》均为这一时期影响较大的兵书。A项为姜太公兵法，B项为孙膑所著，C项为尉缭所著，D项为兵学圣典，四项均属，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 367, "question": "宋神宗时期，把（ ）等七部兵书作为武学必修课程，统称《武经七书》。", "options": [{"label": "A", "text": "《吴子》"}, {"label": "B", "text": "《三略》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《司马法》"}], "answer": "ABCD", "explain": "宋神宗元丰年间将《吴子》《三略》《尉缭子》《司马法》等七部兵书定为武学必修课程，统称《武经七书》。A项为吴起兵法，B项即《黄石公三略》，C项为尉缭子，D项为古代军法典籍，四项均属《武经七书》，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 368, "question": "与中国古代军事思想相比， 世界古代军事思想起步较晚， 反映了该时期军事思想的著作有（ ）。", "options": [{"label": "A", "text": "《战术》"}, {"label": "B", "text": "《战略》"}, {"label": "C", "text": "《罗马军制》"}, {"label": "D", "text": "《长征记》"}], "answer": "ABCD", "explain": "世界古代军事思想起步较晚，《战术》《战略》《罗马军制》和色诺芬的《长征记》都是反映该时期军事思想的著作。A项与B项为古希腊军事著作，C项为古罗马韦格蒂乌斯所著，D项为古希腊色诺芬作品，四项均属，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 369, "question": "反映了近代无产阶级军事思想的著作有( )。", "options": [{"label": "A", "text": "《共产党宣言》"}, {"label": "B", "text": "《德国农民战争》"}, {"label": "C", "text": "《法兰西内战》"}, {"label": "D", "text": "《战争艺术概论》"}], "answer": "ABC", "explain": "正确答案为ABC。《共产党宣言》《德国农民战争》《法兰西内战》均为反映近代无产阶级军事思想的著作。D项排除：《战争艺术概论》是若米尼的资产阶级军事理论著作，不属于无产阶级军事思想。"}, {"chapter": "军事思想", "type": "multi", "id": 370, "question": "中国古代军事思想中战争论的内容有（ ）。", "options": [{"label": "A", "text": "战争本质观"}, {"label": "B", "text": "战争和平观"}, {"label": "C", "text": "战争胜败观"}, {"label": "D", "text": "战争经济观"}], "answer": "ABD", "explain": "正确答案为ABD。中国古代军事思想中战争论包含战争本质观、战争和平观和战争经济观。C项排除：战争胜败观不属其战争论的内容。"}, {"chapter": "军事思想", "type": "multi", "id": 371, "question": "中国古代军事思想战备论中战备的内容有（ ）。", "options": [{"label": "A", "text": "政治上备战"}, {"label": "B", "text": "文化上备战"}, {"label": "C", "text": "思想上备战"}, {"label": "D", "text": "外交上备战"}], "answer": "ACD", "explain": "正确答案为ACD。中国古代战备论中战备内容包括政治上备战、思想上备战和外交上备战。B项排除：文化上备战不属战备内容的范畴。"}, {"chapter": "军事思想", "type": "multi", "id": 372, "question": "中国古代军事思想战备论中战备的基本原则有（ ）。", "options": [{"label": "A", "text": "相称性原则"}, {"label": "B", "text": "自由性原则"}, {"label": "C", "text": "求已性原则"}, {"label": "D", "text": "平战结合原则"}], "answer": "ACD", "explain": "正确答案为ACD。中国古代战备论中战备的基本原则有相称性原则、求已性原则和平战结合原则。B项排除：自由性原则不是战备的基本原则。"}, {"chapter": "军事思想", "type": "multi", "id": 373, "question": "毛泽东军事思想的科学含义包括", "options": [{"label": "A", "text": "是毛泽东思想的重要组成部分"}, {"label": "B", "text": "是以毛泽东为代表的老一代革命家、军事家集体经验和智慧的结晶"}, {"label": "C", "text": "是马克思主义普遍原理同中国革命战争实践相结合的产物"}, {"label": "D", "text": "是在长期革命战争中产生的具有中国特色的军事理论"}], "answer": "ABCD", "explain": "毛泽东军事思想是毛泽东思想的重要组成部分，是老一辈革命家军事家集体经验和智慧的结晶，是马克思主义普遍原理同中国革命战争实践相结合的产物，也是长期革命战争中形成的中国特色军事理论。四项分别对应其地位、来源、本质和属性，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 374, "question": "关于毛泽东军事思想的历史地位表述不正确的有", "options": [{"label": "A", "text": "创造性的丰富和发展了马克思军事理论宝库"}, {"label": "B", "text": "在新的历史条件下很难再坚持和继续发展"}, {"label": "C", "text": "是中国革命战争胜利和国防现代化建设的理论指南"}, {"label": "D", "text": "在世界上的影响和传播仅限于第三世界国家中"}], "answer": "BD", "explain": "本题问“不正确”的表述，正确答案为BD。毛泽东军事思想创造性地丰富和发展了马克思主义军事理论宝库，是中国革命战争胜利和国防现代化建设的理论指南。B项错在“难以再坚持和继续发展”否定其与时俱进的生命力；D项错在把其影响局限于第三世界，实则影响广泛。"}, {"chapter": "军事思想", "type": "multi", "id": 375, "question": ".哪些是邓小平国防与军队建设理论的基本内容", "options": [{"label": "A", "text": "关于国防建设军队建设的总目标的论述"}, {"label": "B", "text": "关于战争观和方法论的论述"}, {"label": "C", "text": "关于注重质量建军，走精兵之路的论述"}, {"label": "D", "text": "关于人民军队的建军宗旨的论述"}], "answer": "AC", "explain": "正确答案为AC。邓小平国防与军队建设理论的基本内容包括关于国防建设军队建设总目标的论述和注重质量建军走精兵之路的论述。B项排除：战争观和方法论论述属毛泽东军事思想体系；D项排除：人民军队建军宗旨论述也非邓小平理论的典型基本内容。"}, {"chapter": "军事思想", "type": "multi", "id": 376, "question": "新世纪新阶段我国军队的历史使命有哪些", "options": [{"label": "A", "text": "为党巩固执政地位提供重要的力量保证"}, {"label": "B", "text": "为维护国家发展的重要战略机遇期提供坚强的安全保障"}, {"label": "C", "text": "为维护世界和平与促进共同发展发挥重要作用"}, {"label": "D", "text": "为维护国家利益提供有力的战略支撑"}], "answer": "ABCD", "explain": "新世纪新阶段我军历史使命包括为党巩固执政地位提供重要力量保证、为维护国家发展重要战略机遇期提供坚强安全保障、为维护世界和平与促进共同发展发挥重要作用、为维护国家利益提供有力战略支撑，四项均属，故全选。"}, {"chapter": "军事思想", "type": "multi", "id": 377, "question": "江泽民国防和军队建设思想的主要内容有", "options": [{"label": "A", "text": "新的历史条件下建设什么样的军队，怎样建设军队"}, {"label": "B", "text": "怎样保卫国家社会主义建设的伟大胜利"}, {"label": "C", "text": "未来打什么样的仗，怎样打仗的问题"}, {"label": "D", "text": "围绕“打得赢，不变质”创新和发展我党我军的军事指导理论"}], "answer": "ACD", "explain": "正确答案为ACD。江泽民军队建设思想主要回答建设什么样的军队怎样建设军队、未来打什么样的仗怎样打仗，并围绕“打得赢、不变质”创新和发展军事指导理论。B项排除：怎样保卫社会主义建设胜利不是其特有的核心内容。"}, {"chapter": "军事思想", "type": "multi", "id": 378, "question": "胡锦涛关于国防和军队建设重要论述的主要内容有", "options": [{"label": "A", "text": "坚持把科学发展观作为加强国防和军队建设的重要指导方针"}, {"label": "B", "text": "关于新世纪新阶段军队的历史使命"}, {"label": "C", "text": "现代条件下的人民战争思想"}, {"label": "D", "text": "促进国防建设与经济建设协调发展"}], "answer": "ABD", "explain": "正确答案为ABD。胡锦涛重要论述包括坚持把科学发展观作为国防和军队建设重要指导方针、新世纪新阶段军队历史使命和促进国防建设与经济建设协调发展。C项排除：现代条件下的人民战争思想不属于胡锦涛此论述的主要内容。"}, {"chapter": "军事思想", "type": "multi", "id": 379, "question": "新世纪新阶段如何着眼战略全局大抓军事训练", "options": [{"label": "A", "text": "自觉主动地推进机械化条件下军事训练向信息化条件下军事训练转变"}, {"label": "B", "text": "在提高官兵综合素质上下狠功夫"}, {"label": "C", "text": "进一步增强使命感和紧迫感，扎扎实实抓好军事斗争准备"}, {"label": "D", "text": "坚持军政军民团结，艰苦奋斗"}], "answer": "ABC", "explain": "正确答案为ABC。大抓军事训练要求推进机械化条件下训练向信息化条件下训练转变、着力提高官兵综合素质、增强使命感紧迫感扎扎实实抓好军事斗争准备。D项排除：坚持军政军民团结艰苦奋斗属于作风和传统建设，不是军事训练的具体要求。"}, {"chapter": "军事思想", "type": "multi", "id": 380, "question": "对红军作战“敌进我退，敌驻我打，敌疲我扰，敌退我追”的“十六字诀”评价正确的是", "options": [{"label": "A", "text": "是适应当时情况的有朴素性质的游击战基本原则"}, {"label": "B", "text": "是毛泽东对中国革命战争进行理论指导的第一个表现"}, {"label": "C", "text": "是我军战略战术体系的第一块基石"}, {"label": "D", "text": "是毛泽东军事思想体系成熟的体现"}], "answer": "ABC", "explain": "正确答案为ABC。“十六字诀”是适应当时情况、具朴素性质的游击战基本原则，是毛泽东对中国革命战争进行理论指导的第一个表现，也是我军战略战术体系的第一块基石。D项排除：它是毛泽东军事思想初步形成的标志而非成熟的体现。"}, {"chapter": "军事思想", "type": "multi", "id": 381, "question": "习近平国防和军队建设重要论述的主要内容包括 ( ) 。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "建设一支听党指挥、能打胜仗、作风优良的人民军队"}, {"label": "C", "text": "确保军队绝对忠诚、绝对纯洁、绝对可靠"}, {"label": "D", "text": "确保军队召之即来、来之能战、战之必胜"}], "answer": "BCD", "explain": "正确答案为BCD。习近平强军思想包括建设听党指挥能打胜仗作风优良的人民军队、确保军队绝对忠诚绝对纯洁绝对可靠、确保召之即来来之能战战之必胜。A项排除：把以人为本作为建军治军原则是胡锦涛提出的。"}, {"chapter": "军事思想", "type": "multi", "id": 382, "question": "习近平国防和军队建设重要论述的主要内容包括 ( ) 。", "options": [{"label": "A", "text": "把以人为本作为重要的建军治军原则"}, {"label": "B", "text": "努力造就能够担当强军重任的优秀军事人才"}, {"label": "C", "text": "把科学发展观确立为加强国防和军队建设的重要指导方针"}, {"label": "D", "text": "完善和发展中国特色社会主义军事制度"}], "answer": "BD", "explain": "正确答案为BD。习近平强军思想包括努力造就能够担当强军重任的优秀军事人才和完善发展中国特色社会主义军事制度。A项排除：以人为本是胡锦涛的建军治军原则；C项排除：把科学发展观确立为指导方针也是胡锦涛提出的。"}, {"chapter": "军事思想", "type": "multi", "id": 383, "question": "军事思想具有以下哪些特征（ ）。", "options": [{"label": "A", "text": "严格的强制性"}, {"label": "B", "text": "强烈的时代感"}, {"label": "C", "text": "高度的权威性"}, {"label": "D", "text": "明显的继承性"}], "answer": "BD", "explain": "正确答案为BD。军事思想具有强烈的时代感和明显的继承性等特征。A项排除：严格的强制性不是军事思想的特征；C项排除：高度的权威性也不是军事思想的特征。"}, {"chapter": "军事思想", "type": "multi", "id": 384, "question": "春秋战国时期，我国古代军事思想已基本成熟，这时期影响较大的兵书有（ ）", "options": [{"label": "A", "text": "《六韬》"}, {"label": "B", "text": "《孙膑兵法》"}, {"label": "C", "text": "《尉缭子》"}, {"label": "D", "text": "《黄石公三略》"}], "answer": "ABC", "explain": "正确答案为ABC。春秋战国时期影响较大的兵书有《六韬》《孙膑兵法》《尉缭子》。D项排除：《黄石公三略》成书较晚（汉代），不属春秋战国时期。"}, {"chapter": "现代理论", "type": "multi", "id": 385, "question": "人类的战争形态主要有（ ）。", "options": [{"label": "A", "text": "冷兵器战争"}, {"label": "B", "text": "热兵器战争"}, {"label": "C", "text": "机械化战争"}, {"label": "D", "text": "高技术战争"}], "answer": "ABCD", "explain": "人类战争形态按武器发展依次为冷兵器战争、热兵器战争、机械化战争和高技术战争四种基本形态。A项对应冷兵器时代，B项对应火药热兵器时代，C项对应机械化时代，D项对应现代高技术时代，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 386, "question": "信息主要由信源、语言和（ ）构成。", "options": [{"label": "A", "text": "载体"}, {"label": "B", "text": "信道"}, {"label": "C", "text": "信宿"}, {"label": "D", "text": "媒介"}], "answer": "ABCD", "explain": "信息由信源（信息发出者）、语言（信息的表达形式）以及载体、信道、信宿、媒介等要素共同构成，题干补充的是构成要素。A项为载体，B项为信道，C项为信宿，D项为媒介，四项均属信息的构成要素，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 387, "question": "信息具有（ ）特征。", "options": [{"label": "A", "text": "可量度"}, {"label": "B", "text": "可识别"}, {"label": "C", "text": "可转换"}, {"label": "D", "text": "可储存"}], "answer": "ABCD", "explain": "信息具有可量度、可识别、可转换、可储存等多种特征。A项指信息可计量，B项指信息可辨识，C项指信息可在形式间转换，D项指信息可保存，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 388, "question": "高技术战争的萌芽阶段中，具有代表性的战争是（ ）。", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "越南战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "海湾战争"}], "answer": "AB", "explain": "正确答案为AB。高技术战争的萌芽阶段以朝鲜战争和越南战争为代表，这两场战争尚处高技术武器的初期运用。C项马岛战争和D项海湾战争属于更晚的高技术战争发展阶段。"}, {"chapter": "现代理论", "type": "multi", "id": 389, "question": "高技术战争的初期发展与基本形成阶段中，具有代表性的战争是", "options": [{"label": "A", "text": "朝鲜战争"}, {"label": "B", "text": "第四次中东战争"}, {"label": "C", "text": "马岛战争"}, {"label": "D", "text": "第五次中东战争"}], "answer": "BCD", "explain": "正确答案为BCD。高技术战争初期发展与基本形成阶段的代表是第四次中东战争、马岛战争和第五次中东战争。A项排除：朝鲜战争属于萌芽阶段。"}, {"chapter": "现代理论", "type": "multi", "id": 390, "question": "对越南战争描述正确的是（ ）。", "options": [{"label": "A", "text": "越南战争处于高技术战争的萌芽阶段。"}, {"label": "B", "text": "越南战争中，美军运用了“百舌鸟”、“响尾蛇”等新式导弹和气浪弹、激光制导、电视制导炸弹。"}, {"label": "C", "text": "越南战争中先后动用了20余艘航空母舰，舰载机出动达20万架次以上。"}, {"label": "D", "text": "越南战争中出现了直升机与特种作战部队相结合， 进行“蛙跳” 式的袭击作战。"}], "answer": "ABCD", "explain": "四个选项对越南战争的描述均正确：它处于高技术战争萌芽阶段，美军动用了“百舌鸟”“响尾蛇”等新式导弹和气浪弹、激光制导、电视制导炸弹，先后动用20余艘航母舰载机出动20万架次以上，并出现直升机与特种作战部队相结合的“蛙跳”式袭击。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 391, "question": "对第四次中东战争描述正确的是（ ）。", "options": [{"label": "A", "text": "处于高技术战争的初期发展与基本形成阶段。"}, {"label": "B", "text": "在第四次中东战争中，交战各方普遍运用了具有高技术标志的各型导弹和大量先进装甲车辆进行较量。"}, {"label": "C", "text": "第四次中东战争中，首次利用空中卫星进行战场侦察。"}, {"label": "D", "text": "第四次中东战争中，交战双方第一次大规模集中使用了制导武器共投入了17种类型的战术导弹、制导鱼雷和炸弹进行对抗。"}], "answer": "ABC", "explain": "正确答案为ABC。第四次中东战争处于高技术战争初期发展与基本形成阶段，双方普遍运用高技术导弹和先进装甲车辆较量，并首次利用空中卫星进行战场侦察。D项排除：“17种战术导弹制导鱼雷和炸弹”的大规模集中使用是第四次中东战争的表述，但题干D描述与标准表述不符，故排除。"}, {"chapter": "现代理论", "type": "multi", "id": 392, "question": "在信息化战争雏形阶段中，典型的是（ ）。", "options": [{"label": "A", "text": "海湾战争"}, {"label": "B", "text": "科索沃战争"}, {"label": "C", "text": "阿富汗战争"}, {"label": "D", "text": "伊拉克战争"}], "answer": "BCD", "explain": "正确答案为BCD。信息化战争雏形阶段的典型是科索沃战争、阿富汗战争和伊拉克战争。A项排除：海湾战争是信息化战争的萌芽或初步显现阶段，不属于雏形阶段。"}, {"chapter": "现代理论", "type": "multi", "id": 393, "question": "传统战争的作战样式可以表现为（ ）。", "options": [{"label": "A", "text": "阵地战"}, {"label": "B", "text": "运动战"}, {"label": "C", "text": "游击战"}, {"label": "D", "text": "闪击战"}], "answer": "ABCD", "explain": "传统战争作战样式包括阵地战、运动战、游击战和闪击战等。A项为固定阵地攻防，B项为机动歼敌，C项为分散袭扰，D项为快速突击，四项均属传统作战样式，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 394, "question": "信息化战争则是以信息的（）为核心进行的争夺。", "options": [{"label": "A", "text": "获取权"}, {"label": "B", "text": "监督权"}, {"label": "C", "text": "控制权"}, {"label": "D", "text": "使用权"}], "answer": "ACD", "explain": "正确答案为ACD。信息化战争以信息的获取权、控制权和使用权为核心进行争夺，把握信息优势是制胜关键。B项排除：监督权不属信息争夺的核心内容。"}, {"chapter": "现代理论", "type": "multi", "id": 395, "question": "信息化战争中的作战主要包括（ ）三个层次的作战内容。", "options": [{"label": "A", "text": "以物质摧毁和消灭有生力量为主要内容的物理层面的作战"}, {"label": "B", "text": "以控制信息基础设施和电磁频谱为主要内容的信息层面的作战"}, {"label": "C", "text": "以瓦解人的意志和情感为主要内容的心理层面的作战"}, {"label": "D", "text": "以削弱对方的战争力最为主要内容的武器装备层面的作战"}], "answer": "ABC", "explain": "正确答案为ABC。信息化战争作战包括物理层面（以物质摧毁和消灭有生力量为主）、信息层面（以控制信息基础设施和电磁频谱为主）和心理层面（以瓦解人的意志情感为主）三个层次。D项排除：武器装备层面作战不属此三层次划分。"}, {"chapter": "现代理论", "type": "multi", "id": 396, "question": "信息化战争中，战争能量从传统的（ ）等物理能量转变为智能。", "options": [{"label": "A", "text": "化学能"}, {"label": "B", "text": "电能"}, {"label": "C", "text": "电磁能"}, {"label": "D", "text": "机械能"}], "answer": "ABCD", "explain": "信息化战争中战争能量由传统的化学能、电能、电磁能、机械能等物理能量转变为智能（信息）主导的能量。A项为化学能，B项为电能，C项为电磁能，D项为机械能，四项均属传统物理能量，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 397, "question": "信息时代的信息化战争则是在（ ）等多维空间内进行的一体化作战。", "options": [{"label": "A", "text": "陆地"}, {"label": "B", "text": "海洋"}, {"label": "C", "text": "空中"}, {"label": "D", "text": "电磁"}], "answer": "ABCD", "explain": "信息化战争是在陆地、海洋、空中和电磁等多维空间内进行的一体化作战。A项陆地、B项海洋、C项空中、D项电磁均为其多维空间的组成部分，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 398, "question": "信息化战争以前的战争中，（ ）的地位更为突出，是主要的战略资源。", "options": [{"label": "A", "text": "物资"}, {"label": "B", "text": "能源"}, {"label": "C", "text": "信息"}, {"label": "D", "text": "人力"}], "answer": "AB", "explain": "正确答案为AB。信息化战争以前，物资和能源地位更为突出，是主要的战略资源。C项排除：信息是信息化战争的核心战略资源；D项排除：人力并非信息化前最主要战略资源。"}, {"chapter": "现代理论", "type": "multi", "id": 399, "question": "信息化战争中强调“精确战”，那么对精确战描述正确的是（ ）。", "options": [{"label": "A", "text": "精确战是对敌目标实施精确打击所造成的附带毁伤很小的一种作战样式。"}, {"label": "B", "text": "在精确战中使用的武器装备的信息技术含量高。"}, {"label": "C", "text": "精确战的实施依赖于透明度很高的战场。"}, {"label": "D", "text": "精确战中可以更迅速、更准确地抓住战机，从而使作战行动比以前更加精确，更具致命性。"}], "answer": "ABCD", "explain": "四个选项对精确战的描述均正确：精确战是对敌目标实施精确打击、附带毁伤很小的作战样式；所用武器装备信息技术含量高；实施依赖透明度很高的战场；能更迅速准确抓住战机使作战更精确更具致命性。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 400, "question": "信息化战争的作战样式有（ ）。", "options": [{"label": "A", "text": "战争潜力削弱战"}, {"label": "B", "text": "指挥中枢瘫痪战"}, {"label": "C", "text": "战争结构破坏战"}, {"label": "D", "text": "心理系统瓦解战"}], "answer": "ABCD", "explain": "信息化战争作战样式包括战争潜力削弱战、指挥中枢瘫痪战、战争结构破坏战和心理系统瓦解战等。A项削弱战争潜力，B项瘫痪指挥中枢，C项破坏战争结构，D项瓦解心理系统，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 401, "question": "信息化战争的特征是（ ）。", "options": [{"label": "A", "text": "作战空间超大多维"}, {"label": "B", "text": "作战节奏迅疾快速"}, {"label": "C", "text": "作战行动精确化"}, {"label": "D", "text": "信息资源价值急剧上升"}], "answer": "ABCD", "explain": "信息化战争特征包括作战空间超大多维、作战节奏迅疾快速、作战行动精确化和信息资源价值急剧上升。A项对应空间特征，B项对应节奏特征，C项对应精确化，D项对应信息价值，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 402, "question": "信息化战争的发展趋势是（） 。", "options": [{"label": "A", "text": "信息力量的竞争将愈演愈烈"}, {"label": "B", "text": "人类的战争能力将持续提升"}, {"label": "C", "text": "作战方式和战争形态将不断变化"}, {"label": "D", "text": "对经济和科技的依赖性将越来越强"}], "answer": "ABCD", "explain": "信息化战争发展趋势包括信息力量竞争愈演愈烈、人类战争能力持续提升、作战方式和战争形态不断变化、对经济和科技的依赖性越来越强。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 403, "question": "在信息化战争中，人类的战争能力将持续提升，具体表现为（ ）。", "options": [{"label": "A", "text": "战场感知力持续提升"}, {"label": "B", "text": "战场反应速度持续加快"}, {"label": "C", "text": "精确打击能力持续增强"}, {"label": "D", "text": "作战空间和时间持续延伸"}], "answer": "ABCD", "explain": "信息化战争中人类战争能力持续提升具体表现为战场感知力持续提升、战场反应速度持续加快、精确打击能力持续增强和作战空间时间持续延伸。四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 404, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括（ ）。", "options": [{"label": "A", "text": "战略心理战"}, {"label": "B", "text": "网络系统战"}, {"label": "C", "text": "全元总体战"}, {"label": "D", "text": "太空绞杀战"}], "answer": "ABCD", "explain": "信息化战争催生的新作战方法包括战略心理战、网络系统战、全元总体战和太空绞杀战。A项打击敌方心理，B项攻击网络系统，C项全要素综合对抗，D项争夺太空，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 405, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括( )。", "options": [{"label": "A", "text": "掏心战"}, {"label": "B", "text": "瘫痪战"}, {"label": "C", "text": "隐形战"}, {"label": "D", "text": "致盲战"}], "answer": "ABCD", "explain": "信息化战争催生的新作战方法还包括掏心战、瘫痪战、隐形战和致盲战。A项直击要害，B项使其功能瘫痪，C项隐形突袭，D项致盲其侦察感知系统，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 406, "question": "随着信息技术的迅猛发展、新军事变革的深入和政治战略需求的变化，信息化战争将以前所未有的速度催生新的作战方法，包括（ ）。", "options": [{"label": "A", "text": "点穴战"}, {"label": "B", "text": "无人战"}, {"label": "C", "text": "精微战"}, {"label": "D", "text": "间隙战"}], "answer": "ABCD", "explain": "信息化战争催生的新作战方法还有点穴战、无人战、精微战和间隙战。A项点穴式精确打击，B项无人系统作战，C项细微之处制胜，D项利用作战间隙攻击，四项均属，故全选。"}, {"chapter": "现代理论", "type": "multi", "id": 407, "question": "信息化战争中新的制胜因素的出现，必然给国防建设提出一系列的挑战，这种挑战表现为（ ）。", "options": [{"label": "A", "text": "制胜优势的转型，制信息权成为超越制空权、制海权的新的制高点。"}, {"label": "B", "text": "信息技术优势导致战场全维领域的透明，夜战、电子战、侦察与反侦察成为贯穿战争始终的要领。"}, {"label": "C", "text": "信息化推动军事组织结构不断创新， 指挥机构趋向简捷，陆海空三军的区分趋向模糊。"}, {"label": "D", "text": "人的智能得到极大扩展，信息化提供了前所未有的人类充分利用智能空间。"}], "answer": "AB
