<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库练习</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 8px 28px rgba(0,0,0,0.1);
  --radius: 16px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
}
.header-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
.main {
  flex: 1; max-width: 680px; margin: 0 auto; padding: 48px 20px 60px;
  width: 100%; display: flex; flex-direction: column; justify-content: center;
}
.hero { text-align: center; margin-bottom: 36px; }
.hero h1 { font-size: 26px; font-weight: 700; color: var(--primary); }
.hero p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }
.cards { display: flex; flex-direction: column; gap: 18px; }
.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; cursor: pointer; transition: all var(--transition);
  display: flex; align-items: center; gap: 20px; text-decoration: none; color: inherit;
}
.card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card:active { transform: scale(0.98); }
.card-icon {
  width: 60px; height: 60px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
}
.card-history .card-icon { background: #eef2fa; }
.card-military .card-icon { background: #eaf6ee; }
.card-cx .card-icon { background: #fdf3e3; }
.card-body { flex: 1; }
.card-body h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.card-body .desc { font-size: 13px; color: var(--text-secondary); }
.card-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.meta-tag {
  font-size: 11px; padding: 2px 10px; border-radius: 12px; font-weight: 500;
  background: #f0f3f9; color: var(--primary-light);
}
.card-military .meta-tag { background: #eaf6ee; color: #1b6d3f; }
.card-cx .meta-tag { background: #fdf3e3; color: #9c6b1f; }
.arrow { font-size: 22px; color: #c0c5ce; flex-shrink: 0; transition: all var(--transition); }
.card:hover .arrow { color: var(--primary-light); transform: translateX(3px); }
.footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-secondary); }
@media (max-width: 520px) {
  .card { padding: 22px 20px; gap: 14px; }
  .card-icon { width: 48px; height: 48px; font-size: 24px; border-radius: 12px; }
  .card-body h2 { font-size: 16px; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="header"><span class="header-title">题库练习</span></div>
<div class="main">
  <div class="hero">
    <h1>选择题库</h1>
    <p>刷题模式 · 测试模式 · 即时解析 · 断点续答</p>
  </div>
  <div class="cards">
    <a class="card card-history" href="./history.html">
      <div class="card-icon">📜</div>
      <div class="card-body">
        <h2>中国近现代史纲要</h2>
        <div class="desc">《中国近现代史纲要》复习题库（2025-2026-2）</div>
        <div class="card-meta">
          <span class="meta-tag">613 题</span>
          <span class="meta-tag">单选 308</span>
          <span class="meta-tag">多选 205</span>
          <span class="meta-tag">判断 100</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
    <a class="card card-military" href="./junshi.html">
      <div class="card-icon">🎖️</div>
      <div class="card-body">
        <h2>军事理论</h2>
        <div class="desc">军事理论课程复习题库</div>
        <div class="card-meta">
          <span class="meta-tag">720 题</span>
          <span class="meta-tag">单选 230</span>
          <span class="meta-tag">多选 240</span>
          <span class="meta-tag">判断 250</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
    <a class="card card-cx" href="./cx.html">
      <div class="card-icon">📐</div>
      <div class="card-body">
        <h2>工程制图</h2>
        <div class="desc">工程制图课程单选复习题库</div>
        <div class="card-meta">
          <span class="meta-tag">140 题</span>
          <span class="meta-tag">单选</span>
          <span class="meta-tag">测试40题</span>
          <span class="meta-tag">考点全覆盖</span>
        </div>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>
</div>
<div class="footer">答题进度自动保存在本机浏览器中</div>
</body>
</html>
