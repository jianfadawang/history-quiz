<title>中国近现代史纲要 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 260px; max-height: 340px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 12px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
.status-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: background var(--transition);
}
.status-item:hover { background: #f0f3f9; }
.status-item.done { color: var(--correct); }
.status-item.undone { color: var(--text-secondary); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.status-dot.done { background: var(--correct); }
.status-dot.undone { background: #d1d5db; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>

: "multi", "id": 25, "question": "中国革命的胜利，为实现（ ），实现中华民族伟大复兴，开辟了广阔道路。", "options": [{"label": "A", "text": "民族独立"}, {"label": "B", "text": "人民解放"}, {"label": "C", "text": "国家富强"}, {"label": "D", "text": "人民幸福"}], "answer": "CD"}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 1, "question": "抗战胜利后，国民党统治集团的根本目标是使中国恢复到战前的状态，继续走资本主义发展道路。", "answer": false}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 2, "question": "1946年6月26日，国民党进攻中原解放区，标志着全面内战爆发。", "answer": true}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 3, "question": "1947年6月，刘伯承、邓小平率军实施中央突破，千里跃进大别山，由此拉开人民解放战争战略进攻的序幕。", "answer": true}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 4, "question": "《中国土地法大纲》是中国共产党制定和颁布的第一个土地改革法令，为打败蒋介石、建立新中国的奠定了深厚的群众基础。", "answer": false}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 5, "question": "国统区第二条战线的形成和发展，表明不仅在军事战线上，而且在政治战线上，国民党都打了败仗。", "answer": true}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 6, "question": "中国各民主党派形成时的社会基础，主要是大资产阶级、民族资产阶级、城市小资产阶级以及同这些阶级相联系的知识分子和其他爱国分子。", "answer": false}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 7, "question": "抗战胜利后，某些民主党派的领导人曾经鼓吹的“中间路线”，实质上就是资产阶级共和国方案，是旧民主主义的道路。", "answer": true}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 8, "question": "解放战争时期的三大战役是指辽沈战役、平津战役和渡江战役。", "answer": false}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 9, "question": "1949年9月召开的人民政协决定以五星红旗为国旗、《义勇军进行曲》为国歌。", "answer": false}, {"chapter": "第七章 为建立新中国而奋斗", "type": "tf", "id": 10, "question": "中国革命胜利的根本原因在于中国共产党的领导。", "answer": true}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 1, "question": "1949年中华人民共和国成立，标志着中国进入了（ ）。", "options": [{"label": "A", "text": "社会主义社会"}, {"label": "B", "text": "新民主主义社会"}, {"label": "C", "text": "资本主义社会"}, {"label": "D", "text": "共产主义社会"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 2, "question": "1953年9月，彭德怀在一份报告中说，抗美援朝战争的胜利证明：西方侵略者几百年来只要在东方一个海岸上架起几尊大炮就可霸占一个国家的时代一去不复返了。这场战争的胜利（ ）。", "options": [{"label": "A", "text": "结束了西方列强霸权主义的历史"}, {"label": "B", "text": "打破了美国军队不可战胜的神话"}, {"label": "C", "text": "奠定了民族独立人民解放的基础"}, {"label": "D", "text": "赢得了近代以来中华民族反抗外敌入侵的第一次完全胜利"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 3, "question": "毛泽东提出：“在打倒地主阶级和官僚资产阶级以后，中国内部的主要矛盾即是工人阶级与民族资产阶级的矛盾，故不应再将民族资产阶级称为中间阶级。”毛泽东的这一论断发表于（ ）。", "options": [{"label": "A", "text": "新中国成立时"}, {"label": "B", "text": "社会主义改造基本完成后"}, {"label": "C", "text": "民主革命遗留任务完成时"}, {"label": "D", "text": "党的七届三中全会召开前夕"}], "answer": "C"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 4, "question": "新中国成立初期，除了人民解放军在前线的胜利之外，中央人民政府为人民所作的最大一件工作是（ ）。", "options": [{"label": "A", "text": "镇压反革命"}, {"label": "B", "text": "稳定物价和统一财政工作"}, {"label": "C", "text": "“三反”运动"}, {"label": "D", "text": "“五反”运动"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 5, "question": "朝鲜战争爆发后，美国实施哪项政策公然干涉中国内政？（ ）。", "options": [{"label": "A", "text": "宣布武装援助南朝鲜（韩国）"}, {"label": "B", "text": "命令驻日本的美国远东空军协助韩国作战"}, {"label": "C", "text": "授意日本向朝鲜战场秘密派出扫雷部队"}, {"label": "D", "text": "派遣第七舰队侵入台湾海峡"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 6, "question": "没收（ ）归人民的国家所有，是新民主主义革命的三大经济纲领之一，是《共同纲领》规定的一项历史任务。", "options": [{"label": "A", "text": "官僚资本"}, {"label": "B", "text": "地主土地"}, {"label": "C", "text": "资本家土地"}, {"label": "D", "text": "一切公用土地"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 7, "question": "（ ）是国家独立富强的首要条件。", "options": [{"label": "A", "text": "农业改造"}, {"label": "B", "text": "社会主义工业化"}, {"label": "C", "text": "社会主义现代化"}, {"label": "D", "text": "手工业改造"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 8, "question": "中国共产党制定的过渡时期总路线的主体是（ ）。", "options": [{"label": "A", "text": "实现国家对个体农业的社会主义改造"}, {"label": "B", "text": "实现国家对个体手工业的社会主义改造"}, {"label": "C", "text": "实现国家对资本主义工商业的社会主义改造"}, {"label": "D", "text": "实现国家的社会主义工业化"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 9, "question": "所谓农业合作化，就是在中国共产党领导下，通过各种互助合作的方式，把以生产资料私有制为基础的个体农业经济，改造为以生产资料公有制为基础的农业合作经济的过程。1953年到1956年我国实行农业合作化的主要原因是（ ）。", "options": [{"label": "A", "text": "封建土地制度严重阻碍生产力的发展"}, {"label": "B", "text": "按苏联模式建设社会主义"}, {"label": "C", "text": "小农经济难以满足国民经济发展的需要"}, {"label": "D", "text": "一些领导人片面强调公有化的作用"}], "answer": "C"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 10, "question": "对资产阶级实行赎买，是（ ）提出的设想。", "options": [{"label": "A", "text": "马克思、恩格斯"}, {"label": "B", "text": "列宁"}, {"label": "C", "text": "毛泽东"}, {"label": "D", "text": "斯大林"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 11, "question": "新中国成立后，毛泽东多次发表讲话，强调实现国家工业化的重要性，他曾说：\"没有工业，便没有巩固的国防，便没有人民的福利，便没有国家的富强。\"与此同时，毛泽东也清醒地认识到实现国家工业化并不是一蹴而就的，而是需要一定的条件，其中，保证工业发展、实现国家工业化的一个必要条件是（ ）。", "options": [{"label": "A", "text": "比较强大的国营经济力量"}, {"label": "B", "text": "国家资本主义经济有一定程度的发展"}, {"label": "C", "text": "社会主义性质的国营经济力量相对来说比较强大"}, {"label": "D", "text": "对个体农业进行社会主义改造"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 12, "question": "对资本主义工商业进行社会主义改造，实行的是（ ）。", "options": [{"label": "A", "text": "和平赎买政策"}, {"label": "B", "text": "没收政策"}, {"label": "C", "text": "改造政策"}, {"label": "D", "text": "统购统销政策"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 13, "question": "我国进入社会主义社会的最主要标志是（ ）。", "options": [{"label": "A", "text": "社会主义改造的完成"}, {"label": "B", "text": "发展国民经济第一个五年计划的制定"}, {"label": "C", "text": "第一届全国人民代表大会的召开"}, {"label": "D", "text": "中华人民共和国的成立"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 14, "question": "1954年9月，中华人民共和国第一届全国人民代表大会第一次会议讨论通过了（ ）。", "options": [{"label": "A", "text": "《中国人民政治协商会议共同纲领》"}, {"label": "B", "text": "《中国民主同盟一届三中全会宣言》"}, {"label": "C", "text": "《中国土地法大纲》"}, {"label": "D", "text": "《中华人民共和国宪法》"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 15, "question": "中华人民共和国成立、社会主义制度的建立（ ）。", "options": [{"label": "A", "text": "是中华民族有史以来最为广泛而深刻的社会变革"}, {"label": "B", "text": "成功开创了中国特色社会主义"}, {"label": "C", "text": "中华民族迎来了从富起来到强起来的伟大飞跃"}, {"label": "D", "text": "是决定当代中国前途命运的关键一招"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 16, "question": "我国最早成立的民族自治区是（ ）。", "options": [{"label": "A", "text": "新疆维吾尔自治区"}, {"label": "B", "text": "内蒙古自治区"}, {"label": "C", "text": "广西壮族自治区"}, {"label": "D", "text": "宁夏回族自治区"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 17, "question": "1956年4月，毛泽东提出把马克思列宁主义基本原理同中国具体实际进行“第二次结合”，其目的是（ ）。", "options": [{"label": "A", "text": "找出在中国怎样建设社会主义的道路"}, {"label": "B", "text": "加强中国共产党的自身建设"}, {"label": "C", "text": "为社会主义改造创造条件"}, {"label": "D", "text": "全面建设社会主义现代化强国"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 18, "question": "1954年中华人民共和国第一届全国人民代表大会讨论通过了《中华人民共和国宪法》，标志着（ ）制度这一新中国根本政治制度从此确立。", "options": [{"label": "A", "text": "政治协商"}, {"label": "B", "text": "民族区域自治"}, {"label": "C", "text": "人民代表大会"}, {"label": "D", "text": "无产阶级专政"}], "answer": "C"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 19, "question": "中共八大指出，社会主义改造基本完成后我国国内的主要矛盾是（ ）。", "options": [{"label": "A", "text": "社会主义道路和资本主义道路的矛盾"}, {"label": "B", "text": "无产阶级和资产阶级的矛盾"}, {"label": "C", "text": "社会主义工业化与小农经济的矛盾"}, {"label": "D", "text": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 20, "question": "1956年，中国共产党第八次全国代表大会在北京开幕，会议明确了全党全国人民的主要任务是（ ）。", "options": [{"label": "A", "text": "建立社会主义制度"}, {"label": "B", "text": "发展生产力"}, {"label": "C", "text": "加强党的建设"}, {"label": "D", "text": "阶级斗争"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 21, "question": "以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志是（ ）。", "options": [{"label": "A", "text": "《论十大关系》的报告"}, {"label": "B", "text": "中共八大路线的制定"}, {"label": "C", "text": "《关于正确处理人民内部矛盾的问题》的发表"}, {"label": "D", "text": "《论人民民主专政》"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 22, "question": "新中国的工业化是在苏联的影响下起步的。走中国工业化道路，是中国共产党初步探索我国社会主义建设道路的一个重要思想。当时所讲的工业化道路问题，主要是指（ ）。", "options": [{"label": "A", "text": "中央和地方的关系问题"}, {"label": "B", "text": "经济建设和国防建设的关系问题"}, {"label": "C", "text": "重工业、轻工业和农业的发展关系问题"}, {"label": "D", "text": "沿海工业和内地工业的关系问题"}], "answer": "C"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 23, "question": "1956年4月初，毛泽东提出，最重要的是要（ ），把马列主义的基本原理同中国革命和建设的具体实际相结合。", "options": [{"label": "A", "text": "独立思考"}, {"label": "B", "text": "艰苦奋斗"}, {"label": "C", "text": "戒骄戒躁"}, {"label": "D", "text": "改革开放"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 24, "question": "毛泽东指出，社会主义社会的基本矛盾是（ ）。", "options": [{"label": "A", "text": "人民对于建立先进的工业国的要求同落后的农业国现实之间的矛盾"}, {"label": "B", "text": "无产阶级和资产阶级的矛盾"}, {"label": "C", "text": "人民内部矛盾"}, {"label": "D", "text": "生产力与生产关系、经济基础与上层建筑之间的矛盾"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 25, "question": "1964年底，周恩来在三届全国人大一次会议上郑重提出“四个现代化”的历史任务，即“在不太长的历史时期内，把我国建设成为一个具有（ ）的社会主义强国，赶上和超过世界先进水平”。", "options": [{"label": "A", "text": "现代农业、现代工业、现代经济和现代交通运输业"}, {"label": "B", "text": "现代农业、现代工业、现代国防和现代科学技术"}, {"label": "C", "text": "现代农业、现代工业、现代国防和现代科学文化"}, {"label": "D", "text": "现代农业、现代工业、现代科学文化和现代交通运输业"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 26, "question": "“文化大革命”结束的标志是（ ）。", "options": [{"label": "A", "text": "粉碎林彪反革命集团"}, {"label": "B", "text": "《评新编历史剧<海瑞罢官>》发表"}, {"label": "C", "text": "毛泽东逝世"}, {"label": "D", "text": "粉碎“四人帮”"}], "answer": "D"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 27, "question": "人民公社化运动对我国国民经济造成严重伤害，其错误的实质是（ ）。", "options": [{"label": "A", "text": "破坏正常的市场秩序"}, {"label": "B", "text": "生产关系的调整脱离了生产力的实际水平"}, {"label": "C", "text": "影响人民生活水平的提升"}, {"label": "D", "text": "没有注意到生态环境的保护"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 28, "question": "20世纪70年代初，毛泽东、周恩来抓住时机在中美关系上发起了（ ）。", "options": [{"label": "A", "text": "排球外交"}, {"label": "B", "text": "围棋外交"}, {"label": "C", "text": "乒乓外交"}, {"label": "D", "text": "篮球外交"}], "answer": "C"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 29, "question": "1958年社会主义建设总路线的缺点是（ ）。", "options": [{"label": "A", "text": "反应了人民迫切要求改变落后状况的愿望"}, {"label": "B", "text": "忽视客观经济规律"}, {"label": "C", "text": "提出了多快好省的说法"}, {"label": "D", "text": "强调了发展速度"}], "answer": "B"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "single", "id": 30, "question": "1961年1月，中共召开八届九中全会。全会决定了从1961年起在两三年内对国民经济实行的方针，这是党在经济工作指导方针上的重大转变。中共八届九中全会决定对国民经济实行的方针是（ ）。", "options": [{"label": "A", "text": "调整、巩固、充实、提高"}, {"label": "B", "text": "以农业为基础、以工业为主导"}, {"label": "C", "text": "在综合平衡中稳步前进"}, {"label": "D", "text": "既反保守又反冒进"}], "answer": "A"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 1, "question": "新民主主义社会的基本矛盾是（ ）。", "options": [{"label": "A", "text": "国际上是新中国同帝国主义的矛盾"}, {"label": "B", "text": "封建主义和人民大众的矛盾"}, {"label": "C", "text": "国内是工人阶级和资产阶级的矛盾"}, {"label": "D", "text": "帝国主义和封建主义的矛盾"}], "answer": "AC"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 2, "question": "开始掌握历史主动的中国人民，是中国人民志愿军的坚强后盾。主要表现包括（ )。", "options": [{"label": "A", "text": "全国各地开展波澜壮阔的抗美援朝运动"}, {"label": "B", "text": "成千上万中华儿女报名参加志愿军"}, {"label": "C", "text": "全国上下发起增加生产、厉行节约、爱国丰产等运动"}, {"label": "D", "text": "社会各界踊跃捐款"}], "answer": "ABCD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 3, "question": "新中国成立伊始，面临许多严重困难和紧迫问题，包括（ ）。", "options": [{"label": "A", "text": "能不能保卫住革命胜利成果，巩固新生人民政权"}, {"label": "B", "text": "能不能战胜严重经济困难，迅速恢复和发展国民经济"}, {"label": "C", "text": "能不能巩固民族独立，维护国家主权和安全"}, {"label": "D", "text": "能不能经受住全国执政的新考验，继续保持优良传统和作风"}], "answer": "ABCD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 4, "question": "新中国成立伊始，以美国为首的西方资本主义阵营企图通过实行（ ）的政策，从根本上搞垮新中国。", "options": [{"label": "A", "text": "文化渗透"}, {"label": "B", "text": "政治孤立"}, {"label": "C", "text": "经济封锁"}, {"label": "D", "text": "军事包围"}], "answer": "BCD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 5, "question": "1953年，对党在过渡时期的总路线有一种通俗的解释：“好比一只鸟，它要有一个主体，这就是发展社会主义工业；它又要有一双翅膀……”这双“翅膀”是（ ）。", "options": [{"label": "A", "text": "没收官僚资本主义工矿企业"}, {"label": "B", "text": "对资本主义工商业的社会主义改造"}, {"label": "C", "text": "对手工业的社会主义改造"}, {"label": "D", "text": "对农业的社会主义改造"}], "answer": "BCD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 6, "question": "对个体农业、手工业和资本主义工商业进行社会主义改造，是为了（ ）。", "options": [{"label": "A", "text": "确立社会主义生产关系"}, {"label": "B", "text": "健全社会主义上层建筑"}, {"label": "C", "text": "继续解放和发展生产力"}, {"label": "D", "text": "为实现社会主义工业化创造必要条件"}], "answer": "ACD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 7, "question": "如果不引导个体农民走合作化道路，农业生产力会受到很大限制，农村也不可能为工业化提供必要的（ ）等条件。", "options": [{"label": "A", "text": "商品粮食"}, {"label": "B", "text": "轻工业原料"}, {"label": "C", "text": "工业品市场"}, {"label": "D", "text": "工业发展所需的资金"}], "answer": "ABCD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 8, "question": "1953年国家规定，个别企业的公私合营中，其利润分配依照\"四马分肥\"的方式，即将利润分为国家所得税、企业公积金、工人福利费、资方股息红利四个方面进行分配，其中具有社会主义性质的部分是（ ）。", "options": [{"label": "A", "text": "工人福利费"}, {"label": "B", "text": "股息红利"}, {"label": "C", "text": "国家所得税"}, {"label": "D", "text": "企业公积金"}], "answer": "ACD"}, {"chapter": "第八章 中华人民共和国的成立与中国社会主义建设道路的探索", "type": "multi", "id": 9, "question": "随着社会主义改造的完成，以（ ）为特征的社会主义经济制度建立起来。", "options": [{"label": "A", "text": "生产资料公有制"}, {"label": "B", "text": "按劳分配"}, {"label": "C", "text": "计划经济体制"}, {"label": "D", "text": "按资分配"}], "answer": "ABC"}, {"chapter": "第八章 中华人民共和国 var mode = null, subMode = null, currentQuestions = [], currentIndex = 0;

function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function getGlobalIdx(q) {
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    if (ALL_QUESTIONS[i].chapter === q.chapter && ALL_QUESTIONS[i].type === q.type && ALL_QUESTIONS[i].id === q.id) return i;
  }
  return -1;
}

function loadPracticeDone() {
  try { var d = localStorage.getItem('history_quiz_done'); practiceDone = d ? JSON.parse(d) : {}; } catch(e) { practiceDone = {}; }
}
function savePracticeDone() {
  try { localStorage.setItem('history_quiz_done', JSON.stringify(practiceDone)); } catch(e) {}
}
function isDone(q) { return !!practiceDone[getGlobalIdx(q)]; }
function markDone(q) { practiceDone[getGlobalIdx(q)] = true; savePracticeDone(); }

function renderHeader() {
  var el = document.getElementById('headerRight');
  if (!mode || currentQuestions.length === 0) { el.innerHTML = ''; return; }
  var total = currentQuestions.length;
  var answered = Object.keys(userAnswers).length;
  var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
  var html = '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-text">' + answered + '/' + total + '</span></div>';
  if (mode === 'practice') {
    html += '<div style="position:relative"><button class="status-btn" id="statusBtn">📋</button><div class="status-panel" id="statusPanel"></div></div>';
  }
  el.innerHTML = html;
  if (mode === 'practice') {
    document.getElementById('statusBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      var panel = document.getElementById('statusPanel');
      renderStatusPanel();
      panel.classList.toggle('show');
    });
    document.addEventListener('click', function() { var p = document.getElementById('statusPanel'); if (p) p.classList.remove('show'); });
  }
}

function renderStatusPanel() {
  var el = document.getElementById('statusPanel'); if (!el) return;
  var doneCount = currentQuestions.filter(function(q) { return isDone(q); }).length;
  var total = currentQuestions.length;
  var html = '<h4>完成状态（' + doneCount + '/' + total + '）</h4>';
  currentQuestions.forEach(function(q, i) {
    var d = isDone(q);
    html += '<div class="status-item ' + (d ? 'done' : 'undone') + '" data-idx="' + i + '"><span>第 ' + (i + 1) + ' 题</span><span class="status-dot ' + (d ? 'done' : 'undone') + '"></span></div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.status-item').forEach(function(item) {
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      currentIndex = parseInt(item.dataset.idx);
      renderQuiz();
      el.classList.remove('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderMain() {
  var el = document.getElementById('main');
  if (!mode) { renderModeSelect(el); }
  else if (currentQuestions.length === 0) { renderSubModeSelect(el); }

}

      subMode = card.dataset.sub;
      currentQuestions = ALL_QUESTIONS.filter(function(q) { return q.type === subMode; });
      currentIndex = 0; userAnswers = {}; showFeedback = {};
      renderMain();
    });
  });
}

function startTest() {
  var singles = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; })).slice(0, 20);
  var multis = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; })).slice(0, 20);
  var tfs = shuffle(ALL_QUESTIONS.filter(function(q) { return q.type === 'tf'; })).slice(0, 10);
  currentQuestions = singles.concat(multis).concat(tfs);
  currentIndex = 0; userAnswers = {}; showFeedback = {};
  renderMain();
}

function renderQuiz() {
  var el = document.getElementById('main');
  var total = currentQuestions.length;
  if (currentIndex >= total) { renderResult(el); renderHeader(); return; }
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  var typeLabel = { single: '单选题', multi: '多选题', tf: '判断题' }[q.type];
  var hasAnswered = showFeedback[currentIndex];
  var userAns = userAnswers[currentIndex];
  var optionsHtml = '';
  if (q.type === 'tf') {
    var labels = ['对', '错'];
    optionsHtml = '<div class="tf-options">';
    labels.forEach(function(label, i) {
      var cls = 'tf-option';
      if (hasAnswered) cls += ' disabled';
      if (userAns !== undefined && ((userAns === true && i === 0) || (userAns === false && i === 1))) cls += ' selected';
      if (hasAnswered) {
        if (q.answer === (i === 0)) cls += ' correct';
        if (userAns !== undefined && (userAns === (i === 0)) && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-answer="' + (i === 0) + '">' + label + '</div>';
    });
    optionsHtml += '</div>';
  } else if (q.type === 'multi') {
    optionsHtml = (hasAnswered ? '' : '<div class="multi-hint">可多选，选择后点击确认</div>') + '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      var selected = userAns && userAns.indexOf(opt.label) !== -1;
      if (selected) cls += ' selected';
      if (hasAnswered) {
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (selected && q.answer.indexOf(opt.label) === -1) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  } else {
    optionsHtml = '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      if (userAns === opt.label) cls += ' selected';
      if (hasAnswered) {
        if (opt.label === q.answer) cls += ' correct';
        if (userAns === opt.label && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  }

  var feedbackHtml = '';
  if (hasAnswered) {
    var isMulti = q.type === 'multi';
    var userDisplay, correctDisplay, isCorrect;
    if (isMulti) {
      userDisplay = userAns ? userAns.split('').sort().join('') : '未作答';
      correctDisplay = q.answer;
      isCorrect = (userAns || '').split('').sort().join('') === q.answer;
    } else if (q.type === 'tf') {
      userDisplay = userAns === true ? '对' : userAns === false ? '错' : '未作答';
      correctDisplay = q.answer === true ? '对' : '错';
      isCorrect = userAns === q.answer;
    } else {
      userDisplay = userAns || '未作答';
      correctDisplay = q.answer;
      isCorrect = userAns === q.answer;
    }
    feedbackHtml = '<div class="feedback show ' + (isCorrect ? 'correct' : 'incorrect') + '">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误，正确答案是 <strong>' + correctDisplay + '</strong>') + '</div>';
  }

  el.innerHTML = '<div class="quiz-header"><div class="quiz-info"><span>' + typeLabel + '</span> · 第 <span>' + qNum + '</span>/<span>' + total + '</span> 题' + (mode === 'test' ? '' : '<span class="chapter-tag">' + q.chapter + '</span>') + '</div></div><div class="question-card"><div class="question-num">第 ' + qNum + ' 题</div><div class="question-text">' + q.question + '</div>' + optionsHtml + feedbackHtml + '</div><div class="nav-btns">' + (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>') + (hasAnswered ? '<button class="btn btn-primary" id="nextBtn">' + (currentIndex < total - 1 ? '下一题' : '查看结果') + '</button>' : (q.type !== 'multi' ? '<button class="btn btn-outline btn-sm" id="skipBtn" style="flex:0;margin-left:auto">跳过</button>' : '')) + (!hasAnswered && q.type === 'multi' ? '<button class="btn btn-primary" id="confirmBtn" style="flex:1">确认答案</button>' : '') + '</div>';

  if (!hasAnswered) {
    if (q.type === 'single') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.label;
          showFeedback[currentIndex] = true;
          if (mode === 'practice') markDone(q);
          renderQuiz(); renderHeader();
        });
      });
    } else if (q.type === 'multi') {
      if (!userAnswers[currentIndex]) userAnswers[currentIndex] = '';
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          var label = opt.dataset.label;
          var sel = userAnswers[currentIndex] || '';
          userAnswers[currentIndex] = sel.indexOf(label) !== -1 ? sel.replace(label, '') : sel + label;
          renderQuiz();
        });
      });
      var cb = el.querySelector('#confirmBtn');
      if (cb) cb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader();
      });
    } else if (q.type === 'tf') {
      el.querySelectorAll('.tf-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.answer === 'true';
          showFeedback[currentIndex] = true;
          if (mode === 'practice') markDone(q);
          renderQuiz(); renderHeader();
        });
      });
    }
    var sb = el.querySelector('#skipBtn');
    if (sb) sb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  }

  var pb = el.querySelector('#prevBtn');
  if (pb) pb.addEventListener('click', function() { currentIndex--; renderQuiz(); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var nb = el.querySelector('#nextBtn');
  if (nb) nb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function renderResult(el) {
  var total = currentQuestions.length;
  var correct = 0, singleTotal = 0, singleCorrect = 0, multiTotal = 0, multiCorrect = 0, tfTotal = 0, tfCorrect = 0;
  var wrongIdx = [];
  currentQuestions.forEach(function(q, i) {
    var ua = userAnswers[i], isCorrect;
    if (q.type === 'multi') { isCorrect = (ua || '').split('').sort().join('') === q.answer; }
    else { isCorrect = ua === q.answer; }
    if (isCorrect) correct++; else wrongIdx.push(i);
    if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
    else if (q.type === 'multi') { multiTotal++; if (isCorrect) multiCorrect++; }
    else { tfTotal++; if (isCorrect) tfCorrect++; }
  });
  var score = mode === 'test' ? correct * 2 : correct;
  var maxScore = mode === 'test' ? total * 2 : total;
  var pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  var gridHtml = '';
  if (singleTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + singleCorrect + '/' + singleTotal + '</div><div class="label">单选题</div></div>';
  if (multiTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + multiCorrect + '/' + multiTotal + '</div><div class="label">多选题</div></div>';
  if (tfTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + tfCorrect + '/' + tfTotal + '</div><div class="label">判断题</div></div>';

  el.innerHTML = '<div class="result-card"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">' + (mode === 'test' ? '测试完成' : '章节完成') + '</div><div class="result-score">' + score + '<span style="font-size:18px;color:var(--text-secondary);font-weight:400"> / ' + maxScore + '</span></div><div class="result-detail">正确率 ' + pct + '% · 共 ' + total + ' 题，答对 ' + correct + ' 题</div><div class="result-grid">' + gridHtml + '</div><div style="display:flex;gap:10px"><button class="btn btn-outline" id="reviewBtn" style="flex:1">查看错题 (' + wrongIdx.length + ')</button><button class="btn btn-primary" id="restartBtn" style="flex:1">' + (mode === 'test' ? '重新测试' : '返回') + '</button></div></div>';

  el.querySelector('#restartBtn').addEventListener('click', function() {
    if (mode === 'test') { currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; startTest(); }
    else { mode = null; subMode = null; currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; renderMain(); }
  });
  el.querySelector('#reviewBtn').addEventListener('click', function() {
    if (wrongIdx.length === 0) { alert('全部正确，没有错题！'); return; }
    currentIndex = wrongIdx[0];
    renderQuiz(); renderHeader();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

loadPracticeDone();
renderMain();
</script>
</body>
