<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程制图 · 题库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f8fa; --surface: #ffffff; --border: #e6e8ec;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --primary: #1e3a5f; --primary-light: #2d5a9e;
  --accent: #b8944c;
  --correct: #1b6d3f; --correct-bg: #e6f4ec;
  --incorrect: #c0392b; --incorrect-bg: #fdecea;
  --shadow: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px; --transition: 0.2s ease;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 28px; height: 56px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 30px; height: 30px; background: var(--primary); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 14px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary-light); border-radius: 3px; transition: width var(--transition); }
.progress-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.status-btn {
  width: 34px; height: 34px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all var(--transition); position: relative;
}
.status-btn:hover { border-color: var(--primary-light); background: #f0f3f9; }
.status-panel {
  position: absolute; top: 42px; right: 0; width: 300px; max-height: 380px;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 16px; display: none; z-index: 200;
}
.status-panel.show { display: block; }
.status-panel h4 { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-weight: 500; }
.status-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.status-circle {
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  border: 1.5px solid #d1d5db;
  color: var(--text-secondary);
  background: var(--surface);
}
.status-circle:hover { transform: scale(1.15); border-color: var(--primary-light); }
.status-circle.done { background: var(--correct); color: #fff; border-color: var(--correct); }
.status-circle.current { border-color: var(--primary); border-width: 2.5px; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer; display: none; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text-secondary);
  transition: all var(--transition); flex-shrink: 0;
}
.back-btn:hover { border-color: var(--primary-light); color: var(--primary); background: #f0f3f9; }
.back-btn.visible { display: flex; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  text-align: center; box-shadow: var(--shadow-md); max-width: 320px; width: 90%;
}
.confirm-dialog p { font-size: 14px; margin-bottom: 16px; color: var(--text); }
.confirm-dialog .btns { display: flex; gap: 10px; }
.confirm-dialog .btns .btn { flex: 1; }
.main { max-width: 760px; margin: 0 auto; padding: 36px 20px 80px; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
.mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 28px 24px; cursor: pointer; transition: all var(--transition); text-align: center;
}
.mode-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mode-card.selected { border-color: var(--primary); background: #f5f7fc; }
.mode-card .icon { font-size: 28px; margin-bottom: 8px; }
.mode-card h3 { font-size: 17px; margin-bottom: 4px; font-weight: 600; }
.mode-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.sub-mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.sub-mode-card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  padding: 18px 12px; cursor: pointer; text-align: center; transition: all var(--transition);
  font-size: 14px; font-weight: 500;
}
.sub-mode-card:hover { border-color: var(--primary-light); }
.sub-mode-card.selected { border-color: var(--primary); background: #f5f7fc; color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all var(--transition); border: none; font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--primary-light); box-shadow: var(--shadow-md); }
.btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover { background: #f5f7fc; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.quiz-info { font-size: 13px; color: var(--text-secondary); }
.quiz-info span { font-weight: 600; color: var(--text); }
.question-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 30px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.question-num { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.question-text { font-size: 16px; font-weight: 500; line-height: 1.75; }
.options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.option {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition); font-size: 14px; line-height: 1.5;
}
.option:hover { border-color: var(--primary-light); background: #fafbfd; }
.option.selected { border-color: var(--primary); background: #eef2fa; }
.option.correct { border-color: var(--correct); background: var(--correct-bg); }
.option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
.option.disabled { pointer-events: none; }
.option-letter {
  width: 26px; height: 26px; border-radius: 50%; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: var(--primary); color: #fff; }
.option.correct .option-letter { background: var(--correct); color: #fff; }
.option.incorrect .option-letter { background: var(--incorrect); color: #fff; }
.multi-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.feedback { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 14px; font-size: 14px; font-weight: 500; display: none; }
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); }
.feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }
.explain-box {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 10px;
  background: #f0f3f9; font-size: 13.5px; line-height: 1.65; color: var(--text);
}
.explain-label {
  flex-shrink: 0; background: var(--primary-light); color: #fff;
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
}
.nav-btns { display: flex; gap: 10px; margin-top: 16px; }
.nav-btns .btn { flex: 1; }
.result-card { background: var(--surface); border-radius: var(--radius); padding: 44px 36px; text-align: center; box-shadow: var(--shadow); }
.result-score { font-size: 56px; font-weight: 700; color: var(--primary); }
.result-detail { font-size: 14px; color: var(--text-secondary); margin: 10px 0 24px; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.result-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; }
.result-stat .num { font-size: 22px; font-weight: 700; }
.result-stat .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.chapter-tag { display: inline-block; padding: 1px 8px; background: #f0f3f9; color: var(--primary-light); border-radius: 10px; font-size: 11px; margin-left: 8px; }
.page-title { text-align: center; margin-bottom: 24px; }
.page-title h2 { font-size: 20px; font-weight: 700; }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 600px) {
  .mode-grid { grid-template-columns: 1fr; }
  .sub-mode-grid { grid-template-columns: 1fr; }
  .header { padding: 0 14px; }
  .main { padding: 20px 12px 60px; }
  .question-card { padding: 20px 18px; }
  .progress-bar { width: 80px; }
  .result-grid { grid-template-columns: 1fr 1fr 1fr; }
}
</style>
</head>

var SITE_CONFIG = {"storagePrefix": "cx_quiz_v1", "siteName": "工程制图", "subModes": ["single"], "testCounts": {"single": 40, "multi": 0, "tf": 0}, "testSelection": "coverage"};

var mode = null, subMode = null, currentQuestions = [], currentIndex = 0;
var userAnswers = {}, showFeedback = {}, practiceDone = {};
var sessionKey = 'history_quiz_session';
var sessionDoneKey = 'history_quiz_done';

if (typeof SITE_CONFIG === 'object' && SITE_CONFIG.storagePrefix) {
  sessionKey = SITE_CONFIG.storagePrefix + '_session';
  sessionDoneKey = SITE_CONFIG.storagePrefix + '_done';
}

function shuffle(a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }

function persistSession() {
  try {
    if (mode && currentQuestions.length > 0) {
      localStorage.setItem(sessionKey, JSON.stringify({
        mode: mode, subMode: subMode,
        questions: currentQuestions,
        index: currentIndex,
        answers: userAnswers,
        feedback: showFeedback
      }));
    } else {
      localStorage.removeItem(sessionKey);
    }
  } catch(e) {}
}

function resumeSession() {
  try {
    var raw = localStorage.getItem(sessionKey);
    if (!raw) return false;
    var s = JSON.parse(raw);
    if (!s || !s.questions || !s.questions.length) return false;
    mode = s.mode || null; subMode = s.subMode || null;
    currentQuestions = s.questions; currentIndex = s.index || 0;
    userAnswers = s.answers || {}; showFeedback = s.feedback || {};
    if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
    return true;
  } catch(e) { return false; }
}

function getGlobalIdx(q) {
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    if (ALL_QUESTIONS[i].chapter === q.chapter && ALL_QUESTIONS[i].type === q.type && ALL_QUESTIONS[i].id === q.id) return i;
  }
  return -1;
}

function loadPracticeDone() {
  try { var d = localStorage.getItem(sessionDoneKey); practiceDone = d ? JSON.parse(d) : {}; } catch(e) { practiceDone = {}; }
}
function savePracticeDone() {
  try { localStorage.setItem(sessionDoneKey, JSON.stringify(practiceDone)); } catch(e) {}
}
function isDone(q) { return !!practiceDone[getGlobalIdx(q)]; }
function markDone(q) { practiceDone[getGlobalIdx(q)] = true; savePracticeDone(); }

function goBack() {
  if (Object.keys(userAnswers).length === 0) {
    doGoBack();
    return;
  }
  var overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = '<div class="confirm-dialog"><p>确定要返回吗？<br>当前答题进度将丢失。</p><div class="btns"><button class="btn btn-outline btn-sm" id="confirmCancel">取消</button><button class="btn btn-primary btn-sm" id="confirmOk" style="background:#c0392b">确认返回</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#confirmCancel').addEventListener('click', function() { overlay.remove(); });
  overlay.querySelector('#confirmOk').addEventListener('click', function() { overlay.remove(); doGoBack(); });
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function doGoBack() {
  if (mode === 'practice' && subMode) {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  } else if (mode === 'test') {
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    mode = null;
    persistSession();
    renderMain();
  } else {
    mode = null; subMode = null;
    currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0;
    persistSession();
    renderMain();
  }
}

  var backBtn = document.getElementById('headerBackBtn');

  var el = document.getElementById('statusPanel'); if (!el) return;
  var total = currentQuestions.length;
  var doneCount = 0;
  var html = '<h4>完成状态（<span id="statusDoneCount">0</span>/' + total + '）<br><span style="font-weight:400;font-size:11px">绿色=已答 灰色=未答 蓝色框=当前</span></h4><div class="status-grid">';
  currentQuestions.forEach(function(q, i) {

    cardsHtml += '<div class="sub-mode-card" data-sub="' + s + '">' + labels[s] + '<br><span style="font-size:12px;color:var(--text-secondary);font-weight:400">' + counts[s] + ' 题</span></div>';
  });
  el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px"><button class="btn btn-outline btn-sm" id="backBtn">← 返回</button><h2 style="font-weight:600;font-size:17px">刷题模式 · 选择题型</h2></div><div class="sub-mode-grid">' + cardsHtml + '</div>';
  el.querySelector('#backBtn').addEventListener('click', function() { mode = null; persistSession(); renderMain(); });
  el.querySelectorAll('.sub-mode-card').forEach(function(card) {
    card.addEventListener('click', function() {
      subMode = card.dataset.sub;
      currentQuestions = ALL_QUESTIONS.filter(function(q) { return q.type === subMode; });
      currentIndex = 0; userAnswers = {}; showFeedback = {};
      persistSession();
      renderMain();
    });
  });
}

function coveragePick(pool, n) {
  var byK = {};
  pool.forEach(function(q) {
    var k = q.kpoint || '其他';
    (byK[k] = byK[k] || []).push(q);
  });
  var keys = shuffle(Object.keys(byK));
  var picked = [];
  var pickedSet = {};
  function markPicked(q) { picked.push(q); pickedSet[q.id + '_' + q.chapter] = true; }
  keys.forEach(function(k) {
    var arr = shuffle(byK[k]);
    arr.sort(function(a, b) { return (b.hot || 0) - (a.hot || 0); });
    if (arr.length) markPicked(arr[0]);
  });
  if (picked.length > n) picked = picked.slice(0, n);
  var rest = shuffle(pool.filter(function(q) { return !pickedSet[q.id + '_' + q.chapter]; }));
  rest.sort(function(a, b) { return (b.hot || 0) - (a.hot || 0); });
  picked = picked.concat(rest.slice(0, n - picked.length));
  return shuffle(picked);
}

function startTest() {
  var tc = (SITE_CONFIG && SITE_CONFIG.testCounts) || { single: 20, multi: 20, tf: 10 };
  var singlesPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'single'; });
  var multisPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'multi'; });
  var tfsPool = ALL_QUESTIONS.filter(function(q) { return q.type === 'tf'; });
  var useCoverage = SITE_CONFIG && SITE_CONFIG.testSelection === 'coverage';
  var singles = useCoverage ? coveragePick(singlesPool, tc.single || 0) : shuffle(singlesPool).slice(0, tc.single || 0);
  var multis = shuffle(multisPool).slice(0, tc.multi || 0);
  var tfs = shuffle(tfsPool).slice(0, tc.tf || 0);
  currentQuestions = singles.concat(multis).concat(tfs);
  currentIndex = 0; userAnswers = {}; showFeedback = {};
  persistSession();
  renderMain();
}

function renderQuiz() {
  var el = document.getElementById('main');
  var total = currentQuestions.length;
  if (currentIndex >= total) { renderResult(el); renderHeader(); return; }
  var q = currentQuestions[currentIndex];
  var qNum = currentIndex + 1;
  var typeLabel = { single: '单选题', multi: '多选题', tf: '判断题' }[q.type];
  var hasAnswered = showFeedback[currentIndex];
  var userAns = userAnswers[currentIndex];
  var optionsHtml = '';
  if (q.type === 'tf') {
    var tfLabels = ['对', '错'];
    var tfLetters = ['A', 'B'];
    optionsHtml = '<div class="options">';
    tfLabels.forEach(function(label, i) {
      var cls = 'option';
      var ansVal = i === 0;
      if (hasAnswered) cls += ' disabled';
      if (userAns !== undefined && userAns === ansVal) cls += ' selected';
      if (hasAnswered) {
        if (q.answer === ansVal) cls += ' correct';
        if (userAns !== undefined && userAns === ansVal && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-answer="' + ansVal + '"><span class="option-letter">' + tfLetters[i] + '</span><span>' + label + '</span></div>';
    });
    optionsHtml += '</div>';
  } else if (q.type === 'multi') {
    optionsHtml = (hasAnswered ? '' : '<div class="multi-hint">可多选，选择后点击确认</div>') + '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      var selected = userAns && userAns.indexOf(opt.label) !== -1;
      if (selected) cls += ' selected';
      if (hasAnswered) {
        if (q.answer.indexOf(opt.label) !== -1) cls += ' correct';
        if (selected && q.answer.indexOf(opt.label) === -1) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  } else {
    optionsHtml = '<div class="options">';
    q.options.forEach(function(opt) {
      var cls = 'option'; if (hasAnswered) cls += ' disabled';
      if (userAns === opt.label) cls += ' selected';
      if (hasAnswered) {
        if (opt.label === q.answer) cls += ' correct';
        if (userAns === opt.label && userAns !== q.answer) cls += ' incorrect';
      }
      optionsHtml += '<div class="' + cls + '" data-label="' + opt.label + '"><span class="option-letter">' + opt.label + '</span><span>' + opt.text + '</span></div>';
    });
    optionsHtml += '</div>';
  }

  var feedbackHtml = '';
  if (hasAnswered) {
    var isMulti = q.type === 'multi';
    var userDisplay, correctDisplay, isCorrect;
    if (isMulti) {
      userDisplay = userAns ? userAns.split('').sort().join('') : '未作答';
      correctDisplay = q.answer;
      isCorrect = (userAns || '').split('').sort().join('') === q.answer;
    } else if (q.type === 'tf') {
      userDisplay = userAns === true ? '对' : userAns === false ? '错' : '未作答';
      correctDisplay = q.answer === true ? '对' : '错';
      isCorrect = userAns === q.answer;
    } else {
      userDisplay = userAns || '未作答';
      correctDisplay = q.answer;
      isCorrect = userAns === q.answer;
    }
    feedbackHtml = '<div class="feedback show ' + (isCorrect ? 'correct' : 'incorrect') + '">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误，正确答案是 <strong>' + correctDisplay + '</strong>') + '</div>';
    if (q.explain) {
      feedbackHtml += '<div class="explain-box"><span class="explain-label">解析</span><span class="explain-text">' + q.explain + '</span></div>';
    }
  }

  var navHtml = '';
  var isLast = (currentIndex >= total - 1);
  if (hasAnswered) {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    navHtml += '<button class="btn btn-primary" id="nextBtn">' + (isLast ? '查看结果' : '下一题') + '</button>';
  } else {
    navHtml += (currentIndex > 0 ? '<button class="btn btn-outline" id="prevBtn">上一题</button>' : '<div></div>');
    if (q.type === 'multi') {
      var mSel = userAnswers[currentIndex];
      var mDisabled = (!mSel || mSel === '');
      navHtml += '<button class="btn btn-primary" id="confirmBtn" style="flex:1;' + (mDisabled ? 'opacity:.45;pointer-events:none' : '') + '">确认答案</button>';
    } else {
      var cSel = userAnswers[currentIndex];
      var cDisabled = (cSel === undefined || cSel === '');
      var confStyle = 'flex:1;' + (cDisabled ? 'opacity:.45;pointer-events:none' : '');
      if (mode === 'test' && isLast) {
        navHtml += '<button class="btn btn-primary" id="submitTestBtn" style="flex:1;background:#c0392b">提交</button>';
        navHtml += '<button class="btn btn-primary" id="confirmBtn" style="' + confStyle + '">确认</button>';
      } else {
        navHtml += '<button class="btn btn-outline" id="skipBtn">下一题</button>';
        navHtml += '<button class="btn btn-primary" id="confirmBtn" style="' + confStyle + '">确认</button>';
      }
    }
  }

  el.innerHTML = '<div class="quiz-header"><div class="quiz-info"><span>' + typeLabel + '</span> · 第 <span>' + qNum + '</span>/<span>' + total + '</span> 题' + (mode === 'test' ? '' : '<span class="chapter-tag">' + q.chapter + '</span>') + '</div></div><div class="question-card"><div class="question-num">第 ' + qNum + ' 题</div><div class="question-text">' + q.question + '</div>' + optionsHtml + feedbackHtml + '</div><div class="nav-btns">' + navHtml + '</div>';

  if (!hasAnswered) {
    if (q.type === 'single') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.label;
          renderQuiz(); persistSession();
        });
      });
      var scb = el.querySelector('#confirmBtn');
      if (scb) scb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    } else if (q.type === 'multi') {
      if (!userAnswers[currentIndex]) userAnswers[currentIndex] = '';
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          var label = opt.dataset.label;
          var sel = userAnswers[currentIndex] || '';
          userAnswers[currentIndex] = sel.indexOf(label) !== -1 ? sel.replace(label, '') : sel + label;
          renderQuiz(); persistSession();
        });
      });
      var cb = el.querySelector('#confirmBtn');
      if (cb) cb.addEventListener('click', function() {
        if (!userAnswers[currentIndex]) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    } else if (q.type === 'tf') {
      el.querySelectorAll('.option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          userAnswers[currentIndex] = opt.dataset.answer === 'true';
          renderQuiz(); persistSession();
        });
      });
      var tcb = el.querySelector('#confirmBtn');
      if (tcb) tcb.addEventListener('click', function() {
        if (userAnswers[currentIndex] === undefined) return;
        showFeedback[currentIndex] = true;
        if (mode === 'practice') markDone(q);
        renderQuiz(); renderHeader(); persistSession();
      });
    }
    var sb = el.querySelector('#skipBtn');
    if (sb) sb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var stb = el.querySelector('#submitTestBtn');
    if (stb) stb.addEventListener('click', function() {
      var ok = confirm('确定要提交吗？未作答的题目将计为错误。');
      if (ok) { renderResult(el); renderHeader(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  }

  var pb = el.querySelector('#prevBtn');
  if (pb) pb.addEventListener('click', function() { currentIndex--; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  var nb = el.querySelector('#nextBtn');
  if (nb) nb.addEventListener('click', function() { currentIndex++; renderQuiz(); renderHeader(); persistSession(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function renderResult(el) {
  var total = currentQuestions.length;
  var correct = 0, singleTotal = 0, singleCorrect = 0, multiTotal = 0, multiCorrect = 0, tfTotal = 0, tfCorrect = 0;
  var wrongIdx = [];
  currentQuestions.forEach(function(q, i) {
    var ua = userAnswers[i], isCorrect;
    if (q.type === 'multi') { isCorrect = (ua || '').split('').sort().join('') === q.answer; }
    else { isCorrect = ua === q.answer; }
    if (isCorrect) correct++; else wrongIdx.push(i);
    if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
    else if (q.type === 'multi') { multiTotal++; if (isCorrect) multiCorrect++; }
    else { tfTotal++; if (isCorrect) tfCorrect++; }
  });
  var score = mode === 'test' ? correct * 2 : correct;
  var maxScore = mode === 'test' ? total * 2 : total;
  var pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  var gridHtml = '';
  if (singleTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + singleCorrect + '/' + singleTotal + '</div><div class="label">单选题</div></div>';
  if (multiTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + multiCorrect + '/' + multiTotal + '</div><div class="label">多选题</div></div>';
  if (tfTotal > 0) gridHtml += '<div class="result-stat"><div class="num">' + tfCorrect + '/' + tfTotal + '</div><div class="label">判断题</div></div>';

  el.innerHTML = '<div class="result-card"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px">' + (mode === 'test' ? '测试完成' : '章节完成') + '</div><div class="result-score">' + score + '<span style="font-size:18px;color:var(--text-secondary);font-weight:400"> / ' + maxScore + '</span></div><div class="result-detail">正确率 ' + pct + '% · 共 ' + total + ' 题，答对 ' + correct + ' 题</div><div class="result-grid">' + gridHtml + '</div><div style="display:flex;gap:10px"><button class="btn btn-outline" id="reviewBtn" style="flex:1">查看错题 (' + wrongIdx.length + ')</button><button class="btn btn-primary" id="restartBtn" style="flex:1">' + (mode === 'test' ? '重新测试' : '返回') + '</button></div></div>';

  el.querySelector('#restartBtn').addEventListener('click', function() {
    if (mode === 'test') { currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; startTest(); }
    else { mode = null; subMode = null; currentQuestions = []; userAnswers = {}; showFeedback = {}; currentIndex = 0; persistSession(); renderMain(); }
  });
  el.querySelector('#reviewBtn').addEventListener('click', function() {
    if (wrongIdx.length === 0) { alert('全部正确，没有错题！'); return; }
    currentIndex = wrongIdx[0];
    renderQuiz(); renderHeader(); persistSession();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

loadPracticeDone();
document.getElementById('headerBackBtn').addEventListener('click', goBack);

function renderResumeBanner() {
  var main = document.getElementById('main');
  if (!main) return;
  var banner = document.createElement('div');
  banner.style.cssText = 'background:#eef2fa;border:1px solid #2d5a9e;color:#1e3a5f;padding:12px 16px;border-radius:8px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap';
  banner.innerHTML = '<span>检测到上次的答题进度：第 <strong id="resumeIdx"></strong> 题（共 ' + currentQuestions.length + ' 题）</span><span style="display:flex;gap:8px"><button id="resumeBtn" style="background:#1e3a5f;color:#fff;border:none;border-radius:6px;padding:6px 16px;font-size:13px;cursor:pointer;font-weight:600">继续答题</button><button id="discardBtn" style="background:#fff;color:#6b7280;border:1px solid #d1d5db;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer">放弃进度</button></span>';
  main.insertBefore(banner, main.firstChild);
  document.getElementById('resumeIdx').textContent = currentIndex + 1;
  document.getElementById('resumeBtn').addEventListener('click', function() { renderMain(); });
  document.getElementById('discardBtn').addEventListener('click', function() {
    mode = null; subMode = null; currentQuestions = []; currentIndex = 0;
    userAnswers = {}; showFeedback = {};
    persistSession();
    renderMain();
  });
}

function startApp() {
  if (resumeSession()) {
    renderModeSelect(document.getElementById('main'));
    renderResumeBanner();
  } else {
    renderMain();
  }
}

window.addEventListener('beforeunload', persistSession);

startApp();
</script>
</body>
